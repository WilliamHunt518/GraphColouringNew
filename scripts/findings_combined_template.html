    para(s, `<b>A style is detectable, and it is not just reliance.</b> The nearest match is the same person ${A.hitsAB} times in `
      + `${FP.n} (${A.hitsBA} the other way round), against about once by chance (${pv(A.pHit)}, 10,000 shuffles of who is who). `
      + `Removing the reliance axis from every profile leaves the match rate where it was (${B.hitsAB} of ${FP.n}, ${pv(B.pHit)}), `
      + `while reliance on its own matches only ${RO.hitsAB}. So operators carry a recognisable <b>combination</b> of habits from `
      + `one session to the next — how often they press Suggest, whether they keep its plan, whether they edit cards, how long `
      + `they deliberate. But it is a <b>fingerprint, not a type</b>: it tells individuals apart well above chance without sorting `
      + `them into groups, and for most people their own session is a near neighbour rather than the nearest.`);
    const cm = card(s, 'Style map: each dot is a session, each line joins one operator’s two sessions');
    const MAP = { mode: 'tsne', run: 'both', scen: 'both' };
    const groups = [
      ['mode', 'Map', [['tsne', 't-SNE (neighbourhoods)'], ['pca', 'PCA (reliance across)']]],
      ['run', 'Session', [['both', 'Both'], ['1', 'Session 1'], ['2', 'Session 2']]],
      ['scen', 'Scenario', [['both', 'Both'], ['strategic', 'Strategic Heavy'], ['tactical', 'Tactical Heavy']]],
    ];
    const rowsEl = groups.map(([key, lab, opts]) => {
      const bar = h('div', { class: 'btnrow' }, cm);
      h('span', { class: 'btnlab', text: lab }, bar);
      opts.forEach(([v, t]) => { const b = h('button', { text: t }, bar); b.dataset.k = key; b.dataset.v = v;
                                 b.onclick = () => { MAP[key] = v; draw(); }; });
      return bar;
    });
    const host = h('div', { class: 'chart' }, cm);
    const status = h('p', { class: 'cap' }, cm);
    const draw = () => {
      const keep = p => (MAP.run === 'both' || String(p.run) === MAP.run)
        && (MAP.scen === 'both' || p.game.split('|')[0] === MAP.scen);
      styleMap(host, FP.points, MAP.mode, keep);
      rowsEl.forEach(bar => bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', MAP[b.dataset.k] === b.dataset.v)));
      const n = FP.points.filter(keep).length;
      status.innerHTML = `Showing <b>${n}</b> of ${FP.points.length} sessions.` + (MAP.run !== 'both' || MAP.scen !== 'both'
        ? ' Each operator played one session of each scenario, so filtering to one session or one scenario leaves one dot per '
          + 'person and no joining lines. The map itself was drawn from all sessions; filtering only hides dots.' : '');
    };
    draw();
    legend(cm, [{ label: 'low reliance', color: css('--s-tac') }, { label: 'high reliance', color: css('--s-strat') },
                { label: '● session 1   ■ session 2', color: 'transparent' }]);
    h('p', { class: 'cap', html: `Short lines mean an operator behaved alike in both sessions. On the t-SNE map a person’s two `
      + `sessions sit at about <b>${pct(FP.mapPairRatio, 0)}</b> of the typical distance between different people. t-SNE only keeps `
      + `neighbourhoods, so its distances and axes mean nothing on their own — the map is a picture of the test above, not the `
      + `test. Hover a dot for the person’s profile. Behaviours: ${FP.features.map(f => f.label.toLowerCase()).join('; ')}.` }, cm);
    const cu = card(s, 'How identifiable is each operator? Rank of their own other session among all 33');
    const BINS = [[1, 1, 'nearest (1st)'], [2, 5, '2nd–5th'], [6, 10, '6th–10th'], [11, 20, '11th–20th'], [21, 33, '21st–33rd']];
    const cnt = (rs, a, b) => rs.filter(x => x >= a && x <= b).length;
    barsGrouped(h('div', { class: 'chart' }, cu), BINS.map(b => b[2]), [
      { label: 'all ten behaviours', color: css('--mark'), values: BINS.map(([a, b]) => (cnt(A.ranks, a, b) + cnt(A.ranksBA, a, b)) / 2) },
      { label: 'reliance removed', color: css('--lad-2'), values: BINS.map(([a, b]) => (cnt(B.ranks, a, b) + cnt(B.ranksBA, a, b)) / 2) },
      { label: 'chance', color: css('--mark-soft'), values: BINS.map(([a, b]) => (b - a + 1)) },
    ], { fmt: v => num(v, 1).replace('.0', ''), height: 220, ticks: 4 });
    legend(cu, [{ label: 'all ten behaviours', color: css('--mark') }, { label: 'reliance axis removed', color: css('--lad-2') },
                { label: 'expected by chance', color: css('--mark-soft') }]);
    h('p', { class: 'cap', html: 'This is the per-person view. For each operator, all 33 second sessions are ranked by how close '
      + 'they are to that operator’s first session; 1 means their own is the closest. Counts are averaged over both directions '
      + `(session 1 → 2 and 2 → 1). By chance each rank is equally likely, so 1 person per rank. Observed, about `
      + `${num((cnt(A.ranks, 1, 5) + cnt(A.ranksBA, 1, 5)) / 2, 0)} operators have their own session in the top five (chance 5), and `
      + 'the bottom bin is thinner than chance: a few people are very consistent, most are somewhat, and a handful changed style '
      + 'between sessions.' }, cu);
    const cr = card(s, 'Which habits carry over from session 1 to session 2 (Spearman ρ)');
    legend(cr, [{ label: 'as measured', color: css('--mark') }, { label: 'with the reliance axis removed', color: css('--lad-2') }]);
    pairBarsH(h('div', { class: 'chart' }, cr), FP.retest.map(r => ({ label: r.label, a: r.rho, b: r.rhoBeyond,
      aP: r.pHolm, bP: r.pBeyond,
      aSub: `ρ = ${num(r.rho, 2)} [${num(r.lo, 2)}, ${num(r.hi, 2)}], ${pv(r.p)}, Holm-adjusted ${pv(r.pHolm)}`,
      bSub: `ρ = ${num(r.rhoBeyond, 2)}, ${pv(r.pBeyond)}` })),
      { series: [{ label: 'as measured', color: css('--mark') }, { label: 'reliance removed', color: css('--lad-2') }],
        min: -0.4, max: 1.25, ticks: [-0.25, 0, 0.25, 0.5, 0.75, 1], padL: 270 });
    h('p', { class: 'cap', html: '<b>What a bar means.</b> This is per habit, not per person. For one behaviour, line up the 33 '
      + 'operators by their session-1 value and again by their session-2 value; Spearman ρ says how well the two orderings '
      + 'agree. ρ = 1: everyone keeps exactly their place (whoever pressed Suggest most in session 1 also did in session 2); '
      + 'ρ = 0: session 1 tells you nothing about session 2. So a long bar marks a habit that is <b>stable and personal</b> — '
      + 'the raw material of the fingerprint — not how unique any one person is (the chart above shows that). The pale bar '
      + 'repeats it after each session’s reliance score has been regressed out of that behaviour: a habit still stable there '
      + 'is stable for reasons other than overall reliance. Every habit except trimming drones on single-type missions carries '
      + 'over, most of them about as strongly once reliance is taken out. Each bar is labelled ρ, stars and p: the dark bar’s p is '
      + 'Holm-adjusted for the ten habits, the pale bar’s is unadjusted.' }, cr);
    const stab = h('table', { class: 'method' }, cr);
    const th = h('thead', {}, stab), thr = h('tr', {}, th);
    ['Habit', 'ρ', '95% CI', 'p', 'Holm p', 'Distinct levels, 1 session', '2 sessions', 'Gap to tell 2 people apart']
      .forEach((t, i) => h('th', { text: t, class: i ? 'num' : '' }, thr));
    const tb = h('tbody', {}, stab);
    FP.retest.slice().sort((a, b) => b.rho - a.rho).forEach(r => {
      const tr = h('tr', {}, tb);
      h('td', { text: r.label }, tr);
      h('td', { class: 'num', html: num(r.rho, 2) + stars(r.pHolm) }, tr);
      h('td', { class: 'num', text: `${num(r.lo, 2)} to ${num(r.hi, 2)}` }, tr);
      h('td', { class: 'num', html: pv(r.p) }, tr);
      h('td', { class: 'num', html: pv(r.pHolm) }, tr);
      h('td', { class: 'num', text: num(r.strata1, 1) }, tr);
      h('td', { class: 'num', text: num(r.strata2, 1) }, tr);
      h('td', { class: 'num', text: r.rho > 0 ? num(r.minDiffSD, 1) + ' SD' : '—' }, tr);
    });
    const nHolm = FP.retest.filter(r => r.pHolm < 0.05).length;
    para(cr, `<b>How to read the table.</b> <i>p</i> tests only whether ρ is above zero; with ${FP.n} people that needs ρ ≈ .34 `
      + `for p &lt; .05. <i>Holm p</i> corrects for testing ten habits at once — <b>${nHolm} of ${FP.retest.length}</b> survive it. `
      + 'The confidence interval shows how well ρ is pinned down by 33 people: wide. <i>Distinct levels</i> (separation strata, '
      + '(4G + 1)/3 with G = √(ρ / (1 − ρ))) is how many statistically distinguishable groups the habit can sort people into: '
      + 'about 2 means it reliably tells high from low, 1 means not at all; averaging both sessions raises reliability to '
      + '2ρ/(1 + ρ). <i>Gap</i> is how far apart two people’s session values must be, in standard deviations of that habit, '
      + 'to say they genuinely differ (95%): 2.77 × √(1 − ρ). So the strongest habits separate operators into a reliable '
      + '<b>high and low</b> from one 8-minute session, and roughly <b>three levels</b> from two sessions — not a fine ranking.');
    if (FP.types) {
      const TY = FP.types, AR = TY.arch, LABC = Object.fromEntries(FP.features.map(f => [f.k, f.label]));
      // name the three archetypes by what defines them
      const ci = k => FP.features.findIndex(f => f.k === k);
      const iDel = AR.profiles.map((z, i) => [z[ci('took')], i]).sort((a, b) => b[0] - a[0])[0][1];
      const iTin = AR.profiles.map((z, i) => [z[ci('edit')], i]).filter(x => x[1] !== iDel).sort((a, b) => b[0] - a[0])[0][1];
      const iDeli = [0, 1, 2].find(i => i !== iDel && i !== iTin);
      const NAMES = [], COLS = [];
      NAMES[iDel] = 'Delegator'; NAMES[iTin] = 'Fast tinkerer'; NAMES[iDeli] = 'Deliberate builder';
      COLS[iDel] = css('--s-strat'); COLS[iTin] = css('--s-tac'); COLS[iDeli] = css('--r-cons');
      const archOf = Object.fromEntries(AR.weights.map(({ pid, w }) => { const d = w.indexOf(Math.max(...w));
        return [pid, { name: NAMES[d], color: COLS[d], w: w[d] }]; }));
      const nDom = [0, 1, 2].map(i => AR.weights.filter(x => x.w.indexOf(Math.max(...x.w)) === i).length);
      const maxW = AR.weights.map(x => Math.max(...x.w)).sort((a, b) => a - b);
      const medW = maxW[Math.floor(maxW.length / 2)];
      h('h3', { text: 'Are there types of operator? Four ways of looking' }, s);
      para(s, 'Round 1’s formal test found no distinct groups. These four views ask the question more gently, each on the '
        + 'same game-adjusted profiles (each person = the average of their two sessions). They go from “show me the raw '
        + 'pattern” to “describe people as mixes of a few extreme styles”.');

      const c1 = card(s, '1 · Every operator’s profile, with similar operators placed together');
      heatTree(h('div', { class: 'chart' }, c1), TY.heat, archOf);
      legend(c1, [{ label: 'below average', color: css('--s-tac') }, { label: 'above average', color: css('--s-strat') },
                  ...NAMES.map((n, i) => ({ label: 'closest archetype: ' + n, color: COLS[i] }))]);
      const ag = TY.heatAgree;
      h('p', { class: 'cap', html: 'Rows are operators, columns habits; colour is how far above (blue) or below (orange) the '
        + 'average operator they were, in standard deviations. The tree joins the most similar operators first. <b>Look for '
        + 'blocks</b>: a type would show as a band of rows sharing a colour pattern. What appears is a gradient with a few '
        + `loose families. Grouping each session on its own and comparing: two groups do not recur (agreement ARI `
        + `${num(ag[0].ari, 2)}, ${pv(ag[0].p)}); three and four groups recur weakly (ARI ${num(ag[1].ari, 2)}, ${pv(ag[1].p)}; `
        + `${num(ag[2].ari, 2)}, ${pv(ag[2].p)}) — above chance, far below the .5 that would mark clear types. The coloured tick `
        + 'by each operator is their closest archetype (view 4).' }, c1);

      const c2 = card(s, '2 · Which habits go together (Spearman ρ between operators)');
      corrGrid(h('div', { class: 'chart' }, c2), TY.corr);
      h('p', { class: 'cap', html: `Each square: across the 33 operators, does being high on one habit go with being high (blue) `
        + `or low (orange) on the other? ${TY.corrSig.n} of ${TY.corrSig.of} pairs reach p < .05, against about `
        + `${num(TY.corrSig.of * 0.05, 0)} by chance. The strong block is <b>taking cards with previewing them</b>; going manual `
        + 'before the cards load sits against using Suggest and previewing; trimming drones on small and on large missions '
        + 'go together. Strategic and tactical reliance are only loosely linked. These pairings are what a “style” is made of.' }, c2);

      const c3 = card(s, '3 · The two biggest differences between operators, with their ends named');
      para(c3, 'If you had to place every operator on just two scales, these are the two that capture the most difference '
        + 'between them (the first two principal components). The bars say what each scale is made of: a habit with a long '
        + 'bar moves you a long way along it, and its colour says which end it pushes you towards.');
      const g3 = h('div', { class: 'grid2' }, c3);
      axisBars(h('div', { class: 'chart' }, g3), 'Left ↔ right: what moves an operator right', TY.biplot.pc1, TY.heat.cols,
        '', '', css('--s-strat'), css('--r-cons'));
      axisBars(h('div', { class: 'chart' }, g3), 'Down ↔ up: what moves an operator up', TY.biplot.pc2, TY.heat.cols,
        '', '', css('--s-tac'), css('--mark-soft'));
      styleAxes(h('div', { class: 'chart' }, c3), FP.points, TY.biplot, TY.heat.cols, archOf, AR, NAMES, COLS,
        { left: 'builds by hand, slower', right: 'takes the advice, previews, fast', up: 'overrides: edits cards, adds drones, decides early',
          down: 'accepts Suggest’s plan, takes time' });
      h('p', { class: 'cap', html: 'Each dot is an operator (the average of their two sessions), coloured by their closest '
        + 'style; triangles mark where a <i>pure</i> example of each style would sit. <b>Reading it:</b> the horizontal scale is '
        + 'reliance — right means taking the cards, previewing them and pressing Suggest. The vertical scale is a second, '
        + 'separate way operators differ: up means <b>overriding</b> (editing cards, adding drones beyond the card, deciding '
        + 'before the cards load), down means <b>accepting</b> Suggest’s plan as given and taking longer. The three styles sit '
        + 'at three corners of this picture: Delegators right, Deliberate builders bottom-left, Fast tinkerers top-left. '
        + 'Operators fill the space between them rather than clumping at the corners.' }, c3);

      const c4 = card(s, '4 · Archetypes: three extreme styles, and each operator as a mix of them');
      para(c4, '<b>How the styles are found.</b> Each operator is a point in a ten-habit space (their profile). Archetypal '
        + 'analysis looks for the three profiles at the <b>outer edge</b> of that cloud such that every operator is, as closely '
        + 'as possible, a <b>blend</b> of them — so much of style A, so much of B, so much of C, adding to 100%. The three '
        + 'archetypes are themselves blends of real operators, so they are extreme but realistic, not invented ideals. '
        + 'Three was chosen because it is the first number with a clear meaning for every corner; two leaves the hand-builders '
        + 'mixed together, four or five split hairs (see the variation figures below).');
      para(c4, `<b>How people are classified.</b> Every operator gets three percentages. Their “closest style” is simply the `
        + `largest of the three: ${nDom[iDel]} operators lean towards Delegator, ${nDom[iDeli]} towards Deliberate builder and `
        + `${nDom[iTin]} towards Fast tinkerer. The lean is usually clear but rarely total: the median operator’s largest share is `
        + `${pct(medW, 0)}. So “P14 is a Delegator” (94%) is near-pure, while “P20 is a Deliberate builder” (52%) is a close call; use the triangle `
        + 'to see how mixed each person is.');
      const hdrArch = [...Array(3).keys()];
      const tb = h('table', { class: 'method' }, c4), tr0 = h('tr', {}, h('thead', {}, tb));
      h('th', { text: 'Habit' }, tr0);
      hdrArch.forEach(i => h('th', { class: 'num', html: `<span style="color:${COLS[i]}">${NAMES[i]}</span>` }, tr0));
      const tbd = h('tbody', {}, tb);
      FP.features.forEach((f, j) => {
        const tr = h('tr', {}, tbd);
        h('td', { text: f.label }, tr);
        hdrArch.forEach(i => { const v = AR.profiles[i][j];
          h('td', { class: 'num', text: sgn(v, 1), style: `background:${zCol(v)};` }, tr); });
      });
      ternary(h('div', { class: 'chart' }, c4), AR, NAMES, COLS);
      const st = TY.archStability;
      const curve = AR.curve.map(c => `${c.k}: ${pct(c.explained, 0)}`).join(', ');
      h('p', { class: 'cap', html: 'Archetypal analysis finds the few most extreme profiles that every operator can be described '
        + 'as a blend of (each operator’s weights sum to 100%). The table gives each archetype’s profile in SD from average. '
        + `<b>${NAMES[iDel]}</b>: takes the cards, previews them, presses Suggest, decides fast. <b>${NAMES[iTin]}</b>: goes manual `
        + `early, edits cards, rarely uses Suggest, adds drones, decides fast. <b>${NAMES[iDeli]}</b>: builds by hand, deliberates `
        + `longest, trims drones. In the triangle each dot is an operator; corners are pure styles. Variation explained by `
        + `1–5 archetypes: ${curve}. ${AR.pure.reduce((a, b) => a + b, 0)} operators are near-pure (≥ 80% one style); `
        + `${AR.mixed} are clearly mixed (no style above 60%).` }, c4);
      para(c4, `<b>Do the archetypes come back?</b> Fitting them on session 1 and session 2 separately gives nearly the same `
        + `profiles for two of them (ρ = ${st.profileR.slice().sort((a, b) => b - a).map(v => num(v, 2)).join(', ')} between the `
        + `matched profiles), and ${pct(st.sameDominant, 0)} of operators are closest to the same archetype in both sessions, `
        + `against ${pct(st.nullSame, 0)} by chance (${pv(st.p)}). So the <b>poles are real and reproducible</b>; what is not true `
        + 'is that people fall into three boxes. The defensible language: <b>three recurring styles that operators blend</b>, '
        + 'most of them leaning towards one.');
      if (X2 && X2.archNull) {
        const AN = X2.archNull, O = AN.observed, NA = AN.nulls.stable, NB = AN.nulls.nocorr;
        const c5 = card(s, '5 · Signal or noise? The archetypes against operators with no types at all');
        para(c5, '<b>The worry.</b> Archetypal analysis <i>always</i> returns k corners: give it any cloud of points and it will '
          + 'name three extremes and describe everyone as a blend. Its explained variance always rises with k, and refitting '
          + 'on a second session will always find similar corners if people are merely <i>consistent</i>. So none of the '
          + 'numbers in view 4 can show types on their own; they need a baseline of what the same method finds when there '
          + 'are none.');
        para(c5, `<b>The baseline.</b> ${AN.n} simulated studies of 33 operators each, drawn from a <b>single continuous cloud</b> `
          + 'that copies the real data in every respect but types: each habit has its real distribution, the habits are '
          + 'correlated with each other exactly as observed, and each habit carries over from session 1 to session 2 as strongly '
          + 'as it really does (a Gaussian copula fitted to all twenty session-habit columns). The identical pipeline — game '
          + 'adjustment aside, already done — is run on every simulated study. A second, harsher baseline shuffles each habit '
          + 'independently between people, destroying any style while keeping each habit’s session-to-session stability.');
        const F_ = { pct: v => pct(v, 0), n1: v => num(v, 1), r2: v => num(v, 2) };
        const rows = [
          ['Variation explained, 3 archetypes', 'expl3', F_.pct], ['Gain from 2 → 3 archetypes', 'gain3', F_.pct],
          ['Near-pure operators (≥ 80% one style)', 'pure', F_.n1], ['Median operator’s largest share', 'medMax', F_.pct],
          ['Best-matched profile, session 1 vs 2 (r)', 'prof1', F_.r2], ['Second profile (r)', 'prof2', F_.r2],
          ['Third profile (r)', 'prof3', F_.r2], ['Same closest archetype in both sessions', 'same', F_.pct],
        ].map(([label, k, fmt]) => ({ label, obs: O[k], a: NA[k], b: NB[k], fmt }));
        nullStrip(h('div', { class: 'chart' }, c5), rows);
        legend(c5, [{ label: 'observed', color: css('--s-strat') },
                    { label: 'no types, same habits, correlations and stability (95% of simulations; tick = average)', color: css('--mark-soft') },
                    { label: 'habits shuffled between people', color: css('--s-tac') }]);
        h('p', { class: 'cap', html: 'p = share of no-types simulations at least as high as observed (one-sided). Hover a row for both baselines.' }, c5);
        const beats = rows.filter(r => r.a.pAbove < 0.05).map(r => r.label.toLowerCase());
        para(c5, `<b>The verdict.</b> Everything that would mark <i>types</i> sits inside what a no-types continuum produces: `
          + `variation explained (${pct(O.expl3, 0)} against ${pct(NA.expl3.mean, 0)}, ${pval(NA.expl3.pAbove)}), the gain from a third `
          + `archetype, the number of near-pure operators (${O.pure} against ${num(NA.pure.mean, 0)}), how lopsided people’s mixes are, `
          + `and how often a person keeps the same closest archetype across sessions (${pct(O.same, 0)} against ${pct(NA.same.mean, 0)}, `
          + `${pval(NA.same.pAbove)}). The method finds as much “type-ness” in a featureless cloud as in these operators. What does `
          + `beat the continuum is the <b>shape</b>: the two clearest archetype profiles are rebuilt almost identically from session 1 `
          + `and session 2 (r = ${num(O.prof1, 2)} and ${num(O.prof2, 2)}, against ${num(NA.prof1.mean, 2)} and ${num(NA.prof2.mean, 2)}; `
          + `${pval(NA.prof1.pAbove)} and ${pval(NA.prof2.pAbove)}) — though eight measures were checked and neither survives a Holm `
          + `correction. Against the harsher baseline the habits clearly hang together (variation explained ${pct(O.expl3, 0)} against `
          + `${pct(NB.expl3.mean, 0)} when habits are shuffled between people, ${pval(NB.expl3.pAbove)}). <b>So: operators do not come in `
          + `types. They differ along a couple of stable directions, and the archetypes are a convenient way to name the ends of those `
          + `directions</b> — which is how the “three recurring styles” above should be read.`);
        para(c5, `<b>Why the archetypes look the way they do.</b> Each operator’s three archetype shares are almost entirely `
          + `predicted by their position on the first two principal axes (R² = ${AN.weightsFromPC12.map(v => num(v, 2)).join(', ')} `
          + `for the three shares): the archetypes are a re-description of the reliance axis and the override-vs-accept axis, `
          + `with corners placed at the edge of the cloud. And there is no gap along the reliance axis — its bimodality `
          + `coefficient is ${num(AN.bimodalityPC1, 2)}, below the .555 that would hint at two groups.`);
      }
    }
    caveat(s, `Exploratory, run after rounds 1–2. ${Object.values(FP.imputed).reduce((a, b) => a + b, 0)} of `
      + `${FP.nSessions * FP.features.length} session values could not be computed (e.g. no manual choices to time) and filled with the `
      + 'game median, which can only make people look more alike. The same people play both sessions under different '
      + 'scenarios, so a match cannot come from playing the same game twice.');
  }
  strand(s, 'In what they said');
  codeBars(s, ['C01', 'C02']);
  para(s, `${xOf('C01')} described a consistent personal strategy that governed how they used the assistants. `
    + `Wanting control for its own sake is rare: ${xOf('C02')} (P11) said so explicitly.`);
  strand(s, 'In their words');
  quotesFor(s, 'person');
  together(s, 'Both streams point at the person. Operators describe their reliance as a <b>strategy of their own</b>, and the '
    + 'logs show a <b>stable, individual style</b> — detectable from behaviour alone and broader than reliance — but no '
    + 'questionnaire or prior experience tells us whose style will be which.');
}

/* ───────────────────────── 2 · job size ───────────────────────── */
{
  register('t-size', '<b>Within a person, the size of the job decides</b>: small ones by hand, big ones to the assistant, on both tiers.');
  const s = theme('t-size', 2, 'Within a person, the size of the job decides', 'strong');
  strand(s, 'In the logs');
  const L = C.load, one = L.byColours.find(r => r.k === 1), three = L.byColours.find(r => r.k === 3);
  para(s, `Operators took the strategic card on <b>${pct(one.took, 0)}</b> of single-drone-type missions and `
    + `<b>${pct(three.took, 0)}</b> of three-type ones; comparing each person with themselves, each extra drone type `
    + `multiplies the odds of taking a card by <b>×${Math.exp(I.within.ncolours.b).toFixed(2)}</b>. The same holds on the `
    + `tactical tier: Suggest is consulted far more on bigger plans (<b>odds ×2.57</b> per ~2.7-fold increase in plan size). `
    + 'The apparent difference between the two scenarios is this in disguise: Strategic Heavy simply serves more small missions.');
  const g = h('div', { class: 'grid2' }, s);
  barsH(h('div', { class: 'chart' }, card(g, 'Card uptake by drone types needed')), L.byColours.map(r => ({
    label: r.k + (r.k === 1 ? ' type' : ' types'), value: r.took, sub: 'n = ' + r.n + ' decisions' })), { max: 1, padL: 80, rowH: 34 });
  barsH(h('div', { class: 'chart' }, card(g, 'Card uptake by mission category')), L.byCategory.map(r => ({
    label: r.k + ' · ' + num(r.tasks, 0) + ' tasks', value: r.took, sub: 'n = ' + r.n })), { max: 1, padL: 96, rowH: 30 });
  strand(s, 'In what they said');
  codeBars(s, ['C03']);
  para(s, `${xOf('C03')} said in their own words that they do small or simple jobs themselves and give big or complex `
    + 'ones to the assistant.');
  strand(s, 'In their words');
  quotesFor(s, 'size');
  together(s, '<b>Strong agreement.</b> This is the clearest place where what operators say and what they do line up: '
    + 'job size is both the reason they give and the pattern in the logs.');
}

/* ───────────────────────── 3 · speed ───────────────────────── */
{
  register('t-speed', '<b>The assistant’s value is speed</b>, and it really is faster — but only where the job is big.');
  const s = theme('t-speed', 3, 'The assistant is valued for speed — and it is faster where jobs are big', 'strong');
  strand(s, 'In the logs');
  const L = R1 ? R1.load : {};
  tiles(s, [
    { v: (L.cardSavesNetS || '—') + ' s', k: 'saved by taking a card on three-type missions', s: 'net of the forced 4–5 s reveal' },
    { v: (L.suggestFasterPct || '—') + '%', k: 'faster to keep a Suggest plan than build one', s: 'mostly on large plans' },
    { v: '×' + (L.parallelX || '—'), k: 'more likely to open the next mission while a plan fills in', s: 'with Suggest' },
    { v: '−31%', k: 'decision time over an 8-minute session', s: 'practice, net of the forced waits' },
  ]);
  para(s, 'Taking a card is <b>much faster than building by hand on three-type missions</b>, and not on single-type ones, '
    + 'where deciding by hand before the cards even load is quickest. Suggest lets operators <b>work in parallel</b>: '
    + 'while a plan fills in they move on to the next mission. And everyone speeds up with practice.');
  strand(s, 'In what they said');
  codeBars(s, ['C04', 'C05', 'C06']);
  para(s, `${xOf('C04')} valued the assistant mainly for speed rather than accuracy, ${xOf('C05')} described using its `
    + `time to work on something else, and ${xOf('C06')} complained that it was slow — the forced waits are real, `
    + 'and on small jobs they cost more than they save.');
  strand(s, 'In their words');
  quotesFor(s, 'speed');
  together(s, '<b>Agreement, with a twist.</b> Operators are right that the assistant is a speed tool, and those who found '
    + 'it slow are right too: the saving only appears <b>on big jobs</b>, which is exactly where they choose to use it.');
}

/* ───────────────────────── 4 · load ───────────────────────── */
{
  register('t-load', `<b>Being busy does not push people onto the assistant</b> — even though ${nOf('C11')} of ${NQ} say it does.`);
  const s = theme('t-load', 4, 'Being busy does not push people onto the assistant', 'disagree');
  strand(s, 'In the logs');
  const L = R1 ? R1.load : {};
  para(s, `One more mission waiting in the queue changed the odds of taking a card by <b>×${L.or ? L.or.toFixed(2) : '—'}</b> — `
    + `no effect — and the test could have caught one as small as ×${L.detectable || '—'}. Round 2 tried five other measures `
    + 'of pressure, the final 90 seconds, the tactical tier, and moments of spoken overload in the narration: <b>none '
    + 'shows reliance rising under load</b>. What looked like it (Suggest use rising with a backlog) is practice: it '
    + 'disappears once time in the session is held fixed.');
  if (X && X.deepQueue) {
    const ST = X.deepQueue.strategic, TA = X.deepQueue.tactical;
    h('h3', { text: 'What about genuinely long queues — four or more missions waiting?' }, s);
    const c = card(s, 'Reliance by how many other missions were waiting when the decision opened');
    legend(c, [{ label: 'Strategic: card taken', color: css('--s-strat') }, { label: 'Tactical: Suggest pressed', color: css('--s-tac') }]);
    const QS = X2 && X2.deepQueue2 ? X2.deepQueue2.strategic.bins : ST.bins.map(b => Object.assign({}, b, { label: b.label }));
    const QT = X2 && X2.deepQueue2 ? X2.deepQueue2.tactical.bins : TA.bins.map(b => Object.assign({}, b, { label: b.label }));
    barsGrouped(h('div', { class: 'chart' }, c), QS.map(b => b.label + ' waiting'),
      [{ label: 'Strategic: card taken', color: css('--s-strat'), values: QS.map(b => b.rate),
         subs: QS.map(b => `n = ${b.n} decisions from ${b.people} people`) },
       { label: 'Tactical: Suggest pressed', color: css('--s-tac'), values: QT.map(b => b.rate),
         subs: QT.map(b => `n = ${b.n} plans from ${b.people} people`) }],
      { max: 1, fmt: v => pct(v, 0), height: 220 });
    h('p', { class: 'cap', text: 'Raw rates, not adjusted for mission size or practice; the tests below are.' }, c);
    const one = ST.byType.filter(r => r.types === 1);
    para(s, `Deep queues are common, not a corner case: <b>${ST.nHi} of ${ST.nDecisions} strategic decisions (${pct(ST.shareHi, 0)})</b> `
      + `were made with four or more other missions waiting, by ${ST.peopleHi} of 33 operators, and ${TA.nHi} of ${TA.nDecisions} `
      + `tactical plans (${TA.peopleHi} operators). Comparing each operator with themselves, a deep queue <b>does not raise `
      + `reliance on either tier</b>: card-taking odds ×${num(ST.within.OR, 2)} [${num(ST.within.lo, 2)}, ${num(ST.within.hi, 2)}], `
      + `${pv(ST.within.p)} (${ST.higher} operators took cards more often at 4+, ${ST.lower} less); Suggest odds `
      + `×${num(TA.within.OR, 2)} [${num(TA.within.lo, 2)}, ${num(TA.within.hi, 2)}], ${pv(TA.within.p)}. On single-type missions `
      + `card-taking is if anything <b>lower</b> with a deep queue (${pct(one.find(r => r.hi === 1).rate, 0)} against `
      + `${pct(one.find(r => r.hi === 0).rate, 0)}), where deciding by hand before the cards load is quickest.`);
    para(s, `Between people the sign flips: operators who spend more of their time facing a deep queue rely <i>less</i> `
      + `(strategic ${pv(ST.between.p)}, tactical ${pv(TA.between.p)}). That is most likely the reverse direction — building by `
      + 'hand is slower, so manual operators accumulate their own queues — and it is why the within-person comparison is the test.');
  }
  if (X2 && X2.deepQueue2) {
    const Q = X2.deepQueue2, QS = Q.strategic, QT = Q.tactical, V = Q.visible;
    h('h3', { text: 'Long queues, looked at seven ways' }, s);
    para(s, 'The raw strategic bars above dip at three and four missions waiting, rise at five and dip again at six or more. '
      + 'Read naively, that is the opposite of “busy people hand over”: <b>less</b> assistant use as the queue lengthens. '
      + 'Everything below asks whether that dip survives once the obvious alternatives are taken out: what the operator '
      + 'could see, when in the session the queue was long, what kind of mission was being decided, which mission they '
      + 'chose to open, and who was deciding.');

    // a · what can be seen
    const cv = card(s, 'a · How many queued missions can an operator actually see?');
    const pics = h('div', { class: 'grid2' }, cv);
    [['img/queue_at_rest.jpg', 'At rest: three full cards and the header of a fourth (a taller browser window showed four).'],
     ['img/queue_decision_open.jpg', 'Deciding: the strategy cards open inside the queue column and push every other waiting mission off-screen.']]
      .forEach(([src, cap]) => { const f = h('figure', { style: 'margin:0' }, pics);
        h('img', { src, alt: cap, style: 'width:100%;max-width:300px;border-radius:6px;border:1px solid var(--line);display:block' }, f);
        h('figcaption', { class: 'cap', text: cap }, f); });
    para(cv, `Read off the screen recordings (P19, P30). The queue column holds <b>about ${V} cards</b> before it scrolls, `
      + 'and the panel for the mission being decided expands <i>inside</i> that column, so while a strategic decision is '
      + 'open the operator sees <b>at most one other</b> waiting mission there. The map still shows every waiting mission as '
      + 'an orange circle, and missions can be opened from the map, so the backlog is never invisible, only out of the list. '
      + `So “more than ${V} waiting” is where extra missions stop adding anything the operator sees in the queue itself.`);

    // b · four ways to balance the bars
    const cb = card(s, 'b · The same bars, balanced four ways');
    const bx = h('div', { class: 'chart' }, cb);
    const VIEWS = {
      raw: ['Raw', b => b.rate, 'The raw share, as above.'],
      dev: ['Within-person', b => b.dev, 'Each decision minus that operator’s own overall rate, averaged: above 0 means people '
        + 'used the assistant more than usual for them at that queue depth. Removes who tends to have long queues.'],
      adj: ['Adjusted for mission, time and person', b => b.adjusted, 'Observed minus the rate a model expects from the mission '
        + '(drones, tasks, drone types), the minute of the session, the game and the person — put back on the overall level. '
        + 'The queue itself is left out of that model, so anything left here is the queue.'],
      std: ['Standardised over time', (b, i, which) => which.standardised[i].rate, 'Each bar re-weighted so every queue depth '
        + 'has the same spread over the first, middle and last third of the session as the whole sample. Removes the fact '
        + 'that long queues happen late, when operators are faster and more practised. Thin at 6+.'],
    };
    const vcap = h('p', { class: 'cap' }, cb);
    const drawV = k => {
      const [, f, txt] = VIEWS[k], dev = k === 'dev';
      const vals = which => which.bins.map((b, i) => f(b, i, which));
      barsGrouped(bx, QS.bins.map(b => b.label + ' waiting'),
        [{ label: 'Strategic', color: css('--s-strat'), values: vals(QS), subs: QS.bins.map(b => `n = ${b.n}`) },
         { label: 'Tactical', color: css('--s-tac'), values: vals(QT), subs: QT.bins.map(b => `n = ${b.n}`) }],
        dev ? { min: -0.25, max: 0.25, fmt: v => sgn(100 * v, 0) + ' pts', height: 220 } : { max: 1, fmt: v => pct(v, 0), height: 220 });
      vcap.innerHTML = txt;
    };
    cb.insertBefore(btnBar(cb, 'View', Object.entries(VIEWS).map(([k, v]) => [k, v[0]]), 'adj', drawV), bx);
    legend(cb, [{ label: 'Strategic: card taken', color: css('--s-strat') }, { label: 'Tactical: Suggest pressed', color: css('--s-tac') }]);
    drawV('adj');
    const nbAdj = QS.bins.map(b => b.adjusted).filter(v => v != null);
    para(s, `Once mission, time and person are accounted for, strategic uptake runs between <b>${pct(Math.min(...nbAdj), 0)} and `
      + `${pct(Math.max(...nbAdj), 0)}</b> across queue depths with no trend either way (the extremes are the thinnest bins), and `
      + `the raw dip at three to four waiting is gone (${pct(QS.bins[3].adjusted, 0)} and ${pct(QS.bins[4].adjusted, 0)}). The `
      + `within-person view says the same: nobody’s own rate moves much with the queue. Long queues come late in a session `
      + `(queue length and minute correlate ρ = ${num(QS.corrQminute, 2)}), which is why time has to be held fixed.`);

    // c · composition: what each bar is made of
    tableFor(s, ['Others waiting', 'n', 'raw', 'expected', 'adjusted', 'drones needed', 'tasks', 'three-type', 'minute', 'manual before cards', 'median s'],
      QS.bins.map(b => [b.label, b.n, pct(b.rate, 0), pct(b.expected, 0), pct(b.adjusted, 0), num(b.ndrones, 1), num(b.ntasks, 1),
                        pct(b.three, 0), num(b.minute, 1), pct(b.early, 0), num(b.secs, 1)]),
      'Show what each strategic bar is made of (mission size, time, pre-emptive manual)');

    // d · time
    const ct = card(s, 'c · Within each third of the session, strategic uptake by queue depth');
    const TH = QS.thirds;
    barsGrouped(h('div', { class: 'chart' }, ct), QS.bins.map(b => b.label + ' waiting'),
      TH.map((t, i) => ({ label: t.label, color: css(['--lad-3', '--lad-2', '--lad-1'][i]),
                          values: t.bins.map(b => b.n >= 5 ? b.rate : null), subs: t.bins.map(b => `n = ${b.n}`) })),
      { max: 1, fmt: v => pct(v, 0), height: 220 });
    legend(ct, TH.map((t, i) => ({ label: `${t.label} (mean queue ${num(t.meanQ, 1)})`, color: css(['--lad-3', '--lad-2', '--lad-1'][i]) })));
    h('p', { class: 'cap', text: 'Bars with fewer than 5 decisions are left out. Long queues barely exist in the first third, '
      + 'which is the point: a raw queue comparison is partly a comparison of early with late.' }, ct);

    // e · which mission gets opened
    const pk = QS.pick || Q.strategic.pick, longP = pk.find(x => x.k.startsWith('more')), shortP = pk.find(x => !x.k.startsWith('more'));
    const cp = card(s, `d · Which mission do operators open when more than ${V} are waiting?`);
    tiles(cp, [
      { v: pct(longP.oldest, 0), k: 'open the oldest waiting mission', s: `${pct(shortP.oldest, 0)} with ${V} or fewer waiting` },
      { v: pct(longP.visible, 0), k: `open one of the top ${V} in the list (arrival order)`, s: `${pct(shortP.visible, 0)} otherwise` },
      { v: num(longP.ndrones, 1), k: 'drones the opened mission needs', s: `${num(shortP.ndrones, 1)} otherwise` },
      { v: pct(longP.early, 0), k: 'decided by hand before the cards loaded', s: `${pct(shortP.early, 0)} otherwise` },
    ]);
    para(cp, `With a long queue operators stop working through it in order: they open the oldest mission only `
      + `${pct(longP.oldest, 0)} of the time, and about half the time open one that is <b>not among the top ${V}</b> in the `
      + `list — so they are picking, mostly off the map. What they pick is <b>smaller</b> (${num(longP.ndrones, 1)} drones against `
      + `${num(shortP.ndrones, 1)}), and small missions are the ones people build by hand (theme 2), more often before the cards `
      + `even load. That is the mechanism behind the raw dip: <b>under a long queue operators clear small jobs quickly by hand</b>, `
      + 'which lowers the raw share of cards taken without any change in how they treat a mission of a given size.');

    // f · every model
    const TL = { q_w: 'per extra mission waiting', qlo_w: `per extra mission, up to ${V}`, qhi_w: `per extra mission beyond ${V}`,
                 qt_w: 'per extra task waiting' };
    const modelRows = Qx => Object.entries(Qx.models).flatMap(([spec, terms]) => Object.entries(terms)
      .filter(([, v]) => v.est != null)
      .map(([t, v]) => ({ label: `${spec} — ${TL[t]}`, b: Math.log(v.est), lo: Math.log(v.lo), hi: Math.log(v.hi), p: v.p })));
    const cm = card(s, 'e · Every model of the queue, within person (odds of using the assistant)');
    [['Strategic: card taken', QS], ['Tactical: Suggest pressed', QT]].forEach(([lab, Qx]) => {
      h('h4', { text: lab }, cm);
      forest(h('div', { class: 'chart' }, cm), modelRows(Qx), { padL: 330, lim: 0.6 });
    });
    h('p', { class: 'cap', html: 'All within-person (each operator’s queue centred on their own average). “Time” adds minute and game; '
      + '“this card” adds the mission’s drones, tasks and drone types. The hinge splits the slope at what the queue list can show. '
      + '“Tasks waiting” counts the work in the queue rather than the missions. Tactical Suggest use creeps up with the queue '
      + 'until the plan’s own size is held fixed, then it does not: bigger plans arrive when the queue is long.' }, cm);

    // g · each person, short vs long
    const P_ = QS.persons;
    const cs = card(s, `f · Each operator who met both: card uptake with ${V} or fewer waiting, and with more`);
    slopes(h('div', { class: 'chart' }, cs), P_.points.map(x => ({ label: x.pid, a: x.short, b: x.long })),
      { aLabel: `${V} or fewer`, bLabel: `more than ${V}`, height: 220 });
    h('p', { class: 'cap', html: `${P_.n} operators: ${P_.higher} took cards more often with a long queue, ${P_.lower} less, `
      + `${P_.same} the same (Wilcoxon ${pv(P_.p)}). Raw rates — the long-queue missions are smaller.` }, cs);
    caveat(s, `The queue counts are rebuilt from the event log and match the logged count for ${pct(QS.rebuildAgree, 0)} of decisions. `
      + 'The cards-visible figure is from two recordings on the study machine; window height varied a little between sessions. '
      + 'The thirds and the 6+ bin are thin, so the standardised view is the noisiest of the four.');
    note(s, '<b>So, for theme 4.</b> The inverse pattern is real in the raw numbers and explained by what gets picked.</b> With a long queue, '
      + 'operators skip ahead to small missions and do them by hand — fast, often before the cards load — so the raw share of '
      + 'cards taken falls. Holding the mission, the time and the person fixed, the queue has no effect on either tier, '
      + 'including beyond the point where the list stops showing more. Busy operators change <i>what</i> they work on, not '
      + '<i>how</i> they treat it.');
  }
  strand(s, 'In what they said');
  codeBars(s, ['C11']);
  para(s, `${xOf('C11')} said they lean on the assistant more when busy, overwhelmed or rushed.`);
  strand(s, 'In their words');
  quotesFor(s, 'load');
  together(s, '<b>The streams disagree.</b> Handing over under pressure is an <b>account</b> more than a quarter of operators give, but not a '
    + 'visible <b>pattern</b> of it. The likely reconciliation is theme 2: busy sessions are also big-mission sessions, '
    + 'so people remember being busy when they handed over, when what they were responding to was job size.');
}

/* ───────────────────────── 5 · manual ───────────────────────── */
{
  register('t-manual', '<b>“Manual” is mostly not rejection</b>: half is decided before the advice exists, and nearly all of it is anchored on the cards.');
  const s = theme('t-manual', 5, '“Manual” is mostly not a rejection of the advice', 'strong');
  strand(s, 'In the logs');
  const P = C.position.overall;
  tiles(s, [
    { v: pct(C.preemption.overall, 0), k: 'of manual choices made before the cards were readable', s: `n = ${C.preemption.n}` },
    { v: pct(P.between + P['below both'], 0), k: 'of manual allocations between the cards or below both', s: `n = ${C.position.n}` },
    { v: '+' + num(C.timing.model.b, 1) + ' s', k: 'slower than taking a card, same mission', s: pval(C.timing.model.p) },
  ]);
  para(s, 'Manual allocations sit <b>around the cards, not away from them</b>, and what they change depends on job size: '
    + 'operators <b>trim drones on small missions and add them on large ones</b>.');
  barsDiverging(h('div', { class: 'chart' }, card(s, 'Drones committed by hand vs the Conservative card, by mission category')),
    C.load.deltaByCategory.map(b => ({ label: 'Category ' + b.k, value: b.mean, sub: 'n = ' + b.n })),
    { zeroLabel: 'same as the card', rowH: 30, padL: 110 });
  strand(s, 'In what they said');
  codeBars(s, ['C07', 'C08', 'C09', 'C10']);
  para(s, `The reasons operators give for going manual are mostly about the cards, not against them: ${xOf('C07')} held `
    + `drones in reserve for later missions, ${xOf('C08')} wanted something between the two cards or more options, `
    + `${xOf('C09')} treated a card as a first draft, and ${xOf('C10')} deliberately tested the assistant against themselves.`);
  strand(s, 'In their words');
  quotesFor(s, 'manual');
  together(s, '<b>Agreement.</b> Reserve-keeping is exactly the trimming the logs show on small missions, and wanting a '
    + 'middle ground is exactly the between-the-cards placement. A reliance measure that scores Manual as distrust '
    + '<b>misreads most of it</b>.');
}

/* ───────────────────────── 6 · tiers ───────────────────────── */
{
  register('t-tiers', '<b>The tactical assistant is trusted and preferred more</b> — but its flaws are harder to see and its plans harder to check.');
  const s = theme('t-tiers', 6, 'The tactical assistant is trusted more — but not like-for-like', 'moderate');
  strand(s, 'In the logs and questionnaires');
  const G = SR.gap;
  para(s, `Reported trust is <b>${num(DP.dist.trust_t.mean, 2)} for the tactical assistant against ${num(DP.dist.trust_s.mean, 2)}</b> `
    + `for the strategic one (1–7; ${G.higherTactical} of ${G.n} operators higher for tactical, ${pval(G.p)}). Operators consulted `
    + `the tactical plan on ${pct(DP.dist.consult.mean, 0)} of plans and kept it unmodified on ${pct(DP.dist.accept.mean, 0)}.`);
  const cI = card(s, 'The same six statements, asked about each assistant (1–7)');
  legend(cI, [{ label: 'Strategic Assistant', color: css('--s-strat') }, { label: 'Tactical Assistant', color: css('--s-tac') }]);
  pairBarsH(h('div', { class: 'chart' }, cI), SR.items.map(i => ({ label: i.label.replace(/^I /, ''), a: i.strategic, b: i.tactical })),
    { series: [{ label: 'Strategic Assistant', color: css('--s-strat') }, { label: 'Tactical Assistant', color: css('--s-tac') }],
      min: 0, max: 7, ticks: [1, 2, 3, 4, 5, 6, 7], fmt: v => num(v, 1), padL: 270, rowH: 38 });
  strand(s, 'In what they said');
  if (QL && QL.preference) {
    const PC = QL.preference.counts, order = ['tactical', 'strategic', 'both', 'conditional', 'none'];
    const LBL = { tactical: 'Prefers the tactical assistant', strategic: 'Prefers the strategic assistant',
                  both: 'Values both equally', conditional: 'Depends on the situation', none: 'No preference stated' };
    const cp = card(s, `Stated preference, ${NQ} participants`);
    whoSwitch(cp);
    const pbox = h('div', { class: 'chart' }, cp);
    const pdraw = () => whoBars(pbox, order.filter(k => PC[k]).map(k => ({ label: LBL[k], pids: QL.preference.who[k] || [], key: 'pref:' + k })), NQ);
    pdraw();
    WHO_CHARTS.push(pdraw);
    h('p', { class: 'cap', html: MEANS_CAP }, cp);
    para(s, `<b>${PC.tactical || 0} of ${NQ}</b> prefer the tactical assistant against <b>${PC.strategic || 0}</b> the strategic one.`);
  }
  codeBars(s, ['C12', 'C13', 'C14']);
  para(s, `Two things other than the tier differ. <b>Flaws are visible on one side only:</b> ${xOf('C12')} noticed the `
    + `strategic cards over-allocating or sending drone types a mission did not need (the cards’ simple rules do this on `
    + `${pct(C.artefact.prevalence, 0)} of decisions), against ${xOf('C13')} who noticed any flaw in a tactical plan. <b>Checking `
    + `costs differ:</b> ${xOf('C14')} said they took the tactical plan because it was too complex or too fast to check.`);
  strand(s, 'In their words');
  quotesFor(s, 'tiers');
  together(s, 'Both streams agree the tactical assistant is preferred, and both explain <b>why the comparison is unfair</b>: '
    + 'the strategic assistant shows its mistakes and is cheap to check; the tactical one hides its mistakes and is '
    + 'expensive to check. The gap is real; <b>what it is a gap in</b> is not yet established.');
}

/* ───────────────────────── 7 · checking ───────────────────────── */
{
  register('t-check', '<b>Checking is a price, not a principle</b>: operators check when it is cheap and skip it when it is not.');
  const s = theme('t-check', 7, 'Checking is a price, not a principle', 'suggestive');
  strand(s, 'In what they said');
  codeBars(s, ['C17', 'C18']);
  para(s, `${xOf('C17')} described their checking as depending on time and effort — checking when it was cheap and `
    + `skipping it under pressure — against ${xOf('C18')} who said they checked nearly everything.`);
  strand(s, 'In their words');
  quotesFor(s, 'check');
  strand(s, 'In the logs');
  para(s, 'The logs cannot measure checking well: without eye tracking, “checking time” is just the gap between clicks. '
    + 'The one pre-registered test of the mechanism (round 1, H2) <b>did not survive correction</b>.');
  together(s, 'A consistent <b>account</b> from the debriefs that the logs can neither confirm nor rule out. Worth '
    + 'designing for directly (e.g. eye tracking, or a plan summary that makes checking cheap).');
}

        + `Adjusted for mission, time and person: ${sgn(100 * (A && A.est), 1)} points, ${pv(A && A.p)}. `
        + `Per person, after minus before: ${sgn(100 * E.personDiff, 1)} points against ${sgn(100 * PL.mean, 1)} at random moments `

        frows.push({ label: lab, est: A.est, lo: A.lo, hi: A.hi, p: A.p, color: o === 'tactical' ? css('--s-tac') : css('--s-strat'),

      G.byDifficulty.map(r => ({ label: r.k.replace('needed a drone busy on another task', 'needed a busy drone').replace('idle drones could fix it', 'idle drones enough'),
        value: r.rate, sub: `n = ${r.n} failures` })), { max: 1, padL: 150, rowH: 34 });
    para(s, `What the data can rule in or out:`);

        + `(${pv(G.correlates[0].p)}), nor do gaming or simulation experience. Only the reliance trait does (${pv(G.correlates[5].p)}).`,

        + `(odds ×${num(G.nthModel.OR, 2)} per failure, ${pv(G.nthModel.p)}), and the never-attempters did not attempt in session 2 either.`,
      `<b>It is not that their failures were harder.</b> Harder failures (the fix needed a busy drone) were attempted less `
        + `(${pct(G.byDifficulty[0].rate, 0)} vs ${pct(G.byDifficulty[1].rate, 0)}, ${pv(G.difficultyFisherP)}), but the never-attempters’ `
        + `failures were almost all the easy kind.`,
      `<b>It is not a reflex.</b> An unattempted failure sat for a median of ${num(G.abandonWait.median, 0)} s before it was `
        + `abandoned, and ${G.abandonWait.over30} of ${G.abandonWait.n} sat over 30 s — time enough to try.`,
      `<b>What they said points at a mental model.</b> Two of the three (P15, P29) talk about a drone failure as something `
        + 'that <i>means</i> the mission has to be aborted, not as something to repair. The third, P24, was talked through the '
        + 'recovery options mid-session and still never attempted one.',
    ].forEach(t => { const li = h('li', {}, ul); li.innerHTML = t; });
    h('h4', { text: 'In their words, during play' }, s);
    nq(s, 'P15', 'fail this this mission');
    nq(s, 'P29', 'Well, I think I did it once');
    caveat(s, 'Three people. The likeliest reading — that a few operators left the tutorial believing a failure ends a mission — '
      + 'fits everything here but is not proven, and the study has no comprehension check that could test it. It is a '
      + 'plausible confound for the reliance–attempting link: if low-reliance operators also learned less from the '
      + 'tutorial, both would follow. A recovery question in the comprehension check would settle it next time.');
  }
  strand(s, 'In what they said');
  codeBars(s, ['C19', 'C20', 'C21']);
  para(s, `When missions failed, ${xOf('C19')} blamed their own choices and ${xOf('C20')} blamed the assistant; `
    + `${xOf('C21')} described aborting or re-sending a mission rather than repairing it.`);
  strand(s, 'In their words');
  quotesFor(s, 'recovery');
  together(s, `Few operators talk about blame at all (${nOf('C19')} themselves, ${nOf('C20')} the assistant), and only `
    + `${nOf('C21')} describe giving up on a mission rather than repairing it — yet in the logs, <b>not attempting a fix is `
    + 'what loses missions</b>. The operators who never try describe a failure as the end of the mission, which suggests a '
    + '<b>misunderstanding rather than a choice</b>. Two levers follow: <b>prompt an attempt</b>, and stop Suggest saying “No '
    + 'workable plan” when chaining a busy drone would work.');
}

/* ───────────────────────── 10 · performance ───────────────────────── */
{
  register('t-payoff', '<b>Better operators rely more; relying more does not make an operator better</b> — except in throughput.');
  const s = theme('t-payoff', 10, 'Better operators rely more; relying more does not make an operator better', 'moderate');
  strand(s, 'In the logs');
  tiles(s, [
    { v: '×3.06', k: 'odds of a mission completing for someone who always takes the card vs never', s: 'between people · p = .004' },
    { v: '×0.81', k: 'odds of a mission completing, same person, card vs manual', s: 'within person · p = .29' },
    { v: '−0.78', k: 'missions left never allocated per SD more reliance in a session', s: 'within person · q = .04' },
  ]);
  para(s, 'Comparing people, the more reliant complete more. Comparing each person with themselves, card missions do '
    + 'no better and <b>no performance measure rises</b> — but a more reliant session does <b>get more missions allocated</b>.');
  strand(s, 'In what they said');
  codeBars(s, ['C23', 'C24']);
  para(s, `${xOf('C23')} believed the assistant improved their results, and ${xOf('C24')} believed they did better by hand.`);
  strand(s, 'In their words');
  quotesFor(s, 'payoff');
  together(s, `Operators rarely judge the assistant on outcomes at all: only ${nOf('C23')} credit it with better results, `
    + `and <b>nobody claims to have done better by hand</b> (${nOf('C24')} of ${NQ}). What they do credit it with is speed `
    + '(theme 3) — and the logs agree that the benefit is <b>throughput, not better missions</b>.');
}

/* ───────────────────────── 11 · learning ───────────────────────── */
{
  register('t-learning', '<b>Operators get faster with practice</b> but do not get better at choosing when to rely.');
  const s = theme('t-learning', 11, 'Practice makes operators faster, not better calibrated', 'strong');
  strand(s, 'In the logs');
  para(s, 'Strategic decisions get <b>about 31% faster over an 8-minute session</b>, net of the forced waits, and session 2 '
    + 'is faster than session 1 on both tiers. But reliance does <b>not</b> become better targeted with experience: the '
    + 'tendency to take cards on big missions and go manual on small ones is no sharper in session 2, and operators do '
    + 'not learn to avoid the weaker card.');
  if (X && X.learning) {
    const LN = X.learning;
    const g = h('div', { class: 'grid2' }, s);
    const ca = card(g, 'A · Faster: seconds spent per strategic decision, beyond the forced card reveal');
    lineChart(h('div', { class: 'chart' }, ca), [1, 2].map(rn => ({ label: 'Session ' + rn,
      color: rn === 1 ? css('--mark-soft') : css('--s-strat'),
      points: LN.speed.filter(x => x.run === rn).map(x => ({ x: x.minute + 1, y: x.median, n: x.n })) })),
      { yMax: 14, yTicks: [0, 5, 10], xLabel: 'minute of the 8-minute session', yFmt: v => num(v, 0) + ' s', height: 230 });
    h('p', { class: 'cap', html: `Median per minute. Within a session the extra time falls by about `
      + `${num(-LN.slopePerMin, 2)} s every minute (${pv(LN.slopeP)}), and session 2 starts where session 1 ended.` }, ca);
    const cb = card(g, 'B · Not better targeted: card uptake on small vs big missions');
    const cell = (rn, k) => LN.cells.find(c => c.run === rn && c.types === k) || {};
    barsGrouped(h('div', { class: 'chart' }, cb), ['Session 1', 'Session 2'], [
      { label: 'single-type missions', color: css('--mark-soft'), values: [cell(1, 1).rate, cell(2, 1).rate],
        subs: [`n = ${cell(1, 1).n}`, `n = ${cell(2, 1).n}`] },
      { label: 'three-type missions', color: css('--s-strat'), values: [cell(1, 3).rate, cell(2, 3).rate],
        subs: [`n = ${cell(1, 3).n}`, `n = ${cell(2, 3).n}`] }], { max: 1, fmt: v => pct(v, 0), height: 230 });
    legend(cb, [{ label: 'single-type (small)', color: css('--mark-soft') }, { label: 'three-type (big)', color: css('--s-strat') }]);
    h('p', { class: 'cap', html: `If practice taught people <i>when</i> to rely, the gap between the bars would widen in `
      + `session 2. It does not: ${pct(LN.gap1, 0)} in session 1, ${pct(LN.gap2, 0)} in session 2 — if anything narrower, but `
      + `not reliably (${pv(LN.interaction.p)}). Of the ${LN.persons.length} operators who met both kinds of mission in both `
      + `sessions, ${LN.sharper} got sharper and ${LN.blunter} blunter.` }, cb);
    para(s, '<b>What this means.</b> Practice changes <i>how fast</i> operators work, not <i>what</i> they hand over. Each '
      + 'person’s split between big jobs (to the assistant) and small ones (by hand) is set from the start and stays put; '
      + 'what improves is execution. That fits theme 1 — reliance is a stable personal style — and suggests that training '
      + 'aimed at calibration would need to target the decision rule itself, because experience alone does not move it.');
  }
  strand(s, 'In what they said');
  codeBars(s, ['C22']);
  para(s, `${xOf('C22')} said they got better, faster or more confident with practice.`);
  strand(s, 'In their words');
  quotesFor(s, 'learning');
  together(s, 'Operators are right that they improved — <b>in speed</b>. The improvement they cannot see in themselves '
    + 'is that their judgement of when to rely did not change.');
}

/* ───────────────────────── 12 · attitudes and asks ───────────────────────── */
{
  register('t-asks', '<b>Operators want a human in charge and more information</b>: failure data, reasoning, and more options.');
  const s = theme('t-asks', 12, 'What operators want: a human in charge, and more to go on', 'suggestive');
  strand(s, 'In what they said');
  codeBars(s, ['C25', 'C26', 'C27', 'C08', 'C28']);
  para(s, `${xOf('C25')} said a human should keep the final decision, ${xOf('C26')} wanted to see the assistant’s reasoning, `
    + `${xOf('C27')} wanted failure probabilities or performance data to decide with, ${xOf('C08')} wanted more than two `
    + `options, and ${xOf('C28')} wanted more automation.`);
  strand(s, 'In their words');
  quotesFor(s, 'asks');
  strand(s, 'In the logs');
  para(s, 'Views about AI authority do not predict behaviour here (the delegation and attitude scales are null against '
    + 'every reliance measure), so these are <b>design requirements</b> rather than explanations of what people did.');
}

/* ───────────────────────── method ───────────────────────── */
{
  const s = section('method', 'Method', 'Where every number comes from');
  const t = h('table', { class: 'method' }, card(s));
  const tb = h('tbody', {}, t);
  [
    ['Behavioural results', 'Event logs of all 33 participants (P09 excluded): the synthesis page, the findings brief, and two analysis rounds. Round 1 tested ten pre-registered hypotheses; round 2 explored 817 variants with one false-discovery correction and robustness gates. Strength labels follow those results.'],
    ['Questionnaires', 'Post-session trust (six statements per assistant, 1–7) and NASA-TLX; pre-study AI-attitude batteries.'],
    ['Qualitative counts', `Every debrief (26) and post-study interview (16) — ${NQ} participants in all — coded once against a 28-code codebook written before coding and tied to these findings (docs/analysis/qual/CODEBOOK.md). Counts are people, not mentions. A statement made only as a bare “yes” to a leading question is flagged in the evidence file.`],
    ['Tier preference', 'Reused from the round-2 coding (docs/analysis/round2/wE_codes.csv), with the researcher’s ruling that complexity-dependent use counts as conditional.'],
    ['Follow-ups for this page', 'scripts/analysis_combined/extras.py → docs/analysis/combined/extras.json: the style fingerprint (nearest-neighbour matching of session profiles, permutation null), deep queues (within-person GEE), giving up, and the per-assistant flaw event study. In-play remarks were found by keyword in the session recordings’ machine transcripts (no speaker separation) and every candidate read in context before coding; researcher speech excluded. Exploratory, after rounds 1–2.'],
    ['Limits', 'Single coding pass by an AI coder: counts are indicative until a human second coder checks them. Debriefs are post-session, not aligned to individual decisions. A convenience sample of 33, mostly computing postgraduates.'],
  ].forEach(([k, v]) => { const tr = h('tr', {}, tb); h('td', { html: `<b>${k}</b>` }, tr); h('td', { text: v }, tr); });
}

/* Every section folds: by default only its heading shows. Clicking a heading toggles it; a summary link opens its
   theme; the buttons open or close everything. */
const SECS = [...document.querySelectorAll('main > section')];
SECS.forEach(sec => {
  sec.classList.add('fold', 'closed');
  const hd = sec.querySelector('.sec-head');
  hd.setAttribute('role', 'button'); hd.tabIndex = 0;
  const toggle = () => sec.classList.toggle('closed');
  hd.addEventListener('click', toggle);
  hd.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
});
const foldBar = h('div', { class: 'btnrow foldbar' });
main.insertBefore(foldBar, SECS[0] || null);
[['Open all themes', false], ['Close all', true]].forEach(([t, closed]) => {
  const b = h('button', { text: t }, foldBar); b.onclick = () => SECS.forEach(x => x.classList.toggle('closed', closed)); });
const openHash = () => { const t = location.hash && document.getElementById(location.hash.slice(1));
  if (t && t.classList.contains('fold')) { t.classList.remove('closed'); t.scrollIntoView(); } };
window.addEventListener('hashchange', openHash);
setTimeout(openHash, 0);

/* summary list, now that every theme has registered */
SUMMARY.forEach(([id, text]) => { const li = h('li', {}, sumList); li.innerHTML = `<a href="#${id}">${text}</a>`; });

/* — theme toggle — */
$('t-light').onclick = () => document.documentElement.setAttribute('data-theme', 'light');
$('t-dark').onclick = () => document.documentElement.setAttribute('data-theme', 'dark');
</script>
</body>
