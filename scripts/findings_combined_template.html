<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combined findings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Generated by scripts/build_findings_synthesis.py from scripts/findings_combined_template.html.
   Edit the TEMPLATE, never the generated page. Quantitative numbers come from the synthesis payload and
   the round-1/2 results files; qualitative counts and excerpts from docs/analysis/qual/. */
/*__COMMON_CSS__*/
main { max-width: 940px; }
h2 { font-size: 23px; }
section { margin-top: 46px; }
.chip { display: inline-block; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase;
  border-radius: 4px; padding: 2px 7px; color: #fff; white-space: nowrap; vertical-align: 3px; margin-left: 8px; }
.chip.strong { background: var(--good); }
.chip.moderate { background: var(--s-strat); }
.chip.suggestive { background: var(--warn); }
.chip.disagree { background: var(--bad); }
.strand { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
  margin: 18px 0 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.together { background: var(--hi); border-radius: 6px; padding: 10px 14px; margin: 14px 0 0; font-size: 14.5px; max-width: 78ch; }
.together b { color: var(--ink); }
.caveat { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--warn); padding: 4px 0 4px 12px; margin: 10px 0 0; max-width: 74ch; }
ul.tight { margin: 6px 0 0; padding-left: 20px; max-width: 78ch; }
ul.tight li { margin: 6px 0; }
ul.tight a { color: var(--ink); text-decoration: none; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.tile .v { font-size: 26px; }
table.method td { text-align: left; vertical-align: top; font-size: 13.5px; }
.btnrow { display: flex; gap: 6px; margin: 0 0 6px; }
.btnrow button { font: 500 12px var(--mono); padding: 4px 10px; border-radius: 5px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-2); cursor: pointer; }
.btnrow button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
</style>
</head>
<body>
<div class="themebar"><button id="t-light">light</button><button id="t-dark">dark</button></div>
<div id="tip" role="status" aria-live="polite"></div>
<main id="main"></main>

<script>
const DATA = /*__DATA__*/null;
/*__COMMON_JS__*/

/* ───────────────────────── combined page ───────────────────────── */
const I = DATA.individual, R1 = DATA.round1, R2 = DATA.round2, QL = DATA.qual;
const H1 = R1 ? Object.fromEntries(R1.hypotheses.map(x => [x.id, x])) : {};
const F2 = R2 ? Object.fromEntries(R2.findings.map(x => [x.id, x])) : {};
const NQ = QL ? QL.n : 0;
const X = DATA.extras;   // follow-up analyses: scripts/analysis_combined/extras.py

const CODE_LABEL = {
  C01: 'Describes a consistent personal strategy', C02: 'Wants control / to do it themselves',
  C03: 'Small jobs myself, big jobs to the assistant', C04: 'Values the assistant for speed',
  C05: 'Works in parallel while it runs', C06: 'Finds the assistant slow',
  C07: 'Holds drones in reserve', C08: 'Wanted a middle ground / more options',
  C09: 'Edits the card as a first draft', C10: 'Tested the assistant against themselves',
  C11: 'Hands over when overloaded', C12: 'Noticed strategic over-allocation',
  C13: 'Noticed a tactical flaw', C14: 'Took the tactical plan without checking it',
  C15: 'Noticed more / grew careful later on', C16: 'Trust grew with experience',
  C17: 'Checks when cheap, skips under pressure', C18: 'Checked (nearly) everything',
  C19: 'Blames themselves for failures', C20: 'Blames the assistant for failures',
  C21: 'Aborts rather than repairs', C22: 'Got better with practice',
  C23: 'Believes the assistant improved results', C24: 'Believes they did better by hand',
  C25: 'A human should have the final say', C26: 'Wants the assistant’s reasoning',
  C27: 'Wants failure data / analytics', C28: 'Wants more automation',
};
const nOf = code => QL ? QL.counts[code] || 0 : 0;
const who = code => QL ? (QL.who[code] || []) : [];
const strictOf = code => QL ? new Set(QL.evidence.filter(e => e.code === code && !e.led).map(e => e.pid)).size : 0;
const xOf = code => `<b>${nOf(code)} of ${NQ}</b>` + (strictOf(code) < nOf(code) ? ` (${strictOf(code)} unprompted)` : '');

function chipH(level) { return `<span class="chip ${level}">${level === 'disagree' ? 'streams disagree' : level}</span>`; }
function theme(id, n, title, level) {
  const s = section(id, 'Theme ' + n, '');
  s.querySelector('h2').innerHTML = title + chipH(level);
  return s;
}
const strand = (host, text) => h('div', { class: 'strand', text }, host);
function together(host, html) { h('div', { class: 'together', html: '<b>Together.</b> ' + html }, host); }
function caveat(host, html) { h('div', { class: 'caveat', html: '<b>Caveat.</b> ' + html }, host); }

/* Bar per code: how many of the 33 said it. Hover lists who. */
function codeBars(host, codes, title) {
  const c = card(host, title || `How many of the ${NQ} participants said so`);
  barsH(h('div', { class: 'chart' }, c), codes.map(k => ({
    label: CODE_LABEL[k], value: nOf(k) / NQ,
    sub: `${nOf(k)} of ${NQ}` + (strictOf(k) < nOf(k) ? `, ${strictOf(k)} without a leading question` : '')
      + `<br>${who(k).join(', ') || 'nobody'}` })),
    { max: 1, padL: 290, rowH: 28, fmt: v => Math.round(v * NQ) + ' / ' + NQ });
  return c;
}

/* Two bars per row, horizontal, so long labels stay readable. rows: {label, a, b, aSub, bSub}. */
function pairBarsH(host, rows, o = {}) {
  const W = 700, rowH = o.rowH || 40, padL = o.padL || 250, padR = 70, padT = 6, bh = 12;
  const H = padT + rows.length * rowH + 22;
  const svg = svgRoot(host, W, H);
  const lo = o.min != null ? o.min : Math.min(0, ...rows.flatMap(r => [r.a, r.b]));
  const hi = o.max != null ? o.max : Math.max(...rows.flatMap(r => [r.a, r.b])) * 1.08;
  const x = v => padL + (W - padL - padR) * ((v - lo) / (hi - lo));
  const fmt = o.fmt || (v => num(v, 2));
  (o.ticks || []).forEach(v => {
    el('line', { x1: x(v), x2: x(v), y1: padT, y2: H - 20, stroke: css('--grid') }, svg);
    el('text', { x: x(v), y: H - 6, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5,
                 'font-family': css('--mono') }, svg).textContent = fmt(v);
  });
  rows.forEach((r, i) => {
    const y = padT + i * rowH;
    el('text', { x: padL - 10, y: y + rowH / 2 + 4, 'text-anchor': 'end', fill: css('--ink-2'),
                 'font-size': 12.5 }, svg).textContent = r.label;
    [['a', 0], ['b', 1]].forEach(([k, j]) => {
      const v = r[k];
      if (v == null) return;
      const se = o.series[j], by = y + rowH / 2 - bh - 1 + j * (bh + 2);
      el('rect', { x: Math.min(x(0), x(v)), y: by, width: Math.abs(x(v) - x(0)), height: bh, rx: 3, fill: se.color }, svg);
      const t = el('text', { x: (v >= 0 ? x(v) + 6 : x(v) - 6), y: by + bh - 2, 'text-anchor': v >= 0 ? 'start' : 'end',
                             fill: css('--ink-2'), 'font-size': 11, 'font-family': css('--mono') }, svg);
      t.textContent = fmt(v);
      const hit = el('rect', { x: padL, y: by - 1, width: W - padL - padR, height: bh + 2, fill: 'transparent' }, svg);
      hoverable(hit, `<b>${r.label}</b><br>${se.label}: ${fmt(v)}${r[k + 'Sub'] ? '<br>' + r[k + 'Sub'] : ''}`);
    });
  });
  el('line', { x1: x(0), x2: x(0), y1: padT, y2: H - 20, stroke: css('--line'), 'stroke-width': 1.2 }, svg);
}

/* colour between two hex tokens */
function mixHex(c1, c2, t) {
  const a = c1.replace('#', ''), b = c2.replace('#', '');
  const ch = (h, i) => parseInt(h.substr(i, 2), 16);
  return '#' + [0, 2, 4].map(i => Math.round(ch(a, i) + (ch(b, i) - ch(a, i)) * Math.max(0, Math.min(1, t)))
    .toString(16).padStart(2, '0')).join('');
}

/* Style map: one dot per session, a line joining each operator's two sessions. */
function styleMap(host, pts, mode) {
  host.innerHTML = '';
  const W = 700, H = 440, pad = 34;
  const svg = svgRoot(host, W, H);
  const xk = mode === 'tsne' ? 'tx' : 'px', yk = mode === 'tsne' ? 'ty' : 'py';
  const xs = pts.map(p => p[xk]), ys = pts.map(p => p[yk]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const sx = v => pad + (W - 2 * pad) * (v - x0) / (x1 - x0 || 1);
  const sy = v => H - pad - (H - 2 * pad) * (v - y0) / (y1 - y0 || 1);
  const rels = pts.map(p => p.rel), rlo = Math.min(...rels), rhi = Math.max(...rels);
  const col = v => mixHex(css('--s-tac'), css('--s-strat'), (v - rlo) / (rhi - rlo || 1));
  const byPid = {};
  pts.forEach(p => (byPid[p.pid] = byPid[p.pid] || []).push(p));
  const lines = {}, dots = {};
  Object.entries(byPid).forEach(([pid, ps]) => {
    if (ps.length === 2) lines[pid] = el('line', { x1: sx(ps[0][xk]), y1: sy(ps[0][yk]), x2: sx(ps[1][xk]), y2: sy(ps[1][yk]),
      stroke: css('--mark-soft'), 'stroke-width': 1.2, opacity: .8 }, svg);
  });
  const fmtF = (k, v) => v == null ? '—' : (['took', 'preempt', 'edit', 'consult', 'keep', 'recSug'].includes(k) ? pct(v, 0)
    : k === 'netSecs' ? num(Math.expm1(v), 1) + ' s' : num(v, 2));
  pts.forEach(p => {
    const c = el(p.run === 1 ? 'circle' : 'rect', p.run === 1
      ? { cx: sx(p[xk]), cy: sy(p[yk]), r: 6, fill: col(p.rel), stroke: css('--surface'), 'stroke-width': 1.5 }
      : { x: sx(p[xk]) - 5.5, y: sy(p[yk]) - 5.5, width: 11, height: 11, rx: 2, fill: col(p.rel), stroke: css('--surface'), 'stroke-width': 1.5 }, svg);
    (dots[p.pid] = dots[p.pid] || []).push(c);
    const lab = el('text', { x: sx(p[xk]) + 8, y: sy(p[yk]) + 4, fill: css('--ink-3'), 'font-size': 9.5,
                             'font-family': css('--mono'), opacity: 0 }, svg);
    lab.textContent = p.pid;
    (dots[p.pid + ':lab'] = dots[p.pid + ':lab'] || []).push(lab);
    const hit = el('circle', { cx: sx(p[xk]), cy: sy(p[yk]), r: 11, fill: 'transparent' }, svg);
    const feats = X.fingerprint.features.map(f => `${f.label}: <b>${fmtF(f.k, p[f.k])}</b>`).join('<br>');
    hoverable(hit, `<b>${p.pid} · session ${p.run}</b> (${p.game.replace('|', ' game ')})<br>reliance score ${sgn(p.rel, 2)}<br>${feats}`);
    hit.addEventListener('mouseenter', () => {
      if (lines[p.pid]) { lines[p.pid].setAttribute('stroke', css('--ink')); lines[p.pid].setAttribute('stroke-width', 2.4); }
      (dots[p.pid + ':lab'] || []).forEach(t => t.setAttribute('opacity', 1));
    });
    hit.addEventListener('mouseleave', () => {
      if (lines[p.pid]) { lines[p.pid].setAttribute('stroke', css('--mark-soft')); lines[p.pid].setAttribute('stroke-width', 1.2); }
      (dots[p.pid + ':lab'] || []).forEach(t => t.setAttribute('opacity', 0));
    });
  });
  el('text', { x: W - pad, y: H - 8, 'text-anchor': 'end', fill: css('--ink-3'), 'font-size': 10.5, 'font-family': css('--mono') }, svg)
    .textContent = mode === 'tsne' ? 't-SNE axes have no units' : 'PC1 (reliance) →';
  if (mode !== 'tsne') el('text', { x: 10, y: pad - 12, fill: css('--ink-3'), 'font-size': 10.5, 'font-family': css('--mono') }, svg)
    .textContent = '↑ PC2';
}

/* A remark made during play, from the session recording's machine transcript. */
function nq(host, pid, starts) {
  const q = X && X.narrationQuotes.find(x => x.pid === pid && x.text.startsWith(starts));
  if (!q) { h('p', { class: 'note', text: `missing narration: ${pid}` }, host); return; }
  const b = h('blockquote', {}, host);
  h('p', { text: '“' + q.text + '”' }, b);
  h('span', { class: 'attr', html: `<span class="pid">${q.pid}</span> · said during play, session ${q.run}, ${mmss(q.t)} in`
    + ' · machine transcript of the recording' }, b);
}

/* A verbatim excerpt from the coding evidence, found by participant, code and the start of the text. */
function ev(host, pid, code, starts) {
  if (!QL) return;
  const flat = t => t.replace(/[\u2018\u2019]/g, "'");
  const e = QL.evidence.find(x => x.pid === pid && x.code === code && x.source === 'debrief'
      && (!starts || flat(x.text).startsWith(flat(starts))))
    || QL.evidence.find(x => x.pid === pid && x.code === code);
  if (!e) { h('p', { class: 'note', text: `missing excerpt: ${pid} ${code}` }, host); return; }
  const b = h('blockquote', {}, host);
  h('p', { text: '“' + e.text + '”' }, b);
  h('span', { class: 'attr', html: `<span class="pid">${e.pid}</span> · post-session debrief`
    + (e.at ? ', ' + e.at : '') + ` · coded ${CODE_LABEL[code].toLowerCase()}` + (e.led ? ' · answering a direct question' : '') }, b);
}

/* Quotes per theme: [participant, code, start of the excerpt]. Debrief excerpts only (the interview files are
   the researcher's notes, not verbatim speech), chosen from evidence that matches the transcript word for word. */
const QUOTES = {
  person:   [['P11', 'C02', "I don't want to be reduced"], ['P22', 'C01', 'So I felt comfortable assessing'],
             ['P21', 'C01', 'So technically, with the way']],
  size:     [['P11', 'C03', 'either it'], ['P29', 'C03', 'But when it was just one color']],
  speed:    [['P31', 'C04', 'The top advantage'], ['P11', 'C05', 'But I'], ['P27', 'C06', 'So, when we are trying']],
  load:     [['P11', 'C11', 'And each task had'], ['P20', 'C11', 'You can have a lot of tasks'], ['P33', 'C11', 'I think the first one']],
  manual:   [['P24', 'C07', 'Yeah, because I want to save'], ['P17', 'C08', 'But whenever I clicked manual'],
             ['P19', 'C09', 'it'], ['P29', 'C10', 'I did kind of want to test']],
  tiers:    [['P21', 'C12', 'I mean, it was giving me'], ['P22', 'C14', 'I felt like I just kind of had to take'],
             ['P31', 'C13', 'you']],
  check:    [['P31', 'C17', 'in the very beginning'], ['P14', 'C18', 'But in the tactical interface'], ['P35', 'C17', 'I will choose to just trust']],
  trust:    [['P19', 'C15', 'I will say, in this case'], ['P15', 'C15', 'the second round'], ['P26', 'C16', 'I think with more successful']],
  recovery: [['P19', 'C19', 'There were some drone failures'], ['P18', 'C20', 'I think in the first round'], ['P28', 'C21', 'So if I only send']],
  payoff:   [['P31', 'C23', 'if you were to challenge'], ['P29', 'C23', 'And even if like maybe'], ['P11', 'C04', 'I think even if the tactical']],
  learning: [['P10', 'C22', 'there was definitely an improvement'], ['P30', 'C22', 'i think it was easier']],
  asks:     [['P24', 'C25', 'I really trust AI'], ['P32', 'C27', "I'd want more analytics"], ['P36', 'C08', 'and then a human'],
             ['P13', 'C28', 'Honestly, I think I am doing']],
};
const PICK = typeof QUOTES === 'object' ? QUOTES : {};
function quotesFor(host, key) { (PICK[key] || []).forEach(([pid, code, starts]) => ev(host, pid, code, starts)); }

/* — masthead — */
h('div', { class: 'kicker', text: 'Human–autonomy trust study · combined findings' }, main);
h('h1', { text: 'What operators did, and what they said about it' }, main);
h('p', { class: 'lede', html: 'Everything the study can stand behind, theme by theme, with the logs and the '
  + 'interviews side by side. Each theme gives the <b>behavioural result</b>, then <b>how many of the '
  + `${NQ || 33} participants said something about it</b>, then a few of their own words, and finally whether `
  + 'the two agree. Underlined terms explain themselves on hover.' }, main);
const ban = h('div', { class: 'banner' }, main);
ban.innerHTML = '<b>Identifiable data — do not circulate.</b> Contains verbatim participant speech. Sources: '
  + '<code>findings_synthesis.html</code>, <code>analysis_round1.html</code>, <code>analysis_round2.html</code>, '
  + '<code>docs/analysis/qual/</code>.';
h('p', { class: 'meta', text: `${C.n.participants} participants, ${C.n.decisions} strategic decisions · qualitative `
  + `coding of ${NQ} participants’ debriefs and interviews · page generated ${DATA.generated}` }, main);
if (!QL) h('p', { class: 'warnline', text: 'Qualitative coding not found (docs/analysis/qual/) — counts and quotes are missing.' }, main);

const sumCard = card(main, 'The story in brief');
const SUMMARY = [];   // filled as themes register themselves, so the list always matches the page
const sumList = h('ol', { class: 'tight' }, sumCard);

const strengthKey = card(main, 'How to read the labels');
h('p', { html: `${chipH('strong')} robust across checks · ${chipH('moderate')} holds with a real caveat · `
  + `${chipH('suggestive')} worth following up · ${chipH('disagree')} what people said and what they did point `
  + 'different ways — itself a finding. Counts are participants, not mentions, and come from a single coding '
  + 'pass of every transcript (see Method).' }, strengthKey);

function register(id, text) { SUMMARY.push([id, text]); }

/* ───────────────────────── 1 · the person ───────────────────────── */
{
  register('t-person', '<b>Reliance is mostly about who the operator is</b>: each person has a recognisable style — a fingerprint, not a type — and none of the attitudes we measured explains it.');
  const s = theme('t-person', 1, 'Reliance is mostly about who the operator is', 'strong');
  strand(s, 'In the logs');
  const q = I.rates.q;
  para(s, `Card uptake ranges from <b>${pct(q[0], 0)} to ${pct(q[4], 0)}</b> across operators, and each person’s rate `
    + `carries over from session 1 to session 2 even though the scenario changed (${gl('rho')} = <b>${num(I.stability.took.rho, 2)}</b>). `
    + `Knowing who is deciding explains about <b>${pct(I.r2.person, 0)}</b> of whether a card is taken; everything about the `
    + `mission, scenario and timing together explains <b>${pct(I.r2.mission, 0)}</b>. Behaviour falls on <b>one continuous `
    + 'axis of reliance across all three tiers</b> — not distinct types — and the habit of deciding before the advice '
    + `even loads is itself a stable personal trait (session 1 vs 2 ρ = <b>.56</b>; 15 of 33 never did it).`);
  slopes(h('div', { class: 'chart' }, card(s, 'Each operator’s card uptake, session 1 → session 2')),
    C.learning.perPerson.filter(x => x.r1 != null && x.r2 != null).map(x => ({ label: x.pid, a: x.r1, b: x.r2 })),
    { aLabel: 'Session 1', bLabel: 'Session 2', height: 220 });
  para(s, `None of the ${DP.nTests} tests of measured disposition survives correction, and attitude to AI does not `
    + `predict card-taking (odds ×${R1 ? '0.80' : '—'} per SD) — though with almost no AI sceptics in the sample (AIAS-4 averages `
    + `${num(DP.batteries[0].mean, 1)}/10) only a very large effect could have shown.`);
  if (X && X.fingerprint) {
    const FP = X.fingerprint, A = FP.all, B = FP.beyond, RO = FP.relianceOnly;
    h('h3', { text: 'Is there a personal style beyond how much someone relies?' }, s);
    para(s, `Round 1 found no operator <i>types</i>: the behaviour does not fall into groups. This asks a weaker question that `
      + `needs no groups: <b>is each person’s whole pattern of behaviour distinctive enough to pick them out?</b> Each session `
      + `becomes a profile of ${FP.features.length} behaviours (listed under the map), each scored against everyone who played the `
      + `<b>same game</b>, so the game’s own demands are taken out. Then each operator’s session-1 profile is compared with all `
      + `${FP.n} session-2 profiles.`);
    tiles(s, [
      { v: `${A.hitsAB} / ${FP.n}`, k: 'operators whose nearest session-2 profile is their own', s: `chance ≈ 1 · ${pv(A.pHit)}` },
      { v: num(A.meanRank, 1), k: `average rank of their own session 2, out of ${FP.n}`, s: `chance ${num(A.nullRank, 0)}` },
      { v: `${B.hitsAB} / ${FP.n}`, k: 'still matched with the reliance axis removed', s: pv(B.pHit) },
      { v: `${RO.hitsAB} / ${FP.n}`, k: 'matched on reliance alone', s: pv(RO.pHit) },
    ]);
    s.querySelectorAll('.tile .s').forEach(n => { n.innerHTML = n.textContent; });
    para(s, `<b>A style is detectable, and it is not just reliance.</b> The nearest match is the same person ${A.hitsAB} times in `
      + `${FP.n} (${A.hitsBA} the other way round), against about once by chance (${pv(A.pHit)}, 10,000 shuffles of who is who). `
      + `Removing the reliance axis from every profile leaves the match rate where it was (${B.hitsAB} of ${FP.n}, ${pv(B.pHit)}), `
      + `while reliance on its own matches only ${RO.hitsAB}. So operators carry a recognisable <b>combination</b> of habits from `
      + `one session to the next — how often they press Suggest, whether they keep its plan, whether they edit cards, how long `
      + `they deliberate. But it is a <b>fingerprint, not a type</b>: it tells individuals apart well above chance without sorting `
      + `them into groups, and for most people their own session is a near neighbour rather than the nearest.`);
    const cm = card(s, 'Style map: each dot is a session, each line joins one operator’s two sessions');
    const bar = h('div', { class: 'btnrow' }, cm);
    const host = h('div', { class: 'chart' }, cm);
    const draw = mode => { styleMap(host, FP.points, mode); bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === mode)); };
    [['tsne', 't-SNE (neighbourhoods)'], ['pca', 'PCA (reliance across)']].forEach(([m, t]) => {
      const b = h('button', { text: t }, bar); b.dataset.m = m; b.onclick = () => draw(m); });
    draw('tsne');
    legend(cm, [{ label: 'low reliance', color: css('--s-tac') }, { label: 'high reliance', color: css('--s-strat') },
                { label: '● session 1   ■ session 2', color: 'transparent' }]);
    h('p', { class: 'cap', html: `Short lines mean an operator behaved alike in both sessions. On the t-SNE map a person’s two `
      + `sessions sit at about <b>${pct(FP.mapPairRatio, 0)}</b> of the typical distance between different people. t-SNE only keeps `
      + `neighbourhoods, so its distances and axes mean nothing on their own — the map is a picture of the test above, not the `
      + `test. Hover a dot for the person’s profile. Behaviours: ${FP.features.map(f => f.label.toLowerCase()).join('; ')}.` }, cm);
    const cr = card(s, 'Which habits carry over from session 1 to session 2 (Spearman ρ)');
    legend(cr, [{ label: 'as measured', color: css('--mark') }, { label: 'with the reliance axis removed', color: css('--lad-2') }]);
    pairBarsH(h('div', { class: 'chart' }, cr), FP.retest.map(r => ({ label: r.label, a: r.rho, b: r.rhoBeyond,
      aSub: `ρ = ${num(r.rho, 2)}, ${pv(r.p)}`, bSub: `ρ = ${num(r.rhoBeyond, 2)}, ${pv(r.pBeyond)}` })),
      { series: [{ label: 'as measured', color: css('--mark') }, { label: 'reliance removed', color: css('--lad-2') }],
        min: -0.4, max: 1, ticks: [-0.25, 0, 0.25, 0.5, 0.75, 1], padL: 270 });
    h('p', { class: 'cap', html: 'Every habit except trimming drones on single-type missions carries over, most of them '
      + 'about as strongly once reliance is taken out. Hover a bar for its p-value.' }, cr);
    caveat(s, `Exploratory, run after rounds 1–2. ${Object.values(FP.imputed).reduce((a, b) => a + b, 0)} of `
      + `${FP.nSessions * FP.features.length} session values could not be computed (e.g. no manual choices to time) and filled with the `
      + 'game median, which can only make people look more alike. The same people play both sessions under different '
      + 'scenarios, so a match cannot come from playing the same game twice.');
  }
  strand(s, 'In what they said');
  codeBars(s, ['C01', 'C02']);
  para(s, `${xOf('C01')} described a consistent personal strategy that governed how they used the assistants. `
    + `Wanting control for its own sake is rare: ${xOf('C02')} (P11) said so explicitly.`);
  strand(s, 'In their words');
  quotesFor(s, 'person');
  together(s, 'Both streams point at the person. Operators describe their reliance as a <b>strategy of their own</b>, and the '
    + 'logs show a <b>stable, individual style</b> — detectable from behaviour alone and broader than reliance — but no '
    + 'questionnaire or prior experience tells us whose style will be which.');
}

/* ───────────────────────── 2 · job size ───────────────────────── */
{

    + `multiplies the odds of taking a card by <b>×${Math.exp(I.within.ncolours.b).toFixed(2)}</b>. The same holds on the `

    { v: '×' + (L.parallelX || '—'), k: 'more likely to open the next mission while a plan fills in', s: 'with Suggest' },

    + 'where deciding by hand before the cards even load is quickest. Suggest lets operators <b>work in parallel</b>: '

/* ───────────────────────── 4 · load ───────────────────────── */
{
  register('t-load', `<b>Being busy does not push people onto the assistant</b> — even though ${nOf('C11')} of ${NQ} say it does.`);

  strand(s, 'In the logs');
  const L = R1 ? R1.load : {};

    + `no effect — and the test could have caught one as small as ×${L.detectable || '—'}. Round 2 tried five other measures `
    + 'of pressure, the final 90 seconds, the tactical tier, and moments of spoken overload in the narration: <b>none '
    + 'shows reliance rising under load</b>. What looked like it (Suggest use rising with a backlog) is practice: it '
    + 'disappears once time in the session is held fixed.');

    const c = card(s, 'Reliance by how many other missions were waiting when the decision opened');
    legend(c, [{ label: 'Strategic: card taken', color: css('--s-strat') }, { label: 'Tactical: Suggest pressed', color: css('--s-tac') }]);
    barsGrouped(h('div', { class: 'chart' }, c), ST.bins.map(b => b.label + ' waiting'),
      [{ label: 'Strategic: card taken', color: css('--s-strat'), values: ST.bins.map(b => b.rate),
         subs: ST.bins.map(b => `n = ${b.n} decisions from ${b.people} people`) },
       { label: 'Tactical: Suggest pressed', color: css('--s-tac'), values: TA.bins.map(b => b.rate),
         subs: TA.bins.map(b => `n = ${b.n} plans from ${b.people} people`) }],
      { max: 1, fmt: v => pct(v, 0), height: 220 });
    h('p', { class: 'cap', text: 'Raw rates, not adjusted for mission size or practice; the tests below are.' }, c);
    const one = ST.byType.filter(r => r.types === 1);
    para(s, `Deep queues are common, not a corner case: <b>${ST.nHi} of ${ST.nDecisions} strategic decisions (${pct(ST.shareHi, 0)})</b> `
      + `were made with four or more other missions waiting, by ${ST.peopleHi} of 33 operators, and ${TA.nHi} of ${TA.nDecisions} `
      + `tactical plans (${TA.peopleHi} operators). Comparing each operator with themselves, a deep queue <b>does not raise `
      + `reliance on either tier</b>: card-taking odds ×${num(ST.within.OR, 2)} [${num(ST.within.lo, 2)}, ${num(ST.within.hi, 2)}], `
      + `${pv(ST.within.p)} (${ST.higher} operators took cards more often at 4+, ${ST.lower} less); Suggest odds `
      + `×${num(TA.within.OR, 2)} [${num(TA.within.lo, 2)}, ${num(TA.within.hi, 2)}], ${pv(TA.within.p)}. On single-type missions `
      + `card-taking is if anything <b>lower</b> with a deep queue (${pct(one.find(r => r.hi === 1).rate, 0)} against `
      + `${pct(one.find(r => r.hi === 0).rate, 0)}), where deciding by hand before the cards load is quickest.`);
    para(s, `Between people the sign flips: operators who spend more of their time facing a deep queue rely <i>less</i> `
      + `(strategic ${pv(ST.between.p)}, tactical ${pv(TA.between.p)}). That is most likely the reverse direction — building by `
      + 'hand is slower, so manual operators accumulate their own queues — and it is why the within-person comparison is the test.');
  }

  codeBars(s, ['C11']);
  para(s, `${xOf('C11')} said they lean on the assistant more when busy, overwhelmed or rushed.`);
  strand(s, 'In their words');
  quotesFor(s, 'load');
  together(s, '<b>The streams disagree.</b> Handing over under pressure is an <b>account</b> more than a quarter of operators give, but not a '
    + 'visible <b>pattern</b> of it. The likely reconciliation is theme 2: busy sessions are also big-mission sessions, '
    + 'so people remember being busy when they handed over, when what they were responding to was job size.');
}

/* ───────────────────────── 5 · manual ───────────────────────── */

}

/* ───────────────────────── 7 · checking ───────────────────────── */
{

        SP.people.map(r => [r.pid, `session ${r.run}, ${mmss(Math.round(r.t))}`, r.gist,

      { label: 'Suggest pressed', color: css('--s-tac'),

    note(s, '<b>Correction to round 1.</b> Round 1 reported this blind spot as rare (11 presses, 8 operators) and said that 9 of '
      + 'the 11 operators who abandoned right after pressing Suggest had a working plan in front of them. Its rebuild of what '
      + 'Suggest could see missed tasks cut short by abandonment, so those drones looked free. Three operators reading '
      + '“No workable plan” aloud seconds after presses scored as successful gave it away. Corrected, <b>8 of those 11 had '
      + 'been refused</b>, and only 3 had a working plan. The round-1 test of Suggest and abandonment is unaffected; the '
      + 'corrections are logged in docs/analysis/round1/SUPERVISOR_LOG.md.');
  }
  strand(s, 'In what they said');
  codeBars(s, ['C15', 'C16', 'C12']);
  para(s, `${xOf('C15')} said they noticed the assistant’s errors more, or became more careful, later on; ${xOf('C16')} said `
    + `their trust grew with experience. ${xOf('C12')} noticed the strategic over-allocation at some point.`);
  strand(s, 'In their words');
  quotesFor(s, 'trust');
  together(s, `<b>Partial disagreement.</b> The few who talk about it (${nOf('C15')} of ${NQ}) describe noticing more or `
    + 'taking more care later on, which matches the falling ratings — but the decisions do not follow. Even operators who '
    + '<b>said out loud</b> that a card was wrong, or that Suggest could not plan, went on using both assistants at the same '
    + 'rate. A trust scale here <b>reads an operator’s view of the assistant more than it predicts their next choice</b>.');
}

/* ───────────────────────── 9 · recovery ───────────────────────── */
{
  register('t-recovery', '<b>In recovery, trying is what matters</b>: those who never try seem to believe a failed mission must be abandoned, and Suggest’s wrong “No workable plan” costs missions too.');
  const s = theme('t-recovery', 9, 'When a drone fails, trying is what matters', 'moderate');
  strand(s, 'In the logs');
  if (R1) {
    const rc = R1.recovery;
    barsH(h('div', { class: 'chart' }, card(s, 'Share of fixable failures that ended in abandonment')), [
      { label: 'Tried nothing', value: rc.noAttempt.abandoned / rc.noAttempt.n, sub: `${rc.noAttempt.abandoned} of ${rc.noAttempt.n}` },
      { label: 'Pressed Suggest', value: rc.suggest.abandoned / rc.suggest.n, sub: `${rc.suggest.abandoned} of ${rc.suggest.n}` },
      { label: 'Fixed by hand only', value: rc.handOnly.abandoned / rc.handOnly.n, sub: `${rc.handOnly.abandoned} of ${rc.handOnly.n}` },
    ], { max: 1, padL: 130, rowH: 32 });
  }
  para(s, '<b>Every fixable failure where nothing was tried was abandoned</b>; among attempted fixes, Suggest and fixing by '
    + 'hand do about equally well. Operators lower on the reliance trait attempt fewer fixes (ρ = .54, p = .001, between people). '
    + (X && X.flaws ? `Suggest itself loses some: in ${X.flaws.tactical.blindPresses} presses it wrongly answered “No workable plan” `
      + `(theme 8), and ${X.flaws.tactical.nextAfterBlind.abandon || 0} of those were followed straight away by abandoning a mission that `
      + 'chaining a busy drone would have saved.' : ''));
  if (X && X.givingUp) {
    const G = X.givingUp;
    h('h3', { text: 'Why do some operators give up? Is it that they did not understand?' }, s);
    para(s, `Leaving out failures in the last 31 seconds (too late to see an attempt), ${G.nAttempted} of ${G.nEpisodes} fixable `
      + `failures were attempted. ${G.allAttempt} of ${G.nPeople} operators attempted every one; <b>${G.neverAttempt.length} — `
      + `${G.neverAttempt.join(', ')} — never attempted any</b>, in either session (${G.neverEpisodes.n} failures between them, `
      + `${G.neverEpisodes.idleFixable} of which the idle drones alone could have fixed, so Suggest would have worked).`);
    const g2 = h('div', { class: 'grid2' }, s);
    barsH(h('div', { class: 'chart' }, card(g2, 'Attempt rate vs what each operator brought (Spearman ρ)')),
      G.correlates.map(r => ({ label: r.label.replace(' (pre-study, 5 items)', '').replace(' (PC1)', ''), value: Math.abs(r.rho),
        sub: `ρ = ${sgn(r.rho, 2)}, ${pv(r.p)}, n = ${r.n}`,
        color: r.p < 0.05 ? css('--mark') : css('--mark-soft') })),
      { max: 1, padL: 210, rowH: 28, fmt: v => num(v, 2) });
    barsH(h('div', { class: 'chart' }, card(g2, 'Attempt rate by how hard the fix was')),
      G.byDifficulty.map(r => ({ label: r.k.replace('needed a drone busy on another task', 'needed a busy drone').replace('idle drones could fix it', 'idle drones enough'),
        value: r.rate, sub: `n = ${r.n} failures` })), { max: 1, padL: 150, rowH: 34 });
    para(s, `What the data can rule in or out:`);
    const ul = h('ul', { class: 'tight' }, s);
    [
      `<b>Self-rated understanding cannot tell us.</b> Before the study every operator agreed they understood the task `
        + `(lowest average ${num(G.understandMin, 1)} of 7), so the scale has nowhere to go; it does not predict attempting `
        + `(${pv(G.correlates[0].p)}), nor do gaming or simulation experience. Only the reliance trait does (${pv(G.correlates[5].p)}).`,
      `<b>It is not a slow start that practice fixes.</b> Attempt rates are similar for an operator’s 1st, 2nd and later failures `
        + `(odds ×${num(G.nthModel.OR, 2)} per failure, ${pv(G.nthModel.p)}), and the never-attempters did not attempt in session 2 either.`,
      `<b>It is not that their failures were harder.</b> Harder failures (the fix needed a busy drone) were attempted less `
        + `(${pct(G.byDifficulty[0].rate, 0)} vs ${pct(G.byDifficulty[1].rate, 0)}, ${pv(G.difficultyFisherP)}), but the never-attempters’ `
        + `failures were almost all the easy kind.`,
      `<b>It is not a reflex.</b> An unattempted failure sat for a median of ${num(G.abandonWait.median, 0)} s before it was `
        + `abandoned, and ${G.abandonWait.over30} of ${G.abandonWait.n} sat over 30 s — time enough to try.`,
      `<b>What they said points at a mental model.</b> Two of the three (P15, P29) talk about a drone failure as something `
        + 'that <i>means</i> the mission has to be aborted, not as something to repair. The third, P24, was talked through the '
        + 'recovery options mid-session and still never attempted one.',
    ].forEach(t => { const li = h('li', {}, ul); li.innerHTML = t; });
    h('h4', { text: 'In their words, during play' }, s);
    nq(s, 'P15', 'fail this this mission');
    nq(s, 'P29', 'Well, I think I did it once');
    caveat(s, 'Three people. The likeliest reading — that a few operators left the tutorial believing a failure ends a mission — '
      + 'fits everything here but is not proven, and the study has no comprehension check that could test it. It is a '
      + 'plausible confound for the reliance–attempting link: if low-reliance operators also learned less from the '
      + 'tutorial, both would follow. A recovery question in the comprehension check would settle it next time.');
  }
  strand(s, 'In what they said');
  codeBars(s, ['C19', 'C20', 'C21']);
  para(s, `When missions failed, ${xOf('C19')} blamed their own choices and ${xOf('C20')} blamed the assistant; `
    + `${xOf('C21')} described aborting or re-sending a mission rather than repairing it.`);
  strand(s, 'In their words');
  quotesFor(s, 'recovery');
  together(s, `Few operators talk about blame at all (${nOf('C19')} themselves, ${nOf('C20')} the assistant), and only `
    + `${nOf('C21')} describe giving up on a mission rather than repairing it — yet in the logs, <b>not attempting a fix is `
    + 'what loses missions</b>. The operators who never try describe a failure as the end of the mission, which suggests a '
    + '<b>misunderstanding rather than a choice</b>. Two levers follow: <b>prompt an attempt</b>, and stop Suggest saying “No '
    + 'workable plan” when chaining a busy drone would work.');
}

/* ───────────────────────── 10 · performance ───────────────────────── */
{
  register('t-payoff', '<b>Better operators rely more; relying more does not make an operator better</b> — except in throughput.');
  const s = theme('t-payoff', 10, 'Better operators rely more; relying more does not make an operator better', 'moderate');
  strand(s, 'In the logs');
  tiles(s, [
    { v: '×3.06', k: 'odds of a mission completing for someone who always takes the card vs never', s: 'between people · p = .004' },
    { v: '×0.81', k: 'odds of a mission completing, same person, card vs manual', s: 'within person · p = .29' },
    { v: '−0.78', k: 'missions left never allocated per SD more reliance in a session', s: 'within person · q = .04' },
  ]);
  para(s, 'Comparing people, the more reliant complete more. Comparing each person with themselves, card missions do '
    + 'no better and <b>no performance measure rises</b> — but a more reliant session does <b>get more missions allocated</b>.');
  strand(s, 'In what they said');
  codeBars(s, ['C23', 'C24']);
  para(s, `${xOf('C23')} believed the assistant improved their results, and ${xOf('C24')} believed they did better by hand.`);
  strand(s, 'In their words');
  quotesFor(s, 'payoff');
  together(s, `Operators rarely judge the assistant on outcomes at all: only ${nOf('C23')} credit it with better results, `
    + `and <b>nobody claims to have done better by hand</b> (${nOf('C24')} of ${NQ}). What they do credit it with is speed `
    + '(theme 3) — and the logs agree that the benefit is <b>throughput, not better missions</b>.');
}

/* ───────────────────────── 11 · learning ───────────────────────── */
{
  register('t-learning', '<b>Operators get faster with practice</b> but do not get better at choosing when to rely.');
  const s = theme('t-learning', 11, 'Practice makes operators faster, not better calibrated', 'strong');
  strand(s, 'In the logs');
  para(s, 'Strategic decisions get <b>about 31% faster over an 8-minute session</b>, net of the forced waits, and session 2 '
    + 'is faster than session 1 on both tiers. But reliance does <b>not</b> become better targeted with experience: the '
    + 'tendency to take cards on big missions and go manual on small ones is no sharper in session 2, and operators do '
    + 'not learn to avoid the weaker card.');
  strand(s, 'In what they said');
  codeBars(s, ['C22']);
  para(s, `${xOf('C22')} said they got better, faster or more confident with practice.`);
  strand(s, 'In their words');
  quotesFor(s, 'learning');
  together(s, 'Operators are right that they improved — <b>in speed</b>. The improvement they cannot see in themselves '
    + 'is that their judgement of when to rely did not change.');
}

/* ───────────────────────── 12 · attitudes and asks ───────────────────────── */
{
  register('t-asks', '<b>Operators want a human in charge and more information</b>: failure data, reasoning, and more options.');
  const s = theme('t-asks', 12, 'What operators want: a human in charge, and more to go on', 'suggestive');
  strand(s, 'In what they said');
  codeBars(s, ['C25', 'C26', 'C27', 'C08', 'C28']);
  para(s, `${xOf('C25')} said a human should keep the final decision, ${xOf('C26')} wanted to see the assistant’s reasoning, `
    + `${xOf('C27')} wanted failure probabilities or performance data to decide with, ${xOf('C08')} wanted more than two `
    + `options, and ${xOf('C28')} wanted more automation.`);
  strand(s, 'In their words');
  quotesFor(s, 'asks');
  strand(s, 'In the logs');
  para(s, 'Views about AI authority do not predict behaviour here (the delegation and attitude scales are null against '
    + 'every reliance measure), so these are <b>design requirements</b> rather than explanations of what people did.');
}

/* ───────────────────────── method ───────────────────────── */
{
  const s = section('method', 'Method', 'Where every number comes from');
  const t = h('table', { class: 'method' }, card(s));
  const tb = h('tbody', {}, t);
  [
    ['Behavioural results', 'Event logs of all 33 participants (P09 excluded): the synthesis page, the findings brief, and two analysis rounds. Round 1 tested ten pre-registered hypotheses; round 2 explored 817 variants with one false-discovery correction and robustness gates. Strength labels follow those results.'],
    ['Questionnaires', 'Post-session trust (six statements per assistant, 1–7) and NASA-TLX; pre-study AI-attitude batteries.'],
    ['Qualitative counts', `Every debrief (26) and post-study interview (16) — ${NQ} participants in all — coded once against a 28-code codebook written before coding and tied to these findings (docs/analysis/qual/CODEBOOK.md). Counts are people, not mentions. A statement made only as a bare “yes” to a leading question is flagged in the evidence file.`],
    ['Tier preference', 'Reused from the round-2 coding (docs/analysis/round2/wE_codes.csv), with the researcher’s ruling that complexity-dependent use counts as conditional.'],
    ['Follow-ups for this page', 'scripts/analysis_combined/extras.py → docs/analysis/combined/extras.json: the style fingerprint (nearest-neighbour matching of session profiles, permutation null), deep queues (within-person GEE), giving up, and the per-assistant flaw event study. In-play remarks were found by keyword in the session recordings’ machine transcripts (no speaker separation) and every candidate read in context before coding; researcher speech excluded. Exploratory, after rounds 1–2.'],
    ['Limits', 'Single coding pass by an AI coder: counts are indicative until a human second coder checks them. Debriefs are post-session, not aligned to individual decisions. A convenience sample of 33, mostly computing postgraduates.'],
  ].forEach(([k, v]) => { const tr = h('tr', {}, tb); h('td', { html: `<b>${k}</b>` }, tr); h('td', { text: v }, tr); });
}

/* summary list, now that every theme has registered */
SUMMARY.forEach(([id, text]) => { const li = h('li', {}, sumList); li.innerHTML = `<a href="#${id}">${text}</a>`; });

/* — theme toggle — */
$('t-light').onclick = () => document.documentElement.setAttribute('data-theme', 'light');
$('t-dark').onclick = () => document.documentElement.setAttribute('data-theme', 'dark');
</script>
