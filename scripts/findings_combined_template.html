<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combined findings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Generated by scripts/build_findings_synthesis.py from scripts/findings_combined_template.html.
   Edit the TEMPLATE, never the generated page. Quantitative numbers come from the synthesis payload and
   the round-1/2 results files; qualitative counts and excerpts from docs/analysis/qual/. */
/*__COMMON_CSS__*/
main { max-width: 940px; }
h2 { font-size: 23px; }
section { margin-top: 46px; }
.chip { display: inline-block; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase;
  border-radius: 4px; padding: 2px 7px; color: #fff; white-space: nowrap; vertical-align: 3px; margin-left: 8px; }
.chip.strong { background: var(--good); }
.chip.moderate { background: var(--s-strat); }
.chip.suggestive { background: var(--warn); }
.chip.disagree { background: var(--bad); }
.strand { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
  margin: 18px 0 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.together { background: var(--hi); border-radius: 6px; padding: 10px 14px; margin: 14px 0 0; font-size: 14.5px; max-width: 78ch; }
.together b { color: var(--ink); }
.caveat { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--warn); padding: 4px 0 4px 12px; margin: 10px 0 0; max-width: 74ch; }
ul.tight { margin: 6px 0 0; padding-left: 20px; max-width: 78ch; }
ul.tight li { margin: 6px 0; }
ul.tight a { color: var(--ink); text-decoration: none; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.tile .v { font-size: 26px; }
table.method td { text-align: left; vertical-align: top; font-size: 13.5px; }
.btnrow { display: flex; gap: 6px; margin: 0 0 6px; flex-wrap: wrap; align-items: center; }
section.fold .sec-head { cursor: pointer; position: relative; padding-right: 34px; }
section.fold .sec-head::after { content: '−'; position: absolute; right: 6px; top: 22px; font: 500 22px var(--mono); color: var(--ink-3); }
section.fold.closed .sec-head::after { content: '+'; }
section.fold.closed > :not(.sec-head) { display: none; }
section.fold.closed { margin-top: 0; }
section.fold.closed .sec-head { margin-bottom: 0; padding-bottom: 14px; }
section.fold .sec-head:hover h2 { color: var(--s-strat); }
.foldbar { margin-top: 30px; }
.btnlab { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); width: 76px; }
.btnrow button { font: 500 12px var(--mono); padding: 4px 10px; border-radius: 5px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-2); cursor: pointer; }
.btnrow button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
</style>
</head>
<body>
<div class="themebar"><button id="t-light">light</button><button id="t-dark">dark</button></div>
<div id="tip" role="status" aria-live="polite"></div>
<main id="main"></main>

<script>
const DATA = /*__DATA__*/null;
/*__COMMON_JS__*/

/* ───────────────────────── combined page ───────────────────────── */
const I = DATA.individual, R1 = DATA.round1, R2 = DATA.round2, QL = DATA.qual;
const H1 = R1 ? Object.fromEntries(R1.hypotheses.map(x => [x.id, x])) : {};
const F2 = R2 ? Object.fromEntries(R2.findings.map(x => [x.id, x])) : {};
const NQ = QL ? QL.n : 0;
const X = DATA.extras;   // follow-up analyses: scripts/analysis_combined/extras.py

const CODE_LABEL = {
  C01: 'Describes a consistent personal strategy', C02: 'Wants control / to do it themselves',
  C03: 'Small jobs myself, big jobs to the assistant', C04: 'Values the assistant for speed',
  C05: 'Works in parallel while it runs', C06: 'Finds the assistant slow',
  C07: 'Holds drones in reserve', C08: 'Wanted a middle ground / more options',
  C09: 'Edits the card as a first draft', C10: 'Tested the assistant against themselves',
  C11: 'Hands over when overloaded', C12: 'Noticed strategic over-allocation',
  C13: 'Noticed a tactical flaw', C14: 'Took the tactical plan without checking it',
  C15: 'Noticed more / grew careful later on', C16: 'Trust grew with experience',
  C17: 'Checks when cheap, skips under pressure', C18: 'Checked (nearly) everything',
  C19: 'Blames themselves for failures', C20: 'Blames the assistant for failures',
  C21: 'Aborts rather than repairs', C22: 'Got better with practice',
  C23: 'Believes the assistant improved results', C24: 'Believes they did better by hand',
  C25: 'A human should have the final say', C26: 'Wants the assistant’s reasoning',
  C27: 'Wants failure data / analytics', C28: 'Wants more automation',
};
const nOf = code => QL ? QL.counts[code] || 0 : 0;
const who = code => QL ? (QL.who[code] || []) : [];
const strictOf = code => QL ? new Set(QL.evidence.filter(e => e.code === code && !e.led).map(e => e.pid)).size : 0;
const xOf = code => `<b>${nOf(code)} of ${NQ}</b>` + (strictOf(code) < nOf(code) ? ` (${strictOf(code)} unprompted)` : '');

function chipH(level) { return `<span class="chip ${level}">${level === 'disagree' ? 'streams disagree' : level}</span>`; }
function theme(id, n, title, level) {
  const s = section(id, 'Theme ' + n, '');
  s.querySelector('h2').innerHTML = title + chipH(level);
  return s;
}
const strand = (host, text) => h('div', { class: 'strand', text }, host);
function together(host, html) { h('div', { class: 'together', html: '<b>Together.</b> ' + html }, host); }
function caveat(host, html) { h('div', { class: 'caveat', html: '<b>Caveat.</b> ' + html }, host); }

/* Bar per code: how many of the 33 said it. Hover lists who. */
/* The averages of a group of participants: score, workload (raw NASA-TLX, 0–20) and post-session trust in
   each assistant (1–7), each the mean of a person's sessions. P01/P02 have no score (half task weights). */
const PS = DATA.personSummary || {};
const MEAN_SETS = {
  feel: { label: 'Outcome & feeling', cols: [['score', 'Score', v => num(v, 0)], ['rtlx', 'Workload', v => num(v, 1)],
                                            ['trustS', 'Trust S', v => num(v, 1)], ['trustT', 'Trust T', v => num(v, 1)]] },
  work: { label: 'Work rate', cols: [['tasks', 'Tasks', v => num(v, 1)], ['missions', 'Missions', v => num(v, 1)],
                                     ['alloc', 'Alloc/min', v => num(v, 2)], ['penalty', 'Penalty', v => num(v, 0)]] },
  use:  { label: 'Assistant use', cols: [['took', 'Cards', v => v == null ? '—' : pct(v, 0)],
                                         ['suggest', 'Suggest', v => v == null ? '—' : pct(v, 0)],
                                         ['decide', 'Decide s', v => num(v, 1)]] },
};
let MEAN_SET = 'feel';
const WHO_CHARTS = [];
function groupMeans(pids) {
  const m = k => { const v = pids.map(p => PS[p] && PS[p][k]).filter(x => x != null);
                   return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  return Object.fromEntries(Object.values(MEAN_SETS).flatMap(st => st.cols).map(([k]) => [k, m(k)]));
}
const ALL_PIDS = Object.keys(PS);

/* Bars of "X of N participants", each followed by that group's averages on the measure set picked above
   the chart (synced across the page). rows: {label, pids, sub}. The last row is everyone, for comparison. */
const GT = DATA.groupTests || {};
const stars = p => p == null ? '' : p < 0.001 ? '***' : p < 0.01 ? '**' : p < 0.05 ? '*' : p < 0.10 ? '†' : '';
function whoBars(host, rows, n) {
  const all = groupMeans(ALL_PIDS), COLS = MEAN_SETS[MEAN_SET].cols;
  const W = 780, rowH = 36, padL = 280, barW = 160, padT = 26;
  const H = padT + (rows.length + 1) * rowH + 10;
  const svg = svgRoot(host, W, H);
  const colX = COLS.map((_, i) => padL + barW + 78 + i * 64);
  const txt = (x, y, t, o = {}) => { const e = el('text', Object.assign({ x, y, fill: css('--ink-2'), 'font-size': 12,
    'font-family': css('--mono'), 'text-anchor': 'end' }, o), svg); e.textContent = t; return e; };
  txt(padL + barW + 12, 14, `of ${n}`, { 'text-anchor': 'start', fill: css('--ink-3'), 'font-size': 10.5 });
  COLS.forEach(([, lab], i) => txt(colX[i], 14, lab, { fill: css('--ink-3'), 'font-size': 10.5 }));
  const ALLC = Object.values(MEAN_SETS).flatMap(st => st.cols);
  const draw = (r, i, isAll) => {
    const y = padT + i * rowH, cy = y + rowH / 2, k = r.pids.length, g = isAll ? all : groupMeans(r.pids);
    const T = !isAll && r.key ? (GT[r.key] || {}) : {};
    el('text', { x: padL - 10, y: cy, 'text-anchor': 'end', fill: isAll ? css('--ink-3') : css('--ink-2'), 'font-size': 12.5,
                 'font-style': isAll ? 'italic' : 'normal' }, svg).textContent = r.label;
    el('rect', { x: padL, y: y + 10, width: barW, height: rowH - 20, rx: 3, fill: css('--surface-2') }, svg);
    el('rect', { x: padL, y: y + 10, width: barW * k / n, height: rowH - 20, rx: 3,
                 fill: isAll ? css('--mark-soft') : css('--mark') }, svg);
    txt(padL + barW + 12, cy, `${k}`, { 'text-anchor': 'start', 'font-weight': 600, fill: css('--ink') });
    COLS.forEach(([key, , fmt], j) => {
      const v = g[key], t = T[key], pp = t ? t.p : null;
      const colr = isAll || !k ? css('--ink-3') : pp != null && pp < 0.10 ? pColour(pp) : css('--ink-2');
      txt(colX[j], cy, k ? fmt(v) + stars(pp) : '—', { fill: colr, 'font-weight': pp != null && pp < 0.10 ? 700 : 400 });
      if (pp != null) txt(colX[j], cy + 12, pval(pp).replace('p ', ''), { fill: pp < 0.10 ? colr : css('--ink-3'), 'font-size': 9.5 });
    });
    const hit = el('rect', { x: 0, y, width: W, height: rowH, fill: 'transparent' }, svg);
    const tests = isAll ? '' : ALLC.map(([key, lab, fmt]) => T[key]
      ? `${lab}: ${fmt(T[key].inMean)} vs ${fmt(T[key].restMean)} for the other ${T[key].nRest} · ${pv(T[key].p)}` : '').filter(Boolean).join('<br>');
    hoverable(hit, `<b>${r.label}</b><br>${k} of ${n}${r.sub ? ' · ' + r.sub : ''}`
      + (isAll ? '' : `<br>${r.pids.join(', ') || 'nobody'}`) + (tests ? '<br>' + tests : '')
      + (isAll ? '<br>' + ALLC.map(([key, lab, fmt]) => `${lab} ${fmt(all[key])}`).join(' · ') : ''));
  };
  rows.forEach((r, i) => draw(r, i, false));
  draw({ label: `All ${n} participants`, pids: ALL_PIDS }, rows.length, true);
}
/* The switcher above each group chart. One choice drives every group chart on the page. */
function whoSwitch(host) {
  const bar = h('div', { class: 'btnrow' }, host);
  h('span', { class: 'btnlab', text: 'Show' }, bar);
  Object.entries(MEAN_SETS).forEach(([k, st]) => {
    const b = h('button', { text: st.label, class: k === MEAN_SET ? 'on' : '' }, bar);
    b.dataset.set = k;
    b.onclick = () => {
      MEAN_SET = k;
      WHO_CHARTS.forEach(f => f());
      document.querySelectorAll('.btnrow button[data-set]').forEach(x => x.classList.toggle('on', x.dataset.set === k));
    };
  });
}
const MEANS_CAP = 'After each bar, that group’s averages on the measures picked with the buttons above (the choice applies to '
  + 'every such chart on the page). <b>Outcome & feeling</b>: score (points per session; P01/P02 left out, they played on '
  + 'half task weights), workload (raw NASA-TLX, 0–20) and post-session trust in the Strategic (S) and Tactical (T) '
  + 'Assistant (1–7). <b>Work rate</b>: tasks and missions completed per session, missions allocated per minute, and '
  + 'waiting penalty per session. <b>Assistant use</b>: share of strategy cards taken, share of tactical plans where '
  + 'Suggest was pressed, and the median seconds a strategic decision took. Each person is averaged over their two '
  + 'sessions; the bottom row is everyone. Each number is tested against <b>everyone not in the group</b> (two-sided '
  + 'Mann–Whitney U); the p-value sits under it, coloured by threshold, with * < .05, ** < .01, *** < .001, † < .10. '
  + 'Work-rate and assistant-use measures are tested on <b>game-centred</b> values (each session minus the average for '
  + 'that game), because the four games differ almost twofold in load and which pair a person played depends on when '
  + 'they took part; the means shown are the raw ones. Hover a row for every measure. These are screening tests, '
  + 'uncorrected: across 28 codes × 11 measures about 15 would reach p < .05 by chance alone, so treat a lone asterisk '
  + 'as a lead, not a finding.';

function codeBars(host, codes, title) {
  const c = card(host, title || `How many of the ${NQ} participants said so`);
  whoSwitch(c);
  const box = h('div', { class: 'chart' }, c);
  const draw = () => whoBars(box, codes.map(k => ({
    label: CODE_LABEL[k], pids: who(k), key: k,
    sub: strictOf(k) < nOf(k) ? `${strictOf(k)} without a leading question` : '' })), NQ);
  draw();
  WHO_CHARTS.push(draw);
  h('p', { class: 'cap', html: MEANS_CAP }, c);
  return c;
}

const X2 = DATA.extras2;   // second follow-ups: scripts/analysis_combined/extras2.py

/* Two bars per row, horizontal, so long labels stay readable. rows: {label, a, b, aSub, bSub}. */
function pairBarsH(host, rows, o = {}) {
  const W = 700, rowH = o.rowH || 40, padL = o.padL || 250, padR = 70, padT = 6, bh = 12;
  const H = padT + rows.length * rowH + 22;
  const svg = svgRoot(host, W, H);
  const lo = o.min != null ? o.min : Math.min(0, ...rows.flatMap(r => [r.a, r.b]));
  const hi = o.max != null ? o.max : Math.max(...rows.flatMap(r => [r.a, r.b])) * 1.08;
  const x = v => padL + (W - padL - padR) * ((v - lo) / (hi - lo));
  const fmt = o.fmt || (v => num(v, 2));
  (o.ticks || []).forEach(v => {
    el('line', { x1: x(v), x2: x(v), y1: padT, y2: H - 20, stroke: css('--grid') }, svg);
    el('text', { x: x(v), y: H - 6, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5,
                 'font-family': css('--mono') }, svg).textContent = fmt(v);
  });
  rows.forEach((r, i) => {
    const y = padT + i * rowH;
    el('text', { x: padL - 10, y: y + rowH / 2 + 4, 'text-anchor': 'end', fill: css('--ink-2'),
                 'font-size': 12.5 }, svg).textContent = r.label;
    [['a', 0], ['b', 1]].forEach(([k, j]) => {
      const v = r[k];
      if (v == null) return;
      const se = o.series[j], by = y + rowH / 2 - bh - 1 + j * (bh + 2);
      el('rect', { x: Math.min(x(0), x(v)), y: by, width: Math.abs(x(v) - x(0)), height: bh, rx: 3, fill: se.color }, svg);
      // negative bars are labelled to the right of zero, so the text never runs into the row labels
      const t = el('text', { x: (v >= 0 ? x(v) + 6 : x(0) + 6), y: by + bh - 2, 'text-anchor': 'start',
                             fill: css('--ink-2'), 'font-size': 11, 'font-family': css('--mono') }, svg);
      const pp = r[k + 'P'];
      t.textContent = fmt(v) + (pp != null ? ' ' + stars(pp) + '  ' + pval(pp) : '');
      if (pp != null) { t.setAttribute('fill', pColour(pp)); if (pp < 0.10) t.setAttribute('font-weight', 600); }
      const hit = el('rect', { x: padL, y: by - 1, width: W - padL - padR, height: bh + 2, fill: 'transparent' }, svg);
      hoverable(hit, `<b>${r.label}</b><br>${se.label}: ${fmt(v)}${r[k + 'Sub'] ? '<br>' + r[k + 'Sub'] : ''}`);
    });
  });
  el('line', { x1: x(0), x2: x(0), y1: padT, y2: H - 20, stroke: css('--line'), 'stroke-width': 1.2 }, svg);
}

/* colour between two hex tokens */
function mixHex(c1, c2, t) {
  const a = c1.replace('#', ''), b = c2.replace('#', '');
  const ch = (h, i) => parseInt(h.substr(i, 2), 16);
  return '#' + [0, 2, 4].map(i => Math.round(ch(a, i) + (ch(b, i) - ch(a, i)) * Math.max(0, Math.min(1, t)))
    .toString(16).padStart(2, '0')).join('');
}

/* Style map: one dot per session, a line joining each operator's two sessions. */
function styleMap(host, pts, mode, keep = () => true) {
  host.innerHTML = '';
  const W = 700, H = 440, pad = 34;
  const svg = svgRoot(host, W, H);
  const xk = mode === 'tsne' ? 'tx' : 'px', yk = mode === 'tsne' ? 'ty' : 'py';
  const xs = pts.map(p => p[xk]), ys = pts.map(p => p[yk]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const sx = v => pad + (W - 2 * pad) * (v - x0) / (x1 - x0 || 1);
  const sy = v => H - pad - (H - 2 * pad) * (v - y0) / (y1 - y0 || 1);
  const rels = pts.map(p => p.rel), rlo = Math.min(...rels), rhi = Math.max(...rels);
  const col = v => mixHex(css('--s-tac'), css('--s-strat'), (v - rlo) / (rhi - rlo || 1));
  // axes are fixed by every session, so filtering hides dots without moving the rest
  const shown = pts.filter(keep);
  const byPid = {};
  shown.forEach(p => (byPid[p.pid] = byPid[p.pid] || []).push(p));
  const lines = {}, dots = {};
  Object.entries(byPid).forEach(([pid, ps]) => {
    if (ps.length === 2) lines[pid] = el('line', { x1: sx(ps[0][xk]), y1: sy(ps[0][yk]), x2: sx(ps[1][xk]), y2: sy(ps[1][yk]),
      stroke: css('--mark-soft'), 'stroke-width': 1.2, opacity: .8 }, svg);
  });
  const fmtF = (k, v) => v == null ? '—' : (['took', 'preempt', 'edit', 'consult', 'keep', 'recSug'].includes(k) ? pct(v, 0)
    : k === 'netSecs' ? num(Math.expm1(v), 1) + ' s' : num(v, 2));
  shown.forEach(p => {
    const c = el(p.run === 1 ? 'circle' : 'rect', p.run === 1
      ? { cx: sx(p[xk]), cy: sy(p[yk]), r: 6, fill: col(p.rel), stroke: css('--surface'), 'stroke-width': 1.5 }
      : { x: sx(p[xk]) - 5.5, y: sy(p[yk]) - 5.5, width: 11, height: 11, rx: 2, fill: col(p.rel), stroke: css('--surface'), 'stroke-width': 1.5 }, svg);
    (dots[p.pid] = dots[p.pid] || []).push(c);
    const lab = el('text', { x: sx(p[xk]) + 8, y: sy(p[yk]) + 4, fill: css('--ink-3'), 'font-size': 9.5,
                             'font-family': css('--mono'), opacity: 0 }, svg);
    lab.textContent = p.pid;
    (dots[p.pid + ':lab'] = dots[p.pid + ':lab'] || []).push(lab);
    const hit = el('circle', { cx: sx(p[xk]), cy: sy(p[yk]), r: 11, fill: 'transparent' }, svg);
    const feats = X.fingerprint.features.map(f => `${f.label}: <b>${fmtF(f.k, p[f.k])}</b>`).join('<br>');
    hoverable(hit, `<b>${p.pid} · session ${p.run}</b> (${p.game.replace('|', ' game ')})<br>reliance score ${sgn(p.rel, 2)}<br>${feats}`);
    hit.addEventListener('mouseenter', () => {
      if (lines[p.pid]) { lines[p.pid].setAttribute('stroke', css('--ink')); lines[p.pid].setAttribute('stroke-width', 2.4); }
      (dots[p.pid + ':lab'] || []).forEach(t => t.setAttribute('opacity', 1));
    });
    hit.addEventListener('mouseleave', () => {
      if (lines[p.pid]) { lines[p.pid].setAttribute('stroke', css('--mark-soft')); lines[p.pid].setAttribute('stroke-width', 1.2); }
      (dots[p.pid + ':lab'] || []).forEach(t => t.setAttribute('opacity', 0));
    });
  });
  el('text', { x: W - pad, y: H - 8, 'text-anchor': 'end', fill: css('--ink-3'), 'font-size': 10.5, 'font-family': css('--mono') }, svg)
    .textContent = mode === 'tsne' ? 't-SNE axes have no units' : 'PC1 (reliance) →';
  if (mode !== 'tsne') el('text', { x: 10, y: pad - 12, fill: css('--ink-3'), 'font-size': 10.5, 'font-family': css('--mono') }, svg)
    .textContent = '↑ PC2';
}

/* diverging colour for a z-score: low = tactical orange, 0 = surface, high = strategic blue */
const zCol = (v, lim = 2) => v == null ? css('--surface-2') : v >= 0
  ? mixHex(css('--surface-2'), css('--s-strat'), Math.min(1, v / lim)) : mixHex(css('--surface-2'), css('--s-tac'), Math.min(1, -v / lim));
const SHORT = { took: 'Takes card', preempt: 'Manual early', edit: 'Edits card', consult: 'Suggest (plan)', keep: 'Keeps plan',
                recSug: 'Suggest (recovery)', netSecs: 'Decision time', dSmall: '± drones, small', dLarge: '± drones, large',
                previews: 'Previews cards' };

/* People × habits heatmap, rows in clustering order, with the clustering tree on the left. */
function heatTree(host, H, archOf) {
  const nR = H.pids.length, nC = H.cols.length, cw = 46, rh = 15, treeW = 120, labW = 40, top = 92;
  const W = treeW + labW + nC * cw + 20, Ht = top + nR * rh + 10;
  const svg = svgRoot(host, W, Ht);
  const x0 = treeW + labW;
  H.cols.forEach((c, j) => {
    const t = el('text', { x: x0 + j * cw + cw / 2, y: top - 8, fill: css('--ink-2'), 'font-size': 11,
                           transform: `rotate(-40 ${x0 + j * cw + cw / 2} ${top - 8})` }, svg);
    t.textContent = SHORT[c] || c;
  });
  H.values.forEach((row, i) => {
    const y = top + i * rh;
    el('text', { x: x0 - 6, y: y + rh - 4, 'text-anchor': 'end', fill: css('--ink-2'), 'font-size': 10,
                 'font-family': css('--mono') }, svg).textContent = H.pids[i];
    if (archOf && archOf[H.pids[i]]) el('rect', { x: x0 - labW - 2, y: y + 3, width: 6, height: rh - 6, rx: 1.5,
      fill: archOf[H.pids[i]].color }, svg);
    row.forEach((v, j) => {
      const c = el('rect', { x: x0 + j * cw + 1, y: y + 1, width: cw - 2, height: rh - 2, rx: 2, fill: zCol(v) }, svg);
      hoverable(c, `<b>${H.pids[i]}</b> · ${SHORT[H.cols[j]]}<br>${sgn(v, 2)} SD from the average operator (game-adjusted)`);
    });
  });
  // dendrogram from the scipy linkage matrix
  const n = nR, pos = {}, ht = {};
  const maxD = Math.max(...H.linkage.map(l => l[2]));
  const xs = d => treeW - 6 - (treeW - 14) * (d / maxD);
  // leaves: scipy numbers leaves 0..n-1 in ORIGINAL order; H.leaf gives original index -> row
  H.leaf.forEach((orig, row) => { pos[orig] = top + row * rh + rh / 2; ht[orig] = 0; });
  H.linkage.forEach(([a, b, d], k) => {
    const id = n + k, ya = pos[a], yb = pos[b], xa = xs(ht[a]), xb = xs(ht[b]), xd = xs(d);
    el('path', { d: `M${xa} ${ya}H${xd}V${yb}H${xb}`, fill: 'none', stroke: css('--ink-3'), 'stroke-width': 1 }, svg);
    pos[id] = (ya + yb) / 2; ht[id] = d;
  });
}

/* Spearman correlations between habits, lower triangle, coloured by ρ, starred by p. */
function corrGrid(host, Cg) {
  const k = Cg.cols.length, cs = 52, left = 130, top = 16;
  const svg = svgRoot(host, left + k * cs + 10, top + k * cs + 70);
  Cg.cols.forEach((c, i) => {
    el('text', { x: left - 8, y: top + i * cs + cs / 2 + 4, 'text-anchor': 'end', fill: css('--ink-2'), 'font-size': 11.5 }, svg)
      .textContent = SHORT[c];
    const t = el('text', { x: left + i * cs + cs / 2, y: top + k * cs + 12, fill: css('--ink-2'), 'font-size': 11,
                           transform: `rotate(35 ${left + i * cs + cs / 2} ${top + k * cs + 12})` }, svg);
    t.textContent = SHORT[c];
    for (let j = 0; j < i; j++) {
      const v = Cg.rho[i][j], pp = Cg.p[i][j];
      const r_ = el('rect', { x: left + j * cs + 1, y: top + i * cs + 1, width: cs - 2, height: cs - 2, rx: 3, fill: zCol(v, 1) }, svg);
      const t2 = el('text', { x: left + j * cs + cs / 2, y: top + i * cs + cs / 2 + 4, 'text-anchor': 'middle',
                              fill: Math.abs(v) > 0.55 ? '#fff' : css('--ink'), 'font-size': 11, 'font-family': css('--mono'),
                              'font-weight': pp < 0.05 ? 700 : 400 }, svg);
      t2.textContent = num(v, 2).replace('0.', '.') + stars(pp);
      hoverable(r_, `<b>${SHORT[Cg.cols[i]]} ~ ${SHORT[Cg.cols[j]]}</b><br>ρ = ${num(v, 2)}, ${pv(pp)}`);
    }
  });
}

/* The two main directions of style, with their ends named in words. One dot per operator (mean of their two
   sessions), coloured by closest archetype; the three archetypes are marked where their profiles fall. */
function styleAxes(host, pts, B, cols, archOf, AR, NAMES, COLS, ends) {
  const W = 700, H = 470, padL = 70, padR = 70, padT = 40, padB = 50;
  const svg = svgRoot(host, W, H);
  const byP = {};
  pts.forEach(p => (byP[p.pid] = byP[p.pid] || []).push(p));
  const pp = Object.entries(byP).map(([pid, ps]) => ({ pid, x: ps.reduce((a, b) => a + b.px, 0) / ps.length,
                                                        y: ps.reduce((a, b) => a + b.py, 0) / ps.length }));
  const arch = AR.profiles.map(z => ({ x: z.reduce((a, v, j) => a + v * B.pc1[j], 0), y: z.reduce((a, v, j) => a + v * B.pc2[j], 0) }));
  const all = pp.concat(arch);
  const lx = Math.max(...all.map(p => Math.abs(p.x))) * 1.08, ly = Math.max(...all.map(p => Math.abs(p.y))) * 1.12;
  const sx = v => padL + (W - padL - padR) * (v + lx) / (2 * lx), sy = v => padT + (H - padT - padB) * (ly - v) / (2 * ly);
  const cx = sx(0), cy = sy(0);
  // quadrant shading and axes
  el('rect', { x: padL, y: padT, width: W - padL - padR, height: H - padT - padB, fill: css('--surface'), stroke: css('--line') }, svg);
  el('line', { x1: padL, x2: W - padR, y1: cy, y2: cy, stroke: css('--line'), 'stroke-dasharray': '3 3' }, svg);
  el('line', { x1: cx, x2: cx, y1: padT, y2: H - padB, stroke: css('--line'), 'stroke-dasharray': '3 3' }, svg);
  const lab = (x, y, t, anchor, extra = {}) => { const e = el('text', Object.assign({ x, y, 'text-anchor': anchor,
    fill: css('--ink-2'), 'font-size': 12, 'font-weight': 600 }, extra), svg); e.textContent = t; return e; };
  lab(padL + 4, H - padB + 20, '← ' + ends.left, 'start');
  lab(W - padR - 4, H - padB + 20, ends.right + ' →', 'end');
  lab(cx, padT - 12, '↑ ' + ends.up, 'middle');
  lab(cx, H - 10, '↓ ' + ends.down, 'middle');
  el('text', { x: W - padR, y: H - padB + 36, 'text-anchor': 'end', fill: css('--ink-3'), 'font-size': 10, 'font-family': css('--mono') }, svg)
    .textContent = `horizontal = reliance axis (${pct(B.share[0], 0)} of variation) · vertical = second axis (${pct(B.share[1], 0)})`;
  pp.forEach(p => {
    const a = archOf[p.pid];
    const c = el('circle', { cx: sx(p.x), cy: sy(p.y), r: 6, fill: a ? a.color : css('--mark-soft'), opacity: .85,
                             stroke: css('--surface'), 'stroke-width': 1.2 }, svg);
    hoverable(c, `<b>${p.pid}</b>${a ? '<br>closest style: ' + a.name + ' (' + pct(a.w, 0) + ')' : ''}`);
  });
  arch.forEach((a, i) => {
    const x = sx(a.x), y = sy(a.y);
    el('path', { d: `M${x} ${y - 11} L${x + 10} ${y + 7} L${x - 10} ${y + 7} Z`, fill: COLS[i], stroke: css('--ink'), 'stroke-width': 1.4 }, svg);
    const t = el('text', { x: x + (x > cx ? -14 : 14), y: y + 4, 'text-anchor': x > cx ? 'end' : 'start', fill: COLS[i],
                           'font-size': 12.5, 'font-weight': 700, 'paint-order': 'stroke', stroke: css('--surface'), 'stroke-width': 4 }, svg);
    t.textContent = 'pure ' + NAMES[i];
  });
}

/* Which habits move an operator along one axis: signed weights, largest first. */
function axisBars(host, title, load, cols, posLabel, negLabel, colPos, colNeg) {
  const rows = cols.map((c, i) => ({ c, v: load[i] })).filter(r => Math.abs(r.v) >= 0.12).sort((a, b) => b.v - a.v);
  const W = 340, rowH = 22, padL = 128, padT = 24, H = padT + rows.length * rowH + 6;
  const svg = svgRoot(host, W, H);
  el('text', { x: 0, y: 14, fill: css('--ink'), 'font-size': 12.5, 'font-weight': 600 }, svg).textContent = title;
  const lim = Math.max(...rows.map(r => Math.abs(r.v)));
  const mid = padL + (W - padL - 10) / 2, half = (W - padL - 10) / 2;
  rows.forEach((r, i) => {
    const y = padT + i * rowH;
    el('text', { x: padL - 8, y: y + 15, 'text-anchor': 'end', fill: css('--ink-2'), 'font-size': 11.5 }, svg).textContent = SHORT[r.c];
    el('rect', { x: Math.min(mid, mid + half * r.v / lim), y: y + 5, width: Math.abs(half * r.v / lim), height: 12, rx: 2,
                 fill: r.v >= 0 ? colPos : colNeg }, svg);
  });
  el('line', { x1: mid, x2: mid, y1: padT, y2: H - 4, stroke: css('--ink-3') }, svg);
  el('text', { x: W - 10, y: H, 'text-anchor': 'end', fill: css('--ink-3'), 'font-size': 10 }, svg);
}

/* simple line chart over a numeric x */
function lineChart(host, series, o = {}) {
  const W = 700, H = o.height || 240, padL = 50, padR = 110, padT = 14, padB = 40;
  const svg = svgRoot(host, W, H);
  const xs = series.flatMap(se => se.points.map(p => p.x)), ys = series.flatMap(se => se.points.map(p => p.y));
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y1 = o.yMax || Math.max(...ys) * 1.1;
  const sx = v => padL + (W - padL - padR) * (v - x0) / (x1 - x0 || 1), sy = v => H - padB - (H - padB - padT) * v / y1;
  (o.yTicks || [0, y1 / 2, y1]).forEach(v => {
    el('line', { x1: padL, x2: W - padR, y1: sy(v), y2: sy(v), stroke: css('--grid') }, svg);
    el('text', { x: padL - 8, y: sy(v) + 4, 'text-anchor': 'end', fill: css('--ink-3'), 'font-size': 11, 'font-family': css('--mono') }, svg)
      .textContent = (o.yFmt || (v => num(v, 0)))(v);
  });
  [...new Set(xs)].forEach(v => el('text', { x: sx(v), y: H - padB + 16, 'text-anchor': 'middle', fill: css('--ink-3'),
    'font-size': 10.5, 'font-family': css('--mono') }, svg).textContent = (o.xFmt || String)(v));
  el('text', { x: (padL + W - padR) / 2, y: H - 6, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 11 }, svg).textContent = o.xLabel || '';
  series.forEach(se => {
    const pts = se.points.slice().sort((a, b) => a.x - b.x);
    el('path', { d: pts.map((p, i) => (i ? 'L' : 'M') + sx(p.x) + ' ' + sy(p.y)).join(' '), fill: 'none', stroke: se.color,
                 'stroke-width': 2.2, 'stroke-linejoin': 'round' }, svg);
    pts.forEach(p => { const c = el('circle', { cx: sx(p.x), cy: sy(p.y), r: 4, fill: se.color, stroke: css('--surface'), 'stroke-width': 1.5 }, svg);
      hoverable(c, `<b>${se.label}</b><br>${(o.xFmt || String)(p.x)}: ${(o.yFmt || (v => num(v, 1)))(p.y)}${p.n ? '<br>n = ' + p.n : ''}`); });
    const last = pts[pts.length - 1];
    el('text', { x: sx(last.x) + 10, y: sy(last.y) + 4, fill: se.color, 'font-size': 12, 'font-weight': 600 }, svg).textContent = se.label;
  });
}

/* Three archetypes as the corners of a triangle; each person sits at their mix of the three. */
function ternary(host, AR, names, colors) {
  const W = 700, H = 440, side = 440, ox = (W - side) / 2, oy = H - 50, hgt = side * Math.sqrt(3) / 2;
  const svg = svgRoot(host, W, H);
  const C = [[ox + side / 2, oy - hgt], [ox, oy], [ox + side, oy]];
  el('path', { d: `M${C[0]}L${C[1]}L${C[2]}Z`, fill: css('--surface-2'), stroke: css('--line'), 'stroke-width': 1.2 }, svg);
  [0.25, 0.5, 0.75].forEach(f => C.forEach((_, i) => {
    const a = C[i], b = C[(i + 1) % 3], c = C[(i + 2) % 3];
    const p1 = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f], p2 = [a[0] + (c[0] - a[0]) * f, a[1] + (c[1] - a[1]) * f];
    el('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], stroke: css('--grid'), 'stroke-width': 1 }, svg);
  }));
  names.forEach((nm, i) => {
    const [x, y] = C[i];
    const t = el('text', { x, y: i === 0 ? y - 12 : y + 22, 'text-anchor': i === 1 ? 'start' : i === 2 ? 'end' : 'middle',
                           fill: colors[i], 'font-size': 13, 'font-weight': 700 }, svg);
    t.textContent = nm;
  });
  AR.weights.forEach(({ pid, w }) => {
    const x = w[0] * C[0][0] + w[1] * C[1][0] + w[2] * C[2][0], y = w[0] * C[0][1] + w[1] * C[1][1] + w[2] * C[2][1];
    const d = w.indexOf(Math.max(...w));
    const c = el('circle', { cx: x, cy: y, r: 6, fill: colors[d], opacity: .8, stroke: css('--surface'), 'stroke-width': 1.2 }, svg);
    hoverable(c, `<b>${pid}</b><br>${names.map((nm, i) => `${nm}: ${pct(w[i], 0)}`).join('<br>')}`);
  });
}

/* A remark made during play, from the session recording's machine transcript. */
function nq(host, pid, starts) {
  const q = X && X.narrationQuotes.find(x => x.pid === pid && x.text.startsWith(starts));
  if (!q) { h('p', { class: 'note', text: `missing narration: ${pid}` }, host); return; }
  const b = h('blockquote', {}, host);
  h('p', { text: '“' + q.text + '”' }, b);
  h('span', { class: 'attr', html: `<span class="pid">${q.pid}</span> · said during play, session ${q.run}, ${mmss(q.t)} in`
    + ' · machine transcript of the recording' }, b);
}

/* A verbatim excerpt from the coding evidence, found by participant, code and the start of the text. */
function ev(host, pid, code, starts) {
  if (!QL) return;
  const flat = t => t.replace(/[\u2018\u2019]/g, "'");
  const e = QL.evidence.find(x => x.pid === pid && x.code === code && x.source === 'debrief'
      && (!starts || flat(x.text).startsWith(flat(starts))))
    || QL.evidence.find(x => x.pid === pid && x.code === code);
  if (!e) { h('p', { class: 'note', text: `missing excerpt: ${pid} ${code}` }, host); return; }
  const b = h('blockquote', {}, host);
  h('p', { text: '“' + e.text + '”' }, b);
  h('span', { class: 'attr', html: `<span class="pid">${e.pid}</span> · post-session debrief`
    + (e.at ? ', ' + e.at : '') + ` · coded ${CODE_LABEL[code].toLowerCase()}` + (e.led ? ' · answering a direct question' : '') }, b);
}

{

  para(s, `None of the ${DP.nTests} tests of measured disposition survives correction, and attitude to AI does not `

    const explain = card(s, 'What “the reliance axis” is');
    para(explain, `Take the ${FP.features.length} behaviours for all ${FP.nSessions} sessions and ask which single direction through `
