<style>
/* Generated by scripts/register/build_review.py from scripts/register/review_template.html.

/*__COMMON_CSS__*/
body { margin: 0; }
main#main { display: none; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 140px 10px 18px; border-bottom: 1px solid var(--line);
  background: var(--surface); }

.prog .bar i { display: block; height: 100%; }
.prog .lab { font: 500 11px var(--mono); color: var(--ink-3); margin-top: 4px; }
.views button, .tools button, .tools label { font: 500 12px var(--mono); padding: 5px 10px; border-radius: 5px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-2); cursor: pointer; }
.views button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.saved { font: 500 11px var(--mono); color: var(--ink-3); min-width: 150px; text-align: right; }
.saved.disk { color: var(--good); }
.saved.local { color: var(--warn); }
.body { display: grid; grid-template-columns: 290px minmax(0, 1fr) 360px; min-height: 0; }
.body > * { overflow-y: auto; min-height: 0; }
aside.list { border-right: 1px solid var(--line); padding: 10px 0; background: var(--surface); }

  background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box; }
aside.list .grp { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 12px 14px 4px; }
aside.list a { display: flex; gap: 8px; align-items: center; padding: 5px 14px; text-decoration: none; color: var(--ink-2);
  font-size: 13px; line-height: 1.3; cursor: pointer; }
aside.list a:hover { background: var(--surface-2); }
aside.list a.on { background: var(--hi); color: var(--ink); font-weight: 500; }
.dot { flex: 0 0 9px; height: 9px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid var(--line); box-sizing: border-box; }
section.cardview { padding: 18px 28px 60px; }
.cardview .kick { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.cardview h2 { font: 600 22px var(--sans); margin: 4px 0 8px; }
.cardview .claim { font-size: 16.5px; line-height: 1.5; max-width: 74ch; margin: 8px 0 10px; }
.chip { display: inline-block; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; border-radius: 4px;
  padding: 2px 7px; color: #fff; margin-right: 6px; vertical-align: 2px; }
.chip.k-finding { background: var(--s-strat); } .chip.k-null { background: var(--mark); color: var(--bg); }
.chip.k-qual { background: var(--r-aggr); } .chip.k-method { background: var(--ink-3); } .chip.k-observation { background: var(--r-cons); }
.chip.c-strong { background: var(--good); } .chip.c-moderate { background: var(--s-strat); } .chip.c-suggestive { background: var(--warn); }
.chip.c-null { background: var(--mark-soft); color: var(--ink); } .chip.c-na { display: none; }
ul.nums { margin: 6px 0 12px; padding-left: 20px; max-width: 78ch; }
ul.nums li { margin: 4px 0; font-size: 14.5px; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 12px 0; background: var(--surface); max-width: 80ch; }
.box h4 { margin: 0 0 6px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.box.thoughts { background: var(--hi); border-color: transparent; }
.links a.lk { display: inline-block; margin: 3px 6px 3px 0; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink); text-decoration: none; cursor: pointer; background: var(--bg); }
.links a.lk:hover { border-color: var(--s-strat); }
.links .why { color: var(--ink-3); font-size: 12.5px; }
.links .row { margin: 4px 0; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.links button.adopt { font: 500 10.5px var(--mono); border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink-3); cursor: pointer; padding: 1px 6px; }
.meta2 { font: 12px var(--mono); color: var(--ink-3); margin-top: 18px; line-height: 1.6; }
/* quote cards */
.qbox { margin: 12px 0; max-width: 100%; }
.qhead { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 4px; }
.qsum { font-size: 14px; color: var(--ink-2); margin: 2px 0 8px; max-width: 80ch; }
.qcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 6px 0; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--quote, var(--s-strat)); border-radius: 8px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.qcard .qtext { font: 15px/1.45 var(--serif, Georgia, serif); color: var(--ink); }
.qcard.para .qtext { font-style: italic; color: var(--ink-2); }
.qcard.led { opacity: .75; border-left-style: dashed; }
.qcard .qctx { font-size: 12px; color: var(--ink-3); }
.qcard .qwho { margin-top: auto; font: 11px var(--mono); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

.qcard .qtag { background: var(--hi); }
.qmore > summary { cursor: pointer; font-size: 13px; color: var(--ink-2); margin: 6px 0; }
.qcard .qact { align-self: flex-end; font: 500 11px var(--sans); border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2);
  color: var(--ink-2); cursor: pointer; padding: 2px 9px; }
.qcard .qact:hover { border-color: var(--ink-3); color: var(--ink); }
.qcard.picked { border-color: var(--ink-3); }

/* long passages (passages/*.yaml): full width, a title, the researcher's question before them */
.qcard.long { grid-column: 1 / -1; max-width: 92ch; }
.qcard.long .qtitle { font: 600 14px var(--sans); color: var(--ink); }

.qcard.long .qwhy { font-size: 12.5px; color: var(--ink-2); }
.qcard .qtag.trim { background: none; border: 1px solid var(--line); color: var(--ink-3); align-self: flex-start; }
.qcard .qtag.bad { background: var(--bad); color: #fff; align-self: flex-start; }
.qcard .qtag.trimmed { background: none; border: 1px solid var(--line); color: var(--ink-3); align-self: flex-start; }
.qcard .qtag.adjusted { background: none; border: 1px solid var(--s-strat); color: var(--s-strat); align-self: flex-start; }
.qcard .qtag.edited { background: none; border: 1px solid var(--warn); color: var(--warn); font-weight: 600; align-self: flex-start; }

.qcard .d-del { text-decoration: line-through; opacity: .55; }
.qcard.cmp .d-br, .qkey .d-br { background: color-mix(in srgb, var(--s-strat) 22%, transparent); border-radius: 3px; }
.qcard.cmp .d-ed, .qkey .d-ed { background: color-mix(in srgb, var(--warn) 30%, transparent); border-radius: 3px; text-decoration: underline wavy var(--warn); }

.qcard .qkey { display: flex; gap: 10px; font-size: 11.5px; margin: 4px 0; }

.qcard details.qorig { font-size: 12.5px; color: var(--ink-3); }
.qcard details.qorig summary { cursor: pointer; }
.qcard .qtrim textarea { width: 100%; box-sizing: border-box; font: 14.5px/1.5 var(--serif, Georgia, serif); padding: 6px 8px;
  border: 1px solid var(--ink-3); border-radius: 6px; background: var(--bg); color: var(--ink); }
.qcard .qhint { font-size: 12px; color: var(--ink-3); margin: 3px 0; }
.qcard .qhint.okk { color: var(--good); } .qcard .qhint.bad { color: var(--bad); }
.qcard .qtrimrow { display: flex; gap: 6px; }
.qcard .qtrimrow button { font: 500 12px var(--sans); border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2); color: var(--ink-2); padding: 3px 9px; cursor: pointer; }

.qcard .qcheck { font: 12px var(--sans); color: var(--ink-3); display: flex; gap: 5px; align-items: center; cursor: pointer; align-self: flex-start; }
.qcard .qcheck.on { color: var(--good); font-weight: 600; }
.qcard .qcheck.stale { color: var(--warn); }
.qcard .qnote { font: 13px var(--sans); width: 100%; box-sizing: border-box; border: 1px solid var(--grid); border-radius: 6px; padding: 6px 8px; background: var(--surface); color: var(--ink); resize: vertical; }
.qcard.checked { box-shadow: inset 3px 0 0 var(--good); }
.qcard .qrefs { border-top: 1px solid var(--line); padding-top: 6px; }

<body>
<div class="themebar"><button id="t-light">light</button><button id="t-dark">dark</button></div>

<main id="main"></main>
<div id="app">
  <header class="top">
    <h1>Findings review</h1>
    <div class="views" id="views"></div>
    <div class="prog"><div class="bar" id="progbar"></div><div class="lab" id="proglab"></div></div>
    <div class="tools"><button id="exp">Export notes</button> <label>Import<input type="file" id="imp" accept=".json" hidden></label></div>
    <div class="saved" id="saved"></div>
  </header>
  <div class="body" id="body"></div>
</div>
<script>
const DATA = /*__DATA__*/null;
const REG = /*__REGISTER__*/null;
/*__COMMON_JS__*/

/* ═══════════════════════════ state ═══════════════════════════ */
const ATOMS = REG.cards.filter(c => !c.status || c.status === 'active');
const FINDINGS = (REG.findings || []).map(f => Object.assign({ group: f.area, claim: f.headline }, f, {
  group: f.status === 'retired' ? 'Retired' : f.tier === 'side' ? 'Sidelined — kept, not a focus' : f.area,
  // suggested links = the finding's own `links` plus every finding a section is shared with (both ways, added below)
  links: [...(f.links || []), ...[...new Set((f.sections || []).flatMap(s => s.sharedWith || []))].map(to => ({ to, why: 'shares a section' }))] }));
FINDINGS.forEach(f => f.links.forEach(l => { const o = FINDINGS.find(x => x.id === l.to);
  if (o && !o.links.some(m => m.to === f.id)) o.links.push({ to: f.id, why: l.why }); }));
const FMODE = FINDINGS.length > 0;                      // pass 2+: review findings; atoms are opened from them
const CARDS = FMODE ? FINDINGS : ATOMS;                  // the review units
const BYID = Object.fromEntries(REG.cards.concat(FINDINGS).map(c => [c.id, c]));
const GROUPS = [...new Set(CARDS.map(c => c.group))];
const ABSORBED_BY = {};                                   // atom id -> ids of the findings carrying it
FINDINGS.forEach(f => new Set([...(f.absorbs || []), ...(f.sections || []).flatMap(s => s.atoms || [])])
  .forEach(a => (ABSORBED_BY[a] = ABSORBED_BY[a] || []).push(f.id)));
let ATOM = null;                                          // an atom opened from a finding (read-only)
const PASS = REG.pass;
const VERDICTS = [
  ['core', 'Core', '--good'], ['keep', 'Keep', '--s-strat'], ['reframe', 'Reframe', '--r-aggr'],
  ['merge', 'Merge', '--r-cons'], ['prune', 'Prune', '--bad'], ['check', 'Needs a check', '--warn'],
];
const VCOL = Object.fromEntries(VERDICTS.map(([k, , c]) => [k, c]));
// pass 3+: what each section is for, set per section (Claude's suggestion is shown dashed until you pick)
const ROLES = [
  ['paper', 'Paper', '--good', 'Likely to go in the paper, with its graph'],
  ['numbers', 'Numbers only', '--s-strat', 'Mention the values in the paper, but no graph'],
  ['extra', 'Extra', '--r-aggr', 'Definitely keep — supplement, talk or blog post material'],
  ['archive', 'Archive', '--ink-3', 'Don’t forget it, but unlikely ever to be used'],
];
// the newest earlier-pass note on a key (a moved section is looked up under where it was)
const LSKEY = 'findings-review-v1';
const X = DATA.extras, X2 = DATA.extras2, R1 = DATA.round1, QL = DATA.qual;

// responses: { pass, cards: { id: {verdict, note, links:[{to, note}], tags, updated} } }
let RESP = REG.responses && REG.responses.cards ? REG.responses : { pass: PASS, cards: {} };
const stamp = r => Math.max(0, ...Object.values(r.cards || {}).map(x => Date.parse(x.updated || 0) || 0));
try {
  const ls = JSON.parse(localStorage.getItem(LSKEY) || 'null');
  if (ls && ls.pass === PASS && stamp(ls) > stamp(RESP)) RESP = ls;
} catch (e) { /* storage blocked: the embedded copy stands */ }
let SERVER = false;
const resp = id => (RESP.cards[id] = RESP.cards[id] || { verdict: null, note: '', links: [], tags: [], updated: null });
const reviewed = id => { const r = RESP.cards[id]; return !!(r && (r.verdict || (r.note || '').trim())); };

let saveTimer = null;
function save(id) {
  if (id) resp(id).updated = new Date().toISOString();
  RESP.pass = PASS;
  try { localStorage.setItem(LSKEY, JSON.stringify(RESP)); } catch (e) { /* private mode */ }
  setSaved(SERVER ? 'saving…' : 'saved in this browser — export to share', SERVER ? '' : 'local');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!SERVER) return;
    fetch('/api/responses', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(RESP) })
      .then(r => { if (r.status === 409) { SERVER = false; setSaved('out of date: another pass is open — reload the page', 'local'); return; }
        if (!r.ok) throw new Error(r.status); setSaved('saved to disk ✓ ' + new Date().toLocaleTimeString(), 'disk'); })
      .catch(() => setSaved('disk save failed — saved in browser', 'local'));
  }, 500);
  drawProgress();
}
function setSaved(t, cls) { const n = $('saved'); n.textContent = t; n.className = 'saved ' + (cls || ''); }

/* ═══════════════════════════ charts (one per card `chart` key) ═══════════════════════════ */
function ciDots(host, rows, o = {}) {      // a dot with a whisker per row, on a plain linear scale
  const W = 700, rowH = 28, padL = o.padL || 280, padR = 70, padT = 10;
  const H = padT + rows.length * rowH + 30, s = svgRoot(host, W, H);
  const lo = o.min, hi = o.max, x = v => padL + (W - padL - padR) * (v - lo) / (hi - lo), base = padT + rows.length * rowH;
  (o.ticks || []).forEach(v => {
    el('line', { x1: x(v), x2: x(v), y1: padT - 4, y2: base, stroke: v === 0 ? css('--ink-3') : css('--grid') }, s);
    el('text', { x: x(v), y: base + 15, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5, 'font-family': css('--mono') }, s).textContent = o.fmt(v);
  });
  rows.forEach((r, i) => {
    const y = padT + i * rowH + rowH / 2, col = r.strong ? css('--mark') : css('--mark-soft');
    el('text', { x: padL - 10, y: y + 4, 'text-anchor': 'end', fill: css('--ink-2'), 'font-size': 12 }, s).textContent = r.label;
    if (r.lo != null) el('line', { x1: x(r.lo), x2: x(r.hi), y1: y, y2: y, stroke: col, 'stroke-width': 2, 'stroke-linecap': 'round' }, s);
    el('circle', { cx: x(r.est), cy: y, r: 4.5, fill: col, stroke: css('--surface'), 'stroke-width': 2 }, s);
    if (r.right) el('text', { x: W - padR + 8, y: y + 4, fill: css('--ink-3'), 'font-size': 11, 'font-family': css('--mono') }, s).textContent = r.right;
    hoverable(el('rect', { x: padL, y: y - rowH / 2, width: W - padL - padR, height: rowH, fill: 'transparent' }, s), r.tip || r.label);
  });
}
const secs = v => num(v, 1) + ' s';
const CH = {
  uptakeSlopes: host => slopes(host, DATA.computed.learning.perPerson.filter(x => x.r1 != null && x.r2 != null)
    .map(x => ({ label: x.pid, a: x.r1, b: x.r2 })), { aLabel: 'Session 1', bLabel: 'Session 2', height: 230 }),
  pcLoadings: host => barsDiverging(host, R1.trait.loadings.map(([l, v]) => ({ label: l, value: v })),
    { padL: 300, rowH: 28, fmt: v => sgn(v, 2), unit: '', zeroLabel: 'loading on the reliance axis' }),
  h1Tiles: host => tiles(host, [{ v: num(R1.h1.dbic, 1), k: 'ΔBIC, two groups vs one', s: 'needed > 10' },
    { v: num(R1.h1.ari, 2), k: 'session 1 vs 2 grouping agreement (ARI)', s: '0 = chance' },
    { v: R1.h1.jaccard.map(v => num(v, 2)).join(' / '), k: 'group stability (Jaccard)', s: '1 = always together' }]),
  fingerprintRanks: host => {
    const rk = X.fingerprint.all.ranks.concat(X.fingerprint.all.ranksBA || []);
    const bins = [['1st', v => v === 1], ['2nd', v => v === 2], ['3rd', v => v === 3], ['4–5', v => v >= 4 && v <= 5],
                  ['6–10', v => v >= 6 && v <= 10], ['11–20', v => v >= 11 && v <= 20], ['21–33', v => v > 20]];
    barsH(host, bins.map(([l, f]) => ({ label: `own session ranked ${l}`, value: rk.filter(f).length, sub: 'both directions pooled' })),
      { fmt: v => num(v, 0), padL: 200 });
  },
  retestBars: host => ciDots(host, X.fingerprint.retest.slice().sort((a, b) => b.rho - a.rho).map(r => ({
    label: r.label, est: r.rho, lo: r.lo, hi: r.hi, strong: r.pHolm < 0.05, right: 'ρ ' + num(r.rho, 2),
    tip: `<b>${r.label}</b><br>ρ ${num(r.rho, 2)} [${num(r.lo, 2)}, ${num(r.hi, 2)}] · Holm ${pval(r.pHolm)}<br>distinct levels: ${num(r.strata1, 1)} (one session), ${num(r.strata2, 1)} (two)` })),
    { min: -0.4, max: 1, ticks: [-0.25, 0, 0.25, 0.5, 0.75, 1], fmt: v => num(v, 2) }),
  archNull: host => {
    const AN = X2.archNull, O = AN.observed, NA = AN.nulls.stable, NB = AN.nulls.nocorr;
    const F = { p: v => pct(v, 0), n: v => num(v, 1), r: v => num(v, 2) };
    nullStrip(host, [['Variation explained, 3 archetypes', 'expl3', F.p], ['Gain 2 → 3 archetypes', 'gain3', F.p],
      ['Near-pure operators', 'pure', F.n], ['Median largest share', 'medMax', F.p], ['Best profile r, s1 vs s2', 'prof1', F.r],
      ['Second profile r', 'prof2', F.r], ['Third profile r', 'prof3', F.r], ['Same archetype both sessions', 'same', F.p]]
      .map(([label, k, fmt]) => ({ label, obs: O[k], a: NA[k], b: NB[k], fmt })));
    legend(host.parentNode, [{ label: 'observed', color: css('--s-strat') }, { label: 'no-types continuum (95% of simulations)', color: css('--mark-soft') },
      { label: 'habits shuffled between people', color: css('--s-tac') }]);
  },
  preemptBars: host => barsH(host, DATA.computed.preemption.byColours.map(r => ({ label: `${r.colours} drone type${r.colours > 1 ? 's' : ''}`,
    value: r.share, sub: `n = ${r.n} manual choices` })), { padL: 160 }),
  dispositionTiles: host => tiles(host, [{ v: '×' + num(R1.h7.or, 2), k: 'card odds per SD of AIAS-4', s: `[${num(R1.h7.lo, 2)}, ${num(R1.h7.hi, 2)}]` },
    { v: `${DATA.disposition.nHolm} / ${DATA.disposition.nTests}`, k: 'disposition tests surviving Holm', s: `${DATA.disposition.nNominal} nominal` },
    { v: num(DATA.disposition.batteries[0].mean, 1) + ' / 10', k: 'mean AIAS-4 (ceiling)' }]),
  sizeUptake: host => barsH(host, DATA.computed.relianceByColours.map(r => ({ label: `${r.colours} drone type${r.colours > 1 ? 's' : ''}`,

    legend(host.parentNode, [{ label: 'Manual', color: css('--r-man') }, { label: 'Aggressive card', color: css('--r-aggr') }, { label: 'Conservative card', color: css('--r-cons') }]);
  },
  queueBins: host => {
    const Q = X2.deepQueue2, box = h('div', {}, host);

      [{ label: 'Strategic', color: css('--s-strat'), values: Q.strategic.bins.map(b => b[k]), subs: Q.strategic.bins.map(b => `n = ${b.n}`) },
       { label: 'Tactical', color: css('--s-tac'), values: Q.tactical.bins.map(b => b[k]), subs: Q.tactical.bins.map(b => `n = ${b.n}`) }],
      { max: 1, fmt: v => pct(v, 0), height: 210 });
    host.insertBefore(btnBar(host, 'View', [['rate', 'Raw'], ['adjusted', 'Adjusted for mission, time, person']], 'rate', draw), box);
    draw('rate');
    legend(host, [{ label: 'Strategic: card taken', color: css('--s-strat') }, { label: 'Tactical: Suggest pressed', color: css('--s-tac') }]);
  },
  queueImages: host => {
    const d = h('div', { class: 'imgs' }, host);
    [['img/queue_at_rest.jpg', 'At rest: three cards and a header.'], ['img/queue_decision_open.jpg', 'Deciding: the panel hides the rest.']]
      .forEach(([src, cap]) => { const f = h('figure', {}, d); h('img', { src, alt: cap }, f); h('figcaption', { class: 'cap', text: cap }, f); });
  },
  queuePick: host => {
    const pk = X2.deepQueue2.strategic.pick, L = pk.find(x => x.k.startsWith('more')), S_ = pk.find(x => !x.k.startsWith('more'));
    tiles(host, [{ v: pct(L.oldest, 0), k: 'open the oldest waiting', s: pct(S_.oldest, 0) + ' with a short queue' },
      { v: pct(L.visible, 0), k: 'open one in the top 3', s: pct(S_.visible, 0) + ' otherwise' },
      { v: num(L.ndrones, 1), k: 'drones the opened mission needs', s: num(S_.ndrones, 1) + ' otherwise' },
      { v: pct(L.early, 0), k: 'manual before cards load', s: pct(S_.early, 0) + ' otherwise' }]);
  },
  manualDelta: host => barsDiverging(host, DATA.computed.delta.byBand.map(r => ({ label: `${r.band} missions (~${num(r.need, 0)} drones)`,
    value: r.mean, sub: `n = ${r.n}` })), { padL: 210, fmt: v => sgn(v, 1), zeroLabel: 'same as the Conservative card' }),
  trustGap: host => {
    barsH(host, DATA.selfreport.trust.map(t => ({ label: t.label, value: t.mean, sub: `SD ${num(t.sd, 2)}` })), { max: 7, fmt: v => num(v, 2), padL: 170 });
    const G = DATA.selfreport.gap;
    h('p', { class: 'cap', text: `${G.higherTactical} of ${G.n} higher for tactical, ${G.higherStrategic} for strategic, ${G.tied} tied (1–7 scale).` }, host.parentNode);
  },
  preferenceBars: host => { const P = QL.preference.counts;
    barsH(host, ['tactical', 'strategic', 'conditional', 'both', 'none'].filter(k => P[k]).map(k => ({ label: k, value: P[k], sub: QL.preference.who[k].join(', ') })),
      { fmt: v => num(v, 0), padL: 130 }); },
  trustOrder: host => barsDiverging(host, R1.trustOrder.map(o => ({ label: o.label, value: o.mean, sub: `fell for ${o.fell} of ${o.n}` })),
    { padL: 190, fmt: v => sgn(v, 2), unit: ' points', zeroLabel: 'no change in strategic trust' }),
  oddEvent: (host, mode = 'obs') => {
    const OS = X2.events.oddSplit, box = h('div', {}, host);
    const g = [{ label: 'noticed', color: css('--bad'), E: OS.said }, { label: 'not said', color: css('--s-strat'), E: OS.notSaid }];

  speedByMinute: host => {
    const sp = X.learning.speed, mins = [...new Set(sp.map(x => x.minute))].sort();
    barsGrouped(host, mins.map(m => 'min ' + (m + 1)), [1, 2].map(r => ({ label: 'Session ' + r, color: css(r === 1 ? '--lad-3' : '--lad-1'),
      values: mins.map(m => (sp.find(x => x.run === r && x.minute === m) || {}).median) })), { fmt: v => num(v, 0) + ' s', height: 210 });
    legend(host, [{ label: 'Session 1', color: css('--lad-3') }, { label: 'Session 2', color: css('--lad-1') }]);
  },

  const dl = h('datalist', { id: 'cardlist' }, host);
  CARDS.filter(o => o.id !== c.id).forEach(o => h('option', { value: o.title }, dl));
  const add = h('input', { class: 'txt', placeholder: 'Link to another card — type to search', list: 'cardlist' }, host);
  add.onchange = () => { const T = CARDS.find(o => o.title === add.value); if (T && !r.links.some(l => l.to === T.id)) { r.links.push({ to: T.id, note: '' }); save(c.id); render(); } };

  h('label', { class: 'sm', text: 'Tags (comma-separated)' }, host);
  const tg = h('input', { class: 'txt', value: (r.tags || []).join(', '), placeholder: 'e.g. paper, figure, ask supervisor' }, host);
  tg.oninput = () => { r.tags = tg.value.split(',').map(s => s.trim()).filter(Boolean); save(c.id); };

  const nb = h('div', { class: 'navbtns' }, host);
  h('button', { text: '← Previous' }, nb).onclick = () => step(-1);
  h('button', { text: 'Next →' }, nb).onclick = () => step(1);

  const hist = (REG.history || {})[c.id] || [];
  if (hist.length) { const hd = h('div', { class: 'hist' }, host); h('label', { class: 'sm', text: 'Earlier passes' }, hd);
    hist.forEach(x => { const d = h('div', { class: 'h' }, hd);
      h('div', { html: `<b>Pass ${x.pass}</b> · ${x.verdict || 'no verdict'}` }, d);
      if (x.note) h('div', { text: x.note }, d);
      if ((x.links || []).length) h('div', { class: 'cap', text: 'links: ' + x.links.map(l => (BYID[l.to] || { title: l.to }).title).join('; ') }, d); }); }
  h('div', { class: 'keys', html: 'Keys (outside the text boxes): <b>j / k</b> or <b>← →</b> next / previous · <b>1–6</b> verdict<br>Alt + ← / → works everywhere.' }, host);
}

function renderTable(body) {
  const w = h('div', { class: 'full' }, body);
  if (FMODE) {                                            // every pass-1 card, your verdict on it, and where it went
    const t = h('table', { class: 'reg' }, w), hr = h('tr', {}, h('thead', {}, t));
    ['Area', 'Pass-1 card', 'Your verdict', 'Your note', 'Now in', 'Status'].forEach(x => h('th', { text: x }, hr));
    const tb = h('tbody', {}, t);
    REG.cards.forEach(c => { const hs = ((REG.history || {})[c.id] || []).slice(-1)[0] || {}, tr = h('tr', {}, tb);
      h('td', { text: c.group }, tr); h('a', { text: c.title }, h('td', {}, tr)).onclick = () => go(c.id);
      const v = h('td', { text: hs.verdict || '' }, tr); if (hs.verdict) v.style.color = `var(${VCOL[hs.verdict]})`;
      h('td', { text: (hs.note || '').slice(0, 160) }, tr);
      const inn = h('td', {}, tr); (ABSORBED_BY[c.id] || []).forEach(fid => { h('a', { text: BYID[fid].title, style: 'display:block' }, inn).onclick = () => go(fid); });
      h('td', { text: c.status || 'active' }, tr); });
    return;
  }
  const t = h('table', { class: 'reg' }, w), hr = h('tr', {}, h('thead', {}, t));
  ['Area', 'Card', 'Kind', 'Confidence', 'Verdict', 'Note', 'Your links', 'Tags'].forEach(x => h('th', { text: x }, hr));
  const tb = h('tbody', {}, t);
  CARDS.forEach(c => { const r = RESP.cards[c.id] || {}, tr = h('tr', {}, tb);
    h('td', { text: c.group }, tr); const a = h('a', { text: c.title }, h('td', {}, tr)); a.onclick = () => go(c.id);
    h('td', { text: c.kind }, tr); h('td', { text: c.confidence }, tr);
    const v = h('td', { text: r.verdict || '' }, tr); if (r.verdict) v.style.color = `var(${VCOL[r.verdict]})`;
    h('td', { text: (r.note || '').slice(0, 160) }, tr);
    h('td', { text: (r.links || []).map(l => (BYID[l.to] || { title: l.to }).title).join('; ') }, tr);
    h('td', { text: (r.tags || []).join(', ') }, tr); });
}

/* force-directed link map: suggested links dashed, yours solid; colour = verdict (grey = none yet) */
function renderMap(body) {
  const w = h('div', { class: 'full mapwrap' }, body);
  const lg = h('div', { class: 'maplegend' }, w);
  let hidePruned = true, onlyMine = false;
  const tog = (lab, get, set) => { const l = h('label', {}, lg); const i = h('input', { type: 'checkbox' }, l); i.checked = get(); i.onchange = () => { set(i.checked); draw(); }; l.append(' ' + lab); };
  tog('hide pruned', () => hidePruned, v => hidePruned = v);
  tog('only your links', () => onlyMine, v => onlyMine = v);
  VERDICTS.forEach(([k, l, c]) => { const s = h('span', {}, lg); h('i', { style: `background:var(${c})` }, s); s.append(l); });
  const s0 = h('span', {}, lg); h('i', { style: 'background:var(--surface-2);border:1px solid var(--line)' }, s0); s0.append('not yet');
  h('span', { text: '— suggested link · ━ your link · drag to arrange, click to open' }, lg);
  const box = h('div', {}, w);
  function draw() {
    const nodes = CARDS.filter(c => !(hidePruned && (RESP.cards[c.id] || {}).verdict === 'prune')).map(c => ({ c, id: c.id }));
    const idx = Object.fromEntries(nodes.map((n, i) => [n.id, i]));
    const edges = [];
    nodes.forEach(n => {
      if (!onlyMine) (n.c.links || []).forEach(l => { if (idx[l.to] != null) edges.push({ a: idx[n.id], b: idx[l.to], mine: false }); });
      ((RESP.cards[n.id] || {}).links || []).forEach(l => { if (idx[l.to] != null) edges.push({ a: idx[n.id], b: idx[l.to], mine: true }); });
    });
    const W = 1400, H = 900, gi = Object.fromEntries(GROUPS.map((g, i) => [g, i]));
    nodes.forEach((n, i) => { const a = 2 * Math.PI * gi[n.c.group] / GROUPS.length;
      n.x = W / 2 + 330 * Math.cos(a) + (i % 7) * 9; n.y = H / 2 + 300 * Math.sin(a) + (i % 5) * 9; n.vx = 0; n.vy = 0; });
    for (let it = 0; it < 380; it++) {
      const k = 1 - it / 380;
      for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
        const A = nodes[i], B = nodes[j]; let dx = A.x - B.x, dy = A.y - B.y; const d2 = dx * dx + dy * dy + 0.01, f = 2600 / d2;
        A.vx += dx * f * 0.05; A.vy += dy * f * 0.05; B.vx -= dx * f * 0.05; B.vy -= dy * f * 0.05; }
      edges.forEach(e => { const A = nodes[e.a], B = nodes[e.b], dx = B.x - A.x, dy = B.y - A.y, d = Math.sqrt(dx * dx + dy * dy) || 1,
        f = (d - (e.mine ? 90 : 120)) * 0.012; A.vx += dx / d * f * d * 0.05; A.vy += dy / d * f * d * 0.05; B.vx -= dx / d * f * d * 0.05; B.vy -= dy / d * f * d * 0.05; });
      nodes.forEach(n => { const a = 2 * Math.PI * gi[n.c.group] / GROUPS.length;   // gentle pull to the group's sector
        n.vx += (W / 2 + 300 * Math.cos(a) - n.x) * 0.004; n.vy += (H / 2 + 280 * Math.sin(a) - n.y) * 0.004;
        n.x += Math.max(-20, Math.min(20, n.vx)) * k; n.y += Math.max(-20, Math.min(20, n.vy)) * k; n.vx *= 0.6; n.vy *= 0.6;
        n.x = Math.max(60, Math.min(W - 60, n.x)); n.y = Math.max(30, Math.min(H - 30, n.y)); });
    }
    const s = svgRoot(box, W, H);
    const lines = edges.map(e => el('line', { stroke: css(e.mine ? '--ink' : '--mark-soft'), 'stroke-width': e.mine ? 1.8 : 1,
      'stroke-dasharray': e.mine ? '' : '4 4', opacity: e.mine ? .85 : .7 }, s));
    GROUPS.forEach((g, i) => { const a = 2 * Math.PI * i / GROUPS.length;
      el('text', { x: W / 2 + 420 * Math.cos(a), y: H / 2 + 390 * Math.sin(a), 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 13, 'font-family': css('--mono') }, s).textContent = g; });
    const gs = nodes.map(n => {
      const v = (RESP.cards[n.id] || {}).verdict, g = el('g', { style: 'cursor:pointer' }, s);
      el('circle', { r: n.c.kind === 'qual' ? 6 : 9, fill: v ? css(VCOL[v]) : css('--surface-2'), stroke: css('--ink-3'), 'stroke-width': 1 }, g);
      el('text', { x: 12, y: 4, 'font-size': 11, fill: css('--ink-2') }, g).textContent = n.c.title.length > 38 ? n.c.title.slice(0, 36) + '…' : n.c.title;
      hoverable(g, `<b>${n.c.title}</b><br>${n.c.group} · ${v || 'no verdict yet'}${(RESP.cards[n.id] || {}).note ? '<br>' + RESP.cards[n.id].note.slice(0, 200) : ''}`);
      let drag = null;
      g.addEventListener('mousedown', ev => { drag = { x: ev.clientX, y: ev.clientY, moved: false }; ev.preventDefault();
        const mm = e2 => { const r = s.getBoundingClientRect(), sc = W / r.width; n.x += (e2.clientX - drag.x) * sc; n.y += (e2.clientY - drag.y) * sc;
          drag.x = e2.clientX; drag.y = e2.clientY; drag.moved = true; place(); };
        const mu = () => { removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); if (!drag.moved) go(n.id); };
        addEventListener('mousemove', mm); addEventListener('mouseup', mu); });
      return g;
    });
    function place() {
      lines.forEach((l, i) => { const e = edges[i]; l.setAttribute('x1', nodes[e.a].x); l.setAttribute('y1', nodes[e.a].y); l.setAttribute('x2', nodes[e.b].x); l.setAttribute('y2', nodes[e.b].y); });
      gs.forEach((g, i) => g.setAttribute('transform', `translate(${nodes[i].x},${nodes[i].y})`));
    }
    place();
  }
  draw();
}

/* ═══════════════════════════ keys, export, import, boot ═══════════════════════════ */
addEventListener('keydown', e => {
  const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
  if (e.altKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); step(e.key === 'ArrowRight' ? 1 : -1); return; }
  if (typing || VIEW !== 'review') return;
  if (e.key === 'j' || e.key === 'ArrowRight') step(1);
  else if (e.key === 'k' || e.key === 'ArrowLeft') step(-1);
  else if (/^[1-6]$/.test(e.key)) { const [k] = VERDICTS[+e.key - 1], r = resp(CUR); r.verdict = r.verdict === k ? null : k; save(CUR); render(); }
});
$('exp').onclick = () => {
  const blob = new Blob([JSON.stringify(RESP, null, 1)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `review_pass${PASS}_${new Date().toISOString().slice(0, 16).replace(':', '')}.json` });
  document.body.appendChild(a); a.click(); a.remove();
};
$('imp').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { const J = JSON.parse(t);
    Object.entries(J.cards || {}).forEach(([id, r]) => { const mine = RESP.cards[id];
      if (!mine || (Date.parse(r.updated || 0) || 0) > (Date.parse(mine.updated || 0) || 0)) RESP.cards[id] = r; });
    save(); render(); });
};
setSaved('saved in this browser — export to share', 'local');
fetch('/api/responses').then(r => r.ok ? r.json() : Promise.reject()).then(J => {
  if (J && J.pass != null && J.pass !== PASS) {   // this page is from another pass: never push its notes to disk
    setSaved(`out of date: the server is on pass ${J.pass} — rebuild/reload the page`, 'local'); return; }
  SERVER = true;
  if (J && J.cards && J.pass === PASS && stamp(J) > stamp(RESP)) RESP = J;
  setSaved('connected — saving to disk', 'disk');
  if (stamp(RESP) > stamp(J || {})) save();     // notes kept only in this browser so far: push them to disk now
  render();
}).catch(() => {});
render();
</script>
</body>
