<html lang="en">

<style>
/* Generated by scripts/build_findings_synthesis.py from scripts/findings_synthesis_template.html.
   Edit the TEMPLATE, never the generated page.

   Palette note: the tier pair and the reliance ladder are inherited unchanged from
   study_analysis_template.html so the two report pages agree. The route triple (Aggressive /

   surface contrast in both modes before use. */

<body>
<div class="themebar"><button id="t-light">light</button><button id="t-dark">dark</button></div>
<div id="tip" role="status" aria-live="polite"></div>
<main id="main"></main>

<script>
const DATA = /*__DATA__*/null;

/*__COMMON_JS__*/
/* — masthead — */
h('div', { class: 'kicker', text: 'Human–autonomy trust study · results synthesis' }, main);
h('h1', { text: 'Two tiers, and what people said' }, main);
h('p', { class: 'lede', html:
  'What operators did with a two-tier assistant, why they say they did it, and the three places '
  + 'where those two answers do not match. Every number is recomputed from the event logs on build; '
  + 'every quote is a coded debrief extract with its participant and timestamp attached.' }, main);

const ban = h('div', { class: 'banner' }, main);
ban.innerHTML = '<b>Identifiable data — do not circulate.</b> This page embeds verbatim participant '
  + 'speech alongside the pooled numbers, so it is identifiable under the same terms as the '
  + 'recordings. Do not paste it into a hosted tool. Rebuild it with '
  + '<code>python scripts/build_findings_synthesis.py</code>.';

h('p', { class: 'meta', text:
  `Generated ${DATA.generated} · ${C.n.participants} participants, ${C.n.sessions} sessions, `
  + `${C.n.decisions} strategic decisions · ${N.quotes.length} coded quotes from `
  + `${N.participants.length} debriefs · crossover estimates from the ${S.cohort || 'study'} cohort `
  + `(n = ${S.n || '—'}) · P09 excluded throughout` }, main);

const toc = h('nav', { class: 'toc' }, main);
const tocList = h('ol', {}, toc);

const SECTIONS = [];
function reg(id, title) { SECTIONS.push([id, title]); }

/* — 1 · the argument — */
reg('argument', 'The argument in one page');
{
  const s = section('argument', 'Summary', 'The argument in one page');
  para(s, 'The study was built to ask which of two assistant tiers operators trust more. The data '
    + 'answers a different and more useful question, because the tier gap turns out not to be a '
    + 'gap in trust at all.');
  tiles(s, [
    { v: pct(C.preemption.overall, 0), k: 'of “Manual” choices were made before the recommendation had loaded', s: `n = ${C.preemption.n}` },
    { v: pct(C.artefact.prevalence, 0), k: 'of Conservative cards committed a drone type the mission had no use for', s: `n = ${C.n.decisions}` },
    { v: pct(C.position.overall['below both'] + C.position.overall['between'], 0), k: 'of manual allocations sat between the two cards or below both', s: 'i.e. anchored on them' },
    { v: pval(C.carryover.nextModel.p).replace('p = ', ''), k: 'effect of seeing a bad card on the very next decision', s: 'no carry-over at all' },
  ]);
  para(s, '<b>Reliance here is a price, not a posture.</b> Operators do not arrive with a level of '
    + 'trust and spend it; they work out, decision by decision, whether consulting the assistant is '
    + 'worth what it costs — and the costs differ sharply between the two tiers for reasons that '
    + 'have nothing to do with how good either one is. Three structural forces do almost all the '
    + 'work: what the mission needs, what verification costs at each tier, and how long the '
    + 'assistant makes you wait.');
  note(s, '<b>How to read this page.</b> Findings computed here are recomputed from '
    + '<code>Results/Participants/</code> on every build. Crossover performance and recovery numbers '
    + 'are read from <code>docs/reports/study_analysis.json</code> rather than recomputed, so this '
    + 'page and <i>two-tiers-two-scenarios.html</i> cannot disagree. The near-perfect reference score '
    + 'comes from <code>sim/engine.mts --games</code> run over the four fixed games.');
  note(s, '<b>Every quote here is from the post-session debrief — not spoken during the task.</b> '
    + 'The tag on each quote (“asked to compare the two assistants”, and so on) is the coder’s topic '
    + 'label plus what the researcher had just asked; it is <i>not</i> a record of what the operator '
    + 'was doing at that moment. Speech recorded <i>during</i> the sessions exists and is '
    + 'transcribed, but it has <b>not</b> yet been aligned to individual decisions — that needs a '
    + 'per-session timer alignment which is not yet built (see <code>docs/NARRATION.md</code>). So '
    + 'nothing on this page pairs a sentence with the click it accompanied. Where a quote is set '
    + 'beside a behavioural result, the claim is that the two are about the same thing, not that '
    + 'they were simultaneous. Coding is a single uncalibrated pass, no second rater, no κ.');
}

/* — 1b · the sample —
   Descriptive, and placed before any finding, because almost everything in the disposition section
   that follows is a null and a null is only readable once you know who it is a null about. */
reg('sample', 'Who the operators were');
{
  const s = section('sample', 'Sample', 'Who the operators were');
  const SA = DP.sample, cov = DP.coverage;
  para(s, `Thirty-three operators, two sessions each — ${SR.n.sessions} sessions in all, every one `
    + 'of them with a complete post-session questionnaire set. Scenario order is counterbalanced, '
    + 'so every measure below is a within-person crossover.');
  tiles(s, [
    { v: String(SA.n), k: 'operators', s: SR.n.sessions + ' sessions, all surveys complete' },
    { v: num(SA.age.mean, 1), k: 'mean age', s: `range ${SA.age.lo}–${SA.age.hi}` },
    { v: `${SA.fieldStem}/${SA.n}`, k: 'from a computing or engineering field', s: 'self-described' },
    { v: `${cov.withBattery}/${cov.n}`, k: 'completed the AI-disposition battery', s: 'added in study-v1.3' },
  ]);

  const c = card(s, 'Background');
  const gen = SA.gender.map(r => `${r.label} ${r.n}`).join(' · ');
  const edu = SA.education.map(r => `${r.label.replace(/\s*\/\s*/g, '/')} ${r.n}`).join(' · ');
  para(c, `<b>Gender</b> ${gen}. <b>Education</b> ${edu}. <b>Plays video games</b> `
    + SA.gaming.map(r => `${r.label.toLowerCase()} ${r.n}`).join(' · ') + '.');
  tableFor(c, ['Prior experience with…', 'None', 'A little', 'Moderate', 'Extensive'],
    SA.experience.filter(e => e.key !== 'gaming_frequency' && e.levels.length === 4)
      .map(e => [e.label, ...e.levels.map(l => l.n)]),
    'Show the five prior-experience items');

  note(s, '<b>This is a convenience sample of research students, and it constrains what the rest of '
    + `the page can ask.</b> ${SA.fieldStem} of the ${SA.n} describe a computing, engineering, AI or `
    + 'physical-science field, most at postgraduate level. Two of the five experience axes are '
    + 'floored — '
    + SA.experience.filter(e => ['Operating drones', 'Dispatch / command / ATC'].includes(e.label))
      .map(e => `${e.label} (${e.levels[0].n}/${SA.n} answered “None”)`).join(' and ')
    + ' — so they are reported for completeness and cannot really be tested. Nobody here is a '
    + 'trained emergency dispatcher, and the people who rely on an assistant least may be exactly '
    + 'the people this sample over-represents.');
  note(s, `<b>${cov.missing.join(', ')} predates the battery.</b> The AI-disposition questions were `
    + 'added in <code>study-v1.3</code>; sessions before it have no <code>aias_</code>/'
    + '<code>verif_</code>/<code>deleg_</code> keys at all. That is absence, not a zero, so those '
    + `participants drop out of the disposition tests (n = ${cov.withBattery}) and stay in `
    + 'everything else. Nobody straight-lined a whole questionnaire set '
    + `(${SR.n.flat} of ${SR.n.sessions} sessions), and every operator agreed or strongly agreed `
    + 'with each comprehension-check item, so no session is excluded on either ground.');
}

/* — 1c · the post-session questionnaires —
   The between-session instruments: NASA-TLX and the two trust scales. Never previously reported. */
reg('selfreport', 'What they said between the scenarios');
{
  // Kicker is deliberately NOT 'Finding': that word auto-increments the finding counter, and seven
  // places in the sections below refer to findings by number ('the three in Finding 4'). Numbering
  // these two in would silently shift every one of those references. They are a separate evidence
  // stream anyway -- what operators said, rather than what the logs show.
  const s = section('selfreport', 'Self-report', 'Workload did not move between scenarios; trust in the two tiers did');
  const G = SR.gap;
  const cx = k => SR.crossover.find(r => r.key === k) || {};
  const rtlx = cx('rtlx'), ts = cx('trust_s'), tt = cx('trust_t'), td = cx('trust_d');
  para(s, 'After every session operators rated their workload on the NASA-TLX and then rated each '
    + 'assistant on the same six statements. Two sessions each, counterbalanced, so both the '
    + 'scenario difference and the simple effect of being on your second run are identified. These '
    + 'questionnaires had never been analysed; they turn out to carry the one thing the behavioural '
    + 'data does not — an explicit, ranked comparison of the two tiers.');
  tiles(s, [
    { v: sgn(G.diff, 2), k: 'higher trust in the Tactical Assistant, on 7', s: `dz = ${num(G.dz, 2)}, ${pval(G.p)}` },
    { v: `${G.higherTactical}/${G.n}`, k: 'operators rated the tactical tier higher', s: `${G.higherStrategic} rated the strategic tier higher` },
    { v: sgn(rtlx.scenario ? rtlx.scenario.diff : null, 2), k: 'scenario effect on workload (of 20)', s: pval(rtlx.scenario && rtlx.scenario.p) },
    { v: sgn(ts.run ? ts.run.diff : null, 2), k: 'change in strategic trust by run 2', s: pval(ts.run && ts.run.p) },
  ]);

  h('h3', { text: 'Workload is flat across a manipulation that changed everything else' }, s);
  const cW = card(s, 'NASA-TLX subscales by scenario (0–20, higher = more demanding)');
  legend(cW, [{ label: 'Strategic Heavy', color: css('--s-strat') },
              { label: 'Tactical Heavy', color: css('--s-tac') }]);
  barsGrouped(h('div', { class: 'chart' }, cW),
    SR.tlxCrossover.map(r => r.label.replace(' (high = failure)', '')),
    [{ label: 'Strategic Heavy', color: css('--s-strat'), values: SR.tlxCrossover.map(r => r.means.strategic) },
     { label: 'Tactical Heavy', color: css('--s-tac'), values: SR.tlxCrossover.map(r => r.means.tactical) }],
    { max: 20, height: 260 });
  tableFor(cW, ['Subscale', 'Strategic Heavy', 'Tactical Heavy', 'Scenario effect', 'Run effect'],
    SR.tlxCrossover.map(r => [r.label, num(r.means.strategic, 2), num(r.means.tactical, 2),
                              `${sgn(r.scenario.diff, 2)} (${pval(r.scenario.p)})`,
                              `${sgn(r.run.diff, 2)} (${pval(r.run.p)})`]),
    'Show the crossover estimates per subscale');
  para(s, `Raw TLX is ${num(rtlx.means && rtlx.means.strategic, 2)} in Strategic Heavy and `
    + `${num(rtlx.means && rtlx.means.tactical, 2)} in Tactical Heavy — a difference of `
    + `${sgn(rtlx.scenario && rtlx.scenario.diff, 2)} on a 20-point scale, `
    + `${pval(rtlx.scenario && rtlx.scenario.p)}. No subscale moves either. The same crossover run `
    + `on score finds ${sgn(cx('score').scenario && cx('score').scenario.diff, 0)} points `
    + `(${pval(cx('score').scenario && cx('score').scenario.p)}) and on card uptake `
    + `${sgn(100 * cx('took').scenario.diff, 0)} percentage points `
    + `(${pval(cx('took').scenario && cx('took').scenario.p)}). <b>The manipulation changed what `
    + 'operators did and what they scored without changing how hard the session felt.</b>');
  note(s, 'Two readings, and the data here cannot separate them. Either the scenarios genuinely '
    + 'impose similar load by different routes — more missions to triage versus more drones to '
    + 'route — or the TLX is too coarse an instrument to catch a difference in <i>what kind</i> of '
    + 'work a session demands. Mental demand and time pressure are the two highest subscales in '
    + 'both scenarios and physical demand the lowest, which is at least the right shape for a '
    + 'seated supervisory task. Note also that workload is mid-scale '
    + `(${num(rtlx.means && rtlx.means.strategic, 1)} of 20), so neither a floor nor a ceiling is `
    + 'hiding a difference.');

  h('h3', { text: 'The trust gap, and the one item that behaves differently' }, s);
  const cI = card(s, 'The same six statements, asked about each assistant (1–7)');
  legend(cI, [{ label: 'Strategic Assistant', color: css('--s-strat') },
              { label: 'Tactical Assistant', color: css('--s-tac') }]);
  barsGrouped(h('div', { class: 'chart' }, cI), SR.items.map(i => i.label.replace(/^I /, '')),
    [{ label: 'Strategic Assistant', color: css('--s-strat'), values: SR.items.map(i => i.strategic) },
     { label: 'Tactical Assistant', color: css('--s-tac'), values: SR.items.map(i => i.tactical) }],
    // No `fmt`: the default already prints the axis at 0dp and the bar values at 1dp, which is
    // what a 1-7 scale wants.
    { max: 7, ticks: 7, height: 270 });
  h('p', { class: 'cap', html: 'Six identical stems, prefixed per assistant. The tactical tier is '
    + 'rated higher on every one. <b>On both tiers the lowest-rated item by a wide margin is the '
    + 'one that asks for unconditional compliance</b> — '
    + `“would follow it without hesitation”, ${num(SR.items.find(i => i.stem === 'follow').strategic, 2)} `
    + `and ${num(SR.items.find(i => i.stem === 'follow').tactical, 2)}, against `
    + `${num(SR.items.find(i => i.stem === 'useful').strategic, 2)} and `
    + `${num(SR.items.find(i => i.stem === 'useful').tactical, 2)} for “provides useful guidance”.` }, cI);

  const cS = card(s, 'Each operator’s trust in the two assistants');
  slopes(h('div', { class: 'chart' }, cS), SR.slopes.map(x => ({ label: x.pid, a: x.a, b: x.b })),
    { aLabel: 'Strategic Assistant', bLabel: 'Tactical Assistant', lo: 1, hi: 7,
      ticks: [1, 4, 7], fmt: v => num(v, 1), height: 280 });
  h('p', { class: 'cap', html: `One line per operator, averaged over both their sessions; heavy line `
    + `is the mean. Paired difference ${sgn(G.diff, 2)} (95% CI ${num(G.lo, 2)} to ${num(G.hi, 2)}), `
    + `d<sub>z</sub> = ${num(G.dz, 2)}, ${pval(G.p)}; Wilcoxon ${pval(G.wilcoxon)}. `
    + `${G.higherTactical} of ${G.n} operators rank the tactical tier higher, ${G.higherStrategic} `
    + `the strategic one${G.tied ? `, ${G.tied} tied` : ''}. Internal consistency is high on both `
    + `scales (α = ${num(SR.alpha.strategic, 2)} strategic, ${num(SR.alpha.tactical, 2)} `
    + `tactical), so this is one construct measured twice, not noise.` }, cS);

  para(s, '<b>The debriefs, coded independently of any of this, say the same thing.</b> Of the '
    + `${SR.stanceCoded} coded debriefs, ${SR.stance.prefers_tactical || 0} operators expressed a `
    + `preference for the tactical tier and ${SR.stance.prefers_strategic || 0} for the strategic `
    + `one (${SR.stance.distrusts_both || 0} distrusted both, ${SR.stance.trusts_both || 0} trusted `
    + `both, ${SR.stance.conditional || 0} made their answer conditional). Two streams, one `
    + 'questionnaire and one interview, agreeing on a ranking.');
  quote(s, 'P27/agent_comparison/1828');
  quote(s, 'P20/agent_comparison/1620');

  h('h3', { text: 'But reported trust is not the same thing as the reliance it is supposed to explain' }, s);
  para(s, 'This is where the self-report and the behaviour part company. The page’s behavioural '
    + 'finding is that reliance is governed by mission composition and by what checking costs at '
    + 'each tier — see <a href="#drivers">the reliance models</a> and '
    + '<a href="#verification">verification as a price</a>. Asked directly, operators instead '
    + 'report a straightforward ranking of the two assistants. The two are reconcilable, and the '
    + 'most economical reading is uncomfortable for the questionnaire: at the tactical tier the '
    + 'plan is a drone-by-drone route through a complex mission, and checking it is expensive to '
    + 'the point of impracticality. An operator who cannot check is left reporting the assistant as '
    + 'trustworthy, because there is nothing else to report.');
  quote(s, 'P22/agent_comparison/1776');
  const cL = card(s, 'What the questionnaires do and do not track');
  const linkRows = SR.link.map(r => [r.label, 'ρ = ' + num(r.rho, 2), pval(r.p), 'n = ' + r.n]);
  const tL = h('table', {}, cL);
  const thL = h('tr', {}, h('thead', {}, tL));
  ['Pairing (session level)', 'ρ', 'Result', ''].forEach((x, i) =>
    h('th', { text: x, class: i ? 'num' : '' }, thL));
  const tbL = h('tbody', {}, tL);
  SR.link.forEach(r => {
    const tr = h('tr', {}, tbL);
    h('td', { text: r.label }, tr);
    h('td', { text: 'ρ = ' + num(r.rho, 2), class: 'num' }, tr);
    h('td', { text: pval(r.p), class: 'num ' + pClass(r.p) }, tr);
    h('td', { text: 'n = ' + r.n, class: 'num' }, tr);
  });
  h('p', { class: 'cap', html: 'The questionnaires are not disconnected from behaviour — but the '
    + 'strategic scale tracks that session’s card uptake about twice as strongly as the tactical '
    + 'scale tracks tactical consulting. <b>The survey is administered after the session</b>, which '
    + 'settles the direction it can be read in: a rating given at the end cannot have caused the '
    + 'reliance that preceded it. Read these as operators reporting, accurately, what they had just '
    + 'been doing — most accurately at the tier where they could see what they were doing.' }, cL);

  h('h3', { text: 'Exposure erodes strategic trust, and only strategic trust' }, s);
  const cC = card(s, 'Crossover estimates on the questionnaire measures');
  const tC = h('table', {}, cC);
  const thC = h('tr', {}, h('thead', {}, tC));
  ['Measure', 'Strategic Heavy', 'Tactical Heavy', 'Scenario effect', 'Run 2 − run 1'].forEach((x, i) =>
    h('th', { text: x, class: i ? 'num' : '' }, thC));
  const tbC = h('tbody', {}, tC);
  SR.crossover.forEach(r => {
    const tr = h('tr', {}, tbC);
    // Proportions are shown as percentages, so their effects are shown in percentage points
    // rather than as a bare 0.12 next to a 58%.
    const prop = r.key === 'took' || r.key === 'consult';
    const fv = v => prop ? pct(v, 0) : num(v, r.key === 'score' ? 0 : 2);
    const fe = v => prop ? sgn(100 * v, 0) + 'pp' : sgn(v, r.key === 'score' ? 0 : 2);
    h('td', { text: r.label }, tr);
    h('td', { text: fv(r.means.strategic), class: 'num' }, tr);
    h('td', { text: fv(r.means.tactical), class: 'num' }, tr);
    h('td', { html: `${fe(r.scenario.diff)} <span class="${pClass(r.scenario.p)}">`
      + `${pval(r.scenario.p)}</span>`, class: 'num' }, tr);
    h('td', { html: `${fe(r.run.diff)} <span class="${pClass(r.run.p)}">${pval(r.run.p)}</span>`,
              class: 'num' }, tr);
  });
  h('p', { class: 'cap', html: 'Standard 2×2 crossover (Jones & Kenward), the same estimator the '
    + 'log-only report uses on every performance measure: the scenario effect is half the '
    + 'difference between the two order groups’ within-person changes, the run effect half their '
    + 'sum. Imported from <code>study_analysis.py</code> rather than reimplemented.' }, cC);
  para(s, `Trust in the Strategic Assistant falls by ${num(Math.abs(ts.run.diff), 2)} points from `
    + `run 1 to run 2 (${pval(ts.run.p)}) while trust in the Tactical Assistant does not move `
    + `(${sgn(tt.run.diff, 2)}, ${pval(tt.run.p)}), so the gap between the two tiers `
    + `${td.run.diff > 0 ? 'widens' : 'narrows'} with exposure `
    + `(${sgn(td.run.diff, 2)}, ${pval(td.run.p)}). Behaviour moves the same way and less: card `
    + `uptake changes by ${sgn(100 * cx('took').run.diff, 0)}pp `
    + `(${pval(cx('took').run.p)}). <b>A second session is enough to cost the strategic tier `
    + 'reported trust, and the most obvious thing a second session gives an operator time to '
    + 'notice is set out below</b> — the Conservative card that commits a drone type the mission '
    + 'has no use for, in <a href="#artefact">when simple rules look wrong</a>. Strategic trust is '
    + 'also the one measure with a '
    + `scenario effect (${sgn(ts.scenario.diff, 2)}, ${pval(ts.scenario.p)}): the tier is rated `
    + 'higher in the scenario where its advice was worth more.');
  quote(s, 'P19/trust_trajectory/2001');
  note(s, '<b>Four limits on this section.</b> (1) Each scale was administered once per session, at '
    + 'the end, so “trust” here is one retrospective reading and the erosion result is two points '
    + 'on a line, not a trajectory. (2) The run effect carries learning, fatigue and — for '
    + 'participants before the game-order swap — some game-difficulty confound; see '
    + '<a href="#learning">learning</a>. (3) The trust scales are adapted, not a verbatim validated '
    + 'instrument, though both are internally consistent here. (4) Nothing in this section is '
    + 'causal: the scenario and run contrasts are experimental, every correlation with behaviour '
    + 'is not.');
}

/* — 1d · the pre-study battery — */
reg('disposition', 'What they brought with them');
{
  const s = section('disposition', 'Disposition', 'Nothing operators brought with them predicted how they used either tier');
  para(s, 'Before session 1 every operator (from <code>study-v1.3</code> on) completed three '
    + 'Likert batteries: the validated four-item ' + gl('aias', 'AIAS-4') + ' on general attitude '
    + 'to AI, a bespoke ' + gl('verification', 'verification-propensity') + ' scale, and a bespoke '
    + gl('delegation', 'delegation-boundary') + ' scale on how much authority a human should keep. With five prior-experience items alongside them, that is eight '
    + 'candidate individual-difference predictors of reliance. They were scored and then never '
    + 'reported. Here is what they predict.');
  tiles(s, [
    { v: String(DP.nTests), k: 'disposition × behaviour tests run', s: `n = ${DP.nDetect} operators` },
    { v: String(DP.nNominal), k: 'significant at p < .05 uncorrected', s: 'out of ' + DP.nTests },
    { v: String(DP.nHolm), k: 'surviving Holm correction', s: 'the whole family corrected together' },
    { v: 'ρ ≥ ' + num(DP.detectable, 2), k: 'smallest correlation this sample could detect', s: '80% power, two-tailed' },
  ]);

  const cB = card(s, 'The three batteries');
  const tB = h('table', {}, cB);
  const thB = h('tr', {}, h('thead', {}, tB));
  ['Battery', 'Scale', 'Mean (SD)', 'Observed range', 'α', 'n'].forEach((x, i) => {
    const th = h('th', { text: x, class: i ? 'num' : '' }, thB);
    if (x === 'α') glNode(th, 'alpha');
  });
  const tbB = h('tbody', {}, tB);
  DP.batteries.forEach(b => {
    const tr = h('tr', {}, tbB);
    h('td', { html: gl(b.key, b.label) + (b.validated ? ' <span class="badge">VALIDATED</span>' : '') }, tr);
    h('td', { text: b.scale, class: 'num' }, tr);
    h('td', { text: `${num(b.mean, 2)} (${num(b.sd, 2)})`, class: 'num' }, tr);
    h('td', { text: `${num(b.lo, 2)}–${num(b.hi, 2)}`, class: 'num' }, tr);
    h('td', { text: num(b.alpha, 2), class: 'num ' + (b.alpha >= 0.7 ? 'sig' : 'ns') }, tr);
    h('td', { text: b.n, class: 'num' }, tr);
  });
  h('p', { class: 'cap', html: 'Scored exactly as <code>docs/STUDY_BUILD.md</code> §10 specifies '
    + '(reverse-keyed items flipped at analysis time; the error-detectability item held out of the '
    + 'verification composite by design), using the same '
    + '<code>agent_scenario_stats.score_attitudes</code> the rest of the pipeline uses. <b>The two '
    + 'bespoke composites are not reliable enough to carry a null</b> — α of '
    + `${num(DP.batteries[1].alpha, 2)} and ${num(DP.batteries[2].alpha, 2)} against `
    + `${num(DP.batteries[0].alpha, 2)} for the validated AIAS-4. Each was five or six items `
    + 'written for this study and never piloted as a scale.' }, cB);

  const cD = card(s, 'Every disposition against every behaviour (Spearman ρ)');
  // A grid, not a ranked list: rows are what operators brought with them, columns are what they
  // did, so each correlation has one obvious place and no label has to name two things at once.
  const preds = [...new Set(DP.cells.map(c => c.predictor))];
  const behs = [...new Set(DP.cells.map(c => c.behaviour))];
  const COL_NAME = { took: 'Took a strategy card', consult: 'Consulted tactical plan',
                     accept: 'Tactical plan unmodified', secs: 'Strategic decision time',
                     score: 'Session score' };
  const tH = h('table', { class: 'heat' }, h('div', { class: 'scroll' }, cD));
  const hrH = h('tr', {}, h('thead', {}, tH));
  h('th', { text: 'Disposition' }, hrH);
  behs.forEach(bk => glNode(h('th', { text: COL_NAME[bk] || bk }, hrH), bk));
  const tbH = h('tbody', {}, tH);
  const pos = css('--s-strat'), neg = css('--s-tac');
  preds.forEach(pk => {
    const tr = h('tr', {}, tbH);
    glNode(h('td', { text: DP.cells.find(c => c.predictor === pk).predictorLabel }, tr), pk);
    behs.forEach(bk => {
      const c = DP.cells.find(x => x.predictor === pk && x.behaviour === bk);
      const td = h('td', { class: 'cell' + (c && c.p < 0.05 ? ' sig' : '') }, tr);
      if (!c || c.rho == null) { td.textContent = '—'; return; }
      const a = Math.min(1, Math.abs(c.rho) / 0.5);  // full colour at |ρ| = .5
      td.style.background = `color-mix(in srgb, ${c.rho >= 0 ? pos : neg} ${Math.round(a * 55)}%, transparent)`;
      td.textContent = sgn(c.rho, 2);
      hoverable(td, `<b>${c.predictorLabel}</b><br>vs ${c.behaviourLabel}<br>ρ = ${sgn(c.rho, 2)} · `
        + `${pval(c.p)} · Holm ${pval(c.holm)} · n = ${c.n}`);
    });
  });
  h('p', { class: 'cap', html: 'Each number is a ' + gl('rho') + '. Hover any row or column name '
    + 'for what it measures and what its numbers mean. '
    + 'Each row is something operators brought with them; each column is '
    + 'something they did. <b>Blue</b>: operators higher on that disposition did <i>more</i> of the '
    + 'behaviour (or took longer, or scored higher). <b>Orange</b>: less. Deeper colour means a '
    + 'stronger correlation. A <b>boxed</b> cell is significant at p &lt; .05 before correction; '
    + '<b>none survives ' + gl('holm') + '</b>. Hover a cell for the item wording and both p-values.' }, cD);
  tableFor(cD, ['Disposition', 'Behaviour', 'ρ', 'p', 'Holm-adjusted p', 'n'],
    DP.cells.slice().sort((a, b) => (a.p == null) - (b.p == null) || a.p - b.p)
      .map(c => [{ text: c.predictorLabel.replace(/[“”]/g, '"'), g: c.predictor },
                 { text: c.behaviourLabel, g: c.behaviour }, num(c.rho, 2),
                 pval(c.p).replace('p = ', '').replace('p < ', '<'),
                 pval(c.holm).replace('p = ', '').replace('p < ', '<'), c.n]),
    `Show all ${DP.nTests} tests as a list`);
  para(s, `Three of the ${DP.nTests} clear p &lt; .05 before correction and none of them clears Holm. `
    + 'The three are at least coherent rather than random — operators who scored higher on the '
    + 'delegation-boundary scale consulted the tactical plan less and took it unmodified less '
    + 'often, and operators higher on verification propensity scored lower, which is what a habit '
    + 'of checking should cost in a timed task. But a family of '
    + `${DP.nTests} tests at n = ${DP.nDetect} is expected to throw up two by chance, and these are `
    + 'exactly the size of the ones it throws up. <b>They are hypotheses for a study designed to '
    + 'test them, not findings.</b>');

  h('h3', { text: 'The one test the instrument was designed for' }, s);
  para(s, 'Two delegation items were written against this study’s own structure — the Strategic '
    + 'Assistant recommends and the operator decides, the Tactical Assistant plans the execution. '
    + 'If operators were responding to that distinction, “I trust AI more for suggesting options '
    + 'than for making decisions” should predict the <i>gap</i> between how much they used each '
    + 'tier, not either level alone. It predicts nothing.');
  const cT = card(s, 'Predicting the difference between strategic uptake and tactical consulting');
  tableFor(cT, ['Disposition', 'ρ with the tier gap', 'p', 'n'],
    DP.tierGap.map(r => [{ text: r.label.replace(/[“”]/g, '"'), g: r.predictor }, num(r.rho, 2),
                         pval(r.p).replace('p = ', ''), r.n]), 'Show the tier-gap tests');
  const tg = DP.tierGap[0];
  para(cT, `The designed test comes out at ρ = ${num(tg.rho, 2)}, ${pval(tg.p)}. Operators do hold `
    + 'views about where an AI’s authority should stop — the debriefs are full of them — and those '
    + 'views did not shape which tier they leaned on.');
  quote(s, 'P24/general_ai_disposition/1812');

  h('h3', { text: 'Nor does disposition predict what they reported afterwards' }, s);
  tableFor(card(s, 'Disposition against the post-session questionnaires'),
    ['Disposition', 'Reported measure', 'ρ', 'p', 'n'],
    DP.onTrust.map(r => [{ text: r.predictorLabel.replace(/[“”]/g, '"'), g: r.predictor },
                         { text: r.behaviourLabel, g: r.behaviour }, num(r.rho, 2),
                         pval(r.p).replace('p = ', ''), r.n]), 'Show the tests');
  para(s, 'This is the more interesting null of the two. If post-session trust were a disposition '
    + 'being expressed, a general attitude to AI should predict it. It does not — not for either '
    + 'assistant, and not for reported workload. Taken with the previous section, where the same '
    + 'ratings track that session’s own behaviour at ρ = '
    + `${num(SR.link[0].rho, 2)}, <b>the trust scales look like a reading taken on the session `
    + 'rather than a trait carried into it.</b> That is the same conclusion the behavioural half of '
    + 'this page reaches by a different route.');

  h('h3', { text: 'Prior experience, grouped' } , s);
  para(s, 'Each experience item is ordinal, so the only defensible grouping is a median split, '
    + 'tested with the same Welch contrast the log-only report uses between order groups.');
  const cG = card(s, 'Median split on each experience axis');
  const GB = [['took', 'Card uptake', v => pct(v, 0)], ['consult', 'Tactical consulting', v => pct(v, 0)],
              ['accept', 'Tactical unmodified', v => pct(v, 0)], ['secs', 'Decision time', v => num(v, 1) + 's'],
              ['score', 'Score', v => num(v, 0)]];
  const rowG = h('div', { class: 'picker' }, cG);
  h('span', { class: 'lbl', text: 'Behaviour' }, rowG);
  const segG = h('div', { class: 'seg' }, rowG);
  const gHost = h('div', { class: 'scroll' }, cG);
  const gBtns = GB.map(([k, label]) => {
    const btn = glNode(h('button', { text: label }, segG), k);
    btn.onclick = () => drawG(k);
    return [btn, k];
  });
  function drawG(k) {
    gBtns.forEach(([btn, kk]) => btn.classList.toggle('on', kk === k));
    const fv = GB.find(g => g[0] === k)[2];
    gHost.innerHTML = '';
    const tG = h('table', {}, gHost);
    const thG = h('tr', {}, h('thead', {}, tG));
    ['Experience axis', 'Less experienced half', 'More experienced half', 'p (Welch)'].forEach((x, i) => {
      const th = h('th', { text: x, class: i ? 'num' : '' }, thG);
      if (i === 3) glNode(th, 'welch');
    });
    const tbG = h('tbody', {}, tG);
    DP.groups.forEach(g => {
      const r = g.rows.find(x => x.behaviour === k);
      const tr = h('tr', {}, tbG);
      h('td', { html: gl(g.key, g.label) + (g.floored ? ' <span class="ns">· too few for a fair test</span>' : '') }, tr);
      h('td', { text: r ? `${fv(r.low)}  (n = ${g.nLow})` : '—', class: 'num' }, tr);
      h('td', { text: r ? `${fv(r.high)}  (n = ${g.nHigh})` : '—', class: 'num' }, tr);
      h('td', { text: r ? pval(r.p).replace('p ', '') : '—', class: 'num ' + (r ? pClass(r.p) : '') }, tr);
    });
  }
  drawG('took');
  h('p', { class: 'cap', html: 'Pick a behaviour. Each row splits operators at the median of one '
    + 'experience item and compares the two halves. '
    + `All ${DP.groups.reduce((n, g) => n + g.rows.length, 0)} contrasts, across every axis and every `
    + 'behaviour, are null. “Too few for a fair test” marks an axis where one half has fewer than '
    + 'eight people. On the two axes where most operators answered “None” (drones, and '
    + 'dispatch/command) the median is zero, so the “more experienced” half there just means '
    + '<i>any</i> experience at all.' }, cG);

  note(s, '<b>How much of this null is the operators, and how much is the measurement?</b> Three '
    + 'things argue for caution before reading it as “individual differences do not matter here”. '
    + `<b>Range.</b> AIAS-4 runs ${num(DP.batteries[0].lo, 1)}–${num(DP.batteries[0].hi, 1)} on a `
    + `10-point scale with a mean of ${num(DP.batteries[0].mean, 1)}: this sample contains almost `
    + 'no AI sceptics, and a predictor with no low end cannot show a gradient. '
    + '<b>Reliability.</b> The two scales that would have carried the more specific hypotheses are '
    + `the two with poor α (${num(DP.batteries[1].alpha, 2)} and ${num(DP.batteries[2].alpha, 2)}); `
    + 'their nulls are at least partly their own. <b>Power.</b> At n = '
    + `${DP.nDetect} nothing below ρ ≈ ${num(DP.detectable, 2)} was ever findable, and real `
    + 'dispositional effects on behaviour are rarely that large. What the section does establish is '
    + 'narrower and still useful: <b>in this task, measured this way, disposition is not where '
    + 'reliance comes from, and the structural account in the rest of the page does not need it.</b>');
  note(s, '<b>If this battery is run again</b> — the online arm in '
    + '<code>docs/ONLINE_DEPLOYMENT.md</code> is the obvious occasion — the two bespoke scales need '
    + 'piloting and probably rewriting before they are worth administering, the sample needs people '
    + 'who are not computing postgraduates, and a disposition hypothesis worth testing needs to be '
    + 'named in advance so it is not one of forty.');
}

/* — 2 · what drives reliance — */
reg('drivers', 'What actually drives reliance');
{
  const s = section('drivers', 'Finding', 'Mission composition drives reliance, not the scenario');
  para(s, 'The obvious result is that operators took the strategic card more often in the Tactical '
    + 'Heavy scenario than in the Strategic Heavy one. That is true, and it survives nothing.');
  const c = card(s, 'Model explorer: what predicts taking a strategy card');
  para(c, 'Every combination of the terms below has been fitted (' + gl('gee', 'binomial GEE, '
    + 'clustered on participant') + '). Hover any term for what it means. Tick the terms you want and the chart shows that model. The three presets are '
    + 'the models the argument uses: click them in order and watch the scenario effect shrink as '
    + 'mission composition is added.');
  const X = C.explorer;
  const COEF_G = { 'C(scenario)[T.tactical]': 'scenario', odd: 'odd', ncolours: 'ncolours',
                   ndrones: 'ndrones', criticality: 'category', 'C(run)[T.2]': 'run', idx: 'idx' };
  const presets = [
    ['1 · scenario', ['scenario', 'time']],
    ['2 · + illogical card', ['scenario', 'odd', 'time']],
    ['3 · + composition', ['scenario', 'odd', 'ncolours', 'ndrones', 'time']],
  ];
  const state = { sample: 'all', on: new Set(presets[0][1]) };
  const rowP = h('div', { class: 'picker' }, c);
  h('span', { class: 'lbl', text: 'Presets' }, rowP);
  const segP = h('div', { class: 'seg' }, rowP);
  const presetBtns = presets.map(([label, keys]) => {
    const btn = h('button', { text: 'Model ' + label }, segP);
    btn.onclick = () => { state.on = new Set(keys); render(); };
    return [btn, keys];
  });
  const rowT = h('div', { class: 'picker' }, c);
  h('span', { class: 'lbl', text: 'Terms' }, rowT);
  const TERM_SHORT = { scenario: 'Scenario', odd: 'Illogical card', ncolours: 'Colours needed',
                       ndrones: 'Drones needed', category: 'Category A–E', time: 'Run + time in session' };
  const boxes = X.terms.map(t => {
    const lab = h('label', {}, rowT);
    const box = h('input', { type: 'checkbox' }, lab);
    glNode(h('span', { text: TERM_SHORT[t.key] || t.label }, lab), t.key);
    box.onchange = () => { box.checked ? state.on.add(t.key) : state.on.delete(t.key); render(); };
    return [box, t.key];
  });
  const rowS = h('div', { class: 'picker' }, c);
  h('span', { class: 'lbl', text: 'Sample' }, rowS);
  const segS = h('div', { class: 'seg' }, rowS);
  const sampleBtns = X.samples.map(sm => {
    const btn = h('button', { text: sm.label }, segS);
    if (sm.key === 'genuine') glNode(btn, 'residual');
    btn.onclick = () => { state.sample = sm.key; render(); };
    return [btn, sm.key];
  });
  const info = h('div', {}, c);
  const fch = h('div', { class: 'chart' }, c);
  const tbl = h('div', { class: 'scroll' }, c);
  // One axis for every model, so clicking between them moves the dots instead of the scale.
  const allTerms = Object.values(X.models).flatMap(m => m.terms || []);
  const LIM = Math.min(3, Math.max(...allTerms.flatMap(t => [Math.abs(t.lo), Math.abs(t.hi)])) * 1.1);
  function render() {
    boxes.forEach(([box, k]) => { box.checked = state.on.has(k); });
    sampleBtns.forEach(([btn, k]) => btn.classList.toggle('on', k === state.sample));
    presetBtns.forEach(([btn, keys]) => btn.classList.toggle('on',
      keys.length === state.on.size && keys.every(k => state.on.has(k))));
    info.innerHTML = ''; fch.innerHTML = ''; tbl.innerHTML = '';
    const keys = X.terms.map(t => t.key).filter(k => state.on.has(k));
    if (!keys.length) { h('p', { class: 'warnline', text: 'Tick at least one term.' }, info); return; }
    const m = X.models[state.sample + '|' + keys.join('+')];
    if (!m || m.error) {
      h('p', { class: 'warnline', text: 'This model did not fit: ' + (m ? m.error : 'missing') }, info);
      return;
    }
    h('p', { class: 'formula', text: `${m.formula}  ·  n = ${m.n} decisions from ${m.nPid} participants` }, info);
    if (state.on.has('category') && state.sample === 'all')
      h('p', { class: 'warnline', html: '⚠ Category is in the model but residual missions are '
        + 'included. A residual keeps its parent’s category while holding only the leftover tasks, '
        + 'so switch the sample to <b>genuine missions only</b> before reading the category term.' }, info);
    forest(fch, m.terms.map(t => ({ label: t.label, b: t.b, lo: t.lo, hi: t.hi, p: t.p, g: COEF_G[t.coef] })),
      { lim: LIM, padL: 300 });
    const t = h('table', {}, tbl);
    const hr = h('tr', {}, h('thead', {}, t));
    ['Term', 'Odds ×', '95% interval', 'p', 'In plain words'].forEach((x, i) => {
      const th = h('th', { text: x, class: i && i < 4 ? 'num' : '' }, hr);
      if (i === 1) glNode(th, 'odds'); else if (i === 2) glNode(th, 'ci');
    });
    const tb = h('tbody', {}, t);
    m.terms.forEach(r => {
      const tr = h('tr', {}, tb);
      const or = Math.exp(r.b);
      glNode(h('td', { text: r.label }, tr), COEF_G[r.coef]);
      h('td', { text: '×' + or.toFixed(2), class: 'num' }, tr);
      h('td', { text: `×${Math.exp(r.lo).toFixed(2)} to ×${Math.exp(r.hi).toFixed(2)}`, class: 'num' }, tr);
      h('td', { text: pval(r.p).replace('p ', ''), class: 'num ' + pClass(r.p) }, tr);
      const words = r.p >= 0.05 ? 'no clear effect'
        : or > 1 ? `odds of taking a card ${or.toFixed(2)}× higher`
                 : `odds of taking a card ${(1 / or).toFixed(2)}× lower`;
      h('td', { text: words, style: 'text-align:left' }, tr);
    });
  }
  render();
  h('p', { class: 'cap', html: '<b>How to read it.</b> Each row is one term in the chosen model. The '
    + 'dot is that term’s effect on the ' + gl('odds', 'odds') + ' of taking a card, holding the '
    + 'other ticked terms fixed; the bar is its ' + gl('ci') + '. <b>×1.00 means no change.</b> A bar crossing the centre line '
    + 'cannot be told apart from no effect. Dark = significant at .05, pale = not. The axis is the '
    + 'same for every model, so clicking between them moves the dots, not the scale.' }, c);
  h('p', { class: 'cap', html: '<b>What the presets show.</b> In Model 1 the Tactical Heavy scenario '
    + 'clearly raises uptake. Adding whether the Conservative card was illogical (Model 2) halves it. '
    + 'Adding the mission’s own composition, meaning how many drone colours and drones it needs '
    + '(Model 3), makes both disappear. Only composition survives.' }, c);

  const L = C.load;
  const g2 = h('div', { class: 'grid2' }, s);
  const cA = card(g2, 'Card uptake by drone colours needed');
  barsH(h('div', { class: 'chart' }, cA), L.byColours.map(r => ({
    label: r.k + (r.k === 1 ? ' colour' : ' colours'), value: r.took, sub: 'n = ' + r.n + ' decisions'
  })), { max: 1, padL: 96 });
  h('p', { class: 'cap', html: 'Monotone. Each extra colour multiplies the odds of taking a card by '
    + '<b>×' + Math.exp(L.modelColours.b).toFixed(2) + '</b> (' + pval(L.modelColours.p) + ').' }, cA);
  const cB = card(g2, 'Card uptake by mission category (A→E)');
  barsH(h('div', { class: 'chart' }, cB), L.byCategory.map(r => ({
    label: r.k + ' · ' + num(r.tasks, 0) + ' tasks', value: r.took,
    sub: 'n = ' + r.n + ' decisions, ' + num(r.drones, 1) + ' drones needed'
  })), { max: 1, padL: 96 });
  h('p', { class: 'cap', html: 'Rises to D then <b>falls at E</b>. Per step, ×'
    + Math.exp(L.modelCategory.b).toFixed(2) + ' (' + pval(L.modelCategory.p) + ') — weaker than '
    + 'colours, because the relationship is not monotone.' }, cB);
  note(s, '<b>Two ways of measuring load, both shown throughout.</b> Category is the cleaner '
    + 'construct — excluding residual missions it <i>is</i> the task count (A = 2 tasks through '
    + 'E = 6) and it also sets the penalty rate, so it is the designed proxy for “lots of tasks '
    + 'and drones”. Colours-needed is the stronger statistical signal here, because uptake turns '
    + 'over at category E: on the very largest missions operators take the card <i>less</i> often. '
    + 'That reversal is worth a look in its own right — E is where the reserve is tightest and '
    + 'where a wrong commitment costs most.');
  note(s, '<b>Residual missions are excluded from every category view</b> (' + L.residualN + ' of '
    + (L.residualN + L.realN) + ' decisions). A mission abandoned in flight re-enters as '
    + '<code>-R</code> carrying its parent’s category while holding only the tasks that were '
    + 'left, so it reads as high-priority while being small. Category E residuals average '
    + num((L.residualShape.find(r => r.k === 'E') || {}).residTasks, 1) + ' tasks against '
    + num((L.residualShape.find(r => r.k === 'E') || {}).realTasks, 1) + ' for a genuine category E. '
    + 'Colour counts are unaffected, since they are read from the tasks actually present.');
  tableFor(s, ['Category', 'genuine mission tasks', 'residual tasks', 'residual decisions'],
    L.residualShape.map(r => [r.k, num(r.realTasks, 1),
      r.residTasks == null ? '—' : num(r.residTasks, 1), r.residN]),
    'Show the residual distortion');

  para(s, 'Both scenarios draw from the same fleet and the same task types; what differs is the mix '
    + 'of mission sizes. Strategic Heavy runs many small missions, and small missions are where '
    + 'people do it themselves. The scenario coefficient was a proxy for that all along.');
  quote(s, 'P11/scenario_comparison/1964');
  quote(s, 'P11/scenario_comparison/2003');
  note(s, 'P11 gives both halves within one debrief, and attributes the switch to the missions, not '
    + 'to any change in the assistant. That is the same contrast the model finds between scenarios — '
    + 'visible here as one person describing themselves doing it.');
}

/* — 3 · manual is four acts — */
reg('manual', '“Manual” is four different acts');
{
  const s = section('manual', 'Finding', '“Manual” is at least four different acts');
  para(s, 'Manual allocation is the study’s headline non-reliance signal. It conflates four '
    + 'behaviours that mean different things, and two of them are evidence of engagement <i>with</i> '
    + 'the assistant rather than rejection of it.');

  h('h3', { text: 'Act one · pre-empting the recommendation' }, s);
  para(s, 'The strategic cards are deliberately unreadable for the first 4–5 seconds, simulating an '
    + '“Analysing…” pause; manual entry is available immediately. The logs record which came first.');
  const gp = h('div', { class: 'grid2' }, s);
  const c1 = card(gp, 'Pre-empted, by drone colours needed');
  barsH(h('div', { class: 'chart' }, c1), C.preemption.byColours.map(r => ({
    label: r.colours + (r.colours === 1 ? ' colour' : ' colours'), value: r.share,
    sub: 'n = ' + r.n + ' manual choices'
  })), { max: 1, padL: 96 });
  const c1b = card(gp, 'Pre-empted, by mission category');
  barsH(h('div', { class: 'chart' }, c1b),
    C.load.byCategory.filter(r => r.preempt != null).map(r => ({
      label: r.k + ' \u00b7 ' + num(r.tasks, 0) + ' tasks', value: r.preempt,
      sub: 'manual choices in category ' + r.k
    })), { max: 1, padL: 96 });
  h('p', { class: 'cap', html: 'Overall <b>' + pct(C.preemption.overall) + '</b> of manual choices '
    + 'pre-empted the advice. Both views agree: the simpler the mission, the more often the operator '
    + 'had already decided before the recommendation existed. These are not rejections of a '
    + 'recommendation \u2014 there was none yet. (Category view excludes residual missions.)' }, s);
  quote(s, 'P29/manual_override/1469');

  h('h3', { text: 'Act two · interpolating between the only two options' }, s);
  para(s, 'Three participants describe reaching for a setting the interface does not offer. Comparing '
    + 'each manual allocation against the two cards it declined, for the same mission, shows it.');
  const c2 = card(s, 'Where the manual allocation sits, against the two cards');
  const keys = [
    { key: 'below both', label: 'Below both cards', color: css('--r-cons') },
    { key: 'between', label: 'Between the cards', color: css('--r-aggr') },
    { key: 'above both', label: 'Above both cards', color: css('--r-man') },
  ];
  legend(c2, keys.map(k => ({ label: k.label, color: k.color })));
  const ch2 = h('div', { class: 'chart' }, c2);
  barsStacked(ch2, C.position.byBand.map(b => ({
    label: b.band + ' missions', values: b, sub: `n = ${b.n}`
  })), keys);
  h('p', { class: 'cap', text: 'Mission size bands are tertiles of drones required. On large missions '
    + 'manual interpolates between the cards; on small ones it undercuts both.' }, c2);
  tableFor(c2, ['Mission size', 'below both', 'between', 'above both', 'n'],
    C.position.byBand.map(b => [b.band, pct(b['below both']), pct(b.between), pct(b['above both']), b.n]));
  quote(s, 'P17/manual_override/1418');
  quote(s, 'P22/manual_override/1708');

  h('h3', { text: 'Act three · benchmarking the assistant' }, s);
  quote(s, 'P29/verification/1559');
  note(s, 'Early-session manual allocation as a deliberate comparison. This is active evaluation of '
    + 'the assistant, and a reliance measure scores it as the opposite.');

  h('h3', { text: 'Act four · editing the card as a first draft' }, s);
  quote(s, 'P19/agent_comparison/2026');
  note(s, 'P04, P30 and P31 describe the same use. A manual choice that began as an edited card is '
    + 'logged identically to one built from scratch, and they are not the same act. The study’s own '
    + 'reliance ladder does separate an explicit <i>edit</i> — it accounts for '
    + (S.ladders ? pct((S.ladders['strategic|strategic|1'] || {}).shares ? (S.ladders['strategic|strategic|1'].shares.edit || 0) : 0, 0) : '—')
    + ' of strategic decisions in one cell — but only where the operator visibly started from the card.');
}

/* — 4 · manual is slower — */
reg('slower', 'Manual is slower, and buys something else');
{
  const s = section('slower', 'Finding', 'Manual is slower — and what it actually buys changes with mission size');
  para(s, 'If manual choices pre-empt a 4–5 second wait, the natural reading is that people were '
    + 'saving time. They were not.');
  const c = card(s, 'Time from the strategic panel opening to the choice being made');
  const cats = [...new Set(C.timing.rows.map(r => r.colours))].sort().map(String);
  const series = ['manual', 'conservative', 'aggressive'].map((route, i) => ({
    label: route[0].toUpperCase() + route.slice(1),
    color: [css('--r-man'), css('--r-cons'), css('--r-aggr')][i],
    values: cats.map(cc => {
      const row = C.timing.rows.find(r => String(r.colours) === cc && r.route === route);
      return row ? row.median : null;
    }),
    subs: cats.map(cc => {
      const row = C.timing.rows.find(r => String(r.colours) === cc && r.route === route);
      return row ? `n = ${row.n}` : '';
    }),
  }));
  legend(c, series.map(x => ({ label: x.label, color: x.color })));
  const ch = h('div', { class: 'chart' }, c);
  barsGrouped(ch, cats.map(cc => cc + (cc === '1' ? ' colour' : ' colours')), series,
    { fmt: v => num(v, 0) + 's', height: 260 });
  h('p', { class: 'cap', html: `Median seconds. Adjusted for mission composition, manual takes `
    + `<b>${sgn(C.timing.model.b, 1)} s longer</b> (${pval(C.timing.model.p)}). It is never the faster route.` }, c);
  para(s, 'So the pre-emption is about when the <i>decision</i> was made, not how long the allocation '
    + 'took. P29 is describing the moment he committed. The delay itself, which is drawn at random '
    + 'per mission and so acts as a natural experiment, shows no detectable effect on how often people '
    + `go manual (${pct(C.revealExperiment.shortShare)} on shorter draws vs `
    + `${pct(C.revealExperiment.longShare)} on longer, z = ${num(C.revealExperiment.z, 2)}) — though `
    + 'with only a one-second spread that test is underpowered, and fails to confirm rather than rules out.');

  h('h3', { text: 'What it buys reverses with mission size' }, s);
  const gd = h('div', { class: 'grid2' }, s);
  const c2 = card(gd, 'By mission size (drones needed, tertiles)');
  barsDiverging(h('div', { class: 'chart' }, c2), C.delta.byBand.map(b => ({
    label: b.band, value: b.mean, sub: 'n = ' + b.n + ', mean need ' + num(b.need, 1) + ' drones'
  })), { zeroLabel: 'same as the card' });
  const c2b = card(gd, 'By mission category (A\u2192E)');
  barsDiverging(h('div', { class: 'chart' }, c2b), C.load.deltaByCategory.map(b => ({
    label: b.k, value: b.mean, sub: 'n = ' + b.n + ' manual decisions'
  })), { zeroLabel: 'same as the card' });
  const c2c = card(s, 'Drones committed by hand, against what the Conservative card would have committed');
  h('p', { class: 'cap', html: 'Matched on mission by construction — each decision compared against '
    + 'that mission’s own card. Mission size drives the reversal '
    + `(b = ${sgn(C.delta.model.size.b, 3)}, ${pval(C.delta.model.size.p)}); criticality has no `
    + `independent effect once size is in the model (${pval(C.delta.model.criticality.p)}). Both `
    + 'views show the same reversal, and category makes it starker \u2014 the swing runs from '
    + 'trimming on the smallest missions to adding on the largest.' }, c2c);
  tableFor(c2c, ['Mission size', 'drones vs Conservative', 'n', 'mean need'],
    C.delta.byBand.map(b => [b.band, sgn(b.mean), b.n, num(b.need, 1)]));
  tableFor(c2c, ['Category', 'drones vs Conservative', 'n'],
    C.load.deltaByCategory.map(b => [b.k, sgn(b.mean), b.n]), 'Show the same by category');
  note(s, '<b>A correction worth recording.</b> The first reading of this was “manual preserves '
    + 'reserve”, matching what four participants say they were doing. The average is right and the '
    + 'interpretation was too simple: manual is used far more on small missions, so an average over '
    + 'manual decisions is an average over a skewed slice. Broken out, operators <i>trim</i> on small '
    + 'missions and <i>add</i> on large ones.');
  quote(s, 'P22/manual_override/1737');
}

/* — 5 · the artefact — */
reg('artefact', 'When simple rules look wrong');
{
  const s = section('artefact', 'Finding', 'The simple rules produce visibly odd cards — and it stays local');
  para(s, 'Both assistants are deliberately simple, myopic heuristics. One consequence is visible to '
    + 'operators: the Conservative card applies a 15% top-up to <i>every</i> drone colour, including '
    + 'colours the mission has no use for, so an all-Blue mission can be sent a lone Red and Green.');
  const c = card(s, 'How often the Conservative recommendation was illogical');
  const ch = h('div', { class: 'chart' }, c);
  barsH(ch, C.artefact.byScenario.map(r => ({
    label: r.scenario === 'strategic' ? 'Strategic Heavy' : 'Tactical Heavy',
    value: r.share, sub: `n = ${r.n} decisions`,
    color: r.scenario === 'strategic' ? css('--s-strat') : css('--s-tac')
  })), { max: 0.45 });
  h('p', { class: 'cap', html: 'Concentrated in one arm of the manipulation, and structurally so: '
    + 'a top-up can only pad a colour the mission leaves unused, and Strategic Heavy runs the small, '
    + 'few-colour missions.' }, c);

  para(s, 'Five participants raised it unprompted and in specific terms.');
  quote(s, 'P13/agent_comparison/1795');
  quote(s, 'P17/agent_comparison/1393');
  note(s, 'P17 also gets the <i>direction</i> right, unprompted — which is correct: an ungated '
    + 'top-up can only ever add. No injected failures were ever enabled; both epsilons were zero '
    + 'for every session in the dataset.');

  h('h3', { text: 'It changes that decision, and only that decision' }, s);
  const c2 = card(s, 'What operators chose, by whether the Conservative recommendation was logical');
  const rk = [
    { key: 'conservative', label: 'Conservative', color: css('--r-cons') },
    { key: 'aggressive', label: 'Aggressive', color: css('--r-aggr') },
    { key: 'manual', label: 'Manual', color: css('--r-man') },
  ];
  legend(c2, rk.map(k => ({ label: k.label, color: k.color })));
  const ch2 = h('div', { class: 'chart' }, c2);
  barsStacked(ch2, [
    { label: 'Logical recommendation', values: C.artefact.choiceShare['0'] },
    { label: 'Illogical recommendation', values: C.artefact.choiceShare['1'] },
  ], rk, { padL: 190 });
  h('p', { class: 'cap', text: 'Both cards lose roughly equally — an odd Conservative card does not '
    + 'push operators across to Aggressive, it pushes them out of the card system altogether.' }, c2);

  const c3 = card(s, 'Three tests for whether it costs trust afterwards');
  const rowsC = [
    ['Seen an illogical card earlier this session → uptake later', sgn(C.carryover.prior.b, 3), pval(C.carryover.prior.p)],
    ['Uptake on the very next decision', sgn(C.carryover.nextModel.b, 3), pval(C.carryover.nextModel.p)],
    ['Post-session trust in the strategic assistant', 'ρ = ' + num(C.carryover.trustRho, 3), pval(C.carryover.trustP)],
  ];
  const t = h('table', {}, c3);
  const th = h('tr', {}, h('thead', {}, t));
  ['Test', 'Estimate', 'Result'].forEach((x, i) => h('th', { text: x, class: i ? 'num' : '' }, th));
  const tb = h('tbody', {}, t);
  rowsC.forEach(r => {
    const tr = h('tr', {}, tb);
    h('td', { text: r[0] }, tr);
    h('td', { text: r[1], class: 'num' }, tr);
    h('td', { text: r[2], class: 'num ns' }, tr);
  });
  h('p', { class: 'cap', html: `All three null. Next-decision uptake is `
    + `${pct(C.carryover.nextAfterClean)} after a clean card and ${pct(C.carryover.nextAfterOdd)} `
    + `after an illogical one (n = ${C.carryover.nNextClean} and ${C.carryover.nNextOdd}); the trust `
    + `correlation is over ${C.carryover.trustN} sessions.` }, c3);

  h('h3', { text: 'And it is not what drives the behaviour either' }, s);
  para(s, 'An odd card is structurally impossible on a three-colour mission — there is no unused '
    + 'colour to pad. So “odd” is nested inside “simple”, and the tempting odd-versus-clean contrast '
    + 'is a simple-versus-complex contrast in disguise.');
  const nest = C.artefact.nesting;
  tableFor(s, ['Colours the mission needs', 'logical', 'illogical'],
    nest.map(r => [r.colours, r.clean, r.odd]), 'Show the nesting');
  para(s, 'Within the only stratum where the comparison is identified — few-colour missions — uptake '
    + `is ${pct(C.artefact.within.clean)} against ${pct(C.artefact.within.odd)}, and adjusted for `
    + `scenario, run and position the effect is b = ${sgn(C.artefact.within.model.b, 2)}, `
    + `${pval(C.artefact.within.model.p)}. Real and visible; not what moves the numbers.`);
}

/* — 6 · the dominated card — */
reg('dominated', 'The cautious card is often the expensive one');
{
  const s = section('dominated', 'Finding', 'On small missions the “Conservative” card is often dominated');
  para(s, 'The same ungated top-up has a sharper consequence than an odd colour. On a small mission '
    + 'it can push the Conservative card past the Aggressive one — and Conservative is the slower '
    + 'card by design. Where both hold, it is dominated on every axis the operator can see.');
  const c = card(s, 'Mean drones committed by each card, by mission size');
  const bands = C.artefact.consBiggerByBand.map(b => b.band);
  const ser = [
    { label: 'Conservative', color: css('--r-cons'),
      values: C.artefact.consBiggerByBand.map(b => b.conservative),
      subs: C.artefact.consBiggerByBand.map(b => `n = ${b.n}`) },
    { label: 'Aggressive', color: css('--r-aggr'),
      values: C.artefact.consBiggerByBand.map(b => b.aggressive),
      subs: C.artefact.consBiggerByBand.map(b => `n = ${b.n}`) },
  ];
  legend(c, ser.map(x => ({ label: x.label, color: x.color })));
  const ch = h('div', { class: 'chart' }, c);
  barsGrouped(ch, bands.map(b => b + ' missions'), ser, { fmt: v => num(v, 1), height: 240 });
  h('p', { class: 'cap', html: 'On small missions the cautious option commits <i>more</i> drones than '
    + 'the aggressive one.' }, c);
  const c2 = card(s, 'How often Conservative exceeds Aggressive');
  const ch3 = h('div', { class: 'chart' }, c2);
  barsH(ch3, C.artefact.consBiggerByBand.map(b => ({
    label: b.band + ' missions', value: b.share, sub: `n = ${b.n}`
  })), { max: 0.5 });
  h('p', { class: 'cap', html: `Across all card pairs it is `
    + `${pct(C.artefact.consBiggerByBand.reduce((a, b) => a + b.share * b.n, 0) / C.artefact.consBiggerByBand.reduce((a, b) => a + b.n, 0))}; `
    + `counting slower-and-no-smaller as dominated, ${pct(C.artefact.dominatedShare)} of all decisions `
    + 'presented a dominated Conservative card.' }, c2);
  para(s, 'Operators largely do not take it when that happens — Conservative uptake falls from '
    + pct(C.artefact.dominatedChoiceShare['0'].conservative) + ' to '
    + pct(C.artefact.dominatedChoiceShare['1'].conservative) + ' and manual rises from '
    + pct(C.artefact.dominatedChoiceShare['0'].manual) + ' to '
    + pct(C.artefact.dominatedChoiceShare['1'].manual) + '. But like the odd-colour flag, it adds '
    + 'nothing once mission composition is in the model. Two independent ways of asking “did the '
    + 'simple rules produce a visibly bad card?”, the same answer both times.');
  quote(s, 'P36/agent_comparison/1892');
}

/* — 8b · does it last? the event study — */
{
  reg('overtime', 'Does an illogical card change anything after it?');
  const s = section('overtime', 'Finding', 'Does an illogical recommendation change anything afterwards?');
  const E = C.eventStudy;
  para(s, 'The carry-over tests in Finding 4 are three nulls, which is a thin thing to rest a claim '
    + 'on. This is the same question asked directly: line every session up on the first illogical '
    + 'card that operator saw, and watch what card uptake does either side of it.');
  const c = card(s, 'Card uptake either side of the first illogical recommendation');
  const ser = [
    { label: 'all missions', color: css('--mark-soft'), faint: true,
      points: E.points.map(pt => ({ x: pt.rel, y: pt.took, n: pt.n })) },
    { label: 'three-colour only', color: css('--s-strat'),
      points: E.matchedPoints.map(pt => ({ x: pt.rel, y: pt.took, n: pt.n })) },
  ];
  legend(c, [{ label: 'all missions (unmatched)', color: css('--mark-soft') },
             { label: 'three-colour missions only (composition held fixed)', color: css('--s-strat') }]);
  linesAt(h('div', { class: 'chart' }, c), ser, { height: 290 });
  h('p', { class: 'cap', html: 'Aggregated over ' + E.sessions + ' sessions that contained at least '
    + 'one illogical card. Position 0 is that card itself, where uptake genuinely dips — that is '
    + 'the local effect from Finding 4.' }, c);

  note(s, '<b>The grey line is a trap, and it is worth spelling out.</b> Taken at face value it '
    + 'shows uptake falling from ' + pct(E.beforeAfter.before) + ' before to '
    + pct(E.beforeAfter.after) + ' after, which looks exactly like trust being spent. It is an '
    + 'artefact of how the event is defined. An illogical card requires the mission to leave a drone '
    + 'colour unused, so it <b>cannot occur on a three-colour mission</b> — which means every '
    + 'decision before the first one is necessarily a three-colour mission, and those are precisely '
    + 'the missions with the highest uptake anyway. The pre-period is not a baseline; it is a '
    + 'filtered sample of the hardest missions.');
  tableFor(s, ['Window', 'mean colours needed', 'mean drones needed', 'mean position in session', 'uptake', 'n'],
    E.composition.map(r => [r.window, num(r.colours, 2), num(r.drones, 1), num(r.position, 1),
                            pct(r.took), r.n]), 'Show what each window is made of');
  para(s, '<b>The blue line holds composition fixed</b> — three-colour missions on both sides, so '
    + 'like against like. It does not step down. It drifts slightly <i>up</i>: '
    + pct(E.beforeAfter.matchedBefore) + ' before (n = ' + E.beforeAfter.nMatchedBefore + ') against '
    + pct(E.beforeAfter.matchedAfter) + ' after (n = ' + E.beforeAfter.nMatchedAfter + '), and '
    + 'adjusted for position and scenario the difference is b = ' + sgn(E.matchedModel.b, 3) + ', '
    + pval(E.matchedModel.p) + '. Adjusting the full sample for mission composition rather than '
    + 'restricting it gives the same answer: b = ' + sgn(E.adjusted.b, 3) + ', ' + pval(E.adjusted.p) + '.');
  note(s, 'So the honest statement is not “we found no effect” but something stronger: the '
    + 'only apparent effect is fully explained by which missions can produce the event in the first '
    + 'place. Four independent tests now agree — the three in Finding 4, and this one.');

  if (E.examples && E.examples.length) {
    const c2 = card(s, 'Individual sessions, so the aggregate is not the only thing on offer');
    para(c2, 'Each row is one session. A filled square is a decision where the operator took a card, '
      + 'an empty one where they went manual. The red line is the first illogical card.');
    const W = 700, rowH = 26, padL = 76;
    const svg2 = svgRoot(h('div', { class: 'chart' }, c2), W, E.examples.length * rowH + 26);
    const allRel = E.examples.flatMap(ex => ex.series.map(p2 => p2.rel));
    const lo = Math.min(...allRel), hi = Math.max(...allRel);
    const xx = v => padL + (W - padL - 20) * ((v - lo) / Math.max(1, hi - lo));
    el('line', { x1: xx(0), x2: xx(0), y1: 4, y2: E.examples.length * rowH + 2,
                 stroke: css('--bad'), 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, svg2);
    E.examples.forEach((ex, i) => {
      const y0 = 10 + i * rowH;
      el('text', { x: padL - 10, y: y0 + 11, 'text-anchor': 'end', fill: css('--ink-2'),
                   'font-size': 11.5, 'font-family': css('--mono') }, svg2)
        .textContent = ex.pid + ' r' + ex.run;
      ex.series.forEach(pt => {
        const r = el('rect', { x: xx(pt.rel) - 5, y: y0 + 1, width: 10, height: 10, rx: 2,
                               fill: pt.took ? css('--s-strat') : 'none',
                               stroke: css('--s-strat'), 'stroke-width': 1.4 }, svg2);
        hoverable(r, '<b>' + ex.pid + ' run ' + ex.run + '</b><br>'
          + (pt.rel > 0 ? '+' : '') + pt.rel + ': ' + (pt.took ? 'took a card' : 'built it by hand'));
      });
    });
    h('p', { class: 'cap', text: 'No session shows a step change at the marker.' }, c2);
  }
  quote(s, 'P20/trust_trajectory/1551');
  note(s, 'P20 is right that it happened and right about which tier. The behavioural record simply '
    + 'does not carry the consequence he reports — see Finding 9.');
}

/* — 7 · verification cost — */
reg('verification', 'Verification is priced, not principled');
{
  const s = section('verification', 'Finding', 'Verification is priced, not principled');
  para(s, 'Almost nobody in the corpus describes checking as a matter of policy. They describe it as '
    + 'a purchase — worth making when it is cheap, skipped when it is not — and the two tiers do not '
    + 'cost the same to check.');
  quote(s, 'P14/verification/1575');
  para(s, 'P22 reaches the identical mechanism and draws the opposite behavioural conclusion.');
  quote(s, 'P22/verification/1834');
  note(s, '<b>Two participants converging on the mechanism while diverging on the response is '
    + 'stronger evidence for it than either alone.</b> The strategic card is pre-summarised into '
    + 'three comparable numbers, so checking costs a glance; the tactical plan has no summary and '
    + 'must be inspected drone by drone. P14 pays that cost and checks harder; P22 refuses it and '
    + 'defers. Any tier asymmetry in the reliance data has to be defended against this before it can '
    + 'be read as a difference in trust — and it is testable, against card-preview dwell times '
    + 'versus tactical confirm latencies.');
  h('h3', { text: 'Under load, reliance detaches from belief entirely' }, s);
  quote(s, 'P35/verification/1729');
  quote(s, 'P24/verification/1660');
  quote(s, 'P28/verification/1833');
  note(s, 'P11 puts the same trade as arithmetic, and is explicit that the assistant does not need '
    + 'to be right — only cheap enough that being wrong costs less than checking.');
  quote(s, 'P11/verification/1811');
  h('h3', { text: 'A third structural explanation: the decisions are not the same kind' }, s);
  quote(s, 'P30/agent_comparison/1349');
  note(s, 'The strategic decision is made under uncertainty about what arrives next and needs '
    + 'anticipation; the tactical decision is a closed optimisation over resources already committed. '
    + 'That is a property of the decisions, not of the assistants, and it predicts the tier asymmetry '
    + 'with no reference to trust at all.');
}

/* — 8 · where the streams disagree — */
reg('disagree', 'Where the two streams disagree');
{
  const s = section('disagree', 'Finding', 'Where the two streams disagree');
  para(s, 'Two participants give a clear account of their own behaviour that their own logs '
    + 'contradict. Both are worth more than a confirmation would be.');
  h('h3', { text: 'A trust drop that left no trace' }, s);
  quote(s, 'P20/trust_trajectory/1551');
  para(s, 'P20 names the tier, the trigger and the asymmetry — and he is right about the trigger, '
    + 'which is the artefact above. But the behaviour does not follow: not on the next decision, not '
    + 'later in the session, and not on the trust scale he completed minutes afterwards. Self-reported '
    + 'trust damage with no behavioural signature is exactly what a study with both streams is for.');
  h('h3', { text: 'A speed saving that was not one' }, s);
  quote(s, 'P29/manual_override/1469');
  para(s, 'Manual is never faster. What he is describing — committing before the cards resolved — is '
    + 'real and measurable, and he has attributed it to a benefit it does not produce.');
  note(s, '<b>The methodological reading.</b> Neither participant is unreliable. Both correctly '
    + 'identify something that happened and then supply a plausible reason that the logs do not '
    + 'support. Stated reasons are good evidence about what was salient and poor evidence about what '
    + 'was effective — which is an argument for collecting both streams, not for trusting one.');
  h('h3', { text: 'And one place they agree' }, s);
  para(s, 'Five participants say they override the strategic card to hold drones back for missions '
    + 'that have not arrived yet — the one consideration a per-mission myopic agent cannot weigh. On '
    + 'small missions the logs show exactly that, about one drone per decision.');
  quote(s, 'P24/manual_override/1548');
}

/* — 9 · recovery — */
reg('recovery', 'Failure recovery: the one place reliance clearly pays');
{
  const s = section('recovery', 'Finding', 'Failure recovery is where consulting the assistant clearly pays');
  if (S.patterns) {
    para(s, 'Every drone failure opens a recovery the operator must resolve. Classifying all of them '
      + 'gives the cleanest reliance-to-outcome link in the study.');
    const ss = S.suggestSplit;
    tiles(s, [
      { v: pct(ss.withSuggest.abandoned / ss.withSuggest.n, 0), k: 'abandoned after consulting Suggest', s: `${ss.withSuggest.abandoned} of ${ss.withSuggest.n} episodes` },
      { v: pct(ss.withoutSuggest.abandoned / ss.withoutSuggest.n, 0), k: 'abandoned without consulting it', s: `${ss.withoutSuggest.abandoned} of ${ss.withoutSuggest.n} episodes` },
    ]);
    const c = card(s, 'What happened after each drone failure');
    const pats = Object.entries(S.patterns).sort((a, b) => b[1] - a[1]);
    const tot = pats.reduce((a, b) => a + b[1], 0);
    const ch = h('div', { class: 'chart' }, c);
    const SHORT = {
      'recovered-agent': 'Recovered with Suggest', 'recovered-manual': 'Recovered by hand',
      'abandon-infeasible': 'Abandoned: unfixable', 'abandon-busy': 'Abandoned: needed a busy drone',
      'tried-then-abandon': 'Abandoned after edits', 'suggest-then-abandon': 'Abandoned after Suggest',
      'abandon-untried': 'Abandoned without trying', 'unresolved': 'Left open at session end' };
    barsH(ch, pats.map(([k, v]) => ({
      label: SHORT[k] || k, value: v,
      sub: pct(v / tot, 0) + ' of episodes<br><i>' + ((S.patternLabels && S.patternLabels[k]) || k) + '</i>'
    })), { fmt: v => String(v), padL: 230 });
    h('p', { class: 'cap', html: 'Episode counts, ' + S.cohort + ' cohort. Note the third-largest '
      + 'category: missions abandoned <i>without any recovery attempt</i> that the logs show were '
      + 'fixable with the drones already on the mission.' }, c);
    note(s, '<b>Read the direction with care.</b> This is observational: operators chose whether to '
      + 'consult Suggest, and the episodes they chose it for may have been more tractable. It is a '
      + 'strong association and not an estimate of the assistant’s causal effect.');
  }
}

/* — 10 · performance — */
reg('performance', 'Performance, and what it cost');
{
  const s = section('performance', 'Context', 'Performance across the two scenarios');
  if (S.metrics && S.metrics.length) {
    para(s, 'From the crossover analysis, unchanged — this page reads those numbers rather than '
      + 'recomputing them. Every participant played both scenarios in counterbalanced order.');
    const c = card(s, `Scenario means and within-person differences (${S.cohort}, n = ${S.n})`);
    const t = h('table', {}, c);
    const thr = h('tr', {}, h('thead', {}, t));
    ['Measure', 'Strategic Heavy', 'Tactical Heavy', 'Difference', 'p'].forEach((x, i) =>
      h('th', { text: x, class: i ? 'num' : '' }, thr));
    const tb = h('tbody', {}, t);
    S.metrics.forEach(m => {
      const tr = h('tr', {}, tb);
      h('td', { text: m.label }, tr);
      const f = v => Math.abs(v) < 1.5 ? num(v, 3) : num(v, 0);
      h('td', { text: f(m.strategic), class: 'num' }, tr);
      h('td', { text: f(m.tactical), class: 'num' }, tr);
      h('td', { text: sgn(m.scenarioDiff, Math.abs(m.scenarioDiff) < 1.5 ? 3 : 0), class: 'num' }, tr);
      h('td', { text: pval(m.scenarioP).replace('p ', ''), class: 'num ' + pClass(m.scenarioP) }, tr);
    });
    h('p', { class: 'cap', html: 'Positive difference = higher in Tactical Heavy. Scores are not '
      + 'comparable across scenarios in raw form — the two offer different points, which is why '
      + '“score / points available” is the primary outcome.' }, c);
    note(s, 'The reliance rows in this table are the same phenomenon as Finding 1, measured at '
      + 'session level rather than per decision: card uptake is higher in Tactical Heavy, and '
      + 'pre-emptive manual entry is higher in Strategic Heavy, which is where the small missions are.');
  }
}

/* — 8c · learning — */
reg('learning', 'Learning, within a session and between the two');
{
  const s = section('learning', 'Finding', 'Learning: within a session, and between the two');
  const LN = C.learning;
  para(s, 'Every participant played both scenarios, so being on the second run is confounded with '
    + 'which scenario it was and which of the four games it was. These are the descriptive '
    + 'trajectories; the crossover analysis separates the terms properly.');
  const c = card(s, 'Card uptake across the thirds of a session');
  const runSer = [1, 2].map((r, i) => ({
    label: 'run ' + r, color: [css('--s-strat'), css('--s-tac')][i],
    points: ['early', 'mid', 'late'].map((th, j) => {
      const row = LN.withinByRun.find(x => x.run === r && x.third === th);
      return row ? { x: j, y: row.took, n: row.n } : null;
    }).filter(Boolean),
  }));
  legend(c, runSer.map(x => ({ label: x.label, color: x.color })));
  linesAt(h('div', { class: 'chart' }, c), runSer,
    { markZero: false, xLabel: 'early → mid → late third of the session', height: 250 });
  h('p', { class: 'cap', html: 'Run 1 is flat across the session. Run 2 <b>starts lower and climbs</b> '
    + '— people arrive at their second session doing more by hand, then hand back over.' }, c);

  const c2 = card(s, 'Each participant’s card uptake, run 1 to run 2');
  slopes(h('div', { class: 'chart' }, c2),
    LN.perPerson.filter(x => x.r1 != null && x.r2 != null)
      .map(x => ({ label: x.pid, a: x.r1, b: x.r2 })),
    { aLabel: 'run 1', bLabel: 'run 2' });
  h('p', { class: 'cap', html: 'One line per participant (n = '
    + LN.perPerson.filter(x => x.r1 != null && x.r2 != null).length + '), heavy line is the mean. '
    + 'Adjusted for scenario and mission composition, being on run 2 changes the odds of taking a '
    + 'card by ×' + Math.exp(LN.runModel.b).toFixed(2) + ' (' + pval(LN.runModel.p) + ') — a '
    + 'drift downward that is not distinguishable from noise at this n.' }, c2);
  const rm = {}; LN.runMeans.forEach(r => { rm[r.run] = r; });
  if (rm[1] && rm[2]) {
    tiles(s, [
      { v: pct(rm[1].took, 0) + ' → ' + pct(rm[2].took, 0), k: 'card uptake, run 1 → run 2' },
      { v: pct(rm[1].preempt, 0) + ' → ' + pct(rm[2].preempt, 0), k: 'manual choices that pre-empted the cards' },
      { v: num(rm[1].secs, 1) + 's → ' + num(rm[2].secs, 1) + 's', k: 'median time to decide' },
    ]);
    note(s, 'The direction is consistent across all three: on their second run people decide faster, '
      + 'commit before the recommendation more often, and take the card slightly less. That is what '
      + 'growing competence looks like, and it is the same pattern as the detection story in '
      + 'Finding 4 — people get better at doing it themselves, not more suspicious.');
  }
}

/* — 10b · benchmark — */
reg('benchmark', 'Against a near-perfect operator');
{
  const s = section('benchmark', 'Context', 'Performance against a near-perfect automated operator');
  const B = DATA.benchmark;
  if (B && B.byScenario) {
    para(s, 'Raw score is not comparable across the two scenarios — they put different numbers of '
      + 'points on the table — and “score over points available” divides by a moving '
      + 'denominator. This is a fixed one. The study’s own simulator was run with a competent '
      + 'automated operator over the <i>same four fixed games</i> the participants played, and each '
      + 'session is expressed as a share of what that operator scored on that game. Because score is '
      + 'already net of penalties, this folds penalties in.');
    tiles(s, [
      { v: pct(B.overall, 0), k: 'of the reference operator’s score, overall' },
      ...B.byScenario.map(r => ({
        v: pct(r.share, 0),
        k: (r.scenario === 'strategic' ? 'Strategic Heavy' : 'Tactical Heavy') + ' sessions',
        s: 'n = ' + r.n })),
    ]);
    const c = card(s, 'Share of the reference operator’s score, by game');
    barsH(h('div', { class: 'chart' }, c), B.byGame.map(r => ({
      label: (r.scenario === 'strategic' ? 'Strategic' : 'Tactical') + ' · game ' + r.planIndex,
      value: r.share, sub: 'n = ' + r.n + ' sessions',
      color: r.scenario === 'strategic' ? css('--s-strat') : css('--s-tac'),
    })), { max: 1, padL: 150 });
    h('p', { class: 'cap', html: 'Four fixed games: two scenarios × two mission streams. Everyone '
      + 'played seed 42, so these are the same four games throughout the study.' }, c);
    tableFor(c, ['Game', 'reference score', 'reference penalty', 'tasks', 'reference task completion', 'participant sessions'],
      B.games.map(g => [(g.scenario === 'strategic' ? 'Strategic' : 'Tactical') + ' · game ' + g.planIndex,
        num(g.score, 0), num(g.penalty, 0), num(g.tasks, 0), pct(g.taskCompletion, 0), g.n]),
      'Show the reference operator’s own numbers');
    const c2 = card(s, 'Share of the reference score, run 1 vs run 2');
    barsH(h('div', { class: 'chart' }, c2), B.byRun.map(r => ({
      label: 'run ' + r.run, value: r.share, sub: 'n = ' + r.n + ' sessions',
    })), { max: 1, padL: 96 });
    h('p', { class: 'cap', html: '<b>This is where the learning effect shows up.</b> Normalising by '
      + 'game difficulty separates improvement from which game happened to be second — something '
      + 'raw score cannot do, because the four games differ by up to ~1.9× in workload.' }, c2);
    note(s, '<b>What the reference is, and is not.</b> It is the SMART policy from '
      + '<code>sim/engine.mts</code> driving the real game reducer: it allocates immediately, '
      + 'over-allocates for redundancy, and recovers from drone failures perfectly. It is a strong '
      + 'reference line, not a true optimum — and only the mission stream is matched, not the '
      + 'drone-failure draws, so it is averaged over repeated runs. Shares above 100% would mean a '
      + 'participant beat it on that game. Regenerate with '
      + '<code>npx tsx sim/engine.mts --games --reps=5</code>.');
  }
}

/* — 11 · what operators asked for — */
reg('asks', 'What operators asked for');
{
  const s = section('asks', 'Design', 'What operators asked for — and did not');
  para(s, 'Across 26 debriefs, almost nobody asked why a recommendation was made. What they asked '
    + 'for was calibration data and a third option.');
  h('h3', { text: 'Failure base rates, not explanations' }, s);
  quote(s, 'P36/design_suggestions/1917');
  quote(s, 'P13/design_suggestions/1469');
  note(s, 'P10 and P32 make the same request independently — four participants asking for the '
    + 'empirical failure rate behind a recommendation, against one (P25) asking for an explanation '
    + 'of how a plan was produced.');
  h('h3', { text: 'A third card, or an adjustable one' }, s);
  para(s, 'P17, P22 and P28 each ask for a setting between Aggressive and Conservative — and the '
