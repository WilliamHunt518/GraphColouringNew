<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Findings brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Generated by scripts/build_findings_synthesis.py from scripts/findings_brief_template.html.
   Edit the TEMPLATE, never the generated page. The full evidence for every claim here is in
   findings_synthesis.html, built from the same payload in the same run. */
/*__COMMON_CSS__*/
main { max-width: 900px; }
h2 { font-size: 22px; }
section { margin-top: 38px; }
.strength { display: inline-block; font: 500 10.5px var(--mono); letter-spacing: .07em; text-transform: uppercase;
  border-radius: 4px; padding: 2px 7px; margin-left: 8px; vertical-align: 3px; color: #fff; }
.strength.strong { background: var(--good); }
.strength.moderate { background: var(--s-strat); }
.strength.suggestive { background: var(--warn); }
.caveat { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--warn); padding: 4px 0 4px 12px; margin: 12px 0 0; max-width: 74ch; }
.caveat b { color: var(--ink); }
blockquote { font-size: 14.5px; margin: 10px 0; padding: 10px 14px; }
.evidence summary { font: 500 12px var(--mono); color: var(--s-strat); cursor: pointer; margin: 6px 0; }
.evidence blockquote { font-size: 13.5px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile .v { font-size: 26px; }
ul.tight { margin: 6px 0 0; padding-left: 20px; max-width: 76ch; }
ul.tight li { margin: 5px 0; }
.summary-list { counter-reset: f; list-style: none; padding: 0; margin: 14px 0 0; }
.summary-list li { counter-increment: f; position: relative; padding-left: 30px; margin: 9px 0; max-width: 76ch; }
.summary-list li::before { content: counter(f); position: absolute; left: 0; top: 1px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--mark); color: var(--surface); font: 600 11.5px/20px var(--sans); text-align: center; }
@media print { section { break-inside: avoid-page; } details.evidence { display: none; } }
</style>
</head>
<body>
<div class="themebar"><button id="t-light">light</button><button id="t-dark">dark</button></div>
<div id="tip" role="status" aria-live="polite"></div>
<main id="main"></main>

<script>
const DATA = /*__DATA__*/null;
/*__COMMON_JS__*/

/* ───────────────────────── brief-only helpers ───────────────────────── */
const I = DATA.individual, B = DATA.benchmark;
const xo = key => SR.crossover.find(r => r.key === key);
const metric = key => S.metrics.find(m => m.key === key);
const orx = b => '×' + Math.exp(b).toFixed(2);
const pp = pval;
function strength(level) { return `<span class="strength ${level}">${level}</span>`; }
function claim(id, title, level) {
  const s = section(id, 'Finding', '');
  s.querySelector('h2').innerHTML = title + strength(level);
  return s;
}
function caveat(host, html) { h('div', { class: 'caveat', html: '<b>Caveat.</b> ' + html }, host); }
// A headcount from the debriefs, with the quotes behind it one click away. The count is the
// number of distinct participants in `ids`, so it cannot drift from the list it summarises.
function evidence(host, ids, label) {
  const people = new Set(ids.map(id => id.split('/')[0]));
  const d = h('details', { class: 'evidence' }, host);
  h('summary', { text: `${label} — ${people.size} of ${N.participants.length} coded debriefs (show)` }, d);
  ids.forEach(id => quote(d, id));
  return people.size;
}
const nPeople = ids => new Set(ids.map(id => id.split('/')[0])).size;

/* Debrief quotes grouped by what they describe. Chosen by reading every coded quote; each list is
   the complete set found for that claim, not a sample, so the headcount in the text is the list. */
const OVERALLOC = ['P01/agent_comparison/1596', 'P13/agent_comparison/1795', 'P17/agent_comparison/1393',
  'P19/trust_trajectory/1907', 'P20/trust_trajectory/1551', 'P21/agent_comparison/2103',
  'P28/agent_comparison/1796', 'P33/agent_comparison/1608', 'P35/agent_comparison/1793',
  'P36/agent_comparison/1892'];
const RESERVE = ['P22/manual_override/1737', 'P24/manual_override/1548', 'P28/manual_override/1685',
  'P30/agent_comparison/1375'];
const NOCHECK = ['P22/verification/1834', 'P24/verification/1660', 'P25/verification/1490',
  'P28/verification/1833', 'P33/verification/1653', 'P35/verification/1729'];
const TACFLAW = ['P31/agent_comparison/1967'];
const SIMPLE_MYSELF = ['P11/scenario_comparison/2003', 'P11/agent_comparison/1781', 'P29/manual_override/1469',
  'P15/agent_comparison/1812', 'P18/scenario_comparison/1577', 'P20/scenario_comparison/1756',
  'P26/agent_comparison/1717', 'P35/agent_comparison/1699'];

/* — masthead — */
h('div', { class: 'kicker', text: 'Human–autonomy trust study · findings brief' }, main);
h('h1', { text: 'What the data can defend' }, main);
h('p', { class: 'lede', html: `${C.n.participants} operators each ran two 8-minute sessions, one in each `
  + `scenario in counterbalanced order: ${C.n.decisions} strategic decisions, every tactical plan, every `
  + `drone-failure recovery, and post-session debriefs coded for ${N.participants.length} of them. Both `
  + 'assistants are deliberately simple rule-based heuristics, and <b>no failures were injected</b>: both '
  + 'error rates were zero in every session. Six findings survive the evidence; each is marked with how '
  + 'much weight it can bear. Hover any underlined term for its definition.' }, main);
const ban = h('div', { class: 'banner' }, main);
ban.innerHTML = '<b>Identifiable data — do not circulate.</b> Contains verbatim participant speech. '
  + 'The full evidence behind every number is in <code>findings_synthesis.html</code>.';
h('p', { class: 'meta', text: `Generated ${DATA.generated} · ${C.n.participants} participants · `
  + `${C.n.decisions} strategic decisions · P09 excluded · crossover estimates from the ${S.cohort} cohort `
  + `(n = ${S.n})` }, main);

const sumCard = card(main, 'In one paragraph each');
const sl = h('ol', { class: 'summary-list' }, sumCard);
[
  '<b>Reliance is mostly the operator.</b> How often someone takes the strategic card is a stable '
    + 'personal style, and none of the attitudes we measured predicts it.',
  '<b>Within a person, the mission decides.</b> Single-type missions are done by hand, multi-type ones '
    + 'are handed over. The scenario difference is this, in disguise.',
  '<b>“Manual” is mostly not rejection.</b> Half of it is decided before the advice exists, and nearly '
    + 'all of it is anchored on the cards it replaces.',
  '<b>The tactical assistant is trusted more, but not like-for-like.</b> The strategic assistant’s flaws '
    + 'are visible and cheap to check; the tactical assistant’s are neither.',
  '<b>Strategic trust fell between sessions; behaviour barely followed.</b> Self-report and behaviour '
    + 'move separately.',
  '<b>In failure recovery, using the assistant goes with far fewer abandoned missions.</b> The clearest '
    + 'link between reliance and outcome, and the clearest design lever.',
].forEach(t => h('li', { html: t }, sl));

/* ───────────────────────── 1 · the person ───────────────────────── */
{
  const s = claim('person', 'Reliance is mostly a stable property of the operator', 'strong');
  const q = I.rates.q;
  para(s, `Card uptake ranges from ${pct(q[0], 0)} to ${pct(q[4], 0)} across operators (middle half `
    + `${pct(q[1], 0)}–${pct(q[3], 0)}); ${I.rates.high} took a card at least 90% of the time and `
    + `${I.rates.low} at most 25%. That rate carries over from one session to the next even though the `
    + `scenario changed: ${gl('rho')} = ${num(I.stability.took.rho, 2)} for card uptake, `
    + `${num(I.stability.consult.rho, 2)} for consulting the tactical plan and `
    + `${num(I.stability.accept.rho, 2)} for taking it unmodified (each ${pp(Math.max(I.stability.took.p, I.stability.consult.p, I.stability.accept.p))}).`);
  para(s, `Knowing <i>who</i> is deciding explains about ${pct(I.r2.person, 0)} of the variation in whether `
    + `a card is taken; everything about the mission, scenario, session and timing together explains `
    + `${pct(I.r2.mission, 0)} (McFadden pseudo-R², descriptive). Yet <b>none of the ${DP.nTests} tests of `
    + `measured disposition survives correction</b> — not ${gl('aias', 'attitude to AI')}, `
    + `${gl('verification', 'verification propensity')}, ${gl('delegation', 'delegation boundary')} or prior `
    + 'experience. The style is real; we did not measure what it is made of.');
  const g = h('div', { class: 'grid2' }, s);
  const c = card(g, 'Each operator’s card uptake, session 1 → session 2');
  slopes(h('div', { class: 'chart' }, c), C.learning.perPerson.filter(x => x.r1 != null && x.r2 != null)
    .map(x => ({ label: x.pid, a: x.r1, b: x.r2 })),
    { aLabel: 'Session 1', bLabel: 'Session 2', height: 230 });
  const qc = h('div', {}, g);
  quote(qc, 'P10/agent_comparison/1580');
  quote(qc, 'P11/manual_override/1646');
  caveat(s, `The disposition null is weak evidence. AIAS-4 averages ${num(DP.batteries[0].mean, 1)}/10 `
    + `(almost no AI sceptics in the sample), the two bespoke scales are unreliable (${gl('alpha', 'α')} = `
    + `${num(DP.batteries[1].alpha, 2)}, ${num(DP.batteries[2].alpha, 2)}), and n = ${DP.nDetect} can only `
    + `detect ρ ≥ ${num(DP.detectable, 2)}. The pseudo-R² figures come from per-person fixed effects on `
    + '~18 decisions each and overstate the person share somewhat.');
}

/* ───────────────────────── 2 · the mission ───────────────────────── */
{
  const s = claim('mission', 'Within a person, mission composition decides — and explains the scenario effect', 'strong');
  const L = C.load, d0 = C.drivers[0], d2 = C.drivers[2];
  const one = L.byColours.find(r => r.k === 1), three = L.byColours.find(r => r.k === 3);
  para(s, `Operators took the card on ${pct(one.took, 0)} of single-drone-type missions and `
    + `${pct(three.took, 0)} of three-type ones. Holding the person fixed, each extra drone type needed `
    + `multiplies the ${gl('odds', 'odds')} of taking a card by ${orx(I.within.ncolours.b)} `
    + `(${pp(I.within.ncolours.p)}). The headline scenario effect — ${orx(d0.scenario.b)} in Tactical Heavy `
    + `(${pp(d0.scenario.p)}) — shrinks to ${orx(d2.scenario.b)} (${pp(d2.scenario.p)}) once composition `
    + 'is in the model: Strategic Heavy simply serves more small missions, and small missions are the ones '
    + 'people do themselves.');
  const g = h('div', { class: 'grid2' }, s);
  const cA = card(g, 'Card uptake by drone types needed');
  barsH(h('div', { class: 'chart' }, cA), L.byColours.map(r => ({
    label: r.k + (r.k === 1 ? ' type' : ' types'), value: r.took, sub: 'n = ' + r.n + ' decisions' })),
    { max: 1, padL: 80, rowH: 34 });
  const cB = card(g, 'Card uptake by mission category');
  barsH(h('div', { class: 'chart' }, cB), L.byCategory.map(r => ({
    label: r.k + ' · ' + num(r.tasks, 0) + ' tasks', value: r.took, sub: 'n = ' + r.n + ' decisions' })),
    { max: 1, padL: 96, rowH: 30 });
  quote(s, 'P11/scenario_comparison/2003');
  evidence(s, SIMPLE_MYSELF, 'Operators who say they do simple missions themselves and hand complex ones over');
  caveat(s, `“Drone types needed” is close to binary here: ${one.n} single-type and ${three.n} three-type `
    + `decisions, only ${(L.byColours.find(r => r.k === 2) || {}).n || 0} two-type. Category rises to D `
    + `then dips at E (${pct(L.byCategory.find(r => r.k === 'E').took, 0)}, n = `
    + `${L.byCategory.find(r => r.k === 'E').n}), and ${L.residualN} decisions on `
    + `${gl('residual', 'residual missions')} are excluded from the category view.`);
}

/* ───────────────────────── 3 · manual ───────────────────────── */
{
  const s = claim('manual', '“Manual” is mostly not a rejection of the advice', 'strong');
  const P = C.position.overall;
  tiles(s, [
    { v: pct(C.preemption.overall, 0), k: 'of manual choices made before the cards were readable', s: `n = ${C.preemption.n}` },
    { v: pct(P.between + P['below both'], 0), k: 'of manual allocations between the two cards or below both', s: `n = ${C.position.n}` },
    { v: '+' + num(C.timing.model.b, 1) + 's', k: 'slower than taking a card, same mission', s: pp(C.timing.model.p) },
  ]);
  para(s, 'The cards are unreadable for the first 4–5 seconds; nearly half of all manual choices were '
    + 'committed in that window, mostly on single-type missions — the operator had decided before there '
    + 'was advice to reject. The rest sit around the cards rather than away from them, and what they '
    + 'change depends on mission size: on small missions operators trim drones below the Conservative '
    + 'card, on large ones they add. The trimming matches what operators say they were doing — holding '
    + 'drones back for missions that have not arrived yet, which a per-mission assistant cannot weigh.');
  const g = h('div', { class: 'grid2' }, s);
  const c = card(g, 'Drones committed by hand vs the Conservative card');
  barsDiverging(h('div', { class: 'chart' }, c), C.load.deltaByCategory.map(b => ({
    label: 'Category ' + b.k, value: b.mean, sub: 'n = ' + b.n + ' manual decisions' })),
    { zeroLabel: 'same as the card', rowH: 32, padL: 110 });
  const qc = h('div', {}, g);
  quote(qc, 'P24/manual_override/1548');
  quote(qc, 'P17/manual_override/1418');
  evidence(s, RESERVE, 'Operators who say they held drones in reserve for later missions');
  caveat(s, 'Manual is never the faster route, so pre-emption is about <i>when</i> the decision was made, '
    + 'not time saved. Whether trimming actually paid off later is not tested here.');
}

/* ───────────────────────── 4 · the tier gap ───────────────────────── */
{
  const s = claim('tiers', 'The tactical assistant is trusted more — but the comparison is not like-for-like', 'moderate');
  const G = SR.gap, tS = DP.dist.trust_s, tT = DP.dist.trust_t;
  para(s, `Reported trust: ${num(tT.mean, 2)} for the tactical assistant against ${num(tS.mean, 2)} for the `
    + `strategic one on the same six 1–7 statements (${pp(G.p)}; ${G.higherTactical} of ${G.n} operators `
    + `higher for tactical). Behaviour points the same way: operators consulted the tactical plan on `
    + `${pct(DP.dist.consult.mean, 0)} of plans and kept it unmodified on ${pct(DP.dist.accept.mean, 0)}, `
    + `against ${pct(DP.dist.took.mean, 0)} uptake of strategic cards.`);
  const c = card(s, 'The same six statements, asked about each assistant (1–7)');
  legend(c, [{ label: 'Strategic Assistant', color: css('--s-strat') }, { label: 'Tactical Assistant', color: css('--s-tac') }]);
  barsGrouped(h('div', { class: 'chart' }, c), SR.items.map(i => i.label.replace(/^I /, '')),
    [{ label: 'Strategic Assistant', color: css('--s-strat'), values: SR.items.map(i => i.strategic) },
     { label: 'Tactical Assistant', color: css('--s-tac'), values: SR.items.map(i => i.tactical) }],
    { fmt: v => num(v, 1), height: 210 });
  para(s, '<b>Two things other than the tier differ between them.</b> First, <b>visibility of flaws</b>: '
    + `the strategic card’s rules pad drone types the mission does not use on ${pct(C.artefact.prevalence, 0)} `
    + `of decisions, and ${nPeople(OVERALLOC)} of ${N.participants.length} debriefs describe the strategic `
    + 'assistant over-allocating; '
    + (nPeople(TACFLAW) === 1 ? 'only one describes' : nPeople(TACFLAW) + ' describe')
    + ' a flaw in a tactical plan (its task ordering). '
    + 'Second, <b>the cost of checking</b>: a strategy card is three comparable numbers, a tactical plan '
    + 'has to be read drone by drone, and operators describe deferring to it precisely because they '
    + 'cannot check it in time.');
  const g = h('div', { class: 'grid2' }, s);
  quote(g, 'P14/verification/1575');
  quote(g, 'P22/verification/1834');
  evidence(s, OVERALLOC, 'Operators who describe the strategic assistant over-allocating');
  evidence(s, TACFLAW, 'Operators who describe a flaw in a tactical plan');
  evidence(s, NOCHECK, 'Operators who describe taking advice because there was no time to check it');
  caveat(s, 'This is a confound built into the design, not a finding about tiers: a tier comparison needs '
    + 'assistants of matched visible quality and matched checking cost. The gap is robust; what it is a '
    + 'gap <i>in</i> is not established.');
}

/* ───────────────────────── 5 · trust drifted, behaviour did not ───────────────────────── */
{
  const s = claim('trust', 'Strategic trust fell between sessions; behaviour barely followed', 'moderate');
  const ts = xo('trust_s'), tt = xo('trust_t'), ch = I.trustChange, rm = C.learning.runMeans;
  para(s, `Trust in the strategic assistant fell from ${num(ts.means.run1, 2)} after session 1 to `
    + `${num(ts.means.run2, 2)} after session 2 (crossover run effect ${pp(ts.run.p)}; it fell for `
    + `${ch.strategic.fell} of ${ch.strategic.fell + ch.strategic.rose + ch.strategic.same} operators). `
    + `Tactical trust did not move (${num(tt.means.run1, 2)} → ${num(tt.means.run2, 2)}, ${pp(tt.run.p)}).`);
  para(s, `Card uptake dipped only from ${pct(rm[0].took, 0)} to ${pct(rm[1].took, 0)} (${orx(I.within.run.b)} `
    + `within person, ${pp(I.within.run.p)}; ${pp(C.learning.runModel.p)} in the clustered model), and the `
    + `operators whose trust fell most were not the ones whose uptake fell (ρ = ${num(ch.vsUptake.rho, 2)}, `
    + `${pp(ch.vsUptake.p)}). The drop is not explained by how many illogical cards someone saw `
    + `(ρ = ${sgn(C.carryover.trustRho, 2)}), and seeing one has no detectable effect on later decisions — `
    + `four separate tests, all null (e.g. next decision ${pp(C.carryover.nextModel.p)}). The debriefs suggest `
    + 'a second session leaves spare attention to notice what went unnoticed the first time.');
  const g = h('div', { class: 'grid2' }, s);
  const c = card(g, 'Each operator’s trust in the Strategic Assistant (1–7)');
  slopes(h('div', { class: 'chart' }, c), I.trustPairs.map(x => ({ label: x.pid, a: x.a, b: x.b })),
    { aLabel: 'After session 1', bLabel: 'After session 2', lo: 1, hi: 7, ticks: [1, 4, 7],
      fmt: v => num(v, 1), height: 230 });
  const qc = h('div', {}, g);
  quote(qc, 'P15/trust_trajectory/1985');
  quote(qc, 'P19/trust_trajectory/1907');
  caveat(s, 'Within a person, trust and behaviour move separately; between people they agree (session '
    + `trust vs uptake ρ = ${num(SR.link[0].rho, 2)}). So a trust scale here reads an operator’s standing `
    + 'view more than it predicts their next decisions. The “second look” mechanism rests on a handful of '
    + 'debriefs.');
}

/* ───────────────────────── 6 · recovery ───────────────────────── */
{
  const s = claim('recovery', 'In failure recovery, using the assistant goes with far fewer abandoned missions', 'moderate');
  const sp = S.suggestSplit, w = sp.withSuggest, wo = sp.withoutSuggest;
  const untried = (S.patterns || {})['abandon-untried'] || 0;
  const tot = Object.values(S.patterns || {}).reduce((a, b) => a + b, 0);
  para(s, `When a drone fails the operator must re-plan the mission or abandon it. Where they pressed `
    + `Suggest, ${w.abandoned} of ${w.n} recoveries ended in abandonment (${pct(w.abandoned / w.n, 0)}); `
    + `where they did not, ${wo.abandoned} of ${wo.n} (${pct(wo.abandoned / wo.n, 0)}). And ${untried} of `
    + `${tot} recovery episodes were abandoned without any attempt, although the logs show the drones already `
    + 'on the mission could have fixed them.');
  const c = card(s, 'Recovery episodes ending in abandonment');
  barsH(h('div', { class: 'chart' }, c), [
    { label: 'Used Suggest', value: w.abandoned / w.n, sub: `${w.abandoned} of ${w.n} episodes` },
    { label: 'Did not', value: wo.abandoned / wo.n, sub: `${wo.abandoned} of ${wo.n} episodes` },
  ], { max: 1, padL: 110, rowH: 34 });
  caveat(s, 'Observational: operators chose when to press Suggest, and may have pressed it on the more '
    + `tractable failures. ${S.cohort} cohort only (n = ${S.n}). It is still the one place where a `
    + 'reliance decision lines up with a large outcome difference, and “prompt Suggest on failure” is a '
    + 'cheap thing to test.');
}

/* ───────────────────────── context and limits ───────────────────────── */
{
  const s = section('context', 'Context', 'Performance, workload, and what we cannot claim');
  const se = metric('scoreEff'), wl = xo('rtlx');
  const bs = sc => (B.byScenario.find(r => r.scenario === sc) || {}).share;
  para(s, `<b>Performance.</b> Operators earned a larger share of the points available in Tactical Heavy `
    + `(${pct(se.tactical, 0)} vs ${pct(se.strategic, 0)}, ${pp(se.scenarioP)}) with the same reported `
    + `${gl('rtlx', 'workload')} (${num(wl.means.tactical, 1)} vs ${num(wl.means.strategic, 1)} of 20, `
    + `${pp(wl.scenario.p)}). Against a near-perfect automated operator on the same four games they reach `
    + `${pct(B.overall, 0)} of its score on average — ${pct(bs('strategic'), 0)} in Strategic Heavy and `
    + `${pct(bs('tactical'), 0)} in Tactical Heavy. The many-small-missions scenario is where people fall `
    + 'furthest short; whether that is the extra manual work is not tested.');
  h('h3', { text: 'What this data cannot support' }, s);
  const ul = h('ul', { class: 'tight' }, s);
  [
    '<b>Anything about assistant reliability as a manipulation.</b> No failures were injected; the only '
      + '“errors” are side effects of the simple card rules, concentrated in Strategic Heavy.',
    '<b>Causal claims about the assistant’s value.</b> Who consulted it, and when, was the operator’s choice.',
    '<b>Disposition “does not matter”.</b> The measures could not have shown it (ceiling, reliability, power).',
    '<b>Quote-to-decision pairing.</b> Every quote is from the post-session debrief, coded once by one coder; '
      + 'in-session speech is not yet aligned to decisions.',
    `<b>Generalisation.</b> ${DP.sample.fieldStem} of ${DP.sample.n} operators describe a computing, `
      + 'engineering or science field, mostly at postgraduate level; none is a trained dispatcher.',
  ].forEach(t => h('li', { html: t }, ul));
  h('h3', { text: 'Where this points' }, s);
  const ul2 = h('ul', { class: 'tight' }, s);
  [
    'Treat reliance as <b>person × mission</b>, not as a level of trust: model the person explicitly and report '
      + 'composition effects within person.',
    'Split the manual measure into <b>pre-emptive, anchored and edited</b> before it is used as a distrust signal.',
    'A fair tier comparison needs the two assistants <b>matched on visible quality and checking cost</b> — '
      + 'or the injected-failure manipulation actually switched on.',
    'The recovery result is the most actionable: an experiment that <b>prompts Suggest on failure</b> would turn '
      + 'the association into an estimate.',
  ].forEach(t => h('li', { html: t }, ul2));
}

/* — theme toggle — */
$('t-light').onclick = () => document.documentElement.setAttribute('data-theme', 'light');
$('t-dark').onclick = () => document.documentElement.setAttribute('data-theme', 'dark');
</script>
</body>
</html>
