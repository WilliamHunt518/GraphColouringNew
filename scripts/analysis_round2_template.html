<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analysis round 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Generated by scripts/build_findings_synthesis.py from scripts/analysis_round2_template.html.
   Edit the TEMPLATE (and docs/analysis/round2/results.json for the numbers), never the generated page. */
/*__COMMON_CSS__*/
main { max-width: 920px; }
h2 { font-size: 22px; }
section { margin-top: 40px; }
.chip { display: inline-block; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase;
  border-radius: 4px; padding: 2px 7px; color: #fff; white-space: nowrap; vertical-align: 2px; }
.chip.strong { background: var(--good); }
.chip.moderate { background: var(--s-strat); }
.chip.suggestive { background: var(--warn); }
.chip.replication { background: var(--mark-soft); color: var(--ink); }
.chip.none { background: var(--mark-soft); color: var(--ink); }
.caveat { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--warn); padding: 4px 0 4px 12px; margin: 12px 0 0; max-width: 74ch; }
.caveat b { color: var(--ink); }
dl.defs { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 6px 0 0; font-size: 14px; }
dl.defs dt { font-weight: 600; }
dl.defs dd { margin: 0; color: var(--ink-2); }
@media (max-width: 640px) { dl.defs { grid-template-columns: 1fr; } dl.defs dd { margin-bottom: 6px; } }
ul.tight { margin: 6px 0 0; padding-left: 20px; max-width: 76ch; }
ul.tight li { margin: 6px 0; }
ul.tight a { color: var(--ink); text-decoration: none; }
.finding { border: 1px solid var(--line); border-left: 4px solid var(--s-strat); border-radius: 6px;
  background: var(--surface); padding: 12px 16px; margin: 10px 0; }
.finding.strong { border-left-color: var(--good); }
.finding.suggestive { border-left-color: var(--warn); }
.finding.replication { border-left-color: var(--mark-soft); }
.finding h4 { margin: 0 0 6px; color: var(--ink); font-size: 14.5px; }
.finding p { margin: 0 0 6px; font-size: 14px; }
.finding .stat { font: 400 12px var(--mono); color: var(--ink-3); }
.tiles { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.tile .v { font-size: 26px; }
</style>
</head>
<body>
<div class="themebar"><button id="t-light">light</button><button id="t-dark">dark</button></div>
<div id="tip" role="status" aria-live="polite"></div>
<main id="main"></main>

<script>
const DATA = /*__DATA__*/null;
/*__COMMON_JS__*/

/* ───────────────────────── round-2 page ───────────────────────── */
const R = DATA.round2;
if (!R) { h('p', { text: 'No round-2 results found (docs/analysis/round2/results.json).' }, main); throw new Error('no round2'); }
const F = Object.fromEntries(R.findings.map(f => [f.id, f]));

Object.assign(GLOSS, {
  exploratory: { term: 'Exploratory', group: 'This round',
    what: 'This round deliberately tried many versions of each idea — alternative measures, opposite hypotheses, '
      + 'narrower situations. Its results are candidates to confirm on new data, not confirmed claims.',
    read: 'Treat every finding here as “worth testing properly next time”.' },
  qvalue: { term: 'q-value (false-discovery rate)', group: 'This round',
    what: 'Every one of the round’s tests was corrected together (Benjamini–Hochberg). A q-value is the expected '
      + 'share of false findings among everything at least that strong.',
    read: 'q < .10 means: of the results passing this bar, we expect fewer than 1 in 10 to be flukes. That was the '
      + 'bar agreed for this round.' },
  gates: { term: 'Robustness gates', group: 'This round',
    what: 'Three checks every candidate had to pass on top of the q-value: the same direction in session 1 alone '
      + '(no order or carry-over effects), the same direction in both scenario orders, and no single participant '
      + 'able to flip it when left out.',
    read: 'A result that fails any gate is not promoted, however small its p.' },
  within: { term: 'Within-person', group: 'This round',
    what: 'Comparing an operator with themselves — e.g. their high-reliance session against their low-reliance one.',
    read: 'Removes stable differences between people, so it is the closer thing to cause and effect.' },
  between: { term: 'Between-person', group: 'This round',
    what: 'Comparing different operators with each other.',
    read: 'Cannot separate the effect of a behaviour from the kind of person who shows it.' },
  preempt: { term: 'Pre-empting the cards', group: 'This round',
    what: 'Choosing to allocate by hand during the 4–5 s before the strategy cards become readable — deciding '
      + 'before any advice exists.',
    read: 'A rate: the share of a person’s strategic decisions made this way.' },
  reliance: { term: 'Reliance trait', group: 'This round',
    what: 'Round 1’s single axis of general reliance on the assistants (taking cards, consulting the tactical plan, '
      + 'using Suggest in recovery), on which operators differ smoothly rather than in types.',
    read: 'Measured in standard deviations: +1 is a person (or session) one SD more reliant than average.' },
});

const LEVEL_TEXT = { strong: 'strong', moderate: 'moderate', suggestive: 'suggestive', replication: 'replication' };
const chip = (cls, text) => `<span class="chip ${cls}">${text}</span>`;
const pfmt = p => p < 0.001 ? '< .001' : p >= 0.995 ? '1.00' : p.toFixed(3).replace(/^0/, '');
function findingCard(host, f) {
  const c = h('div', { class: 'finding ' + f.level }, host);
  h('h4', { html: `${f.id} · ${f.short} ${chip(f.level, LEVEL_TEXT[f.level])}` }, c);
  // Plain text with one hover: the finding's key term, where it has one.
  const TERM = { 'R2-1': ['preempt', 'decides before the cards load'], 'R2-5': ['reliance', 'relies more'],
                 'R2-6': ['reliance', 'reliance trait'] }[f.id];
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  h('p', { html: TERM ? esc(f.text).replace(TERM[1], gl(TERM[0], TERM[1])) : esc(f.text) }, c);
  h('div', { class: 'stat', text: `p ${pfmt(f.p)}${f.pNote ? ' (' + f.pNote + ')' : ''} · q ${pfmt(f.q)} · `
    + `spec row ${f.row}` }, c);
}
function caveat(host, html) { h('div', { class: 'caveat', html: '<b>Caveat.</b> ' + html }, host); }

/* One row per finding on a log scale: filled dot = p, ring = q (corrected across all 716 pooled tests). */
function qStrip(host, rows) {
  const W = 700, rowH = 28, padL = 270, padR = 24, padT = 26, H0 = padT + rows.length * rowH + 34;
  const s = svgRoot(host, W, H0);
  const lo = Math.log10(0.0001), hi = 0;
  const x = p => padL + (W - padL - padR) * ((Math.log10(Math.max(p, 0.0001)) - lo) / (hi - lo));
  [0.0001, 0.001, 0.01, 0.1, 1].forEach(v => {
    el('line', { x1: x(v), x2: x(v), y1: padT - 6, y2: H0 - 30, stroke: v === 0.1 ? css('--ink-3') : css('--grid'),
                 'stroke-width': v === 0.1 ? 1.5 : 1, 'stroke-dasharray': v === 0.1 ? '4 3' : '' }, s);
    el('text', { x: x(v), y: H0 - 14, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5,
                 'font-family': css('--mono') }, s).textContent = v === 1 ? '1' : String(v).replace(/^0/, '');
  });
  el('text', { x: x(0.1), y: padT - 12, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5,
               'font-family': css('--mono') }, s).textContent = 'q = .10';
  el('text', { x: padL, y: H0 - 1, fill: css('--ink-3'), 'font-size': 10, 'font-family': css('--mono') }, s)
    .textContent = '← stronger evidence (values below .0001 drawn at the edge)';
  const col = lvl => lvl === 'strong' ? css('--good') : lvl === 'moderate' ? css('--s-strat')
    : lvl === 'suggestive' ? css('--warn') : css('--mark');
  rows.forEach((r, i) => {
    const y = padT + i * rowH + rowH / 2, c = col(r.level);
    el('text', { x: padL - 12, y: y + 4, 'text-anchor': 'end', fill: css('--ink-2'), 'font-size': 12.5 }, s)
      .textContent = r.id + ' · ' + r.short;
    el('line', { x1: x(r.p), x2: x(r.q), y1: y, y2: y, stroke: c, 'stroke-width': 1.5, opacity: .6 }, s);
    el('circle', { cx: x(r.q), cy: y, r: 5, fill: css('--surface'), stroke: c, 'stroke-width': 2 }, s);
    el('circle', { cx: x(r.p), cy: y, r: 5, fill: c }, s);
    const hit = el('rect', { x: padL, y: y - rowH / 2, width: W - padL - padR, height: rowH, fill: 'transparent' }, s);
    hit.style.cursor = 'pointer';
    hit.addEventListener('click', () => { location.hash = '#ws-' + r.ws.toLowerCase(); });
    hoverable(hit, `<b>${r.id} · ${r.short}</b><br>p = ${pfmt(r.p)} · q = ${pfmt(r.q)}<br>workstream ${r.ws} — click to jump`);
  });
}

/* — masthead — */
h('div', { class: 'kicker', text: 'Human–autonomy trust study · analysis round 2' }, main);
h('h1', { text: 'Looking wider: seven workstreams' }, main);
h('p', { class: 'lede', html: 'Round 1 tested ten fixed hypotheses and none survived correction. Round 2 widened the '
  + 'search on purpose — alternative measures, opposite hypotheses, narrower situations and new questions — while '
  + 'keeping it honest: a fixed menu of variants, every test reported, one ' + gl('qvalue', 'false-discovery '
  + 'correction') + ' across the whole round, and ' + gl('gates', 'robustness gates') + '. Everything here is '
  + gl('exploratory') + ': candidates to confirm on new data. Underlined terms explain themselves on hover.' }, main);
const ban = h('div', { class: 'banner' }, main);
ban.innerHTML = '<b>Identifiable data — do not circulate.</b> Per-workstream detail and the full spec tables: '
  + '<code>docs/analysis/round2/</code>. Round 1: <code>analysis_round1.html</code>.';
h('p', { class: 'meta', text: `Round run ${R.date} · ${C.n.participants} participants (P09 excluded) · `
  + `${R.counts.tests} tests · page generated ${DATA.generated}` }, main);

const sumCard = card(main, 'What came out of it');
const sl = h('ul', { class: 'tight' }, sumCard);
R.findings.forEach(f => {
  const li = h('li', {}, sl);
  li.innerHTML = `<a href="#ws-${f.ws.toLowerCase()}"><b>${f.id}</b></a> ${chip(f.level, LEVEL_TEXT[f.level])} ${f.short}.`;
});
para(sumCard, '<b>Biggest nulls:</b> reliance never pays within a person on any performance measure; being '
  + 'busy still does not push people onto the assistant; reliance does not become better targeted with '
  + 'experience; what people say about when they rely on the assistant does not reliably predict when they do.');

/* ───────────────────────── how the round worked ───────────────────────── */
{
  const s = section('funnel', 'Overview', 'From 817 tests to six findings');
  para(s, 'Each workstream ran a menu of variants fixed before it started, plus at most three of its own, '
    + 'each declared before running. Every test went into one pool and one correction. A test then had to '
    + 'pass the ' + gl('gates', 'robustness gates') + ' and a review by the supervisor, which grouped duplicates '
    + 'into findings and set aside results about the game design or with a known artefact.');
  const K = R.counts;
  const c = card(s, 'How many tests survived each step');
  barsH(h('div', { class: 'chart' }, c), [
    { label: 'Tests run', value: K.tests, sub: 'all seven workstreams, nulls included' },
    { label: 'Pooled', value: K.pooled, sub: 'descriptive-only and unfittable rows set aside, by a rule written first' },
    { label: 'q < .10', value: K.q10, sub: 'after one correction across the round' },
    { label: 'Gates pass', value: K.gates, sub: 'session 1 alone, both orders, no one person flips it' },
    { label: 'Not an artefact', value: K.afterArtefacts, sub: 'pre-declared artefacts removed' },
    { label: 'Findings', value: K.findings + K.replications, sub: `${K.findings} new + ${K.replications} replication, after grouping duplicates and setting aside design facts` },
  ], { padL: 120, rowH: 30, fmt: v => String(v) });
  para(s, 'Each finding below: the <b>filled dot</b> is its p-value, the <b>ring</b> its q-value. Left of the '
    + 'dashed line passes the agreed bar. Click a row to jump to its workstream.');
  qStrip(h('div', { class: 'chart' }, card(s)), R.findings);
}

/* ───────────────────────── one section per workstream ───────────────────────── */
R.workstreams.forEach(w => {
  const s = section('ws-' + w.id.toLowerCase(), 'Workstream ' + w.id + (w.from === 'new' ? ' · new' : ' · from ' + w.from), '');
  const n = w.found.length;
  s.querySelector('h2').innerHTML = w.title + ' ' + (n ? chip(F[w.found[0]].level, n + ' finding' + (n > 1 ? 's' : ''))
    : chip('none', 'no finding'));
  const c = card(s);
  const d = h('dl', { class: 'defs' }, c);
  [['Tried', w.tried], ['Tests', `${w.tests}, every one reported in <code>docs/analysis/round2/w${w.id}_specs.csv</code>`]]
    .forEach(([k, v]) => { h('dt', { text: k }, d); h('dd', { html: v }, d); });
  if (n) { h('h3', { text: 'What passed' }, s); w.found.forEach(id => findingCard(s, F[id])); }
  else para(s, '<b>Nothing passed the bar.</b>');
  if (w.nulls.length) {
    h('h3', { text: 'Nulls worth keeping' }, s);
    const ul = h('ul', { class: 'tight' }, s);
    w.nulls.forEach(t => h('li', { text: t }, ul));
  }
  if (w.notes.length) {
    h('h3', { text: 'Also worth knowing' }, s);
    const ul = h('ul', { class: 'tight' }, s);
    w.notes.forEach(t => h('li', { text: t }, ul));
  }
});

/* ───────────────────────── consequences ───────────────────────── */
{
  const s = section('next', 'Next', 'What this adds up to');
  const ul = h('ul', { class: 'tight' }, s);
  [
    '<b>The study’s reliance story is about people and job size, not pressure.</b> Who the operator is and how big the '
      + 'job is decide reliance (round 1 H1 + R2-1, R2-2); momentary load does not (round 1 H9 + workstream B).',
    '<b>The assistant’s value is speed and throughput, not better missions.</b> Cards save time where jobs are big '
      + '(R2-3), and a more reliant session gets more missions allocated (R2-5), but no measure shows a given person '
      + 'scoring higher or completing more missions by relying more.',
    '<b>Operators speed up with practice but do not get better at targeting their reliance</b> (R2-4 vs the '
      + 'workstream G null).',
    '<b>Brief Finding 5 stays as written</b> (“strategic trust fell between sessions”), with Strategic Heavy adding '
      + 'a smaller penalty on top — this reverses round 1’s proposed reframing.',
    '<b>To confirm on new data:</b> R2-1 to R2-6, ideally in the online arm with the order and game swap fully '
      + 'balanced from the start. A human second coder is still needed for what people said (workstream E).',
  ].forEach(t => h('li', { html: t }, ul));
  caveat(s, 'Exploratory round: with 716 tests in the pool, the q < .10 bar expects up to about one in ten of the '
    + 'passing rows to be a fluke, before the gates and review. The gates, the review and the agreement across '
    + 'workstreams are what make the six worth following up — not their p-values alone.');
}

/* — theme toggle — */
$('t-light').onclick = () => document.documentElement.setAttribute('data-theme', 'light');
$('t-dark').onclick = () => document.documentElement.setAttribute('data-theme', 'dark');
</script>
</body>
</html>
