<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analysis round 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Generated by scripts/build_findings_synthesis.py from scripts/analysis_round1_template.html.
   Edit the TEMPLATE (and docs/analysis/round1/results.json for the numbers), never the generated page. */
/*__COMMON_CSS__*/
main { max-width: 920px; }
h2 { font-size: 22px; }
section { margin-top: 40px; }
.chip { display: inline-block; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase;
  border-radius: 4px; padding: 2px 7px; color: #fff; white-space: nowrap; }
.chip.strong { background: var(--good); }
.chip.moderate { background: var(--s-strat); }
.chip.suggestive, .chip.partial { background: var(--warn); }
.chip.not { background: var(--mark-soft); color: var(--ink); }
.chip.invalid { background: var(--bad); }
h2 .chip { margin-left: 8px; vertical-align: 3px; }
.caveat { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--warn); padding: 4px 0 4px 12px; margin: 12px 0 0; max-width: 74ch; }
.caveat b { color: var(--ink); }
dl.defs { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 6px 0 0; font-size: 14px; }
dl.defs dt { font-weight: 600; }
dl.defs dd { margin: 0; color: var(--ink-2); }
@media (max-width: 640px) { dl.defs { grid-template-columns: 1fr; } dl.defs dd { margin-bottom: 6px; } }
table.results td { vertical-align: top; }
table.results td.q { text-align: left; max-width: 36ch; }
table.results td.r { text-align: left; font-size: 13px; color: var(--ink-2); max-width: 46ch; }
ul.tight a { color: var(--ink); text-decoration: none; }
.summary-list { counter-reset: f; list-style: none; padding: 0; margin: 14px 0 0; }
.summary-list li { counter-increment: f; position: relative; padding-left: 30px; margin: 9px 0; max-width: 76ch; }
.summary-list li::before { content: counter(f); position: absolute; left: 0; top: 1px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--mark); color: var(--surface); font: 600 11.5px/20px var(--sans); text-align: center; }
ul.tight { margin: 6px 0 0; padding-left: 20px; max-width: 76ch; }
ul.tight li { margin: 6px 0; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile .v { font-size: 26px; }
.scroll { overflow-x: auto; }
</style>
</head>
<body>
<div class="themebar"><button id="t-light">light</button><button id="t-dark">dark</button></div>
<div id="tip" role="status" aria-live="polite"></div>
<main id="main"></main>

<script>
const DATA = /*__DATA__*/null;
/*__COMMON_JS__*/

/* ───────────────────────── round-1 page ───────────────────────── */
const R = DATA.round1;
if (!R) { h('p', { text: 'No round-1 results found (docs/analysis/round1/results.json).' }, main); throw new Error('no round1'); }
const H = Object.fromEntries(R.hypotheses.map(x => [x.id, x]));

// Terms this page needs that the shared glossary does not already define.
Object.assign(GLOSS, {
  primary: { term: 'Primary test', group: 'This round',
    what: 'The single test per hypothesis that was fixed in writing before any analysis was run.',
    read: 'Only the primary test decides whether a hypothesis is supported. Everything else is exploratory.' },
  exploratory: { term: 'Exploratory (post hoc)', group: 'This round',
    what: 'Any analysis chosen after seeing the data, including the extra checks each agent was free to try.',
    read: 'Useful for ideas and explanations, but it cannot confirm anything on its own.' },
  within: { term: 'Within-person', group: 'This round',
    what: 'Comparing an operator with themselves: their card missions against their own manual missions, '
      + 'or their session 1 against their session 2.',
    read: 'Removes stable differences between people (“some people are just better”), so it is the closer '
      + 'thing to cause and effect.' },
  between: { term: 'Between-person', group: 'This round',
    what: 'Comparing different operators with each other.',
    read: 'Cannot separate the effect of a behaviour from the kind of person who shows it.' },
  smallsample: { term: 'Small-sample correction', group: 'This round',
    what: 'With only about 33 operators, the usual error bars for these models are too narrow: a simulation '
      + 'showed they flag an effect that is not there about 9.5% of the time instead of 5%. The '
      + 'bias-reduced (Mancl–DeRouen) version widens them to compensate.',
    read: 'Every p-value on this page uses it where it applies, which is why H2 no longer passes.' },
  adjusted: { term: 'Adjusted p (Holm, across all ten)', group: 'This round',
    what: 'Running ten tests raises the chance that one passes by luck. The Holm method raises each p-value '
      + 'so the ten together have only a 5% chance of any false pass.',
    read: 'An adjusted p below .05 is a result that survives testing ten things at once. None did here; '
      + 'H3 came closest at .08.' },
  detectable: { term: 'Detectable effect', group: 'This round',
    what: 'The smallest true effect the test had an 80% chance of catching with this many people.',
    read: 'A null result only rules out effects at least this big, so this is what makes a null informative.' },
  kappa: { term: 'Cohen’s κ (kappa)', group: 'This round',
    what: 'How much two people coding the same interviews agree, beyond what chance alone would give.',
    read: '0 = no better than chance, 1 = perfect. .6 or above is the usual bar for reliable coding.' },
  dbic: { term: 'ΔBIC', group: 'This round',
    what: 'How much better a model with several groups of people fits than a model with one group, '
      + 'after a penalty for being more complicated.',
    read: 'Above 10 is strong evidence that the groups are real. Here it was 1.9.' },
  jaccard: { term: 'Jaccard stability', group: 'This round',
    what: 'Resample the people many times, re-find the groups, and check whether the same people still '
      + 'end up together.',
    read: '0 to 1. At least .75 means a group is stable. Here the two groups scored .76 and .47.' },
  ari: { term: 'ARI (adjusted Rand index)', group: 'This round',
    what: 'Do sessions 1 and 2, grouped separately, put the same people in the same groups?',
    read: '0 = no better than chance, 1 = identical groupings. Here it was .04.' },
  calibrated: { term: 'Calibrated p (null simulation)', group: 'This round',
    what: 'The test is re-run many times on simulated data where we know nothing changes, to see what '
      + 'result the test produces on its own.',
    read: 'The real result is then judged against that baseline instead of against zero.' },
  axis: { term: 'Principal axis (PC1)', group: 'This round',
    what: 'The single direction along which operators differ most when all their behaviours are '
      + 'considered together.',
    read: 'Each behaviour’s loading (−1 to +1) says how strongly it moves with that direction.' },
});

const VERDICT_CHIP = { not: 'not supported', partial: 'partly', invalid: 'test invalid' };
const chip = (cls, text) => `<span class="chip ${cls}">${text}</span>`;
const pfmt = p => p < 0.001 ? '< .001' : p >= 0.995 ? '1.00' : p.toFixed(3).replace(/^0/, '');
/* A dot per hypothesis on a log p-value axis: filled = corrected p, ring = Holm-adjusted p. Lets the
   reader see in one glance how far each test is from the single-test bar and the ten-test bar. */
function pStrip(host, rows) {
  const W = 700, rowH = 28, padL = 250, padR = 24, padT = 26, H0 = padT + rows.length * rowH + 34;
  const s = svgRoot(host, W, H0);
  const lo = Math.log10(0.001), hi = 0;
  const x = p => padL + (W - padL - padR) * ((Math.log10(Math.max(p, 0.001)) - lo) / (hi - lo));
  [0.001, 0.01, 0.05, 0.1, 0.5, 1].forEach(v => {
    el('line', { x1: x(v), x2: x(v), y1: padT - 6, y2: H0 - 30, stroke: v === 0.05 ? css('--ink-3') : css('--grid'),
                 'stroke-width': v === 0.05 ? 1.5 : 1, 'stroke-dasharray': v === 0.05 ? '4 3' : '' }, s);
    el('text', { x: x(v), y: H0 - 14, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5,
                 'font-family': css('--mono') }, s).textContent = v === 1 ? '1' : String(v).replace(/^0/, '');
  });
  el('text', { x: x(0.05), y: padT - 12, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5,
               'font-family': css('--mono') }, s).textContent = 'p = .05';
  el('text', { x: padL, y: H0 - 1, fill: css('--ink-3'), 'font-size': 10, 'font-family': css('--mono') }, s)
    .textContent = '← stronger evidence';
  rows.forEach((r, i) => {
    const y = padT + i * rowH + rowH / 2;
    const col = r.verdict === 'partial' ? css('--warn') : r.verdict === 'invalid' ? css('--bad') : css('--mark');
    el('text', { x: padL - 12, y: y + 4, 'text-anchor': 'end', fill: css('--ink-2'), 'font-size': 12.5 }, s)
      .textContent = r.id + ' · ' + r.short;
    el('line', { x1: x(r.correctedP), x2: x(r.adjustedP), y1: y, y2: y, stroke: col, 'stroke-width': 1.5, opacity: .6 }, s);
    el('circle', { cx: x(r.adjustedP), cy: y, r: 5, fill: css('--surface'), stroke: col, 'stroke-width': 2 }, s);
    el('circle', { cx: x(r.correctedP), cy: y, r: 5, fill: col }, s);
    const hit = el('rect', { x: padL, y: y - rowH / 2, width: W - padL - padR, height: rowH, fill: 'transparent' }, s);
    hit.style.cursor = 'pointer';
    hit.addEventListener('click', () => { location.hash = '#' + r.id.toLowerCase(); });
    hoverable(hit, `<b>${r.id} · ${r.question}</b><br>p = ${pfmt(r.correctedP)}${r.pNote ? ' (' + r.pNote + ')' : ''}`
      + `<br>adjusted p = ${pfmt(r.adjustedP)}<br>${r.verdictText}<br><i>click to jump to it</i>`);
  });
}

/* — masthead — */
h('div', { class: 'kicker', text: 'Human–autonomy trust study · analysis round 1' }, main);
h('h1', { text: 'Ten hypotheses, tested' }, main);
h('p', { class: 'lede', html: 'Ten questions about how operators used the two assistants were written down and '
  + 'fixed before any analysis ran. Seven analysis agents tested them in parallel; every result here was '
  + 're-run independently, and the participant data was checked against a backup after every agent. '
  + '<b>No single test survives the bar for testing ten things at once</b>, but several results change or '
  + 'sharpen what the study can claim. Underlined terms explain themselves on hover.' }, main);
const ban = h('div', { class: 'banner' }, main);
ban.innerHTML = '<b>Identifiable data — do not circulate.</b> Contains verbatim participant speech. '
  + 'Per-hypothesis detail: <code>docs/analysis/round1/</code>.';
h('p', { class: 'meta', text: `Round run ${R.date} · ${C.n.participants} participants (P09 excluded) · `
  + `every primary also re-run on the 24-person v1.12+ cohort · page generated ${DATA.generated}` }, main);

const sumCard = card(main, 'What came out of it, hypothesis by hypothesis');
const sl = h('ul', { class: 'tight' }, sumCard);
[
  ['H1', 'Reliance is one trait running across all three tiers, not distinct types.'],
  ['H2', 'The cost of checking does not explain the trust gap between tiers (fails after correction).'],
  ['H3', 'In recovery, trying anything beats giving up; Suggest is the cheap way to try, not a better one.'],
  ['H4', 'Manual work does not explain the Strategic Heavy shortfall — the shortfall is mostly one unlucky benchmark game.'],
  ['H5', 'Strategic trust drops after a Strategic Heavy session; operators’ own failures do not explain it.'],
  ['H6', 'People do say they prefer the tactical assistant, but the coding is not yet reliable enough to count.'],
  ['H7', 'Attitude to AI predicts nothing about card use, for either assistant.'],
  ['H8', 'The planned test was flawed; there is still no evidence the illogical card changes later behaviour.'],
  ['H9', 'Being busy does not push people onto the assistant; it saves time only on big jobs.'],
  ['H10', 'Better operators rely more; relying more does not make an operator better.'],
].forEach(([id, t]) => {
  const li = h('li', {}, sl);
  li.innerHTML = `<a href="#${id.toLowerCase()}"><b>${id}</b></a> ${chip(H[id].verdict, VERDICT_CHIP[H[id].verdict])} ${t}`;
});

const defCard = card(main, 'Four terms used everywhere below');
const dl = h('dl', { class: 'defs' }, defCard);
[['primary', 'Primary test'], ['within', 'Within-person'], ['smallsample', 'Small-sample correction'],
 ['adjusted', 'Adjusted p']].forEach(([k, label]) => {
  glNode(h('dt', { text: label }, dl), k);
  h('dd', { html: gv(GLOSS[k].what) + ' ' + gv(GLOSS[k].read) }, dl);
});

/* ───────────────────────── overview ───────────────────────── */
{
  const s = section('glance', 'Overview', 'The ten tests at a glance');
  para(s, 'Each row is one hypothesis. The <b>filled dot</b> is its ' + gl('primary', 'primary test') + '’s '
    + 'p-value after the ' + gl('smallsample', 'small-sample correction') + '; the <b>ring</b> is the same p '
    + 'after ' + gl('adjusted', 'adjusting for testing ten things') + '. Left of the dashed line passes as a '
    + 'single test; nothing gets there once adjusted. Amber = supported on its own terms; red = the planned '
    + 'test turned out to be flawed. <b>Click a row</b> to jump to that hypothesis.');
  pStrip(h('div', { class: 'chart' }, card(s)), R.hypotheses);
}

/* ───────────────────────── one section per hypothesis ───────────────────────── */
// Every section opens with the same card: what was tested, the bar it had to clear, what came out,
// and the verdict. Evidence, extra findings and caveats follow in that order.
function hyp(id) {
  const r = H[id];
  const s = section(id.toLowerCase(), 'Hypothesis ' + id.slice(1), '');
  s.querySelector('h2').innerHTML = r.question + chip(r.verdict, VERDICT_CHIP[r.verdict]);
  const c = card(s);
  const d = h('dl', { class: 'defs' }, c);
  [['Tested', r.test], ['Bar for support', r.bar],
   ['Result', r.result + ` <span class="ns">(p = ${pfmt(r.correctedP)}${r.pNote ? ', ' + r.pNote : ''}; `
     + `adjusted p = ${pfmt(r.adjustedP)})</span>`],
   ['Verdict', `<b>${r.verdictText}</b>`]].forEach(([k, v]) => {
    const dt = h('dt', { text: k }, d);
    if (k === 'Tested') glNode(dt, 'primary');
    h('dd', { html: v }, d);
  });
  return s;
}
const sub = (host, text, level) => h('h3', { html: text + (level ? ' ' + chip(level, level) : '') }, host);
function caveat(host, html) { h('div', { class: 'caveat', html: '<b>Caveat.</b> ' + html }, host); }

/* H1 */
{
  const s = hyp('H1'), T = R.trait, X = R.h1;
  sub(s, 'Evidence');
  tiles(s, [
    { v: String(X.dbic), k: 'ΔBIC, two groups vs one', s: 'needed > 10' },
    { v: X.jaccard.map(v => v.toFixed(2).replace(/^0/, '')).join(' / '), k: 'Jaccard stability of the two groups', s: 'needed ≥ .75 for both' },
    { v: String(X.ari).replace(/^0/, ''), k: 'ARI, session 1 groups vs session 2', s: '0 = chance agreement' },
  ]);
  para(s, `A simulation with no real groups produced a ΔBIC this large ${pct(X.nullDbicShare, 0)} of the time, `
    + `so ${gl('dbic', 'ΔBIC')} alone cannot tell groups from noise on data shaped like this; the ${gl('jaccard', 'Jaccard')} `
    + `and ${gl('ari', 'ARI')} checks are what rule the groups out.`);
  sub(s, 'What else turned up', 'strong');
  para(s, `Instead of types, operators spread along one ${gl('axis', 'principal axis')} — ${pct(T.variance, 0)} of the `
    + 'variation — that is general reliance on the assistants across all three tiers. It holds between '
    + `sessions (ρ = ${T.sessionRho}) and tracks strategic trust (ρ = ${T.trustRho}).`);
  const c = card(s, 'How each behaviour moves with the reliance axis (loading, −1 to +1)');
  barsDiverging(h('div', { class: 'chart' }, c), T.loadings.map(([label, v]) => ({ label, value: v })),
    { zeroLabel: 'unrelated', unit: '', padL: 270, rowH: 30, fmt: v => sgn(v, 2) });
  caveat(s, 'No measured attitude to AI predicts where someone sits on the axis (see H7). We can describe '
    + 'the trait; we have not found what it is made of.');
}

/* H2 */
{
  const s = hyp('H2'), X = R.h2;
  sub(s, 'Evidence');
  tiles(s, [
    { v: '×' + X.A.or.toFixed(2), k: 'A · odds of keeping the plan unmodified, per step up in plan size', s: `95% ×${X.A.lo}–×${X.A.hi}` },
    { v: X.B.b + ' s', k: 'B · checking time per drone, per step up in plan size', s: `95% ${X.B.lo} to ${X.B.hi} s` },
    { v: '×' + X.C.or.toFixed(2), k: 'C · size × checking interaction', s: `95% ×${X.C.lo}–×${X.C.hi}` },
  ]);
  para(s, `All three parts point the predicted way, and before the ${gl('smallsample', 'small-sample correction')} the `
    + `test passed (p = ${pfmt(X.pUncorrected)}). After it, the weakest part sits at p = ${pfmt(H.H2.correctedP)}.`);
  sub(s, 'What else turned up');
  para(s, `The result depends on one definition: counting “kept unmodified” only among plans the operator `
    + `actually looked at reverses part A (×${X.consultedOnlyA}). Checking time is flat at about ${X.checkSecs} s `
    + 'whatever the plan size, so B is mostly a ratio effect. And one person-level result runs the other '
    + `way to the hypothesis: people whose tactical checking is cheap relative to strategic have the bigger `
    + `trust gaps (ρ = ${X.personRho}, p = ${pfmt(X.personP)}), because slow strategic deciders show the largest gaps.`);
  caveat(s, 'Without eye tracking, “checking time” is the gap between clicks, so this mechanism was always '
    + 'going to be hard to establish from logs alone.');
}

/* H3 */
{
  const s = hyp('H3'), rc = R.recovery;
  sub(s, 'Evidence');
  const c = card(s, 'Share of fixable failures that ended in abandonment, by what the operator did');
  barsH(h('div', { class: 'chart' }, c), [
    { label: 'Tried nothing', value: rc.noAttempt.abandoned / rc.noAttempt.n, sub: `${rc.noAttempt.abandoned} of ${rc.noAttempt.n}` },
    { label: 'Pressed Suggest', value: rc.suggest.abandoned / rc.suggest.n, sub: `${rc.suggest.abandoned} of ${rc.suggest.n}` },
    { label: 'Fixed by hand only', value: rc.handOnly.abandoned / rc.handOnly.n, sub: `${rc.handOnly.abandoned} of ${rc.handOnly.n}` },
  ], { max: 1, padL: 130, rowH: 34 });
  para(s, 'This is what the primary test is picking up. Every failure where nothing was tried was '
    + 'abandoned, and all of those sit in the “no Suggest” group. Among failures where the operator tried '
    + 'something, Suggest and hand-fixing do about equally well (odds ratio 0.94).');
  sub(s, 'What else turned up — when Suggest itself failed');
  const press = Object.values(rc.presses).reduce((a, b) => a + b, 0);
  const c2 = card(s, `What each of the ${press} Suggest presses in recovery produced`);
  barsH(h('div', { class: 'chart' }, c2), [
    { label: 'A working fix', value: rc.presses.solved, sub: 'presses' },
    { label: 'Failed', value: rc.presses.failed, sub: 'presses' },
    { label: 'Nothing to do', value: rc.presses.noop, sub: 'presses (plan already covered)' },
    { label: 'Partial', value: rc.presses.partial, sub: 'presses' },
  ], { padL: 120, rowH: 30, fmt: v => String(v) });
  para(s, `${rc.blindSpot} presses (${rc.blindSpotPeople} people, ${rc.blindSpotEpisodes} failures) hit Suggest’s genuine blind spot — `
    + `it ignores drones busy on other tasks, so it answered “No workable plan” when chaining a busy drone would have fixed it. `
    + `Only ${rc.blindSpotRecovered} of those ${rc.blindSpotEpisodes} failures were then fixed by hand; the rest were abandoned. `
    + `Only ${rc.abandonAfterWorkingPlan} of the ${rc.suggestThenAbandon} cases where someone abandoned right after pressing Suggest `
    + 'had a complete working plan in front of them.');
  note(s, '<b>Corrected 2026-10-07.</b> The first version of this page said the blind spot was rare (11 presses, 8 people) and '
    + 'that 9 of the 11 suggest-then-abandon cases had a working plan. The rebuild of what Suggest could see missed tasks cut '
    + 'short by abandonment, so their drones looked free. Three operators reading “No workable plan” aloud seconds after '
    + 'presses scored as “solved” exposed it. The pre-registered H3 test does not depend on this rebuild and is unchanged.');
  caveat(s, `Observational: operators chose when to try. Passes its own test, just misses the ten-test bar `
    + `(adjusted p = ${pfmt(H.H3.adjustedP)}). The design lever it points at is “prompt an attempt”, not “prefer Suggest”.`);
}

/* H4 */
{
  const s = hyp('H4');
  sub(s, 'Evidence');
  para(s, 'Manual work does not explain the shortfall because the shortfall is mostly not real. Split by '
    + 'which pair of games people played, the whole gap sits in one pairing. On that pairing’s Tactical '
    + 'game the near-perfect operator’s run suffered 12 drone failures where participants averaged 4.5, '
    + 'so 7 of 17 participants beat it — which happens on no other game.');
  const c = card(s, 'Share of the near-perfect operator’s score reached, by game pairing');
  legend(c, [{ label: 'Strategic Heavy', color: css('--s-strat') }, { label: 'Tactical Heavy', color: css('--s-tac') }]);
  barsGrouped(h('div', { class: 'chart' }, c), R.benchmark.map(b => b.label + ` (n = ${b.n})`),
    [{ label: 'Strategic Heavy', color: css('--s-strat'), values: R.benchmark.map(b => b.strategic) },
     { label: 'Tactical Heavy', color: css('--s-tac'), values: R.benchmark.map(b => b.tactical) }],
    { fmt: v => pct(v, 0), height: 220 });
  sub(s, 'What else turned up');
  const U = R.unallocated;
  tiles(s, [
    { v: String(U.strategic), k: 'missions never allocated per Strategic Heavy session', s: `${U.strategicPts} points left on the table` },
    { v: String(U.tactical), k: 'missions never allocated per Tactical Heavy session', s: `${U.tacticalPts} points` },
  ]);
  para(s, 'What Strategic Heavy genuinely loses is missions nobody got to. Trimming drones on small missions '
    + 'did not measurably help later missions.');
  caveat(s, 'P01 and P02 ran on early builds where every task was worth half as many points; they are '
    + 'kept in the test and handled in its robustness checks.');
}

/* H5 */
{
  const s = hyp('H5'), X = R.h5;
  sub(s, 'Evidence');
  para(s, `The correlation is ρ = ${X.rho} (95% ${X.lo} to ${X.hi}): no relationship. Its premise fails too — `
    + `card missions do not fail more often than manual ones (odds ratio ${X.cardVsManualFailOr}).`);
  sub(s, 'What else turned up — the drop follows scenario order', 'moderate');
  para(s, 'Split by the order people played the scenarios, almost all of the drop sits with those who '
    + 'played Strategic Heavy second. Strategic Heavy is the many-small-missions scenario, where the cards '
    + 'help least and the illogical card is concentrated. So strategic trust looks like a rating of the '
    + 'scenario just played rather than a decline over time.');
  const c = card(s, 'Change in strategic trust from session 1 to session 2 (1–7 scale)');
  barsDiverging(h('div', { class: 'chart' }, c), R.trustOrder.map(o => ({
    label: o.label, value: o.mean, sub: `fell for ${o.fell} of ${o.n}` })),
    { zeroLabel: 'no change', unit: ' points', padL: 170, rowH: 38, fmt: v => sgn(v, 2) });
  caveat(s, 'Exploratory: the order split was found after the primary test, not planned.');
}

/* H6 */
{
  const s = hyp('H6'), P = R.preference;
  sub(s, 'Evidence');
  const c = card(s, 'Stated preference in the second coding');
  barsH(h('div', { class: 'chart' }, c), [
    { label: 'Tactical', value: P.tactical, sub: 'participants' },
    { label: 'Strategic', value: P.strategic, sub: 'participants' },
  ], { padL: 90, rowH: 34, fmt: v => String(v) });
  para(s, `The direction is clear and holds in both codings (${P.tacticalNoBorderline} vs ${P.strategicNoBorderline} `
    + `without the five least certain codes; the original coding had ${P.originalTactical} vs ${P.originalStrategic}). `
    + `It fails on reliability: the two codings agree only at ${gl('kappa', 'κ')} = ${P.kappa} (${P.kappaBinary} on a simple `
    + 'yes/no “prefers tactical”), mostly because the coders defined a “conditional” preference differently.');
  sub(s, 'What else turned up');
  para(s, 'People who say they hand big missions to the assistant really do consult it more on big plans: '
    + 'what they said matches what they did.');
  caveat(s, 'Ruling recorded during the round: “uses the assistant more on complex missions” counts as a '
    + 'conditional preference. It was made after agreement was measured.');
}

/* H7 */
{
  const s = hyp('H7'), X = R.h7;
  sub(s, 'Evidence');
  tiles(s, [
    { v: '×' + X.or.toFixed(2), k: 'odds of taking a card per standard deviation of attitude to AI', s: `95% ×${X.lo}–×${X.hi}` },
    { v: '×' + X.detectable.toFixed(1), k: `smallest effect the test could have caught`, s: 'per standard deviation, 80% power' },
  ]);
  para(s, 'With almost no AI sceptics in the sample (the average is 8 out of 10), only a very large effect '
    + 'could have shown, and there is no sign of one.');
  sub(s, 'What else turned up');
  para(s, `Attitude to AI does not matter more for one assistant than the other (comparisons p = ${pfmt(X.steigerPRange[0])} `
    + `to ${pfmt(X.steigerPRange[1])}; a difference would have had to be about ${X.detectableRhoDiff} in correlation to `
    + 'show). It does not predict the change in strategic trust either.');
}

/* H8 */
{
  const s = hyp('H8'), X = R.h8;
  sub(s, 'Evidence — why the test was flawed');
  tiles(s, [
    { v: '×' + X.or.toFixed(2), k: 'card odds after vs before “noticing”, as tested', s: `${X.n} decisions, ${X.people} people` },
    { v: '×' + X.nullOr.toFixed(2), k: 'the same test on simulated data with no real change', s: 'what the test produces by itself' },
    { v: '×' + X.placeboOr.toFixed(2), k: 'the same test with a fake marker built on normal cards', s: 'placebo' },
  ]);
  para(s, 'The plan defined “noticed” as the first time someone rejected an illogical card. That definition '
    + `guarantees the decisions before it lean towards card takes (${X.beforeCardTakes} of ${X.beforeN}), so card use `
    + `was bound to look like it fell afterwards. Judged against the ${gl('calibrated', 'null simulation')} instead of `
    + `against zero, the drop is p = ${pfmt(X.calibratedP)}, about ${Math.abs(X.biasCorrectedPP)} percentage points once the `
    + 'built-in bias is removed.');
  caveat(s, 'This was an error in the plan, not the analysis. The conclusion agrees with four earlier tests: '
    + 'no detectable lasting effect of the illogical card.');
}

/* H9 */
{
  const s = hyp('H9'), L = R.load;
  sub(s, 'Evidence');
  para(s, `One more mission waiting in the queue changed the ${gl('odds', 'odds')} of taking a card by ×${L.or.toFixed(2)} `
    + `(95% ×${L.lo.toFixed(2)} to ×${L.hi.toFixed(2)}). The test could have caught an effect as small as `
    + `×${L.detectable.toFixed(2)} (${gl('detectable', 'detectable effect')}), and about ${L.variants} variants agree — including `
    + 'one using scheduled arrivals, which an operator cannot inflate by being slow. A well-powered null.');
  sub(s, 'What else turned up — speed', 'strong');
  para(s, 'Many debriefs value the assistant for being faster rather than better. The logs bear that out, '
    + 'but only where the job is big:');
  tiles(s, [
    { v: L.cardSavesNetS + ' s', k: 'saved by taking a card on three-type missions', s: 'net of the forced reveal; none on single-type' },
    { v: L.suggestFasterPct + '%', k: 'faster to keep a Suggest plan than build one', s: 'mostly on large plans' },
    { v: '×' + L.parallelX, k: 'more likely to start the next mission while a plan fills in', s: 'with Suggest' },
    { v: L.handBuiltLaterS + ' s', k: 'later finish for hand-built plans', s: 'realised, not projected' },
  ]);
  quote(s, 'P30/agent_comparison/1540');
  caveat(s, 'It measures load at the moment of decision. Overload that shows up as missions left waiting '
    + 'before the panel is even opened would not appear here; the in-session narration is the next place to look.');
}

/* H10 */
{
  const s = hyp('H10'), P = R.payoff, X = R.h10;
  sub(s, 'Evidence');
  para(s, `The test could have caught an odds ratio of ${X.detectableLo} or below, or ${X.detectableHi} or above, `
    + 'so a large effect of taking the card on a mission’s fate is ruled out.');
  sub(s, 'What else turned up — character, not cause', 'moderate');
  tiles(s, [
    { v: '×' + P.betweenOR.toFixed(2), k: 'odds of a mission completing for someone who always takes the card vs someone who never does', s: `between people · p = ${pfmt(P.betweenP)}` },
    { v: '×' + P.withinOR.toFixed(2), k: 'odds of a mission completing when the same person took a card vs went manual', s: `within person · p = ${pfmt(P.withinP)}` },
  ]);
  para(s, `Comparing ${gl('between', 'between people')}, those who lean on the assistants complete more; comparing each `
    + `person ${gl('within', 'with themselves')}, card missions do no better. Keeping the tactical plan unmodified also `
    + 'predicts a better score between people but not within. Reliance looks like a marker of a capable '
    + 'operator rather than the cause of their success.');
}
