<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 2x2 grid of boxes -->
  <rect x="12" y="6"  width="18" height="14" rx="2" fill="#e85c5c" stroke="#c83a3a" stroke-width="1"/>
  <rect x="34" y="6"  width="18" height="14" rx="2" fill="#e85c5c" stroke="#c83a3a" stroke-width="1"/>
  <rect x="12" y="24" width="18" height="14" rx="2" fill="#e85c5c" stroke="#c83a3a" stroke-width="1"/>
  <rect x="34" y="24" width="18" height="14" rx="2" fill="#e85c5c" stroke="#c83a3a" stroke-width="1"/>
  <!-- cross marks -->
  <line x1="12" y1="13" x2="30" y2="13" stroke="#c83a3a" stroke-width="0.8"/>
  <line x1="21" y1="6"  x2="21" y2="20" stroke="#c83a3a" stroke-width="0.8"/>
  <line x1="34" y1="13" x2="52" y2="13" stroke="#c83a3a" stroke-width="0.8"/>
  <line x1="43" y1="6"  x2="43" y2="20" stroke="#c83a3a" stroke-width="0.8"/>
  <line x1="12" y1="31" x2="30" y2="31" stroke="#c83a3a" stroke-width="0.8"/>
  <line x1="21" y1="24" x2="21" y2="38" stroke="#c83a3a" stroke-width="0.8"/>
  <line x1="34" y1="31" x2="52" y2="31" stroke="#c83a3a" stroke-width="0.8"/>
  <line x1="43" y1="24" x2="43" y2="38" stroke="#c83a3a" stroke-width="0.8"/>
  <!-- drop arrow -->
  <line x1="32" y1="42" x2="32" y2="56" stroke="#e85c5c" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="24,50 32,58 40,50" fill="none" stroke="#e85c5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
