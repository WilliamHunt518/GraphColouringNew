<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- radar circles -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#3ec97c" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#3ec97c" stroke-width="0.8" opacity="0.5"/>
  <circle cx="32" cy="32" r="8"  fill="none" stroke="#3ec97c" stroke-width="0.8" opacity="0.5"/>
  <!-- crosshair -->
  <line x1="32" y1="4"  x2="32" y2="60" stroke="#3ec97c" stroke-width="0.8" opacity="0.4"/>
  <line x1="4"  y1="32" x2="60" y2="32" stroke="#3ec97c" stroke-width="0.8" opacity="0.4"/>
  <!-- sweep line (~40deg) -->
  <line x1="32" y1="32" x2="53" y2="11" stroke="#3ec97c" stroke-width="2" stroke-linecap="round"/>
  <!-- sweep wedge -->
  <path d="M32,32 L53,11 A28,28 0 0,1 60,32 Z" fill="#3ec97c" opacity="0.15"/>
  <!-- blip -->
  <circle cx="49" cy="16" r="3" fill="#3ec97c" opacity="0.9"/>
</svg>
