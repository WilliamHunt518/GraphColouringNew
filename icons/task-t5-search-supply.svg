<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- magnifying glass, left half -->
  <circle cx="20" cy="26" r="14" fill="none" stroke="#4fa8e8" stroke-width="2.2"/>
  <circle cx="20" cy="26" r="10" fill="#4fa8e8" opacity="0.08"/>
  <line x1="20" y1="14" x2="20" y2="38" stroke="#4fa8e8" stroke-width="1" opacity="0.45"/>
  <line x1="8"  y1="26" x2="32" y2="26" stroke="#4fa8e8" stroke-width="1" opacity="0.45"/>
  <line x1="30" y1="37" x2="37" y2="45" stroke="#4fa8e8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- plus sign, shifted right to make room -->
  <line x1="38" y1="26" x2="44" y2="26" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="41" y1="23" x2="41" y2="29" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <!-- box ~30% bigger: was 14x14, now 18x18, anchored right -->
  <rect x="46" y="10" width="18" height="18" rx="2" fill="#e85c5c" stroke="#c83a3a" stroke-width="1"/>
  <line x1="46" y1="19" x2="64" y2="19" stroke="#c83a3a" stroke-width="0.9"/>
  <line x1="55" y1="10" x2="55" y2="28" stroke="#c83a3a" stroke-width="0.9"/>
  <!-- drop arrow, proportionally longer -->
  <line x1="55" y1="30" x2="55" y2="48" stroke="#e85c5c" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="48,42 55,50 62,42" fill="none" stroke="#e85c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
