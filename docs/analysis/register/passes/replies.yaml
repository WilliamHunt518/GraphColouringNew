f-manual-cards:
  2: 'Looked at the open-ended answers behind the four codes (C07–C10), plus the complaints about the cards (C12).
    They fit the anchoring story but cannot prove it. Nobody describes building an allocation from scratch while
    ignoring the cards. Everyone who talks about manual allocation talks about it relative to the cards. C09 (4
    people) treat a card as a first draft or "starting place" to tweak; C08 (6) talk of a figure "between" the two
    cards or a toned-down version of one; and one C10 person describes reading the drones needed, then what the
    card deploys, and "working from that". That is the adjust-from-the-card behaviour the logs show (+0.4 to +0.5
    manual drones per card drone, and only for people who saw the cards). Two cautions. Some accounts run the other
    way: P03 worked the number out first, then checked it against the card. And anchoring is by nature not something
    people notice in themselves, so self-report supports "cards as reference points" rather than anchoring itself.
    The trimming direction has its own clear explanation in the words: many people (C12, 12 people) say the cards
    send too many drones or add types the mission does not need, which is the spare the dot chart shows being dropped.
    No new coding was needed; if you want this in the paper, it would be one sentence linking C08/C09 to the anchoring
    test.'
  3: 'Agreed: a marginal finding, kept for a brief mention. The only changes are clearer axis titles and captions.'
