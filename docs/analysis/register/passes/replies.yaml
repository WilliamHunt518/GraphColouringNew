f-flaw-odd:
  2: 'Done both. (1) <b>All missions is now the default</b> on every chart that was three-type only (event study,
    Nth-decision dots, per-person slopes, spoken bars), with buttons for three-type only and its complement (one-
    and two-type missions). The sidelined dominated-card chart stays three-type, because that comparison only means
    something where the card is not illogical. (2) <b>The dip, taken apart</b> (new sections <i>What the dip is</i>,
    <i>Card use through the session</i> and <i>Card use by decision number</i>). In short: it is an early-session
    drop in the noticers (session 1, decisions 3–5, roughly minutes 1–4). It appears just as strongly in people
    who had not yet seen an illogical card, it comes from looking at the cards and declining them, it is not explained
    by mission type, load, reserve or game, and it is invisible in the pooled curve because non-noticers lean on
    the cards more at the same moment. The aligned event study''s ''1st–3rd after'' dip is really two moments mixed
    together: session-1 decisions 3–6 for strategic-heavy-first players, and the start of session 2 for most tactical-heavy-first
    players (whose first illogical card came then). I could not find what triggers it, and I have said so.'
  3: 'Worked through. The charts are cleaned up: every y axis now names its quantity (“card taken, % of decisions”),
    the event study gained the pre-card steps, card use over time shows each group plus everyone, decision number
    runs session 1 into session 2 on one axis, the spoken chart is grouped bars only, and the Nth-decision section
    is back on its pass-2 chart. One new check affects the story a little: your “recover in session 1, less carry-over
    to session 2” reading is half supported (the recovery is there; a group difference at the session break is not),
    and I added that as one sentence to the headline. Nothing else changes.'
