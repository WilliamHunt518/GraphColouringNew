f-flaw-odd#event:
  2: 'Now has a <b>Grouping</b> toggle (every step / every pair / groups of three), with intervals on every point,
    and the missions toggle defaults to all missions. Pairs is the default: every step is there, but its intervals
    span about ±30 points per dot; groups of three give the same picture as before.'
  3: '<b>Yes, your guess is right.</b> “Expected” leans mostly on each person''s own take rate on all their <i>other</i>
    decisions (that is why the model ranks takes so well). Noticers'' own rate is 56% against 70%, and it is low
    because about 80% of a noticer''s decisions come at or after the card, where they took cards 50% of the time
    against 72% (p = .007). Before the card the two groups were alike (68% vs 63%, p = .71). Set the own-rate term
    to everyone''s average and the two groups'' expected values are the same (after the card 68% vs 69%): the missions
    in front of them do not differ. One consequence worth knowing: because the own rate already contains the after-card
    drop, the <i>adjusted</i> change (−14) understates the raw one (−23: 75% → 52%), so the adjusted numbers are
    the cautious version. <b>Pre-card steps:</b> added as the <i>Before the card</i> toggle (plus a matched version).
    Honestly it is close to useless: only 8 people per group have three decisions before the card (all tactical-heavy-first
    players), so −2 and −3 are 8 decisions each with intervals of about ±35 points. The one thing it shows is that
    the step just before the card (−1) is lower in <i>both</i> groups (64% and 56%; −13 points [−40, +13] against
    −3/−2), so it is not something only noticers do. The matched view shows the 8 noticers dropping from ~85% to
    ~40% and staying there, but 6 of those 8 met the card at the start of session 2, so it mixes the card with the
    session-2 low (section 3). The default stays all missions, pairs, observed, with one pooled ''before'' point.'
