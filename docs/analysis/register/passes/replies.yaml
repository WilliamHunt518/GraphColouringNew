    in its sidelined panel.
f-triage#choice:
  2: 'Done: the chart now has a p-value on every estimate (right-hand column, coloured when below .10) and a third
    block that tests directly whether each pull changes between short and long queues. Intervals and p-values come
    from resampling whole people 1000 times. The oldest-first pull is clearly significant at both queue lengths
    (p ≤ .004), and the preference for larger missions is significant in the Strategic Heavy games (p = .014 short,
    .026 long). No pull differs significantly between short and long queues (all p ≥ .41 in the Strategic Heavy
    games; size comes closest across all four games, p = .076). So "priorities don''t change under pressure" now
    has a test behind it, with the caveat that 95 long-queue decisions could only have detected a large change.'
  3: 'Kept as numbers. Axis check on its chart: the x-axis is now titled "odds ratio of being opened, log scale
    (bottom block: long ÷ short)", and the end labels no longer overlap.'
