    card. Pooled, the dip does not show; split, it does, in the noticers only, and it shows before the card too.'
  3: '<b>Done</b>: session 1 then session 2 on one axis, a dashed line at the break, and the two sessions'' lines
    are not joined (it is now the default view). <b>Your reading is half right.</b> The session-1 recovery is there:
    noticers climb from 48% in decisions 3–5 to 66% over the rest of session 1 (+24 points per person, 8 of 12 rose),
    while never-said people drift down. And noticers do start session 2 lower (49%) than they ended session 1 (64%).
    But “less carrying over” needs that drop to be bigger for noticers than for never-said people, who also start
    session 2 a little lower (76% → 69%); the difference at the break is −6 points [−32, +20], which cannot tell
    the two apart. Allowing for the mission mix (session 2 is the other game) shrinks the noticers'' own drop to
    −9 points, and 6 of the 15 noticers first met the illogical card at the start of session 2, so their session-2
    start is partly the card itself. One wording point: this is card <i>use</i>; we do not measure trust at these
    moments, so I would write “use recovers” rather than “trust recovers”.'
