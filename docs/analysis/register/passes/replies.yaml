  3: Thanks — unchanged.
f-size-decides#parallel:
  2: 'Done as stacked bars per route, with a toggle by mission size, plus a strip of the within-person difference
    per phase. "Before the first action" is its own segment, so idle time can be set aside. It shows a plan is not
    slower to make with Suggest: about 3 s quicker to build, though it sits about 3 s longer before confirmation,
    which is where the other missions get started. Suggest plans are also not slower to complete: about 11 s faster
    to carry out (p = .006), about 15 s faster overall. So no, it does not undermine the Tactical Assistant; if
    anything the reverse. The scheduler''s own projections, available for every plan, say the same (hand-built plans
    projected +10 s vs the assistant''s). Caveat: "carrying out" exists only for the 315 missions that finished
    cleanly, and operators chose the route. The old time-matched chart is kept under its key.'
  3: 'Done: one chart with small, mid, large, all missions (raw) and all missions (size-standardised) side by side,
    hand vs Suggest in each, and a toggle that leaves out the time before the first action. Your check was right
    to make, and the answer is a mix effect (Simpson''s paradox). Hand-built plans are mostly small missions (78%,
    against 42% of Suggest plans), and small missions are quick either way, so the hand-built average is pulled
    down. Given the same mix of sizes, hand-built plans take 109 s and Suggest plans 96 s. The same-person comparison
    with size held gives Suggest −15 s; drop size from that model and the gap vanishes (−0.1 s), which pins the
    reversal on size. Caveat: only 6 large hand-built plans finished cleanly. Phases now share one definition with
    section 4.'
f-size-decides#parallel-specs:
  2: 'Fair: it is a robustness strip for the 4.8× in the section above, not a new result. Each row asks the same
    question: for the same person, is a Suggest plan more likely than a hand-built one to have another mission''s
    strategic panel opened while it is being planned? Each row changes one modelling choice (what is held fixed,
    which plans count, what counts as "other work"). Every row sits right of the line (×2.4 to ×6.4), so the parallel-work
    result does not hang on any one choice. That is all it says; it is sidelined as an archive.'
f-size-decides#people:
  2: 'Redrawn as bars with 95% whiskers, with four size bands instead of two. One toggle shows each person against
    their own average (default), the other a plain average of people. It agrees with the model: 22 of 33 rise on
    each tier, 4 and 2 fall.'
f-size-decides#slow:
  2: 'Redrawn with no dots: two bars per measure (C06 vs everyone else), each with a 95% whisker. You read it right:
    nothing here is significant. The lowest p is .055 (deciding before the cards load), none survives allowing for
    ten comparisons, and every pair of whiskers overlaps. The text now says plainly that it is a direction in six
    people, not a finding.'
f-size-decides#speed:
  2: 'Checked: the whisker exists, it really is that consistent. Deciding a one-type mission by hand before the
    cards load takes a median 6.4 s, with a 95% interval of 5.7–7.0 s. On the old chart that interval was about
    as tall as the dot. The middle half of those 50 decisions fall between 5.0 and 7.6 s. They come from only 15
    people, the ones who habitually do this, which is part of why it is tight. Redrawn as bars so the whiskers show
    clearly.'
  3: Rebuilt as stacked bars by size, with the time before the first action split out and a toggle to leave it out
    ("everything", "without idle time", "from the first click only"). First action = the first click on that decision
    (card highlighted or manual count changed; Suggest pressed or drone dragged). It shifts the story a little.
    Without idle time the strategic card is never slower (it ties with a manual build on one-type missions and is
    44% quicker on three-type ones). The tactical planner time is the same with or without Suggest once idle time
    is out, so on that tier the saving is in carrying out (section 5). The same phase definition is used in section
    5, so the two charts agree.
f-size-decides#speed-model:
  2: Moved to the sidelined panel, as you asked — kept, not a focus. The estimates stay here so the number can be
    quoted if needed.
f-size-decides#strategic:
  2: Moved to the sidelined panel, as you asked — kept, not a focus.
f-size-decides#strategic-steps:
  2: Redrawn as bars, and the 3 to 5 step is explained in a new section just below. In short, it is not size. Every
    all-Fast (one-type) mission of a given size is the same kind of job, and the 5-drone bar is seven specific missions,
    six of which arrived mid-session with 3 to 4 others waiting. The one that arrived at the start got the card
    69% of the time, more than any 3-drone mission. Comparing each person with themselves, with game and session
    fixed, 5-drone missions are not distinguishable from 3-drone ones (odds ×0.78, p = .38).
  3: Moved to the sidelined panel (your Archive pick); the first chart carries it.
f-size-decides#tactical:
  2: 'Yes, the link is real: on every size measure, a mission allocated from a card gets Suggest at about twice
    the odds of one the same person allocated by hand, and people who take more cards press Suggest more. The "collapse"
    at high size is mostly a ceiling effect: both routes approach 100%, and the narrowing is not distinguishable
    from a constant gap on any measure (p = .28 to .98). The toggle gives five x axes. Your doubt about plan size
    was right. It multiplies the team by tasks, and the team is the operator''s own strategic choice (a card commits
    ~11% more drones for the same mission), so it partly builds the strategic route into the x axis. <b>Drones needed</b>
    is the most defensible measure (fixed by the mission, what the badges show, and the steepest: ×2.9 per doubling).
    Tasks is a good second.'
  3: 'Yes, found. P10 says it most clearly: in the think-aloud (session 1, about 5½ and 13 minutes into the recording)
    they say that after taking the Aggressive card, anything but Suggest makes no sense, because there is only one
    sensible assignment; in the debrief (about 0:27:50) they agree when you sum it up as "the aggressive strategic
    agent prompts you to use Suggest". That last line was the interviewer''s wording, so the think-aloud is the
    stronger evidence. P05 and P30 also narrate "card, then Suggest" on the same mission, more in passing. No existing
    code fits (closest: C05, which carries P10''s neighbouring line about pressing Suggest and moving on), so I
    added none; a new code, "one tier''s hand-over carries to the next", would hold P10, P05 and P30. The behavioural
    number (×2.10) is now in the text. One check of P10''s reasoning: across everyone, Suggest is no more likely
    after the Aggressive card than after the Conservative one (×0.88, p = .72), so it is card vs hand, not which
    card.'
f-tier-trust:
  2: Kept as a later, fairly significant finding. Own-failures and stated are sidelined as one-line mentions; the
    three requested changes (game split, high-n checking view, stated-vs-revealed answer) are in their sections.
  3: 'Polished as asked: the checking chart is rebinned with no gaps, the "where" chart leads with the two views
    you liked, and your attention question is answered with a new check (sidelined section "Is the tactical plan
    given less attention in Strategic Heavy sessions?"). Every axis in this finding now says what it measures.'
f-tier-trust#checking:
  2: 'Done, as a toggle on the same chart: <b>Well-filled sizes only (3, 6–7, 8+ drones)</b>, now the default, and
    <b>All sizes</b>. The well-filled view keeps 518 of 630 plans (the 112 plans of 1–2, 4 or 5 drones are dropped)
    and shows n under every size. The story is the same and a little cleaner: consulting rises from 62% to 86% and
    keeping from 62% to 80% between 3-drone and 8+-drone plans, while checking time stays near 3 s. I refitted the
    models on the subset; they barely change (kept OR 1.82 per SD, consulted 2.71, checking time +0.44 s, ns). The
    caption says which plans are shown.'
  3: 'Done. The "well-filled sizes" toggle is gone; the chart now uses six contiguous bins (≤3, 4–5, 6, 7, 8–9,
    10+ drones) with no gaps and every plan included. Each bin has at least 72 plans (at least 62 with a checking
    time), which keeps the 95% intervals on each rate to roughly ±10 points. Your "6–8" would have overlapped with
    "4–6", and 6 and 7 drones each have plenty of plans on their own (135 and 81), so they get a bin each. The story
    is unchanged: Suggest and keeping rise from 63% to 93% and 86%, and checking time stays at about 2–4 s at every
    size. The per-SD models were always on all 630 plans, so those numbers do not change. Both panels now have y-axis
    titles (% of tactical plans; seconds checking after the reveal).'
f-tier-trust#gap:
  3: Kept with its graph for now; the numbers are in the bullet list if you later go numbers-only.
f-tier-trust#own-failures:
  2: Moved to the sidelined panel, as you asked — kept, not a focus. A nod in the text.
f-tier-trust#stated:
  2: 'Moved to the sidelined panel, as you asked — kept, not a focus. One line in the text: what they wrote matched
    what they rated.'
f-tier-trust#stated-revealed:
  2: '<b>No, not for that number.</b> ρ = .47 [.10, .73], p = .006 is a moderate, clearly positive correlation:
    the people who rate the Tactical Assistant above the Strategic one are, more often than not, the people who
    lean on it more. So between people, stated and revealed preference agree in <i>direction and order</i>. Where
    they agree poorly is everywhere else, and that is the interesting part: (1) <b>size</b>: stated trust favours
    tactical strongly (26 of 33) but use only by +8 points (CI includes 0), and 9 people rate tactical higher while
    using the cards more; (2) <b>change</b>: when a person''s trust goes up or down between sessions, their use
    does not follow (ρ = .16 strategic, .13 tactical); (3) <b>lead</b>: session-1 trust does not predict how use
    changes next (ρ = .07). Tactical trust against keeping the plan, on its own, is also weak (ρ = .31, p = .08).
    So the paper can say "stated and revealed preference agree on who prefers which, but stated trust does not track
    or forecast changes in use", which is the low-correlation picture you saw in the strip below (most of those
    rows are the change and lead ones).'
  3: 'Agreed: numbers only (ρ = .47, p = .006, but poor agreement in size and in change).'
f-tier-trust#trust-lead-strip:
  3: Kept. If it goes in, the one number is the significant one in the list below.
f-tier-trust#where:
  2: 'Done: the game-1/game-2 rows are merged into Strategic Heavy vs Tactical Heavy (new chart with the same three
    views: item, scenario, session). Strategic Heavy +1.13 vs Tactical Heavy +0.52. Because everyone played one
    of each, I also tested it within person: the difference is borderline on its own (p = .054 paired t, .038 Wilcoxon),
    but holding session order fixed both effects stand (Strategic Heavy +0.64, p = .019; second session +0.93, p
    &lt; .001).'
  3: '<b>Not clearly.</b> I read "the first two" as the first two views of the chart (questionnaire items, scenario);
    those are now the main buttons, with session order kept as a third "Also" button. If you meant the first two
    numbers (session and scenario), both are still one click away. On attention, two things. First, the extra gap
    in Strategic Heavy is mostly <i>strategic</i> trust being lower there (−0.46), not tactical trust being higher
    (+0.15, p = .25), so there is little tactical rise to explain. Second, I checked attention to the tactical plan
    directly (new sidelined section). Raw, Strategic Heavy plans do get less: less Suggest, fewer edits, shorter
    planner time. But those plans are much smaller (5.3 vs 8.1 drones). Compared like for like (same plan size and
    session order), planner time is ×0.88 [0.72, 1.07] and checking time ×0.91 [0.70, 1.17], both slightly lower
    but not distinguishable from no difference; editing is the same (×1.05). The one clear difference goes the other
    way from "less attention": on same-size plans people press Suggest <i>more</i> in Strategic Heavy (odds ×1.50
    [1.03, 2.18], p = .036). And people whose planner time drops more in Strategic Heavy do not clearly trust tactical
    more there (ρ = −.24 [−.56, .12], p = .19, n = 31). So "less attention" may be a small part of it, but the data
    do not show it; I would not put it in the paper as an explanation, at most as a speculation.'
f-triage:
  2: 'Sidelined as a whole (your verdict was Prune, "keep it, but not big enough to read much into"). '
