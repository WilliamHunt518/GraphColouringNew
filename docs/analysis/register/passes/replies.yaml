f-practice#speed:
  2: 'Checked, and partly yes. On the strategic tier the speed-up mostly does not carry over: raw medians go 11.6
    → 6.9 s in session 1, then start again at 10.6 s in session 2. The model keeps about half the gain, but the
    start of session 2 is slower than the end of session 1 (+31%, p = .053). On the tactical tier there is no clear
    reset: session 2 starts where session 1 ended (+2%, p = .92) and speeds up again. So "a speed-up within the
    session that does not carry over" is fair for the strategic tier. For the tactical tier say "both sessions speed
    up, and session 2 ends fastest". The bar chart shows this; the minute-by-minute chart is kept under its key.'
  3: 'Yes on the strategic tier, not quite on the tactical one. Strategic: a clear within-session speed-up (−39%
    by the end of session 1, p < .001) that is mostly gone at the start of session 2 (+31% slower than the end of
    session 1, p = .053). That is the warm-up. What is kept is about a fifth (session 2 start −20% vs session 1
    start, p = .07; averaged over the whole session, session 2 is −19% [−30, −6]). So the learning effect is real
    but smaller, not absent. Tactical: the reverse shape. The speed-up within session 1 is weaker and uncertain
    (−24%, p = .09), but it carries over (session 2 starts where session 1 ended, +2%, p = .92) and session 2 is
    −24% [−36, −9] overall, which looks more like learning than warm-up. One caution for both: the start of a session
    is also the start of a game (first missions, short queue), though the speed-up survives holding the queue fixed.'
f-size-decides:
  2: 'Agreed it needed another pass. What changed: (1) the dip at 5 drones on the strategic tier is seven particular
    missions and their timing, not a size effect (new section "Why the 5-drone missions dip"); (2) the tactical
    tier now uses <b>drones needed</b> as its main measure, because plan size partly contains the operator''s own
    strategic choice; (3) the strategic and tactical hand-overs are linked (a card-allocated mission gets Suggest
    at about twice the odds), and the "collapse" at big sizes is both rates reaching the ceiling, not a reliable
    change in the link; (4) the checks you liked are now two rows in the models chart, including a new one for every
    operator having played the same missions; (5) splitting a tactical plan into phases shows Suggest does not cost
    time. The core claim is unchanged and a little firmer.'
  3: 'Thanks. The four section notes are answered in their sections: the 5-drone dip checked against the arrival
    times, the qualitative evidence for the strategic-to-tactical link found (P10 says it plainly, P05 and P30 in
    passing), the speed section rebuilt as stacked bars with the idle time split out, and the parallel-work chart
    rebuilt as one chart with every size group. The "manual faster overall but slower in every size group" puzzle
    is a mix effect: hand-built plans are mostly small missions.'
f-size-decides#artefacts:
