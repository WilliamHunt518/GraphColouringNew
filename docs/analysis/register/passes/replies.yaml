    (×1.46) plus a new shared-missions check (×1.60 strategic, ×2.89 tactical). The conditional-logit row stays
    here.'
f-size-decides#both:
  2: Redrawn as side-by-side bars with 95% interval whiskers; hover any bar for n. Same numbers as before.
  3: 'Yes, mostly. Six of the seven 5-drone missions arrived in bursts in the Strategic Heavy games (two 11 s apart
    in a run of seven missions in one minute in one game; four within 80 s in the other), so they were decided with
    3–4 others waiting, quickly and often before the cards loaded. Strictly it is the 5-drone bar that is low, rather
    than the first bar being high. Bursts are likely only part of the story: a 3-drone and a 6-drone mission in
    the same bursts got the card 67% and 64% of the time, and holding the queue fixed barely moves the 5-vs-3 comparison.
    Written into the text with the numbers.'
