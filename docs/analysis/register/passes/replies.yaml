f-personal-style:
  2: 'Agreed, and the page now follows your order: <b>the habits</b> (new first section, what each is and how it
    is counted, with its spread over the 66 sessions) → <b>(2)</b> where each person''s own session ranks → <b>(4)</b>
    who vs what → <b>(6)</b> how far each habit holds → <b>(8)</b> the axis, as numbers for one sentence (it is
    the bridge that says the biggest single difference between people is "leans on the assistants", seen most clearly
    in the card; I would keep it as text, not a figure) → <b>(9)</b> the two tiers → <b>(11)</b> no types (rewritten)
    → <b>(12)</b> nothing beforehand predicts it. One correction to the story at (9), from a new check: between
    people the two tiers are <i>weakly</i> linked (ρ = .37, p = .033; .33, p = .058 once game is adjusted), not
    unrelated; and within a person they move <i>together</i> from one session to the next (ρ = .51, p = .002: a
    session where someone takes more cards is a session where they also press Suggest more). So the honest sentence
    is "how much someone relies on one assistant tells you little about the other, so agent use is not one consistent
    trait across the tiers; but there is a session-level ''leaning on the assistants today'' that moves both". That
    does not weaken "style is personal"; it adds that part of what varies from one session to the next is shared
    across the tiers.'
  3: Agreed — no changes to the story. Your role picks are now shown as set; the Archive one (the axis loadings)
    has moved to the sidelined panel.
f-personal-style#axis:
  2: '<b>Mostly yes, with one qualification.</b> The axis is anchored on taking the strategy card: a person''s axis
    score correlates .92 with their card uptake, so card uptake alone accounts for 85% of it (previewing cards,
    +.88, is largely the same act). But it also carries pressing Suggest (+.62), Suggest in recovery (+.46) and
    deciding faster (−.48), so the fair label is "leans on the assistants and moves quickly", with card-taking its
    clearest sign. And it is only 31% of the differences between people: a second dimension (19%) is how many drones
    someone commits beyond the cautious card, and a third (17%) is editing cards rather than taking or replacing
    them. Agreed it is not a main finding; kept as numbers.'
  3: Moved to the sidelined panel (your Archive pick). The scatter that follows carries the point.
f-personal-style#axis-scatter:
  2: '<b>Not quite.</b> It is weak, but not absent: ρ = .37 [.01, .65], p = .033, so nominally significant, with
    an interval running from almost zero to moderate (game-adjusted, ρ = .33, p = .058). The fair wording is "only
    loosely linked", not "no correlation". A new check adds a second view (toggle): within a person, the session
    where they took more cards is the session where they pressed Suggest more (ρ = .51, p = .002). So "agent use
    isn''t one consistent strategy" holds between people, but the two tiers do share a session-to-session component.'
  3: '<b>Yes, that is the right reading.</b> ρ = .37 is weak to moderate, and p = .033 only says it is unlikely
    to be exactly zero. The interval [.01, .65] is wide, so the honest wording is: the two tiers go together <i>somewhat</i>,
    far from one trait. The within-person version (ρ = .51, p = .002) is the firmer number: a person who leans on
    one assistant in a session tends to lean on the other in that session.'
