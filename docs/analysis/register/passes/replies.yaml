f-personal-style#not-disposition:
  2: '<b>Yes, in the sense that matters:</b> they are what chance alone produces. With 40 tests at p &lt; .05 about
    two "hits" are expected even if nothing is related; we got three. A new check makes this concrete (second chart):
    shuffling which person''s questionnaire goes with which person''s behaviour, and redoing all 40 tests, gives
    three or more hits 34% of the time, and a correlation as strong as the strongest one somewhere in the grid 51%
    of the time. Holm is the formal version of the same point. What it does <i>not</i> say is that those three links
    are exactly zero: it says this study cannot tell them apart from chance, so they should not be reported as findings.'
  3: 'Done. The chart is now the grid alone (with a key saying what a cell and its colour mean). The shuffle histogram
    is gone; its result is two sentences in the text and the caption: 3 of 40 tests nominal, 0 survive Holm, and
    3 or more nominal hits happen in 34% of shuffles with no link at all (2.0 on average). The numbers below carry
    the exact figures if you want them in the paper.'
f-personal-style#not-types:
  2: 'Rewritten so it explains itself, with a new chart in three views: <b>the map</b> (the 33 real people next
    to 33 simulated people with no types: both one cloud), <b>do groups separate?</b> (real vs no-types, for 2,
    3 and 4 groups) and <b>do groups come back?</b> (session 1 vs session 2 groupings). All three agree: no types.
    The comparison is against simulated operators who keep the real habit links, not against plainly shuffled data,
    because shuffling also removes the links between habits, and on that weaker benchmark the real data look slightly
    "clumpier" without having any types. The how-text says this in plain words. The older round-1 numbers (ΔBIC,
    archetypes) are kept as supporting numbers.'
  3: 'Agreed: a sentence or two ("no clusters: silhouette no better than in 500 no-type simulations, and groups
    did not recur across sessions, ARI ≈ .08"). Kept the chart here as backing for that sentence.'
