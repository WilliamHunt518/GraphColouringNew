# Long verbatim passages: P15 (skim group). Phrases only.
pid: P15
read:
  date: 2026-10-20
  scope: questionnaire talk, break and debrief read in full
  verdict: English is a second language; many short statements, a few longer. Strong on having no time to check and so having to trust, and on the AI being too slow for a simple problem.
passages:
