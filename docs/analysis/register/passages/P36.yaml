  - id: p36-tempo-echelon
    title: Tempo by level — routine at the top, ten things at once at the bottom
    parts: [{seg: interview, from: "so it's how you're talking about when does the effect", to: "that is getting both faster"}]
    prompt: {seg: interview, from: "and I suppose I think it would be fair to say", to: "within a tactical kind of small scale"}
    context: Debrief, on pace; the lead-in about long shifts and watchkeeping is probably the researcher (no speaker labels).
    topics: [pace, hierarchy, realism]
    why: Where workload sits in a real hierarchy — the lower tier gets everything at once as it comes down the chain — which the game compresses into one person.
    links: [f-workload, f-tier-trust]
    refs:
      - to: f-workload#said-did
        kind: qualifies
        point: 'Nine people said they lean on the assistant when busy, yet their reliance did not rise with the queue. P36 puts the busy in a real hierarchy: "the higher up you are the further out", where a new item is "just like a routine routine task"; at the lower tier "10 things in front of me as it''s all come down the chain". The game gave one person both tiers.'
      - to: q-new-jobs#queue-order
        kind: beyond
        point: 'P27 and P32 asked for an assistant that says what to open next. P36''s lower tier is where that job would sit: "I''ve got to do this thing now then that thing then that thing then that thing".'
