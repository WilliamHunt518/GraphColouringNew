- id: q-new-jobs
  title: New jobs for an assistant
  confidence: qualitative
  headline: 'Asked what the assistants should do, people rarely asked for more automation of the same kind. They
    asked for assistants that check: one that reviews the operator''s own plan for slips rather than taking it over
    (P11). They asked for smarter rules (redundancy scaled to failure risk, backup routes in the tactical plan),
    for options between and beyond the two cards, and for an interface that knows what they have already planned.
    Two (P27, P32) asked for something neither assistant does: help deciding which waiting mission to open next.'
  done: 'Looked into the queue-ordering idea. Two people raise it, P27 (in the second questionnaire, with a rule:
    missions that can be done first, then by criticality) and P32 (in play: "it would be helpful if it just picked
    the next mission for me"); a keyword search of every transcript found no others. Both are now passages, in a
    new first section with the numbers on how people actually ordered the queue: criticality does pull (it was not
    in the earlier choice model), whether the reserve could cover a mission does not, and the oldest waiting mission
    could not be covered at 41% of decisions. The queue''s sort toggle is not logged, so its use cannot be counted.
    Script: scripts/register/pass2/queue_order.py.'
  sections:
  - id: queue-order
    title: An assistant for what to open next
    tier: main
    text: 'Neither assistant helps with the first decision of every allocation: which waiting mission to open. P32
      asked for it in play ("a suggestion of what to do next would be handy"), because a mission the reserve cannot
      cover sits at the top of the list anyway; P27 gave a rule, missions that can be done first, then by criticality,
      allowing for what is already running. The logs show the gap such an assistant would fill. With two or more
      missions waiting (411 decisions, 33 people), operators open the oldest (49%; chance 34%) and lean towards
      the more critical (×1.45 per category above the waiting set''s average, p = .02), but not towards missions
      they can actually cover: whether the reserve could supply a mission''s drones makes no difference (×1.04,
      p = .79), and at 41% of decisions the oldest waiting mission could not be covered. P27''s order differs from
      what operators did at 59% of decisions. The queue had a "Sort: Score" toggle; the researcher told P27 only
      one participant had found it, and it is not logged.'
    numbers:
    - 'Decisions with 2+ missions waiting: 411 (33 people). Opened the oldest 49% (chance 34%); when one waiting
      mission was uniquely the most critical, opened it 49% (chance 33%)'
    - 'Choice among the waiting missions (conditional logit, person bootstrap, 400 draws): oldest ×2.75 [1.97, 4.12],
      p < .001; newest ×1.64 [1.17, 2.32], p < .001; criticality, per category above the set''s mean ×1.45 [1.09,
      2.15], p = .02; coverable from the reserve ×1.04 [0.72, 1.58], p = .79; size per 3 drones ×0.95 [0.78, 1.11],
      p = .61'
    - The oldest waiting mission could not be covered from the reserve at 41% of these decisions; some waiting mission
      could not be covered at 57%. When some could not, the one opened was coverable 32% of the time (chance 39%)
    - P27's order (coverable, then most critical, then oldest) picks a different mission from oldest-first at 59%
      of decisions; there operators opened P27's pick 35% of the time (chance 30%)
    how: 'Same decisions and waiting sets as the triage choice model (load.py), with two features added per waiting
      mission: its category (A–E, the penalty rate the operator sees), centred on the set; and whether the drones
      available in the reserve just before the decision covered its primary composition in every colour. Coverable
      is strict: tasks also have substitute compositions, and drones returning to the hub are not counted, so it
      understates what an operator could have done. scripts/register/pass2/queue_order.py; results in pass2/load.json,
      queueOrder.'
    qual:
      summary: P27 and P32; both cuts include the researcher's words (flagged).
      featured:
      - ps:p27-queue-order
      - ps:p32-pick-next
      more: []
  - id: checkers
    title: Assistants that check rather than decide
    tier: main
    text: P11, building plans by hand, would welcome an assistant that "could have said, oh, dummy, you're missing
      a camera there", which "is different from letting it take over completely".
    qual:
      summary: P11.
      featured:
      - ps:p11-check-my-plan
      more: []
  - id: smarter-rules
    title: Smarter rules
    tier: main
    text: 'The fixed padding of the Conservative card is the target of most suggestions: size the reserve to an
      estimated failure risk (P13), and in the tactical plan add the backup routes that P21 built by hand ("in case
      of failure, it doesn''t redirect those drones").'
    qual:
      summary: P13 and P21.
      featured:
      - ps:p13-failure-into-algorithm
      - ps:p21-no-backup-route
      more: []
  - id: options
    title: Options, not a choice of two
    tier: main
    text: 'Several wanted to shape the suggestion rather than accept or reject it: P28 found "fixed options" insufficient;
      P22 found their own middle ground; P19 valued the card as a first draft ("you can fix bad, you can''t fix
      nothing").'
    qual:
      summary: P28, P22 and P19.
      featured:
      - ps:p28-customise
      - ps:p19-fix-bad
      - ps:p22-middle-ground
      more: []
  - id: interface
    title: An interface that knows what you have done
    tier: main
    text: 'Concrete requests: recognise contingency already built into a plan (P21), confirm before a running task
      is cancelled (P13), show the total drones a mission needs (P10). P31 notes the map in the middle went unwatched,
      because attention lived on the queue and the planner.'
    qual:
      summary: P21, P13, P10 and P31.
      featured:
      - ps:p21-contingency-unrecognised
      - ps:p13-confirm-cancel
      - ps:p10-interface-asks
