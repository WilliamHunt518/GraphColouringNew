        that checking depended on time (C17), and 5 that they always checked (C18). The reasons match the finding:
        the plan is hard to check, so it is taken on trust (''I just took the AI''s word for it''). Several say
        it is not more trust but the time to check (P04). P14 is the clear dissent: they checked tactical plans
