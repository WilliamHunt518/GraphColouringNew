- id: f-size-decides
  area: When operators hand over
  title: Small jobs by hand, big jobs to the assistant — on both tiers, and it is where the assistant saves time
  headline: 'The bigger the job, the more likely an operator hands it to an assistant, on both tiers. Measured the
    same way on both (drones the mission needs), the strategy card is taken on 56% of the smallest missions vs 75%
    of the largest, and Suggest is pressed on 54% vs 91%. Comparing each person only with themselves, every doubling
    of the mission multiplies the odds of handing over by about 1.6 (strategic) and 2.9 (tactical); 22 of 33 people
    hand over more on their biggest missions than their smallest on each tier. It survives every check we tried,
    including dropping the illogical Conservative cards and allowing for everyone having played the same missions.
    Three qualifications: on the strategic tier most of the effect is operators deciding small missions before the
    cards load; the strategic curve is lumpy (a dip at 5 drones, missions that mostly arrived in bursts in the Strategic
    Heavy games), so the dependable strategic contrast is one-type vs three-type missions; and handing over on one
    tier goes with handing over on the other (a mission allocated from a card gets Suggest at about twice the odds).
    The rule is sensible: the card is much quicker than building by hand on three-type missions and no quicker on
    one-type ones, and a Suggest plan is not slower: compared on missions of the same size it finishes about 15
    s sooner, mostly because it is carried out faster.'
  confidence: strong
  absorbs:
  - size-decides
  - speed-big-jobs
  - speed-parallel
  - q-C03
  - q-C04
  - q-C05
  - q-C06
  sections:
  - id: both
    title: 'Both tiers on one axis: the bigger the mission, the more it is handed over'
    text: 'For every mission, the share of decisions where the operator handed over (took a strategy card as offered,
      blue, or pressed Suggest in the tactical planner, orange) by how many drones the mission needs. Both rise.
      The tactical tier rises more steeply and keeps rising, from 54% to 91%. The strategic tier climbs from about
      half on small missions to about three quarters, with a dip at 5 drones. That dip is seven particular all-Fast
      missions, all in the two Strategic Heavy games, and six of them arrived in bursts: in one game two of them
      arrived 11 s apart in a run of seven missions inside one minute (minutes 1.6 to 2.6), in the other four of
      them arrived within 80 s (minutes 3.7 to 5.0) alongside three other missions. So by the time operators reached
      them 3–4 other missions were waiting, and they decided fast and often before the cards loaded. Busy arrival
      is likely part of it, but not all: missions of other sizes in the same bursts got the card more often (a 3-drone
      and a 6-drone mission in those bursts got it 67% and 64% of the time), and holding the queue fixed barely
      changes the 5-vs-3 comparison (see "Why the 5-drone missions dip").'
    how: '<b>Rows.</b> Strategic: all 606 strategy-card decisions (one per strategic choice). Tactical: all 627
      non-recovery tactical plans whose mission size is known (630 minus 3 residual missions with no recorded need).
      <b>Size</b> = drones the mission needs: the sum of the primary requirements over its tasks — the number an
      operator reads off the task badges, the same for both tiers. Binned so each bin has ≥ 59 decisions. <b>Intervals</b>:
      we resample whole people (2,000 times) and recompute the rate, so a person''s decisions travel together and
      one heavy user cannot make an interval look tight. <b>Model</b>: a logistic GEE (a regression for yes/no outcomes
      that allows each person''s decisions to be correlated) with size split into two parts — this decision''s size
      minus the person''s own average size (the <i>within-person</i> part) and the person''s average (the between
      part); game and session are held fixed. The within-person odds ratio answers: "when the same person meets
      a mission twice as big, how much do the odds that they hand it over change?" Odds ×2 means, for example, a
      60% chance becomes 75%. Both tiers in one model: the two tables stacked, one shared within-person slope plus
      a tier term; the tier × size term tests whether the slopes differ.'
    chart: handover.sizeBothBars
    numbers:
    - 'Strategic, per doubling of drones needed: odds ×1.62 [1.23, 2.15], p < .001 (606 decisions, 33 people)'
    - 'Tactical, per doubling of drones needed: odds ×2.91 [2.03, 4.17], p < .001 (627 plans)'
    - 'Both tiers, one shared slope: ×2.07 [1.64, 2.61], p < .001 (1,233 decisions); the tactical slope is steeper
      than the strategic one by ×1.38 [0.99, 1.91], p = .056 — suggestive, not shown'
