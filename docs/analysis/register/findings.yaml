  - id: adjustment
    title: What 'expected' and 'adjusted' mean
    text: '<b>Expected</b> is the chance a model gives that this person takes a card on this decision. It knows
      only what the decision was (drones, tasks and drone types the mission needed), when it was (minute of the
      session, whether it was a re-queued mission, how many others were waiting), which of the four games was being
      played, and how often <i>this person</i> took cards on all their <i>other</i> decisions. <b>Adjusted</b> =
      the group''s overall rate + the average of (observed − expected) at that position. In plain terms: ''how far
      above or below their usual self, given the mission in front of them, were people here?'' The person term does
      most of the work (odds ×2.84 per unit; the model ranks takes above non-takes 81% of the time). So ''adjusted''
      mostly means ''compared with that person''s normal habit''. Of the mission features, only the number of drone
      types matters (×1.51 per extra type). Because adjusted is a shifted average residual and not a probability,
      it can go above 100% at a small dot that sits far above its expectation. The old not-said +2 dot read 122%
      for this reason.'
    how: 'Logistic regression over all 606 decisions: took ~ drones + tasks + types + minute + game + queue length
      + residual flag + logit(person''s leave-one-out rate, shrunk with +1/+2). The same specification as extras2.add_expected;
      the script checks the fitted values are identical. The chart shows each term''s odds ratio with a 95% interval.'
    chart: flaw.model
    numbers:
    - 'Person''s own rate elsewhere: odds ×2.84 [2.29, 3.51] per logit unit'
    - 'Each extra drone type needed: ×1.51 [1.12, 2.04]; drones ×1.08, tasks ×0.98, minute ×1.05, queue ×0.98 (all
      n.s.)'
    - Model ranks takes above non-takes 81% of the time (AUC 0.81)
    atoms:
    - flaw-dots
    tier: side
    role: numbers
  - id: robustness
    title: Every specification, whatever it shows
    text: 'Fourteen versions of the before/after question. Noticers'' change is negative in every one (−10 to −26
      points). Non-noticers'' is positive or flat in every one. The adjusted difference between groups is negative
      in every one, with p mostly between .06 and .4. It weakens when the noticed group is the debrief code alone
      (−8 points, p = .39) and when each session''s first decision is dropped (−7 points, p = .44). It is largest
      in the short window (−25 points, p = .02, chosen after seeing the dip) and gone in the long run (−2 points).
      The one-type-only version cannot be estimated: almost nobody has a one-type mission before their first illogical
      card. The direction is stable. Its size and significance are not.'
    how: 'Each row reruns the before/after and interaction models with one thing changed: the practice term, the
      window, the missions, the anchor (first illogical card actually displayed rather than pre-empted), who counts
      as ''noticed'', or who is excluded (P01/P02, who played on half task weights). Estimates are in percentage
      points with 95% intervals, people clustered.'
    chart: flaw.strip
    numbers:
    - 'Difference (noticers − never-said), adjusted: main −15 (p .09); no practice term −15 (.09); first 5 after
      −25 (.02); 6th onward −2 (.83); all missions −15 (.06); without illogical-card missions −14 (.13); first card
      displayed −12 (.12); C12 only −8 (.39); broad remarks −11 (.21); strict remarks only −16 (.10)'
