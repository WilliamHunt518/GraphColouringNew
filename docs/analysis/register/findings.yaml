  - id: fingerprint
    title: After one session we can recognise a person's style in the next
    text: 'Each session is summarised as ten habits (below). Comparing everyone''s session-1 profile with everyone''s
      session-2 profile, the closest match is far more often the <b>same person</b> than chance allows. It is a
      "near neighbour" result, not exact identification: the own session is the single closest match for 7 of 33
      people (chance: 1), but in the closest three for 41% (chance 9%), and on average ranks 8th of 33 (chance 17th).
      It survives taking the reliance axis out — so the style is more than "how much do you lean on the assistants".
      In the matrix, every row is one person''s session 1, every column a session 2, darker = closer; the outlined
      diagonal is each person against themselves.'
    how: 'Rows: 66 sessions (33 people × 2). Each session becomes a vector of ten habits: share of strategy cards
      taken; share of manual choices made before the cards loaded; share of cards edited; share of tactical plans
      where Suggest was pressed; share of Suggest plans kept unchanged; share of recovery episodes with Suggest
      pressed; time per strategic decision beyond the forced card delay (log); drones committed vs the Conservative
      card on single-type and on multi-type missions; card previews per decision. Each habit is turned into a z-score
      <i>within the game played</i> (so a hard game does not make everyone in it look alike; a habit with no data
      in a session, e.g. no recoveries, is set to that game''s median). For each person''s session-1 vector we measure
      the straight-line (Euclidean) distance to all 33 session-2 vectors and rank them; "rank 1" means their own
      session 2 is the nearest. Done both ways (session 1 looking among session 2s and vice versa). The p-value
      comes from shuffling who-is-who in session 2 10 000 times and counting how often chance does as well. "Reliance
      axis removed": the single strongest direction of variation (PC1, see below) is subtracted from every vector
      first. The profile correlation r is the Pearson correlation between a person''s two ten-habit vectors (1 =
      same shape, 0 = unrelated). Exploratory and post hoc; the permutation test is clean. People are ordered by
      reliance in the matrix, so neighbours look alike — the claim is that the diagonal beats them.'
    chart: style.fingerprintMatrix
    numbers:
    - 'Own session nearest: 7 of 33 (session 1 → 2) and 5 of 33 (2 → 1); chance ≈ 1; permutation p < .001'
    - 'Own session in the closest 3: 41% vs 9% by chance; mean rank 8.2 of 33 vs 17.0 (p < .001)'
    - 'Reliance axis removed: 6 and 6 of 33, top-3 32%, mean rank 10.1 (p < .001) — the style is more than reliance'
    - 'Reliance axis alone: 4 and 4 of 33, top-3 27%, mean rank 11.1'
    - 'Profile correlation with own other session: median r = .48; with other people''s: median r = −.01; own closer
      for 29 of 33 (sign test p < .001)'
    atoms:
    - style-fingerprint
    tier: side
    role: numbers
