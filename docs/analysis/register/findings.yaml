  - id: habit-by-habit
    title: Which habits carry over — and what each correlation means
    text: 'Each small scatter is one habit: a dot is a person, x = that habit in session 1, y = the same habit in
      session 2. If people kept their place in the queue exactly, the dots would lie on the dashed line; if session
      1 told us nothing, they would be a shapeless cloud. Six of the ten habits carry over clearly: keeping Suggest
      plans, pressing Suggest, taking cards, previewing cards, decision time, and Suggest in recovery. Topping up
      drones on single-type missions does not carry over at all.'
    how: 'ρ (Spearman) for habit X = the correlation, across the 33 people, between their rank on X in session 1
      and their rank on X in session 2, each session first adjusted for the game played (z within game). ρ = .62
      for "takes the strategy card" means people keep roughly the same order: high card-takers in session 1 are
      mostly high in session 2, though not exactly. 95% intervals come from resampling people 2000 times; Holm corrects
      for testing ten habits. "Distinct levels" (separation strata) says how many groups of people the habit can
      tell apart reliably: one session of card uptake separates about 2 (high vs low), the average of two sessions
      about 3. Caution on "keeps the Suggest plan": 24 of 33 people kept every Suggest plan unchanged in both sessions
      (a ceiling), so its high ρ mostly says that the nine who ever edit a plan tend to do so in both sessions.
      The pre-empting habit here is "share of <i>manual</i> choices made before the cards loaded" (undefined for
      15 people who never chose manual in a session); the clearer per-decision version is in the next section.'
    chart: style.retestGrid
    numbers:
    - 'Survive Holm: keeps Suggest plan ρ .65 [.34, .84]; presses Suggest .65 [.34, .84]; takes card .62 [.33, .78];
      previews .56 [.25, .77]; decision time .52 [.20, .74]; Suggest in recovery .48 [.14, .74]'
    - 'Do not: edits a card .41; manual-before-cards (share of manual) .36; drones on multi-type .34; drones on
      single-type −.09'
    - 'Card uptake: ~2 distinct levels of people from one session, ~3 from two'
    - 'Score on the reliance axis, session 1 vs 2: ρ = .65 [.38, .82]'
