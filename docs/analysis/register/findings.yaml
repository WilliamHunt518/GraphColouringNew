  - id: slow
    title: 'The exception that proves the rule: the people who call the assistant slow'
    text: 'Six people complain that the assistant is slow (C06: P06, P15, P16, P26, P27, P29). They are not low-reliance
      or struggling operators. They take cards and press Suggest at the same rate as everyone, keep Suggest plans
      unedited, and score a little above average. What sets them apart is that they apply the size rule <i>harder</i>:
      they pre-empt the cards more than twice as often (30% vs 13% of decisions), their three-type minus one-type
      card gap is twice everyone else''s (+40 vs +19 points), they make more strategic decisions per session (10.2
      vs 9.0) and they build tactical plans faster (19.9 vs 25.8 s). The complaint and the rule are the same observation:
      the fixed wait is not worth it on small jobs. One of them (P29) says as much — the wait was long, but worth
      it on the complicated missions. The paradox is only apparent: the people most bothered by the assistant''s
      speed are fast operators who route around it on small jobs and still use it on big ones. With six people none
      of these differences is reliable on its own.'
    how: Per-person measures, averaged over the person's two sessions, for the six C06 people against the other
      27. Score = session score (P01/P02 rescaled for their half task weights) standardised within each of the four
      games. Size gaps as in the per-person chart. p = two-sided permutation test (group labels reshuffled 20,000
      times); 10 comparisons, uncorrected — expect about one p below .10 by chance.
    chart: handover.c06Profile
    numbers:
    - Pre-emptive share 30% vs 13% (p = .055); three-type minus one-type card gap +40 vs +19 points (p = .09); decisions
      per session 10.2 vs 9.0 (p = .09)
    - Tactical plan time 19.9 vs 25.8 s (p = .16); score +0.32 vs −0.07 SD (p = .34)
    - Card uptake 58% vs 66% (p = .51); Suggest 74% vs 76% (p = .90) — reliance itself does not differ
    atoms:
