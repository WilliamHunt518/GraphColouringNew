- id: f-workload
  area: Workload and the queue
  title: A busier moment does not push people onto the assistants — even though they say it does
  headline: 'Comparing each operator with themselves, having more missions waiting does not change how often they
    take a strategy card or press Suggest: the line is flat once we account for what each decision was (mission
    size and drone types), when it came in the session, which game it was and who made it. This is "no evidence
    of an effect", with enough data to rule out large effects (strategic: at most about +15 points of card-taking
    going from 0 to 5 waiting). Nine of 33 said in the debrief that they hand over when overloaded; their own behaviour
    moved with the queue no more than anyone else''s. In play they said overload-type things at slightly busier
    moments, but their reliance around those moments did not change.'
  confidence: 'null'
  absorbs:
  - load-null
  - load-visible
  - load-backlog-practice
  - load-deep-queue
  - q-C11
  sections:
  - id: raw-vs-adjusted
    title: Queue depth against reliance — raw, and adjusted
    text: 'Each point is the share of decisions where the operator took a strategy card (or pressed Suggest), grouped
      by how many OTHER missions were waiting for a strategic decision at that moment. Whiskers are 95% intervals.
      Switch the view: <b>Raw</b> shows the dip at 3–4 waiting that made the raw graph look like an effect; <b>Raw
      + expected</b> shows that the dip is where it was expected anyway (dashed line); <b>Adjusted</b> removes it
      — every adjusted point sits inside 59–74% with overlapping intervals and no trend. The dotted vertical line
      marks where the queue list runs out of room (about 3.5 cards visible at rest, counting the one being opened):
      beyond it, waiting missions are only on the strategic map. Nothing changes at that line either.'
    how: '<b>Rows:</b> 564 strategic decisions on original (non-residual) missions and 630 tactical plans, 33 people
      (P09 excluded). <b>Queue</b> = other missions that had arrived and not yet been given a strategic choice when
      the decision panel opened, rebuilt from the event log (agrees with the logged count for 100% of decisions).
      <b>Expected</b>: a logistic model predicts each decision''s chance of a card (or Suggest) from four things
      only — the mission (drones needed, number of tasks, number of drone types), the minute of the session, the
      game (one of four fixed scenarios), and the person (their own rate on all their OTHER decisions, so a decision
      never predicts itself). The queue is deliberately left OUT. <b>Adjusted</b> for a bin = the overall rate +
      the average of (observed − expected) in that bin. In plain words: ''given who made these decisions, on which
      missions, at what point in which game, how much more or less did they rely on the assistant than we would
      expect?'' If load mattered, the deep-queue bins would sit above what their missions and people predict; they
      do not. <b>Worked example (strategic, 4 waiting, 41 decisions):</b> raw 51% looks like a drop from 67% at
      0 waiting. But 90% of those decisions were in the two Strategic Heavy games, on missions averaging 6.9 drones
      (vs 8.7) with fewer three-type missions (54% vs 66%), made by people whose usual rate is 56% (vs 66%). The
      model expects 50%; observed is 51%; adjusted ≈ 67%. <b>Intervals</b>: people resampled with replacement 400
      times, the expected-model re-fitted each time, so the interval includes the uncertainty of the adjustment
      itself.'
    chart: load.nullBins
    numbers:
    - 'Strategic raw: 67% (0 waiting), 70%, 68%, 58%, 51%, 71%, 50% (6+); adjusted: 66%, 65%, 65%, 61%, 67%, 74%,
      59% — all intervals overlap.'
    - 'Tactical raw: 73%, 79%, 83%, 79%, 76%, 73%, 67%; adjusted: 76%, 78%, 77%, 75%, 82%, 78%, 78%.'
    - 'The queue rises with the minute (Spearman ρ = .49) but hardly with mission size (ρ = −.08): the adjustment
      mostly removes WHO reaches deep queues and WHICH GAME they are in.'
    - 'Deep queues are a Strategic Heavy phenomenon: 90–97% of decisions at 4+ waiting are in those two games.'
    atoms:
    - load-null
    - load-visible
  - id: robust
    title: Every way of asking it gives the same answer
    text: 'The within-person change in the odds of relying per extra mission waiting, under every specification
      tried — including each game on its own, the heavier vs the lighter pair of games, a ''hinge'' that lets the
      effect differ beyond the visible list, tasks waiting instead of missions, and missions that had just arrived
      (which the operator cannot cause). Strategic: all 13 are compatible with no change. Tactical: the main model
      is flat, but two of twelve variants reach p < .05 (without mission size; Strategic Heavy game 1 alone) — a
      small upward lean that disappears once mission size is held fixed and is absent for the arrivals measure.'
    how: 'GEE logistic regression (decisions clustered within person, bias-reduced standard errors). ''Within person''
      means the queue is centred on that person''s own average, so the estimate compares a person when busier with
      the same person when less busy; their average queue is kept as a separate term. ''Main'' adds mission size,
      tasks, drone types, minute and game. An odds ratio of 1.04 means the odds of taking a card are 4% higher per
      extra mission waiting. To make the interval concrete: at the main model''s upper limit (1.17) uptake would
      rise from 65% at 0 waiting to 80% at 5; at its lower limit (0.92) it would fall to 56%. So the data rule out
      a large effect but not a modest one either way.'
    chart: load.robust
    numbers:
    - 'Strategic main: OR 1.04 [0.92, 1.17], p = .53 per extra mission waiting; range across 13 specs 0.91–1.60,
      none p < .05.'
    - 'Strategic hinge: 0–3 waiting OR 1.00 [0.82, 1.22]; beyond 3 OR 1.11 [0.86, 1.44] — no change at the visible
      limit.'
    - 'Tactical main: OR 1.08 [0.94, 1.24], p = .26; + minute and game only: 1.18 [1.03, 1.34], p = .017; arrivals
      in last 60 s: 1.00 [0.90, 1.11].'
    - 'Heavier games only (Strategic Heavy 1, Tactical Heavy 2): strategic 1.10 [0.93, 1.32], tactical 1.14 [0.98,
      1.32].'
    atoms:
    - load-null
  - id: said-did
    title: 'Said vs did: the people who said they hand over when busy'
    text: 'Nine operators (P05, P06, P11, P18, P20, P25, P32, P33, P35) said, unprompted, that they lean on the
      assistant more when busy, overwhelmed or rushed. Each dot is one person''s own slope: how much their (adjusted)
      reliance changed per extra mission waiting. If what they said described what they did, the red group would
      sit clearly right of zero. It does not: on average they move about +2 points per extra mission, not distinguishable
      from zero or from the other 24 people. Their claim usually compared sessions (''the first one was so fast
      I used it a lot'') — so the second view checks that version: reliance in their heavier game minus their lighter
      game. Again no difference.'
    how: '<b>Moment to moment:</b> for each person with 6+ decisions and some spread in queue depth, a straight
      line through their (observed − expected) values against queue depth; the slope is in percentage points per
      extra mission waiting. Groups compared with a Mann–Whitney test; also tested as a queue × ''said'' interaction
      in the GEE above. <b>Busier session:</b> the four games'' load measured by total drones demanded per session
      (Tactical Heavy 2: 115; Strategic Heavy 1: 89; Strategic Heavy 2: 88; Tactical Heavy 1: 63); for each person,
      their mean (observed − expected) in the heavier of their two games minus the lighter. With 9 people in the
      ''said'' group, only a large difference could have been detected — this is absence of evidence for the claim,
      and the point estimates are small.'
    chart: load.saidDid
    numbers:
    - 'Strategic slopes: said +2.1 pp per extra mission (5 of 9 upward) vs not said −0.3 pp (11 of 24 upward); p
