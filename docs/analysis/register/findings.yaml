  replies:
  - card: rec-blind-spot
    text: 'Reframed around your question, answered from the logs. After a wrong refusal, 9 of 17 abandoned vs 10
      of 118 other attempted fixable failures (odds ×12). None of the 9 dragged a drone after the refusal, 3 just
      re-pressed Suggest, none were busy elsewhere, and 8 of 9 abandoned within 10 s. Everyone who did try by hand
      saved the mission. Correct refusals get the same quick abandonment, which suggests operators cannot tell the
      two apart. Caveat: looking is not logged. P19 is verified on video.'
  - card: rec-after-refusal
    text: 'Merged into the refusal finding. The ''rise'' is raw only (80% → 89%) and comes from the general session-2
