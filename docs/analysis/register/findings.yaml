  - id: said
    title: What they said about their own strategy
    text: 'Fifteen of 33 described, unprompted, a consistent strategy of their own. Their style is visibly different:
      they take fewer cards (51% vs 76%), pre-empt the cards more (25% vs 8% of decisions) and sit lower on the
      reliance axis — a "personal strategy" is usually a hand-building strategy. Only one person (P11) said they
