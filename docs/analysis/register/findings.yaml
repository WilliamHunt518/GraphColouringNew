- id: f-size-decides
  area: When operators hand over
  title: Small jobs by hand, big jobs to the assistant — on both tiers, and it is where the assistant saves time
  headline: 'The bigger the job, the more likely an operator hands it to an assistant: on the strategic tier the
    card is taken on 52% of one-type missions vs 72% of three-type ones, on the tactical tier Suggest is pressed
    on 57% of the smallest plans vs 92% of the largest. Comparing each person only with themselves, every doubling
    of the job multiplies the odds of handing over by about 1.6 (strategic, drones needed) and 2.1 (tactical, drones
    in the plan; 2.9 if measured by drones needed); 21 of 31 and 23 of 33 people show it individually. It survives
    every check we tried, including dropping the illogical Conservative cards. One honest qualification: on the
    strategic tier most of the effect is operators deciding small missions themselves before the cards have even
    loaded — once the cards are on screen, size matters only weakly. The rule is sensible: that is exactly where
    the assistant saves time (cards ~27% faster on three-type missions, no faster on one-type), and Suggest lets
    operators start other missions while a plan fills in.'
  confidence: strong
  absorbs:
  - size-decides
  - speed-big-jobs
  - speed-parallel
  - q-C03
  - q-C04
  - q-C05
  - q-C06
  sections:
  - id: both
    title: 'Both tiers on one axis: the bigger the mission, the more it is handed over'
    text: For every mission, the share of decisions where the operator handed over — took a strategy card as offered
      (strategic, blue) or pressed Suggest in the tactical planner (tactical, orange) — against how many drones
      the mission needs. Both rise. The tactical tier rises more steeply and keeps rising; the strategic tier climbs
      from about 45–55% on small missions to about 75% and then levels off.
    how: '<b>Rows.</b> Strategic: all 606 strategy-card decisions (one per strategic choice). Tactical: all 627
      non-recovery tactical plans whose mission size is known (630 minus 3 residual missions with no recorded need).
      <b>Size</b> = drones the mission needs: the sum of the primary requirements over its tasks — the number an
      operator reads off the task badges, the same for both tiers. Binned so each bin has ≥ 59 decisions. <b>Intervals</b>:
      we resample whole people (2,000 times) and recompute the rate, so a person''s decisions travel together and
      one heavy user cannot make an interval look tight. <b>Model</b>: a logistic GEE (a regression for yes/no outcomes
      that allows each person''s decisions to be correlated) with size split into two parts — this decision''s size
      minus the person''s own average size (the <i>within-person</i> part) and the person''s average (the between
      part); game and session are held fixed. The within-person odds ratio answers: "when the same person meets
      a mission twice as big, how much do the odds that they hand it over change?" Odds ×2 means, for example, a
      60% chance becomes 75%. Both tiers in one model: the two tables stacked, one shared within-person slope plus
      a tier term; the tier × size term tests whether the slopes differ.'
    chart: handover.sizeBoth
    numbers:
    - 'Strategic, per doubling of drones needed: odds ×1.62 [1.23, 2.15], p < .001 (606 decisions, 33 people)'
    - 'Tactical, per doubling of drones needed: odds ×2.91 [2.03, 4.17], p < .001 (627 plans)'
    - 'Both tiers, one shared slope: ×2.07 [1.64, 2.61], p < .001 (1,233 decisions); the tactical slope is steeper
      than the strategic one by ×1.38 [0.99, 1.91], p = .056 — suggestive, not shown'
    - 'Raw rates, smallest to largest bin: strategic 56% → 75%, tactical 54% → 91%'
    atoms:
    - size-decides
  - id: strategic
    title: 'Strategic tier: drone types matter more than drone count'
    text: 'Split by how many drone types the mission needs, the strategic picture is mostly one step: one-type missions
      get a card about half the time whatever their size (3, 5 or 6 drones), three-type missions about 70%. Among
      three-type missions more drones still raise uptake (×1.53 per doubling), but unevenly (the 10–11 and 18-drone
      bins dip). Tasks per mission barely matter on this tier.'
    how: 'Same rows and model as above, with three measures of size fitted one at a time (they are too entangled
      to fit together: every one-type mission needs ≤ 6 drones). "Per extra type" treats types as 1/2/3; two-type
      missions are rare (12 decisions) and left out of the chart but kept in the models. The within-three-type and
      within-one-type rows refit the drone-count model inside each group, so type is held fixed.'
    chart: handover.sizeStrat
    numbers:
    - 'Card taken: one type 52% (181 decisions), two types 58% (12), three types 72% (413)'
    - 'Within person, each extra drone type: odds ×1.50 [1.23, 1.83], p < .001; three-type vs not ×2.15 [1.48, 3.12]'
    - 'Each extra task: ×1.18 [0.95, 1.45], p = .13 (not distinguishable from no effect)'
    - 'Doubling of drones inside three-type missions: ×1.53 [1.05, 2.21], p = .026; inside one-type missions: ×0.98
      [0.53, 1.79], p = .94'
    atoms:
    - size-decides
  - id: strategic-steps
    title: 'Strategic tier, honestly: most of it is deciding small missions before the cards arrive'
    text: A strategic decision has two steps. The cards take about 4.7 s to load; before that the operator can already
      build an allocation by hand ("pre-emptive manual"). Pre-emption is common on small missions (25–34% of decisions
      needing ≤ 5 drones) and rare on big ones (7–9%). Once the cards are on screen, operators take one 67–75% of
      the time on small missions and 81–83% on big ones — a weaker slope that on its own is not distinguishable
      from flat. So on this tier "small jobs myself" mostly means "I don't wait for the advice on small jobs". That
      is still a hand-over decision driven by size, but it is a decision about whether to wait for the assistant
      at all, not a verdict on its advice.
    how: 'The same 606 decisions split by the logged flag <i>manualBeforeCardsLoaded</i> (97 pre-emptive manuals).
      Two within-person GEEs: (1) pre-emptive manual (yes/no) ~ size, on all 606; (2) card taken ~ size, on the
      509 decisions where the cards had loaded first. Dropping pre-emptive decisions removes only manual choices,
      so (2) is a conditional view, not an artefact-free one — it shows how much of the size effect lives in each
      step.'
    chart: handover.sizeStratSteps
    numbers:
    - 'Pre-emptive manual, per doubling of drones: odds ×0.48 [0.33, 0.69], p < .001; three-type vs one-type ×0.34
      [0.21, 0.57]'
    - 'Card taken once cards are on screen, per doubling: ×1.26 [0.94, 1.69], p = .12; three-type vs not ×1.51 [0.93,
      2.44], p = .09'
    atoms:
    - size-decides
  - id: tactical
    title: 'Tactical tier: Suggest rises steadily with plan size, whatever happened strategically'
    text: 'In the tactical planner the dose-response is smooth: Suggest pressed on 57% of plans with ≤ 8 drone-task
      slots, 68%, 81%, 83%, 82% and 92% for plans of 51+. It rises with tasks (65% at 2 tasks → 95% at 6), with
      drone types and with drones. It holds whether the mission was allocated from a card or by hand (the two faint
      lines) — people who built the strategic allocation themselves still hand the big plans to Suggest.'
    how: '<b>Rows</b>: the 630 non-recovery tactical plans that were confirmed (the planner starts empty, so pressing
      Suggest is a deliberate choice). <b>Plan size</b> = drones in the committed team × tasks in the mission —
      the number of drone-to-task decisions the operator would otherwise make by hand (median 24). Model as above,
      per doubling of plan size. The by-route lines split plans by the strategic choice for that mission.'
    chart: handover.sizeTac
    numbers:
    - 'Within person, per doubling of plan size: odds ×2.08 [1.67, 2.59], p < .001'
    - 'Per extra task: ×2.04 [1.59, 2.62]; per extra drone type: ×1.73 [1.30, 2.31]; per doubling of drones needed:
      ×2.91 [2.03, 4.17] (all p < .001)'
    - 'Inside three-type missions: ×2.31 [1.61, 3.33]; inside one-type missions: ×1.77 [1.23, 2.53] — size matters
      on this tier even with type held fixed'
    - 'Mission allocated by hand: ×1.75 [1.20, 2.56]; allocated from a card: ×2.04 [1.48, 2.79]'
    atoms:
    - size-decides
  - id: measures
    title: 'Other ways of measuring size: drone types and tasks, both tiers'
    text: 'The researcher asked for size as drones, tasks and types. Drones is shown above; this view switches between
      types and tasks. Types separate the tiers less than tasks do: tasks move the tactical tier a lot and the strategic
      tier little, which fits what each assistant does (the tactical one sequences tasks; the strategic one counts
      drones per type).'
    how: Same rows and person-resampled intervals as the first chart; residual missions left out of the tasks view
      (a residual keeps only the tasks left over).
    chart: handover.sizeMeasures
    numbers:
    - 'Strategic by tasks (2→6): 56%, 58%, 73%, 75%, 67%'
    - 'Tactical by tasks (2→6): 65%, 71%, 76%, 86%, 95%'
    atoms:
    - size-decides
  - id: models
    title: 'Person-adjusted: every size measure, both tiers, one picture'
    text: 'Each row is one within-person estimate: how the odds of handing over change when the same person meets
      a bigger job. Rows right of the line mean "bigger → hand over more". All size measures point the same way
      on both tiers; the two that do not clear the line are strategic tasks and the strategic slope once the cards
      are on screen.'
    how: 'GEE logistic models clustered on person (exchangeable correlation, small-sample "bias-reduced" standard
      errors), size split into within- and between-person parts, game and session held fixed. Odds ratio = how many
      times the odds of handing over multiply per unit of size. Read ×1.6 per doubling as: a person who takes the
      card on 60% of 6-drone missions would be expected to take it on about 71% of 12-drone ones.'
    chart: handover.sizeModels
    numbers:
    - See chart; every estimate is listed with n and p in its tooltip
    atoms:
    - size-decides
  - id: people
    title: Person by person
    text: 'The same rule seen per person, no model: each line is one operator''s hand-over rate on small jobs (left)
      and big jobs (right). Most lines go up; flat lines are mostly people who always (or never) hand over on that
      tier.'
    how: 'Strategic: card-taken rate on one-type vs three-type missions, for the 31 people with at least 3 decisions
      of each. Tactical: Suggest rate on plans at or below vs above the overall median plan size (24), all 33 people.
      Sign test = are "up" lines more common than "down" lines than a coin flip would give (ties dropped).'
    chart: handover.sizePeople
    numbers:
    - 'Strategic: higher on three-type missions for 21 of 31 people, lower for 6, equal for 4 (sign test p = .006)'
    - 'Tactical: higher on big plans for 23 of 33, lower for 2, equal for 8 (p < .001)'
    atoms:
    - size-decides
  - id: artefacts
    title: Is it an artefact? Checks, all reported
    text: 'The worry: the illogical Conservative card (one that adds a drone of a type the mission does not need)
      appears only on one- and two-type missions — 71% of one-type decisions, none of the three-type ones — so "people
      avoid the card on small missions" could be "people avoid a visibly odd card". It is not: on one-type missions
      uptake is the same with an odd card (50%, 129 decisions) and without one (56%, 52 decisions), and with every
      odd-card decision removed the size effect is still there (×1.46 per doubling; clean one-type vs three-type
      ×1.83). No ε-corrupted (deliberately wrong) cards were shown in any session, so card quality did not otherwise
      vary by size. The rule also holds with queue length held fixed, with the minute of session held fixed, per
      session, per scenario, without the half-weight participants and in a person-fixed-effects model. Two strategic
      rows do not reach p < .05: Tactical Heavy sessions alone (few one-type missions there) and cards-on-screen
      only (above). The tactical rule clears every row.'
    how: 'Each row refits the main within-person model on a subset or with one more control. Illogical card: the
      <i>odd</i> flag from build_findings_synthesis.load_decisions (Conservative card carries a type the mission
      needs none of). Queue held fixed: the number of missions waiting at the decision, split within/between person
      (the queue story itself is f-workload''s). Conditional logit: a different model family that compares each
      person only with themselves by construction (people who always or never hand over drop out, hence fewer people).
      The odd-card story itself is f-flaw-odd''s — here it is only checked as a confound.'
    chart: handover.sizeRobust
    numbers:
    - 'Strategic, illogical card excluded: ×1.46 [1.12, 1.92], p = .006 (474 decisions); conditional logit ×1.92
      [1.31, 2.82]'
    - 'One-type missions, odd card vs clean card: odds ×0.77 [0.33, 1.78], p = .55 — no difference'
    - 'Strategic range across 14 specifications: ×1.26 to ×2.20; tactical range across 15: ×1.75 to ×2.64'
    - 'Tactical, illogical-card missions excluded: ×1.87 [1.47, 2.39]; strategic route held fixed ×1.98'
    atoms:
    - size-decides
    sharedWith:
    - f-flaw-odd
    - f-workload
  - id: speed
    title: 'Why the rule makes sense: the assistant is faster only on big jobs'
    text: 'Strategic: on three-type missions, taking a card (≈ 11 s) is much quicker than building by hand after
      looking at the cards (≈ 20–21 s). On one-type missions a card (9.8 s) is still quicker than a considered manual
      build (15.8 s) but slower than simply deciding before the cards appear (6.4 s) — and that is what people do
      there. Tactical: on small plans Suggest and hand-building take the same ~14–15 s; on large plans hand-building
      takes 45 s against 25 s with Suggest. The forced waits (4.7 s card reveal; 1 s per Suggest entry, median 9
      entries) are a fixed cost that only pays back on big jobs.'
    how: '<b>Times</b> are seconds from opening the panel to the choice (strategic) or from planner open to confirm
      (tactical), as the operator lived them — forced waits included. Medians per route × size with person-resampled
      intervals. <b>Model</b> (strategic): Gaussian GEE on log seconds with card × three-type, drones, game, session
      and minute held fixed, the person''s own card rate as a control; a log-scale coefficient converts to "% faster".
      All manual decisions (pre-emptive and after) are the comparison. Net time (forced reveal subtracted from card
      decisions) shown too: it flatters the card. Tactical: kept Suggest plans vs hand-built, within person, plan
      size held fixed.'
    chart: handover.speedSize
    numbers:
    - 'Strategic, seconds spent, card vs manual: three-type −27% [−35, −17], p < .001; one-type +22% [−3, +55],
      p = .09; difference between the two p < .001'
    - 'Net of the forced reveal: three-type −59%, one-type −35% (both p < .01) — the reveal is what erases the card''s
      edge on small missions'
    - 'Tactical, kept Suggest vs hand-built, plan size held: −14% [−26, +1], p = .06 (round 1 reported −16%, p =
      .023, with scenario rather than game held fixed); Suggest × plan size p = .13'
    - 'Tactical medians, hand vs kept Suggest: small 14.2 vs 14.9 s, mid 23.9 vs 21.5 s, large 44.6 vs 25.4 s'
    atoms:
    - speed-big-jobs
    codes:
    - C04
  - id: speed-model
    title: The speed difference as estimates
    text: 'The same comparison as model estimates: negative means the assistant route was faster for the same person.'
    how: As in the section above. Each row is a within-person % change in decision time with its 95% interval.
    chart: handover.speedModel
    numbers: []
    atoms:
    - speed-big-jobs
  - id: parallel
    title: While a Suggest plan fills in, operators start other missions
    text: 'After pressing Suggest the plan appears one drone-task entry per second and Deploy waits until it is
      done (the "fill": median 9 s). Operators use that time. Of the 486 plans where Suggest was pressed, 45% had
      the Strategic Assistant panel for another mission opened before the plan was confirmed, against 19% of the
      144 hand-built plans; 28% vs 11% actually allocated another mission in that time. About half of the Suggest
      cases (22% of Suggest plans) opened the other panel inside the fill window itself. The difference holds when
      planners open for the same length of time are compared (15–25 s open: 43% vs 5%).'
    how: '<b>Where "4.8×" comes from.</b> Round 1 (H9) took every confirmed tactical plan (630) and asked: between
      opening this planner and confirming it, did the operator open the strategic panel for a <i>different</i> mission
      ("interleaving")? Outcome yes/no. Predictor: Suggest pressed in this plan, within person (so each person''s
      Suggest plans are compared with their own hand-built plans). Held fixed: log plan size, log time the planner
      was open, scenario, session. The 4.8 is an <b>odds ratio</b>: the odds of interleaving are 4.8 times higher
      on a Suggest plan, for the same person, plan size and open time — not "4.8 times as many". In raw shares it
      is 45% vs 19%. <b>New checks</b>: the same with game instead of scenario and missions waiting held fixed;
      only plans opened while at least one other mission was waiting (otherwise there is nothing to start); edited
      Suggest plans dropped; without holding open time fixed (smaller, because hand plans that run long also interleave);
      and the outcome changed to actually allocating another mission. The "during the fill" share uses each Suggest
      press''s own window (press time to press + 1 s per entry). Direction of cause is open: pressing Suggest may
      free the time, or operators who want to move on may press Suggest.'
    chart: handover.parallel
    numbers:
    - 'Round-1 specification re-run: odds ×4.83 [2.24, 10.40], p < .001 (630 plans, 33 people) — reproduced exactly'
    - 'Only plans opened with ≥1 mission waiting: 54% vs 25%, ×5.48 [2.59, 11.62]'
    - 'Outcome = another mission actually allocated: 28% vs 11%, ×3.43 [1.57, 7.51], p = .002'
    - 'Without holding open time fixed: ×2.38 [1.16, 4.85], p = .017'
    - 22% of Suggest plans had another strategic panel opened inside the fill window itself
    atoms:
    - speed-parallel
