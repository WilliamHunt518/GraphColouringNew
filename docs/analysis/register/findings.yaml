  - id: c22
    title: Does 'I got better with practice' match the logs? For score yes; not for speed or assistant use
    text: 'Six people say they got better, faster or more confident (C22: P10, P11, P15, P21, P30, P32). All six
      raised their within-game score from session 1 to 2, against 10 of 27 others. Their tactical planning sped
      up more than others'' on average (5 of 6 faster), but not reliably; their strategic decisions did not speed
      up more. They also <b>did not come to use the assistants more</b>: strategy cards taken changed by −1 point
      (others −4) and Suggest by +11 points (others +7), with 3 of the 6 using each assistant more in session 2.
      Across all 33 people, a bigger score gain does not go with a bigger rise in either kind of use. So "got better"
      is right about outcomes, but it is not "relied on the assistants more".'
    how: 'Per person: session 2 minus session 1 in (a) score standardised within game, (b) log median net strategic
      time, (c) log median net tactical time, (d) share of strategy cards taken and (e) share of plans with Suggest
      pressed. For (d) and (e) each session''s rate is first taken relative to that game''s average rate across
      everyone, so playing a different game in session 2 does not count as a change of habit (raw changes agree).
      Group mean vs the other 27, two-sided permutation p (20,000 reshuffles). The across-everyone check is a Spearman
      rank correlation between score change and change in use (33 people). With P01/P02 left out of the game means,
      P21''s score change is slightly negative (five of six, not six).'
