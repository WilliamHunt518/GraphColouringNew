      the strategic assistant here I''ll use the tactical one after'' idea. Besides P21 (14:38, ''continuity'',
      the researcher''s word), the clearest are P10, three times (''Now I''m using the suggestion because I took
      the aggressive approach''; ''for the aggressive approach, anything but suggestion doesn''t really make sense'';
      and in the interview ''better to use tac agent when using the aggressive strat agent''), P05 (''I will then
