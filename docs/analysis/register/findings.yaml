  - id: deep
    title: 'Deep queues (4+ waiting): why the between-person picture points the wrong way'
    text: '17% of strategic decisions were made with four or more other missions waiting (25 of 33 people). Plain
      reading of this card: <b>across people</b>, those who often have deep queues rely LESS on the assistants —
      but that is because people who do big missions by hand are slower and build up their own queues, not because
      queues put them off. <b>Within a person</b>, their own deep-queue moments look like their shallow ones. It
      is the same null as above at the extreme, plus a warning about why between-person comparisons mislead here.'
    how: 'Each dot is a person: the share of their decisions made with 4+ waiting, against their overall rate. Spearman
      correlation across people. The within-person test is the GEE with ''deep'' (4+ waiting, yes/no) centred on
      each person''s own share, with the person''s share as a separate between-person term, plus mission, minute
      and game.'
