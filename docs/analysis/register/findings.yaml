  done: 'Added the graph you asked for (section 2): how long a mission had been left waiting against how likely
    it is handed over, on both tiers. <b>No sign of it.</b> On the strategic tier, missions left in the queue for
    two minutes or more get the card about as often as ones opened at once (adjusted 67% vs 63%; per doubling of
    the wait odds ×1.10, p = .17). On the tactical tier, a plan left open before the first action is, if anything,
    slightly <i>less</i> often handed to Suggest (80% at 0–5 s to 70% at 40 s+; odds ×0.80 per doubling, p = .12).
    So noticing they had left a card hanging does not seem to push people to the assistant; it fits the rest of
    this finding.'
- id: f-flaw-odd
  area: When the assistant gets it wrong
  title: The dip in strategy-card use belongs to the people who later said they noticed the illogical card, early
    in the session; it shows up whether or not they had met that card yet
  headline: 'The Conservative card sometimes adds a drone type the mission does not use (22% of decisions, nearly
    all on one-type missions); all 33 people met it, usually on their 1st or 2nd decision. The 15 who said they
    noticed it take the cards less afterwards, and on the flawed one-type missions they learn to skip them (0 takes
    in 13 by their 4th–6th such mission). But the <b>dip</b> in their use is not tied to the card. Counted simply
    by decision number, noticers take the cards on 80% of their 1st session-1 decision and 46–50% of decisions 3–5,
    then 83% at decision 6, while never-said people rise to 89–94% in the same stretch. People who played the tactical-heavy
    game first had <i>not yet met</i> an illogical card in decisions 3–5 (95% of those decisions came before it),
    and their noticers dip just as much (−21 points per person, against −32 for those who had met it; game order
    makes no difference, p = .79). In that stretch noticers look at the cards and turn them down, on three-type
    missions too. Pooled over everyone the dip disappears, because the two groups move in opposite directions. Noticers
    climb back later in session 1 (+24 points per person) and start session 2 lower again (49%), but never-said
    people also start session 2 a little lower, so a weaker carry-over for noticers is not something these data
    can show (difference at the break −6 points [−32, +20]). Our best reading: "noticed" marks people who scrutinise
    the cards, and the dip is that scrutiny at the first busy stretch of the study, not a reaction to the illogical
    card. What triggers it at that moment we cannot say: mission mix, load, reserve shortage and game do not account
    for it. Suggestive (15 vs 18 people, window read off the curve). This finding also holds, sidelined, the flaw-visibility
    comparison and the recovery material merged in from two other findings.'
