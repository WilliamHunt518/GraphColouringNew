  - id: dominated
    title: A card that is worse on its own numbers is not avoided
    text: 'Usually the two cards are a trade-off. Aggressive sends more drones and finishes sooner; Conservative
      sends fewer and is slower. Sometimes the trade-off vanishes. The Conservative card sends <i>at least as many</i>
      drones and its displayed finish time is <i>no sooner</i>, so on the two numbers it shows there is no reason
      to pick it. That is a <b>dominated</b> card. A typical one: Conservative 9 drones, Aggressive 8, both finishing
      at 65 s. This happens on 45% of all decisions (77% of one-type missions, where it mostly coincides with the
      illogical extra type, and 29% of three-type missions). On three-type missions, where nothing looks odd, people
      chose a dominated Conservative card 29% of the time and a fair-trade-off one 38%. Once mission size and game
      are allowed for, there is no sign they avoided it (odds ×1.19 [0.54, 2.63], p = .66), though the interval
      cannot rule out a moderate avoidance. On ''rarely compare both'': highlighting a card is the click that selects
      it. Both cards are always shown side by side, so the numbers can be read without clicking. People highlighted
      both cards on only 19 of 606 decisions (14 people), and 380 of 397 card takes highlighted only the card they
      took. Choosing looks driven by the label, not by comparing numbers across the two cards. A weakness you must
      work out by comparing goes unnoticed; one you can see on the card face (an unneeded type) is the one people
      reacted to.'
    how: 'From both cards'' true drone totals and displayed completion times in the last strategic_modal_opened
      before each choice: dominated = Conservative drones ≥ Aggressive drones AND Conservative time ≥ Aggressive
      time. This matches load_decisions'' flag exactly (44.6%). The model is a logistic GEE on three-type, non-residual
      decisions: chose Conservative ~ dominated + drones + tasks + game, people clustered. Bars: share of each choice,
      with 95% intervals from resampling people. Previews: distinct cards highlighted (strategic_card_previewed)
      before the choice.'
    chart: flaw.dominated
    numbers:
    - 'Dominated Conservative card on 45% of decisions: 77% of one-type, 29% of three-type'
    - 'Three-type: Conservative chosen 38% (trade-off, n 284) vs 29% (dominated, n 105); odds ×1.19 [0.54, 2.63],
      p = .66 (round 2 found 1.10 with other covariates)'
    - Both cards highlighted on 19 of 606 decisions (14 people); none highlighted on 174
    atoms:
    - cards-dominated-null
    tier: side
    role: archive
  - id: rates
    title: Abandonment by what Suggest said
    text: 'Every drone failure that needed the operator is one recovery episode. Grouped by what Suggest answered:
      a <b>wrong refusal</b> ended in abandonment 53% of the time (9 of 17). When Suggest gave a plan it was 6%
      (3 of 51), and when operators fixed things by hand without Suggest it was 13% (9 of 69). A <b>correct refusal</b>,
      where no fix existed with the drones on the mission, ended in abandonment every time (11 of 11), as it should.
      The striking row is the first one. These were saveable missions, and the same 14 people abandoned only 6 of
      their 61 other attempted fixable failures. Abandonment was not their habit; the refusal is what is different.
      When nothing at all was tried, every failure was abandoned or left open (35 + 11).'
    how: 'Recovery episodes are rebuilt by h3_recovery.load_all (194 episodes, 33 people). It is a time-local rebuild
      of which drones were on the mission, idle or executing, at each Suggest press. A press is a <b>refusal</b>
      when Suggest could not cover every task the operator''s live plan left short. A refusal is <b>wrong</b> when
      those tasks could have been covered by drones still on the mission, counting ones busy on another task (chaining
      them on). Suggest only offers drones that are not executing, which is its blind spot. An episode counts as
      a wrong refusal if it had at least one wrong-refusal press; as a correct refusal if it had refusals and none
      was wrong. Rates are abandoned ÷ (abandoned + recovered), with Wilson 95% CIs. The comparison counts wrong-refusal
      episodes against every other fixable episode where something was attempted (Suggest gave a plan, or hand edits):
      Fisher exact test, plus a GEE logit clustered by person (odds ratio 12 means the odds of abandoning were twelve
      times higher).'
    chart: recovery.abandonByType
    numbers:
    - 'Wrong refusal: 9 of 17 abandoned (53% [31%, 74%]), 14 people; all 17 fixable with drones on the mission'
    - 'Correct refusal: 11 of 11 abandoned (100% [74%, 100%]), 6 people'
    - 'Suggest gave a plan: 3 of 51 (6%); hand edits only: 9 of 69 (13%); nothing tried: 35 of 35 (+11 left open)'
    - 'Wrong refusal vs other attempted fixable failures: 9/17 vs 10/118; odds ×12.2, Fisher p < .0001; GEE ×12.3
      [3.2, 47.6], p = .0003'
    - 'The same 14 people on their other attempted fixable failures: 6 of 61 abandoned'
    atoms:
    - rec-blind-spot
    tier: side
    role: numbers
  - id: checking-after
    title: Do they check after a refusal? What the log shows between the refusal and the close
    text: 'The timeline puts every refusal episode on one row, with 0 as the moment Suggest first said no. The answer
      to the researcher''s question is in the top block. After a <b>wrong</b> refusal that ended in abandonment,
      not one operator dragged a drone in the planner. Three pressed Suggest again, got the same answer, and abandoned.
      None did anything on another mission in between, so they were not called away. 8 of the 9 abandoned within
      10 s of the first refusal, at a median 3.8 s after the last one. That is time for a glance, not a re-plan.
      The 8 who <b>did not</b> take the refusal at its word look completely different: 7 of 8 started dragging drones,
      took a median 21 s, and saved the mission. After a correct refusal people behaved the same way as after a
      wrong one (abandoned in a median 4.4 s, no drags). That is right in those cases, and it shows operators get
      no cue to tell the two apart: the message is the same either way.<br><br> The verified case: P19, session
      1, M003. Camera-2 failed. The Supply Drop needed a Camera. Two Lifters sat idle, and the only remaining Camera
      was busy on Search & Service, due to finish in about 45 s. Suggest said “No workable plan”, and the operator
      abandoned 3 s later. Chaining that Camera on would have saved it (checked frame by frame on the recording).
      P19 later blamed themselves for failed missions (C19). No wrong-refusal abandoner is among the three who blamed
      the assistant (C20).'
    how: For each refusal episode the analysis takes the time of the first refusal and lists every logged operator
      action from then until the mission was abandoned or redeployed. That includes drags in the recovery planner
      (tactical_assignment_changed), further Suggest presses, and any action on another mission (strategic decisions,
      tactical confirms, recalls, other recoveries), from the raw event log. "Checked" here can only mean a <i>logged</i>
      action. Looking at the strategic map or the planner leaves no trace, so a fast abandonment could still hide
      a quick look, and the narration recordings are the place to check that. Seconds are session time; the session
      pauses if the primary window is hidden, so these are real play seconds.
    chart: recovery.refusalTimeline
    numbers:
    - 'Wrong refusal → abandoned (9 episodes, 8 people): drags after the refusal 0 of 9; re-pressed Suggest 3 of
      9; actions elsewhere 0 of 9; dragged before the refusal 0 of 9'
    - 8 of 9 abandoned within 10 s of the first refusal; median 6.8 s from the first refusal, 3.8 s from the last
    - 'Wrong refusal → fixed (8 episodes, 7 people): 7 of 8 dragged drones after; median 20.9 s to deploy'
    - 'Correct refusal → abandoned (11, 6 people): 0 drags after, 3 retries, median 4.4 s from the last refusal'
    - 'Verified: P19 s1 M003, abandoned ~3 s after the refusal'
    atoms:
    - rec-blind-spot
