  - id: own-failures
    title: A bad first session with the cards does not explain who loses strategic trust
    text: 'If strategic trust fell because people had bad experiences with the cards, then those who met more illogical
      cards in session 1 should lose more trust. They do not. The raw correlation even points the other way (ρ =
      +.40), but that comes entirely from scenario order: people who played Strategic Heavy first see the odd cards
      early and lose the least trust (−0.29 against −1.26 for those who played it second). Once order is held constant,
      the correlation is +.14 (p = .42). Round 1''s pre-registered version (missions that failed after a card) was
      also null: ρ = −.05 [−.39, .30]. Read this as "no evidence that how much went wrong drives it", not as proof
      that experience doesn''t matter.'
    how: One row per person (33). The predictor is the count of decisions in session 1 where an illogical strategy
      card was on screen (from load_decisions' odd flag). The outcome is session-2 minus session-1 strategic trust.
      Spearman ρ uses a 4000-draw seeded bootstrap CI. The partial version ranks both variables, removes the part
      explained by which scenario was played first, and correlates what is left. The ρ = −.05 is H5's primary test
      (docs/analysis/round1/h5_trust_drop.md).
    numbers:
    - 'Illogical cards seen in session 1 vs change in strategic trust: ρ = +.40 [+.03, +.70], p = .02 — order artefact'
    - 'Same, holding scenario order fixed: ρ = +.14, p = .42'
    - Mean change in strategic trust −0.76; Strategic Heavy first −0.29, Tactical Heavy first −1.26
    - 'H5 primary (card failures in session 1): ρ = −.05 [−.39, .30]'
    atoms:
    - trust-own-failures-null
    tier: side
    role: numbers
  - id: stated
    title: What they said agrees with what they rated
    text: In the debriefs and interviews, 17 operators named the Tactical Assistant as the one they preferred or
      trusted, 7 the Strategic one, and 9 gave a conditional, "both" or no answer. Those who said tactical had a
      questionnaire gap of +1.36 on average; those who said strategic were at −0.04. For 18 of the 24 who named
      one side, the questionnaire points the same way. The coding is from one coder (an AI model) and has not been
      second-coded, so treat the counts as suggestive.
    how: Stated preference is the round-2 coding of each person's debrief and interview (docs/analysis/round2/wE_codes.csv,
      field pref). Its sign test asks whether 17 of 24 is more lopsided than a coin toss (exact binomial, two-sided,
      p = .064). The other test compares the questionnaire gap of tactical-sayers with strategic-sayers (Mann–Whitney,
      p = .033). Round 1's independent coding agreed poorly with it (κ = .27), and round 2's κ = .96 came from the
      same AI model. A human second coder is still needed (meth-qual-coder).
    chart: recovery.prefGap
