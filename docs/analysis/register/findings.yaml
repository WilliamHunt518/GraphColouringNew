    title: Where manual builds sit relative to the two cards
    text: 'Mostly below both cards or equal to one of them, rarely above. Pre-emptive builds — made without seeing
      the cards — land equal to a card total more often than builds made after seeing them (39% vs 27%), so ''equal
      to a card'' is partly just the obvious allocation, not copying. Part of that gap is the missions: pre-emptive
      builds were on smaller, more often one-type missions. Balanced for the mission (second view), it is 37% vs
      29%, too close to tell apart.'
