  - id: card
    title: What the illogical card is, and when people first met it
    text: 'The Conservative strategy tops up every drone type with 15% of the spare reserve, including types the
      mission never uses. This is a deliberate, known feature of the build (STUDY_BUILD §19), not an injected error,
      and no injected errors ran for anyone analysed. So on a mission that needs only Fast drones, the Conservative
      card can also send a Lifter and a Camera. This happened on <b>132 of 606</b> strategic decisions: 129 on one-type
      missions, 3 on two-type missions and none on three-type missions. Everyone met it early: <b>17 of 33</b> on
      their 1st or 2nd strategic decision of the study, and 9 not until session 2. For most people, then, ''before
      the card'' is just one or two decisions at the very start, when they are still learning the task. That limits
      every before/after comparison below.'
    how: 'Rows: every strategic decision (P09 excluded), in study order across both sessions. A decision is ''illogical''
      when the Conservative card''s true drone counts include a type for which the mission''s tasks need 0 drones
      (build_findings_synthesis.load_decisions, the odd flag). The anchor is each person''s first such decision.
      The chart counts which decision number that was.'
    chart: flaw.timing
    numbers:
    - 132 of 606 decisions (21.8%) carry the illogical card; 129 are on one-type missions
    - 'First illogical card: median the person''s 2nd decision; 17 of 33 meet it on decision 1 or 2; 9 not until
      session 2'
    - 'Three-type decisions before it: median 1 per person; 3 people have none'
