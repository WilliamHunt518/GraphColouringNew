# Findings -- the review units from pass 2 on (Results/findings_review.html).
#
# Each finding is one page: a headline and several sections, each with its own chart, a plain
# "how this was worked out", the figures, the pass-1 cards (atoms, in cards.yaml) it stands for and the
# qualitative codes whose quotes support it. An atom may sit in more than one finding; a section repeated
# in another finding is marked `sharedWith`. `replies` answer the researcher's pass-1 note on each atom.
# From pass 3: `tier: side` puts a section (or a whole finding) in the sidelined panel; `role` is Claude's suggested
# paper role (paper | numbers | extra | archive), which the researcher confirms on the page; `reply` answers the
# previous pass's note on that finding/section; `was` names the finding#section a moved section came from (its
# old notes are looked up under that key).
# From pass 4: `role_set: true` means `role` is the researcher's own pick (shown solid); `status: retired` moves a
# finding to a Retired group at the bottom of the list. `reply` only ever answers the immediately previous pass.
# Charts are drawn by scripts/register/pass2/<area>.charts.js from docs/analysis/register/pass2/<area>.json,
# which scripts/register/pass2/<area>.py writes.
#
# Assembled 2026-10-12 by scripts/register/assemble_findings.py from the pass-2 area fragments; edited directly
# between passes after that. Never rename an id -- responses key on it.

findings:
- id: f-about
  kind: intro
  area: Start here
  title: 'Start here: the study and the platform'
  headline: 'What a participant did, what was on their two screens, what the two assistants did, and what the words
    in the findings mean. Each part has a short clip from a real session: use the buttons above a clip to show both
    screens or just one.'
  links: []
  sections:
  - id: task
    tier: main
    title: The task in one paragraph
    text: 'Each participant played a search-and-rescue operator directing a fleet of 33 drones: 11 <b>Fast</b>,
      11 <b>Lifter</b> and 11 <b>Camera</b> drones (Fast is quickest, Camera slowest). Missions keep arriving on
      a map. For each one the operator makes two decisions: <b>how many drones of each type to send</b> (the <i>strategic</i>
      decision) and <b>which drone does which task, in what order</b> (the <i>tactical</i> decision). An assistant
      can do each one: the <b>Strategic Assistant</b> offers two ready-made allocations (''strategy cards''), and
      the <b>Tactical Assistant</b> fills in a plan when the operator presses <b>Suggest</b>. Using either is always
      optional. Drones sometimes fail mid-mission and the operator has to repair the plan or abandon the mission.
      The score is the points for finished tasks minus a penalty that keeps growing while missions are unfinished,
      so speed matters as well as getting it right.'
  - id: screens
    tier: main
    title: Two screens
    text: 'The platform runs on two monitors side by side. The <b>strategic screen</b> (left) has the queue of waiting
      missions down its left edge (each a card with its tasks, an Allocate button and a red penalty bar that grows
      while it waits), the map with every mission zone and drone, and the reserve count at the top. The strategy
      cards appear under a mission when the operator allocates it. The <b>tactical screen</b> (right) is the planner:
      once a mission has its drones, they appear beside the mission zone and the operator assigns them to the tasks,
      or presses Suggest. It is also where failures are repaired. Below are two examples of the same steps: first
      an operator doing everything by hand, which shows what each screen is for, then one using both assistants.
      Each clip can show either screen alone or both.'
    done: 'Done: this section now shows two clips in that order. First P22 doing a mission entirely by hand (setting
      the counts, then dragging each drone onto a task), then P10 using both assistants (a strategy card, then Suggest).
      The by-hand clip now comes first everywhere the pair appears, including the next section and the On screen
      tab, and is labelled Route 1. The queue clip moved to the workload finding only.'
  - id: missions
    tier: main
    title: Missions, tasks and drone types
    text: 'A mission has 2–6 tasks. Each task type needs a fixed team, shown on its badge: <table class=''mini''><tr><th>Task</th><th>Needs</th><th>Points</th></tr>
      <tr><td>Recce</td><td>1 Fast</td><td>20</td></tr> <tr><td>Recon</td><td>2 Fast (or 1, slower)</td><td>40</td></tr>
      <tr><td>Supply Drop</td><td>2 Lifter + 1 Camera (or 1 + 1, slower)</td><td>60</td></tr> <tr><td>Precision
      Supply Drop</td><td>1 Lifter + 2 Camera (or 1 + 1, slower)</td><td>80</td></tr> <tr><td>Search &amp; Service</td><td>1
      Fast + 1 Lifter + 1 Camera</td><td>100</td></tr></table> So a mission can need one drone type (e.g. only recce:
      all Fast) or all three. A mission''s <b>category</b> (A Routine, B Moderate, C Significant, D Critical, E
      Mass Casualty) sets how fast its penalty grows, from 0.05 to 0.40 points a second. When the findings talk
      about <b>mission size</b> they mean <b>the number of drones the mission needs</b>: the sum of its task badges,
      the same for everyone who met that mission.'
    numbers:
    - Points per finished task 20 / 40 / 60 / 80 / 100 by type (half that in the earliest builds, up to study-v1.2);
      the penalty runs from a mission's arrival until each of its tasks is finished.
  - id: decisions
    tier: main
    title: The two decisions, and the two routes through them
    text: '<b>Strategic.</b> The operator clicks Allocate on a mission. Two strategy cards load, each after about
      4–5 seconds: <b>Aggressive</b> (every task at once, with a spare of each type used) and <b>Conservative</b>
      (a spare of every type, tasks mostly one after another). The operator deploys a card, or chooses <i>Set manually
      instead</i> (also possible before the cards have loaded) or <i>Edit this allocation</i> and sets the counts
      themselves. The drones leave the reserve and fly out straight away, waiting at the zone. <b>Tactical.</b>
      The planner opens empty. The operator drags each drone onto a task (shift-drag chains it on to a next task),
      or presses <b>Suggest</b>, which fills in the assistant''s plan one drone per second; they can change it,
      then confirm. The first clip shows both decisions made by hand (here before the cards had even loaded); the
      second shows a card followed by Suggest, the route most people take on big missions.'
  - id: wrong
    tier: main
    title: What can go wrong
    text: '<b>Drone failures.</b> Any deployed drone can fail. The planner then switches to recovery (red banner):
      the operator reassigns the drones left on the mission, presses Suggest for a repair, or abandons the mission,
      whose unfinished tasks go back into the queue as a new mission (its id gets ''-R''), so the work is not lost.
      <b>The assistants'' own flaws.</b> Neither assistant had errors injected for anyone analysed. But each has
      a built-in quirk the findings return to. The Conservative card adds a spare of <i>every</i> drone type, including
      types the mission never uses (the <b>illogical card</b>: e.g. a Camera on an all-Fast mission; 132 of 606
      strategic decisions). And recovery Suggest ignores drones that are busy on another task, so it can answer
      ''No workable plan'' when a fix exists (a <b>wrong refusal</b>).'
  - id: procedure
    tier: main
    title: What each participant went through
    text: Consent; a short 'about you' form with three attitude-to-AI scales (AIAS-4, plus bespoke scales on how
      much they check and what they would delegate; builds from study-v1.3); a guided tutorial (48 steps, doing
      everything by hand first, the two assistants only after); <b>session 1</b> (8 minutes); questionnaires (NASA-TLX
      workload, trust in each assistant, technology acceptance); a 30-second break; <b>session 2</b> (8 minutes);
      the same questionnaires; then a debrief interview. They talked aloud while playing and the researcher sometimes
      asked a question mid-game (quotes that answer one are marked 'after a leading question'). Screens and voice
      were recorded, which is where the quotes and clips come from.
    numbers:
    - 'Two scenarios, one per session, in counterbalanced order (17 people each way): <b>Strategic Heavy</b> sends
      many small missions (13–14 a session, about 6.5 drones each), <b>Tactical Heavy</b> fewer, larger ones.'
    - 'Everyone played fixed mission streams: four ''games'' (two per scenario) that differ in workload; which pair
      a person met depends on when they took part, so the analyses hold the game fixed.'
    - 34 people took part; 33 are analysed (P09 ran with injected assistant errors and is excluded). The build was
      updated during data collection (study-v1.0 to v1.13, most sessions on v1.12); docs/STUDY_BUILD.md lists what
      changed.
  - id: words
    tier: main
    title: How to read the findings
    text: '<b>Took a card</b>: a strategic decision deployed from a strategy card as offered. An allocation that
      started from a card but was edited counts as <b>by hand</b>. <b>Pressed Suggest</b>: Suggest was used at least
      once in that tactical plan. <b>Handed over</b> covers both. <b>Within person</b> means comparing each person
      only with themselves (their big missions with their own small ones), so habits that differ between people
      do not count as an effect. <b>Adjusted</b> means the observed rate minus what the mission, the minute of the
      session, the game and the person alone would predict. <b>Game held fixed</b>: comparisons are made within
      each of the four games. Each section ends with what people said (summaries, quote cards you can highlight)
      and, where it helps, a clip from the recordings.'
- id: f-personal-style
  area: Who the operator is
  title: Each operator has a personal style — individual, not a type
  headline: 'Operators differ a great deal in how they use the assistants, and the differences are personal. We
    describe each session by ten habits (how often a strategy card is taken, how often Suggest is pressed, how long
    a decision takes, and so on). From those habits alone, a person''s second session resembles their own first
    (median profile r = .48) and essentially nobody else''s (r = −.01): their own session is in the closest three
    of 33 four times as often as chance (41% vs 9%), although the second session is a different scenario, and who
    the operator is explains about six times more of card-taking than the mission does. Six of the ten habits carry
    over clearly; one (topping up drones on single-type missions) does not at all. Between people, use of the two
    assistants is only loosely linked (ρ ≈ .35), so leaning on one is not a fixed part of one overall "delegate"
    strategy (though within a person the two do rise and fall together from session to session). The styles do not
    fall into types, and nothing measured beforehand (attitude to AI, views on human authority, experience) predicts
    them. Strong evidence for a stable personal style; good evidence against types; "no evidence" (not "evidence
    of no effect") for disposition.'
  confidence: strong
  absorbs:
  - style-fingerprint
  - style-trait
  - style-retest
  - style-preempt-trait
  - style-axis
  - style-types-null
  - style-archetypes
  - style-disposition-null
  - ask-views-null
  - style-trust-link
  - q-C01
  - q-C02
  sections:
  - id: habits
    tier: main
    role: numbers
    title: The habits we grade them on
    chart: style.habits
    text: 'To compare styles we describe every 8-minute session by ten habits, each something the logs record at
      every decision. Seven concern the strategic tier (the strategy cards): how often a card is taken as offered;
      how often cards are previewed before choosing; how long a decision takes; whether, when building by hand,
      the operator does it before the cards have even appeared; whether a card is edited before committing; and
      how many drones are committed compared with the cautious Conservative card, on single-type and on multi-type
      missions. Three concern the tactical tier (Suggest): how often Suggest is pressed on a plan, whether a suggested
      plan is deployed unchanged, and whether Suggest is pressed when recovering from a failure. The chart shows
      each habit''s spread over all 66 sessions in its own units. Most habits vary enormously between sessions (card
      uptake runs from 0% to 100% of a session''s decisions); two are nearly universal (most sessions keep every
      suggested plan unchanged, and most never edit a card). The right-hand column previews the next results: how
      strongly each habit carries over from a person''s first session to their second.'
    how: 'Rows: 66 sessions (33 people × 2; P09 excluded). Each habit is a share or an average over that session''s
      decisions (hover a habit name for its exact definition and denominator, or open "What each habit is"). A habit
      with nothing to count in a session is undefined there: going manual before the cards (no hand-made decisions)
      in 15 sessions, drones on single-type missions (no single-type mission opened) in 19, Suggest in recovery
      (no failures) in 4, keeping the Suggest plan (Suggest never pressed) in 2. For the profiles these are filled
      with the median of that game. Decision time is analysed as log(1 + seconds) and shown in seconds. For the
      comparisons that follow, each habit is turned into a z-score among the sessions of the same game (each of
      the four fixed games), so a profile says how a person compares with others who faced the same missions. The
      ten habits were fixed in round 1 (H1) before any grouping was tried; outcomes (score, trust, questionnaires)
      are never among them. ρ = Spearman correlation between a person''s session-1 and session-2 values, game-adjusted
      (see "How far each habit holds").'
    numbers:
    - 'Card taken as offered: median 67% of a session''s strategic decisions (middle half 47–91%, range 0–100%)'
    - 'Suggest pressed: median 86% of tactical plans (55–100%); suggested plan kept unchanged: median 100% (middle
      half 100–100%)'
    - 'Decision time beyond the card wait: median 6.5 s (5.4–10.3 s, range 1.6–43 s)'
    - 'Card edited before committing: median 0% (most sessions never); going manual before the cards appear: median
      50% of hand-made decisions (0–75%)'
    - 'Drones vs the Conservative card: single-type −0.5 (−1.25 to 0); multi-type +0.6 (−0.1 to +1.3)'
    role_set: true
    qual:
      summary: 'Asked to describe their approach, 15 of 33 named a consistent strategy of their own (C01). In their
        own words it is mostly about the habits graded here: whether they wait for the cards or go manual before
        they load (P21, P32), whether they trim or edit a card, whether they start from Suggest and touch it up
        (P31, P21), and how they check (P14, P17). Few described a rule for when to press Suggest. Most said they
        pressed it on nearly everything.'
      featured:
      - qa:qa-P13-01
      - qa:qa-P21-02
      - qa:qa-P31-01
      - qa:qa-P14-02
      more:
      - ev31
      - ev45
      - ev19
      - ev7
      - ev198
      - ev248
      - qa:qa-P32-04
      - qa:qa-P21-08
      - qa:qa-P24-02
      - qa:qa-P17-01
      - qa:qa-P07-01
      - ev3
    codes:
    - C01
    - C06
    - C09
    - C10
    - C18
  - id: fingerprint-ranks
    title: Where each person's own session ranks
    text: Each person's ten-habit profile from session 1 is compared with all 33 session-2 profiles, and the 33
      are ranked from most to least alike (and the same the other way round, session 2 among the session 1s). If
      habits were not personal, a person's own other session would be equally likely to land anywhere in that ranking
      (dashed line). Instead it is the single closest match 12 times out of 66 (2 expected by chance) and in the
      closest three 27 times (6 expected), even though the second session is a different scenario. Use the toggle
      to see that it still holds with the reliance axis taken out, so a style is more than how much someone leans
      on the assistants.
    how: 'Rows: 66 sessions (33 people × 2). Each session is the ten habits of the first section, each turned into
      a z-score among the sessions of the same game, so a profile says how this person compares with others who
      played that game. "Alike" = straight-line (Euclidean) distance between two ten-habit profiles. 66 look-ups
      (33 people, both directions); under chance every rank 1–33 is equally likely, so the dashed line is 66 × (ranks
      in the bin) / 33. The p-value shuffles who-is-who among the session-2 profiles 10 000 times. "Reliance axis
      removed" subtracts each profile''s score on the first principal component (see the axis numbers) before comparing.'
    chart: style.fingerprintRanks
    numbers:
    - 'Own session ranked 1st: 12 of 66 look-ups vs 2 expected; in the closest three: 27 vs 6 (41% vs 9%); permutation
      p < .001'
    - Average rank of own session 8.2 of 33 (chance 17.0); with the reliance axis removed 10.1 (p < .001)
    - 'Profile correlation with own other session: median r = .48; with other people''s: median r = −.01; own closer
      for 29 of 33'
    atoms:
    - style-fingerprint
    tier: main
    role: paper
    role_set: true
    qual:
      summary: 'Nobody was asked to compare their two sessions directly. In the think-aloud, though, several people
        open session 2 with the same move and say the same thing as in session 1: P29 ''start conservative'' and
        does single-colour missions by hand, P11 builds all-blue missions themself, P21 hand-builds in parallel.
        That fits a recognisable personal style. The people who said they changed are in the retest section.'
      featured:
      - qa:qa-P29-02
      - qa:qa-P11-02
      - qa:qa-P21-03
      - qa:qa-P10-03
      more:
      - qa:qa-P29-01
      - qa:qa-P11-01
      - qa:qa-P21-01
      - qa:qa-P10-04
    codes:
    - C01
  - id: who-vs-what
    title: Who decides matters more than what is being decided
    text: 'Card uptake runs from 8% to 100% across people (median 61%). Knowing <i>who</i> is deciding predicts
      whether a card is taken about six times better than knowing everything about the mission and when it arrived.
      In plain terms: shown two decisions, one where a card was taken and one where it was not, and told only who
      made each, you would pick the right one 75% of the time (a coin: 50%; knowing only the mission: 63%). A person''s
      session-1 rate on its own still does it 71% of the time for their session-2 decisions.'
    how: '606 strategic decisions. Three logistic models of "card taken": (a) mission and timing only — drone types
      needed, drones needed, scenario, session 1 or 2, decision number; (b) the person only (one term each); (c)
      both. McFadden pseudo-R² = how much each improves on predicting the overall rate for everyone (0 = no better,
      1 = perfect). Descriptive, not a test: with ~18 decisions each, the person-only model flatters itself a little;
      refitted 200 times with the person labels shuffled it scores 4% on average, so about 20 of its 24 points are
      real. Retest of raw card uptake session 1 vs 2: ρ = .57 (.62 once game-adjusted, next section). <b>In plain
      terms</b> (the second view): AUC = the chance a model ranks a random card-taken decision above a random not-taken
      one. The person enters as their rate on all their OTHER decisions (on the log-odds scale), so no decision
      predicts itself; ''session 2 from session 1'' uses only each person''s session-1 rate. Intervals: people resampled
      1,000 times, predictions held fixed.'
    chart: style.whoVsWhat
    numbers:
    - 'Pseudo-R²: mission + timing 4%; person 24%; both 30%'
    - Card uptake per person 8%–100%, median 61%; 6 people ≥ 90%, 3 people ≤ 25%
    - 'Telling a taken from a not-taken decision (AUC): mission and timing 63% [57%, 68%]; the person, from their
      other decisions, 75% [64%, 81%]; both 80% [74%, 86%]; session-2 decisions from the session-1 rate alone 71%
      [61%, 80%] (321 decisions).'
    - 'Right-or-wrong guessing: always ''card'' 66%; mission 65%; person 70%; both 77%.'
    - 'Person-only pseudo-R² with the person labels shuffled: 4% on average (95th percentile 6%), against 24% observed.'
    atoms:
    - style-trait
    tier: main
    role: paper
    role_set: true
    qual:
      summary: 'People often described their use of the assistants as part of who they are: ''naturally conservative''
        (P32), ''I''m more conservative'' (P26), ''I always let the agent do it first'' (P13). At the extremes,
        P14 used the assistants ''for almost every allocation'' and P16 ''manually overrode most of the time''.
        Against this, several gave the situation as the reason: workload (P32, 9 of 33 coded C11), being resource-constrained
        (P22), mission size (C03). P32 calls themself ''naturally conservative'' and also says their use was ''very
        much about workload'', so a person''s style and the situation are both in play.'
      featured:
      - qa:qa-P32-01
      - qa:qa-P14-01
      - qa:qa-P16-01
      - qa:qa-P13-01
      more:
      - qa:qa-P26-01
      - qa:qa-P32-05
      - ev222
      - ev47
      - ev19
      - ev248
      - qa:qa-P21-01
    codes:
    - C01
    - C02
    - C11
    done: 'You asked whether 30% means people are predictable, and how good that is. Pseudo-R² is hard to read on
      its own, so the chart now has a second view, <b>In plain terms</b>. It asks each model to tell apart a decision
      where a card was taken from one where it was not. A coin gets this right 50% of the time. Knowing only the
      mission and its timing: 63%. Knowing only who is deciding, taken from their <i>other</i> decisions so nothing
      predicts itself: 75%. Both: 80%. The strictest test uses nothing but each person''s session-1 rate to sort
      their session-2 decisions: 71% [61%, 80%]. <b>So yes, people are predictable</b>: who someone is predicts
      their card-taking well above chance and well above the mission, and it carries from one session to the next.
      But it is far from certain. Most people take cards at an in-between rate (median 61%), so even perfect knowledge
      of a person''s rate leaves each of their decisions partly a coin flip. That limit applies to any model, which
      is why no score here gets near 100%. Three notes on the 24%. (1) With the person labels shuffled at random,
      a one-term-per-person model still scores 4% from nothing, so about 20 of the 24 points are real. (2) The three
      numbers are not shares of one total: the person alone 24%, the mission alone 4%, both 30%. So the person adds
      26 points over the mission, and the mission adds 6 over the person. (3) As a yardstick, McFadden (who devised
      the measure) called 0.2–0.4 an excellent fit; it runs much lower than an ordinary R². Plain right-or-wrong
      guessing barely moves (70% vs 66%), because 66% of decisions took a card and ''always card'' is already right
      that often. The ranking test is the one to read.'
  - id: retest-summary
    title: How far each habit holds from one session to the next
    text: 'One line per habit: how strongly a person''s place on that habit in session 1 predicts their place in
      session 2 (ρ; 0 = no carry-over, 1 = same order of people). Six of the ten carry over clearly and survive
      correction for testing ten (coloured). Editing cards, going manual before the cards load and topping up drones
      on multi-type missions carry over weakly, and topping up drones on single-type missions does not carry over
      at all (ρ −.09). "Keeps the Suggest plan" is high partly because 24 of 33 people kept every Suggest plan in
      both sessions.'
    how: 33 people. For each habit, Spearman ρ between session-1 and session-2 values, each first z-scored within
      the game played; 95% intervals from resampling people 2000 times; Holm correction across the ten. The same
      ρ values are the right-hand column of the habits chart in the first section.
    chart: style.retestDots
    atoms:
    - style-retest
    tier: main
    role: paper
    role_set: true
    qual:
      summary: 'Some people say they kept their approach and some say they changed it. P18 ''sort of changed from
        the first one'' (led) and P30 ''used more personalized'' in session 2. Four people describe a real shift
        in the think-aloud: P06 and P31 came to rely on the assistants more and check less, while P35 and P15 went
        back to deciding for themselves after the strategy cards made errors. That fits habits that carry over clearly
        but not completely.'
      featured:
      - qa:qa-P06-01
      - qa:qa-P35-01
      - qa:qa-P31-03
      - qa:qa-P30-05
      more:
      - ev101
      - qa:qa-P06-02
      - qa:qa-P31-06
      - qa:qa-P28-03
      - ev84
    codes:
    - C01
    - C15
    - C16
    - C22
  - id: axis
    title: The biggest single dimension of style is reliance — what that axis is
    text: 'A principal component is one score per person built by weighting all ten habits, with the weights chosen
      so that this single score captures as much of the differences between people as any one number can. It is
      <b>not</b> a comparison of strategic against tactical use. A <b>loading</b> is the correlation between one
      habit and that score: +.92 for "takes the strategy card" means people with a high score are almost exactly
      the people who take many cards; +.62 for "presses Suggest" means they also tend, less tightly, to press Suggest;
      −.48 for decision time means they decide faster. So the axis is "leans on both assistants and moves quickly".
      It captures 31% of the differences; it is the largest of three dimensions, not the only one — which is why
      the fingerprint survives its removal.'
    how: Per person, the ten habits pooled over both sessions, standardised; principal component analysis; first
      component oriented so higher = more card-taking. Loading = component weight × √eigenvalue = correlation of
      habit with score. Three components have eigenvalue > 1 (Kaiser). Session-level scores on the same axis (habits
      standardised within session × scenario) give the session 1 vs 2 ρ.
    chart: style.axisLoadings
    numbers:
    - Axis captures 31% of the between-person spread (eigenvalue 3.1 of 10); three dimensions pass Kaiser (31%,
      19%, 17%)
    - 'Loadings: takes card +.92, previews +.88, Suggest on plans +.62, drones on single-type +.50, Suggest in recovery
      +.46, keeps Suggest plan +.42, decision time −.48, manual before cards −.34'
    - The axis score correlates r = .92 with card uptake alone, i.e. card uptake by itself accounts for 85% of the
      variation in the score
    - 'Second dimension (19%): commits more drones than the Conservative card (+.73 multi-type, +.66 single-type)
      and uses Suggest less (−.56). Third (17%): edits cards (+.88), rarely goes manual before the cards load (−.58)'
    - 'Session 1 vs 2 on the axis: ρ = .65 [.38, .82]'
    atoms:
    - style-axis
    tier: side
    role: archive
    role_set: true
  - id: axis-scatter
    title: Strategic and tactical reliance go together only loosely between people
    text: 'Each dot is a person: x = share of strategy cards taken, y = share of tactical plans where Suggest was
      pressed. Between people the two are only weakly linked (ρ = .37, and .33 once each is measured against others
      who played the same game): plenty of people press Suggest on almost every plan while taking only half the
      cards, so knowing how much someone relies on one assistant tells you little about the other. Part of the reason
      is a ceiling: Suggest is pressed on a median 86% of plans. The second view asks a different question: when
      the <i>same</i> person takes more cards in one session than the other, do they also press Suggest more? Yes
      (ρ = .51). So use of the assistants is not one fixed trait spanning both tiers, but within a person there
      is a session-level "leaning on the assistants today" that moves both together.'
    how: 'Between people: one value per person, both sessions pooled (n = 33), Spearman ρ with a Fisher interval;
      the game-adjusted version first subtracts the mean of everyone who played the same game from each session,
