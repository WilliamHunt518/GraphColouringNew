  - id: not-types
    title: Individual, not types
    text: Distinct people, but not distinct kinds of people. If there were types (say "delegators" and "hand-builders"),
      people would sit in clumps with gaps between them, and splitting them into groups would find clean, well-separated
      groups. Three plain checks say they do not. <b>(1) The map:</b> placed by their two biggest habit dimensions,
      the 33 operators form one continuous cloud; it looks just like 33 simulated operators that have no types by
      construction, and the best two-group split simply cuts the cloud in half. <b>(2) Separation:</b> however many
      groups we ask for (2, 3 or 4), the real people separate no better than the no-types simulations do, and every
      value is below the usual threshold for real group structure. <b>(3) Recurrence:</b> grouping each session
      separately, the same people barely end up together twice, no more than in a smooth cloud where people keep
      their place. The archetype names (Delegator, Deliberate builder, Fast tinkerer) are best kept as labels for
      the ends of the main dimensions.
    how: 'Rows: the 33 people, each described by the ten habits pooled over both sessions and standardised. Grouping
      = k-means (the computer splits people into k groups so that each sits as close as possible to its group''s
      centre; best of 20 starts). Separation = silhouette: for each person, how much closer they are to their own
      group than to the nearest other group, averaged (1 = tight clumps far apart; 0 = boundaries arbitrary; below
      .25 is conventionally "no substantial structure", Kaufman &amp; Rousseeuw). Benchmark = 500 simulated samples
      of 33 operators drawn from one smooth cloud with the same distribution of each habit and the same correlations
      between habits as the real people, so they have no types by construction. (We use these rather than simply
      shuffling each habit, because shuffling also destroys the links between habits, and a cloud of linked habits
      separates slightly better than shuffled data without having any types: shuffled data give about .14.) Recurrence:
      each session''s profiles (z-scored within game) are grouped separately and compared with the adjusted Rand
      index (1 = the same groupings, 0 = chance), against (a) shuffled labels and (b) 500 simulated pairs of sessions
      with no types but the same session-to-session stability of every habit as the real people. The map uses the
      first two principal components (50% of the differences). Round 1''s pre-registered test (mixture models compared
      by BIC) and the archetype simulations (extras2) reach the same conclusion; their numbers are kept below.'
    chart: style.typesSimple
    numbers:
    - 'Separation (silhouette), real vs no-types simulations: 2 groups .17 vs .20 [.14, .31]; 3 groups .18 vs .19
      [.14, .27]; 4 groups .20 vs .19 [.13, .25]; a no-types sample separates at least as well 84%, 58% and 26%
      of the time'
    - 'Groups in session 1 vs session 2 (ARI): 2 groups .08, 3 groups .09; a stable no-types cloud gives .13 on
      average (95% of simulations −.03 to .47 for 2 groups, −.02 to .40 for 3), at least as high as the real value
      about 55% of the time; shuffled labels give up to .12–.13'
    - 'Round 1: two groups vs one, ΔBIC 1.9 (needed > 10; 42% of no-type simulations did at least as well)'
    - 'Archetypes (extras2): three explain 46% vs 43–59% in the no-types continuum (p = .83); same archetype both
      sessions 61% vs 30–79% (p = .32)'
    atoms:
    - style-types-null
    - style-archetypes
