      table as the size and speed findings, oldest-first from the queue choice decisions, trust as the mean of the
      session ratings, and the pre-study questionnaire (experience items scored none 0 to extensive 3). P36''s percentile
      rank among the 33 (ties share the middle). Typical = middle half; leans = 10th–25th or 75th–90th; unusual
