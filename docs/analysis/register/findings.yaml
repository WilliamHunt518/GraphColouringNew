  - id: calibration
    title: The size rule does not sharpen with practice
    text: 'If practice taught operators where the assistant pays, the gap between big and small jobs would widen
      in session 2. It does not, on either tier: strategic +25 points in session 1, +15 in session 2; tactical +16
      then +14. Within a session the tactical gap even narrows slightly with time (one of five tests, p = .047,
      likely noise). The rule is there from the first session and stays put — another sign of a stable personal
      style rather than something learned.'
    how: 'Gap = hand-over rate on big jobs minus small jobs (strategic: three-type minus one-type missions; tactical:
      plans above minus at/below the median size), per session, with person-resampled intervals. Tests: logistic
      GEE with size × session (strategic, all sessions and Strategic Heavy only; tactical) and size × minute of
      session (both tiers). A ratio of odds ratios above 1 would mean the rule sharpens. Caveat from round 2: one-type
      missions occur almost only in Strategic Heavy, so the strategic session comparison is partly between people
      who played that scenario first or second. "No evidence of sharpening", not proof that none happens — the intervals
      still allow a modest change either way.'
    chart: handover.learnGap
    numbers:
    - 'Size × session: strategic ×0.69 [0.33, 1.44], p = .32; Strategic Heavy only ×0.73, p = .49; tactical ×0.80
      [0.54, 1.17], p = .25'
    - 'Size × minute: strategic ×1.04, p = .59; tactical ×0.93 [0.87, 1.00], p = .047 (uncorrected, opposite to
      sharpening)'
    - 'Gap: strategic s1 +25 [+12, +38] → s2 +15 [−1, +30]; tactical s1 +16 [+4, +29] → s2 +14 [0, +30]'
