  open:
  - Said-vs-did is 'they said X; we see no X' — not proof that X is false. With 9 people we could only have detected
    a large difference. Decide whether to state it as a disagreement or as an unsupported claim.
  - Tactical tier has a weak upward lean in some specifications (2 of 12 at p < .05, gone with mission size or with
    exogenous arrivals). I report it as null; you may prefer 'no robust evidence'.
  - The narration overload list is crude (no speaker separation, ~50% precision in round 2). A hand-coded pass of
    the 51 moments would make the in-play section firmer.
