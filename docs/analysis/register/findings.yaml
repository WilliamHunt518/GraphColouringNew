  sections:
  - id: games
    title: Four games, not two scenarios
    text: The fixed seed gives four mission streams (Strategic Heavy 1 and 2, Tactical Heavy 1 and 2) that differ
      ~1.5× in tasks completed and ~2× in waiting penalty; which pair a person played depends on when they took
      part. All between-person comparisons here are made within game (z-scores, game means subtracted, or game as
      a fixed effect), and final graphs show adjusted values rather than splitting by game.
