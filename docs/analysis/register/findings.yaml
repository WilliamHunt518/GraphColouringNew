  - id: anchor
    title: 'The anchoring test: does the card''s number move the operator''s number?'
    text: 'Holding the mission''s need fixed, a bigger Conservative card goes with a bigger manual allocation —
      but only if the operator saw the card. For those who saw it, about 0.5–0.7 extra drones per extra card drone;
      for operators who decided before the cards loaded, zero. Since both groups face the same missions, the difference
      is the card itself: the advice anchors the manual choice even when it is not accepted.'
    how: 'Gaussian GEE clustered on person: committed drones ~ Conservative card drones + drones needed + number
      of types. The coefficient on the card = extra manual drones per extra card drone with need held fixed. The
      card''s total is not fully determined by need (need and types explain 64% of its variation; residual SD 1.2
      drones — reserve state and spare rules move it), which is what gives the test something to work with. Fitted
      separately for: saw the cards (all), built own after seeing (excludes edits, which start from the card mechanically),
      edited a card, pre-emptive. Also on needed types only. This replaces round 2''s "+0.76 per card drone (session
      2 and one order only)".'
    chart: handover.manualAnchor
    numbers:
    - 'Saw the cards: +0.53 [0.24, 0.82] drones per card drone, p < .001 (112 decisions, 28 people); needed types
      +0.67 [0.33, 1.02]'
    - 'Built own after seeing (no edits): +0.37 [0.08, 0.67], p = .014; needed types +0.49 [0.17, 0.81], p = .003'
