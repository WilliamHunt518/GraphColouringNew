      - ps:p36-play-across-tasks
      more: []
  - id: pt-quicker-by-hand
    title: 'How they played: the card can be slower than doing it yourself'
    tier: main
    text: 'Three minutes into the first session, after taking a card on a small mission, P36 decides it would have
      been quicker by hand. It is the speed result in miniature: the card saves time only on big, three-type jobs.'
    qual:
      summary: ''
      featured:
      - ps:p36-quicker-by-hand
      more: []
  - id: pt-branching-paths
    title: 'How they played: simple by hand, complex to the assistant, and why'
    tier: main
    text: 'The fullest statement of the size rule in the study, with both halves of the reason. On a simple mission
      they already know the answer by eye, and they build in redundancy (every drone to every task) so that after
      a failure "you don''t really need to change the story". On a complex one the options branch, so they let the
      assistant start and step in when needed. They also name the limit of the quick check that goes with handing
      over: whether it is right "is another question entirely". Their own log follows the rule.'
    qual:
      summary: ''
      featured:
      - ps:p36-branching-paths
      more: []
  - id: pt-resource-rich
    title: 'How they played: the rule bends when the reserve is full'
    tier: main
    text: 'A simple mission, so by their own rule one to do by hand; but the reserve is full and nothing is coming
      in, so they press Suggest anyway. The size rule is a default, not a law, and slack loosens it. It also cuts
      against the idea that people hand over because they are busy: here they hand over because they are not.'
    qual:
      summary: ''
      featured:
      - ps:p36-resource-rich
      more: []
  - id: pt-reserve
    title: 'How they played: oldest first, and never without a reserve'
    tier: main
    text: 'Two of the cohort''s habits in one sentence: open the mission that has waited longest unless something
      changes the priority, and build by hand with a spare ("minimum two, we''re going to go three"). Their builds
      still land where the cohort''s do relative to the cards.'
    qual:
      summary: ''
      featured:
      - ps:p36-never-without-reserve
      more: []
  - id: pt-critical-first
    title: 'How they played: critical tasks over score'
    tier: main
    text: Out of Fast drones, they accept a lower score to get the critical tasks done, "if this is a real life
      scenario". The cohort leans the same way, opening the more critical waiting mission more often; P36 says the
      trade aloud and frames it as what a real operation would demand.
    qual:
      summary: ''
      featured:
      - ps:p36-critical-first
      more: []
  - id: pt-strategic-trust
    title: 'How they played: trusting the strategy card more, then seeing why that is a risk'
    tier: main
    text: 'One of the few who trusted the Strategic Assistant more than the Tactical, and their ratings say the
      same. The reason is that checking a card is easy (is there a reserve?), and a strategic mistake seemed less
      costly; then, mid-sentence, they reverse it: a bad allocation at the start leaves the tactical step "screwed".
      Easy to check is not the same as low stakes.'
    qual:
      summary: ''
      featured:
      - ps:p36-strategic-less-hesitant
      more: []
  - id: pt-physics-pace
    title: 'The task: physics sets the pace, and the load moves to waiting'
    tier: main
    text: 'The game''s pace is not realistic: real drones are bounded by distance and speed, so decisions get faster
      but the operation does not. The load does not go away; it becomes waiting and contingency planning ("what
      am I going to do if this thing fails"), "loaded in a slightly different way".'
    qual:
      summary: ''
      featured:
      - ps:p36-physics-pace
      more: []
  - id: pt-tempo-echelon
    title: 'The task: the pressure lands on the lower tier'
    tier: main
    text: Higher up, decisions look further out and a new item is routine; at the lower tier everything arrives
      at once and must be sequenced. The game gave one operator both tiers; in a real hierarchy the time pressure
      the workload findings looked for would sit with the tactical level, and so would any assistant for what to
      do next.
    qual:
      summary: ''
      featured:
      - ps:p36-tempo-echelon
      more: []
  - id: pt-staff-process
    title: 'Control: trust in the process, as with staff'
    tier: main
    text: 'At battlegroup level and above (which the bracket in the trim maps to the study''s strategic tier), a
      commander takes plans worked up by staff, because one person could not do the analysis in time, and trusts
      them because they have done those jobs and know how the answers are made. The link to the assistants is the
      gap: no operator has done the assistant''s job, so the basis for that trust is missing.'
    qual:
      summary: ''
      featured:
      - ps:p36-staff-process
      more: []
  - id: pt-trust-but-verify
    title: 'Control: verify by socialising the plan, and trust the maths'
    tier: main
    text: Verifying, for P36, is a process around the plan (take it to those who will carry it out, keep it open
      to challenge), plus trust that the machine has "done the maths" and allocated enough. The second half is about
      what a two-second look at a tactical plan can confirm; the first is something the study's set-up has no place
      for.
    qual:
      summary: ''
      featured:
      - ps:p36-trust-but-verify
      more: []
  - id: pt-play-catch-up
    title: 'Control: hand over the routine, keep the critical, and pay for it in skill'
    tier: main
    text: Three ideas in one passage. Handing over lets them scan elsewhere and come back. They would take the critical
      thing themselves and leave the routine to the machine "as long as the resources are in place" (a criticality
      rule for handing over, which the study has not tested). And the cost of not building the plan is playing catch-up
      when it fails, so the key is not trusting the AI but the scarce, expensive skill of exploiting it.
    qual:
      summary: ''
      featured:
      - ps:p36-play-catch-up
      more: []
  - id: pt-failure-rate
    title: 'Risk: the failure rate of doing nothing is 100%'
    tier: main
    text: 'Show failure rates, but with context, or people will refuse any risk: a bare "40%" reads as "no chance"
      when a person would fail as often and doing nothing always fails. Their answer to risk is to act and reduce
      it, and to train people to read the numbers.'
    qual:
      summary: ''
      featured:
      - ps:p36-failure-rate
      more: []
  - id: pt-shared-risk
    title: 'Risk: real stakes, experience, and the risk the commander no longer shares'
    tier: main
    text: Their decisiveness came from planning experience and knowing it was a simulation. With real lives an inexperienced
      commander would be reckless or paralysed, and remote autonomy removes the shared risk that used to temper
      the order. They expect to be less decisive themselves if someone could die.
    qual:
      summary: ''
      featured:
      - ps:p36-shared-risk
      more: []
  - id: pt-resource-cascade
    title: 'Organising assistants: the top allocation sets the risk below'
    tier: main
    text: Under-allocate at the top and the lower tier carries the risk; over-allocate and it is wasted elsewhere.
      The commander balances several tasks at once and puts more into the critical one. This is the coupling between
      the tiers that the cohort's card-then-Suggest pattern shows, said from the top.
    qual:
      summary: ''
      featured:
      - ps:p36-resource-cascade
      more: []
  - id: pt-silos
    title: 'Organising assistants: narrow context is normal'
    tier: main
    text: Staff cells each see only their part of the plan and first come together at the brief; that is fine if
      each part has been through a sound process. They add that this game's tasks are simple enough not to need
      more context. This is the clash with the operators who wanted one plan held across both decisions.
    qual:
      summary: ''
      featured:
      - ps:p36-silos
      more: []
  - id: pt-one-up-two-down
    title: 'Organising assistants: one up, two down, and stay in your lane'
    tier: main
    text: 'Each level is given the part of the level above that its task needs, and no more; an agent that reaches
      past its remit gives worse answers and is told "that''s not your job". It pairs with the silos passage (both
      answer how much context a tier needs) but makes a separate point: what to give each level, rather than whether
      narrow context is acceptable.'
    qual:
      summary: ''
      featured:
      - ps:p36-one-up-two-down
      more: []
  - id: pt-red-team
    title: 'Organising assistants: an agent that red-teams the others'
    tier: main
    text: A checker that tests the data the other agents' answers rest on, so that a bad input is found before the
      answers built on it. It answers the hidden-flaw result without relying on the operator to notice.
    qual:
      summary: ''
      featured:
      - ps:p36-red-team-agent
      more: []
  - id: against-results
    title: 'Read against the results: where a practitioner agrees, qualifies and goes beyond'
    tier: main
    text: 'Every link on the points above, in one place, grouped by how the passage bears on the result. <b>Agrees</b>:
      the size rule and its reasons, the card''s speed, working across the board, oldest first, criticality, quick
      checking and its limit, trust in how answers are made, and the tiers coupled from the top. <b>Qualifies</b>:
      workload (the pressure in real operations is pace and the lower tier), the trust gap (easy to check is not
      low stakes), the size rule (it bends with slack), hand-build spares, checking (verifying is a process, not
      a look), failure data (it needs context), experience (it matters when the stakes are real), and one plan across
      the tiers (narrow context is normal). <b>Goes beyond</b>: skills and selection, verifying by challenge, always
      acting on risk, what real stakes do to decisiveness, staff cells and one-up two-down, a red-team agent, and
      where an assistant for what to do next would sit. This could close the paper.'
