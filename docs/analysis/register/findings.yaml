- id: f-workload
  area: Workload and the queue
  title: A busier moment does not push people onto the assistants — even though they say it does
  headline: 'Comparing each operator with themselves, having more missions waiting does not change how often they
    take a strategy card or press Suggest: the line is flat once we account for what each decision was (mission
    size and drone types), when it came in the session, which game it was and who made it. This is "no evidence
    of an effect", with enough data to rule out large effects (strategic: at most about +15 points of card-taking
    going from 0 to 5 waiting). Nine of 33 said in the debrief that they hand over when overloaded; their own behaviour
    moved with the queue no more than anyone else''s. In play they said overload-type things at slightly busier
    moments, but their reliance around those moments did not change.'
  confidence: 'null'
  absorbs:
  - load-null
  - load-visible
  - load-backlog-practice
  - load-deep-queue
  - q-C11
  sections:
  - id: raw-vs-adjusted
    title: Queue depth against reliance — raw, and adjusted
    text: 'Each point is the share of decisions where the operator took a strategy card (or pressed Suggest), grouped
      by how many OTHER missions were waiting for a strategic decision at that moment. Whiskers are 95% intervals.
      Switch the view: <b>Raw</b> shows the dip at 3–4 waiting that made the raw graph look like an effect; <b>Raw
      + expected</b> shows that the dip is where it was expected anyway (dashed line); <b>Adjusted</b> removes it
      — every adjusted point sits inside 59–74% with overlapping intervals and no trend. <b>Assistant</b> switches
      between strategic and tactical; <b>Both together</b> puts the two on one chart, both in whichever view is
      picked (both raw, both raw with their expected lines, or both adjusted). The dotted vertical line marks where
      the queue list runs out of room (about 3.5 cards visible at rest, counting the one being opened): beyond it,
      waiting missions are only on the strategic map. Nothing changes at that line either.'
    how: '<b>Rows:</b> 564 strategic decisions on original (non-residual) missions and 630 tactical plans, 33 people
      (P09 excluded). <b>Queue</b> = other missions that had arrived and not yet been given a strategic choice when
      the decision panel opened, rebuilt from the event log (agrees with the logged count for 100% of decisions).
      <b>Expected</b>: a logistic model predicts each decision''s chance of a card (or Suggest) from four things
      only — the mission (drones needed, number of tasks, number of drone types), the minute of the session, the
      game (one of four fixed scenarios), and the person (their own rate on all their OTHER decisions, so a decision
      never predicts itself). The queue is deliberately left OUT. <b>Adjusted</b> for a bin = the overall rate +
      the average of (observed − expected) in that bin. In plain words: ''given who made these decisions, on which
      missions, at what point in which game, how much more or less did they rely on the assistant than we would
      expect?'' If load mattered, the deep-queue bins would sit above what their missions and people predict; they
      do not. <b>Worked example (strategic, 4 waiting, 41 decisions):</b> raw 51% looks like a drop from 67% at
      0 waiting. But 90% of those decisions were in the two Strategic Heavy games, on missions averaging 6.9 drones
      (vs 8.7) with fewer three-type missions (54% vs 66%), made by people whose usual rate is 56% (vs 66%). The
      model expects 50%; observed is 51%; adjusted ≈ 67%. <b>Intervals</b>: people resampled with replacement 400
      times, the expected-model re-fitted each time, so the interval includes the uncertainty of the adjustment
      itself.'
    chart: load.nullBins
    numbers:
    - 'Strategic raw: 67% (0 waiting), 70%, 68%, 58%, 51%, 71%, 50% (6+); adjusted: 66%, 65%, 65%, 61%, 67%, 74%,
      59% — all intervals overlap.'
