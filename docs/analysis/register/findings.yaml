  - id: h8
    title: Why the pre-registered test (H8) was dropped
    text: H8 asked whether uptake falls after an operator 'realises' the card can be illogical. Its marker for that
      realisation was the first time a person went manual on an illogical-card mission and left out the unneeded
      type. The trouble is that, by that definition, every illogical-card decision <i>before</i> the marker was
      not such a manual choice. So the 'before' window was mostly forced to be card takes, near 100%. Any later
      manual choice then shows up as a drop, even if the person never changed at all. A simulation confirmed it.
      In simulated people who keep the same habits all study, the same marker produced a large 'drop' (average odds
      ratio 0.37, against the real 0.12). Measured against that, the real drop was ordinary (calibrated p = .30,
      about −10 points after correction). Defining the marker as the first manual choice on a <i>clean</i> card
      produced the same kind of drop. H8 was replaced by tests whose anchor is not defined by the outcome (the first
      illogical card shown; the moment someone said it), each checked against a placebo. Those are the tests in
      this finding.
    how: From docs/analysis/round1/h8_illogical_card.md. The null calibration redrew each person's choices 1,000
      times from their own constant rate, reapplied the marker and refitted the same model.
    numbers:
    - Pre-registered estimate OR 0.12; the same test on no-change simulations averages OR 0.37; calibrated p = .30
      (risk difference)
    - 'Placebo marker on clean cards: OR 0.22, p = .03, the same kind of ''drop'''
