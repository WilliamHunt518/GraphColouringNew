  - id: refusal
    title: 'A different event: after the Tactical Assistant''s first ''No workable plan'', nothing changes on either
      tier'
    text: '<i>Not the same moment as section 4.</i> Here each person is lined up on the first time the Tactical
      Assistant''s Suggest, asked for a plan to recover from a drone failure, answered ''No workable plan''. That
      is a failure of the other assistant, and nothing to do with noticing the illogical strategy card. You asked
      whether the only thing that changes after the first refusal is that <i>strategic</i> use goes down, with the
      problem cascading up the chain. <b>It does not.</b> After their first ''No workable plan'' (18 people), card
      uptake actually went <i>up</i> in raw terms (68% → 76%). The expected value went up just as much, because
      these refusals tend to come later, when people have settled in. Adjusted, the change is +2 points [−6, +10],
      with 10 people falling and 8 rising. On three-type missions it is 0 points. Tactical Suggest use also rose
      raw (78% → 87%) and is flat adjusted (−1 point). After the first <i>wrong</i> refusal (14 people) the picture
      is the same: strategic −2.5 points [−16, +11], tactical 0. The first drone failure (33 people) changes nothing
      either. These are absences of evidence, with intervals around ±10 points. They are not proof of no effect,
      but no cascade is visible. The card''s wording, ''neither assistant''s use changes'', was right.'
    how: Same rebuilt method as f-flaw-odd. Each person's strategic decisions (or tactical plans) are numbered within
      the sample, after versus before the moment of their first refusal, with practice held fixed and people clustered.
      Adjusted = observed minus the expected value. The placebo moves each anchor to a random point drawn from the
      real anchor positions. All p-values are for the adjusted change.
    chart: flaw.anchors
    numbers:
    - 'First refusal (18): strategy cards, all missions, adjusted +2.0 points [−6, +10], p = .62; three-type +0.4,
      p = .91; tactical Suggest −0.6 [−6, +5], p = .83'
