  sections:
  - id: own-play
    title: How typical are they?
    tier: main
    chart: typical.p36
    text: '<b>Typical in how they played.</b> On every habit the findings measure (card use, how card use grows
      with mission size, Suggest use and how it grows with plan size, keeping Suggest plans unedited, the drones
      on a hand build, oldest-first) they sit in the middle half of the cohort. They were a little quicker on the
      strategic step (9.6 s per decision against a median of 11.4) and decided before the cards loaded a little
      more often (32% against 10%), at the 20th and 80th percentiles, and they scored a little above most (0.7 SD
      within game, 80th percentile). <b>Different in who they are.</b> They are the oldest participant (44; median
      27), the only one with extensive command experience (24 of 33 report none), one of four with moderate drone
      experience, at the top of the AI-attitude scale (10 of 10, with one other), and among the least insistent
      that a human keep authority (3.0 against a median of 4.3). Their trust in the Strategic Assistant was higher
      than most (5.9; median 4.5). So the commentary that follows comes from someone whose play was ordinary: what
      they add is the reading, not a different way of playing.'
