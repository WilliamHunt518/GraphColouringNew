  - id: not-time-locked
    title: Why the three-type dip cannot be pinned on the card
    text: 'Three checks stop us saying ''the card caused the dip'', and the new sections below add a fourth, the
      strongest. <b>(1) Timing.</b> The card arrives so early that ''after the card'' almost means ''after the first
      couple of decisions''. When each noticer''s anchor is moved to a random but equally early point, their drop
      is just as large: −13 vs −14 points, p = .92. <b>(2) Who.</b> Noticers are less card-reliant overall: 55%
      of decisions against 73% (p = .03). Before the first card they took cards on three-type missions at the same
      rate (68% vs 63%, p = .76). <b>(3) ''Said'' is post hoc.</b> 17 of the 18 never-said people were narrating
      during play, which makes their silence some evidence, but not proof. <b>(4) The dip comes without the card.</b>
      Players who had the tactical-heavy game first met no illogical card in session-1 decisions 1–4. Their noticers
      dip in the same stretch as everyone else''s noticers (see <i>What the dip is</i>). The per-person before/after
      slopes now have the missions toggle (all missions by default).'
    how: 'Timing-matched placebo: each person''s real anchor is replaced 2,000 times by a cut drawn from the real
      anchor positions of their group. The statistic is the mean over people of (mean residual after − mean residual
      before). p = how often the placebo differs from its own average by as much as the real one does. Uniform placebo:
      the same, with the cut drawn anywhere in the person''s sequence. Group profile: per-person rates compared
      with Mann–Whitney tests (15 vs 18 people).'
    chart: flaw.people2
    numbers:
    - 'Noticers'' drop vs timing-matched random anchors: −0.13 vs −0.14, p = .92; vs anywhere-anchors p = .20 (first
      five: p = .07)'
    - 'Non-noticers'' rise vs anywhere-anchors: +0.13 vs 0.00, p = .01'
    - 'Card uptake, all decisions: noticers 55% vs never-said 73%, p = .03; three-type before the first card 68%
      vs 63%, p = .76'
    - 17 of 18 never-said people had in-play narration recorded
