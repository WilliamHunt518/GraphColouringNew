- id: f-who-does-better
  area: Who the operator is
  title: More-reliant operators complete more; relying more does not make anyone better
  headline: 'Between people, those who take more strategy cards complete more of their missions in full (odds ×1.32
    per 25 points of card uptake, p = .004). Within a person, it does not hold: their card missions do no better
    than their own manual ones (odds ×0.81, p = .27; 19 of 26 people did slightly worse on cards), and no score
    measure rises in a session where they relied more. The difference sits in the people, not in the advice. Relying
    more in a session does leave fewer missions waiting (throughput), but that does not show up in the score. Moderate:
    the between-person link on session <i>score</i> is weaker (p = .15).'
  confidence: moderate
  absorbs:
  - pay-between-within
  - pay-throughput
  - q-C23
  sections:
  - id: between-within
    title: Between people vs within a person
    text: 'Left: each dot is a person. People who take more cards complete more of their missions in full than the
      size of those missions would predict. Right: each dot is a person''s own card missions against their own manual
      missions; above the dashed line would mean "the card did better for me". Most people are on or below it. Whatever
      makes the better operators better, it is not the card itself — plausibly the same competence or speed that
      makes them comfortable delegating.'
    how: 'Rows: 606 strategic decisions; "completed in full" = every task of the mission finished (abandoned, partial
      and still-running at the buzzer count as not). Left: per person, observed full-completion rate minus the rate
      expected from a model of mission size, drone types and game (no person terms); Spearman with card uptake,
      n = 33. Right: people with at least two card and two manual missions (n = 26); the size-adjusted difference
      (card minus manual) tested with Wilcoxon. The formal model (round 1 H10 primary): GEE logistic regression
      of full completion on card vs manual, drone types, drones needed, game, and the person''s own card rate —
      the card term is the within-person effect, the person-rate term the between-person one.'
    chart: style.payoffBW
    numbers:
    - 'Between: completion beyond expected vs card uptake ρ = .46 [.12, .70], p = .007'
    - 'Within: card better for 7, worse for 19 of 26; median size-adjusted difference −6 points (Wilcoxon p = .071)'
    - 'Model: between people OR ×3.06 from 0% to 100% uptake (×1.32 per 25 points) [1.42, 6.58], p = .004; within
      OR 0.81 [0.55, 1.18], p = .27'
    - Within could have detected an OR ≤ 0.58 or ≥ 1.73 — so a large card benefit is ruled out, a small one is not
    - 'Raw: card missions 60% completed in full, manual 62%'
    atoms:
    - pay-between-within
    role: archive
    role_set: true
    tier: side
  - id: estimates
    title: The estimates, and what reliance does buy
    text: 'On session score, the between-person link points the same way but is not clear (+0.26 SD per 25 points
      of uptake, p = .15), and within a person it is flat (−0.10 SD). What reliance does change within a person
      is throughput: a session in which someone leans on the assistants more (cards, Suggest and faster decisions
      together) leaves fewer missions never allocated — about 0.8 fewer per SD, against an average of 1.5 per session.
      Card uptake on its own does not show it; the effect lives in the wider style (Suggest use and speed). Fewer
      missions left waiting, but no detectable gain in points — the extra missions are probably late or low-value.'
    how: 'Session rows (66), GEE with the small-sample correction, game and session (1st/2nd) fixed; card uptake
      split into the person''s average (between) and the session''s deviation from it (within). Outcomes standardised
      within game, so estimates are SD per +25 points of card uptake. Score efficiency, share of the best human
      score and benchmark share are all session score divided by a per-game constant, so within a game they are
      the same measure (r ≥ .99) — one score test, not four. Throughput (round 2 C2): missions never allocated on
      the session score of the reliance axis; rerun with decision speed removed from the axis and with card uptake
      alone.'
    chart: style.payoffForest
    numbers:
    - 'Score, per +25 points uptake: between +0.26 SD [−0.10, 0.61], p = .15; within −0.10 SD [−0.47, 0.27], p =
      .61'
    - 'Never allocated, per +25 points uptake: between −0.30 SD (p = .17); within −0.19 SD (p = .14)'
    - 'Never allocated, per SD of session reliance axis: within −0.78 missions [−1.24, −0.32], p < .001 (round 2
      q = .04); without decision speed −0.58, p = .011; card uptake alone p = .32'
    - 'P01/P02 (half task weights) excluded: between OR 3.36, within 0.83; score between +0.31 SD (p = .10), within
      −0.07'
    atoms:
    - pay-between-within
    - pay-throughput
    role: archive
    role_set: true
    tier: side
  - id: trust-parallel
    title: The same split as trust
    text: Reliance tracks trust between people but not within a person — the same pattern (see the style finding).
    how: As in f-personal-style § trust.
    chart: style.trustBW
    atoms:
    - style-trust-link
    sharedWith:
    - f-personal-style
    role: archive
    role_set: true
    tier: side
  - id: said
    title: Operators rarely judged the assistant by outcomes — rightly
    text: 'Three of 33 said using the assistant improved their results; none said they did better by hand. Most
      never judged it on outcomes at all, which fits the data: the outcome difference is between people, not something
      the assistant did for any one of them.'
    how: Qualitative codes C23 / C24 (one AI coder; see Methods). Counts only.
    chart: style.wantsBars
    numbers:
    - 'C23 assistant improved results: 3 of 33; C24 did better by hand: 0 of 33'
    atoms:
    - q-C23
    codes:
    - C23
    - C24
    role: archive
    sharedWith:
    - f-operator-wants
    role_set: true
    tier: side
  replies:
  - card: pay-between-within
    text: 'Kept and given graphs: a between/within two-panel scatter and an estimates plot. Wording avoids "more
      AI = better": the better operators rely more, but relying more did not improve any person''s own results.
      Also new and honest: on session score the between-person link is weaker (p = .15) — the strong between result
      is mission full completion.'
  - card: pay-throughput
    text: 'Merged as the "what reliance does buy" part: fewer missions never allocated within a person (−0.78 per
      SD, p < .001), carried by the wider style (Suggest + speed), not card uptake alone, and not reaching the score.'
  - card: q-C23
    text: Kept as a supporting line (3 of 33 credited the assistant; 0 said manual did better).
  open:
  - Is “who does better” its own finding (as here) or a section of the style finding? Kept separate because it answers
    a different question (does reliance pay?).
  - The between-person payoff is clear on mission completion but not on session score — which outcome should the
    paper lead with?
  source: style
  tier: side
  reply: You marked this Keep, so it is back among the sidelined findings rather than retired. Two of its numbers
    now back up the parallel-work section of the size finding.
