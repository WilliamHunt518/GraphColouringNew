      summary: Three people tie the two tiers together the way the logs do (card-allocated missions get Suggest
        more). P10 says repeatedly that once they have taken the Aggressive card there is 'only really one way'
        to assign, so Suggest is the obvious next step. P05 and P30 take a card and then press Suggest on the same
        mission. The same continuity runs the other way for P21, who lays out a plan in their head while building
        the allocation by hand and says it would 'disrupt my thought process' to switch to Suggest for the tactical
        step; P30 likewise finds it easier to give the assistant resources and let it optimise. The opposite pairing
