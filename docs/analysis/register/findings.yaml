  open:
  - 'Is this main or lesser? The mechanism is concrete and verified, and the design point is strong: the assistant''s
    ''can''t'' is taken at its word more readily than its ''here''s a plan''. But it rests on 9 abandoned episodes
    from 8 people.'
  - Was there visual checking in the few seconds before abandoning? Only the narration/recordings can show it. Worth
