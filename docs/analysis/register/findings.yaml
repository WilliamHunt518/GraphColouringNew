  - id: where
    title: 'Where the gap comes from: the second session and the Strategic Heavy scenario'
    text: 'The gap is larger in Strategic Heavy sessions (+1.13) than in Tactical Heavy ones (+0.52, CI just reaches
      zero). It is also small after the first session (+0.37, CI crosses zero) and large after the second (+1.28).
      Both matter when taken together: holding session order fixed, Strategic Heavy adds about +0.6 to the gap and
      being the second session about +0.9. Tactical trust hardly moves (5.36 → 5.51 across sessions, and only +0.15
      between scenarios); it is <b>strategic</b> trust that falls, and it is lowest in Strategic Heavy sessions.
      So "trusted more, especially in Strategic Heavy" largely means "the strategic one loses trust, especially
      in the scenario where its cards are used most". Four people said their trust <i>grew</i> with experience (C16).
      The chart opens on the six questionnaire items (every one favours tactical); <b>Scenario played</b> shows
      the two scenarios; <b>Also: first / second session</b> shows session order.'
    how: 'The tactical-minus-strategic difference for each session (66 sessions). By session: averaged over the
      33 first and the 33 second sessions. By scenario: both games of each scenario pooled (33 sessions each). Every
      person played one session of each scenario, so the scenario comparison is also done within person (paired
      t and Wilcoxon on each person''s two gaps). Session order and scenario are partly tangled (about half played
      Strategic Heavy first), so a model with both (GEE, gap ~ Strategic Heavy + second session, clustered by person)
      separates them. Means have t-based 95% CIs.'
