- id: q-trust-unchecked
  title: You trust what you cannot check
  confidence: qualitative
  headline: 'The most articulate operators describe trusting the Tactical Assistant <i>because</i> they could not
    assess its plan, while the strategy card was simple enough to judge at a glance, and so was judged, often harshly.
    Under time pressure checking shrinks to a glance, and people say so with unusual candour: "if we look at the
    recording I was doing exactly that". A minority did check, and their trust was earned by comparing the assistant''s
    plan with their own.'
  done: P36 is out of this finding, as they are of every finding but their own (which now comes after all the other
    quote findings). The at-scale section was all P36 and is gone; its passages are in the practitioner finding.
  sections:
  - id: cant-check
    title: Trusted because it cannot be checked
    tier: main
    text: 'The strategy card shows a few numbers per drone type beside the mission''s own requirements, so its oddities
      are visible. The tactical plan is a web of routes on a map. P22 puts the consequence most clearly: they take
      the tactical plan "at its word" because they cannot see how far it is from optimal, and they suspect that
      is the only reason it seems so good. P19 says rating it would be "disingenuous" because they never really
      looked, and P01 that it is "a lot harder to mentally challenge" than drone numbers. This is the participants''
      own account of two quantitative results: the trust gap between the tiers (f-tier-trust) and the visible versus
      invisible flaws (f-flaw-odd). It suggests the gap is partly a gap in <i>checkability</i>, not in quality.'
    qual:
      summary: The clearest voices are P22, P19 and P01; P28 gives the same split from the other side (the strategic
        decision is the one you can analyse).
      featured:
      - ps:p22-cant-perceive-optimal
      - ps:p19-inadvertently-trusted
      - ps:p01-rely-more-trust-less
      - ps:p22-take-its-word
      more:
      - ps:p22-pinch-of-salt
      - ps:p28-strategic-easier
      - ps:p15-busy-man
      - ps:p21-reliable-no-redundancy
      - ps:p22-similar-quality
  - id: glance
    title: Checking shrinks to a glance
    tier: main
    text: 'Nobody describes careful checking under pressure. They describe a quick look ("does anything look ridiculous?"),
      knowing that a plan can look fine and not be, and accepting that trade because penalty accrues while they
      check. P31 gives the whole arc: over-checking at the start, under-checking by the end, less oversight as the
      session goes on, and a rating corrected against their own behaviour. P11 makes the expected-value argument
      explicitly: on a big mission even a dodgy plan pays, because of the time saved for the next mission. P28 is
      the exception, saying they checked every answer, though "a quick browse".'
    qual:
      summary: P31 is the richest single source here; P29, P15 and P22 say it more briefly; P28 dissents.
      featured:
      - ps:p31-majority-of-the-way
      - ps:p31-less-oversight
      - ps:p31-recording-shows
      - ps:p11-dodgy-suggestion
      more:
      - ps:p31-checking-balance
      - ps:p31-under-the-radar
      - ps:p29-not-checking
      - ps:p15-no-time-trust
      - ps:p22-pressure-less-verification
      - ps:p22-fast-not-perfect
      - ps:p28-check-everything
      - ps:p28-less-reliable-still-use
      - ps:p22-fall-back
  - id: earned
    title: Trust earned by comparison, and doubts that came with practice
    tier: main
    text: 'Where trust was earned, it was by comparison. P32 trusted the tactical plan because it "seemed to be
      doing what I was doing" and the cards did not; P29 tested themself against the assistant early and found their
      own builds were the ones that failed; P11 decided they had been "too harsh" once Suggest matched their simple
      plan at the same speed. Practice cut both ways: P15 only saw the assistant''s mistakes once they had time
      to look, and suspects they were there all along.'
    qual:
      summary: P32, P29, P11 and P15.
      featured:
      - ps:p32-earned-trust
      - ps:p29-test-then-trust
      - ps:p11-too-harsh
      - ps:p15-mistakes-noticed
      more:
      - ps:p28-start-with-ai
  area: In their own words
- id: q-process
  title: 'Trust in the process, not the answer: what operators thought the assistants were'
  confidence: qualitative
  headline: Operators did not take the assistants' outputs at face value; they tried to work out how the answers
    were made, and mostly could not. They asked why a card carried a buffer and got no answer, misread what the
    card's figures meant, or concluded the "AI" was "a dozen lines of code". Their pictures of the assistants ranged
    from a matching algorithm to a hallucinating AI to be scolded and apologised to. And one humanly obvious mistake
    did more damage to trust than any numerical shortfall.
  sections:
  - id: asking-why
    title: Asking why, and getting no answer
    tier: main
    text: 'Several people stopped at a card and tried to reason about it before calling it wrong. P13 compares the
      two cards'' totals and asks "Do fast drones have a higher chance of failing?"; the researcher cannot say.
      P11 misreads the card''s resilience figures ("it wasn''t telling me what I guess I thought it was telling
      me"). P10 works out the rule behind the Aggressive card''s spares and trusts it more once they do. P22 and
      P19 notice the cards say something different from what they seem to: three drones offered for a six-drone
      job when the reserve is short, and a "Conservative" card sending more than the "Aggressive" one.'
    qual:
      summary: P13, P11, P10, P22 and P19. None of the card behaviours they puzzle over is explained anywhere on
        screen.
      featured:
      - ps:p13-why-the-buffer
      - ps:p10-redundancy-understood
      - ps:p22-three-for-six
      - ps:p19-reverse-labels
      more:
      - ps:p13-same-eta
      - ps:p11-redundancy-misread
  - id: mental-models
    title: Matching algorithm, toaster or hallucinating AI
    tier: main
    text: 'The participants were almost all from computing, and several saw straight through the label: "a dozen
      lines of code" (P31), "almost like a matching algorithm" (P19), "a little bit stupid" (P15), "is it deliberately
      slow?" (P11). Others gave the assistants more than they had, assuming the two tiers share patterns (P21) or
      that a wrong card was an AI "hallucinating" (P19, who then apologised to it). The slowness of a calculation
      that should be instant shaped these pictures, and it fed back into trust: under pressure the same algorithm
      "felt" less reliable because it felt slower (P22).'
    qual:
      summary: P31, P19, P15, P11, P21, P22 and P13.
      featured:
      - ps:p31-dozen-lines
      - ps:p19-hallucinating
      - ps:p22-slow-feels-unreliable
      - ps:p31-task-ordering
      more:
      - ps:p19-matching-algorithm
      - ps:p15-stupid-slow
      - ps:p11-deliberate-slowing
      - ps:p13-allocation-algorithm
      - ps:p21-shared-patterns
  - id: clear-mistake
    title: One humanly obvious mistake costs more than a numerical one
    tier: main
    text: 'The illogical card (a Camera on an all-Fast mission) did more to trust than its frequency would suggest,
      because it is the kind of mistake no person would make. P21 says so directly: "if it was kind of just a numbers
      thing, I wouldn''t probably notice. But because it was a clear mistake for a person to see, it just made me
      automatically lose my trust". P32 expected "random drones flying all over the place". Yet trust and use came
      apart: P28 rated the card lower and kept using it "because at least it saves time". P01, who played an early
      build with a real deployment bug, sensed something was wrong, could not confirm it, and ended up doubting
      themself.'
    qual:
      summary: P21, P32, P28 and P01.
      featured:
      - ps:p21-clear-mistake
      - ps:p32-random-drones
      - ps:p28-less-reliable-still-use
      - ps:p01-fighting-it
      more:
      - ps:p13-allocation-algorithm
  area: In their own words
- id: q-who-decides
  title: Who decides, and who answers for it
  confidence: qualitative
  headline: 'Asked about real search and rescue, nobody rejected assistants like these, but almost everyone wanted
    a human to keep the decision, and the reasons were moral as much as practical: accountability for a life not
    saved, a human "connected" to the operation, and the plan held in someone''s head. People were candid that the
    human they want in the loop may not be able to check much. Against the grain, P13 wants enough automation that
    "the end users could be anyone".'
  sections:
  - id: accountability
    title: Accountability that just isn't there
    tier: main
    text: 'P31 sets out the dilemma: even if an AI saves more lives on average, when it fails to save one, "that
      accountability just isn''t there". P22 weighs the same discomfort against saving five people sub-optimally
      rather than none, and settles on a human making the final decision. (P22''s "a bad approximation is better
      than no response at all" refers back to an item of the pre-study questionnaire.) P31 also raised, unprompted,
      that this research "will inevitably lead to it being used in military".'
    qual:
      summary: P31 and P22.
      featured:
      - ps:p31-accountability
      - ps:p22-bad-approximation
      more:
      - ps:p31-military-use
      - ps:p29-speed-over-perfection
  - id: loop
    title: A human in the loop, even one who cannot check
    tier: main
    text: 'Some want the human there regardless of what they can do: P24, pressed on whether a busy human could
      check, concedes they could not and still wants "a human stand here"; P28 says "humans should make that decision"
      because "we cannot guarantee what type of answers it will provide". P32 gives the organisational version:
      measure where people and agents add value and assign the tiers accordingly.'
    qual:
      summary: P24, P28 and P32.
      featured:
      - ps:p24-human-anyway
      - ps:p28-check-everything
      - ps:p32-organisational
      more: []
  - id: ownership
    title: Ownership, and the opposite view
    tier: main
    text: 'For some the reason to keep work is not safety but connection. P11 does not want to be "reduced to pressing
      allocate, suggest, deploy, because otherwise I might as well be in the next room", and admits to pride and
      "some sort of grudge" against the computer. P21 keeps both decisions because the allocation already carries
      a plan in their head that the assistant would "disrupt". P13 takes the opposite view: automate everything
      not ethically constrained, so that the operator''s skill matters less.'
    qual:
      summary: P11 and P21 against P13.
      featured:
      - ps:p11-connected
      - ps:p11-ownership
      - ps:p21-plan-in-mind
      - ps:p13-anyone-could-use-it
      more: []
  - id: imposed-loop
    title: The loop the system imposes
    tier: main
    text: 'P21 built contingency into every plan, chaining drones so that a failure only costs time, and then found
      that every failure still stopped for human approval: "it doesn''t know that I''ve already added contingency
      plans". The loop as designed made no room for an operator who had planned ahead. P13 asks for the opposite
      safeguard, a second confirmation before a running task can be cancelled.'
    qual:
      summary: P21 and P13.
      featured:
      - ps:p21-contingency-unrecognised
      - ps:p13-confirm-cancel
      more: []
  area: In their own words
- id: q-failure
  title: Failure without feedback
  confidence: qualitative
  headline: 'Drone failures were random and uniform, and nothing on screen said so or said how likely they were.
    Operators felt the lack: P13 is "making blind decisions", P31 cannot tell whether their nudging helped, and
    several wanted failure rates tied to drone type or place built into the allocation. Without information they
    built their own theories (hostile places, "fires or something") and blamed themselves.'
  sections:
  - id: blind
    title: Blind decisions, and failure data built into the plan
    tier: main
    text: P13 treats allocation as a decision about risk that cannot be made well without the failure rate, and
      later proposes feeding a terrain-based estimate into the allocation rule so that the reserve is sized to the
      risk rather than padded. P10 wants failure rates by drone type from historic data. (In P11's and P10's debriefs
      the idea of per-area risk was raised by the researcher; P13 arrived at it themselves.)
    qual:
      summary: P13, P10 and P11.
      featured:
      - ps:p13-blind-decisions
      - ps:p13-failure-into-algorithm
      - ps:p10-failure-likelihood
      more:
      - ps:p11-danger-rating
      - ps:p13-abandon-unrealistic
  - id: patterns
    title: Patterns in random failures, and blaming yourself
    tier: main
    text: 'With no information, P19 decides that "the same tasks had failure rates that were similarly high" and
      that "the environment was very harsh for them", then blames their own allocation: "I think those were my failures".
      P31 intervened without ever knowing whether it helped. P01, in an early build that really did have a fault,
      could not tell bug from bad luck from their own error and ended up saying "I don''t trust myself anymore".'
    qual:
      summary: P19, P31 and P01.
      featured:
      - ps:p19-harsh-environment
      - ps:p19-my-failures
      - ps:p31-no-feedback
      - ps:p01-fighting-it
      more: []
  area: In their own words
- id: q-hierarchy
  title: 'The hierarchy as one plan: how the two decisions connect'
  confidence: qualitative
  headline: 'Operators did not experience two independent assistants. They describe one plan that starts at the
    strategic step: over-allocate at the top and the shortage cascades down; allocate generously and there is "really
    only one way" to assign the drones; build the allocation yourself and the tactical plan is already in your head.
    Several place responsibility for failures with the strategic tier, and use the cross-mission view the cards
    lack (who can wait, what to hold back). Whether one plan held across the tiers is the right ideal is the question
    the practitioner''s account, at the end, takes up and answers differently.'
  done: P36 is out of this finding now (their cascade, one-up-two-down and critical-first passages are in their
    own finding). The headline and the one-plan section end on a pointer to their opposing view, so this finding
    can lead into it. The cascade section is now P19 and P28 only, the two you had already picked.
  sections:
  - id: cascade
    title: The strategic step carries the risk
    tier: main
    text: 'P19 reaches the conclusion from the results: the tactical assistant "did everything", and the only remedy
      for failures is sending enough drones at the start, "the strategic assistant''s prerogative". P28 weighs the
      same step from the other side: they hold drones back in the base because "I cannot predict when the next task
      will appear", and accept that a colour sent as a single drone may fail.'
    qual:
      summary: P19 and P28.
      featured:
      - ps:p19-tactical-results
      - ps:p28-defensive-reserve
      more: []
  - id: one-plan
    title: One plan across both decisions
    tier: main
    text: 'The card-then-Suggest pattern in the logs (f-size-decides) is described from both sides. P10: a generous
      card means "there is really only one way of assigning them, which means if I just hit the suggest button then
      I can focus on something else". P21: building the allocation by hand lays out a plan in the mind, so switching
      to Suggest would disrupt it; their own plans chain drones through each other''s tasks to get "redundancy for
      free". P21 also wonders whether the tactical assistant follows the strategic one''s patterns. The practitioner''s
      account at the end disagrees with this ideal: in staff planning each cell sees only its part, which is fine
      if each part has been through a sound process.'
    done: P36's view is now kept for their own finding, which comes after the other quote findings. This section
      points forward to it in one line, and P36's silos and one-up-two-down passages link back here as "qualifies",
      so the clash you noted is shown from both sides.
    qual:
      summary: P10 and P21.
      featured:
      - ps:p10-only-one-way
      - ps:p21-plan-in-mind
      - ps:p21-redundancy-for-free
      more:
      - ps:p21-shared-patterns
  - id: cross-mission
    title: The cross-mission view the cards lack
    tier: main
    text: 'The strategy cards look at one mission. Operators override them to act on what the cards cannot see:
      P22 strikes a "middle ground" to keep drones back for other tasks; P24 trims cards not because they are better
      than the AI but to save drones, and only then learns the cards see one mission; P19 reasons about who can
      afford to wait; P31 goes below even the Conservative card when other tasks are pending.'
    qual:
      summary: P22, P24, P19 and P31.
      featured:
      - ps:p22-middle-ground
      - ps:p24-save-drones
      - ps:p19-criticality-wait
      more:
      - ps:p31-below-conservative
  area: In their own words
- id: q-real-ops
  title: What a real operation would need
  confidence: qualitative
  headline: Participants were clear that this was a game, and several said what would change with real stakes. They
    pointed to what the simulation leaves out (searching for people whose location is unknown, a drone that finds
    someone and leaves, abandoning a mission), questioned the time pressure, and disagreed about whether real operators
    should need much skill at all.
  sections:
  - id: pace
    title: What the simulation leaves out
    tier: main
    text: P28 points out that in reality task locations are not known in advance, so drones would need to share
      what they find, and that a drone that finds a person and leaves "will make people very disappointed". P13
      finds abandoning a mission unrealistic, since you would simply send more.
