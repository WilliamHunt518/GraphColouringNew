- id: f-practice
  area: When operators hand over
  title: Practice makes operators faster, not better at choosing when to hand over
  headline: 'Decisions speed up steadily: about 6% faster per minute within a session on both tiers (≈ 38% over
    the eight minutes) and about 20% faster in session 2 than session 1, with forced waits removed. But the size
    rule does not sharpen: the big-minus-small hand-over gap is the same or slightly smaller in session 2 on both
    tiers, and no test of sharpening comes close. Reliance is targeted from the start and stays a personal style.
    The six people who say they got better did improve their scores (all six, against 37% of others) — their speed
    gains are not reliably larger.'
  confidence: moderate
  absorbs:
  - learn-speed
  - learn-calibration-null
  - q-C22
  sections:
  - id: speed
    title: Faster with every minute, and faster in session 2
    text: Median net decision time per minute of the session, session 1 (grey) and session 2 (colour). Both tiers
      fall across the session and session 2 sits mostly below session 1. Small, expected, solid.
    how: '<b>Net time</b> = seconds to decide minus the forced wait (the card reveal for card choices; 1 s per entry
      for Suggest plans), as round 2 defined it. <b>Model</b>: Gaussian GEE on log net time, clustered on person,
      with minute of session and session 2 as predictors, and route, mission size and scenario held fixed. A log-scale
      coefficient converts to "% faster". Round 2''s figure (−31% over a session) used fewer controls; the direction
      and size agree.'
    chart: handover.learnSpeed
    numbers:
    - 'Strategic: −5.7% per minute [−7.8, −3.6], ≈ −38% over 8 minutes, p < .001; session 2 vs 1 −19% [−30, −6],
      p = .005'
    - 'Tactical: −5.7% per minute [−9.1, −2.2], p = .002; session 2 vs 1 −24% [−36, −9], p = .002'
    atoms:
    - learn-speed
  - id: calibration
    title: The size rule does not sharpen with practice
    text: 'If practice taught operators where the assistant pays, the gap between big and small jobs would widen
      in session 2. It does not, on either tier: strategic +25 points in session 1, +15 in session 2; tactical +16
      then +14. Within a session the tactical gap even narrows slightly with time (one of five tests, p = .047,
      likely noise). The rule is there from the first session and stays put — another sign of a stable personal
      style rather than something learned.'
    how: 'Gap = hand-over rate on big jobs minus small jobs (strategic: three-type minus one-type missions; tactical:
      plans above minus at/below the median size), per session, with person-resampled intervals. Tests: logistic
      GEE with size × session (strategic, all sessions and Strategic Heavy only; tactical) and size × minute of
      session (both tiers). A ratio of odds ratios above 1 would mean the rule sharpens. Caveat from round 2: one-type
      missions occur almost only in Strategic Heavy, so the strategic session comparison is partly between people
      who played that scenario first or second. "No evidence of sharpening", not proof that none happens — the intervals
      still allow a modest change either way.'
    chart: handover.learnGap
    numbers:
    - 'Size × session: strategic ×0.69 [0.33, 1.44], p = .32; Strategic Heavy only ×0.73, p = .49; tactical ×0.80
      [0.54, 1.17], p = .25'
    - 'Size × minute: strategic ×1.04, p = .59; tactical ×0.93 [0.87, 1.00], p = .047 (uncorrected, opposite to
      sharpening)'
    - 'Gap: strategic s1 +25 [+12, +38] → s2 +15 [−1, +30]; tactical s1 +16 [+4, +29] → s2 +14 [0, +30]'
    atoms:
