    codes: []
  - id: size
    title: 'Size: they do not pick small — the queue is small'
    text: 'The opened mission needs fewer drones when the queue is long (about 6.4–8.0 vs 9.1), but so do the missions
      left waiting, because those moments are in the Strategic Heavy games. The opened mission''s rank among those
      waiting (0 = smallest, 1 = largest) sits at or slightly above the random-pick line at every depth — at 5+
      waiting it is above it: they open bigger ones.'
    how: 'Size rank = share of the other waiting missions that need fewer drones than the opened one (ties count
      half). A random pick gives 0.5 on average at any queue length, so this measure cannot be fooled by which game
      the queue is in. Within-person test: rank against queue depth, centred on the person, with minute and game.'
    chart: load.pickSize
    numbers:
    - 'Size rank by depth: 0.56, 0.56, 0.48, 0.46, 0.67, 0.70 (1 to 6+ others waiting; 0.5 = random).'
    - 'Within person: +0.011 per extra mission waiting [−0.026, +0.048], p = .57 — no shift towards small.'
    - 'Opened the SMALLEST waiting mission at 5+ waiting: 10–12% vs 22–29% by chance.'
    atoms:
    - load-pick-small
    role: archive
    role_set: true
    tier: side
  - id: choice
    title: What makes a waiting mission get opened, short vs long queues
    text: 'Putting it together in one model of the choice among what was waiting: being the oldest roughly triples
      a mission''s chance of being opened, larger missions are mildly preferred, and being the newest arrival helps
      a little. These pulls are statistically clear where marked, and none of them changes significantly between
      short (1–3 others waiting) and long (4+) queues: the "long ÷ short" rows all have intervals spanning 1. Under
      pressure, priorities do not visibly change, though with 95 long-queue decisions only a large change could
      have been detected.'
    how: 'Conditional logit: each decision is a choice among the missions waiting at that moment; the model estimates
      how much each feature (oldest, newest, size relative to the set in units of 3 drones, residual) multiplies
      a mission''s odds of being the one opened. Fitted separately for short (1–3 others) and long (4+) queues,
      in the Strategic Heavy games only (like with like) and in all four. Intervals and p-values: people resampled
      1000 times (the short- and long-queue fits on the same resampled people), so they allow for each person making
      many decisions; p = twice the share of resamples on the far side of "no pull". The "long ÷ short" rows are
      the ratio of the two odds ratios with their own interval and p, i.e. a direct test of whether the pull changes
      with the queue. A model-based (Wald) p is in the tooltips as a cross-check.'
    chart: load.choiceSig
    numbers:
    - 'Strategic Heavy games, short queues (178 decisions): oldest ×3.80 [2.29, 6.99], p < .001; newest ×1.33 [0.69,
      2.41], p = .41; +3 drones ×1.36 [1.07, 1.82], p = .014; residual ×1.06, p = .89'
    - 'Strategic Heavy games, long queues (95 decisions): oldest ×2.84 [1.53, 6.06], p = .004; newest ×1.93 [0.94,
      3.58], p = .076; +3 drones ×1.50 [1.05, 2.35], p = .026; residual ×1.77, p = .12'
    - 'Long ÷ short, Strategic Heavy games: oldest ×0.75 [0.35, 1.60], p = .48; newest ×1.45, p = .41; size ×1.10,
      p = .60; residual ×1.67, p = .52 (none differs)'
    - 'All four games: oldest ×2.72 (short) and ×2.92 (long), both p ≤ .004; newest ×1.60, p = .010 and ×1.96, p
      = .040; size ×1.13, p = .25 and ×1.56, p = .020; long ÷ short for size ×1.38 [0.97, 1.95], p = .076, all others
      p ≥ .38'
    atoms:
    - load-pick-small
    role: numbers
    role_set: true
    tier: main
    qual:
      summary: 'Besides criticality, people describe choosing by feasibility: they skip what the reserve cannot
        cover yet and come back (P17, P27, P30). P19 jumped to a newly arrived higher-priority mission, which matches
        the small ''newest'' pull. Nobody mentions preferring larger missions, and nobody says their way of choosing
        changed when the queue was long.'
      featured:
