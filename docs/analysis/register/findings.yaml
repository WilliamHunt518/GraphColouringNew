  - id: pace
    title: 'Pace: a little faster when more is waiting'
    text: What does shift is speed. In minutes that start with more missions waiting, operators make more strategic
      decisions (about 8% more per extra mission), and each decision is slightly quicker (about 3% per extra mission,
      not significant). Deciding manually before the cards have loaded does not rise. Tactical plans take slightly
      longer when the strategic queue is long (+4%, p = .05), plausibly because operators press Suggest and go back
      to the queue while it fills in.
    how: 'Decisions per minute: every person-minute that started with at least one mission waiting (367), Poisson
      GEE on the queue at the minute start (person-centred) with minute-of-session and game. Decision time: log
      seconds from panel open to choice, within person, with mission size, drone types, minute and game. Caveat
      for the rate: a minute that starts with a long queue often follows a slow minute, so part of the rise may
      be catching up rather than rushing — treat as suggestive.'
    chart: load.pace
    numbers:
    - 'Decisions per minute ×1.08 per extra mission waiting [1.04, 1.12], p < .001 (raw: 1.0/min at 0–1 waiting,
      1.4–1.7 at 4+).'
    - Seconds per decision −2.7% per extra mission [−6.2%, +0.8%], p = .13; time beyond the forced card reveal −4.1%,
