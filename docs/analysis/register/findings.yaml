  - id: models
    title: 'Person-adjusted: every size measure, both tiers, one picture'
    text: 'Each row is one within-person estimate: how the odds of handing over change when the same person meets
      a bigger job. Rows right of the line mean "bigger → hand over more". All size measures point the same way
      on both tiers; the two that do not clear the line are strategic tasks and the strategic slope once the cards
      are on screen. The bottom block holds the artefact checks. Dropping every illogical Conservative card leaves
      the effect in place. So does allowing for the fact that every operator played the same fixed missions, so
      one odd mission could otherwise make the interval look tight. With each mission as one point, the share handed
      over still rises with its size on both tiers.'
    how: 'GEE logistic models clustered on person (exchangeable correlation, small-sample "bias-reduced" standard
      errors), size split into within- and between-person parts, game and session held fixed. Odds ratio = how many
      times the odds of handing over multiply per unit of size. Read ×1.6 per doubling as: a person who takes the
      card on 60% of 6-drone missions would be expected to take it on about 71% of 12-drone ones.'
    chart: handover.sizeModels2
    numbers:
    - 'Strategic, illogical Conservative card excluded: ×1.46 [1.12, 1.92], p = .006 (474 decisions)'
    - 'Missions shared across people (interval clustered on person and mission): strategic ×1.60 [1.20, 2.13], p
      = .001; tactical ×2.89 [1.91, 4.37], p < .001 (65 missions)'
    - 'Each mission as one point (missions with ≥ 5 decisions): strategic ρ = .63 over 41 missions, tactical ρ =
      .69 over 41 (both p < .001)'
    - Every estimate is listed with n and p in its tooltip
    atoms:
    - size-decides
    tier: main
