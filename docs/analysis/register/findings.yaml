  - id: visibility
    title: Strategic flaws are visible; tactical flaws are hidden
    text: 'Neither assistant had errors injected for anyone analysed (the ε manipulation ran only for the excluded
      P09). Each tier still has a natural flaw. On the <b>strategic</b> side, it is the illogical extra drone type.
      It sits on the card face next to the mission''s own requirements, everyone saw it, and 12 people mentioned
      it in debrief or interview (15 counting in-play remarks). On the <b>tactical</b> side, it is the wrong refusal:
      Suggest answers ''No workable plan'' when a fix existed using a drone busy on another task. To the operator
      it looks exactly like a correct refusal. 14 people met one (23 wrong refusals out of 39). Four of them reacted
      aloud and accepted it, most saying they would have to abandon. Only P28 named the cause. Only 3 people ever
      described a tactical-plan flaw (C13), and just one of them had been wrongly refused. ''The strategic assistant
      is distrusted more'' may partly be ''its mistakes are the ones you can see''.'
    how: 'Strategic exposure: people with ≥1 illogical-card decision. Tactical exposure: people with ≥1 Suggest
      press in a recovery that returned ''No workable plan'' or a partial plan while a fix using a busy drone existed
      (the ''blind'' flag in h3_recovery). Noticing: qualitative codes C12 and C13 (debrief or interview), plus
      the hand-coded in-play remarks (extras.SPOKEN_STRAT / SPOKEN_TAC), each matched to the nearest preceding Suggest
      press.'
