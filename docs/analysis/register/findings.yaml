  - id: attention
    title: Is the tactical plan given less attention in Strategic Heavy sessions?
    tier: side
    role: extra
    chart: recovery.attention
    text: 'A check of the idea that tactical trust is higher in Strategic Heavy sessions because the tactical plan
      gets less attention there. Raw, it does: in Strategic Heavy sessions people press Suggest less, edit less
      and spend less time in the planner. But Strategic Heavy plans are much smaller (5.3 vs 8.1 drones). Compared
      at the same plan size and session order, the planner is open about 12% less long and the checking is about
      9% shorter, but neither is distinguishable from no difference, and editing is the same. The one clear difference
      is the other way round: on same-size plans people press Suggest <i>more</i> in Strategic Heavy (odds ×1.5).
      People whose planner time drops more do not clearly trust the Tactical Assistant more (ρ = −.24, p = .19).
      And tactical trust itself barely differs between the scenarios (+0.15, p = .25); the gap comes from strategic
      trust. So the attention account is not supported, though a small effect cannot be ruled out.'
    how: '630 tactical plans, 33 people (P09 excluded): 381 in Strategic Heavy sessions, 249 in Tactical Heavy.
      Five measures per plan. <b>Planner time</b>: from the planner opening to Deploy, minus the forced one-second-per-pair
      reveal, on plans where Suggest was pressed (486), so it is time spent with the assistant''s plan. <b>Checking
      time</b>: last Suggest press to Deploy, minus the reveal (the "checking" measure of the section above). <b>Suggest
      pressed</b>, <b>kept unmodified</b> and <b>edited at all</b> on every plan. Each is compared Strategic Heavy
      vs Tactical Heavy with a GEE model clustered by person: times on the log scale (so the result is a ratio of
      typical seconds), yes/no measures as odds ratios. <b>Raw</b> has scenario only; <b>adjusted</b> adds plan
      size (drones × tasks) and session order, so it compares like-for-like plans. The trust link: each person''s
      average size-and-session-adjusted log planner time in each scenario, the Strategic Heavy minus Tactical Heavy
      difference, against their difference in tactical trust; Spearman ρ with a bootstrap 95% CI (31 people with
      Suggest plans in both scenarios).'
    numbers:
    - 'Planner time (Suggest plans): median 11.5 s Strategic Heavy vs 12.8 s Tactical Heavy; adjusted ×0.88 [0.72,
      1.07], p = .21'
    - 'Checking time after the reveal: median 2.5 s vs 3.0 s; adjusted ×0.91 [0.70, 1.17], p = .45'
    - 'Suggest pressed: 73% vs 84% raw (OR 0.56, p = .005); same-size plans OR 1.50 [1.03, 2.18], p = .036'
    - 'Kept unmodified: 71% vs 79% raw (OR 0.67, p = .046); adjusted OR 1.26 [0.88, 1.80], p = .22'
    - 'Edited at all: 2% vs 6% raw (OR 0.44, p = .033); adjusted OR 1.05 [0.32, 3.47], p = .94'
    - 'Attention drop vs tactical-trust rise, person by person: ρ = −.24 [−.56, .12], p = .19, n = 31'
  - id: checking
    title: 'Why the tactical plan is kept: checking it is brief and does not grow with the plan'
    text: 'Bigger missions mean bigger tactical plans. As plans grow, operators press Suggest more often (63% of
      plans with 3 or fewer drones → 93% with 10 or more) and keep the plan unmodified more often (63% → 86%). Once
      Deploy unlocks, they spend a median of about <b>2–4 seconds</b> on the plan whatever its size. Per drone,
      checking therefore falls steeply as plans grow (0.7 s → 0.2 s). A strategy card gets about 9 s. Almost every
      consulted plan is deployed as it comes: 468 of 486. This is the speed-versus-accuracy trade-off the researcher
      expects to come back to. The more there is to check, the less of it is checked proportionally, and the plan
      is taken. Operators describe exactly this. Nine say they check when it is cheap and skip it under pressure
      (C17). Three say the plan was too complex or too fast to check (C14). Five say they checked nearly everything,
      and they do decide more slowly (C18). Only 3 of 33 ever mention noticing a tactical flaw (C13).<br><br><b>But</b>
      the pre-registered mechanism test (H2) is fragile. All three predicted parts point the right way (p = .019
      uncorrected), but it does not survive correction for the round''s several tests (.065). Among consulted plans,
      larger ones are actually modified a little <i>more</i>. Keeping goes up with size mainly because people consult
      more on big plans, not because they check consulted plans more lightly. The logs also cannot tell "too costly
      to check" apart from "nothing ever looked wrong". The tactical plan''s flaws are hard to see, while the cards''
      over-allocation is visible. That half of the explanation belongs to <i>tier-flaw-visibility</i> in f-flaw-odd
      and is not repeated here.'
    how: '630 confirmed tactical plans from 33 people (h2_verification_cost.load). They are grouped by the number
      of drones in the Tactical Assistant''s plan into six bins with no gaps: ≤3, 4–5, 6, 7, 8–9 and 10+ drones.
      The bins were chosen so every bin has enough plans for a stable rate: at least 72 plans and at least 62 with
      a checking time in each (the smallest bins are 4–5 drones, 87 plans, and 10+, 72 plans). Every plan is used;
      none is dropped. "Consulted" means Suggest was pressed at least once. "Kept unmodified" means consulted and
      deployed with no change. "Checking time" runs from the last Suggest press to Deploy, minus the forced reveal:
      the planner adds one drone→task pair per second and Deploy is locked until it finishes, so that wait is not
      checking. Effects per SD of plan size (drones × tasks) come from GEE models on all 630 plans, clustered by
      person, adjusted for scenario and session; they do not depend on the bins. An odds ratio of 1.76 means each
      step up in plan size multiplies the odds of keeping the plan by 1.76. The two ends (10+ vs ≤3 drones) are
      also compared directly. The card comparison takes each person''s median net decision time on strategic decisions:
      strategic_choice latency minus the card reveal, over all strategic decisions, manual ones included. The H2
      numbers are from docs/analysis/round1/h2_verification_cost.md.'
    chart: recovery.checkCost3
    numbers:
    - 'Kept unmodified rises with plan size: OR 1.76 per SD [1.25, 2.47], p = .001 (all 630 plans)'
    - 'Consulted rises: OR 2.52 [1.87, 3.38]; kept once consulted FALLS: OR 0.68 [0.50, 0.94], p = .017'
    - 'By bin (≤3, 4–5, 6, 7, 8–9, 10+ drones; n = 141, 87, 135, 81, 114, 72 plans): Suggest pressed 63%, 71%, 81%,
      83%, 81%, 93%; kept unmodified 63%, 67%, 80%, 80%, 75%, 86%'
    - '10+ drones vs ≤3: Suggest pressed 93% vs 63%, OR 10.8 [3.2, 36.0]; kept 86% vs 63%, OR 5.2 [2.1, 12.7], both
      p < .001'
    - 'Median checking time by bin: 2.0, 3.1, 2.6, 4.2, 2.9, 3.0 s; per SD +0.60 s [−0.15, +1.35], p = .12; per
      drone 0.68 s at ≤3 drones → 0.23 s at 10+'
    - 468 of 486 consulted plans deployed unmodified (96%)
    - 'Person-median check: tactical 2.85 s vs strategy card 8.80 s (n = 33, Wilcoxon p < .0001)'
    - H2 primary p = .019 uncorrected, .065 after Holm correction across round 1
