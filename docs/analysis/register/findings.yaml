  - id: spoken
    title: 'Lined up on the moment they said a strategy card was wrong: card use falls (7 people, a direction only)'
    text: <i>This section is about noticing the strategy card's flaw; section 5 is a different event (the Tactical
      Assistant failing to offer a recovery plan), so the two are not in conflict.</i> You suggested anchoring on
      the moment someone said, during play, that a card was wrong. We did. Seven people made a strict remark (a
      card sends types the mission does not need, or a specific card is wrong); five more made broader 'too many
      drones' remarks. For four of the seven, an illogical card was on screen as they spoke. P30's remark was about
      an illogical card that opened 5 s later, so it was moved onto that card. P29 spoke 28 s after taking the illogical
      card. P04's remark was about too many drones on a three-type card. The chart pools each set of people, before
      vs after the remark, with <b>all missions and one- and two-type missions side by side</b> (buttons add three-type
      missions, and put the broader remarks next to the strict ones). On all missions the seven went from 80% to
      49% (adjusted −21 points [−49, +7], p = .11, timing-matched placebo p = .51; five fell and two rose). On one-
      and two-type missions, the ones that carry the illogical card, the drop is larger, 83% → 35%, but that 'before'
      bar is only 6 decisions from 4 people, so it is a direction, not a measured size. Seven people cannot settle
      it; the direction matches the main result.
    how: The spoken moments were hand-coded from the in-play narration before any behaviour around them was computed
      (extras.SPOKEN_STRAT, session time). A decision whose card was open at that moment is the anchor decision.
      Otherwise, 'before' and 'after' are split at the remark. The same models and placebo as above are used.
    chart: flaw.spokenBars
    numbers:
