      gap between the two card totals + game + session + minute. Every one of the 209 builds is predicted as each
      kind in turn and averaged, so the three kinds are compared on the same mix of missions; the four shares are
      rescaled to 100%. Intervals: people resampled 1,000 times, models refitted. The person is not held fixed (too
      few builds each).'
