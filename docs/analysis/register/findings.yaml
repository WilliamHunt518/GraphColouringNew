  replies:
  - card: size-decides
    text: 'Shown separately for strategic (card taken) and tactical (Suggest pressed) and combined, as a dose-response
      over drones needed, drone types, tasks and plan size, with person-resampled intervals and a within-person
      model (each person compared only with themselves). Both tiers show it; the tactical tier more steeply (×2.1
      per doubling of plan size vs ×1.6 per doubling of drones strategic). Artefact check: it survives dropping
      every illogical Conservative card (×1.46, p = .006), and on one-type missions uptake does not depend on whether
      the card was illogical. New nuance: on the strategic tier most of the effect is deciding small missions before
      the cards load; with the cards on screen the slope is weak (×1.26, p = .12).'
  - card: speed-big-jobs
    text: 'Graphed as decision time by route × size, both tiers, raw seconds. Holds: cards −27% on three-type missions,
      no gain (+22%, p = .09) on one-type ones, where deciding before the cards appear is fastest (6.4 s). Tactical:
      same time on small plans, 45 vs 25 s on large. Linked into f-size-decides as the reason the rule is sensible.'
  - card: speed-parallel
    text: 'The 4.8 is an odds ratio from round 1''s model on the 630 tactical plans: Suggest plan vs the same person''s
      hand-built plans, outcome "opened another mission''s strategic panel before confirming", plan size and open
      time held fixed. Raw: 45% vs 19%. "During the fill" was loose wording — the measure is the whole time the
      planner is open; 22% of Suggest plans had it inside the fill window itself. Reproduced exactly (×4.83) and
      robust (×2.4 to ×6.4 across six specifications; 28% vs 11% actually allocated another mission). Graph is time-matched.'
  - card: q-C06
    text: 'C06 = P06, P15, P16, P26, P27, P29. Profiled against everyone: same reliance, slightly better scores,
      but they pre-empt the cards twice as often, show a bigger small-vs-big gap and decide faster — the size rule
      applied hardest. Placed as the closing "exceptions" section of f-size-decides.'
  - card: q-C03
    text: Merged as supporting evidence (section 'What operators say'); their size slope is not reliably steeper
      than others'.
  - card: q-C04
    text: Merged into the speed section and 'What operators say'.
  - card: q-C05
    text: Merged into the parallel-work section.
  open:
  - 'Framing the strategic tier: the size rule there is mostly ''do not wait for the advice on small missions''
    (pre-emption). Should the headline say ''decides when to consult'' rather than ''decides whether to accept''?'
  - Switching the tactical tier's main size measure from plan size to drones needed (done here; plan size kept as
