  - id: dip
    title: What the dip is, and why the card is not needed for it
    tier: side
    role: archive
    chart: flaw.dip
    text: 'Counted by decision number within the session (no alignment), the noticers'' dip is a stretch early in
      session 1: <b>decisions 3–5</b>, about minutes 1–4. There they took a card on 48% of decisions, against 69%
      on the rest of their session 1. Never-said people did the opposite: 87% against 62%. 10 of 15 noticers fell
      and 1 rose; 12 of 18 never-said rose and none fell. The game order gives a natural test. Players with the
      strategic-heavy game first met the illogical card on their 2nd decision. Most players with the tactical-heavy
      game first did not meet it until decision 5 (7 people) or the start of session 2 (9 people), so 95% of their
      noticers'' decisions 3–5 came <b>before any illogical card</b>. Their noticers dip all the same: −21 points
      per person using only decisions made before the card, against −32 for the strategic-heavy-first noticers.
      Game order makes no difference to the dip (+4 points, p = .79). Once the window is held fixed, having seen
      the card adds only −15 points (p = .39). <b>What they did instead</b>: they looked at the cards and built
      the allocation by hand (40% manual after the cards loaded, against 17% in decisions 1–2 and 12% later), on
      three-type missions too (53% took a card). <b>What it is not</b>: the expected-value model already holds mission
      size, types, minute, queue, game and the person''s own rate, and the adjusted dip is just as large (−27 points).
      Adding the queue and the mission type changes nothing (−24). The reserve first runs short of a needed type
      in exactly this stretch (50% of decisions, from 3%), but equally for both groups, and a short reserve does
      not predict declining. It does not come back at the same point of session 2 (difference −2 points, p = .85).
      In session 2, noticers are lower throughout (47–53% for their first six decisions). On three-type missions
      their first two decisions of session 2 are the lowest (43–44% in both game orders), whether they met the card
      in session 1 or at the start of session 2. So the aligned ''1st–3rd after the card'' dip mixes two different
      moments: session-1 decisions 3–6 for strategic-heavy-first players (57% on three-type, n 21) and the start
      of session 2 for most tactical-heavy-first players (38%, n 24, 92% of it session 2). <b>Reading</b>: the dip
      is a behaviour of the people who would later say they noticed. They scrutinise and turn down the cards at
      the first busy stretch, card or no card. Scrutiny is plausibly what makes them notice, not the other way round.
      What triggers it at that moment is not in the log.'
    how: 'Rows: every strategic decision of session 1 (P09 excluded), numbered 1, 2, 3, … within the session across
      all missions. The window (decisions 3–5) was read off the unaligned curve, so its p-values are descriptive;
      the <b>Other windows</b> view shows 2–4, 3–4, 3–6, 4–6 and 2–6 as well. Per-person dip = a person''s share
      of card takes in decisions 3–5 minus their share in the rest of session 1, averaged over people. Intervals
      come from resampling people; p is a one-sample t-test over people. For tactical-heavy-first players a stricter
      version keeps only window decisions made before their first illogical card. Models (linear, people clustered,
      game held fixed): took ~ window (+ after-card, + queue + three-type); the game-order test is window × tactical-heavy-first
      within each group. Adjusted = observed − the expected value from the adjustment model in the sidelined panel.
      Session 2 uses the same window and the window × noticed interaction. ''Manual after the cards loaded'' vs
      ''before'' uses the log''s manualBeforeCardsLoaded flag.'
    numbers:
    - 'Noticers (15), session 1: decisions 3–5 48% (n 42) vs rest 69% (n 80); per person −27 points [−42, −14],
      p = .003; 10 fell, 1 rose, 4 same'
    - 'Never said (18): 87% (n 54) vs 62% (n 109); +19 points [+11, +27], p < .001; 12 rose, 0 fell'
    - 'Strategic-heavy-first noticers (card at decision 2): −32 points [−55, −10] (7 people, p = .04); tactical-heavy-first
      noticers: −23 [−42, −6] (8 people, p = .05); using only decisions before any illogical card −21 [−40, −4],
      p = .06'
    - 'Window × tactical-heavy-first (noticers): +4 points [−28, +36], p = .79; the card term once the window is
      held fixed: −15 points [−52, +22], p = .39 (adjusted −9, p = .10)'
    - 'Same with queue and mission type held fixed: −24 points, p = .007; adjusted for the full expected-value model:
      −27, p = .004'
    - 'Noticers minus never-said in the window: session 1 −46 points [−65, −26]; session 2 −2 points [−28, +23],
      p = .85'
    - 'Other windows (difference): 2–4 −22 (p = .05), 3–4 −38, 3–6 −33, 4–6 −25 (p = .03), 2–6 −26 (p = .05)'
    - 'What noticers did in decisions 3–5: took 48%, manual after the cards loaded 40% (17% in decisions 1–2, 12%
      later), manual before they loaded 12%; three-type 53% (n 32)'
    - 'Reserve short of a needed type: 50% of noticers'' and 46% of never-said decisions 3–5 (3% and 0% in decisions
      1–2)'
    - 'Aligned ''1st–3rd three-type after the card'': strategic-heavy-first noticers 67% before (n 6) → 57% (n 21,
      all session 1); tactical-heavy-first noticers 76% (n 45) → 38% (n 24, 92% session 2)'
    role_set: true
  - id: over-time
    title: Card use through the session, noticers and never-said
    tier: main
    role: paper
    chart: flaw.overTime
    text: '<b>What is plotted.</b> Every strategic decision is placed in the minute of the session when its strategy
      panel opened (0–1 is the first minute). Each point is the share of the decisions in that minute where the
      person took one of the two strategy cards instead of allocating by hand, with a 95% band. Nothing is lined
      up on the illogical card; the small ticks on the axis show when each person first met it. By default it shows
      <b>each group and everyone pooled</b> (dashed line). <b>Session 1</b>: noticers start at 86% in the first
      minute, fall to 50%, 50% and 38% over minutes 1–4, and come back to 73% in minute 4–5. Never-said people rise
      over the same minutes, 65% → 88%. Everyone pooled sits between the two and stays at 61–77%: the two groups
      move in opposite directions, so lumping them together hides the dip. That is the point of this chart. <b>Session
      2</b>: noticers are lower throughout (52–53% in the first three minutes, 38% in minutes 3–5, then 55–73%);
      never-said people sit between 61% and 89%. Each minute holds 10–30 decisions per group, so single minutes
      have wide bands: the shape, not any one point, is the result. Buttons: session, which lines (each group +
      everyone, the two groups, everyone only), missions, game order, and observed or adjusted.'
    how: 'Rows: every strategic decision, binned by the minute of the session at which its panel opened (the last
      bin, 7–8 min, is thin). Rate = share of decisions where a card was taken; 95% bands from resampling people.
      Adjusted = the group''s overall rate plus the mean of (observed − expected) from the adjustment model, i.e.
      relative to each person''s own habit given the mission in front of them. Game order: strategic-heavy-first
      players met the illogical card at about 67 s of session 1; 7 tactical-heavy-first players at about 315 s,
      the other 9 at the very start of session 2.'
    numbers:
    - 'Session 1, noticers by minute 0–1 to 4–5: 86% (n 21), 50% (n 16), 50% (n 14), 38% (n 16), 73% (n 11)'
    - 'Session 1, never said: 65% (n 31), 71%, 88%, 76%, 69%'
