      way (P18, P26, P28) give size or effort as the reason, not continuity. <b>Overall-average marker:</b> the
      chart has a new ''Overall average'' toggle that puts a dark marker across each pair of bars at the rate for
      all plans in that group, so you can see both routes closing in on it as missions grow. <b>Is it a few people?</b>
      See the new section just below.'
  - id: route-people
    title: 'Card then Suggest, person by person: a broad tilt, but a few people carry much of it'
    chart: handover.routePeople
    tier: main
    role: numbers
    text: 'You asked whether the card → Suggest link is down to a few people. Partly. Each bar is one person: how
      much more often they pressed Suggest on missions they had allocated from a card than on ones they allocated
      by hand, with mission size held (the second view shows the two raw rates). Of the 26 people who did both often
      enough to compare, <b>17 lean towards Suggest after a card, 8 the other way, 1 neither</b>, so it is not one
      or two people. But it is uneven: the three biggest gaps (P13, P06, P15) make up about half of the total, and
      the person-adjusted odds ratio (×2.10 for everyone) falls to ×1.63 without those three (still p = .03) and
      to ×1.46 without the top five (p = .08). Leaving out any single person never moves it outside ×1.90–×2.40.
      So: a general tendency, strongest in a handful of people. Seven people cannot show a gap at all, six because
      they nearly always took a card before planning.'
    how: 'Rows: the 627 tactical plans with a known mission size, split by how the mission was allocated (strategy
      card or by hand). For each person with at least two plans each way, the gap is the mean of (pressed Suggest
      − expected) after a card minus the same after a hand allocation, where ''expected'' comes from a person-clustered
      model of Suggest on mission size (drones needed, within and between person), game and session, without the
      route; so the gap compares missions of the same size. The odds ratio is the section above''s route model (card
      vs hand, same person, size held), refitted leaving out one person at a time, and then leaving out the people
      with the 1, 3, 5 and 8 largest gaps. The sign test asks whether more people lean one way than chance.'
    numbers:
    - 'People with ≥ 2 plans each way: 26. Gap (size held) positive 17, negative 8, none 1; sign test p = .11; mean
      gap +11 points.'
    - Card vs hand odds ratio, everyone ×2.10; leaving out any one person ×1.90 (without P15) to ×2.40 (without
      P11), always p < .05.
    - 'Without the largest gaps: top 1 (P13) ×1.97, p = .006; top 3 (P06, P13, P15) ×1.63 [1.05, 2.52], p = .03;
      top 5 ×1.46 [0.96, 2.22], p = .08; top 8 ×1.23, p = .34.'
    - 'The three largest gaps are 52% of the summed gap. Not comparable: 6 people almost only planned after a card,
      1 almost only after a hand allocation.'
    - 'Also holding fixed whether the mission needs one drone type: ×2.13 [1.30, 3.49]; and the number of tasks
      too: ×2.06 [1.24, 3.43], p = .005.'
    done: 'Quotes from the people who do not fit are now under this section, with a summary above them. Five are
      marked as Claude''s picks; highlight the ones you want. In short: the people with the biggest card → Suggest
      gap (P13, P15, P06, then P29) do not describe linking the two steps. They describe a rule for the whole mission:
      hand over the complicated ones at both steps, do the simple ones yourself. The people who go the other way
      (P20, P03, P11, P31) allocate by hand for other reasons, such as a shortage, checking the card, or wanting
      to own the plan, and then use Suggest or not regardless. P13, the largest gap, says the opposite of what they
      did: ''I always let the agent do it first'', but none of their five plans after a hand allocation used Suggest.
      I tested the whole-mission idea against the data: holding fixed whether the mission needs one drone type and
      how many tasks it has, as well as drones needed, leaves the link at ×2.06 [1.24, 3.43] (×2.10 before). So
      the ''complicated'' that people describe is not captured by the mission''s features. Either it is a judgement
      made in the moment, or the link is the carry-over that P21, P10 and P30 describe (previous section).'
    qual:
      summary: 'The people at the ends of the chart, in their own words (added 2026-10-19 at your request). <b>Strongest
        tilt</b> (P13, P15, P06, then P29): none of them talks about linking the two steps. They describe a rule
        for the whole mission: P15 hands over when there are ''too many decisions'', P29 does one-colour missions
        themself and lets the assistant take multi-colour ones, and P06 drags and drops less as the work piles up.
        P13''s hand allocations are disagreements with over-stocked cards (''why would I spend more resources''),
        and they say ''I always let the agent do it first'' on the tactical step, yet none of their five plans after
        a hand allocation used Suggest. Their words do not explain their gap. <b>Leaning the other way</b> (P20,
        P03, P11, P31): their hand allocations are of a different kind. P20 builds by hand when the card cannot
        be met (''I''ve run out of blues'') and then presses Suggest because the mission has many tasks. P03 works
        every allocation out first and checks the card against it. P11 rarely presses Suggest at all and does not
        want ''to be reduced to pressing allocate, suggest, deploy''. P31 lets Suggest get ''the majority of the
        way'' whatever happened at the strategic step. <b>Only one route</b>: P21, who almost always allocated by
        hand, gives the clearest account of carrying a plan from one step to the next (''it''s going to disrupt
        my thought process''). The card-only people (P07, P12, P14, P25, P27, P34) mostly give speed and urgency
        as the reason; P14 used the assistants ''for almost every allocation''.'
