  - id: trust
    title: Trust goes with style between people, not within a person
    text: People who rely more on the Strategic Assistant report trusting it more (left). But when the same person
      relies more in one session than the other, their trust does not move with it (right). So trust and reliance
      are both part of who someone is, rather than one driving the other session by session. The tactical side shows
      the same shape, more weakly. This is the same between-vs-within split as the performance result (next finding).
    how: 'Session rows (66). Card uptake (or Suggest use) and post-session trust (mean of six 1–7 items) are each
      game-adjusted by subtracting the mean of everyone who played that game. Left: each person''s average over
      the two sessions (n = 33). Right: session 2 minus session 1 for each person (n = 33). Spearman ρ with Fisher
      intervals; the grey line is a least-squares guide. A regression with both terms (GEE, game fixed) agrees:
      per +25 points of card uptake, between people +0.71 trust points [0.42, 1.00], within a person +0.20 [−0.52,
      0.93].'
    chart: style.trustBW
    numbers:
