- id: f-triage
  area: Workload and the queue
  title: Busy operators speed up a little but do not change what they pick
  headline: 'The earlier story — that with a long queue operators abandon order and pick smaller missions — does
    not survive a fair comparison. Long queues happen almost only in the two Strategic Heavy games, where every
    mission is small, so the opened mission is smaller simply because everything waiting is. Compared with what
    was actually waiting, operators keep the same priorities at any queue length: a strong pull towards the oldest
    mission, a mild preference for larger ones, and only falling ''oldest-first'' rates because chance falls as
    more missions wait. What does change is pace: a bit more decisions per minute when more is waiting (suggestive).'
  confidence: mixed
  absorbs:
  - load-pick-small
  sections:
  - id: games
    title: Where long queues happen
    text: The four games differ in how many missions arrive and how big they are. The Strategic Heavy games send
      many small missions (13–14 per session, about 6.5 drones each); the Tactical Heavy games send few large ones.
      96 of 102 decisions made with 4+ others waiting are in the Strategic Heavy games. Any comparison of 'long
      vs short queue' is therefore also a comparison of games unless the game is held fixed.
    how: 'Per session, from the event log: missions arrived (excluding residual re-queues), drones and tasks they
      needed, and the mean queue met at strategic decisions.'
    chart: load.games
    numbers:
    - 'Drones demanded per session: Tactical Heavy 2 115, Strategic Heavy 1 89, Strategic Heavy 2 88, Tactical Heavy
      1 63.'
    - 'Mean queue at a decision: Strategic Heavy 1 2.6, Strategic Heavy 2 2.0, Tactical Heavy 2 1.3, Tactical Heavy
      1 0.9.'
    - 'Decisions with 4+ others waiting: Strategic Heavy 1 64, Strategic Heavy 2 32, Tactical Heavy 2 6, Tactical
      Heavy 1 0.'
    atoms:
    - load-pick-small
  - id: order
    title: 'Order: still oldest-first well above chance'
    text: The share of decisions that open the oldest waiting mission falls as the queue grows (59% with one other
      waiting, about 30% with five) — but so does the chance of hitting the oldest by picking at random (50% → 17%).
      Measured against chance, the pull towards the oldest stays roughly the same. 'One of the top 3 in the list'
      is near chance at every depth, so the list position itself does little beyond 'oldest first'.
    how: '414 strategic decisions where at least one other mission was waiting (33 people). For each, the set of
      missions waiting when the panel opened (arrival order from the log). Chance = 1 / (number waiting) for ''oldest'';
      3 / (number waiting) for ''top 3''. Intervals: people resampled 400 times. Within-person test: (picked oldest
      − chance) against queue depth, person-centred, with minute and game. Caveat: the list could be re-sorted by
      score and that toggle was never logged.'
    chart: load.pickOrder
    numbers:
    - 'Opened the oldest: 59% (1 other waiting; chance 50%), 48% (33%), 54% (25%), 40% (20%), 29% (17%), 20% (14%).'
    - 'Within person, the excess over chance does not shrink with depth: +2.4 points per extra mission [−1.0, +5.7],
      p = .16.'
    atoms:
    - load-pick-small
  - id: size
    title: 'Size: they do not pick small — the queue is small'
    text: 'The opened mission needs fewer drones when the queue is long (about 6.4–8.0 vs 9.1), but so do the missions
      left waiting, because those moments are in the Strategic Heavy games. The opened mission''s rank among those
      waiting (0 = smallest, 1 = largest) sits at or slightly above the random-pick line at every depth — at 5+
      waiting it is above it: they open bigger ones.'
    how: 'Size rank = share of the other waiting missions that need fewer drones than the opened one (ties count
      half). A random pick gives 0.5 on average at any queue length, so this measure cannot be fooled by which game
      the queue is in. Within-person test: rank against queue depth, centred on the person, with minute and game.'
    chart: load.pickSize
    numbers:
    - 'Size rank by depth: 0.56, 0.56, 0.48, 0.46, 0.67, 0.70 (1 to 6+ others waiting; 0.5 = random).'
    - 'Within person: +0.011 per extra mission waiting [−0.026, +0.048], p = .57 — no shift towards small.'
    - 'Opened the SMALLEST waiting mission at 5+ waiting: 10–12% vs 22–29% by chance.'
    atoms:
    - load-pick-small
  - id: choice
    title: What makes a waiting mission get opened, short vs long queues
    text: 'Putting it together in one model of the choice among what was waiting: being the oldest roughly triples
      a mission''s chance of being opened, being the newest arrival helps a little, and larger missions are slightly
      preferred — and these pulls are about the same with 1–3 others waiting as with 4+. Under pressure, priorities
      do not visibly change.'
    how: 'Conditional logit: each decision is a choice among the missions waiting at that moment; the model estimates
      how much each feature (oldest, newest, size relative to the set in units of 3 drones, residual) multiplies
      a mission''s odds of being the one opened. Fitted separately for short (1–3 others) and long (4+) queues,
      in the Strategic Heavy games only (like with like) and in all four. Intervals: people resampled 200 times.'
    chart: load.choice
    numbers:
    - 'Strategic Heavy games, short queues (178 decisions): oldest ×3.8 [2.3, 7.2], newest ×1.3 [0.7, 2.4], +3 drones
      ×1.36 [1.07, 1.77].'
    - 'Strategic Heavy games, long queues (95 decisions): oldest ×2.8 [1.5, 5.9], newest ×1.9 [0.9, 3.3], +3 drones
      ×1.50 [1.11, 2.63].'
    atoms:
    - load-pick-small
  - id: pace
    title: 'Pace: a little faster when more is waiting'
    text: What does shift is speed. In minutes that start with more missions waiting, operators make more strategic
      decisions (about 8% more per extra mission), and each decision is slightly quicker (about 3% per extra mission,
      not significant). Deciding manually before the cards have loaded does not rise. Tactical plans take slightly
      longer when the strategic queue is long (+4%, p = .05), plausibly because operators press Suggest and go back
      to the queue while it fills in.
    how: 'Decisions per minute: every person-minute that started with at least one mission waiting (367), Poisson
      GEE on the queue at the minute start (person-centred) with minute-of-session and game. Decision time: log
      seconds from panel open to choice, within person, with mission size, drone types, minute and game. Caveat
      for the rate: a minute that starts with a long queue often follows a slow minute, so part of the rise may
      be catching up rather than rushing — treat as suggestive.'
    chart: load.pace
    numbers:
    - 'Decisions per minute ×1.08 per extra mission waiting [1.04, 1.12], p < .001 (raw: 1.0/min at 0–1 waiting,
      1.4–1.7 at 4+).'
    - Seconds per decision −2.7% per extra mission [−6.2%, +0.8%], p = .13; time beyond the forced card reveal −4.1%,
      p = .06.
    - 'Manual before the cards load: OR 1.02 [0.90, 1.15], p = .76.'
    - Tactical plan time +4.3% per extra strategic mission waiting, p = .05.
    atoms:
    - load-pick-small
  - id: visible-t
    title: What the operator can see of the queue
    text: Beyond about 3.5 cards the rest of the queue is only on the strategic map. Picks of missions outside the
      top 3 are about as common as chance would give, so operators do pick off the map — but the oldest-first pull
      stays, which suggests they track mission age rather than list position.
    how: Read off the recordings (P19, P30); top-3 rates against chance as in the order section.
    chart: queueImages
    atoms:
    - load-visible
    sharedWith:
    - f-workload
  replies:
  - card: load-pick-small
    text: 'Checked it properly and it mostly does not survive. The ''smaller missions'' result is a game effect:
      96 of 102 long-queue decisions are in the Strategic Heavy games, where all missions are small; against what
      was actually waiting, operators pick the same way at any queue length (size rank within person +0.01 per mission,
      p = .57; at 5+ waiting they open LARGER than average). The fall in ''oldest-first'' is mostly chance falling
      as more missions wait. What does change is pace: more decisions per minute (×1.08 per extra mission). Now
      graphs by depth with chance lines, a choice model, and a pace section.'
  open:
  - This reverses the card you liked. The honest finding is 'priorities do not change, pace changes a little'. Decide
    whether f-triage stands as its own finding or becomes a section of f-workload ('busy operators do not hand over,
    and they do not re-prioritise — they speed up').
  - The queue sort toggle (arrival vs score) was never logged; any operator who switched to score order would see
    big missions on top, which could produce the mild preference for larger missions.
  source: load
- id: f-flaw-odd
  area: When the assistant gets it wrong
  title: People who noticed the illogical card stopped using the cards where it appears; elsewhere they dipped for
    a while, but the dip is not clearly caused by the card
  headline: 'The Conservative card sometimes adds a drone type the mission does not use (22% of decisions, nearly
    all on one-type missions). All 33 people saw it, usually on their 1st or 2nd decision. The clearest effect is
    on the one-type missions where the extra type appears. The 15 people who said they noticed it took the cards
    less with each such mission, until by their 4th–6th they took a card 0 times in 13. Instead they went manual
    before the cards had even loaded. The 18 who never said it drifted the other way, taking more cards, the illogical
    one included. The difference in these trends is very unlikely to be chance (p < .001). On three-type missions,
    which never carry the flaw, noticers'' uptake dips (about −17 points adjusted, p = .06) and recovers by about
    their 7th three-type decision, while non-noticers'' rises a little. But that dip is not tied to the moment of
    the card: the card comes so early that other equally early cut points show the same drop. And ''noticed'' is
    known only from what people said afterwards. Suggestive, not causal.'
  confidence: suggestive
  absorbs:
  - flaw-odd-card
  - flaw-dots
  - manual-card-error
  - meth-h8-invalid
  - q-C12
  - q-C15
  sections:
  - id: card
    title: What the illogical card is, and when people first met it
    text: 'The Conservative strategy tops up every drone type with 15% of the spare reserve, including types the
      mission never uses. This is a deliberate, known feature of the build (STUDY_BUILD §19), not an injected error,
      and no injected errors ran for anyone analysed. So on a mission that needs only Fast drones, the Conservative
      card can also send a Lifter and a Camera. This happened on <b>132 of 606</b> strategic decisions: 129 on one-type
      missions, 3 on two-type missions and none on three-type missions. Everyone met it early: <b>17 of 33</b> on
      their 1st or 2nd strategic decision of the study, and 9 not until session 2. For most people, then, ''before
      the card'' is just one or two decisions at the very start, when they are still learning the task. That limits
      every before/after comparison below.'
    how: 'Rows: every strategic decision (P09 excluded), in study order across both sessions. A decision is ''illogical''
      when the Conservative card''s true drone counts include a type for which the mission''s tasks need 0 drones
      (build_findings_synthesis.load_decisions, the odd flag). The anchor is each person''s first such decision.
      The chart counts which decision number that was.'
    chart: flaw.timing
    numbers:
    - 132 of 606 decisions (21.8%) carry the illogical card; 129 are on one-type missions
    - 'First illogical card: median the person''s 2nd decision; 17 of 33 meet it on decision 1 or 2; 9 not until
      session 2'
    - 'Three-type decisions before it: median 1 per person; 3 people have none'
    atoms:
    - flaw-odd-card
  - id: event
    title: The event study, rebuilt so every dot can be trusted
    text: 'Each person''s decisions are now numbered <i>within</i> the kind of mission plotted: their 1st, 2nd,
      3rd three-type decision after the card, and so on. Everyone has a +1, a +2 and so on until their decisions
      run out. The positions are then grouped (1st–3rd, 4th–6th, 7th–9th, 10th+). Each bin gets a 95% interval from
      resampling people, and each person''s own line is drawn faintly behind the group mean. On <b>three-type missions</b>,
      people who said they noticed went from 75% card uptake before to 47% in their 1st–3rd decisions after, 63%
      in the 4th–6th and 72% in the 7th–9th: a dip, then a return. Non-noticers stayed between 72% and 83% throughout.
      The same shape shows on all missions. Noticers fall from their first decisions; non-noticers rise slightly.
      The gap between the two groups is about 15 points (p = .06–.09). It is concentrated in the first five three-type
      decisions after the card (−25 points, p = .02) and gone from the 6th onwards (−2 points). That fits your reading
      of a dip followed by recovery. But the five-decision window was chosen after seeing the curve, so treat its
      p-value as descriptive.'
    how: 'Rows: strategic decisions of the 33 people, split into those who said they noticed (debrief or interview
      code C12, or a strict in-play remark; 15 people) and those who never said so (18). ''Before'' and ''after''
      are relative to the first illogical card. That decision itself is excluded from both windows and shown as
      its own point (''the card'') in the all-missions view. Change = the ''after'' coefficient in a linear model
      of card uptake, with practice (decision number) held fixed and people clustered for the uncertainty. Raw version:
      uptake ~ after + practice + game. Adjusted version: (observed − expected) ~ after + practice. The interaction
      asks whether the after-step differs between the groups. Label shuffle: the said/never-said labels were shuffled
      across people 5,000 times, to see how often a random split of the same people shows as large a difference
      in their own after-minus-before. Each person counts once in that test, so it is exact.'
    chart: flaw.events
    numbers:
    - 'Three-type, said they noticed (15 people): 75% before (n 51) → 59% after (n 129); adjusted change −17.5 points
      [−36, +1], p = .06; 10 fell, 4 rose'
    - 'Three-type, never said (18 people): 79% (n 52) → 78% (n 181); adjusted +10.8 points [−5, +27], p = .17; 5
      fell, 11 rose'
    - 'Difference between the groups: −14.7 points adjusted [−32, +2], p = .09; label shuffle p = .06 (three-type),
      .05 (all missions)'
    - 'Noticers by bin (adjusted): before 69%, 1st–3rd 50%, 4th–6th 61%, 7th–9th 68%, 10th+ 63%'
    - 'Odds-ratio form, for continuity with the old card: noticers OR 0.21 [0.04, 1.05], p = .057'
    atoms:
    - flaw-odd-card
    - flaw-dots
    codes:
    - C12
  - id: nth
    title: One dot per person per position (the 'everyone has a +1, +2' view)
    text: 'This is the chart you described: the Nth three-type decision after the card, with exactly one decision
      per person per dot. The n falls only as people run out of decisions. The dip shows at +1 to +3 for noticers
      (53%, 33%, 53%). Each dot, though, is about 15 single yes/no decisions, so its interval runs roughly from
      30% to 75%. Individual dots cannot carry a claim. The bins above are the readable version.'
    how: 'Rows: three-type decisions; k = the decision''s rank among that person''s three-type decisions after (or,
      counting back, before) the first illogical card. Rate = the share who took a card at that k. Interval = Wilson
      95%.'
    chart: flaw.nth
    numbers:
    - 'Noticers at +1/+2/+3: 53%, 33%, 53% (n 15 each)'
    atoms:
    - flaw-dots
  - id: odd-missions
    title: On the missions that carry the flaw, noticers stop using the cards
    text: 'This is the cleanest behavioural trace, and it is where you would expect one. On their 1st illogical-card
      mission, noticers took a card 47% of the time and never-said people 56%. With each further illogical-card
      mission, noticers took a card about 14 points less often. By their 4th–6th they took one <b>0 times in 13</b>
      (7 people), going manual instead, mostly <i>before the cards had loaded</i> (62%). Non-noticers moved the
      other way: by their 4th–6th they took a card 74% of the time. Most of that was the illogical Conservative
      card itself (52%), which noticers took 0 times in 13. The handover analyst''s check fits this: when people
      build a one-type mission by hand rather than take the Conservative card, nearly all of the ''trim'' is dropping
      the unneeded-type spares (−1.2 drones overall, +0.05 on the types the mission needs). So hand-builders strip
      out exactly what is illogical; see f-manual-cards. The manual-card-error card''s version (people who mention
      a card error go manual more on one-type missions) holds in direction. But the same people also go manual more
      on three-type missions, where nothing is wrong (37% vs 22%). The one-type-<i>specific</i> part does not hold
      between people (interaction OR 1.12, p = .78). What is specific to the flawed missions is the <i>trend</i>:
      noticers learn to skip the cards there.'
    how: 'Rows: the 132 illogical-card decisions, numbered per person (1st, 2nd, …). Each is coded by what happened:
      took the Conservative card (the illogical one), took Aggressive, manual after the cards loaded, or manual
      before they loaded (a pre-emptive choice that never saw the cards). Trend = a linear model of each outcome
      on the card''s number (capped at 7) × group, with game held fixed and people clustered. The interaction p
      is whether the two groups'' slopes differ. Between-person check (manual-card-error): manual ~ said + game
      on one-type missions, then on three-type, then the said × one-type interaction (logistic GEE, people clustered).'
    chart: flaw.oddMissions
    numbers:
    - 'Took any card, per extra illogical card: noticers −13.9 points [−25, −3]; never-said +5.3 [−2, +12]; difference
      p < .001'
    - 'Took the illogical Conservative card: noticers −3.5 points per card; never-said +9.3 [+1, +18]; difference
      p = .001'
    - 'Manual before the cards loaded: noticers +15.4 points per card [+2, +29]; never-said −5.8; difference p =
      .012'
    - '4th–6th illogical card: noticers took a card 0 of 13 (7 people); never-said 74% of 23 (11 people), 52% the
      illogical card'
    - 'Manual on one-type missions: noticers 63% vs 37%, OR 2.41 [0.92, 6.32], p = .07; on three-type 37% vs 22%,
      OR 2.29, p = .06; one-type × noticed OR 1.12, p = .78'
    atoms:
    - manual-card-error
    - flaw-odd-card
    codes:
    - C12
    - C15
  - id: not-time-locked
    title: Why the three-type dip cannot be pinned on the card
    text: 'Three checks stop us saying ''the card caused the dip''. <b>(1) Timing.</b> The card arrives so early
      that ''after the card'' almost means ''after the first couple of decisions''. When each noticer''s anchor
      is moved to a random but equally early point (drawn from the real anchor positions), their drop is just as
      large: −13 vs −14 points on average, p = .92. With random anchors placed anywhere in the session, p = .20
      (.07 for the first five decisions). So noticers drift down from their first decisions rather than step down
      at the card. Non-noticers'' rise, by contrast, is larger than random anchors give (p = .01–.09). <b>(2) Who.</b>
      Noticers are less card-reliant people overall: they took cards on 55% of decisions against 73% (p = .03).
      Yet before the first card they took them on three-type missions at the same rate (68% vs 63%, p = .76). The
      gap opens afterwards. That is consistent with noticing mattering, but also with the reverse: people who start
      doing more by hand look harder at the cards and so notice more. <b>(3) ''Said'' is post hoc.</b> A person
      who never said it may still have seen it. 17 of the 18 never-said people were narrating during play, which
      makes their silence some evidence, but not proof.'
    how: 'Timing-matched placebo: each person''s real anchor is replaced 2,000 times by a cut drawn from the real
      anchor positions of their group. The statistic is the mean over people of (mean residual after − mean residual
      before). p = how often the placebo differs from its own average by as much as the real one does. Uniform placebo:
      the same, with the cut drawn anywhere in the person''s sequence. Group profile: per-person rates compared
      with Mann–Whitney tests (15 vs 18 people).'
    chart: flaw.people
    numbers:
    - 'Noticers'' drop vs timing-matched random anchors: −0.13 vs −0.14, p = .92; vs anywhere-anchors p = .20 (first
      five: p = .07)'
    - 'Non-noticers'' rise vs anywhere-anchors: +0.13 vs 0.00, p = .01'
    - 'Card uptake, all decisions: noticers 55% vs never-said 73%, p = .03; three-type before the first card 68%
      vs 63%, p = .76'
    - 17 of 18 never-said people had in-play narration recorded
    atoms:
    - flaw-odd-card
  - id: spoken
    title: Lined up on the moment they said it
    text: You suggested anchoring on the moment someone said, during play, that a card was wrong. We did. Seven
      people made a strict remark ('a card sends types the mission does not need, or a specific card is wrong');
      five more made broader 'too many drones' remarks. For four of the seven, an illogical card was on screen as
      they spoke. P30's remark was about an illogical card that opened 5 s later, so the narration timing is only
      good to a few seconds; it was moved onto that card. P29 spoke 28 s after taking the illogical card. P04's
      remark was about too many drones on a three-type card, not about an unneeded type. Of the seven, five fell
      and two rose. Their card uptake on all missions went from 80% to 49%, but the adjusted change is −21 points
      [−49, +7], p = .11, and the timing-matched placebo p = .51. Two of them spoke within their first minute, so
      they too have almost no 'before'. Seven people cannot settle it. The direction matches the main result.
    how: The spoken moments were hand-coded from the in-play narration before any behaviour around them was computed
      (extras.SPOKEN_STRAT, session time). A decision whose card was open at that moment is the anchor decision.
      Otherwise, 'before' and 'after' are split at the remark. The same models and placebo as above are used.
    chart: flaw.spoken
    numbers:
    - 'Strict remarks (7 people), all missions: 80% (n 30) → 49% (n 75); adjusted −21 points [−49, +7], p = .11;
      5 fell, 2 rose; placebo p = .51'
    - 'Strict, three-type: 79% → 57%; adjusted −16 points [−57, +26], p = .39'
    - 'Broad remarks (12 people): adjusted −4 points, p = .60; 7 fell, 5 rose'
    atoms:
    - flaw-odd-card
    - q-C12
    codes:
    - C12
  - id: adjustment
    title: What 'expected' and 'adjusted' mean
    text: '<b>Expected</b> is the chance a model gives that this person takes a card on this decision. It knows
      only what the decision was (drones, tasks and drone types the mission needed), when it was (minute of the
      session, whether it was a re-queued mission, how many others were waiting), which of the four games was being
      played, and how often <i>this person</i> took cards on all their <i>other</i> decisions. <b>Adjusted</b> =
      the group''s overall rate + the average of (observed − expected) at that position. In plain terms: ''how far
      above or below their usual self, given the mission in front of them, were people here?'' The person term does
      most of the work (odds ×2.84 per unit; the model ranks takes above non-takes 81% of the time). So ''adjusted''
      mostly means ''compared with that person''s normal habit''. Of the mission features, only the number of drone
      types matters (×1.51 per extra type). Because adjusted is a shifted average residual and not a probability,
      it can go above 100% at a small dot that sits far above its expectation. The old not-said +2 dot read 122%
      for this reason.'
    how: 'Logistic regression over all 606 decisions: took ~ drones + tasks + types + minute + game + queue length
      + residual flag + logit(person''s leave-one-out rate, shrunk with +1/+2). The same specification as extras2.add_expected;
      the script checks the fitted values are identical. The chart shows each term''s odds ratio with a 95% interval.'
    chart: flaw.model
    numbers:
    - 'Person''s own rate elsewhere: odds ×2.84 [2.29, 3.51] per logit unit'
    - 'Each extra drone type needed: ×1.51 [1.12, 2.04]; drones ×1.08, tasks ×0.98, minute ×1.05, queue ×0.98 (all
      n.s.)'
    - Model ranks takes above non-takes 81% of the time (AUC 0.81)
    atoms:
    - flaw-dots
  - id: old-chart
    title: 'The old chart: why n moved, the +8 dip and the never-said 100% dots'
    text: The old chart was drawn correctly from what it computed, but what it computed was confusing. Its x position
      counted <i>every</i> decision after the card, and only three-type ones were then kept for the rate. So a person
      appeared at +2 only if their 2nd decision after the card happened to be three-type. That is why n went up
      and down (4–16), why 0 never appeared (the card's own decision is never three-type), and why 'three-type 100%'
      showed on every dot (true by construction). <b>The +8 dip</b> is 22 decisions, one per person, where 50% took
      a card against 67% expected. The 11 who declined are 11 different people. Mission size there is ordinary (10.3
      drones vs 10.2), with slightly more session starts (14% vs 6%). The same people took cards on 67% of their
      other later three-type decisions. Measured as a surprise score it is z = −1.5. Two of the 33 old dots fall
      outside ±1.96, where about 1.7 would by chance. It is noise, and it disappears in the binned view. <b>The
      never-said 100% dots at +2/+3</b> are 13 decisions from 11 people who all took a card where 66% was expected.
      That is unusual taken alone (about 0.2%), but it is the most extreme of 33 dots. They came at busy moments
      (3.1 missions waiting against about 1.9 usually), when people tend to hand over (C11). The never-said group
      are also the higher-reliance people (73% overall). The rebuilt chart has no 100% dots.
    how: Each old dot was reproduced exactly from extras2.event_study (checked against extras2.json). Surprise score
      z = (takes − expected takes) ÷ √Σ p(1−p) over the dot's decisions. The +8 rows were listed one by one and
      compared with the same people's other later three-type decisions.
    chart: flaw.oldDots
    numbers:
    - '+8: n 22, 50% took vs 67% expected, z = −1.5 (never-said dot); declines spread over 11 people; same people
      elsewhere 67%'
    - 'Old dots beyond |z| 1.96: 2 of 33 (1.7 expected)'
    - 'Never-said +2/+3: 13 of 13 took a card; expected 66%; queue 3.1'
    atoms:
    - flaw-dots
  - id: robustness
    title: Every specification, whatever it shows
    text: 'Fourteen versions of the before/after question. Noticers'' change is negative in every one (−10 to −26
      points). Non-noticers'' is positive or flat in every one. The adjusted difference between groups is negative
      in every one, with p mostly between .06 and .4. It weakens when the noticed group is the debrief code alone
      (−8 points, p = .39) and when each session''s first decision is dropped (−7 points, p = .44). It is largest
      in the short window (−25 points, p = .02, chosen after seeing the dip) and gone in the long run (−2 points).
      The one-type-only version cannot be estimated: almost nobody has a one-type mission before their first illogical
      card. The direction is stable. Its size and significance are not.'
    how: 'Each row reruns the before/after and interaction models with one thing changed: the practice term, the
      window, the missions, the anchor (first illogical card actually displayed rather than pre-empted), who counts
      as ''noticed'', or who is excluded (P01/P02, who played on half task weights). Estimates are in percentage
      points with 95% intervals, people clustered.'
    chart: flaw.strip
    numbers:
    - 'Difference (noticers − never-said), adjusted: main −15 (p .09); no practice term −15 (.09); first 5 after
      −25 (.02); 6th onward −2 (.83); all missions −15 (.06); without illogical-card missions −14 (.13); first card
      displayed −12 (.12); C12 only −8 (.39); broad remarks −11 (.21); strict remarks only −16 (.10)'
    atoms:
    - flaw-odd-card
    - flaw-dots
  - id: h8
    title: Why the pre-registered test (H8) was dropped
    text: H8 asked whether uptake falls after an operator 'realises' the card can be illogical. Its marker for that
      realisation was the first time a person went manual on an illogical-card mission and left out the unneeded
      type. The trouble is that, by that definition, every illogical-card decision <i>before</i> the marker was
      not such a manual choice. So the 'before' window was mostly forced to be card takes, near 100%. Any later
      manual choice then shows up as a drop, even if the person never changed at all. A simulation confirmed it.
      In simulated people who keep the same habits all study, the same marker produced a large 'drop' (average odds
      ratio 0.37, against the real 0.12). Measured against that, the real drop was ordinary (calibrated p = .30,
      about −10 points after correction). Defining the marker as the first manual choice on a <i>clean</i> card
      produced the same kind of drop. H8 was replaced by tests whose anchor is not defined by the outcome (the first
      illogical card shown; the moment someone said it), each checked against a placebo. Those are the tests in
      this finding.
    how: From docs/analysis/round1/h8_illogical_card.md. The null calibration redrew each person's choices 1,000
      times from their own constant rate, reapplied the marker and refitted the same model.
    numbers:
    - Pre-registered estimate OR 0.12; the same test on no-change simulations averages OR 0.37; calibrated p = .30
      (risk difference)
    - 'Placebo marker on clean cards: OR 0.22, p = .03, the same kind of ''drop'''
    atoms:
    - meth-h8-invalid
  replies:
  - card: flaw-odd-card
    text: 'Rebuilt. (1) The adjustment is explained in plain words, with the model''s terms charted. ''Adjusted''
      mostly means ''compared with that person''s usual rate''. (2) Never-said ≈ 100%: two small old dots (13 decisions)
      that came at busy moments, plus the fact that non-noticers are higher-reliance people. The rebuilt chart has
      them at 72–84%. (3) +8: noise; 22 decisions, 11 different decliners, z = −1.5. (4) The graph was computed
      correctly but its x-axis counted all decisions while plotting only three-type ones; now fixed. Your ''dip
      then recovery'' reading does show for noticers (75% → 47% → 63% → 72%), and the group gap is concentrated
      in the first five decisions. But it is not tied to the card''s moment, so I call it suggestive. The strongest
      result is new: noticers stop taking cards on the illogical-card missions themselves.'
  - card: flaw-dots
    text: n moved because x counted every decision and only three-type ones were kept. 'Three-type 100%' was always
      100% by construction. Now each person's Nth three-type decision is the x (everyone has a +1, +2, …), positions
      are binned with person-resampled intervals, and individual lines sit behind the mean. Folded into f-flaw-odd
      as the method sections.
  - card: manual-card-error
    text: 'Merged. It holds in direction (63% vs 37% manual on one-type missions), but noticers are equally more
      manual on three-type missions (interaction p = .78), so it is a person difference rather than a one-type effect.
      The specific, within-person version is the trend on illogical-card missions: noticers increasingly pre-empt
      the cards there (difference in trends p = .01). See also f-manual-cards: hand-builds on one-type missions
      drop the unneeded-type spares.'
  - card: meth-h8-invalid
    text: 'Explained plainly in the ''Why the pre-registered test was dropped'' section: the marker''s own definition
      forced the ''before'' window to be card takes, so a drop appeared even in simulated people who never changed.'
  - card: q-C12
    text: Kept as the grouping and the supporting quotes. 12 coded in debrief or interview; 15 including strict
      in-play remarks.
  - card: q-C15
    text: Kept as supporting evidence in the odd-missions section. 3 of the 4 who said they grew more careful later
      are noticers (P17, P19, P33).
  open:
  - 'Which grouping should be primary: C12 ∪ strict in-play (15, used here) or C12 alone (12, a weaker difference)?
    Decide before writing, not after seeing which is stronger.'
  - The one-type-mission trend (noticers stop taking cards there) is the strongest result, but the groups were defined
    after the fact. Is it worth a confirmatory look in a fresh cohort, or reporting it as exploratory?
  - The short-window (first five decisions) difference, p = .02, was chosen after seeing the curve; report it as
    descriptive only.
  source: flaw
- id: f-flaw-visibility
  area: When the assistant gets it wrong
  title: 'Only flaws people can see change what they do: wrong Suggest refusals and weaker cards leave no trace'
  headline: 'The strategic tier''s flaw is visible at a glance: a drone type the mission does not use shows on the
    card''s face. 12–15 of 33 people remarked on it, and those who did changed how they used the cards (f-flaw-odd).
    The tactical tier''s flaw is hidden: Suggest says ''No workable plan'' when one exists. 14 people met at least
    one such wrong refusal, and only 1 person ever said why it happened. After the first refusal, right or wrong,
    neither strategic nor tactical use changes (adjusted changes −5 to +2 points, all p > .4). So the trouble does
    not cascade up to the strategy cards. A Conservative card that is plainly worse on its own two numbers is not
    avoided either. Moderate confidence for the visibility contrast; the nulls are ''no evidence of a change'',
    with intervals of roughly ±10 points.'
  confidence: moderate
  absorbs:
  - tier-flaw-visibility
  - flaw-anchors-null
  - cards-dominated-null
  sections:
  - id: visibility
    title: Strategic flaws are visible; tactical flaws are hidden
    text: 'Neither assistant had errors injected for anyone analysed (the ε manipulation ran only for the excluded
      P09). Each tier still has a natural flaw. On the <b>strategic</b> side, it is the illogical extra drone type.
      It sits on the card face next to the mission''s own requirements, everyone saw it, and 12 people mentioned
      it in debrief or interview (15 counting in-play remarks). On the <b>tactical</b> side, it is the wrong refusal:
      Suggest answers ''No workable plan'' when a fix existed using a drone busy on another task. To the operator
      it looks exactly like a correct refusal. 14 people met one (23 wrong refusals out of 39). Four of them reacted
      aloud and accepted it, most saying they would have to abandon. Only P28 named the cause. Only 3 people ever
      described a tactical-plan flaw (C13), and just one of them had been wrongly refused. ''The strategic assistant
      is distrusted more'' may partly be ''its mistakes are the ones you can see''.'
    how: 'Strategic exposure: people with ≥1 illogical-card decision. Tactical exposure: people with ≥1 Suggest
      press in a recovery that returned ''No workable plan'' or a partial plan while a fix using a busy drone existed
      (the ''blind'' flag in h3_recovery). Noticing: qualitative codes C12 and C13 (debrief or interview), plus
      the hand-coded in-play remarks (extras.SPOKEN_STRAT / SPOKEN_TAC), each matched to the nearest preceding Suggest
      press.'
    chart: flaw.visibility
    numbers:
    - 'Strategic: 33 of 33 saw the illogical card (132 of 606 decisions); 12 coded C12; 15 incl. strict in-play
      remarks'
    - 'Tactical: 14 of 33 got ≥1 wrong refusal (23 of 39 refusals); 3 coded C13, 1 of them among the 14; 4 reacted
      aloud to a wrong refusal, 1 named why'
    atoms:
    - tier-flaw-visibility
    sharedWith:
    - f-tier-trust
    codes:
    - C12
    - C13
    - C14
  - id: refusal
    title: After the first Suggest refusal, nothing changes, on either tier
    text: 'You asked whether the only thing that changes after the first refusal is that <i>strategic</i> use goes
      down, with the problem cascading up the chain. <b>It does not.</b> After their first ''No workable plan''
      (18 people), card uptake actually went <i>up</i> in raw terms (68% → 76%). The expected value went up just
      as much, because these refusals tend to come later, when people have settled in. Adjusted, the change is +2
      points [−6, +10], with 10 people falling and 8 rising. On three-type missions it is 0 points. Tactical Suggest
      use also rose raw (78% → 87%) and is flat adjusted (−1 point). After the first <i>wrong</i> refusal (14 people)
      the picture is the same: strategic −2.5 points [−16, +11], tactical 0. The first drone failure (33 people)
      changes nothing either. These are absences of evidence, with intervals around ±10 points. They are not proof
      of no effect, but no cascade is visible. The card''s wording, ''neither assistant''s use changes'', was right.'
    how: Same rebuilt method as f-flaw-odd. Each person's strategic decisions (or tactical plans) are numbered within
      the sample, after versus before the moment of their first refusal, with practice held fixed and people clustered.
      Adjusted = observed minus the expected value. The placebo moves each anchor to a random point drawn from the
      real anchor positions. All p-values are for the adjusted change.
    chart: flaw.anchors
    numbers:
    - 'First refusal (18): strategy cards, all missions, adjusted +2.0 points [−6, +10], p = .62; three-type +0.4,
      p = .91; tactical Suggest −0.6 [−6, +5], p = .83'
    - 'First WRONG refusal (14): strategy cards −2.5 [−16, +11], p = .70; three-type −5.1, p = .43; tactical −0.2,
      p = .93'
    - 'First drone failure (33): strategy cards −1.0, p = .79; tactical +5.6, p = .08'
    - After the first illogical card, tactical Suggest +5.4 points, p = .30 (no spill-down either)
    atoms:
    - flaw-anchors-null
  - id: dominated
    title: A card that is worse on its own numbers is not avoided
    text: 'Usually the two cards are a trade-off. Aggressive sends more drones and finishes sooner; Conservative
      sends fewer and is slower. Sometimes the trade-off vanishes. The Conservative card sends <i>at least as many</i>
      drones and its displayed finish time is <i>no sooner</i>, so on the two numbers it shows there is no reason
      to pick it. That is a <b>dominated</b> card. A typical one: Conservative 9 drones, Aggressive 8, both finishing
      at 65 s. This happens on 45% of all decisions (77% of one-type missions, where it mostly coincides with the
      illogical extra type, and 29% of three-type missions). On three-type missions, where nothing looks odd, people
      chose a dominated Conservative card 29% of the time and a fair-trade-off one 38%. Once mission size and game
      are allowed for, there is no sign they avoided it (odds ×1.19 [0.54, 2.63], p = .66), though the interval
      cannot rule out a moderate avoidance. On ''rarely compare both'': highlighting a card is the click that selects
      it. Both cards are always shown side by side, so the numbers can be read without clicking. People highlighted
      both cards on only 19 of 606 decisions (14 people), and 380 of 397 card takes highlighted only the card they
      took. Choosing looks driven by the label, not by comparing numbers across the two cards. A weakness you must
      work out by comparing goes unnoticed; one you can see on the card face (an unneeded type) is the one people
      reacted to.'
    how: 'From both cards'' true drone totals and displayed completion times in the last strategic_modal_opened
      before each choice: dominated = Conservative drones ≥ Aggressive drones AND Conservative time ≥ Aggressive
      time. This matches load_decisions'' flag exactly (44.6%). The model is a logistic GEE on three-type, non-residual
      decisions: chose Conservative ~ dominated + drones + tasks + game, people clustered. Bars: share of each choice,
      with 95% intervals from resampling people. Previews: distinct cards highlighted (strategic_card_previewed)
      before the choice.'
    chart: flaw.dominated
    numbers:
    - 'Dominated Conservative card on 45% of decisions: 77% of one-type, 29% of three-type'
    - 'Three-type: Conservative chosen 38% (trade-off, n 284) vs 29% (dominated, n 105); odds ×1.19 [0.54, 2.63],
      p = .66 (round 2 found 1.10 with other covariates)'
    - Both cards highlighted on 19 of 606 decisions (14 people); none highlighted on 174
    atoms:
    - cards-dominated-null
  replies:
  - card: flaw-anchors-null
    text: 'Checked directly with the rebuilt method. No: strategic use does not go down after the first Suggest
      refusal (adjusted +2 points [−6, +10]) or after the first wrong refusal (−2.5 [−16, +11]), and tactical use
      is flat too. The raw rise is practice and mission mix. There is no cascade up the chain in behaviour; that
      is no evidence of a change, not evidence of none.'
  - card: cards-dominated-null
    text: 'Explained: ''dominated'' = the Conservative card is no smaller and no faster than Aggressive, so it is
      worse on both numbers it shows. On three-type missions people do not avoid it (OR 1.19, p = .66), and they
      almost never click both cards (19 of 606), though both are always on screen. It leads into choices as ''label,
      not numbers'', and contrasts with the visible illogical type, which people did react to.'
  - card: tier-flaw-visibility
    text: 'Kept and strengthened with exposure counts: everyone saw the strategic flaw and 12–15 remarked on it;
      14 met the hidden tactical flaw and 1 explained it. Marked sharedWith f-tier-trust.'
  open:
  - 'f-tier-trust should carry the visibility section. Wording to agree: ''the trust gap may be partly a visibility
    gap'' is an argument, not a measured effect.'
  source: flaw
- id: f-tier-trust
  area: Trust, tiers and recovery
  title: The Tactical Assistant is trusted more, and most people say so too
  headline: 'On the post-session questionnaire, operators trusted the Tactical Assistant more than the Strategic
    Assistant: 5.44 against 4.61 on a 1–7 scale, 26 of 33 people higher for tactical (p = .001). Most of the gap
    opens in the second session and in Strategic Heavy games, and people who said in the debrief that they preferred
    the tactical one also scored it higher. Tactical plans get only a few seconds of checking whatever their size,
    which fits "checking is costly, so it is skipped", but that mechanism test is fragile. Stated trust and actual
    use line up when people are ranked against each other, but not in size and not over time.'
  confidence: moderate
  absorbs:
  - tier-trust-gap
  - tier-preference
  - tier-checking-cost
  - trust-not-lead
  - trust-own-failures-null
  - q-C13
  - q-C14
  - q-C16
  - q-C17
  - q-C18
  sections:
  - id: gap
    title: 'Trusted more: the basic result'
    text: After every session operators rated each assistant on the same six statements ("is reliable", "I trust
      its recommendations", …) from 1 to 7. Averaged over their two sessions, <b>26 of 33</b> rated the Tactical
      Assistant higher, 6 the Strategic Assistant, and 1 the same. The average gap is <b>+0.83 points</b> on the
      7-point scale. That is a medium-sized effect (dz = .62), and every one of the six items points the same way.
    how: 'One value per person per assistant: the mean of the six items, averaged over that person''s two sessions
      (33 people, P09 excluded). The test is a paired t-test on the difference tactical minus strategic, with a
      Wilcoxon signed-rank test as the distribution-free check. dz is the mean difference divided by the SD of the
      differences: .62 means the average person''s gap is about six-tenths of the person-to-person spread in gaps.
      The 95% CI says the true average gap is very probably between +0.35 and +1.30 points. Items are tested the
      same way, one at a time.'
    chart: recovery.trustPairs
    numbers:
    - Strategic 4.61 [4.18, 5.04], Tactical 5.44 [5.15, 5.73] (1–7, person means)
    - Gap +0.83 [+0.35, +1.30]; paired t p = .0012; Wilcoxon p = .0010; dz = .62; n = 33
    - 26 higher for tactical, 6 for strategic, 1 tied
    - 'Item gaps: follow its recommendations +1.11, I trust it +1.01, reliable +0.94, performs well +0.74, useful
      +0.67 (all p < .01); confident in it +0.48 (p = .13)'
    atoms:
    - tier-trust-gap
  - id: where
    title: 'Where the gap comes from: the second session and Strategic Heavy games'
    text: The gap is small after the first session (+0.37, CI crosses zero) and large after the second (+1.28).
      By game it is about +1.1 in both Strategic Heavy games and about +0.5 in both Tactical Heavy games (CIs cross
      zero). Tactical trust hardly moves (5.36 → 5.51); it is <b>strategic</b> trust that falls. So "trusted more"
      largely means "the strategic one loses trust as people play more, especially in the scenario where its cards
      are used most." That fall was its own card (trust-drop), now pruned. The researcher judged it not useful on
      its own. It is kept here only as the context the gap needs. Four people said their trust <i>grew</i> with
      experience (C16).
    how: The same per-session tactical-minus-strategic difference, averaged within each session number (33 sessions
      each) and within each of the four fixed games (16–17 sessions each). These are means with t-based 95% CIs
      and no model. Session number and game are partly tangled (P31–P36 swapped game order), so the two splits are
      views, not separate effects.
    chart: recovery.trustSplits
    numbers:
    - Session 1 gap +0.37 [−0.15, +0.88]; session 2 +1.28 [+0.69, +1.87] (n = 33 each)
    - Strategic Heavy game 1 +1.10 [+0.07, +2.13]; game 2 +1.17 [+0.44, +1.89]
    - Tactical Heavy game 1 +0.48 [−0.25, +1.21]; game 2 +0.56 [−0.29, +1.40]
    - Strategic trust 5.00 → 4.23 from session 1 to 2; tactical 5.36 → 5.51
    atoms:
    - tier-trust-gap
    codes:
    - C16
  - id: own-failures
    title: A bad first session with the cards does not explain who loses strategic trust
    text: 'If strategic trust fell because people had bad experiences with the cards, then those who met more illogical
      cards in session 1 should lose more trust. They do not. The raw correlation even points the other way (ρ =
      +.40), but that comes entirely from scenario order: people who played Strategic Heavy first see the odd cards
      early and lose the least trust (−0.29 against −1.26 for those who played it second). Once order is held constant,
      the correlation is +.14 (p = .42). Round 1''s pre-registered version (missions that failed after a card) was
      also null: ρ = −.05 [−.39, .30]. Read this as "no evidence that how much went wrong drives it", not as proof
      that experience doesn''t matter.'
    how: One row per person (33). The predictor is the count of decisions in session 1 where an illogical strategy
      card was on screen (from load_decisions' odd flag). The outcome is session-2 minus session-1 strategic trust.
      Spearman ρ uses a 4000-draw seeded bootstrap CI. The partial version ranks both variables, removes the part
      explained by which scenario was played first, and correlates what is left. The ρ = −.05 is H5's primary test
      (docs/analysis/round1/h5_trust_drop.md).
    numbers:
    - 'Illogical cards seen in session 1 vs change in strategic trust: ρ = +.40 [+.03, +.70], p = .02 — order artefact'
    - 'Same, holding scenario order fixed: ρ = +.14, p = .42'
    - Mean change in strategic trust −0.76; Strategic Heavy first −0.29, Tactical Heavy first −1.26
    - 'H5 primary (card failures in session 1): ρ = −.05 [−.39, .30]'
    atoms:
    - trust-own-failures-null
  - id: stated
    title: What they said agrees with what they rated
    text: In the debriefs and interviews, 17 operators named the Tactical Assistant as the one they preferred or
      trusted, 7 the Strategic one, and 9 gave a conditional, "both" or no answer. Those who said tactical had a
      questionnaire gap of +1.36 on average; those who said strategic were at −0.04. For 18 of the 24 who named
      one side, the questionnaire points the same way. The coding is from one coder (an AI model) and has not been
      second-coded, so treat the counts as suggestive.
    how: Stated preference is the round-2 coding of each person's debrief and interview (docs/analysis/round2/wE_codes.csv,
      field pref). Its sign test asks whether 17 of 24 is more lopsided than a coin toss (exact binomial, two-sided,
      p = .064). The other test compares the questionnaire gap of tactical-sayers with strategic-sayers (Mann–Whitney,
      p = .033). Round 1's independent coding agreed poorly with it (κ = .27), and round 2's κ = .96 came from the
      same AI model. A human second coder is still needed (meth-qual-coder).
    chart: recovery.prefGap
    numbers:
    - Said tactical 17, strategic 7, conditional 4, both 3, none 2
    - 'Sign test 17 of 24: p = .064'
    - 'Questionnaire gap: tactical-sayers +1.36 [+0.76, +1.97] vs strategic-sayers −0.04 [−1.27, +1.19]; Mann–Whitney
      p = .033'
    - Questionnaire agrees with the stated side for 18 of 24
    atoms:
    - tier-preference
  - id: checking
    title: 'Why the tactical plan is kept: checking it is brief and does not grow with the plan'
    text: 'Bigger missions mean bigger tactical plans. As plans grow, operators press Suggest more often (68% →
      85%) and keep the plan unmodified more often (about 60% → 80%). Once Deploy unlocks, they spend a median of
      about <b>3 seconds</b> on the plan, whether it has 3 drones or 10. Per drone, checking therefore falls steeply
      as plans grow. A strategy card gets about 9 s. Almost every consulted plan is deployed as it comes: 468 of
      486. This is the speed-versus-accuracy trade-off the researcher expects to come back to. The more there is
      to check, the less of it is checked proportionally, and the plan is taken. Operators describe exactly this.
      Nine say they check when it is cheap and skip it under pressure (C17). Three say the plan was too complex
      or too fast to check (C14). Five say they checked nearly everything, and they do decide more slowly (C18).
      Only 3 of 33 ever mention noticing a tactical flaw (C13).<br><br><b>But</b> the pre-registered mechanism test
      (H2) is fragile. All three predicted parts point the right way (p = .019 uncorrected), but it does not survive
      correction for the round''s several tests (.065). Among consulted plans, larger ones are actually modified
      a little <i>more</i>. Keeping goes up with size mainly because people consult more on big plans, not because
      they check consulted plans more lightly. The logs also cannot tell "too costly to check" apart from "nothing
      ever looked wrong". The tactical plan''s flaws are hard to see, while the cards'' over-allocation is visible.
      That half of the explanation belongs to <i>tier-flaw-visibility</i> in f-flaw-odd and is not repeated here.'
    how: '630 confirmed tactical plans from 33 people (h2_verification_cost.load). They are grouped by the number
      of drones in the Tactical Assistant''s plan. "Consulted" means Suggest was pressed at least once. "Kept unmodified"
      means consulted and deployed with no change. "Checking time" runs from the last Suggest press to Deploy, minus
      the forced reveal: the planner adds one drone→task pair per second and Deploy is locked until it finishes,
      so that wait is not checking. Effects per SD of plan size (drones × tasks) come from GEE models clustered
      by person, adjusted for scenario and session. An odds ratio of 1.76 means each step up in plan size multiplies
      the odds of keeping the plan by 1.76. The card comparison takes each person''s median net decision time on
      strategic decisions: strategic_choice latency minus the card reveal, over all strategic decisions, manual
      ones included. Round 1 measured it on a different subset and got 6.0 s. The H2 numbers are from docs/analysis/round1/h2_verification_cost.md.'
    chart: recovery.checkCost
    numbers:
    - 'Kept unmodified rises with plan size: OR 1.76 per SD [1.25, 2.47], p = .001 (all 630 plans)'
    - 'Consulted rises: OR 2.52 [1.87, 3.38]; kept | consulted FALLS: OR 0.68 [0.50, 0.94] (486 consulted plans)'
    - 'Net checking time barely moves: +0.60 s per SD [−0.15, +1.35], p = .12; per drone −0.25 s [−0.40, −0.10]'
    - 468 of 486 consulted plans deployed unmodified (96%)
    - 'Person-median check: tactical 2.85 s vs strategy card 8.80 s (n = 33, Wilcoxon p < .0001)'
    - H2 primary p = .019 uncorrected, .065 after Holm correction across round 1
    atoms:
    - tier-checking-cost
    sharedWith:
    - f-flaw-odd
    codes:
    - C13
    - C14
    - C17
    - C18
  - id: stated-revealed
    title: 'Stated vs revealed preference: they line up in rank, not in size or over time'
    text: 'Does the person who <i>says</i> (rates) the Tactical Assistant higher also <i>lean</i> on it more? Ranked
      against each other, yes, moderately. The person-level trust gap correlates ρ = .47 with the usage gap (share
      of tactical plans kept unmodified minus share of strategic decisions where a card was taken). 16 people favour
      tactical on both measures and 3 favour strategic on both. Three things do <b>not</b> line up:<br> (1) <b>Size.</b>
      Stated trust favours tactical strongly (26 of 33), but use barely does. Cards are taken on 64% of strategic
      decisions and tactical plans kept on 72%, a gap of +8 points whose CI includes zero. Nine people rate tactical
      higher yet use the strategic cards more.<br> (2) <b>Change.</b> Within a person, a rise or fall in trust from
      session 1 to 2 does not go with a matching change in use (ρ = .16 strategic, .13 tactical).<br> (3) <b>Lead.</b>
      Session-1 trust does not predict how card use changes in session 2 (ρ = .07). Trust ratings read like a stable
      opinion of the assistant, while use follows the moment: mission size, queue, time.<br> This is the stated-versus-revealed
      framing the researcher liked. The ratings describe the person; they do not forecast their next move.'
    how: 'One dot per person, both sessions pooled. Stated = mean tactical trust minus mean strategic trust (1–7).
      Revealed = share of their confirmed tactical plans kept unmodified minus share of their strategic decisions
      where they took a card (the alternative "pressed Suggest at all" gives the same picture, ρ = .49). Spearman
      ρ uses 4000-draw seeded bootstrap CIs. A caveat on (1): taking a card and keeping a plan are different acts
      with different costs, so the <i>level</i> of the usage gap is not a pure preference; the ranking is the cleaner
      comparison. "Change" correlates the session-2 minus session-1 differences within each person (33 people).
      "Lead" correlates session-1 trust with the later change in use. Session-level links are also shown (66 sessions):
      strategic trust ~ cards taken ρ = .49, tactical trust ~ plan kept ρ = .27. Note that the trust survey comes
      <i>after</i> the session it follows, so a same-session link can be use shaping trust as easily as the reverse.'
    chart: recovery.statedRevealed
    numbers:
    - 'Trust gap vs usage gap (kept − took): ρ = .47 [.10, .73], p = .006, n = 33'
    - 'Quadrants: both favour tactical 16, both strategic 3, trust tactical/use strategic 9, trust strategic/use
      tactical 3 (2 on a zero line)'
    - 'Group use: took a card 64%, consulted the plan 76%, kept it 72%; usage gap +0.08 [−0.02, +0.17]'
    - 'Within person, change in strategic trust vs change in card use: ρ = .16 [−.27, .52], p = .38'
    - 'Session-1 strategic trust vs change in card use s1→s2: ρ = .07 [−.27, .40], p = .71; tactical .01'
    - Between people, strategic trust vs cards taken ρ = .60 [.30, .78]; tactical trust vs plan kept ρ = .31, p
      = .08
    atoms:
    - trust-not-lead
  - id: trust-lead-strip
    title: All the trust–use correlations in one view
    text: Between people, trust and use move together, most clearly for the strategic tier. Within a person over
      time, and as a predictor of the next session, the correlations are near zero.
    how: Each row is a Spearman ρ with a 4000-draw seeded bootstrap 95% CI, at the person level (n = 33). A dark
      dot means p < .05. These are the same numbers as the section above, in one picture.
    chart: recovery.trustLead
    atoms:
    - trust-not-lead
  replies:
  - card: tier-trust-gap
    text: 'Kept as the core of this finding. Re-run: 5.44 vs 4.61, 26 of 33 higher for tactical, gap +0.83 [0.35,
      1.30], p = .001. Now with a per-person picture and splits by item, game and session. The split shows the gap
      is mostly a second-session, Strategic-Heavy fall in strategic trust, which the headline should say.'
  - card: tier-preference
    text: Merged in as the 'what they said' section. Stated preference is 17 tactical vs 7 strategic (p = .064),
      and it agrees with the questionnaire for 18 of 24 (tactical-sayers' gap +1.36 vs −0.04, p = .033). Still single-coder.
  - card: tier-checking-cost
    text: 'Kept, framed as speed vs accuracy. New graph: as plans grow, consulting and keeping rise, but checking
      time stays at about 3 s, so checking per drone falls. The H2 test is still fragile (p = .065 corrected), and
      keep | consulted runs the other way. The flaw-visibility half is referenced to f-flaw-odd, not redone.'
  - card: trust-not-lead
    text: 'Reframed as stated vs revealed, with the per-person scatter you asked for. Honest result: between people
      they DO line up in rank (ρ = .47). They don''t line up in size (stated strongly tactical, use only +8 points),
      within person over time (ρ = .16), or as a predictor of next-session change (ρ = .07). Nine people rate tactical
      higher but use the cards more.'
  - card: trust-own-failures-null
    text: 'Kept as supporting. Re-checked: illogical cards seen in session 1 vs the trust change gives ρ = +.40,
      but that is scenario order. Held at fixed order it is +.14 (p = .42). H5''s primary was −.05.'
  - card: q-C13
    text: 'Attached to the checking section (3 of 33 noticed a tactical flaw: P02, P21, P31).'
  - card: q-C14
    text: Attached to the checking section (P22, P24, P27 took the plan because it was too complex or fast to check).
  - card: q-C16
    text: Attached to the 'where the gap comes from' section as the counter-voice (P06, P10, P26, P32).
  - card: q-C17
    text: Attached to the checking section — the mechanism in their words (9 of 33).
  - card: q-C18
    text: Attached to the checking section — the opposite stance (5 of 33, slower deciders).
  open:
  - Should the headline lead with 'trusted more', or with 'strategic trust falls in session 2 and the gap opens
    then'? The data supports both, and the second is more precise. trust-drop was pruned, but the gap cannot be
    described honestly without it.
  - 'The stated-vs-revealed result is mixed: aligned in rank, not in size or change. Decide which part the thesis
    leans on.'
  - Stated-preference counts still need a human second coder (meth-qual-coder).
  source: recovery
- id: f-recovery
  area: Trust, tiers and recovery
  title: When Suggest wrongly says “No workable plan”, half abandon within seconds without trying
  headline: Suggest wrongly said “No workable plan” 23 times to 14 operators, in 17 drone failures that could have
    been fixed by chaining a busy drone on. 9 of those 17 were abandoned, against 10 of 118 other attempted fixable
    failures. In all 9 the operator abandoned without dragging a single drone, 8 of them within 10 s of the refusal.
    The 8 who ignored the refusal and fixed it by hand all saved the mission. So for this data, "if the assistant
    says no, about half take it at its word and abandon without visible checking" is a fair statement, though n
    is small (9 episodes, 8 people) and looking at the map is not logged. A refusal does not make people give up
    on later failures, and lower-reliance operators attempt fewer fixes overall.
  confidence: moderate
  absorbs:
  - rec-blind-spot
  - rec-after-refusal
  - rec-low-reliance-attempt
  - q-C19
  - q-C20
  - meth-blind-erratum
  - meth-time-left
  sections:
  - id: rates
    title: Abandonment by what Suggest said
    text: 'Every drone failure that needed the operator is one recovery episode. Grouped by what Suggest answered:
      a <b>wrong refusal</b> ended in abandonment 53% of the time (9 of 17). When Suggest gave a plan it was 6%
      (3 of 51), and when operators fixed things by hand without Suggest it was 13% (9 of 69). A <b>correct refusal</b>,
      where no fix existed with the drones on the mission, ended in abandonment every time (11 of 11), as it should.
      The striking row is the first one. These were saveable missions, and the same 14 people abandoned only 6 of
      their 61 other attempted fixable failures. Abandonment was not their habit; the refusal is what is different.
      When nothing at all was tried, every failure was abandoned or left open (35 + 11).'
    how: 'Recovery episodes are rebuilt by h3_recovery.load_all (194 episodes, 33 people). It is a time-local rebuild
      of which drones were on the mission, idle or executing, at each Suggest press. A press is a <b>refusal</b>
      when Suggest could not cover every task the operator''s live plan left short. A refusal is <b>wrong</b> when
      those tasks could have been covered by drones still on the mission, counting ones busy on another task (chaining
      them on). Suggest only offers drones that are not executing, which is its blind spot. An episode counts as
      a wrong refusal if it had at least one wrong-refusal press; as a correct refusal if it had refusals and none
      was wrong. Rates are abandoned ÷ (abandoned + recovered), with Wilson 95% CIs. The comparison counts wrong-refusal
      episodes against every other fixable episode where something was attempted (Suggest gave a plan, or hand edits):
      Fisher exact test, plus a GEE logit clustered by person (odds ratio 12 means the odds of abandoning were twelve
      times higher).'
    chart: recovery.abandonByType
    numbers:
    - 'Wrong refusal: 9 of 17 abandoned (53% [31%, 74%]), 14 people; all 17 fixable with drones on the mission'
    - 'Correct refusal: 11 of 11 abandoned (100% [74%, 100%]), 6 people'
    - 'Suggest gave a plan: 3 of 51 (6%); hand edits only: 9 of 69 (13%); nothing tried: 35 of 35 (+11 left open)'
    - 'Wrong refusal vs other attempted fixable failures: 9/17 vs 10/118; odds ×12.2, Fisher p < .0001; GEE ×12.3
      [3.2, 47.6], p = .0003'
    - 'The same 14 people on their other attempted fixable failures: 6 of 61 abandoned'
    atoms:
    - rec-blind-spot
  - id: checking-after
    title: Do they check after a refusal? What the log shows between the refusal and the close
    text: 'The timeline puts every refusal episode on one row, with 0 as the moment Suggest first said no. The answer
      to the researcher''s question is in the top block. After a <b>wrong</b> refusal that ended in abandonment,
      not one operator dragged a drone in the planner. Three pressed Suggest again, got the same answer, and abandoned.
      None did anything on another mission in between, so they were not called away. 8 of the 9 abandoned within
      10 s of the first refusal, at a median 3.8 s after the last one. That is time for a glance, not a re-plan.
      The 8 who <b>did not</b> take the refusal at its word look completely different: 7 of 8 started dragging drones,
      took a median 21 s, and saved the mission. After a correct refusal people behaved the same way as after a
      wrong one (abandoned in a median 4.4 s, no drags). That is right in those cases, and it shows operators get
      no cue to tell the two apart: the message is the same either way.<br><br> The verified case: P19, session
      1, M003. Camera-2 failed. The Supply Drop needed a Camera. Two Lifters sat idle, and the only remaining Camera
      was busy on Search & Service, due to finish in about 45 s. Suggest said “No workable plan”, and the operator
      abandoned 3 s later. Chaining that Camera on would have saved it (checked frame by frame on the recording).
      P19 later blamed themselves for failed missions (C19). No wrong-refusal abandoner is among the three who blamed
      the assistant (C20).'
    how: For each refusal episode the analysis takes the time of the first refusal and lists every logged operator
      action from then until the mission was abandoned or redeployed. That includes drags in the recovery planner
      (tactical_assignment_changed), further Suggest presses, and any action on another mission (strategic decisions,
      tactical confirms, recalls, other recoveries), from the raw event log. "Checked" here can only mean a <i>logged</i>
      action. Looking at the strategic map or the planner leaves no trace, so a fast abandonment could still hide
      a quick look, and the narration recordings are the place to check that. Seconds are session time; the session
      pauses if the primary window is hidden, so these are real play seconds.
    chart: recovery.refusalTimeline
    numbers:
    - 'Wrong refusal → abandoned (9 episodes, 8 people): drags after the refusal 0 of 9; re-pressed Suggest 3 of
      9; actions elsewhere 0 of 9; dragged before the refusal 0 of 9'
    - 8 of 9 abandoned within 10 s of the first refusal; median 6.8 s from the first refusal, 3.8 s from the last
    - 'Wrong refusal → fixed (8 episodes, 7 people): 7 of 8 dragged drones after; median 20.9 s to deploy'
    - 'Correct refusal → abandoned (11, 6 people): 0 drags after, 3 retries, median 4.4 s from the last refusal'
    - 'Verified: P19 s1 M003, abandoned ~3 s after the refusal'
    atoms:
    - rec-blind-spot
    codes:
    - C19
    - C20
  - id: speed
    title: How fast people abandon, with and without a refusal
    text: 'Abandoning right after a wrong refusal is as quick as abandoning right after one''s own failed hand attempt
      (median about 4 s from the last action). Counted from the failure itself, wrong-refusal abandonments take
      about as long (median 24 s) as abandoning with nothing tried at all (21 s). A plausible reading: the refusal
      works as the operator''s "attempt". It takes the place of trying, and the operator then gives up on the usual
      timetable.'
    how: For every abandoned episode, the time from its trigger to the abandonment. For refusal episodes the trigger
      is the last refusal. For hand-attempt episodes it is the operator's last drag or press. For untried failures
      it is the failure itself. Medians only; the groups are small and the comparison is descriptive.
    chart: recovery.secondsToAbandon
    numbers:
    - 'Last action → abandon: wrong refusal 3.8 s (n = 9), correct refusal 4.4 s (n = 11), own hand attempt 4.6
      s (n = 9)'
    - 'Failure → abandon: wrong refusal 24.1 s, nothing tried 21.0 s (n = 35)'
    atoms:
    - rec-blind-spot
  - id: later
    title: A refusal ends that recovery, not later ones
    text: 'After someone''s first refusal, do they stop trying on later failures? No sign of it. In raw numbers,
      later fixable failures were attempted <i>more</i> often (80% → 89%). That is the "attempts rise" in the original
      card, and it is mostly the general rise into the second session. Once that is held constant, the odds point
      slightly down (×0.50), with a CI from ×0.09 to ×2.9: no evidence of change in either direction. Round 2''s
      null simulation showed that this design tends to produce a drop even when nothing happens (null mean ×0.72),
      so a downward point estimate means even less. The cost of a wrong refusal is local: one saveable mission,
      then business as usual. Whether a refusal changes later use of the <i>strategy cards</i> is checked by the
      flaw analyst (event study on the refusal anchor; f-flaw-odd / f-refusal-cascade) and is not repeated here.'
    how: 'Only people who ever received a refusal (18; 14 for a wrong one). For each, the fixable failures before
      their first refusal and after it are compared, leaving out the episode that contained the refusal. Outcome:
      was a fix attempted (any drag or Suggest press)? Model: GEE logit clustered by person, attempted ~ after +
      session. Only 5 people have fixable failures on both sides, so this is weak. The null-simulation figure is
      from docs/analysis/round2/wA_recovery_corrected_output_2026-10-07.txt (A7a).'
    chart: recovery.afterRefusal
    numbers:
    - 'Any refusal (18 people): attempted 79.5% before (n = 39) → 89.1% after (n = 55); adjusted OR 0.50 [0.09,
      2.86], p = .44; unadjusted 1.73'
    - 'Wrong refusal (14 people): 81.1% → 85.4%; adjusted OR 0.30 [0.03, 3.5], p = .34'
    - Only 5 people have failures both before and after
    atoms:
    - rec-after-refusal
    sharedWith:
    - f-flaw-odd
  - id: reliance
    title: Lower-reliance operators attempt fewer recoveries
    text: 'Most people (20 of 32) attempted every fixable failure. Those lower on the reliance axis, who generally
      lean less on both assistants, attempted fewer: ρ = .47 between the axis and the share of own fixable failures
      attempted. Much of that is the three people who never attempted one (P15, P24, P29). Without them it drops
      to ρ = .34 (CI touches zero). So this is a between-person pattern carried by a few people. It is not a rule
      that applies to everyone.'
    how: 'One dot per person: the share of their fixable failures (fixable with drones on the mission) where they
      attempted anything, against their score on the reliance axis. The axis is the first principal component of
      ten usage habits from round 1 (h1_archetypes), recomputed without its bootstrap; it explains 31% of the variance.
      Main view: only failures with at least 31 s left, because nothing can be attempted in the last few seconds
      (see the method note below). Spearman ρ uses bootstrap CIs. The axis includes one recovery item (share of
      recoveries with Suggest), which overlaps the outcome. Without it, ρ is .43.'
    chart: recovery.relianceAttempt
    numbers:
    - '≥ 31 s left (32 people, 162 failures, 133 attempted): ρ = .47 [.15, .73], p = .006'
    - 'Axis without its recovery-Suggest item: ρ = .43, p = .015'
    - 'Without the 3 never-attempters: ρ = .34 [−.05, .67], p = .07 (n = 29)'
    - 'All failures incl. the last 30 s: ρ = .54 [.24, .76], p = .001 (P30''s only fixable failures were in the
      last 30 s)'
    atoms:
    - rec-low-reliance-attempt
  - id: method
    title: 'Method notes: the session''s end, and round 1''s undercount'
    text: '<b>The end of the session interrupts actions.</b> Attempt rates look like they rise with time left (36%
      of failures with ≤ 30 s left were attempted, against 78–96% earlier). But operators take a median 14 s to
      make a first move. 7 of the 9 fixable failures still open at the buzzer began with 12 s or less on the clock,
      and the other 2 with 49 s. Once failures with under 31 s left are removed, the time-left effect is no longer
      distinguishable from zero (OR 1.12 per minute, p = .20). Every recovery analysis here therefore uses failures
      with ≥ 31 s left where time matters. (The card said 8 of 9 started with ≤ 12 s; this rebuild gives 7 of 9.)<br><br>
      <b>Round 1 undercounted the blind spot.</b> Its rebuild of what Suggest could see missed tasks cut short by
      abandonment, which are logged as task_requeued rather than completed or failed. Their drones looked free,
      so refusals in exactly the episodes that ended in abandonment were scored as "solved". It was found because
      three operators read “No workable plan” aloud seconds after presses scored as solved. Corrected 2026-10-07:
      23 wrong-refusal presses by 14 people, not 11 by 8. Every number in this finding uses the corrected rebuild.'
    how: Time left = 480 s minus the failure time. Attempt rates by band use Wilson 95% CIs. The time-left model
      is a GEE logit, attempted ~ minutes left (within-person part) + person mean, clustered by person. "First move"
      = the first drag or Suggest press after a fixable failure. The erratum is recorded in docs/analysis/round1/SUPERVISOR_LOG.md
      and in the h3_recovery.py parse_session comment.
    chart: recovery.timeLeft
    numbers:
    - 'Attempted by time left: ≤ 30 s 4/11 (7 left open); 31–90 s 11/16; 1.5–3 min 41/48; 3–5 min 58/74; 5–8 min
      23/24'
    - 'Time-left OR per minute (within person): 1.26 [1.02, 1.56], p = .03 with all failures → 1.12 [0.94, 1.34],
      p = .20 with ≥ 31 s left'
    - 'First move: median 13.9 s (IQR 6.2–21.2), n = 137'
    - 'Suggest presses: 97 in all; 23 wrong refusals (14 people), 16 correct refusals'
