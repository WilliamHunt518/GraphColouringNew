    codes:
    - C11
  - id: spoken
    title: 'In play: overload talk comes at slightly busier moments, reliance does not follow'
    text: 'Using the narration recorded during play (30 people, 60 sessions), we found every moment someone said
      an overload-type phrase (''too many'', ''can''t keep up'', ''oh no'', ''struggling''…): 51 moments from 24
      people. All nine of the ''said'' group produced at least one. At those moments slightly more missions were
      waiting than at a random utterance (2.4 vs 2.1; p = .09) — so what people feel as overload is weakly tied
      to the queue. But in the minute either side, their card-taking and Suggest use were exactly what their missions
      and habits predict. The felt pressure is real enough; it just does not turn into handing work over.'
    how: 'Phrase list fixed in round 2 (before any behaviour was looked at), applied to the transcript of each session
      window (from segments.json; utterances 20 s apart merged into one moment). For each moment: missions waiting
      at that second (rebuilt from the log), and the mean (observed − expected) of strategic decisions and tactical
      plans started within ±60 s. Null: the same number of utterances per session drawn at random from ALL that
      session''s speech, 5,000 times — so the comparison is ''overload talk'' vs ''any talk'', in the same people
      and sessions. Caveats: no speaker separation (researcher speech is in the transcripts); in round 2 about half
      of matched phrases were genuine stress on reading; alignment uses file times for 24 of 30 people (±2 s).'
    chart: load.spoken
    numbers:
    - Missions waiting at overload moments 2.41 vs 2.09 at random utterances (95% of random draws 1.71–2.45), p
      = .09.
    - 'Card-taking within ±60 s: −3.7 pp vs expected (random utterances +0.1), p = .38. Suggest: +3.5 pp (random
      +2.1), p = .65.'
    - 16 of the 51 moments came from the 9 people coded C11; 35 from others.
    atoms:
    - q-C11
    codes:
    - C11
  - id: backlog-practice
    title: 'Why Suggest seemed to rise with the backlog: the session was simply further along'
    text: 'One earlier result looked like an exception: Suggest was pressed more often when strategic decisions
      were waiting at the moment the operator started a tactical plan. The plain reading of this card: <b>that rise
      is mostly practice, not pressure.</b> Both the backlog and Suggest use climb over the 8 minutes (second chart).
      Because they climb together, a plan made with a long backlog is usually also a plan made later in the session.
      Hold the minute fixed and the backlog effect shrinks to borderline. In the first chart, the grey dashed line
      (adjusted for plan, game and person but NOT the minute) still rises with backlog; the solid line (adding the
      minute) is flat within its intervals.'
    how: 630 tactical plans, 33 people. Backlog = missions awaiting a strategic decision at the first planner action
      (Suggest press or first drag). Within-person GEE with plan size, drone types and game; then the same with
      minute of the session added. 'Adjusted' lines as in the first section, with the model either excluding or
      including the minute.
    chart: load.backlog
    numbers:
    - 'Without minute: OR 1.18 [1.07, 1.31] per extra mission in the backlog, p = .001. With minute: 1.11 [0.98,
      1.26], p = .10.'
    - 'The minute itself: Suggest odds ×1.13 per minute [1.03, 1.23]; backlog +0.23 missions per minute [0.16, 0.30].'
    - 'Suggest use by minute: 73%, 70%, 77%, 81%, 73%, 83%, 83%, 77%.'
