  title: Methods notes
  headline: 'Three things every claim in this register has to survive: the study has four fixed games of very different
    load, so analyses compare people within the game they played; P01 and P02 played on half task weights and are
    rescaled (no result here changes when they are dropped); and every "X of 33 said" count comes from one AI coder,
    so it needs a human second coder before publication.'
