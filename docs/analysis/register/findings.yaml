  - id: waited
    title: A mission left waiting is not handed over more often
    chart: load.waits
    tier: main
    role: numbers
    text: 'You wondered whether people automate when they realise they have left a card hanging. Here each decision
      is grouped by how long its mission had been waiting: on the strategic tier, from the mission''s arrival to
      the first time the operator opened it; on the tactical tier, from the planner opening to the operator''s first
      action on it (the plan the operator left sitting while they did something else). <b>The lines are flat.</b>
      Strategic card use is 63–68% (adjusted) whether the mission waited 10 seconds or more than two minutes. Tactical
      Suggest use, if anything, drifts down when a plan was left open longer (80% → 70%), the opposite of the idea,
      but not reliably. The buttons switch tier and show the raw rates and what the mission, minute, game and person
      alone would predict.'
    how: 'Rows: every strategic decision on a real (not re-queued) mission, 564 from 33 people, and every tactical
      plan, 630. Wait: strategic, mission arrival to the first time its strategy panel was opened; tactical, planner
      open to the first drag or Suggest. ''Adjusted'' is the overall rate plus the average of (observed − expected)
      in that bin, where the expected value comes from mission size and drone types, minute of the session, the
      game and the person''s own rate on their other decisions (the same model as section 1). Intervals resample
      people. The odds ratio compares each person with themselves: log2 of the wait (+5 s), centred within person,
      in a model with the same controls, people clustered; a second version also holds the queue depth fixed, since
      long waits come at busy moments.'
    numbers:
    - 'Strategic (mission left in the queue): adjusted 63% at 0–10 s, 66% 10–30 s, 68% 30–60 s, 63% 1–2 min, 67%
      at 2 min+ (n 173, 117, 100, 91, 83). Within person, odds ×1.10 per doubling of the wait [0.96, 1.28], p =
      .17; holding the queue fixed ×1.10, p = .19.'
    - 'Tactical (plan left open): adjusted 80% at 0–5 s, 76% 5–10 s, 76% 10–20 s, 73% 20–40 s, 70% at 40 s+ (n 270,
      182, 93, 41, 44). Within person, odds ×0.80 per doubling [0.60, 1.06], p = .12; holding the queue fixed ×0.76,
      p = .10.'
  - id: robust
    title: Every way of asking it gives the same answer
    text: 'The within-person change in the odds of relying per extra mission waiting, under every specification
      tried — including each game on its own, the heavier vs the lighter pair of games, a ''hinge'' that lets the
      effect differ beyond the visible list, tasks waiting instead of missions, and missions that had just arrived
      (which the operator cannot cause). Strategic: all 13 are compatible with no change. Tactical: the main model
      is flat, but two of twelve variants reach p < .05 (without mission size; Strategic Heavy game 1 alone) — a
      small upward lean that disappears once mission size is held fixed and is absent for the arrivals measure.'
    how: 'GEE logistic regression (decisions clustered within person, bias-reduced standard errors). ''Within person''
      means the queue is centred on that person''s own average, so the estimate compares a person when busier with
      the same person when less busy; their average queue is kept as a separate term. ''Main'' adds mission size,
      tasks, drone types, minute and game. An odds ratio of 1.04 means the odds of taking a card are 4% higher per
      extra mission waiting. To make the interval concrete: at the main model''s upper limit (1.17) uptake would
      rise from 65% at 0 waiting to 80% at 5; at its lower limit (0.92) it would fall to 56%. So the data rule out
      a large effect but not a modest one either way.'
    chart: load.robust
    numbers:
    - 'Strategic main: OR 1.04 [0.92, 1.17], p = .53 per extra mission waiting; range across 13 specs 0.91–1.60,
      none p < .05.'
    - 'Strategic hinge: 0–3 waiting OR 1.00 [0.82, 1.22]; beyond 3 OR 1.11 [0.86, 1.44] — no change at the visible
      limit.'
    - 'Tactical main: OR 1.08 [0.94, 1.24], p = .26; + minute and game only: 1.18 [1.03, 1.34], p = .017; arrivals
      in last 60 s: 1.00 [0.90, 1.11].'
    - 'Heavier games only (Strategic Heavy 1, Tactical Heavy 2): strategic 1.10 [0.93, 1.32], tactical 1.14 [0.98,
      1.32].'
