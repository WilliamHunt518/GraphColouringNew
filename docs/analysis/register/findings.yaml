- id: f-triage
  area: Workload and the queue
  title: Busy operators speed up a little but do not change what they pick
  headline: 'The earlier story — that with a long queue operators abandon order and pick smaller missions — does
    not survive a fair comparison. Long queues happen almost only in the two Strategic Heavy games, where every
    mission is small, so the opened mission is smaller simply because everything waiting is. Compared with what
    was actually waiting, operators keep the same priorities at any queue length: a strong pull towards the oldest
    mission, a mild preference for larger ones, and only falling ''oldest-first'' rates because chance falls as
    more missions wait. What does change is pace: a bit more decisions per minute when more is waiting (suggestive).'
  confidence: mixed
  absorbs:
  - load-pick-small
  sections:
  - id: games
    title: Where long queues happen
    text: The four games differ in how many missions arrive and how big they are. The Strategic Heavy games send
      many small missions (13–14 per session, about 6.5 drones each); the Tactical Heavy games send few large ones.
      96 of 102 decisions made with 4+ others waiting are in the Strategic Heavy games. Any comparison of 'long
      vs short queue' is therefore also a comparison of games unless the game is held fixed.
    how: 'Per session, from the event log: missions arrived (excluding residual re-queues), drones and tasks they
      needed, and the mean queue met at strategic decisions.'
    chart: load.games
    numbers:
    - 'Drones demanded per session: Tactical Heavy 2 115, Strategic Heavy 1 89, Strategic Heavy 2 88, Tactical Heavy
      1 63.'
    - 'Mean queue at a decision: Strategic Heavy 1 2.6, Strategic Heavy 2 2.0, Tactical Heavy 2 1.3, Tactical Heavy
      1 0.9.'
    - 'Decisions with 4+ others waiting: Strategic Heavy 1 64, Strategic Heavy 2 32, Tactical Heavy 2 6, Tactical
      Heavy 1 0.'
    atoms:
    - load-pick-small
    role: archive
    role_set: true
    tier: side
  - id: order
    title: 'Order: still oldest-first well above chance'
    text: The share of decisions that open the oldest waiting mission falls as the queue grows (59% with one other
      waiting, about 30% with five) — but so does the chance of hitting the oldest by picking at random (50% → 17%).
      Measured against chance, the pull towards the oldest stays roughly the same. 'One of the top 3 in the list'
      is near chance at every depth, so the list position itself does little beyond 'oldest first'.
    how: '414 strategic decisions where at least one other mission was waiting (33 people). For each, the set of
      missions waiting when the panel opened (arrival order from the log). Chance = 1 / (number waiting) for ''oldest'';
      3 / (number waiting) for ''top 3''. Intervals: people resampled 400 times. Within-person test: (picked oldest
      − chance) against queue depth, person-centred, with minute and game. Caveat: the list could be re-sorted by
      score and that toggle was never logged.'
    chart: load.pickOrder
    numbers:
    - 'Opened the oldest: 59% (1 other waiting; chance 50%), 48% (33%), 54% (25%), 40% (20%), 29% (17%), 20% (14%).'
    - 'Within person, the excess over chance does not shrink with depth: +2.4 points per extra mission [−1.0, +5.7],
      p = .16.'
    atoms:
    - load-pick-small
    role: paper
    role_set: true
    tier: main
    qual:
      summary: 'Nobody says they took missions oldest-first. Five say, in play or after, that criticality comes
        first (''I''ll go with the most critical first''): P20, P22, P31, P19 and P27. P27 adds ''can it be completed''
        as the first filter. The order model has no criticality term, so this stated rule is untested. P19 wished
        for a sort control, and P27 for smart ordering, unaware that an order-by-criticality button existed.'
      featured:
