- id: q-practitioner
  title: 'A practitioner''s reading: P36, a participant with operational military experience'
  confidence: qualitative
  headline: 'One participant had operational military experience. They played like everyone else, and differed in
    who they are: the oldest participant, the only one with extensive command experience, and among the most positive
    about AI. Their sessions and debrief are the richest material in the study, and nearly every result here has
    a passage of theirs that agrees with it, qualifies it or goes past it. Each point below is one passage with
    its own links back; the last section gathers them. This is one person''s expert commentary, not evidence about
