  - id: slow
    title: 'The exception that proves the rule: the people who call the assistant slow'
    text: 'Six people complain that the assistant is slow (C06: P06, P15, P16, P26, P27, P29). On every measure
      the two groups'' intervals overlap: none of the ten differences is reliable with six people. The directions
      are worth a sentence, not a claim. They take cards and press Suggest at the same rate as everyone else (58%
      vs 66%; 74% vs 76%), and they lean <i>towards</i> the size rule: they decide before the cards load more often
      (30% vs 13%, p = .055) and their three-type minus one-type gap is larger (+40 vs +19 points, p = .09). Read
      that way, the complaint and the rule are the same observation (the fixed wait is not worth it on small jobs),
      and P29 says as much. But this is a reading of six people, not a finding.'
    how: Per-person measures, averaged over the person's two sessions, for the six C06 people against the other
      27. Bars are group means; whiskers are 95% intervals from resampling people within each group. Score = session
      score (P01/P02 rescaled for their half task weights) standardised within each of the four games. p = two-sided
      permutation test (group labels reshuffled 20,000 times); 10 comparisons, uncorrected, so expect about one
      p below .10 by chance.
