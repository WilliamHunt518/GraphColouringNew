  - id: odd-missions
    title: On the missions that carry the flaw, noticers stop using the cards
    text: 'This is the cleanest behavioural trace, and it is where you would expect one. On their 1st illogical-card
      mission, noticers took a card 47% of the time and never-said people 56%. With each further illogical-card
      mission, noticers took a card about 14 points less often. By their 4th–6th they took one <b>0 times in 13</b>
      (7 people), going manual instead, mostly <i>before the cards had loaded</i> (62%). Non-noticers moved the
      other way: by their 4th–6th they took a card 74% of the time. Most of that was the illogical Conservative
      card itself (52%), which noticers took 0 times in 13. The handover analyst''s check fits this: when people
      build a one-type mission by hand rather than take the Conservative card, nearly all of the ''trim'' is dropping
      the unneeded-type spares (−1.2 drones overall, +0.05 on the types the mission needs). So hand-builders strip
      out exactly what is illogical; see f-manual-cards. The manual-card-error card''s version (people who mention
      a card error go manual more on one-type missions) holds in direction. But the same people also go manual more
      on three-type missions, where nothing is wrong (37% vs 22%). The one-type-<i>specific</i> part does not hold
      between people (interaction OR 1.12, p = .78). What is specific to the flawed missions is the <i>trend</i>:
      noticers learn to skip the cards there.'
    how: 'Rows: the 132 illogical-card decisions, numbered per person (1st, 2nd, …). Each is coded by what happened:
      took the Conservative card (the illogical one), took Aggressive, manual after the cards loaded, or manual
      before they loaded (a pre-emptive choice that never saw the cards). Trend = a linear model of each outcome
      on the card''s number (capped at 7) × group, with game held fixed and people clustered. The interaction p
      is whether the two groups'' slopes differ. Between-person check (manual-card-error): manual ~ said + game
      on one-type missions, then on three-type, then the said × one-type interaction (logistic GEE, people clustered).'
    chart: flaw.oddMissions
    numbers:
    - 'Took any card, per extra illogical card: noticers −13.9 points [−25, −3]; never-said +5.3 [−2, +12]; difference
      p < .001'
    - 'Took the illogical Conservative card: noticers −3.5 points per card; never-said +9.3 [+1, +18]; difference
      p = .001'
    - 'Manual before the cards loaded: noticers +15.4 points per card [+2, +29]; never-said −5.8; difference p =
