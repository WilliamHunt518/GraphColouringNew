  - id: not-disposition
    title: Nothing measured beforehand predicts the style
    text: 'Attitude to AI (AIAS-4), verification propensity, views on human authority over AI (delegation scale
      and its single items, including "a human should make the final decision"), and prior experience: 40 tests
      against five behaviours. Three reach p < .05 before correction, and <b>none survives Holm correction</b> for
      the 40 tests. Three nominal hits is what chance alone produces: shuffling which person''s questionnaire goes
      with which person''s behaviour gives 2.0 such hits on average, and 3 or more in a third of shuffles. This
      is "no evidence", not proof of no link: the sample could only have detected fairly strong correlations (|ρ|
      ≥ .48), and it is almost uniformly AI-positive (AIAS-4 averages 8.0 / 10) and from computing or engineering
      (32 of 33). Within this sample, the large differences in style are not explained by what people say they think
      about AI.'
    how: 'Per person: each questionnaire score (taken before session 1) against the average over both sessions of:
      card uptake, Suggest consulted, Suggest plan kept unmodified, strategic decision time, session score. Spearman
      ρ per cell; Holm correction across all 40 together (build_findings_synthesis <code>analyse_disposition</code>).
      Detectable effect = the correlation the sample had an 80% chance to find at α = .05 (n = 32 with questionnaires).
      Round 1 H7''s decision-level model gives the same answer for AIAS-4: odds of taking a card × 0.80 per SD [0.50,
      1.27].'
    chart: style.dispositionGrid3
    numbers:
    - 0 of 40 tests survive Holm; 3 nominal (verification × score ρ −.41; delegation × Suggest consulted −.38 and
      × plan kept −.40)
    - Chance alone gives 2.0 nominal hits on average; 3 or more in 34% of 2000 shuffles of who-goes-with-whom; a
      p as small as the smallest one (.021) turns up somewhere in the grid in 51% of shuffles
    - AIAS-4 × card uptake ρ −.15; “A human should make the final decision” × card uptake ρ −.08
    - AIAS-4 odds ratio for card taking 0.80 per SD [0.50, 1.27]; detectable only at about ×2
    - AIAS-4 mean 8.0 / 10 (SD 1.2); 32 of 33 from computing / engineering; detectable |ρ| ≥ .48
