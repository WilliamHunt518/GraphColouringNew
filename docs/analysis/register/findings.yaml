  - id: speed
    title: 'Why the rule makes sense: the card pays only on big strategic jobs; Suggest is not slower'
    text: 'Each decision''s time split into the time before the operator''s first action and the time after it,
      by mission size, as stacked bars (toggle: tier). <b>First action</b> = the first click on that decision: highlighting
      a card or changing a manual count (strategic; taking a card always needs a highlight first), pressing Suggest
      or dragging a drone (tactical). Before it, the strategic panel has two parts: the cards still loading (a forced
      wait of about 4.7 s; deciding by hand early can cut it short) and <b>idle time</b> with the cards on screen.
      The "Time counted" toggle drops the idle time, or everything before the first click. Strategic: counting everything,
      a card is much quicker than a manual build on three-type missions (−27%) and no quicker on one-type ones (+22%,
      not reliable). Card-takers sit idle about as long as manual builders (7 s vs 9–11 s on average), so dropping
      idle time makes the card look better everywhere; on one-type missions it then ties with a manual build (−8%),
      and on three-type missions the card is 44% quicker. Deciding before the cards load (7 s) beats the card when
      everything is counted and is level with it once idle time is dropped, on one-type missions. Tactical, on all
      627 plans: by hand and with Suggest take about the same planner time (29 vs 27 s on average), and the same
      with the idle time removed (15 vs 17 s); held to the same person and size the difference is under 1 s. On
      large missions hand-building takes longer (32 vs 22 s without idle time), but the size × Suggest term is not
      reliable. So the speed story is clear on the strategic tier, and on the tactical tier Suggest saves no planner
      time. Its time saving is in carrying out (next section).'
    how: '<b>Rows</b>: strategic, the 606 card decisions (the last panel opening before the choice, as everywhere
      in this finding); tactical, the 627 non-recovery plans with a known mission size (kept Suggest plans vs hand-built;
      the 18 edited Suggest plans are in the table only). <b>Segments</b>, from the event log: strategic, panel
      opened → first click (split at the moment the cards appeared: before = "cards still loading", after = "idle,
      cards on screen") and first click → choice; tactical, planner opened → first Suggest press or drag ("idle"),
      → plan ready (last drag, or the end of the one-entry-per-second Suggest fill), → confirmed. These are the
      same phases as the next section, which adds carrying out. Bars are means (means add up, medians do not), whiskers
      95% intervals of the bar''s total from resampling people. Sizes: strategic, one-type missions (3–6 drones)
      and three-type missions of 6–9 and 10–18 drones; tactical, drones needed ≤ 6, 7–9, 10+. <b>Models</b>: strategic,
      Gaussian GEE on log seconds, card × three-type, all manual decisions pooled as the comparison, the person''s
      own card rate, drones, game, session and minute held fixed, run once per way of counting; tactical, GEE on
      seconds, Suggest split within/between person, drones needed, game and session fixed. <b>Caveat</b>: idle time
      mixes reading the cards or plan with being busy elsewhere, and the log cannot tell them apart. For tactical
      plans idle for more than 10 s, 54% had another mission''s strategic panel opened in that time, so long idle
      time is often attention elsewhere.'
    chart: handover.speedPhases
    numbers:
    - 'Strategic, card vs manual, same person, % change in time: everything: one-type +22% [−3, +55], p = .09; three-type
