  - id: by-index
    title: Card use by decision number, session 1 then session 2, not aligned to the card
    tier: main
    role: paper
    chart: flaw.byIndex
    text: 'Each person''s decisions are numbered in the order they made them within each session (or counting only
      three-type, one/two-type, or missions with no illogical card). <b>Session 1 and session 2 sit on one axis</b>,
      separated by a dashed line, with the two sessions'' lines deliberately not joined (session 2 is a different
      game, after a break and a survey). <b>Later numbers are different people</b>: only those who made that many
      decisions reach them, and they are mostly players of the strategic-heavy game, which has more missions. So
      a point is drawn only if at least 8 people of its group reach it; dot size and the numbers under the axis
      show how many people each point rests on. <b>Session 1</b>: noticers 80%, 67%, 47%, 50%, 46%, then 83%, 64%,
      78% for decisions 6–8; never-said 61%, 61%, 78%, 94%, 89%, 72%. Noticers dip at 3–5 and climb back (+24 points
      per person). The same shape holds in a fixed panel of the 9 noticers and 12 never-said people who made at
      least 8 decisions (noticers 44% at decisions 4–5, 78–89% at 6 and 8), so it is not a change of who is counted.
      <b>Session 2</b>: noticers 47–53% for six decisions, then 30–38% at 7–9; never-said people 61–92%. The late
      low is the mission mix: around decisions 7–8 of the strategic-heavy game half the missions show the illogical
      card, and noticers took it on 17% of those against 62% of the rest. Leaving those missions out, noticers and
      never-said people meet at decisions 7–8 (71% against 70–73%). Noticers start session 2 below where they ended
      session 1 (64% → 49%), but never-said people also start a little lower (76% → 69%); the difference at the
      break is small and uncertain (−6 points [−32, +20]), and −9 [−30, +12] for noticers after allowing for the
      mission mix. The very last numbers of each session (session 1 decisions 9–11+, session 2 decision 10 and 11+
      for noticers) rest on 2–6 noticers and are hidden; the <i>Thin points</i> button shows them. Buttons: sessions,
      people, who is counted (everyone who reached each number, or the fixed panel), thin points, missions, game
      order, every decision or pairs, observed or adjusted.'
    how: 'Rows: every strategic decision; position = its rank among that person''s decisions of the chosen kind
      in that session (positions past 10 pooled as 11+). Rate = share where a card was taken, 95% bands from resampling
      people, n decisions and people in each tooltip, with the point''s share of three-type missions, illogical-card
      missions, strategic-heavy-game decisions and last-90-s decisions. <b>Minimum</b>: a point is drawn by default
      only if at least 8 people of its group (both game orders together) reach that number, about half of the smaller
      group. <b>Fixed panel</b>: per session and mission kind, K = the largest number that at least 8 people in
      each group reach; only people with at least K decisions, decisions 1–K (all missions: session 1 K = 8, 9 noticers
      and 12 never-said; session 2 K = 9, 8 and 10). ''No illogical card'' drops the decisions on missions whose
      Conservative card showed an unused drone type, then renumbers. ''After card'' strip = share of the position''s
      decisions made at or after the person''s first illogical card. Carry-over checks, per person then averaged
      (intervals from resampling people, p from a t-test over people): (a) recovery = the rest of session 1 (decisions
      6+) minus decisions 3–5; (b) break = the first three decisions of session 2 minus the last three of session
      1; (c) start-to-start. Group differences = the interaction in a linear model with people clustered; adjusted
      versions use observed − expected.'
    numbers:
    - 'Everyone, session 1, decisions 1–6: 70%, 64%, 64%, 75%, 71%, 77% (n 33 → 30)'
    - 'Noticers, session 1: 80%, 67%, 47%, 50%, 46%, 83%, 64%, 78% (decisions 1–8, 15 → 9 people); never said: 61%,
      61%, 78%, 94%, 89%, 72%, 46%, 75%, 73% (decisions 1–9, 18 → 11 people)'
