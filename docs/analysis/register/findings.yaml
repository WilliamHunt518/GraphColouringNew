  - id: parallel
    title: 'Where the tactical time goes: hand-built and Suggest plans are close, with a small edge to Suggest in
      carrying the plan out'
    text: 'Each tactical plan split into four phases: before the first action (idle, or busy elsewhere), building
      the plan (drags, or the one-entry-per-second Suggest fill), plan ready → confirmed, and carrying out (confirm
      → mission complete), for every size group side by side; the toggle leaves out the time before the first action.
      <b>The headline is how close the bars are.</b> The operator''s own time on a plan is the same either way:
      Suggest saves about 3 s in building and gives it back waiting between ready and confirmed (net about +1 s).
      The only reliable difference is in carrying the plan out, about 11 s sooner for a Suggest plan (roughly a
      tenth of a mission''s time), so the assistant''s plans are very slightly better rather than much faster to
      make. Read the large group with care: only 6 hand-built large plans finished cleanly. The raw "all missions"
      bars look the other way (hand-built 90 s, Suggest 100 s); that is a mix effect, not a contradiction: 78% of
      finished hand-built plans are small missions, against 42% of Suggest plans. Given the same mix of sizes, hand-built
      plans take 109 s and Suggest 96 s. So the common feeling that the assistant is "faster" is only weakly supported:
      it does not save the operator time, and the plans it makes finish a little sooner. Each tier''s use still
      looks sensible: Suggest is used where plans are big, which is where its small edge in execution adds up. And
      relying on the assistants more does not make an operator do better: within a person, card missions are completed
      in full no more often than their own hand-built ones (odds ×0.81, p = .27; raw 60% vs 62%), and session score
      is flat in sessions where they rely more (−0.10 SD per 25 points of card uptake, p = .61). The ready → confirmed
      gap is when operators turn to other missions: 45% of Suggest plans had another mission''s strategic panel
      opened while the planner was open, against 19% of hand-built ones.'
    how: '<b>Rows</b>: confirmed non-recovery tactical plans. <b>Phases</b> from the event log, the same as in section
      4: planner opened (<i>tactical_opened</i>); first action = first Suggest press or first drag; plan ready =
      last drag, or for a Suggest plan the end of its fill (last press + 1 s per drone-task entry), whichever is
      later; confirmed (<i>tactical_confirmed</i>); mission complete (<i>mission_completed</i>). <b>Carrying out</b>
      can only be measured when the mission finished in full with no drone failure: 315 of 630 plans; the chart
      shows those (81 hand-built, 231 kept Suggest; edited Suggest plans left out, 3 survive). Size groups by drones
      needed: small ≤ 6, mid 7–9, large 10+. Bars are means, whiskers 95% intervals of the bar''s total from resampling
      people. <b>Size-standardised</b>: each route''s mean in each size group, weighted by the share of all finished
      plans in that group (small 51%, mid 23%, large 26%), so both routes get the same mix; this answers "how long
      would each route take on the same missions?". Only 6 large hand-built plans finished cleanly (5 people), so
      that bar and the standardised hand-built bar are the least certain. <b>Model</b>: Gaussian GEE of seconds
      in each phase on "Suggest pressed" (split within/between person), log drones needed, game and session. Seconds
      add up, so the phase differences sum to roughly the whole. The bottom row drops drones needed from the model:
      still within person, but with size not held the difference vanishes (−0.1 s), which shows the raw reversal
      comes from size, not from who uses which route. <b>Projected completion</b> and <b>interleaving</b> as before.'
    chart: handover.phases2
    numbers:
    - 'Suggest minus hand-built, same person, drones needed held (315 finished plans): before the first action −4.0
      s [−12.5, +4.6], p = .37; building −2.6 s [−5.0, −0.1], p = .038; ready → confirmed +3.3 s [+1.5, +5.0], p
      < .001; carrying out −11.5 s [−19.6, −3.4], p = .006; whole −14.8 s [−22.4, −7.3], p < .001'
    - 'Whole thing without the time before the first action: −11.3 s [−20.5, −2.1], p = .017; whole thing with size
      not held: −0.1 s [−10.8, +10.6], p = .99'
    - 'Means (s), hand vs kept Suggest: small 78.5 vs 74.8 (63 vs 97 plans); mid 113.6 vs 102.0 (12 vs 59); large
      166.6 vs 131.6 (6 vs 75); all, raw 90.2 vs 100.2; all, size-standardised 109.3 [102.7, 119.4] vs 95.7 [91.9,
      99.1]'
    - 'Size mix of finished plans: hand-built 78% small, 15% mid, 7% large (mean 5.7 drones needed); Suggest 42%,
      26%, 32% (mean 8.8)'
    - 'All 627 plans, first three phases: before −2.9 s, p = .29; building −3.2 s [−6.2, −0.1], p = .04; ready →
      confirmed +3.3 s [+2.0, +4.6], p < .001'
    - 'Carrying out, including missions with a drone failure (378): −8.1 s [−17.1, +0.9], p = .08: same direction,
      less certain'
    - 'Projected completion vs the assistant''s own plan at open, median: hand-built +10.3 s [3.7, 28.3] (144 plans),
      kept Suggest +1.6 s [0.8, 4.0] (468), edited Suggest +38.7 s (18)'
    - 'Interleaving, round-1 specification re-run: odds ×4.83 [2.24, 10.40], p < .001 (630 plans, 33 people); raw
      45% vs 19%; 28% vs 11% actually allocated another mission'
    - 'Operator time, building + ready → confirmed, Suggest minus hand-built, same person, size held: −2.6 s + 3.3
      s ≈ +0.7 s (negligible)'
    - 'From the retired "who does better" finding: within a person, card missions vs own manual missions, completed
      in full odds ×0.81 [0.55, 1.18], p = .27 (raw 60% vs 62%); session score per +25 points of card uptake −0.10
      SD [−0.47, 0.27], p = .61. Between people, heavier card users complete more (×1.32 per 25 points, p = .004):
      the difference is in the people, not the advice'
    atoms:
    - speed-parallel
    codes: []
    tier: main
    role: paper
    role_set: true
    reply: '<b>Partly agreed, and reframed that way.</b> The operator''s own time is a wash (building −2.6 s, waiting
      +3.3 s), so "the assistant is faster to plan with" is not supported. One difference does hold up statistically:
      Suggest plans are carried out about 11 s sooner (p = .006), about 10% of a mission. So I would not say "negligible"
      outright. I''d say "small, and in plan quality rather than operator speed". The text now leads with how close
      the bars are, flags the 6 large hand-built plans, and adds the two numbers from the retired finding (relying
      more does not make the same person do better: odds ×0.81, p = .27; score flat).'
  - id: said
    title: What operators say
    text: 'Ten of 33 state the rule unprompted (C03: small/simple myself, big/complex to the assistant); 15 value
      the assistant for speed rather than accuracy (C04, the most common reason given); 8 describe working on something
      else while it runs (C05). The behaviour matches the words. People who state the rule press Suggest less overall
      (59% vs 86% of plans) and their size slope is, if anything, steeper on the tactical tier (×1.43 steeper, p
      = .10) — not reliably different from everyone else''s, so stating the rule is not what makes someone follow
      it.'
