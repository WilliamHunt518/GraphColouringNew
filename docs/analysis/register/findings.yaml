  - id: strategic-steps
    title: 'Strategic tier, honestly: most of it is deciding small missions before the cards arrive'
    text: A strategic decision has two steps. The cards take about 4.7 s to load; before that the operator can already
      build an allocation by hand ("pre-emptive manual"). Pre-emption is common on small missions (25–34% of decisions
      needing ≤ 5 drones) and rare on big ones (7–9%). Once the cards are on screen, operators take one 67–75% of
      the time on small missions and 81–83% on big ones — a weaker slope that on its own is not distinguishable
      from flat. So on this tier "small jobs myself" mostly means "I don't wait for the advice on small jobs". That
      is still a hand-over decision driven by size, but it is a decision about whether to wait for the assistant
      at all, not a verdict on its advice.
    how: 'The same 606 decisions split by the logged flag <i>manualBeforeCardsLoaded</i> (97 pre-emptive manuals).
      Two within-person GEEs: (1) pre-emptive manual (yes/no) ~ size, on all 606; (2) card taken ~ size, on the
      509 decisions where the cards had loaded first. Dropping pre-emptive decisions removes only manual choices,
      so (2) is a conditional view, not an artefact-free one — it shows how much of the size effect lives in each
      step.'
    chart: handover.sizeStratStepsBars
    numbers:
    - 'Pre-emptive manual, per doubling of drones: odds ×0.48 [0.33, 0.69], p < .001; three-type vs one-type ×0.34
      [0.21, 0.57]'
    - 'Card taken once cards are on screen, per doubling: ×1.26 [0.94, 1.69], p = .12; three-type vs not ×1.51 [0.93,
      2.44], p = .09'
    atoms:
    - size-decides
    tier: side
    role: archive
    role_set: true
  - id: five
    title: 'Why the 5-drone missions dip: seven particular missions, not size'
    tier: side
    role: archive
    chart: handover.fiveDrone
    text: 'On the strategic tier the small sizes are all one kind of job. Every one-type mission of 3, 5 or 6 drones
      is an all-Fast recce mission with a single composition per size (3 = T1+T2, 5 = T1+T2+T2, 6 = T1+T1+T2+T2),
      and the cards offer much the same at each size (the Conservative card carries 3.0–3.5 Fast drones; about 70%
      carry an illogical spare). So nothing about the job explains why 5-drone missions get the card less often
      (44%) than 3-drone (53%) or 6-drone ones (66%). What does differ is <i>which missions</i> and <i>when</i>.
      The 5-drone bar is seven specific missions, all in the two Strategic Heavy games. Six of them arrived in minutes
      4–7 with 3–4 other missions waiting, and were decided fastest (median 8 s) and most often before the cards
      loaded. The seventh arrived at the start of a game with a short queue and got the card 69% of the time, more
      than any 3-drone mission. Missions of the same size range from 23% to 69%. Comparing each person with themselves,
      with game and session fixed, 5-drone missions are not distinguishable from 3-drone ones, nor 6-drone from
      3-drone. The dependable strategic contrast is one-type vs three-type. Busy timing is a plausible contributor
      (on 5-drone missions, 37% card with 3+ waiting vs 56% with fewer), but it cannot be separated here: holding
      the queue fixed barely moves the 5-vs-3 contrast.'
    how: '<b>Rows</b>: the 177 strategic decisions on one-type missions needing 3, 5 or 6 drones (45, 88, 44), one
      per person per mission. <b>Bars</b>: one per mission (game × mission id), card-taken share (toggle: decided
      before the cards loaded), 95% Wilson intervals; hover for the composition, arrival minute, missions waiting
      and median decision time. <b>Model</b>: logistic GEE clustered on person, with 5-drone and 6-drone indicators
      (3-drone the reference) split within/between person, game and session fixed; a second fit adds missions waiting
      and minute of session. Because every participant played the same fixed missions, each size here is only 3–7
      missions, so mission-to-mission differences (arrival time, what else is happening) cannot be told apart from
      size.'
    numbers:
    - '3 drones: 45 decisions on 4 missions, card 53%, decided before cards 24%, arrived minute 2.6 on average with
      1.3 waiting, median 11.4 s'
    - '5 drones: 88 decisions on 7 missions (Strategic Heavy games only), card 44%, before cards 34%, minute 4.3,
      3.1 waiting (59% of decisions with 3+ waiting), median 8.1 s'
    - '6 drones: 44 decisions on 3 missions, card 66%, before cards 18%, minute 3.0, 1.4 waiting, median 11.3 s'
    - 'Within person, game + session fixed, card taken: 5 vs 3 drones ×0.78 [0.44, 1.37], p = .38; 6 vs 3 ×1.38
      [0.54, 3.48], p = .50; with queue and minute also held: 5 vs 3 ×0.82, p = .51'
    - 'Decided before the cards loaded: 5 vs 3 ×1.41 [0.74, 2.68], p = .29'
    - '5-drone missions by queue: fewer than 3 waiting 56% card, 25% before cards (36 decisions); 3+ waiting 37%,
      40% (52)'
    role_set: true
  - id: tactical
    title: 'Tactical tier: Suggest rises with mission size, and goes with the strategic choice'
    text: 'In the tactical planner the dose-response is smooth whichever way size is measured: drones the mission
      needs, drones committed, tasks, drone types or plan size (the toggle). The two bar colours split plans by
      how the mission was allocated strategically. A mission allocated from a strategy card gets Suggest more often
      than one allocated by hand, at every size and on every measure: <b>handing over at one tier goes with handing
      over at the other</b>. Comparing the same person''s missions of the same size, a card-allocated mission gets
      Suggest at about twice the odds (×2.10). The gap is wide on small missions (70% vs 35% at ≤3 drones) and small
      on the biggest (93% vs 88%), but that narrowing is both rates approaching 100%; tested properly, the gap does
      not reliably shrink with size. Operators say this too: one participant (P10) described, while playing and
      again afterwards, that once they had taken the Aggressive card "anything but Suggest" made no sense, because
      a generous allocation leaves only one sensible way to assign the drones; two others (P05, P30) talked through
      taking a card and then pressing Suggest on the same mission. P10''s reason, that it is the generous card that
      makes Suggest the obvious next step, does not show up across everyone: Suggest follows the Aggressive and
      the Conservative card at the same rate. The link is card vs hand, not which card. We use drones needed as
      the main measure: it is fixed by the mission, the same for every operator and what the task badges show. Plan
      size and team size also contain the operator''s own strategic choice: for the same mission, a card commits
      about 11% more drones than a hand allocation, so part of the strategic route is built into those x axes.'
    how: '<b>Rows</b>: the 630 non-recovery tactical plans that were confirmed (the planner starts empty, so pressing
      Suggest is a deliberate choice); 627 have a known mission size. <b>Measures</b>: drones needed (sum of the
      task badges'' requirements), drones committed (the team the strategic choice sent), tasks (residual missions
      left out), drone types, plan size (team × tasks). <b>Size model</b>: logistic GEE clustered on person, size
      split into this plan''s size minus the person''s own average (within) and that average (between), game and
      session fixed. <b>Route</b>: the same model plus "allocated from a card" (also split within/between person),
      so its odds ratio compares the same person''s card-allocated and hand-allocated missions of the same size.
      <b>Narrowing test</b>: a route × size term (ratio of odds ratios; below 1 = the gap narrows as size grows).
      <b>Same-mission check</b>: regression of each measure on route with one dummy per mission, so only operators
      who met the same mission are compared.'
    chart: handover.sizeTacMeasures
    numbers:
    - 'Within person, per doubling of drones needed: odds ×2.91 [2.03, 4.17]; per extra task ×2.04 [1.59, 2.62];
      per extra drone type ×1.73 [1.30, 2.31]; per doubling of drones committed ×2.51 [1.83, 3.45]; per doubling
      of plan size ×2.08 [1.67, 2.59] (all p < .001)'
    - 'Allocated from a card vs by hand, same person, size held: ×2.10 [1.30, 3.40], p = .003 (drones needed); ×1.78
      to ×2.12 on the other four measures, all p < .05'
    - 'Aggressive card vs Conservative card, same person, drones needed held: ×0.88 [0.45, 1.75], p = .72 (400 plans);
      raw Suggest rate after Aggressive 81% (200), after Conservative 89% (203), after a hand allocation 63% (227)'
    - 'Does the gap shrink with size? Route × size: ×0.76 [0.30, 1.92], p = .56 (drones needed); p = .28 to .98
      on the other measures: no reliable narrowing'
    - 'Suggest pressed, card-allocated vs hand-allocated: ≤3 drones 70% vs 35%; 7–9 drones 85% vs 71%; 15–18 drones
      93% vs 88%'
    - 'Same mission, card vs hand: ×1.11 more drones committed and ×1.12 larger plan (both p < .001); drones needed,
      tasks and types identical by construction'
    - 'Person level: people who take more cards also press Suggest more (Spearman ρ = .37, p = .033, 33 people)'
    - 'P10 in the log: Suggest on 8 of 9 Aggressive-allocated missions (never took the Conservative card) vs 6 of
      9 hand-allocated'
