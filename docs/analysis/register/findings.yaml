  sections:
  - id: event
    title: The event study, aligned on the first illogical card (every step, pairs or threes)
    text: 'Each person''s decisions are numbered <i>within</i> the kind of mission plotted: their 1st, 2nd, … decision
      after the first illogical card. Buttons: <b>Missions</b> (all, the default; three-type only; one- and two-type
      only), <b>Grouping</b> (every step; every pair, the default; groups of three), <b>Before the card</b> (one
      pooled point, the default; the last three steps −3, −2, −1; or those steps for only the people who have three
      of them) and <b>Show</b>. Every step is what you asked for, but each point is then about 15 single decisions
      and its interval spans roughly 30 points either way. Pairs keep the shape with intervals about a third narrower,
      so pairs is the default. On <b>all missions</b>, noticers go from 76% before the card to 43–52% for their
      next ten decisions, recovering to 67–68% only from the 11th on. Never-said people stay at 67–75% throughout.
      Part of the noticers'' low on all missions is the flawed one-type missions themselves, where they increasingly
      refuse the card. On <b>three-type missions</b>, noticers go 74% → 43% (1st–2nd) → 59–63% → 75%: a short dip
      and recovery. On one- and two-type missions almost nobody has a decision before the card, because the card
      only ever appears there, so only the after-card trend can be read. <b>The steps before the card</b> add little:
      most people have only one decision before it, so −2 and −3 are 8 decisions each (±35 points). The last step
      before the card (−1) is lower than −3/−2 in <i>both</i> groups (64% and 56%), so it is not a noticer warning
      sign. <b>Read with the next section:</b> the aligned dip is not where it seems.'
    how: 'Rows: strategic decisions of the 33 people, split into those who said they noticed (debrief or interview
      code C12, or a strict in-play remark; 15 people) and those who never said so (18). ''Before'' and ''after''
      are relative to the first illogical card. That decision itself is excluded from both windows and shown as
      its own point (''the card'') in the all-missions view. Change = the ''after'' coefficient in a linear model
      of card uptake, with practice (decision number) held fixed and people clustered for the uncertainty. Raw version:
      uptake ~ after + practice + game. Adjusted version: (observed − expected) ~ after + practice. The interaction
      asks whether the after-step differs between the groups. Label shuffle: the said/never-said labels were shuffled
      across people 5,000 times, to see how often a random split of the same people shows as large a difference
      in their own after-minus-before. Each person counts once in that test, so it is exact. Steps before the card:
      −1 is each person''s last decision before it, −2 the one before that, and ''≤ −4'' pools everything earlier;
      the matched view keeps only the 16 people (8 per group) with at least three such decisions. Mission-only expected:
      the same model''s prediction with each person''s own-rate term set to everyone''s average.'
    chart: flaw.events2
    numbers:
    - 'All missions, noticers (15): 76% before (n 53) → card 47% (n 15) → pairs +1–2 to +9–10: 43%, 47%, 43%, 46%,
      52% → 67% (+11–12) → 68% (13th+, n 31)'
    - 'All missions, never said (18): 78% before (n 54) → 56% at the card → 67–75% for every later pair'
    - 'All missions, before → after, adjusted: noticers −14 points, p = .08; never said +9, p = .14; difference
      −14 [−30, +1], p = .06'
    - 'Three-type, noticers by pair: 74% before (n 51), 43% (n 30), 59% (n 29), 62% (n 24), 63% (n 19), 75% (n 12)'
    - 'Why expected is lower for noticers: their own-rate term (take rate on all their other decisions) is 56% vs
      70%; 79% of a noticer''s decisions come at or after the card, where they took 50% per person vs 72% (p = .007);
      before the card the groups were alike (68% vs 63%, p = .71)'
    - 'Mission-only expected (own-rate term set to the average): after the card 68% noticers vs 69% never-said;
      before 80% vs 81%'
    - 'Steps before the card, all missions: noticers ≤−4 87% (n 23), −3 88% (n 8), −2 50% (n 8), −1 64% (n 14);
      never-said 82%, 100%, 88%, 56% (n 22, 8, 8, 16)'
    - '−1 against −3/−2, the 16 people with three steps (all tactical-heavy-first): adjusted −13 points [−40, +13],
      p = .29'
    - 'Matched view (8 noticers with 3+ steps, 6 of whom met the card at the start of session 2): 87%, 88%, 50%,
      63% before → 38% at the card → 31–44% for the next ten decisions'
