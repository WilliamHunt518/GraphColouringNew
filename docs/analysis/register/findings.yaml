- id: f-manual-cards
  area: When operators hand over
  title: Manual allocations are anchored on the cards — and the 'trimming small missions' was mostly dropping the
    illogical spare
  headline: 'When operators allocate by hand after seeing the cards, their numbers track the cards: one more drone
    on the Conservative card means about half a drone more in the manual build, beyond what the mission needs. Operators
    who decided before the cards appeared show no such link — a clean control, so this is anchoring, not both tracking
    the mission. Manual builds sit at or below the cards (44% below both, 33% equal to one, 14% between, 8% above).
    The earlier "trim small missions, pad big ones" mostly dissolves: on one-type missions the ''trim'' is almost
    entirely dropping the Conservative card''s spare drones of types the mission does not need.'
  confidence: moderate
  absorbs:
  - manual-anchored
  - q-C07
  - q-C08
  - q-C09
  - q-C10
  sections:
  - id: dots
    title: Each manual decision against the Conservative card
    text: 'Every manual allocation (209) as one dot: drones committed minus drones on the Conservative card, against
      the drones the mission needs. Switch to "needed types only" and the band of one-type missions moves up to
      zero: on the types the mission actually needs, manual builds on small missions match the Conservative card
      (+0.05 drones on average); the −1.2 drones on all types is the card''s spare of each unneeded type being left
      off. On big three-type missions manual builds sit about one drone above the Conservative card (and still far
      below the drones the mission lists, since drones are reused across tasks in series).'
