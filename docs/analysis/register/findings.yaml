  - id: said
    title: What operators say
    text: 'Ten of 33 state the rule unprompted (C03: small/simple myself, big/complex to the assistant); 15 value
      the assistant for speed rather than accuracy (C04, the most common reason given); 8 describe working on something
      else while it runs (C05). The behaviour matches the words. People who state the rule press Suggest less overall
      (59% vs 86% of plans) and their size slope is, if anything, steeper on the tactical tier (×1.43 steeper, p
