    - 'Session 2 tail (hidden for noticers): decision 10, 5 noticers 60%; 11+, 4 noticers (all tactical-heavy first,
      so playing the strategic-heavy game) 12 of 13 = 92% [67, 99], against 8 never-said 20 of 28 = 71%. These 4
      took cards on 42% of their decisions 1–6, below their group''s 51%: not keen takers surviving'
    - 'Strategic-heavy game: share of decisions with an illogical card at decisions 7, 8, 9, 10, 11+: 48%, 55%,
      30%, 4%, 5%. At decisions 7+, noticers took 17% of illogical-card missions (n 18, 9 people) and 62% of the
      rest (n 53); never-said 68% and 69%'
    - 'Session 2, no illogical card: noticers 71% at decisions 7 and 8 (7 people) against never-said 73% and 70%;
      earlier the gap is there (decisions 2–3: 33–47% against 67–89%)'
    - 'Session 2 fixed panel (8 noticers, 10 never-said, decisions 1–9): gap over the last 3 decisions −47 points
      [−81, −12] against −19 [−50, +12] before; on missions with no illogical card (panel to decision 6) −17 [−45,
      +12] against −30 [−61, +1]'
    - 'At the session break (last 3 of session 1 → first 3 of session 2): noticers 64% → 49%, −16 points [−38, +4],
      p = .17; adjusted −9 [−30, +12]; never-said 76% → 69%, −7 [−24, +7]; difference −6 [−32, +20], p = .66'
    - 'Recovery within session 1 (decisions 3–5 → 6+): noticers 48% (n 42) → 66% (n 50), +24 points per person [+5,
      +43], p = .04 (window read off the curve, so descriptive)'
    role_set: true
    reply: '<b>Yes, the last points were misleading; the rest holds up.</b> Later decision numbers only include
      people who made that many decisions, and those are almost all players of the strategic-heavy game. The odd
      session-1 tail was 5 noticers making one decision each at number 10 (1 of 5 took a card) and just 2 noticers
      at 11+, most of it in the last 90 seconds; never-said people dipped at 10 as well (43%). That is noise on
      a handful of people, not a pattern. The session-2 cross-over is 4 noticers (13 decisions, 92%). They are not
      keen card-takers (42% on their first six decisions). What changes is the missions: in the strategic-heavy
      game about half of decisions 7–8 show the illogical card, which noticers refuse (17% taken against 62% otherwise).
      By decision 10 those missions have stopped (4–5%), so noticers take cards again. Leave out the illogical-card
      missions and the two groups meet at decisions 7–8 (71% against 70–73%), with no cross-over. On n: no, not
      at the tail, so the chart now hides any point that fewer than 8 people in a group reach (a button shows them,
      faded). Dot size and a row of numbers under the axis give the people per point, and a fixed-panel view keeps
      the same people throughout. In that panel the session-1 dip and recovery are unchanged, so the main reading
      is not a change of who is counted.'
