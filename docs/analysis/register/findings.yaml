- id: f-practice
  area: When operators hand over
  title: Practice makes operators faster, not better at choosing when to hand over
  headline: 'Decisions speed up within each session: about 6% faster per minute on both tiers, and not because the
    queue gets longer. On the strategic tier most of that gain is gone by the start of the next session (median
    11.6 s at the start of session 1, 6.9 s at its end, 10.6 s at the start of session 2), so it reads as a within-session
    warm-up more than durable learning. On the tactical tier session 2 starts about where session 1 ended. The size
    rule does not sharpen with practice: the big-minus-small hand-over gap is the same or smaller in session 2.
    The six people who say they got better did improve their scores (all six, against 37% of others), but they did
    not come to use the assistants more, and across everyone a bigger score gain does not go with more use.'
  confidence: moderate
  absorbs:
  - learn-speed
  - learn-calibration-null
  - q-C22
  sections:
  - id: speed
    title: Faster within a session; on the strategic tier the gain mostly resets by the next
    text: Median net decision time through each session, by pair of minutes (the toggle switches to every minute,
      thirds, or the first two vs last two minutes that the numbers below quote). On the strategic tier decisions
      get much faster through a session (11.6 → 6.9 s in session 1) and then start nearly as slow again (10.6 s),
      before speeding up once more (5.8 s). The model keeps about half of the gain across the break, but uncertainly.
      On the tactical tier the first session's speed-up is weaker and session 2 starts about where session 1 ended,
      then speeds up again. Holding the number of waiting missions fixed does not remove the within-session speed-up,
      so it is not just time pressure from a longer queue.
    how: '<b>Net time</b> = seconds to decide minus the forced wait (the card reveal for card choices; 1 s per entry
      for Suggest plans). Bars: medians of all decisions made in minutes 1–2 and 7–8 of each session, with 95% intervals
      from resampling people. <b>Model</b>: Gaussian GEE on log net time, clustered on person, with minute of session,
      session 2 and their interaction, plus route and mission size; game held fixed. From it: the end of session
      1, and the start and end of session 2, each relative to the start of session 1, and the start of session 2
      relative to the end of session 1 (a positive value = slower again after the break). A log-scale coefficient
      converts to "% faster". The start of a session is also the start of a game (first missions, short queue),
      so part of a within-session speed-up may be the session''s own rhythm rather than learning.'
    chart: handover.learnFine
    numbers:
    - 'Strategic, medians: session 1 minutes 1–2 11.6 s [7.8, 14.5] → minutes 7–8 6.9 s [4.9, 10.2]; session 2 10.6
      s [7.0, 13.5] → 5.8 s [5.0, 7.6]'
    - 'Strategic, model: end of session 1 −39% [−51, −24]; start of session 2 −20% [−37, +2], p = .07; start of
      session 2 vs end of session 1 +31% [0, +72], p = .053 (slower again)'
    - 'Tactical, medians: 18.0 s [14.0, 30.9] → 12.9 s [10.1, 19.2]; session 2 15.5 s [11.3, 21.9] → 8.0 s [5.6,
      9.6]'
    - 'Tactical, model: end of session 1 −24% [−45, +4], p = .09; start of session 2 vs end of session 1 +2% [−33,
      +56], p = .92; session 2 slope −7% per minute vs −4% in session 1 (difference p = .26)'
    - 'Within-session slope with the queue held fixed: strategic −6% per minute, tactical −8% per minute (both p
      < .001)'
    - 'Overall (unchanged): strategic −5.7% per minute [−7.8, −3.6], session 2 vs 1 −19% [−30, −6]; tactical −5.7%
      per minute [−9.1, −2.2], session 2 vs 1 −24% [−36, −9]'
