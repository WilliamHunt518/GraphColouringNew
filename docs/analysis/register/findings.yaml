  - id: pt-whole-board
    title: 'How they played: for the whole board, not the mission'
    tier: main
    text: 'Five minutes in, P36 states the aim as throughput across every task while watching the reserve ("running
      a little bit low on blue"), and later gives the reason: "success is generated across all of the tasks rather
      than just an individual task". The two passages make one point, so they share it. This is the cross-mission
      view operators said the cards lack, and it fits the cohort''s hand builds, which mostly sit at or below the
      cards.'
    qual:
      summary: ''
