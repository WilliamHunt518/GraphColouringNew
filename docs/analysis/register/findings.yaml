  - id: old-chart
    title: 'The old chart: why n moved, the +8 dip and the never-said 100% dots'
    text: The old chart was drawn correctly from what it computed, but what it computed was confusing. Its x position
      counted <i>every</i> decision after the card, and only three-type ones were then kept for the rate. So a person
      appeared at +2 only if their 2nd decision after the card happened to be three-type. That is why n went up
      and down (4–16), why 0 never appeared (the card's own decision is never three-type), and why 'three-type 100%'
      showed on every dot (true by construction). <b>The +8 dip</b> is 22 decisions, one per person, where 50% took
      a card against 67% expected. The 11 who declined are 11 different people. Mission size there is ordinary (10.3
      drones vs 10.2), with slightly more session starts (14% vs 6%). The same people took cards on 67% of their
      other later three-type decisions. Measured as a surprise score it is z = −1.5. Two of the 33 old dots fall
      outside ±1.96, where about 1.7 would by chance. It is noise, and it disappears in the binned view. <b>The
      never-said 100% dots at +2/+3</b> are 13 decisions from 11 people who all took a card where 66% was expected.
      That is unusual taken alone (about 0.2%), but it is the most extreme of 33 dots. They came at busy moments
      (3.1 missions waiting against about 1.9 usually), when people tend to hand over (C11). The never-said group
      are also the higher-reliance people (73% overall). The rebuilt chart has no 100% dots.
    how: Each old dot was reproduced exactly from extras2.event_study (checked against extras2.json). Surprise score
      z = (takes − expected takes) ÷ √Σ p(1−p) over the dot's decisions. The +8 rows were listed one by one and
      compared with the same people's other later three-type decisions.
    chart: flaw.oldDots
    numbers:
    - '+8: n 22, 50% took vs 67% expected, z = −1.5 (never-said dot); declines spread over 11 people; same people
      elsewhere 67%'
    - 'Old dots beyond |z| 1.96: 2 of 33 (1.7 expected)'
    - 'Never-said +2/+3: 13 of 13 took a card; expected 66%; queue 3.1'
