      against the change in Suggest use, both game-adjusted (n = 33). Checked: the within-person link holds without
      game adjustment (ρ = .56), and points the same way whichever scenario came first (ρ = .47, p = .058 with Strategic
      Heavy first, n = 17; ρ = .63, p = .010 with Tactical Heavy first, n = 16).'
