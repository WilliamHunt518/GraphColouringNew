  numbers:
    - 23 wrong refusals, 14 operators, 17 failures
    - 9 failures (8 operators) abandoned, median 4 s after the press; 8 fixed by hand
    - Verified frame by frame — P19 session 1, M003
  confidence: moderate
  lineage: [H3 corrected, extras flaws, extras2 blindAbandons, T8, T9]
  sources: [scripts/analysis_round1/h3_recovery.py, scripts/analysis_combined/extras2.py]
