- group: Job size and speed
  id: size-decides
  kind: finding
  title: "Job size decides when to hand over, on both tiers"
  claim: "Within a person, small jobs are done by hand and big ones go to the assistant. The apparent scenario difference is this in disguise — Strategic Heavy serves more small missions."
  numbers:
    - Card taken on 52% of single-type vs 72% of three-type missions
    - Each extra drone type ×1.63 odds (within person); three-type OR 1.84
    - Tactical Suggest ×2.57 per ~2.7-fold increase in plan size (p < .0001)
  confidence: strong
  lineage: [R2-2, T2, H9 exploratory]
  sources: [scripts/analysis_round2/wB_load.py]
  chart: sizeUptake
  links:
    - {to: speed-big-jobs, why: 'the rule matches where the assistant saves time'}
    - {to: q-C03, why: 'operators state this rule'}
    - {to: learn-calibration-null, why: 'the rule does not sharpen with practice'}
    - {to: load-pick-small, why: 'under a long queue operators pick small jobs — which they do by hand'}
  thoughts: "The clearest place where words and logs line up. Could anchor the paper: reliance is a sensible, size-based rule applied with a personal threshold (style-trait)."

- group: Job size and speed
  id: speed-big-jobs
  kind: finding
  title: "The assistant is faster — but only on big jobs"
  claim: "Taking a card is much faster than building by hand on three-type missions and not on single-type ones, where deciding before the cards load is quickest."
  numbers:
    - Card saves ~7.2 s net of the forced reveal on three-type missions only (card × three-type interaction)
    - Median decision 16.7 s manual vs ~11 s card on three-type; ~10 s either way on single-type
  confidence: strong
  lineage: [R2-3, H9 exploratory, T3]
  sources: [scripts/analysis_round2/wC_analysis.py]
  chart: timingBars
  links:
    - {to: size-decides, why: 'explains why the size rule is sensible'}
    - {to: q-C04, why: 'speed is what operators value'}
    - {to: q-C06, why: 'and some found it slow — on small jobs'}
  thoughts: "Strongest statistic in round 2. Makes the assistant's value a time/throughput story, which connects to the payoff results."

- group: Job size and speed
