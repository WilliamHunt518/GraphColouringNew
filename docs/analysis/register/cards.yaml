# Findings register — the source of truth for the review page (Results/findings_review.html).
#
# One card per distinct claim. Duplicates across rounds are merged into one card; `lineage` records
# every round-1 hypothesis (H*), round-2 finding (R2-*), combined-page theme (T*) or follow-up
# (extras / extras2) it absorbed, so nothing is dropped silently.
#
# Fields
#   id          stable slug; links and responses key on it -- never rename, retire instead (status)
#   group       review area (order of first appearance = order on the page)
#   kind        finding | null | qual | observation | method
#   title       the claim in a few words
#   claim       one to three sentences, plain
#   numbers     the figures that carry it
#   confidence  strong | moderate | suggestive | null | n/a   (the analysis' own label, not yours)
#   lineage     where it came from
#   sources     scripts / docs that hold the detail
#   chart       key of a chart drawn on the page from the combined payload (scripts/register/review_template.html)
#   codes       qualitative codes whose evidence excerpts the card shows
#   links       suggested links to other cards, each with a reason -- yours are recorded separately
#   thoughts    Claude's reading: what it might mean, doubts, what would strengthen or kill it
#   status      active (default) | merged:<id> | retired  -- set between passes, never delete a card
#
# Built 2026-10-08 from rounds 1-2, the qualitative coding and the combined-page follow-ups.

pass: 2

cards:

# ════════════════════════════════════════════════════════════════════════════════════════════
- group: Who the operator is
  id: style-trait
  kind: finding
  title: "Reliance is a stable personal trait"
  claim: "How much an operator takes the assistants' advice is mostly about who they are. Each person's card uptake carries over from session 1 to session 2 even though the scenario changes."
  numbers:
    - Card uptake ranges 8%–100% across operators
    - Session 1 vs 2 ρ = .64
    - Person explains ~24% of whether a card is taken; mission, scenario and timing together ~4%
  confidence: strong
  lineage: [H1, T1, round 1 trait]
  sources: [scripts/analysis_round1/h1_archetypes.py, docs/analysis/round1/h1_archetypes.md]
  chart: uptakeSlopes
  links:
    - {to: style-axis, why: 'the trait is one axis spanning three tiers'}
    - {to: style-fingerprint, why: 'there is more to style than this one number'}
    - {to: style-disposition-null, why: 'and nothing measured beforehand predicts it'}
    - {to: learn-calibration-null, why: 'practice does not move it either'}
  thoughts: "The single most robust result. Worth asking what a 24% person share means against the literature on automation reliance — it is large. The open question is what the trait IS (a speed preference? a verification habit? confidence?), since dispositions do not predict it."

- group: Who the operator is
  id: style-axis
  kind: finding
  title: "One reliance axis spans all three tiers"
  claim: "Taking strategy cards, previewing them, pressing Suggest on tactical plans and in recovery all load on a single direction; going manual early and deliberating longer load against it."
  numbers:
    - PC1 = 31% of variation between sessions
    - Loadings — took card .92, previewed .88, consulted tactical .62, recovery Suggest .46, manual before cards −.34, decision time −.48
    - PC1 session 1 vs 2 ρ = .65
  confidence: strong
  lineage: [H1, round 1 trait]
  sources: [scripts/analysis_round1/h1_archetypes.py]
  chart: pcLoadings
  links:
    - {to: style-trait, why: 'the axis is the trait'}
    - {to: rec-low-reliance-attempt, why: 'recovery attempts follow the same axis'}
    - {to: tier-trust-gap, why: 'strategic and tactical reliance are only loosely linked despite one axis'}
  thoughts: "Strategic and tactical reliance share an axis but the habit correlations between them are loose (theme 1 view 2). A paper could frame this as \"general reliance\" vs \"tier-specific reliance\"."

- group: Who the operator is
  id: style-types-null
  kind: 'null'
  title: "No distinct operator types (clustering)"
  claim: "Behaviour does not fall into groups. One group fits about as well as two, and groupings found in session 1 do not recur in session 2."
  numbers:
    - ΔBIC 1.9 for two groups (needed > 10)
    - Group stability Jaccard .76 / .47
    - Session 1 vs 2 grouping agreement ARI .04
  confidence: 'null'
  lineage: [H1]
  sources: [docs/analysis/round1/h1_archetypes.md]
  chart: h1Tiles
  links:
    - {to: style-archetypes, why: 'archetypes were the gentler attempt at types'}
    - {to: style-fingerprint, why: 'individuals are distinct even though groups are not'}
  thoughts: "A clean, publishable null. Pairs naturally with the fingerprint result — \"individuals, not types\"."

- group: Who the operator is
  id: style-fingerprint
  kind: finding
  title: "A personal style beyond reliance (fingerprint)"
  claim: "From ten habits alone, an operator's session-1 profile picks out their own session 2 among 33 far more often than chance — and still does with the reliance axis removed."
  numbers:
    - Nearest match is the same person 7 of 33 (5 the other way); chance ≈ 1; p < .001
    - Reliance axis removed — 6 of 33, p < .001
    - Reliance alone — 4 of 33
  confidence: moderate
  lineage: [T1, extras fingerprint]
  sources: [scripts/analysis_combined/extras.py]
  chart: fingerprintRanks
  links:
    - {to: style-retest, why: 'which habits carry the fingerprint'}
    - {to: style-types-null, why: 'distinct individuals without types'}
  thoughts: "Exploratory and post hoc, but the permutation test is clean. 7/33 is still mostly \"near neighbour\", not identification. Would strengthen with a third session."

- group: Who the operator is
  id: style-retest
  kind: finding
  title: "Which habits are stable session to session"
  claim: "Per-habit test–retest correlations, game-adjusted. The strongest habits separate operators into reliable high and low from one 8-minute session, roughly three levels from two sessions."
  numbers:
    - See chart for ρ per habit with bootstrap intervals; Holm-corrected survivors listed on the combined page
  confidence: moderate
  lineage: [extras fingerprint retest]
  sources: [scripts/analysis_combined/extras.py]
  chart: retestBars
  links:
    - {to: style-preempt-trait, why: 'pre-empting is one of the stable habits'}
    - {to: style-fingerprint, why: 'these habits make up the fingerprint'}
  thoughts: "Useful as a measurement result in its own right — which logged behaviours are trait-like enough to use as individual-difference measures in future studies."

- group: Who the operator is
  id: style-archetypes
  kind: 'null'
  title: "Three archetypes — names for directions, not types"
  claim: "Archetypal analysis finds three extreme styles (Delegator, Deliberate builder, Fast tinkerer), but a simulated continuum with the same habits, correlations and stability produces the same amount of \"type-ness\". Only the shape of the two clearest profiles reproduces across sessions better than the continuum."
  numbers:
    - Variation explained 46% vs continuum 50% (p = .83)
    - Near-pure members 11 vs 11; same archetype both sessions 61% vs 53% (p = .32)
    - Profile reproducibility r .96 / .88 vs .73 / .56 (p .01 / .015; not Holm-surviving)
    - Archetype shares predicted by PC1 + PC2 at R² .86–.96
  confidence: 'null'
  lineage: [T1, extras types, extras2 archNull]
  sources: [scripts/analysis_combined/extras.py, scripts/analysis_combined/extras2.py]
  chart: archNull
  links:
    - {to: style-types-null, why: 'same conclusion by a different route'}
    - {to: style-axis, why: 'archetypes are re-descriptions of PC1 + PC2'}
  thoughts: "Probably a figure-worthy illustration but not a finding. If kept, present the two axes (reliance; override vs accept) and use the archetype names only as labels for their ends."

- group: Who the operator is
  id: style-preempt-trait
  kind: finding
  title: "Deciding before the cards load is a personal trait"
  claim: "Whether someone goes manual before the strategy cards have loaded is mostly about who they are."
  numbers:
    - Session 1 vs 2 ρ = .56
    - About a quarter of the variation belongs to the person, ~5% to the mission
    - 15 of 33 never did it; 47% of all manual choices were pre-emptive
  confidence: strong
  lineage: [R2-1, F4.3]
  sources: [scripts/analysis_round2/wF_cards.py]
  chart: preemptBars
  links:
    - {to: manual-preempt, why: 'the same behaviour seen as part of "manual"'}
    - {to: style-trait, why: 'a component of the reliance trait'}
  thoughts: "Survived round 2's false-discovery correction (q = .035). Pre-empting is the clearest \"I don't wait for advice\" behaviour; worth asking whether it reflects speed-seeking or distrust — single-type missions dominate it."

- group: Who the operator is
  id: style-disposition-null
  kind: 'null'
  title: "Attitudes to AI and experience do not predict reliance"
  claim: "Forty tests of AI attitude (AIAS-4), verification propensity, delegation views and prior experience against reliance and trust — none survives correction."
  numbers:
    - AIAS-4 OR 0.80 per SD for card-taking [0.50, 1.27]; detectable only at OR ≈ 2
    - 0 of 40 tests survive Holm; 3 nominal
    - AIAS-4 averages 8.0 / 10 — a ceiling
  confidence: 'null'
  lineage: [H7, T1, synthesis disposition]
  sources: [docs/analysis/round1/h7_disposition.md]
  chart: dispositionTiles
  links:
    - {to: style-trait, why: 'the trait exists but is not predicted by self-report'}
    - {to: ask-views-null, why: 'stated views about AI authority also predict nothing'}
  thoughts: "A sample problem as much as a finding — almost no AI sceptics, nearly all STEM. Frame as \"within an AI-positive sample, disposition does not explain the large individual differences\"."

- group: Who the operator is
  id: style-trust-link
  kind: finding
  title: "Reliance tracks trust between people, not within"
  claim: "Operators who rely more report higher strategic trust, but a person's trust going up or down between sessions does not go with their reliance changing."
  numbers:
    - Reliance trait vs strategic trust ρ = .54 between people
    - Within person — no link; tactical trust likewise tracks behaviour between people only
  confidence: moderate
  lineage: [H1, R2 D nulls]
  sources: [docs/analysis/round2/wD_trust.md]
  chart: null
  links:
    - {to: trust-not-lead, why: 'same decoupling seen from the trust side'}
    - {to: pay-between-within, why: 'the same between-vs-within split as performance'}
  thoughts: "The between/within split recurs (trust, performance). Possibly a general point for the paper — trait-level associations that do not hold as states."

- group: Who the operator is
