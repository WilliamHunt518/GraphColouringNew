- group: Load and queues
  id: load-null
  kind: 'null'
  title: "Momentary workload does not push people onto the assistant"
  claim: "A fuller queue at the moment of decision does not raise card-taking — a well-powered null that holds across ~20 load measures, the final 90 s, the tactical tier, and moments of spoken overload."
  numbers:
    - OR 1.04 per extra queued mission [0.94, 1.14]; could detect ×1.14
    - Five other load measures, ORs 0.93–1.10; queue × plan size OR 0.99
    - Spoken overload — queue no higher than at random speech (p = .87)
  confidence: 'null'
  lineage: [H9, R2 B, T4]
  sources: [docs/analysis/round1/h9_workload_speed.md, docs/analysis/round2/wB_load.md]
  chart: queueBins
  links:
    - {to: q-C11, why: 'the account operators give says the opposite'}
    - {to: load-pick-small, why: 'what busy operators do instead'}
    - {to: size-decides, why: 'job size is the likely real driver'}
  thoughts: "One of the paper's strongest messages may be this null set against the debrief account. Make sure the power statement travels with it."

- group: Load and queues
  id: load-backlog-practice
  kind: method
  title: "Suggest rising with backlog is practice, not pressure"
  claim: "Tactical Suggest use rises when a strategic backlog is waiting, but not once time in the session is held fixed."
  numbers:
    - "OR 1.20 (q = .04) → q = .33 with time-in-session"
  confidence: 'null'
  lineage: [R2 B note]
  sources: [docs/analysis/round2/wB_load.md]
  chart: null
  links:
    - {to: learn-speed, why: 'practice is the confound'}
    - {to: load-null, why: 'removes the one apparent exception'}
  thoughts: "A methods point — any load measure correlated with time-in-session needs time held fixed."

- group: Load and queues
  id: load-deep-queue
  kind: 'null'
  title: "Deep queues (4+ waiting) do not raise reliance either"
  claim: "17% of strategic decisions were made with four or more other missions waiting, by 25 of 33 operators. Comparing each operator with themselves, a deep queue raises reliance on neither tier; between people the sign flips (manual operators accumulate their own queues)."
  numbers:
    - Strategic within-person OR 1.13 [0.69, 1.86] p = .62; tactical 1.38 [0.79, 2.40] p = .26
    - Between people — less reliance with more deep-queue time (strategic p = .068, tactical p = .010)
  confidence: 'null'
  lineage: [extras deepQueue, T4]
  sources: [scripts/analysis_combined/extras.py]
  chart: null
  links:
    - {to: load-null, why: 'the same null at the extreme'}
    - {to: load-pick-small, why: 'the raw dip is explained by what gets picked'}
  thoughts: "The between-person reversal is a nice illustration of why within-person tests matter here."

- group: Load and queues
  id: load-visible
  kind: observation
  title: "What the operator can see of the queue"
  claim: "The queue column shows three full cards (four in a taller window). While a strategic decision is open, the strategy panel expands inside that column and leaves at most one other waiting mission visible; the map still shows all of them."
  numbers:
    - "Read off recordings P19, P30"
  confidence: n/a
  lineage: [extras2 theme 4]
  sources: [Results/img/queue_at_rest.jpg, Results/img/queue_decision_open.jpg]
  chart: queueImages
  links:
    - {to: load-pick-small, why: 'beyond what the list shows, operators pick off the map'}
    - {to: load-null, why: 'no effect even past the visible limit (hinge model)'}
  thoughts: "An interface detail with a design implication — the decision panel hides the backlog at the moment of decision. Possibly why queue length has so little effect."

- group: Load and queues
  id: load-pick-small
  kind: finding
  title: "Busy operators change what they work on, not how"
  claim: "With more than three missions waiting, operators stop working in order and pick smaller missions, often by hand before the cards load. That makes raw card uptake fall as queues lengthen; holding mission, time and person fixed, the queue has no effect."
  numbers:
    - Open the oldest waiting mission 32% (vs 71%); one in the top 3 of the list 54% (vs 97%)
    - Opened mission needs 7.2 drones (vs 8.7); decided before cards load 25% (vs 14%)
    - Adjusted uptake 59–74% across queue depths with no trend; within-person queue OR ~1.0 in every model
  confidence: moderate
  lineage: [extras2 deepQueue2, T4]
  sources: [scripts/analysis_combined/extras2.py]
  chart: queuePick
  links:
    - {to: size-decides, why: 'they pick the jobs they do by hand anyway'}
    - {to: load-visible, why: 'picking beyond the list happens off the map'}
    - {to: style-preempt-trait, why: 'pre-empting rises with long queues'}
  thoughts: "Exploratory (asked after seeing the raw dip). A clean story, but the \"picking\" mechanism would need a confirmatory test — e.g. do operators preferentially open single-type missions when the queue is long, against what was waiting?"

- group: Load and queues
  id: q-C11
  kind: qual
  title: "Said: hands over when overloaded"
  claim: "Operators said they lean on the assistant more when busy, overwhelmed or rushed."
  numbers:
    - "9 of 33, all unprompted"
  confidence: n/a
  lineage: [qual C11, T4]
