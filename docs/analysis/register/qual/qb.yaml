sections:
  "f-flaw-odd#event":
    summary: "12 of 33 said in the debrief or interview that the strategy cards over-allocated or sent unneeded types (C12), and 12 commented on it during play (7 strictly about a card sending an unneeded type). The first sight is often puzzlement rather than a verdict ('unless I'm missing something', 'do fast drones have a higher chance of failing?'), and some took the card anyway (P04) or noticed only after taking it (P20, P29). Dissent: P10 decided the redundancy was sensible; P27 was not sure it was a fault."
    featured: [qb-P19-01, qb-P17-01, ev122, qb-P04-01]
    more: [qb-P30-01, qb-P35-01, qb-P03-01, qb-P13-02, ev121, ev127, ev64, qb-P20-01, qb-P01-01, qb-P27-01]
    codes: [C12]
  "f-flaw-odd#over-time":
