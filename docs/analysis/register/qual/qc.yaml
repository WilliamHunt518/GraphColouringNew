# Quote analyst "qc": the discussion finding f-operator-wants (everything said that fits no other main section).
# Sources read in full: all 26 debrief.txt, all 17 interview .docx, every quotes.json, and the in-play think-aloud
# (session1, session2, survey1, between1, survey2 segments) for all 30 people with recordings. P09 excluded, PIL03 not used.
# Time stamps: debrief/think-aloud = video time into <PID>.mp4; "s1"/"s2" = game session 1/2, "survey1"/"survey2"/"between1"
# = the survey or break that followed. Interview "para N" = 0-based non-empty paragraph (as in evidence.csv).
quotes:
  # ---- real-world use, human final say, accountability --------------------------------------------------------
  - id: qc-P22-01
    pid: P22
    source: debrief
    at: "0:31:52"
    led: 0
    paraphrase: false
    text: "it's better to save the five sub-optimally than it is to save no one, essentially. […] you always feel uncomfortable taking it out of the hands of a person and saying who is then responsible for this"
    codes: [C25]
    context: "Answering the closing 'five years from now, real search and rescue' question."
  - id: qc-P31-01
    pid: P31
    source: debrief
    at: "0:28:17"
    led: 0
    paraphrase: false
    text: "under a completely human system, you'd have some sort of like, […] Accountability […] whereas if it's an AI system, even if it performs on average better than a human, that accountability just isn't there."
    codes: []
    context: "The researcher supplied the word 'accountability' when P31 searched for it. Coded 0 for C25: P31 also says the human need not be making the decisions."
  - id: qc-P31-02
    pid: P31
    source: debrief
    at: "0:34:06"
    led: 0
    paraphrase: false
    text: "doing more research in this field will inevitably lead to it being used in military."
    codes: []
    context: "The one thing they wanted to add at the end, unprompted."
  - id: qc-P24-01
    pid: P24
    source: debrief
    at: "0:31:19"
    led: 1
    paraphrase: false
    text: "even though human cannot check it, like really, I think it's fine, maybe. Yes. But it should have a human stand here."
    codes: [C25]
    context: "Researcher had asked: 'Do you worry that a human might not be able to check it because it's so much work?'"
  - id: qc-P03-01
    pid: P03
    source: interview
    at: "para 11"
    led: 0
    paraphrase: false
    text: "If you understand the best way to do it, the failure modes, and the stakes are low, then AI should do it"
    codes: []
  - id: qc-P05-01
    pid: P05
    source: interview
    at: "para 13"
    led: 0
    paraphrase: true
    text: "Automate the levels you can understand, otherwise you are at the mercy of it when it fails"
    codes: [C25]
  - id: qc-P36-01
    pid: P36
    source: think-aloud
    at: "s2 0:19:03"
    led: 0
    paraphrase: false
    text: "somebody is checking my thinking and has the option to challenge me so with AI it should always be open to challenge but also trust in the fact it's done the maths behind it"
    codes: [C25]
    context: "Consulted expert (serving officer), comparing the assistants with a military planning staff."
  - id: qc-P36-02
    pid: P36
    source: debrief
    at: "0:37:08"
    led: 0
    paraphrase: false
    text: "one of the risks with AI presents an ill-considered or the wrong answer with a level of confidence and you look at it and you go yeah that looks right but there's a massive hole in that plan"
    codes: [C26]
  - id: qc-P36-03
    pid: P36
    source: debrief
    at: "0:37:08"
    led: 0
    paraphrase: false
    text: "then you get a really good plan quickly or a really bad plan quickly and that will scale at pace"
    codes: []
  - id: qc-P24-02
    pid: P24
    source: debrief
    at: "0:29:06"
    led: 0
    paraphrase: false
    text: "sometimes even though people are smart to some extent, but we cannot multitask and make decisions really fast, especially in a very emergency situation. So I think we should use AI to help us."
    codes: []
  - id: qc-P29-01
    pid: P29
    source: debrief
    at: "0:27:36"
    led: 0
    paraphrase: false
    text: "it's best to just get something like going, even if it's not like the most perfect plan."
    codes: []
  - id: qc-P32-01
    pid: P32
    source: debrief
    at: "0:26:33"
    led: 0
    paraphrase: false
    text: "if you've got loads of spare humans, I'd want to see if the AI was actually better. But assuming that you've got less humans than you ideally would have, it feels like a good accelerator."
    codes: []
  - id: qc-P34-01
    pid: P34
    source: interview
    at: "para 6"
    led: 0
    paraphrase: false
    text: "It’s important to have a lot of AI in search and rescue"
    codes: []
  - id: qc-P20-01
    pid: P20
    source: debrief
    at: "0:32:15"
    led: 0
    paraphrase: false
    text: "If it's well regulated, I don't see any problem with it in principle."
    codes: []
  - id: qc-P30-01
    pid: P30
    source: debrief
    at: "0:25:08"
    led: 0
    paraphrase: false
    text: "having something like this that could essentially respond to a situation very quickly very easily i think that'll be that'll be good"
    codes: []
    context: "Thinking of wildfires."
  - id: qc-P15-01
    pid: P15
    source: interview
    at: "para 6"
    led: 0
    paraphrase: true
    text: "Good application for AI, but it’s not good enough"
    codes: []

  # ---- wanting reasoning / to know how it works -----------------------------------------------------------------
  - id: qc-P13-01
    pid: P13
    source: debrief
    at: "0:29:32"
    led: 0
    paraphrase: false
    text: "The aggressive, I don't know what the, I couldn't make out what the reasoning is behind that."
    codes: [C26]
