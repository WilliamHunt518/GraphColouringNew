  - id: qc-P19-01
    pid: P19
    source: think-aloud
    at: "survey1 0:17:59"
    led: 0
    paraphrase: false
    text: "I noticed it because the display is straightforward and it's clear enough that you can as a human spot. Discrepancies if they arise."
    codes: [C12]
    context: "Dissent: the strategic card needed no explanation; its error was visible on the card."
  - id: qc-P22-05
    pid: P22
    source: think-aloud
    at: "survey1 0:15:56"
    led: 0
    paraphrase: false
    text: "I wonder if it's one of those things that these are based on the fact that I actually can't perceive the difference between its performance and the optimal."
    codes: [C14]
    context: "Explaining why they rated the Tactical Assistant highly."

  # ---- failure risk, analytics, feedback ------------------------------------------------------------------------
  - id: qc-P11-01
    pid: P11
    source: think-aloud
    at: "survey1 0:12:38"
    led: 0
    paraphrase: false
    text: "I don't know very well how often they fail and things, so how much I should care that it's unreliable or doesn't have much reserve."
    codes: [C27]
  - id: qc-P11-02
    pid: P11
    source: think-aloud
    at: "s2 0:20:23"
    led: 0
    paraphrase: false
    text: "I guess a useful, maybe a useful thing for the agent to tell me, it's like, if it could rate how likely things are to fail."
    codes: [C27]
  - id: qc-P13-03
    pid: P13
    source: think-aloud
    at: "s2 0:18:18"
    led: 0
    paraphrase: false
    text: "I'm just making blind decisions at this point without necessary data."
    codes: [C27]
    context: "After asking the researcher what the probability of drone failure is."
  - id: qc-P13-04
    pid: P13
    source: debrief
    at: "0:23:50"
    led: 0
    paraphrase: false
    text: "with enough data points, you can make calculated decisions."
    codes: [C27]
  - id: qc-P25-02
    pid: P25
    source: think-aloud
    at: "survey2 0:21:53"
    led: 0
    paraphrase: false
    text: "I also want to read and do we have any explanation when a task will failed?"
    codes: [C27, C26]
  - id: qc-P19-02
    pid: P19
    source: debrief
    at: "0:29:21"
    led: 0
    paraphrase: false
    text: "probably is fair to say that different tasks seem to have different failure rates."
    codes: []
    context: "A misreading: drone failure was a flat random rate, not tied to task or place."
  - id: qc-P01-02
    pid: P01
    source: think-aloud
    at: "s2 0:23:06"
    led: 0
    paraphrase: false
    text: "Is the drone failure rate just like cranked up to a max here? It feels like every other mission all of the fast drones keep failing."
    codes: []
    context: "The failure rate did not change between sessions."
  - id: qc-P36-04
    pid: P36
    source: debrief
    at: "0:32:24"
    led: 0
    paraphrase: false
    text: "we look at the failure 40% failure chance […] no chance it's like okay but if you put a person into that scenario and it was all people doing it your failure chance would be this as well"
    codes: [C27]
    context: "Failure data would need context, or operators will refuse any risk."
  - id: qc-P36-05
    pid: P36
    source: debrief
    at: "0:32:50"
    led: 0
    paraphrase: false
    text: "the failure rate of doing nothing is 100% so you've got to do something"
    codes: []
  - id: qc-P10-01
    pid: P10
    source: think-aloud
    at: "s1 0:06:30"
    led: 0
    paraphrase: false
    text: "So I'm looking at the score right now. And I have no bloody clue. Is minus 150, is that good? Is that bad? What does that mean?"
    codes: []
  - id: qc-P29-02
    pid: P29
    source: think-aloud
    at: "survey1 0:12:13"
    led: 0
    paraphrase: false
    text: "I feel like it's hard to tell, like, how well I've done."
    codes: []
  - id: qc-P32-02
    pid: P32
    source: think-aloud
    at: "s2 0:20:16"
    led: 0
    paraphrase: false
    text: "Is that a good score? It's hard to judge."
    codes: []

  # ---- more automation, new jobs for an assistant ---------------------------------------------------------------
  - id: qc-P32-03
    pid: P32
    source: think-aloud
    at: "s1 0:07:26"
    led: 0
    paraphrase: false
    text: "Actually, it would be helpful if it just picked the next mission for me. A suggestion of what to do next would be handy."
    codes: [C28]
    context: "Same ask as P27's queue ordering: neither assistant helps choose which mission to open."
  - id: qc-P32-04
    pid: P32
    source: think-aloud
    at: "s2 0:18:27"
    led: 0
    paraphrase: false
    text: "I think if I was doing all of that manually. And there wasn't a suggest button, I would be of the opinion that it was a sort of thing a computer should be doing."
    codes: [C28]
  - id: qc-P11-03
    pid: P11
    source: think-aloud
    at: "s2 0:20:23"
    led: 0
    paraphrase: false
    text: "if I let the agent think for five seconds, it could have said, oh, dummy, you're missing a camera there, you misclicked. But, like, that's different from letting it take over completely, I suppose."
    codes: []
    context: "Wants the assistant to check their manual plan rather than make one."
  - id: qc-P27-01
    pid: P27
    source: debrief
    at: "0:29:36"
    led: 0
    paraphrase: false
    text: "I think, hey, I can just click the blue button to that mission. But the agent hasn't done that. So, could we do it together with a hybrid mode?"
    codes: [C06]
    context: "Wants to keep working on the tactical plan while Suggest fills in."
  - id: qc-P21-01
    pid: P21
    source: think-aloud
    at: "s2 0:23:58"
    led: 0
    paraphrase: false
    text: "So in case of failure, it doesn't redirect those drones to the other one, which is something I'd like to do."
    codes: [C13]
    context: "Wants the tactical plan to build in back-up routes."
  - id: qc-P30-02
    pid: P30
    source: debrief
    at: "0:25:08"
    led: 0
    paraphrase: false
    text: "if this was just more advanced it'd have a bit more anticipation of what's going to come up further i think that'll be good"
    codes: []
  - id: qc-P13-05
    pid: P13
    source: debrief
    at: "0:28:58"
    led: 0
    paraphrase: false
    text: "If your allocation algorithm could handle it a bit better, the end users could be anyone."
    codes: [C28]
  - id: qc-P36-06
    pid: P36
    source: think-aloud
    at: "s2 0:22:29"
    led: 0
    paraphrase: false
    text: "if I did all of that manually I would know all of that because I've built the plan I've got it in my head if I just said go nuts when something goes wrong I've got to play catch up"
    codes: []
    context: "Dissent: the cost of handing over is losing the plan in your head."
  - id: qc-P11-04
    pid: P11
    source: debrief
    at: "0:26:55"
    led: 0
    paraphrase: false
    text: "it would be a dreadful task without any of the tools, especially on the tactical side."
    codes: []

  # ---- what they thought the assistants were ----------------------------------------------------------------------
  - id: qc-P31-03
    pid: P31
    source: debrief
    at: "0:26:11"
    led: 0
    paraphrase: false
    text: "the fact that it's like quote-unquote AI, it very easily could have been just like a dozen lines of code that do a little bit of manual rules-based allocation"
    codes: []
  - id: qc-P19-03
    pid: P19
    source: think-aloud
    at: "s2 0:24:17"
    led: 0
    paraphrase: false
    text: "It doesn't even really feel like you're using an AI tool, […] It feels simply like, well, like some sort of... Just almost like a matching algorithm, trying to get your resources in the right place."
    codes: []
  - id: qc-P15-02
    pid: P15
    source: debrief
    at: "0:29:13"
    led: 0
    paraphrase: false
    text: "I think these applications is very good but the AI is a little bit stupid"
    codes: []
  - id: qc-P15-03
    pid: P15
    source: interview
    at: "para 7"
    led: 0
    paraphrase: true
    text: "AI felt like old computing, not modern AI"
    codes: []
  - id: qc-P32-05
    pid: P32
    source: think-aloud
    at: "s2 0:18:43"
    led: 0
    paraphrase: false
    text: "I am interested in whether it's like provably optimal, or if it's like a dodgy machine learning algorithm that's just sort of vibe allocating them. […] Like if there is a linear optimizer, I'm happy."
    codes: [C26]
  - id: qc-P04-01
    pid: P04
    source: debrief
    at: "0:25:16"
    led: 0
    paraphrase: false
    text: "I trust that they will get a solution that works. I don't really trust that it will be mathematically optimal."
    codes: []
  - id: qc-P04-02
    pid: P04
    source: interview
    at: "para 8"
    led: 0
    paraphrase: true
    text: "Algorithms should be deterministic wherever possible. Machine learning etc is more likely to make mistakes."
    codes: []
  - id: qc-P24-03
    pid: P24
    source: debrief
    at: "0:26:31"
    led: 0
    paraphrase: false
    text: "So when AI gives some suggestions of the numbers of the joints, did it consider the multi-task? Or just considered this one task? […] So actually, I need to consider myself."
    codes: [C07]
    context: "'joints' = drones (transcription). Asked after both sessions; the researcher confirmed the cards see only the one mission."
  - id: qc-P03-02
    pid: P03
    source: interview
    at: "para 8"
    led: 0
    paraphrase: true
    text: "Was hoping the AI would learn from what he is picking. It didn’t so as time went on they picked it less"
    codes: []
  - id: qc-P27-02
    pid: P27
    source: think-aloud
    at: "s2 0:21:06"
    led: 0
    paraphrase: false
    text: "Seems that the agent has some feature of prediction, right?"
    codes: []
    context: "Trying to explain why a card added drone types the mission did not need."
  - id: qc-P21-02
    pid: P21
    source: think-aloud
    at: "between1 0:20:45"
    led: 0
    paraphrase: false
    text: "when it tries to make the drone allocation, it follows certain patterns, which patterns could then be adopted by the tactical agent afterwards."
    codes: []
    context: "Plans to use the strategic card in session 2 because they assume the two tiers share a plan."
  - id: qc-P30-03
    pid: P30
    source: think-aloud
    at: "s2 0:12:13"
    led: 0
    paraphrase: false
    text: "i think this a lot of the ai suggestions on here it's just for um that specific sort of scenario rather than optimizing it for future"
    codes: [C07]
  - id: qc-P17-01
    pid: P17
    source: think-aloud
    at: "s1 0:07:58"
    led: 0
    paraphrase: false
    text: "Was that supposed to be a failure of AI?"
    codes: [C12]
    context: "On a card that added green and red drones to a mission that needed none."
  - id: qc-P27-03
    pid: P27
    source: think-aloud
    at: "s2 0:19:09"
    led: 0
    paraphrase: false
    text: "So, I'm not sure the reason is I didn't notice it or it's just maybe some bugs."
    codes: [C12]

  # ---- how the two tiers fit together ---------------------------------------------------------------------------
  - id: qc-P03-03
    pid: P03
    source: debrief
    at: "0:24:55"
    led: 0
    paraphrase: false
    text: "the routine of the strategies is what tactical is kind of like doing because if you have a good strategy then it's likely less to fail because you've already constrained everything"
    codes: []
  - id: qc-P19-05
    pid: P19
    source: think-aloud
    at: "survey1 0:19:20"
    led: 0
    paraphrase: false
    text: "And the only way to remedy drone failures is to have had sent enough drones at the beginning, which I think is the strategic assistant's prerogative."
    codes: []
  - id: qc-P36-07
    pid: P36
    source: think-aloud
    at: "between1 0:14:39"
    led: 0
    paraphrase: false
    text: "if you […] up the allocation at the start of it then you're screwed going into the tactical"
    codes: []
  - id: qc-P36-08
    pid: P36
    source: debrief
    at: "0:29:43"
    led: 0
    paraphrase: false
    text: "if you've not got the resources available to you at the low level then or you've over allocated resources at the high level then you're running out of resources cascade down"
    codes: []
  - id: qc-P30-04
    pid: P30
    source: debrief
    at: "0:25:40"
    led: 0
    paraphrase: false
    text: "i think it's it's much easier to then give it resources um and then allow it to then optimize it rather than choose its resources and then it optimizes"
    codes: [C25]
  - id: qc-P32-06
    pid: P32
    source: debrief
    at: "0:26:49"
    led: 0
    paraphrase: false
    text: "if I were being really strategic, I'd be saying, okay, people are going to do the strategic stuff, and we're just going to trust it for the tactical."
    codes: []
  - id: qc-P21-03
    pid: P21
    source: think-aloud
    at: "s1 0:14:38"
    led: 0
    paraphrase: false
    text: "When I make the selection for the drones, I kind of lay out a plan in my mind initially. So I feel like it's going to disrupt my thought process if I try to go around that."
    codes: [C01]
    context: "Why they build the tactical plan themself after a manual strategic allocation."
  - id: qc-P10-02
    pid: P10
    source: think-aloud
    at: "s1 0:05:34"
    led: 0
    paraphrase: false
    text: "For the aggressive approach, anything but suggestion doesn't really make sense, I think. Because it's a perfect fit between what I need and what I have."
    codes: []
  - id: qc-P36-09
    pid: P36
    source: debrief
    at: "0:30:56"
    led: 0
    paraphrase: false
    text: "I would say is human in the loop because you have to okay everything I'm still okaying the tasks that are out there"
    codes: [C25]
  - id: qc-P36-10
    pid: P36
    source: debrief
    at: "0:44:20"
    led: 0
    paraphrase: false
    text: "that's not your job your job is to do this thing over here and then there's other agents to do this thing over here"
    codes: []
    context: "On whether each assistant should see the wider context: no, each tier should stay in its lane."
  - id: qc-P12-01
    pid: P12
    source: interview
    at: "para 7"
    led: 0
    paraphrase: false
    text: "Intuitively, the strategic agent is probably more reliable as it’s a more trivial calculation whereas the tactical task is more complex"
    codes: []
  - id: qc-P33-02
    pid: P33
    source: debrief
    at: "0:28:46"
    led: 1
    paraphrase: false
    text: "So, do you think generally AI in the lower level of the tactical level makes more sense than the strategic? Yeah."
    codes: [C25]

  # ---- me or the assistant: who does better ---------------------------------------------------------------------
  - id: qc-P33-01
    pid: P33
    source: think-aloud
    at: "between1 0:16:40"
    led: 0
    paraphrase: false
    text: "They did it better than me. Absolutely. […] They're very fast. I can't figure it out in a very short time."
    codes: [C23, C04]
  - id: qc-P35-01
    pid: P35
    source: think-aloud
    at: "between1 0:16:58"
    led: 0
    paraphrase: false
    text: "I think sometimes I think the AI assistant is much more smarter than me."
    codes: []
  - id: qc-P35-02
    pid: P35
    source: debrief
    at: "0:28:19"
    led: 0
    paraphrase: false
    text: "if I have enough strong swarm, I can do enough and I have enough time, I can do better than AI assistant."
    codes: []
    context: "Conditional, so coded 0 for C24."
  - id: qc-P04-03
    pid: P04
    source: think-aloud
    at: "s2 0:18:27"
    led: 0
    paraphrase: false
    text: "For the most part, I don't trust the AI to be better than if I calculated it properly, […] but it's quicker, which is slightly easier."
    codes: [C04]
  - id: qc-P29-03
    pid: P29
    source: think-aloud
    at: "s1 0:10:34"
    led: 0
    paraphrase: false
    text: "I did, um, do some of them myself, and they didn't turn out as well, so I think, yeah, it probably does know a bit better than me."
    codes: [C23, C10]
