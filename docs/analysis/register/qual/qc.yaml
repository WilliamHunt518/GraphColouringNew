sections:
  "f-operator-wants#wants":
    summary: "Across the coded material, 9 of 33 said a human should keep the final say (8 unprompted), 6 wanted failure
      probabilities or performance data, 6 wanted options between the two cards, 5 wanted the assistant's reasoning and
      4 wanted more automation. Reading everything (including the in-play talk) raises the information asks: about 11
      asked or wondered how the assistants decided, and 8 asked for failure or performance numbers. The dissent is
      small but sharp: P11 does not want to be 'reduced to pressing allocate, suggest, deploy'. The mini sections below take each strand in turn."
    featured: [ev184, ev157, ev254, ev68]
    more: [ev13, ev22, ev142, ev152, ev155, ev168, ev205, ev246, ev247, ev6, ev61, ev88, ev156, ev158, ev252, ev253,
      ev43, ev44, ev62, ev66, ev67, ev214, ev226, ev227, ev69, ev70, ev171, ev172, ev206, ev207, ev215, ev216, ev30,
      ev86, ev91, ev137, ev178, ev179, ev249, ev250, ev47]
    codes: [C25, C26, C27, C28, C08]

new_sections:
  - id: real-world
    title: "Real search and rescue: welcome, with a human deciding"
    text: "What people said when asked how they would feel about systems like this in real search and rescue. 16 of 33 are quoted here (25
      answered the question); nobody rejected it, and the common condition was a human who keeps the final decision."
    summary: "Asked the closing 'five years from now' question, at least 14 welcomed the idea, nearly always for speed
      ('a bad approximation is better than no response at all'), and 9 said a human must keep the final decision (8
      unprompted). Conditions came with it: well regulated (P20), only where the job is understood and stakes low (P03,
      P05), only if better than today's AI (P15). Others raised a deeper worry: who is accountable when an AI fails to save
      someone (P31, P22), and military use of the research (P31). When pressed on whether a busy human could really check, P24 conceded they could not and still wanted one
      there."
    featured: [ev184, qc-P22-01, qc-P31-01, qc-P32-01]
    more: [ev13, ev22, ev142, ev152, ev155, ev168, ev205, ev246, ev247, qc-P24-01, qc-P03-01, qc-P05-01, qc-P31-02, qc-P24-02, qc-P29-01, qc-P34-01, qc-P20-01, qc-P30-01, qc-P15-01]
    codes: [C25]
    tier: main
    role: extra
  - id: reasoning
    title: "Wanting to know how the assistants decide"
    text: "Requests for the assistants' reasoning, and moments where people could not work out why a card or plan looked
      the way it did. 12 of 33 said something on this."
    summary: "5 of 33 asked outright for explanation, auditability or understandable tools (P02, P12, P16, P25, P36); 6
      more asked mid-play why a card looked as it did or said they could not tell (P01, P05, P06, P13, P25 in play, P32).
      P01 named the bind: more information to handle means relying more and trusting less. The requests point both ways:
      P05 found the strategic cards the hard ones to understand, while P19 found the card simple enough that its error
      was visible, and P22 said they trusted the tactical plan partly because they could not see how far from optimal it
      was. Nobody asked for an explanation of a single plan step; the asks were about how the assistant works in general."
    featured: [ev157, ev88, qc-P13-01, qc-P01-01]
    more: [ev6, ev61, ev156, ev158, ev252, ev253, qc-P13-02, qc-P25-01, qc-P05-02, qc-P06-01, qc-P19-01, qc-P22-05,
      qc-P32-05]
    codes: [C26]
    tier: main
    role: extra
  - id: failure-data
    title: "Failure risk and feedback: wanting the numbers"
    text: "Asks for drone-failure probabilities and for feedback on how well they (or the assistants) were doing, and
      misreadings of the random failures. 11 of 33 said something on this."
    summary: "8 of 33 asked for failure probabilities or performance data (P10, P11, P12, P13, P25, P31, P32, P36); P10,
      P11 and P13 independently wanted the risk tied to place, terrain or drone type and fed into the allocation. Without
      it, 2 read patterns into failures that were in fact flat and random (P19: some tasks fail more; P01: the rate was
      'cranked up'). 4 could not tell from the score how well they were doing (P10, P29, P31, P32)."
    featured: [ev254, ev66, qc-P11-02, ev214]
    more: [ev43, ev44, ev62, ev67, ev226, ev227, qc-P11-01, qc-P13-03, qc-P13-04, qc-P25-02, qc-P19-02, qc-P01-02, qc-P10-01, qc-P29-02, qc-P32-02]
    codes: [C27]
    tier: main
    role: extra
  - id: more-automation
    title: "More automation, and new jobs for an assistant"
    text: "Wishes for the assistants to do more, or to do a job neither of them does now, and the few voices against.
      8 of 33 said something on this."
    summary: "4 of 33 asked in general for more automation (P13, P27, P30, P31) and 4 more proposed a specific new job:
      choose which mission to open next (P32, and P27's feasibility-then-criticality ordering), check the operator's own
      plan for slips (P11), build back-up routes into the tactical plan (P21),
      re-route spares after a failure (P30) and look ahead to missions not yet arrived (P30). The common thread is help
      with what neither assistant touches: choosing what to work on, and failures. Against: P11 does not want to be
      reduced to clicking."
    featured: [ev68, qc-P32-03, qc-P11-03]
    more: [ev69, ev70, ev171, ev172, ev206, ev207, ev215, ev216, ev253, ev249, qc-P32-04, qc-P27-01, qc-P21-01, qc-P30-02,
      qc-P13-05, qc-P11-04, ev47]
    codes: [C28]
    tier: main
    role: extra
  - id: mental-models
    title: "What they thought the assistants were"
    text: "How people pictured the assistants: simple rules or 'AI', whether they learn, predict or see beyond one mission.
      13 of 33 said something on this."
    summary: "Two pictures sit side by side. 6 saw through to simple rules and judged them on that: 'a dozen lines of code'
      (P31), 'a matching algorithm' (P19), 'a little bit stupid', 'old computing' (P15), works but not optimal (P04);
      P32 and P04 said they would trust a provable optimiser over machine learning. Others credited the assistants with
      more than they had: P03 hoped it would learn from their choices, P27 thought it predicted, P13 wondered if it knew
      fast drones fail more, P21 assumed the two tiers share a plan. 2 noticed the cards look at one mission only (P24
      had to ask, P30). 2 more took the illogical card for a bug or a planted error (P17, P27)."
    featured: [qc-P31-03, qc-P19-03, qc-P32-05, qc-P24-03]
    more: [qc-P15-02, qc-P15-03, qc-P04-01, qc-P04-02, ev6, qc-P03-02, qc-P27-02, qc-P13-02, qc-P21-02, qc-P30-03,
      qc-P17-01, qc-P27-03]
    codes: [C26]
    tier: main
    role: extra
  - id: tiers-together
    title: "How the two tiers fit together"
    text: "Remarks on the hierarchy itself: which level a human should hold, and how a strategic choice carries into the
      tactical one. 10 of 33 said something on this."
    summary: "The shared view is that the strategic choice sets up everything below it: a good allocation makes the
      tactical stage hard to fail, and drone failures can only be absorbed by drones sent at the start (P03, P19, P36).
      Several said the human belongs at the strategic level and the assistant at the tactical one, 'give it resources and
      allow it to optimise' (P05, P30, P32, P33 when asked, P12 reasoning that the strategic sum is the easier one), and
      P10 found an Aggressive card leaves only one sensible tactical plan. The cross-current: P21 builds the tactical plan
      themself because their strategic choice already carries a plan in their head."
    featured: [qc-P03-03, qc-P30-04, qc-P32-06]
    more: [ev12, ev22, qc-P19-05, qc-P21-03, qc-P10-02, qc-P12-01, qc-P33-02]
    codes: [C25, C20]
    tier: main
    role: extra
  - id: me-vs-assistant
    title: "Me or the assistant: who does it better?"
    text: "Brought back from the sidelined 'who does better' finding: what people said about whether the assistant or
      they themselves got better results. 13 of 33 said something on this."
    summary: "Coded strictly, 3 of 33 said the assistant improved their results and none said they did better by hand.
      Read more widely, about 7 rated the assistant as good as or better than themselves (P06, P11, P24, P29, P31, P33,
      P35), nearly always because it was faster rather than wiser. 4 said they could do better given time or care (P04,
      P12, P17, P35) and P22 judged them about equal; P31 and P21 said they simply could not tell. Self-doubt shows
