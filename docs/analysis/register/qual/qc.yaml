    paraphrase: false
    text: "Why does it have a buffer of five fast drones? Do fast drones have a higher chance of failing?"
    codes: [C26, C12]
    context: "Looking at a strategy card. Researcher: 'I can't comment on exactly how the agent comes to its decisions at this stage.'"
  - id: qc-P01-01
    pid: P01
    source: think-aloud
    at: "survey1 0:14:24"
    led: 0
    paraphrase: false
    text: "just being more information makes me both simultaneously, like, have to rely more on the AI while also kind of trusting it less because I don't know what's going on as much."
    codes: [C26]
    context: "Rating the Tactical Assistant after session 1."
  - id: qc-P25-01
    pid: P25
    source: think-aloud
    at: "s1 0:07:21"
    led: 0
    paraphrase: false
    text: "So my question is, what kind of different algorithm behind this to the aggressive and the..."
    codes: [C26]
    context: "Mid-session; the researcher declined to explain until the end."
  - id: qc-P05-02
    pid: P05
    source: interview
    at: "para 3"
    led: 0
    paraphrase: true
    text: "It was better because it was easier to check (strat was harder to understand)"
    codes: []
    context: "About the Tactical Assistant: the strategic cards were the harder one to understand."
  - id: qc-P06-01
    pid: P06
    source: interview
    at: "para 1"
    led: 0
    paraphrase: true
    text: "Maybe less transparent, although as time went on, it became clear how it was working."
    codes: []
