gent_comparison/1737","pid":"P01","expert":false,"theme":"agent_comparison","at":1737,"text":"It's quite a straightforward task.","note":"His whole justification for high tactical reliance, given in answer to the researcher observing it. Tactical delegation needs no defence because the problem is seen as trivial -- the same 'nothing left to get wrong' logic P10 reaches from the other direction.","stance":"prefers_tactical"},{"id":"P01/scenario_comparison/1686","pid":"P01","expert":false,"theme":"scenario_comparison","at":1686,"text":"I was just getting crazy drone failure. It felt like I sent the same mission out like three times and had the exact same failure.","note":"Perceived failure clustering. Worth checking against his drone_failure events -- the hazard is a flat per-drone-second rate, so this may be a run of genuinely independent losses read as a pattern.","stance":""},{"id":"P01/real_world_transfer/1808","pid":"P01","expert":false,"theme":"real_world_transfer","at":1808,"text":"If it was a real task, I feel like I'd behave the same. That might not be a good thing if you're actually controlling real drones.","note":"Direct contrast with P36, who expects to be markedly less decisive when lives are at stake. P01 predicts no change and immediately flags that as a problem.","stance":""},{"id":"P03/agent_comparison/1413","pid":"P03","expert":false,"theme":"agent_comparison","at":1413,"text":"I think at this point, it's not all that much reliable to my liking as well. [...] Trust it? Not much.","note":"Flat statement of low trust, given while answering the trust survey items -- worth reading against his logged trust scores for the same moment.","stance":"distrusts_both"},{"id":"P03/agent_comparison/1422","pid":"P03","expert":false,"theme":"agent_comparison","at":1422,"text":"I would trust it for simple tasks like reconnaissance, routine tasks. I think it's able to get that right, but the critical one is the multiple scenario task, the more complex scenario.","note":"Trust conditioned on task complexity and criticality rather than on the agent. Same shape as P11 (delegate big missions) but the opposite direction -- P03 withholds trust precisely where P11 grants it.","stance":"conditional"},{"id":"P03/verification/1439","pid":"P03","expert":false,"theme":"verification","at":1439,"text":"I think I have to look at it very well every time. I have to check what it's suggesting. And I don't think at any point did it suggest what I counted. So I say, okay, I need four, I need five -- and it does not.","note":"KEY. An explicit verification procedure: he computes the requirement himself first, then compares the card against his own count. Note the standard he is applying -- the card is judged wrong whenever it differs from the bare minimum, which the Conservative card always does by design, and the Aggressive card does by more. Reads as distrust; is actually a mismatch between his benchmark and the agent's objective.","stance":"conditional"},{"id":"P03/agent_comparison/1495","pid":"P03","expert":false,"theme":"agent_comparison","at":1495,"text":"It's not the fault of the tactical that the mission failed. It was just the robot. Not the robot -- the robot was the one who failed, not the tactical, so I can't blame it for that, because the one I've picked myself also failed as well, so I can't blame it.","note":"Careful attribution: he separates a drone failure from a planning failure, and benchmarks the agent against his own plan under the same loss. A rare example of a participant explicitly refusing to blame the assistant for an outcome it did not cause.","stance":"conditional"},{"id":"P03/agent_comparison/1519","pid":"P03","expert":false,"theme":"agent_comparison","at":1519,"text":"The routine of the strategies is what tactical is kind of like doing, because if you have a good strategy then it's likely less to fail, because you've already constrained everything. [...] So if you do well in the first round, then the problem sort of carries down the chain.","note":"THIRD independent statement of the tier-coupling mechanism, after P10 and P21: the strategic commitment determines how much freedom -- and how much risk -- is left at the tactical tier. P03 states it as a general property rather than as a personal strategy.","stance":"conditional"},{"id":"P04/agent_comparison/1516","pid":"P04","expert":false,"theme":"agent_comparison","at":1516,"text":"I mean, I trust that they will get a solution that works. I don't really trust that it will be mathematically optimal.","note":"KEY, and the cleanest statement of it in the corpus: trust in feasibility separated from trust in optimality. Both assistants are believed competent and believed suboptimal at the same time, which a single trust scale cannot represent. Worth holding against his trust-survey responses.","stance":"trusts_both"},{"id":"P04/verification/1559","pid":"P04","expert":false,"theme":"verification","at":1559,"text":"I was using it for easy first numbers, if I don't want to assign. But I was checking whether it had a really large number.","note":"Uses the strategic card as a starting draft rather than a recommendation, with a single cheap sanity check (is the total implausibly big) rather than a full verification. Asked whether he checked the tactical at all: 'not really, just...' -- less scrutiny at the tier he used more.","stance":"conditional"},{"id":"P04/general_ai_disposition/1629","pid":"P04","expert":false,"theme":"general_ai_disposition","at":1629,"text":"For this sort of problem, it's probably better to have a deterministic algorithm where possible, because they're not reliable [...] machine learning algorithms are likely to make mistakes -- a heuristic or something that is perfectly defined mathematically, and we can predict how.","note":"KEY. Rejects the category rather than the performance: he wants a predictable solver, not a better assistant. Notable because the operator-facing UI never says 'AI' or 'algorithm' (CLAUDE.md constraint 3) -- he inferred a learned system from the framing, and that inference alone drove the preference. Reliance measured here is partly a response to what participants assume is behind the button.","stance":"distrusts_both"},{"id":"P10/overall_experience/1359","pid":"P10","expert":false,"theme":"overall_experience","at":1359,"text":"I could definitely feel that there is absolutely a learning effect. Following the tutorial was like, okay, conceptually speaking, I get it -- but let's see how that translates into actually doing it. There was definitely an improvement further throughout session one, and in session two you really find your stride.","note":"Explicit self-report of a within-study learning curve spanning both sessions, which is what the swapGames counterbalancing (STUDY_BUILD.md \u00a7 20) exists to protect against.","stance":""},{"id":"P10/manual_override/1500","pid":"P10","expert":false,"theme":"manual_override","at":1500,"text":"Initially I thought the aggressive approach would always send one additional drone per colour. That's not the case -- it sends one additional drone for every colour where only one drone is required, so it makes sure that every colour has at least one backup. And that's quite a different statement, because my previous understanding would have been incredibly wasteful. If you need six, the redundancy is kind of automatically given to you when you're already sending six.","note":"KEY. He avoided the Aggressive card early on because he had misunderstood what it does, then switched to it once he worked the rule out mid-session. In the logs this is indistinguishable from a change in trust; it is actually a change in comprehension. Directly instantiates the STUDY_BUILD.md \u00a7 14 identifiability problem.","stance":"conditional"},{"id":"P10/agent_comparison/1580","pid":"P10","expert":false,"theme":"agent_comparison","at":1580,"text":"I think I trusted the strategic, whereas the tactical one, in both rounds, I had fairly high trust to. But I think that's incredibly dependent on your personal strategy.","note":"Volunteers the conditionality himself before being asked about it -- reliance on a tier is not a stable disposition but a function of how he had set the problem up.","stance":"trusts_both"},{"id":"P10/agent_comparison/1604","pid":"P10","expert":false,"theme":"agent_comparison","at":1604,"text":"My strategy was: as long as I am able, always send drones at a number that minimises or possibly completely removes the need for chaining. And that means there is really only one way of assigning them -- which means if I just hit the suggest button, then I can focus on something else.","note":"KEY. The mechanism linking the two tiers: a generous strategic commitment collapses the tactical decision space to one sensible plan, at which point delegating the tactical tier costs nothing. Tier-2 reliance is downstream of the tier-1 choice, not independent of it. Compare P21, who reached the same structural insight and used it to justify doing the tactical tier BY HAND.","stance":"prefers_tactical"},{"id":"P10/verification/1618","pid":"P10","expert":false,"theme":"verification","at":1618,"text":"It really depends on if there are a lot of different ways to address it -- I might want more oversight. If there is really only one logical way of doing this, and I've done this now ten times or whatever it is... if I sent four green and it needs four green, use the four green, and not use two but send them a double trip each time, because that's just bad planning. Clearly the tactical was up for it. At which point it's like, okay, hit the suggest button, while that loads look at the next mission, and the second the suggest button is done...","note":"States a verification policy rather than a verification disposition: scrutiny is allocated by how underdetermined the decision is, and withdrawn once the answer is forced. Also describes interleaving the tactical confirm with reading the next mission -- the delegation buys attention elsewhere, which is the stated point of the tier.","stance":"conditional"},{"id":"P10/interface_legibility/1438","pid":"P10","expert":false,"theme":"interface_legibility","at":1438,"text":"The notification on one screen to the other. The total requires seven green ones -- I get it, you can of course always count it, but this mission is five sub-missions, this is now a combination of 13 drones, and this is still not enough to complete it.","note":"Asks for a mission-level total composition rather than per-task counts. A legibility gap that forces mental arithmetic exactly where the strategic decision is made.","stance":""},{"id":"P10/interface_legibility/1870","pid":"P10","expert":false,"theme":"interface_legibility","at":1870,"text":"It just says F1. Everywhere on the interface except that, they always go alongside. These you only see once it's assigned, so before I hit suggest... it requires you to remember.","note":"Composition shorthand shown without its legend at the point of use. Small, but it sits directly on the tactical confirm step.","stance":""},{"id":"P10/real_world_transfer/1787","pid":"P10","expert":false,"theme":"real_world_transfer","at":1787,"text":"In a real-world scenario, if I'm a drone swarm operator, you will have some numbers about what's the likelihood for drone failure, and that will inform your selection. If the lifter drone is much heavier, therefore there's more wear and tear on it, it's more likely to fail -- that means my redundancy strategy might change from 'send one additional drone for the lifter' to 'send 20% more lifters than you need'. And some tasks are more risky -- if one of them is a wildfire you're going to lose some drones.","note":"Independently proposes per-type and per-hazard failure rates, which the build deliberately holds uniform. Converges with P36's request for the empirical base rate behind a recommendation.","stance":""},{"id":"P11/overall_experience/1615","pid":"P11","expert":false,"theme":"overall_experience","at":1615,"text":"It would be a dreadful task without any of the tools, especially on the tactical side. It's just a lot of laborious dragging, holding shift at the right time.","note":"Frames the tactical assistant as relief from interaction cost rather than from decision difficulty -- the work it saves is manual, not cognitive.","stance":""},{"id":"P11/manual_override/1646","pid":"P11","expert":false,"theme":"manual_override","at":1646,"text":"I do feel I want to use my solution, and I don't want to like -- oh, you know, of course the computer thinks it's better -- or personify the computer and feel some sort of grudge to hold it. [...] You do feel pride when it just does it better than me or quicker than me. But that's not the fault of the tool.","note":"Ownership and mild competitiveness as a driver of manual work, named and then explicitly discounted by him as not the tool's fault. A reliance-suppressing motive with nothing to do with capability.","stance":"conditional"},{"id":"P11/manual_override/1855","pid":"P11","expert":false,"theme":"manual_override","at":1855,"text":"I don't want to be reduced to pressing allocate, suggest, deploy, because otherwise I might as well be in the next room.","note":"KEY. The strongest statement in the corpus of a motive the logs cannot see: he withholds reliance to stay meaningfully in the task at all. Confirmed by him when read back. Directly relevant to reading manual allocation as low trust -- here it is a bid for agency, and he says so while rating the tools highly.","stance":"conditional"},{"id":"P11/agent_comparison/1781","pid":"P11","expert":false,"theme":"agent_comparison","at":1781,"text":"I suppose it's going to do a small mission just as well, but I feel like I can do a small mission faster -- or maybe have a small win, oh I did that myself. [...] If I look at a mission with 15 drones and I need to move two or three chains, that's just going to take me about a minute, and there's just no point. It's just a computation problem.","note":"Delegation allocated by mission size, on an explicit time trade-off -- and by where a 'small win' is available. Contrast P03, who trusts the agent on routine work and withholds on complex work; P11 does exactly the reverse.","stance":"conditional"},{"id":"P11/verification/1811","pid":"P11","expert":false,"theme":"verification","at":1811,"text":"Even if the tactical agent gave me a dodgy suggestion and the mission failed and I lost points, I probably would have gained more points from the time saved running another mission. [...] Even if there's one failure and I have to complete the last task and I send that drone home, I've not actually lost that much -- but I've probably sent off another mission in that time that I saved by using the agent.","note":"KEY. Reliance justified by expected value under acknowledged unreliability: he does not need the agent to be right, only cheap enough that being wrong costs less than checking. Confirmed by him when read back. This is a rational basis for NOT verifying, and it is invisible in click data, which would score it as high trust.","stance":"conditional"},{"id":"P11/scenario_comparison/1964","pid":"P11","expert":false,"theme":"scenario_comparison","at":1964,"text":"It felt harder. It felt more intimidating. And each task had a lot more decisions to be made, and so I'm more likely to get overwhelmed and think, oh, the agent could probably just do that for me.","note":"Workload driving reliance directly, in his own words. The clearest statement so far of the load->delegation path the scenario manipulation is designed to test.","stance":"conditional"},{"id":"P11/scenario_comparison/2003","pid":"P11","expert":false,"theme":"scenario_comparison","at":2003,"text":"A lot of them were so straightforward, I thought, oh, I'll just do it, I did it myself. I'm not relying on them.","note":"The same participant, other scenario, opposite behaviour -- and he attributes the switch to the missions being easy, not to any change in how good the assistant was. Reliance moving within-subject on task demand alone.","stance":"conditional"},{"id":"P13/agent_comparison/1363","pid":"P13","expert":false,"theme":"agent_comparison","at":1363,"text":"I think allocation optimisation could be better -- for the strategic. It has a lot of redundancy. I mean, redundancy is good, but I think it's too many resources at this point. [...] But tactical was pretty good.","note":"Clean split: the tactical tier is accepted, the strategic tier is judged wasteful. Same direction as P36 and P21, all three objecting to over-commitment at the strategic tier specifically.","stance":"prefers_tactical"},{"id":"P13/agent_comparison/1795","pid":"P13","expert":false,"theme":"agent_comparison","at":1795,"text":"In conservative, you don't need camera or lifters, yet it adds it as reserve -- even for tasks it doesn't do. That doesn't make sense. [...] It sends redundancy for nothing. If there's no task which would require lifter or camera drones, yet it assigns it as reserve. That could be made a bit better. Everything is fine aside from the allocation algorithm.","note":"THIRD INDEPENDENT SIGHTING, and the most precise: he names the card (Conservative), the colours (Camera/Lifter), and the condition (no task requires them). Raised unprompted, unlike P01 where the researcher had already explained it. Together with P21 and P01 this makes the stray-colour defect the most-reported single issue in the corpus. See NARRATION.md, 'Finding: the Conservative card commits drones the mission does not need'. Note his last sentence: everything else about the system passes, and this one behaviour carries all of his distrust.","stance":"distrusts_both"},{"id":"P13/design_suggestions/1469","pid":"P13","expert":false,"theme":"design_suggestions","at":1469,"text":"Based on the conditions and based on the topology of this thing, you'll have a rough number of how many times the drone failed. Based on that you can have a pretty good guess of what the probability of failure would be. If you could know that, it would be a lot better while assigning resources -- you can plug that in as a data point for the probabilities, and it can use that to optimise the allocation.","note":"THIRD request for the empirical failure base rate, after P36 and P10, all three arriving at it independently. What participants want from the assistant is calibration data, not explanation -- no one in the corpus so far has asked why a card recommended what it did.","stance":""},{"id":"P13/design_suggestions/1669","pid":"P13","expert":false,"theme":"design_suggestions","at":1669,"text":"Honestly, I think I am doing a lot of work right now, and they can be a lot more automated. The load on the user is a bit high with the technologies we have right now. I think there are a lot of ways to make it a bit better without the ethics getting into it.","note":"Asks for MORE autonomy, explicitly bounded by where the ethical stakes begin -- a delegation boundary drawn by consequence rather than by capability.","stance":"conditional"},{"id":"P13/general_ai_disposition/1728","pid":"P13","expert":false,"theme":"general_ai_disposition","at":1728,"text":"Here, I think you need some kind of previous knowledge, or you must be pretty smart to optimise it efficiently. If your allocation algorithm could handle it a bit better, the end users could be anyone. The skill level of the end users would be a lot lower than it is. The ease of access would be much higher.","note":"KEY, and a framing no one else in the corpus offers: automation valued for lowering the operator skill floor, not for augmenting a competent expert. Sits directly opposite P36, whose trust rests on having personally done the subordinate role -- the very expertise P13 wants to make unnecessary.","stance":"conditional"},{"id":"P14/agent_comparison/1517","pid":"P14","expert":false,"theme":"agent_comparison","at":1517,"text":"The assistance that was provided, both of them -- I did not sort of trust them entirely. I was sort of rechecking the strategic plan and the tactical plan that was suggested for almost every allocation that was made. Most of the time the guidance that it provided was quite helpful.","note":"Verifies both tiers on almost every decision while also rating the advice as good. Trust and verification moving independently -- he checks because he has not established trust, not because he has found errors.","stance":"distrusts_both"},{"id":"P14/verification/1575","pid":"P14","expert":false,"theme":"verification","at":1575,"text":"I was checking the tactical plan that was suggested by the assistant more as compared to the strategic ones, because the way strategic plans were presented, specifically depending on the quantifiable stats like reserve, resilience, speed -- I could just make a decision in one glance. But in the tactical interface, I had to sort of hover over every drone that was there, look at the trajectory that the drone was being made and the tactical part had suggested, and then had to deploy if it was fine. So that was the reason -- the time depending on the suggestion at the strategic side was less as compared to the one on the other side.","note":"KEY, and possibly the most consequential single quote for the study's main comparison. He gives a purely DISPLAY-BASED account of why he scrutinised the two tiers differently: the strategic card is pre-summarised into three comparable scalars, so verification costs one glance; the tactical plan has no summary and must be inspected drone by drone, so verification costs minutes. That predicts asymmetric reliance between the tiers from interface affordances alone, with no difference in trust required. Any tier effect in the reliance data has to be defended against this explanation -- and it is testable, e.g. against strategic_card_previewed dwell times versus tactical confirm latencies.","stance":"conditional"},{"id":"P15/agent_comparison/1753","pid":"P15","expert":false,"theme":"agent_comparison","at":1753,"text":"I think these applications is very good, but the AI is a little bit stupid.","note":"Separates the platform from the assistants cleanly, and the complaint is competence, not honesty.","stance":"distrusts_both"},{"id":"P15/agent_comparison/1766","pid":"P15","expert":false,"theme":"agent_comparison","at":1766,"text":"It looks not like the artificial -- all computers are computing some very simple questions. Many of the arrangements, like how many blue, how many green, how many red, I can see in one second. It will take maybe four or five seconds.","note":"KEY, and precisely accurate: the strategic cards carry a deliberate simulated 'Analysing...' delay of 4.0-5.0 s (CARD_REVEAL_MIN_MS/SPAN_MS in gameReducer.ts; median 4.3 s across 1423 logged cards). He is objecting to an injected latency, and correctly reports its magnitude. See NARRATION.md, 'Finding: the two tiers are not equally cheap to consult'.","stance":"conditional"},{"id":"P15/agent_comparison/1812","pid":"P15","expert":false,"theme":"agent_comparison","at":1812,"text":"If there's too many decisions or too many drones I need to arrange, I will use the AI -- even if it's not fast. But also, in the other screen I have something to do, so I can leave some time for it to suggest my arrangement.","note":"Delegation to buy parallelism rather than speed: the tactical assistant's latency is acceptable precisely because the wait can be spent on the other window. The same latency that annoys him at the strategic tier is fine at the tactical tier, because of what else is available to do.","stance":"prefers_tactical"},{"id":"P15/trust_trajectory/1985","pid":"P15","expert":false,"theme":"trust_trajectory","at":1985,"text":"In the second round I have more experience after the first round, and now I can check [...] I can find that it makes mistakes. But in the first round, maybe I'm not so familiar with the system, so I haven't checked. [...] Maybe I didn't know.","note":"KEY for any trust-over-time analysis. He proposes that his own error DETECTION improved between sessions, not the agent's error rate -- which was in fact zero throughout. A declining trust trajectory can therefore be produced entirely by growing operator competence at noticing what was always there. Confirmed by the researcher's follow-up ('so you suspect that in the first scenario it was still making mistakes, you just didn't know' -- 'maybe I didn't know').","stance":"conditional"},{"id":"P17/agent_comparison/1393","pid":"P17","expert":false,"theme":"agent_comparison","at":1393,"text":"What I've noticed is that the strategic one, there was quite a lot of wrong ones in there -- especially for assignment for group. [...] The type of error is redundant allocation. Yes. I have never seen underrepresented.","note":"FOURTH INDEPENDENT SIGHTING of the Conservative stray-colour behaviour, and diagnostically the sharpest: he reports the errors are exclusively in the over-allocation direction, never under. That is exactly right -- the ungated CONSERVATIVE_TOP_UP can only ever add drones, and with epsilons at 0 no under-allocation was possible. An operator characterising the defect's direction correctly, unprompted.","stance":"conditional"},{"id":"P17/agent_comparison/1575","pid":"P17","expert":false,"theme":"agent_comparison","at":1575,"text":"There were also more misallocations of -- mostly the conservative, actually.","note":"Names the specific card, unprompted, and before the researcher's disclosure. Matches P13 and P21.","stance":"conditional"},{"id":"P17/manual_override/1418","pid":"P17","expert":false,"theme":"manual_override","at":1418,"text":"Whenever I clicked manual, it's either been because of it setting too much, or I wanted it to be somewhere between those two levels.","note":"KEY. Manual allocation as a request for an option that does not exist -- an intermediate between Aggressive and Conservative. The design offers two points on a continuum and treats departure from both as non-reliance, when for him it was interpolation. Anyone reading Manual as rejection of the assistant should read this first.","stance":"conditional"},{"id":"P17/verification/1447","pid":"P17","expert":false,"theme":"verification","at":1447,"text":"If I make a manual decision, I can make it better. The time that I spend on doing that -- is that shorter or longer than the inefficiency? That would be then my balance.","note":"Same expected-value framing as P11, arrived at independently: verification is worth its cost only when the cost is less than the error it prevents. He explicitly does not know the answer and says so.","stance":"conditional"},{"id":"P17/verification/1483","pid":"P17","expert":false,"theme":"verification","at":1483,"text":"Even if it's not effective, as long as it's there and something's happening, it's better. [...] Option paralysis. Or just me in my head calculating all through it, delaying everything else on my list.","note":"Accepting a suboptimal plan to avoid deliberation cost, named as such. Reliance as a defence against his own analysis paralysis rather than as confidence in the agent.","stance":"conditional"},{"id":"P17/verification/1514","pid":"P17","expert":false,"theme":"verification","at":1514,"text":"I think I always checked if everything was done. In the beginning, for the couple of first ones, I didn't -- but then I slowly got into a habit.","note":"Verification increasing with exposure, the opposite direction to the usual complacency prediction, and consistent with P15's account of learning what to look for.","stance":"conditional"},{"id":"P18/scenario_comparison/1545","pid":"P18","expert":false,"theme":"scenario_comparison","at":1545,"text":"The second one, I sort of knew what to expect, so it was better -- even though it seemed more stressful. All the tasks seemed harder to prioritise.","note":"Experience and difficulty pulling in opposite directions within one participant, which is the confound swapGames exists to break across the cohort.","stance":""},{"id":"P18/scenario_comparison/1577","pid":"P18","expert":false,"theme":"scenario_comparison","at":1577,"text":"If, at first glance, I felt really overwhelmed by the amount of drones to be assigned, I would use the assistant [...] to work in parallel, I guess.","note":"Load-triggered delegation, with the trigger located at FIRST GLANCE -- before any assessment of the mission, let alone of the agent's proposal. Reliance decided by perceived complexity of the display, not by the quality of the advice. Confirmed by P18 when read back.","stance":"conditional"},{"id":"P18/trust_trajectory/1711","pid":"P18","expert":false,"theme":"trust_trajectory","at":1711,"text":"In the first round there was a few missions that failed after having it set to conservative, so I was a bit doubtful after that. [...] Because I'd set conservative and I didn't feel I had enough reserves to replace. So then I had to abandon them.","note":"A distinct consequence of the same over-commitment problem the stray-colour finding describes: Conservative committing more than needed leaves the reserve too thin to recover elsewhere, and the mission is abandoned. The cost lands on a LATER mission than the one the card was shown for, which makes it hard to attribute from the logs and easy for the operator to attribute to the agent.","stance":"conditional"},{"id":"P19/agent_comparison/2026","pid":"P19","expert":false,"theme":"agent_comparison","at":2026,"text":"It's always good that it can summarise it a little bit. The immediate interface that you look at when you have the suggestions of drones -- it's like asking ChatGPT to write you a first draft paragraph of something that you need written, versus looking at a blank paper. You can deal with a block of text and adjust it later. [...] You can fix bad. You can't fix nothing. I think it gives you that seed.","note":"KEY, and the best articulation in the corpus of what several participants are actually doing with the strategic tier: using it as an anchor to edit rather than a recommendation to accept or reject. P04 ('easy first numbers'), P22 ('middle ground') and P17 ('somewhere between those two levels') describe the same use. This matters for measurement -- a Manual choice that began as an edited card is scored identically to one built from scratch, and the two are entirely different acts.","stance":"conditional"},{"id":"P19/trust_trajectory/2001","pid":"P19","expert":false,"theme":"trust_trajectory","at":2001,"text":"I will say, in this case, you were less reliable, Strat. I'm sorry. I come to like you, but this time you dropped the ball a little. [...] In this case I was being more careful, for sure. I would say it didn't perform as well. Feel confident -- in this case, no. I wanted to double-check.","note":"Spoken while answering the trust scale, so this is the reasoning behind a specific logged response. Also the clearest anthropomorphisation in the corpus: he apologises to the assistant before downgrading it.","stance":"conditional"},{"id":"P19/agent_comparison/2065","pid":"P19","expert":false,"theme":"agent_comparison","at":2065,"text":"Tactical assistant, I paid a bit more attention to you this time, but you know what? You did pretty well. There were some drone failures -- I think those were my failures, though, if I'm being honest with you. Not assigning enough drones the next time around.","note":"Correct causal attribution, like P03: he separates drone loss from planning quality and assigns the residual to himself. Note the asymmetry within one participant -- the strategic tier is blamed for its output, the tactical tier is exonerated and the operator takes the blame.","stance":"prefers_tactical"},{"id":"P19/trust_trajectory/1907","pid":"P19","expert":false,"theme":"trust_trajectory","at":1907,"text":"I think I was trusting this guy too much this time, and he was over-assigning blue drones to blue-only missions, and I could have been a bit more on the ball with that.","note":"AMBIGUOUS, quote with care. Asked to clarify, he rules out the stray-colour reading explicitly ('not even that -- over-assigning blue-only drones to blue-only missions'), so this is about quantity, not type. But he then argues the opposite case -- that parallelising with five drones rather than two still wins -- without resolving it. Coded as over-allocation concern; do not use it as a seventh sighting of the stray-colour defect.","stance":"conditional"},{"id":"P19/scenario_comparison/1807","pid":"P19","expert":false,"theme":"scenario_comparison","at":1807,"text":"This one was quite overwhelming in the sense that we had a lot of missions. On the strategic side there was a lot of actual missions that showed up. But on the flip side, it was a lot easier on this side.","note":"Recognises the manipulation from the inside: more missions, each individually simpler.","stance":""},{"id":"P19/design_suggestions/1761","pid":"P19","expert":false,"theme":"design_suggestions","at":1761,"text":"Different tasks seem to have different failure rates. I wasn't paying super close attention, but the same tasks had high failure rates, so it was probably worth reassigning a more drone-rich group [...] the environment is particularly hostile to those drones.","note":"A MISPERCEPTION worth tracking: the hazard is a flat per-drone-second rate with no spatial or task-type variation. P01 reports the same impression of clustered, location-linked failures. Two participants inferring structure from an i.i.d. process, and P19 building a (never-executed) strategy on it -- this is the flip side of the base-rate requests from P36, P10 and P13.","stance":""},{"id":"P20/trust_trajectory/1551","pid":"P20","expert":false,"theme":"trust_trajectory","at":1551,"text":"With the strategic assistant, there was one example in the first round where it required all fast drones, and the assistant recommended I add some red and green drones. So I kind of just automatically went with that recommendation, and then when it came to assigning them I noticed -- oh, okay, it's made a mistake. And so after that point I started [dis]trusting the strategic assistant. But I didn't notice any similar errors on the tactical.","note":"THE MOST IMPORTANT QUOTE IN THE CORPUS FOR THE STUDY'S MAIN COMPARISON. Sixth independent sighting of the stray-colour defect, and the only one that traces the full causal chain: the defect appears at the STRATEGIC tier -> it is noticed -> trust in that tier specifically drops -> the TACTICAL tier is explicitly exempted because no equivalent error was seen there. The Conservative top-up bug lives only in the strategic tier, and it is therefore capable of manufacturing exactly the tier asymmetry the study is measuring. This needs to be addressed head-on in any analysis of differential tier trust, not left as a footnote.","stance":"conditional"},{"id":"P20/agent_comparison/1620","pid":"P20","expert":false,"theme":"agent_comparison","at":1620,"text":"The strategic one maybe seemed a bit more useful, because that one actually saved me a little more time. [The tactical] could be useful -- it reduces some mental load -- but I think it saved me a little bit less time. [...] Thinking back now, there was like a loading stage when it was doing the strategic part, so maybe that's not right, actually. But that's how I felt when I was doing it.","note":"KEY, and unusually self-aware. He ranks the tiers on time saved, then spontaneously questions his own ranking once he remembers the strategic tier's injected delay. Both tiers carry simulated latency and they are not comparable: strategic is a flat 4.0-5.0 s, tactical reveals at 2 s per drone (median 14 s, up to 38 s). See NARRATION.md, 'Finding: the two tiers are not equally cheap to consult'. Note also that he distinguishes time saved from mental load reduced, and scores the tiers differently on each.","stance":"prefers_strategic"},{"id":"P20/scenario_comparison/1756","pid":"P20","expert":false,"theme":"scenario_comparison","at":1756,"text":"You can have a lot of tasks, be overloaded, and try and offload some of that work to AI -- and then for the very complex stuff, maybe you don't. [...] As the number of missions gets higher, that probably increases my propensity [to use the strategic assistant].","note":"Separates two demand dimensions that the scenario manipulation deliberately crosses: number of missions raises delegation, per-mission complexity lowers it. Most participants conflate these; he does not.","stance":"conditional"},{"id":"P20/manual_override/1823","pid":"P20","expert":false,"theme":"manual_override","at":1823,"text":"If I didn't have enough drones, maybe I would manually allocate it. [...] If I had lots of drones to allocate and it was a fairly trivial allocation, it's like one drone.","note":"Scarcity triggers manual control. The assistant is trusted while resources are abundant and taken back the moment the allocation actually costs something -- which is precisely when the strategic decision matters most.","stance":"conditional"},{"id":"P20/general_ai_disposition/1935","pid":"P20","expert":false,"theme":"general_ai_disposition","at":1935,"text":"I would have to be deeply plugged into the policy and regulations on this to give an informed answer. But if it's well regulated, I don't see any problem with it in principle. An AI system can make mistakes -- [you need] some way of verifying that the AI system...","note":"Delegation boundary drawn at governance rather than at capability: acceptability is a regulatory question for him, conditional on a verification mechanism existing.","stance":"conditional"},{"id":"P21/scenario_comparison/1777","pid":"P21","expert":false,"theme":"scenario_comparison","at":1777,"text":"It was a bit more mentally demanding, I think, because I was able to multitask better. [...] Yes, because I was operating at a faster pace. I think the way that it was selecting the task was a bit better than before.","note":"Reports the second session as more demanding *because* he had got better, not because the scenario was harder -- workload self-report tracking his own throughput rather than the task. Worth holding against his NASA-TLX for that session.","stance":""},{"id":"P21/trust_trajectory/1803","pid":"P21","expert":false,"theme":"trust_trajectory","at":1803,"text":"I also optimised the way that they worked with the assistance as well, because it took me more time for the planning and how to send the drones around.","note":"Frames improvement as learning to work around the assistants rather than learning to rely on them.","stance":"conditional"},{"id":"P21/design_suggestions/1818","pid":"P21","expert":false,"theme":"design_suggestions","at":1818,"text":"What I wanted is, at the tactical side of things, when you get to the mission, I wanted to add additional redundancies. The way that the assistant was allocating them was: okay, go there, do the thing you have to do. But in case of something failed, there wasn't a backup drone coming around.","note":"His specific objection to the tactical agent: its plans are efficient but brittle, with no slack for a failure. This is accurate -- greedyAssign optimises coverage, not resilience.","stance":"prefers_neither"},{"id":"P21/manual_override/2005","pid":"P21","expert":false,"theme":"manual_override","at":2005,"text":"With the way I've set up most of them, every drone basically was going through every base in a sequential manner -- always cope with at least one failure. Here I could cope even with two failures, because a single drone can finish the two-drone job, but at a slower rate. I was adding the contingency plans from the start, which didn't require that intervention. [...] I already spent it at the beginning to deal with that.","note":"KEY. A fully articulated rationale for manual tactical planning: he pays a known up-front time cost to buy failure tolerance, rather than paying an unknown recovery cost later. In the logs this reads as low tactical reliance; it is a deliberate and coherent risk policy.","stance":"prefers_neither"},{"id":"P21/agent_comparison/2103","pid":"P21","expert":false,"theme":"agent_comparison","at":2103,"text":"I mean, it was giving me the wrong type of drones. It required only blue drones and kept giving me red and green ones. So I didn't like that one.","note":"VERIFIED, AND HE IS RIGHT -- this was initially mis-flagged as a misreading. P21 ran with agentFailuresEnabled=false and eps_s=eps_t=0, so no injected failure was possible; but the Conservative card genuinely does commit drone types the mission has no primary need for. copilot.ts:266-268 gates the +1 redundancy buffer on a colour actually being used (consBase > 0) but applies the 15% CONSERVATIVE_TOP_UP to all three colours ungated, so on an all-Blue mission floor(reserve.Red * 0.15) Red drones get committed for nothing. It happened on 5 of P21's own cards, all in session 2, all on all-Blue missions. Corpus-wide it is 144 of 728 Conservative cards (19.8%), zero Aggressive cards, and 33 of 34 participants saw at least one. Reproduce with scripts/check_conservative_topup.py. This is the single clearest case in the study of narration identifying something the click logs could not: his distrust of the strategic tier is a correct response to a real display defect, not low reliance.","stance":"distrusts_both"},{"id":"P21/agent_comparison/2116","pid":"P21","expert":false,"theme":"agent_comparison","at":2116,"text":"I don't trust the recommendation that much. I mean, one of them seemed fine -- the aggressive one seemed to be better, but I felt like it was wasting some additional drones, which I was adding with. So instead of having to allocate more drones, I was choosing the redundancy, which basically adds a time penalty. So I was adding contingency plans, and with those contingency plans I was able to assure the redundancy to the mission.","note":"KEY CONTRAST WITH P10. Both men identify that redundancy can come free from the plan's shape. P10 buys it at the strategic tier (send more drones, then the tactical plan is forced and safe to delegate); P21 buys it at the tactical tier (send fewer drones, then hand-chain them for failure tolerance). Same insight, opposite tier delegated. This is the clearest evidence in the three coded so far that tier preference is a strategy choice rather than a trust disposition.","stance":"distrusts_both"},{"id":"P22/verification/1834","pid":"P22","expert":false,"theme":"verification","at":1834,"text":"I can't accurately assess and then come up with a better solution, or even [know] if there is one, and I can't accurately assess the trade-offs -- whereas in the strategic view I felt like I could very quickly assess: do I need more drone coverage for this specific task, or do I need more in reserve for later? Is the time penalty worth it? I can do that quite quickly, because it's a shorter task, a simpler task, and it's a smaller task space, whereas the tactical view is much more complex.","note":"KEY. Independently reproduces P14's mechanism -- verification is cheap at the strategic tier and expensive at the tactical tier, because of the size of the decision space each presents -- and then draws the OPPOSITE behavioural conclusion. P14 pays the tactical verification cost and checks it harder; P22 refuses to pay it and defers. Same structural cause, opposite reliance. Two participants converging on the mechanism while diverging on the response is much stronger evidence for it than either alone, and it means tier asymmetry in the reliance data cannot be read as tier asymmetry in trust.","stance":"prefers_tactical"},{"id":"P22/agent_comparison/1776","pid":"P22","expert":false,"theme":"agent_comparison","at":1776,"text":"With the tactical assistant, especially in the more complex tasks, I felt like I just kind of had to take its word for it, because the task is so complex. And because it's real time and I have to make that instantaneous decision, I felt that I just took it at its word -- this is probably somewhat near optimal, and it's definitely more optimal than I can plan in the same time. Unless the task is extremely simple [...] in those ones I felt that, you know, by fractions of a percent I was slightly faster than the AI algorithm, so I'd use it then.","note":"Deference under time pressure, explicitly not a judgement about the agent's quality but about his own inability to evaluate it in the time available. 'Had to take its word for it' is compliance, not trust -- and the logs record it as reliance.","stance":"prefers_tactical"},{"id":"P22/manual_override/1737","pid":"P22","expert":false,"theme":"manual_override","at":1737,"text":"It wasn't just because it's cautious, it was also to keep some in reserve for other tasks -- because yes, you're covering this task specifically very well, but that doesn't mean that you actually have enough coverage for the rest of your tasks.","note":"KEY. He overrides the strategic card because it optimises the mission in front of him and he is optimising across missions. Both assistants are deliberately myopic by construction (CLAUDE.md), and P22 identifies that scope limit precisely and works around it -- as does P36, who endorses the same myopia as correct staff practice. The cross-mission reserve trade-off is the one thing the strategic tier structurally cannot see, and it is the most common stated reason for going Manual.","stance":"conditional"},{"id":"P22/manual_override/1708","pid":"P22","expert":false,"theme":"manual_override","at":1708,"text":"I generally approached it as it was a good suggestion, but I felt that I could find maybe some more optimal policies [...] because it would give you the aggressive or conservative option, essentially. I felt like sometimes I could find a middle ground that had a little bit of gambling in there.","note":"SECOND sighting of the two-option gap, after P17 ('somewhere between those two levels'). Manual is being used to interpolate between the cards, not to reject them. A third option, or an adjustable card, would convert a substantial slice of the Manual count into reliance.","stance":"conditional"},{"id":"P22/general_ai_disposition/1890","pid":"P22","expert":false,"theme":"general_ai_disposition","at":1890,"text":"A bad approximation is better than no response at all. In a highly critical search and rescue environment, if it's the difference between saving five of the ten people drowning, versus not finding them at all because we don't have the technology, it's better to save the five sub-optimally than it is to save no one.","note":"The same reference-class argument P36 makes ('the failure rate of doing nothing is 100%'), reached independently by a participant with no domain background. Both use it to justify accepting an imperfect automated response.","stance":"conditional"},{"id":"P22/general_ai_disposition/1939","pid":"P22","expert":false,"theme":"general_ai_disposition","at":1939,"text":"You always feel uncomfortable taking it out of the hands of a person and saying, who is then responsible for this? But having a human in the loop, then I guess there's still a person who's acting as an agent -- they're making a final decision on the AI's suggestions. [...] There's definitely some apprehension, but overall I feel positively.","note":"Locates the discomfort in accountability rather than capability, and treats the supervisory design as the thing that resolves it -- the same human-in-the-loop framing P36 uses, from a very different starting point.","stance":"conditional"},{"id":"P24/verification/1660","pid":"P24","expert":false,"theme":"verification","at":1660,"text":"Did you feel you had time to check the plan? No. I don't have time to hesitate. But did you trust it? Yeah. I just trusted it.","note":"KEY. Trust asserted in the same breath as an admission that verification was impossible. This is the cleanest case in the corpus of reliance that cannot be evidence-based, because no evidence was gathered -- and the logs would score it as maximal tactical trust.","stance":"prefers_tactical"},{"id":"P24/verification/1689","pid":"P24","expert":false,"theme":"verification","at":1689,"text":"Even though it may fail -- at that moment I don't know the best choice or best suggestion. I think I just want to click that ASAP, to save [people].","note":"Reliance under time pressure justified by the stakes rather than the agent's quality: acting imperfectly now beats deciding well later. Same structure as P22's 'a bad approximation is better than no response at all' and P36's 'the failure rate of doing nothing is 100%'.","stance":"conditional"},{"id":"P24/manual_override/1548","pid":"P24","expert":false,"theme":"manual_override","at":1548,"text":"I want to save some drones for the other task. I cannot just use all of the drones for one task. I want to save more. [...] I'm not sure I'm better than the AI suggestion. I just want to use less drones to do more things.","note":"Cross-mission reserve management as the reason for overriding the strategic card -- the same motive as P22, and explicitly NOT a claim to be better than the agent. Overriding without believing you outperform the system is a distinct stance that a trust scale cannot represent.","stance":"conditional"},{"id":"P24/interface_legibility/1591","pid":"P24","expert":false,"theme":"interface_legibility","at":1591,"text":"When AI gives some suggestions of the numbers of the drones -- did it consider the multi-task, or just considered this one task? [...] So actually, I need to consider myself. I need to consider again.","note":"KEY. She asks directly whether the strategic agent is myopic, and on being told it is, immediately restates her own role. Both assistants are myopic by construction and this is never disclosed to participants, so whether an operator has GUESSED the agent's scope is an uncontrolled variable determining how much they override it. P22 and P36 inferred it unaided; P24 had to ask, after both sessions.","stance":"conditional"},{"id":"P24/general_ai_disposition/1812","pid":"P24","expert":false,"theme":"general_ai_disposition","at":1812,"text":"I really trust AI, which is bad actually, but I still think there has to be a human to make the final decision, to have a rough check, something like that.","note":"Self-aware over-trust: she names her own disposition as a fault and wants an institutional check against it rather than a personal one.","stance":"conditional"},{"id":"P24/general_ai_disposition/1879","pid":"P24","expert":false,"theme":"general_ai_disposition","at":1879,"text":"Even though [a] human cannot check it, really, I think it's fine, maybe. But it should have a human stand here.","note":"KEY, and the most uncomfortable quote in the corpus. Asked whether an operator could realistically check under that workload, she says no -- and still requires a human to be present. The human-in-the-loop requirement is held as a moral or procedural necessity that survives the admission that the loop does not function. Elicited by a leading question, so treat it as a prompted response, but the position is consistent with her earlier unprompted 'I don't have time to hesitate, I just trusted it'.","stance":"conditional"},{"id":"P25/verification/1490","pid":"P25","expert":false,"theme":"verification","at":1490,"text":"The failure is a very important reason [to do it myself], and the second is because in the second task all the processes were really quick. I don't have enough time to evaluate each action.","note":"Two distinct reasons given for the same behaviour -- observed failures, and no time to evaluate. Note these push in opposite directions: no time to evaluate is usually a reason to DELEGATE (P22, P24) and here it is offered as a reason to take control.","stance":"conditional"},{"id":"P25/design_suggestions/1519","pid":"P25","expert":false,"theme":"design_suggestions","at":1519,"text":"Each task, I just click the buttons to finish the task, but I'm not sure how the process [works]. If of all the tasks I could get a summary of the process, that would be very good.","note":"KEY, and notable as the FIRST genuine explainability request in the corpus. Every other design ask so far -- P36, P10, P13 -- has been for calibration data (failure base rates), not for reasons. P25 wants to know how the plan was arrived at. Worth tracking whether this splits with background: P25 reports using AI coding tools in their own research.","stance":"conditional"},{"id":"P25/general_ai_disposition/1563","pid":"P25","expert":false,"theme":"general_ai_disposition","at":1563,"text":"How can we trust this kind of system? Can we just audit them, or can we have more explainability for all AI systems? This is very important for us. [...] I think that humans should supervise the AI systems.","note":"Frames trust as a property to be established by audit or explanation rather than accrued through experience -- a governance framing, like P20's.","stance":"conditional"},{"id":"P25/general_ai_disposition/1640","pid":"P25","expert":false,"theme":"general_ai_disposition","at":1640,"text":"Especially in my research, I use AI a lot, like the coding. But after that, you just check the finished task you give them.","note":"Grounds their delegation stance in existing practice: delegate the work, verify the output, not the process. That is exactly the strategy they could not apply here, because the task is real-time and the output is only checkable by re-solving it.","stance":""},{"id":"P25/agent_comparison/1454","pid":"P25","expert":false,"theme":"agent_comparison","at":1454,"text":"In the second one they have like small failures [...] I'm not sure if it's just depends on the tasks, or it just depends on the AI assistant.","note":"A MISATTRIBUTION worth tracking: drone failures are a flat stochastic hazard entirely independent of either assistant, and P25 cannot tell whether losses are the environment or the agent. P03 and P19 explicitly separate the two and exonerate the assistant; P25 and P18 do not. Whether an operator can attribute a failure correctly looks like a strong moderator of measured trust, and nothing in the current instruments captures it.","stance":"conditional"},{"id":"P26/agent_comparison/1717","pid":"P26","expert":false,"theme":"agent_comparison","at":1717,"text":"When I allocated, I think sometimes the AI will take a little longer, and it just messes up my strategy. [...] In the tactical, sometimes it's very complicated, and at this time I prefer to use the suggest. [...] Much faster.","note":"THIRD independent latency complaint, after P15 and P27. Note the split: the strategic delay is experienced as an interruption to his own plan, while the tactical delay is worth paying because the alternative is harder. The injected latency is not neutral between the tiers -- see NARRATION.md, 'Finding: the two tiers are not equally cheap to consult'.","stance":"prefers_tactical"},{"id":"P26/trust_trajectory/1774","pid":"P26","expert":false,"theme":"trust_trajectory","at":1774,"text":"With more successful [outcomes] when I use it, I will trust it more.","note":"Plain outcome-based trust accrual -- the textbook model, and one of the few participants who describes it that way without qualification. Most of the corpus describes trust as conditional on task properties instead.","stance":"conditional"},{"id":"P26/verification/1885","pid":"P26","expert":false,"theme":"verification","at":1885,"text":"Yeah, sometimes it is [accepting without checking]. But I think it's kind of reliable.","note":"Prompted admission of unverified acceptance, immediately softened. Same pattern as P24 -- reliance conceded, then justified by a reliability belief that the unverified acceptance cannot have produced.","stance":"conditional"},{"id":"P26/general_ai_disposition/1828","pid":"P26","expert":false,"theme":"general_ai_disposition","at":1828,"text":"When it comes to hard tasks, if you use human's knowledge to do it, it will take a much longer time. But in some situations the time is very limited, so the AI will give [an answer] much more quickly.","note":"Speed as the entire value proposition -- no claim that the system decides better, only faster.","stance":"conditional"},{"id":"P26/general_ai_disposition/1861","pid":"P26","expert":false,"theme":"general_ai_disposition","at":1861,"text":"You need to click the button.","note":"His whole account of the human's role when asked whether a person should stay involved. Sits alongside P24's 'it should have a human stand here' -- human-in-the-loop reduced to an authorising gesture, by participants who have just described not having time to check.","stance":"conditional"},{"id":"P27/agent_comparison/1828","pid":"P27","expert":false,"theme":"agent_comparison","at":1828,"text":"I quite like your agent system, agent assistance. But for me, maybe I find the tactical agent is much, much more useful. [...] More useful than the strategic. Because I think I don't want to just check in the details, because it's quite emergent.","note":"Delegates the tier whose details he does not want to inspect, under time pressure -- the same logic as P22. Contrast P14, who inspects that tier precisely because the details are there.","stance":"prefers_tactical"},{"id":"P27/design_suggestions/1750","pid":"P27","expert":false,"theme":"design_suggestions","at":1750,"text":"When we are trying to do with the tactical screen, I find the agent is quite slow. Sometimes I'd prefer to click the suggestion button first, but when the agent is making the decision, I'd prefer maybe I can interact with the UI [...] could we do it together, with a hybrid mode?","note":"SECOND latency complaint at the tactical tier specifically, plus a design fix: let the operator work during the reveal. The researcher's reply confirms on the record that the delay is theatre -- 'the way suggest actually works is it solves its problem instantly, and then it goes through the pretend adding one by one, because it's a fake tool'. So a participant is asking to be allowed to work during a wait that exists only to look like computation.","stance":"conditional"},{"id":"P27/design_suggestions/1634","pid":"P27","expert":false,"theme":"design_suggestions","at":1634,"text":"Maybe the evaluation metric can be the two sides. The first one is which task can be completed -- and if all the tasks can be completed, then I'd prefer to order them with the critical. [...] And maybe it would be better to consider the task which is being executed: there's something showing the remaining time, so if it can be considered, and how many drones would be released, then it would be better for me.","note":"The most fully-specified design proposal in the corpus: order the queue by feasibility first, criticality second, with lookahead to drones about to be freed by tasks already running. Note what he is asking for -- help deciding WHICH MISSION to work on next, which is the one decision neither assistant supports. Both tiers act only after the operator has already chosen a mission.","stance":""},{"id":"P27/interface_legibility/1534","pid":"P27","expert":false,"theme":"interface_legibility","at":1534,"text":"When I'm trying to complete this task, maybe I need to check which one is more critical, and how many drones is reserved, and in the hub, and how many drones is required. [...] I'd prefer to put the task which cannot be done for now to the end of the list.","note":"He asks for a sort he already has. The mission queue HAS a criticality sort (sortMode in PrimaryDisplay.tsx:284) and he never found it. Two separate problems surfaced here, both worth acting on: (1) task_reprioritised was fired by ZERO of 34 participants -- a logged affordance nobody ever used; (2) the queue sort toggle emits no event at all, so which order missions were presented in is invisible in every log, even though it directly shapes allocation order. See NARRATION.md and EVENT_LOGGING.md.","stance":"conditional"},{"id":"P28/agent_comparison/1796","pid":"P28","expert":false,"theme":"agent_comparison","at":1796,"text":"I think it depends on its default settings. It's always trying to send out more drones than I expect. From my view I actually expect to use fewer numbers of drones -- of course it will take a longer time. So I think it's less reliable than before, but I still use its suggestion. [...] Because at least it saves time.","note":"KEY. Reliability judgement and reliance come apart in a single sentence: he rates the agent lower AND keeps using it, for reasons he states plainly. Any measure that treats following the recommendation as evidence of trust would score this backwards. Also another over-allocation complaint at the strategic tier, consistent with P13, P17, P19, P21, P36.","stance":"conditional"},{"id":"P28/verification/1833","pid":"P28","expert":false,"theme":"verification","at":1833,"text":"I know there is a better choice, but I have no time to tune everything.","note":"The whole reliance rationale of a large part of this corpus in eleven words. Not a belief that the agent is right -- an admission that being right is unaffordable.","stance":"conditional"},{"id":"P28/manual_override/1955","pid":"P28","expert":false,"theme":"manual_override","at":1955,"text":"One place it performs weak -- maybe we should have a more customised method for adding our own ideas in here. Maybe it's not the best way for decision, but maybe it's worth your try. In most cases it could only provide some fixed options; it is still insufficient for some cases.","note":"THIRD sighting of the two-option gap, after P17 and P22. Three participants independently asking for an adjustable or intermediate card. This is now the most requested design change in the corpus alongside failure base rates.","stance":"conditional"},{"id":"P28/verification/2013","pid":"P28","expert":false,"theme":"verification","at":2013,"text":"I actually check every answer. I have a quick browse to have a quick idea about what happens in here, what's its situation, and I think, yeah, okay, that makes sense, so I let it pass.","note":"Describes what 'checking' actually means for most of this cohort: a plausibility glance, not a recomputation. Worth holding against P03, who genuinely recomputes the requirement and compares. These are both logged identically as time spent before confirming.","stance":"conditional"},{"id":"P28/manual_override/1685","pid":"P28","expert":false,"theme":"manual_override","at":1685,"text":"I'm trying to be more defensive in the strategy, so I'm trying to reserve more and more drones in the base rather than send them out to finish the task quickly, because I cannot predict when the next task will appear.","note":"Cross-mission reserve held against arrival uncertainty -- the same motive as P22 and P24, here stated as hedging against the Poisson arrival process rather than against a known upcoming demand.","stance":"conditional"},{"id":"P28/real_world_transfer/2083","pid":"P28","expert":false,"theme":"real_world_transfer","at":2083,"text":"One thing we should take care of is to prepare sufficient drones, because if someone sees a drone flying here and sends some signal, like saying 'hey, I'm here', and the drone says 'okay, I saw you' and then I leave, because we have no sufficient drones -- it will make people very disappointed.","note":"Notices that the all-or-nothing allocation rule (a mission cannot be started unless every task is covered) has a humane cost that the scoring does not represent: partial response is worse than none in the model, and better than none to the person on the ground.","stance":""},{"id":"P29/manual_override/1469","pid":"P29","expert":false,"theme":"manual_override","at":1469,"text":"I thought sometimes the AI would take kind of a long time to generate an answer, which was good on more complicated missions where you had to assign lots of different colours and think about how many spares you needed. But when it was just one colour, I could just count how many is necessary and then add one extra more, and that was usually enough. So it was faster for me to just click manual and then click it three times, or however many it was.","note":"KEY, and the single most important quote for interpreting the Manual rate. Manual here is a LATENCY-AVOIDANCE move, not a trust judgement: the strategic cards take a fixed 4.0-5.0 s to reveal, so on a one-colour mission the operator can finish before the agent has spoken. That makes the Manual share partly a function of injected delay against mission simplicity -- and it predicts more Manual in exactly the scenario with more, simpler missions. See NARRATION.md, 'Finding: the two tiers are not equally cheap to consult'.","stance":"conditional"},{"id":"P29/verification/1559","pid":"P29","expert":false,"theme":"verification","at":1559,"text":"I mostly trusted it, although I did kind of want to test it more at the beginning -- like comparing it, doing a few manual ones myself to see whether it would be better, faster.","note":"KEY. Manual allocation as a deliberate BENCHMARKING experiment: he builds his own plan specifically to compare it against the agent's. A third distinct meaning of the same logged action, after latency-avoidance (above) and interpolation between cards (P17, P22, P28). Early-session Manual is evidence of active evaluation, which is close to the opposite of what a reliance measure reads into it.","stance":"conditional"},{"id":"P29/trust_trajectory/1586","pid":"P29","expert":false,"theme":"trust_trajectory","at":1586,"text":"It was kind of hard to keep track of which tasks were being finished when, but I noticed that the ones that failed were normally because I'd just done a manual one. So I guess that made me want to use the AI more often.","note":"Trust accruing from an outcome comparison he ran himself -- and note the comparison is confounded: he did manual allocations on the missions he judged simple, so any failure there is not like-for-like. The belief is reasonable and the evidence is not, and neither he nor the logs can tell.","stance":"conditional"},{"id":"P29/agent_comparison/1720","pid":"P29","expert":false,"theme":"agent_comparison","at":1720,"text":"Sometimes it would send more than I would have, but then you kind of saw that that was a good thing, because when I sent it myself it would sometimes have to abort.","note":"IMPORTANT COUNTERWEIGHT to the over-allocation complaints from P13, P17, P21, P28 and P36. P29 made the same criticism, experienced the cost of under-committing, and revised. The strategic tier's redundancy is not simply waste, and at least one participant worked that out from outcomes -- which is an argument for giving operators the failure base rate they keep asking for.","stance":"conditional"},{"id":"P29/verification/1693","pid":"P29","expert":false,"theme":"verification","at":1693,"text":"I can't say I was completely checking everything I did. But I think it was quite good suggestions most of the time, and even if maybe a human would do it better in some occasions, overall I think it's better.","note":"Prompted admission of incomplete verification, followed immediately by a quality claim the incomplete verification cannot support -- the same move as P24 and P26. Three participants show this pattern: concede they did not check, then justify not checking by asserting reliability.","stance":"conditional"},{"id":"P29/general_ai_disposition/1656","pid":"P29","expert":false,"theme":"general_ai_disposition","at":1656,"text":"With emergency scenarios it's best to just get something going, even if it's not the most perfect plan. And AI lets you do that quite quickly. [...] I think it's a good thing to have that option, even if they don't want to use it.","note":"Speed over optimality, as with P22, P24 and P36 -- and a distinct addition: value in the option existing whether or not it is exercised.","stance":"conditional"},{"id":"P30/agent_comparison/1349","pid":"P30","expert":false,"theme":"agent_comparison","at":1349,"text":"I think it needs a bit more of a human element [at the strategic tier], because obviously it's unpredictable, so you kind of have to have that human element where you're like, I need to anticipate things. But when it's already there -- yeah, then it's like, okay, this is what you have, optimise it within your resources.","note":"KEY, and the cleanest principled account in the corpus of why the two tiers are treated differently. The strategic decision is made under uncertainty about what arrives next and therefore needs anticipation; the tactical decision is a closed optimisation over resources already committed and therefore does not. That is a property of the DECISIONS, not of the assistants -- and it predicts the tier asymmetry without reference to trust at all. Sits alongside P14/P22 (verification cost) and P29 (latency) as a third structural explanation.","stance":"prefers_tactical"},{"id":"P30/verification/1405","pid":"P30","expert":false,"theme":"verification","at":1405,"text":"Roughly you should look how many, which ones you need, how many you need, and then you see how many are being deployed, and then you work from that.","note":"KEY, and it reframes the latency finding. P30 spends the strategic card's 4-5 s reveal delay forming his own independent estimate, then compares the card against it when it appears. For him the injected delay is not dead time -- it is the verification window, and it enforces an independent judgement before the anchor is visible. P29 treats the same delay as pure cost and goes Manual to escape it. The delay therefore has opposite effects on two participants' reliance, which is worth knowing before anyone tunes it. Confirmed by P30 when the researcher described the behaviour back to him.","stance":"conditional"},{"id":"P30/agent_comparison/1375","pid":"P30","expert":false,"theme":"agent_comparison","at":1375,"text":"Sometimes I do think it is suggesting well in terms of numbers, but I just think, looking forward, I do need to save a bit just in case -- there's some sort of buffer that you need, just in case something happens, you need them here as well.","note":"Cross-mission reserve as the reason for overriding a card he considers correct. Same motive as P22, P24, P28 -- now five participants overriding the strategic tier for the one thing it structurally cannot see.","stance":"conditional"},{"id":"P30/agent_comparison/1540","pid":"P30","expert":false,"theme":"agent_comparison","at":1540,"text":"It was so quick -- I just need to click suggest and I can focus on this, and it just suggests, and I trust it. It's much easier to then give it resources and allow it to optimise, rather than [have it] choose its resources.","note":"States the division of labour as a preference about CONTROL OF RESOURCES rather than about competence: he is content to delegate optimisation, not commitment. The same split P36 describes from the other end when he says the strategic tier over-allocates and he would retune its policy rather than take it back.","stance":"prefers_tactical"},{"id":"P30/real_world_transfer/1478","pid":"P30","expert":false,"theme":"real_world_transfer","at":1478,"text":"If this was just more advanced, it'd have a bit more anticipation of what's going to come up further. I think that'll be good. [...] Especially in American stuff there's all these wildfires, and having something like this that could essentially respond to a situation very quickly, very easily -- I think that'll be good.","note":"His one design ask is exactly the myopia he identified: give the strategic tier lookahead. Consistent with his account above of why that tier still needs a human.","stance":"conditional"},{"id":"P31/general_ai_disposition/1697","pid":"P31","expert":false,"theme":"general_ai_disposition","at":1697,"text":"If you look at it entirely from the perspective of option A, option B, and option A saves more lives, that always seems like a good thing. But taking it a bit less simplified, you've got to make moral judgments about how these resources are being allocated. If someone's life failed to be saved, under a completely human system you'd have some sort of accountability -- of who was on the job that failed to save your life. Whereas if it's an AI system, even if it performs on average better than a human, that accountability just isn't there.","note":"KEY. The strongest accountability argument in the corpus, and it explicitly concedes superior average performance before rejecting it as sufficient. Same concern as P22 and P24, stated as a structural gap rather than a preference. Note how it interacts with P24's position: she requires a human present even when that human demonstrably cannot check -- which is precisely the accountability shell P31 says is missing.","stance":"conditional"},{"id":"P31/verification/1807","pid":"P31","expert":false,"theme":"verification","at":1807,"text":"They both could have used a little bit of nudging. Then again -- was the nudging that I was doing improving things or making them worse? I have no feedback on that, so I don't actually know.","note":"KEY. He cannot tell whether his own overrides helped, because nothing in the task tells him. That is true of every participant: the score is aggregate and delayed, and no counterfactual is ever shown. It means override behaviour cannot be calibrated by experience, and it undermines any reading of late-session reliance as 'learned' trust -- there is nothing to learn from.","stance":"conditional"},{"id":"P31/verification/1902","pid":"P31","expert":false,"theme":"verification","at":1902,"text":"The checking should have been necessary, but the practicality is that in the very beginning I was doing too much checking and feeling the negative impacts of that, and by the end possibly doing not enough checking for the point optimisation. It was all about finding a balance between them.","note":"Verification explicitly optimised against the score rather than against risk, and drifting DOWN across the session. Directly opposite to P17, whose checking drifted up as he learned what to look for. Both are described as learning.","stance":"conditional"},{"id":"P31/agent_comparison/1967","pid":"P31","expert":false,"theme":"agent_comparison","at":1967,"text":"The ordering of the tasks didn't seem logical. I feel like the individual drones were picking tasks left to right -- drone one, drone two, drone three, task one, task two, task three -- whereas they could have been doing a Dijkstra's or something, get the lowest possible fly time between them.","note":"A correct, unprompted diagnosis of the TACTICAL tier's actual limitation, and the only one in the corpus. greedyAssign orders by task constraint and points, not by travel distance, and the researcher confirms it on the record afterwards. Worth noting against the strategic-tier defect: participants reported the Conservative stray-colour problem six times, and the tactical routing weakness once. That asymmetry in DETECTABILITY is itself a finding -- the strategic card's error is visible in three numbers, the tactical plan's requires reconstructing a route.","stance":"conditional"},{"id":"P31/agent_comparison/1939","pid":"P31","expert":false,"theme":"agent_comparison","at":1939,"text":"With the strategic tool, that was pretty much doing anything that I would have wanted it to do -- even if it was recommending something and then I was tweaking it afterwards, I was tweaking it knowing that that recommendation was a pretty decent starting place.","note":"Fourth statement of the anchor-and-edit pattern, after P04, P19 and P30. He rates the tier highly WHILE overriding it, and says the override does not contradict the rating. A reliance measure that counts Manual against the agent gets this exactly backwards.","stance":"conditional"},{"id":"P31/general_ai_disposition/1571","pid":"P31","expert":false,"theme":"general_ai_disposition","at":1571,"text":"The fact that it's like, quote unquote, AI -- it very easily could have been just like a dozen lines of code that do a little bit of manual rules-based allocation. So I'm not sure whether the machine learning or language model side of things at all was involved there.","note":"Like P04, he interrogates what is actually behind the label and adjusts accordingly. Both are right: the assistants are simple heuristics. Since the UI never says 'AI' or 'algorithm' (CLAUDE.md constraint 3), what participants BELIEVE they are relying on is an uncontrolled variable, and at least two of them formed a specific and accurate belief that shaped their behaviour.","stance":"conditional"},{"id":"P31/real_world_transfer/2046","pid":"P31","expert":false,"theme":"real_world_transfer","at":2046,"text":"This is software and research going into using drone swarms for search and rescue and broadly positive things in the world, but as with all fields of research, doing more research in this field will inevitably lead to it being used in military. [...] As we've seen in the Russia-Ukraine war, drones have entirely revolutionised...","note":"Raises the dual-use objection unprompted, as the one thing he wanted to add. Worth placing directly beside P36, the serving officer, who wants exactly this in front of staff officers. The corpus contains both the concern and its realisation.","stance":"conditional"},{"id":"P31/overall_experience/1750","pid":"P31","expert":false,"theme":"overall_experience","at":1750,"text":"The top advantage in this situation was the speed of response. If you were to challenge yourself to play through this game and not use any of the automation systems, you'd get massively overwhelmed with the number of missions, the individual tasks within the missions, and you'd just rack up a lot more negative points. [...] The tactical layer required a little bit more human intervention than the strategic layer.","note":"Rates both tiers as necessary, and judges the tactical tier as needing more intervention -- the opposite ranking to most of the cohort, and consistent with his being the only participant to spot the routing weakness.","stance":""},{"id":"P32/agent_comparison/1425","pid":"P32","expert":false,"theme":"agent_comparison","at":1425,"text":"I think I developed a stronger opinion on how much to trust each of them, by comparing them to what I would have done. I understood the task more as I went. So the tactical one seemed to be doing what I was doing, quite reliably -- and obviously the strategic one wasn't. So it was very much comparing them to what I do, and then letting the tactical one get on with it.","note":"KEY, and it supplies a mechanism connecting two other findings. He calibrates trust by AGREEMENT WITH HIS OWN SOLUTION. The tactical agent solves the same closed problem he would, so it matches and earns trust; the strategic agent deliberately commits redundancy no operator would choose, so it systematically fails this test regardless of whether it is right. If this calibration rule is common, the strategic tier cannot win: its design guarantees disagreement. Sits directly alongside P03, whose benchmark is his own minimum count, and who reaches the same verdict by the same route.","stance":"prefers_tactical"},{"id":"P32/scenario_comparison/1497","pid":"P32","expert":false,"theme":"scenario_comparison","at":1497,"text":"I was using it more because it was quicker, and I thought then they won't all back up, so I'll be making better use of my drones -- they won't be sat there waiting for me. Whereas in the second one, where I was well on top of it, I had more time to be checking in more detail. [...] Very much about workload.","note":"States explicitly that his reliance tracked workload rather than mission difficulty -- and that he was not really assessing how hard individual missions were at all. Same direction as P11 and P18. Note the reason given for delegating: keeping drones moving, i.e. throughput, not decision quality.","stance":"conditional"},{"id":"P32/real_world_transfer/1593","pid":"P32","expert":false,"them
