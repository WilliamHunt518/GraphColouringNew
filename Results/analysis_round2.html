:"C22","source":"debrief","at":"0:23:52","led":0,"text":"And I mean, I understood the task more as I went."},{"pid":"P32","code":"C27","source":"debrief","at":"0:26:49","led":0,"text":"I'd want more analytics on, I guess, like drone utilization and mission success. I feel like that would be a good place to be making these decisions."},{"pid":"P32","code":"C27","source":"debrief","at":"0:27:21","led":0,"text":"I'd want to understand empirically actually how it was performing, who should be doing what."},{"pid":"P33","code":"C04","source":"debrief","at":"0:27:33","led":1,"text":"So, more about speed than necessarily being better than you. It just is really quick. Yeah."},{"pid":"P33","code":"C11","source":"debrief","at":"0:27:33","led":0,"text":"I think the first one, I feel the pace is very, very fast. So, I can't do it very well in a very short time. So, I used a lot of AI suggestions."},{"pid":"P33","code":"C12","source":"debrief","at":"0:26:48","led":0,"text":"In the second one, I found a lot of drones wasted here."},{"pid":"P33","code":"C12","source":"debrief","at":"0:27:13","led":0,"text":"They assigned more drones than needed."},{"pid":"P33","code":"C12","source":"debrief","at":"0:28:11","led":0,"text":"They're not necessary to be there. They were assigned."},{"pid":"P33","code":"C15","source":"debrief","at":"0:26:48","led":0,"text":"In the second one, I found a lot of drones wasted here."},{"pid":"P33","code":"C15","source":"debrief","at":"0:29:49","led":0,"text":"Yeah, in the first test I don't have enough time to fill it in."},{"pid":"P33","code":"C17","source":"debrief","at":"0:28:24","led":0,"text":"So, if I have enough time or I get more familiar with this system, I will have a check."},{"pid":"P33","code":"C17","source":"debrief","at":"0:29:49","led":0,"text":"Yeah, in the first test I don't have enough time to fill it in."},{"pid":"P34","code":"C03","source":"interview","at":"para3","led":0,"text":"\u201cWhen they only needed a single colour of drone I tended to do it manually\u201d"},{"pid":"P34","code":"C04","source":"interview","at":"para4","led":0,"text":"More about speed than accuracy (tactical is faster)"},{"pid":"P34","code":"C05","source":"interview","at":"para5","led":0,"text":"Assistants helped multitasking a lot."},{"pid":"P35","code":"C03","source":"debrief","at":"0:28:49","led":0,"text":"Yeah, because the time is limited. So if the task is too complicated, so I will rely more on AI, whether it gave me the right answer or not."},{"pid":"P35","code":"C04","source":"debrief","at":"0:28:49","led":1,"text":"So it's really a speed versus accuracy trade-off thing for you. Yeah. Yes. Yes."},{"pid":"P35","code":"C11","source":"debrief","at":"0:28:19","led":0,"text":"But in an urgent situation and the number of the swarm is not enough, so I need to consider about the strategies and I think I need the help of AI assistant."},{"pid":"P35","code":"C12","source":"debrief","at":"0:29:53","led":0,"text":"sometimes the mission don't need the blue one, and it suggests me to allocate two or three blue ones to that task and it's easier to find it out."},{"pid":"P35","code":"C17","source":"debrief","at":"0:29:17","led":0,"text":"I will choose to just trust it. But if I have enough time... I think I will maybe check twice or I think more on myself and then read that."},{"pid":"P35","code":"C17","source":"debrief","at":"0:30:23","led":0,"text":"But sometimes when there are too many tasks in a mission. Yeah. Yeah. And I think maybe I don't have time to check it."},{"pid":"P35","code":"C25","source":"debrief","at":"0:30:58","led":0,"text":"It's better if there are AI systems with humans, I think it can help a lot."},{"pid":"P35","code":"C25","source":"debrief","at":"0:31:23","led":0,"text":"although the AI give you the suggestion, don't rely on it, even if in an urgent situation."},{"pid":"P36","code":"C01","source":"debrief","at":"0:33:43","led":0,"text":"I'm very visual so looking at a glance yes it's allocated what I needed to allocate it cool let's start running with it"},{"pid":"P36","code":"C08","source":"debrief","at":"0:31:32","led":0,"text":"but then I probably just tweak the AI do stop over allocating resource just give me this give me if it's a critical task give me two reserve if it's a moderate task give me one"},{"pid":"P36","code":"C08","source":"debrief","at":"0:39:26","led":0,"text":"and then a human's going in and going give me something between that one and that one because i don't like that one for this and i don't like that one for that"},{"pid":"P36","code":"C12","source":"debrief","at":"0:31:32","led":0,"text":"for the strategic a lot of it's a lot of over allocation of resource"},{"pid":"P36","code":"C26","source":"debrief","at":"0:36:43","led":0,"text":"as long as you have trust in how they've come up with those answers then you're going to and if it looks right because you've gone through the process yourself"},{"pid":"P36","code":"C26","source":"debrief","at":"0:39:55","led":0,"text":"i think one of the good things about ai is that you can have an agent whose only job is to go and red team all of your outputs very quickly"},{"pid":"P36","code":"C27","source":"debrief","at":"0:31:32","led":0,"text":"the big thing that's missing in those sorts of things is data [\u2026] when I did allocate resources in that way and I ran that stochastically like a thousand times this is how many times my task failed"}],"preference":{"counts":{"tactical":17,"strategic":7,"conditional":4,"both":3,"none":2},"who":{"both":["P14","P25","P34"],"conditional":["P02","P18","P29","P35"],"none":["P28","P36"],"strategic":["P06","P07","P10","P11","P12","P20","P31"],"tactical":["P01","P03","P04","P05","P13","P15","P16","P17","P19","P21","P22","P24","P26","P27","P30","P32","P33"]}}},"extras":{"generated":"2026-10-08 11:14","fingerprint":{"n":33,"features":[{"k":"took","label":"Takes the strategy card"},{"k":"preempt","label":"Goes manual before the cards load"},{"k":"edit","label":"Edits a car /* Shared by findings_synthesis_template.html and findings_brief_template.html; the builder
   inlines it at the COMMON_JS marker, straight after `const DATA`. Chart forms, content helpers,
   the data shorthands (C, S, N, SR, DP) and the hover glossary all live here so the two pages
   draw the same charts and define every term the same way. */
/* ───────────────────────── tiny DOM + SVG helpers ───────────────────────── */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, host) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (host) host.appendChild(n);
  return n;
}
function h(tag, attrs = {}, host) {
  const n = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'html') n.innerHTML = attrs[k];
    else if (k === 'text') n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  if (host) host.appendChild(n);
  return n;
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const pct = (v, d = 1) => (100 * v).toFixed(d) + '%';
const num = (v, d = 1) => v == null || isNaN(v) ? '—' : (+v).toFixed(d);
const sgn = (v, d = 2) => (v >= 0 ? '+' : '') + (+v).toFixed(d);
function pval(p) {
  if (p == null || isNaN(p)) return '—';
  if (p < 0.001) return 'p < .001';
  return 'p = ' + p.toFixed(3).replace(/^0/, '');
}
/* p-value tiers, by the conventional thresholds: < .001, < .01, < .05, < .10 (marginal), ≥ .10. */
function pTier(p) {
  if (p == null || isNaN(p)) return '';
  return p < 0.001 ? 'p1' : p < 0.01 ? 'p2' : p < 0.05 ? 'p3' : p < 0.10 ? 'p4' : 'pns';
}
const P_TIER_LABEL = { p1: 'p < .001', p2: 'p < .01', p3: 'p < .05', p4: 'p < .10 (marginal)', pns: 'p ≥ .10 (not significant)' };
const pColour = p => { const t = pTier(p); return t === 'pns' || !t ? css('--ink-3') : css('--' + t); };
function pClass(p) { return (p != null && p < 0.05 ? 'sig' : 'ns') + ' pv ' + pTier(p); }
/* HTML for a p-value, already coloured. */
const pv = (p, label = 'p') => p == null || isNaN(p) ? '—'
  : `<span class="pv ${pTier(p)}" title="${P_TIER_LABEL[pTier(p)]}">${pval(p).replace(/^p/, label).replace("<", "&lt;")}</span>`;

/* Every p- or q-value written anywhere on a page ("p = .004", "p < .001", "q = .04", "p .07") is wrapped and
   coloured by tier, so no template has to remember to. SVG <text> gets a fill instead. Runs once the page has
   rendered and again on anything added later (tooltips, the model explorer). */
const P_RX = /(^|[\s(\[,;·:—–-])((?:adj(?:usted)?\.?\s+|Holm[- ]adjusted\s+|calibrated\s+|one-sided\s+|exact\s+)?(?:p|q))(\s*(?:=|<|≤|≈)\s*|\s+)(0?\.\d+|0|1(?:\.0+)?)(?![\d.])/g;
function tierFromMatch(op, v) {
  let x = parseFloat(v);
  if (/[<≤]/.test(op)) x -= 1e-9;
  return pTier(x);
}
function colourTextNode(n) {
  const t = n.nodeValue;
  P_RX.lastIndex = 0;
  if (!P_RX.test(t)) return;
  P_RX.lastIndex = 0;
  const frag = document.createDocumentFragment();
  let last = 0, m;
  while ((m = P_RX.exec(t))) {
    const start = m.index + m[1].length;
    // a bare space separator ("p .07") only counts when the number starts with a point
    if (!/[=<≤≈]/.test(m[3]) && !/^\./.test(m[4])) continue;
    frag.appendChild(document.createTextNode(t.slice(last, start)));
    const tier = tierFromMatch(m[3], m[4]);
    const sp = document.createElement('span');
    sp.className = 'pv ' + tier;
    sp.title = P_TIER_LABEL[tier] || '';
    sp.textContent = t.slice(start, m.index + m[0].length);
    frag.appendChild(sp);
    last = m.index + m[0].length;
  }
  if (!last) return;
  frag.appendChild(document.createTextNode(t.slice(last)));
  n.parentNode.replaceChild(frag, n);
}
function colourPValues(root) {
  if (!root || !root.ownerDocument && root !== document) return;
  const svgText = root.querySelectorAll ? root.querySelectorAll('svg text') : [];
  svgText.forEach(tx => {
    const m = /^\s*(?:p|q)\s*(=|<|≤)\s*(0?\.\d+|0|1)\s*$/.exec(tx.textContent);
    if (m) { const tier = tierFromMatch(m[1], m[2]); tx.setAttribute('fill', tier === 'pns' ? css('--ink-3') : css('--' + tier));
             tx.setAttribute('font-weight', tier === 'pns' ? 400 : 600); }
  });
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => {
      const pa = n.parentNode;
      if (!pa || pa.closest && pa.closest('script,style,svg,.pv,textarea,code')) return NodeFilter.FILTER_REJECT;
      return /[pq]/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    } });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(colourTextNode);
}
function pKey(host, before) {
  const d = document.createElement('div');
  d.className = 'pkey';
  d.innerHTML = 'p-values coloured by threshold: ' + ['p1', 'p2', 'p3', 'p4', 'pns']
    .map(t => `<span class="pv ${t}">${P_TIER_LABEL[t]}</span>`).join(' ');
  if (before) host.insertBefore(d, before); else host.appendChild(d);
  return d;
}
window.addEventListener('DOMContentLoaded', () => {
  const mainEl = document.getElementById('main');
  if (!mainEl) return;
  colourPValues(mainEl);
  const meta = mainEl.querySelector('p.meta');
  if (meta && mainEl.querySelector('.pv')) pKey(mainEl, meta.nextSibling);
  let queued = false;
  const pending = new Set();
  new MutationObserver(muts => {
    muts.forEach(mu => mu.addedNodes.forEach(n => { if (n.nodeType === 1 && !n.classList.contains('pv')) pending.add(n); }));
    if (!queued && pending.size) {
      queued = true;
      requestAnimationFrame(() => { queued = false; const xs = [...pending]; pending.clear(); xs.forEach(colourPValues); });
    }
  }).observe(document.body, { childList: true, subtree: true });
});

/* tooltip */
const tip = $('tip');
function showTip(e, html, wide) {
  tip.innerHTML = html;
  tip.classList.toggle('wide', !!wide);
  tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 10;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y < 8) y = e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function hoverable(node, html) {
  node.addEventListener('mousemove', e => showTip(e, html));
  node.addEventListener('mouseleave', hideTip);
}

function svgRoot(host, w, hgt) {
  host.innerHTML = '';
  const s = el('svg', { viewBox: `0 0 ${w} ${hgt}`, role: 'img' }, host);
  return s;
}
function legend(host, items) {
  const l = h('div', { class: 'legend' }, host);
  items.forEach(it => {
    const s = h('span', {}, l);
    h('i', { style: `background:${it.color}` }, s);
    h('span', { text: it.label }, s);
  });
  return l;
}
function tableFor(host, cols, rows, label) {
  const d = h('details', { class: 'tbl' }, host);
  h('summary', { text: label || 'Show the numbers' }, d);
  const t = h('table', {}, d);
  const thead = h('thead', {}, t), tr = h('tr', {}, thead);
  cols.forEach((c, i) => h('th', { text: c, class: i ? 'num' : '' }, tr));
  const tb = h('tbody', {}, t);
  rows.forEach(r => {
    const x = h('tr', {}, tb);
    r.forEach((v, i) => {
      const td = h('td', { text: v && v.g ? v.text : v, class: i ? 'num' : '' }, x);
      if (v && v.g) glNode(td, v.g);
    });
  });
}

/* ───────────────────────── chart forms ───────────────────────── */

/* Horizontal bars: one series, magnitude by category. Direct-labelled, no legend needed. */
function barsH(host, rows, o = {}) {
  const W = 700, rowH = o.rowH || 30, padL = o.padL || 150, padR = 66, padT = 6;
  const H = padT + rows.length * rowH + 8;
  const s = svgRoot(host, W, H);
  const max = o.max != null ? o.max : Math.max(...rows.map(r => r.value)) * 1.06 || 1;
  const x = v => padL + (W - padL - padR) * (v / max);
  rows.forEach((r, i) => {
    const y = padT + i * rowH, bh = Math.min(15, rowH - 12);
    el('text', { x: padL - 10, y: y + rowH / 2 + 4, 'text-anchor': 'end',
                 fill: css('--ink-2'), 'font-size': 12.5 }, s).textContent = r.label;
    el('rect', { x: padL, y: y + (rowH - bh) / 2, width: Math.max(0, x(r.value) - padL), height: bh,
                 rx: 4, fill: r.color || css('--mark') }, s);
    const t = el('text', { x: x(r.value) + 8, y: y + rowH / 2 + 4, fill: css('--ink-2'),
                           'font-size': 12, 'font-family': css('--mono') }, s);
    t.textContent = o.fmt ? o.fmt(r.value) : pct(r.value);
    const hit = el('rect', { x: padL, y, width: W - padL - padR, height: rowH, fill: 'transparent' }, s);
    hoverable(hit, `<b>${r.label}</b><br>${o.fmt ? o.fmt(r.value) : pct(r.value)}${r.sub ? '<br>' + r.sub : ''}`);
  });
  el('line', { x1: padL, y1: padT, x2: padL, y2: H - 8, stroke: css('--line'), 'stroke-width': 1 }, s);
}

/* Grouped vertical bars: a few series across a few categories. */
function barsGrouped(host, cats, series, o = {}) {
  const W = 700, H = o.height || 250, padL = 52, padB = 40, padT = 14, padR = 10;
  const s = svgRoot(host, W, H);
  const all = series.flatMap(se => se.values.filter(v => v != null));
  const max = o.max != null ? o.max : Math.max(...all) * 1.12;
  const min = o.min || 0;                          // a negative min lets bars grow down from zero
  const y = v => H - padB - (H - padB - padT) * ((v - min) / (max - min));
  const bandW = (W - padL - padR) / cats.length;
  const gap = 2, bw = Math.min(42, (bandW - 26 - gap * (series.length - 1)) / series.length);
  // `o.ticks` is the number of INTERVALS, so n+1 gridlines are drawn and the top one lands on the
  // maximum. (Written as `Array(o.ticks || 4 + 1)` it parsed as `o.ticks || 5`, which made a
  // caller-supplied count both the divisor and one short of its own gridline count; the default of
  // 4 is unchanged by the fix.)
  const nTicks = o.ticks == null ? 4 : o.ticks;
  nTicks && [...Array(nTicks + 1).keys()].forEach(i => {
    const v = min + (max - min) * i / nTicks;
    el('line', { x1: padL, x2: W - padR, y1: y(v), y2: y(v), stroke: css(v === 0 && min < 0 ? '--ink-3' : '--grid'), 'stroke-width': 1 }, s);
    el('text', { x: padL - 8, y: y(v) + 4, 'text-anchor': 'end', fill: css('--ink-3'),
                 'font-size': 11, 'font-family': css('--mono') }, s).textContent = o.fmt ? o.fmt(v) : num(v, 0);
  });
  cats.forEach((c, ci) => {
    const cx = padL + bandW * ci + bandW / 2;
    el('text', { x: cx, y: H - padB + 17, 'text-anchor': 'middle', fill: css('--ink-2'),
                 'font-size': 12 }, s).textContent = c;
    const total = series.length * bw + gap * (series.length - 1);
    series.forEach((se, si) => {
      const v = se.values[ci];
      if (v == null) return;
      const bx = cx - total / 2 + si * (bw + gap);
      const y0 = y(Math.max(0, min));
      el('rect', { x: bx, y: Math.min(y(v), y0), width: bw, height: Math.abs(y0 - y(v)), rx: 4,
                   fill: se.color }, s);
      const t = el('text', { x: bx + bw / 2, y: v >= 0 ? y(v) - 5 : y(v) + 13, 'text-anchor': 'middle',
                             fill: css('--ink-2'), 'font-size': 11, 'font-family': css('--mono') }, s);
      t.textContent = o.fmt ? o.fmt(v) : num(v, 1);
      const hit = el('rect', { x: bx, y: padT, width: bw, height: H - padB - padT, fill: 'transparent' }, s);
      hoverable(hit, `<b>${se.label}</b><br>${c}: ${o.fmt ? o.fmt(v) : num(v, 1)}${se.subs && se.subs[ci] ? '<br>' + se.subs[ci] : ''}`);
    });
  });
  el('line', { x1: padL, x2: W - padR, y1: H - padB, y2: H - padB, stroke: css('--line') }, s);
}

/* 100% stacked bars, one row per category. 2px surface gap between segments. */
function barsStacked(host, rows, keys, o = {}) {
  const W = 700, rowH = 40, padL = o.padL || 120, padR = 12, padT = 4;
  const H = padT + rows.length * rowH + 6;
  const s = svgRoot(host, W, H);
  const span = W - padL - padR;
  rows.forEach((r, i) => {
    const y = padT + i * rowH, bh = 20;
    el('text', { x: padL - 10, y: y + rowH / 2 + 4, 'text-anchor': 'end', fill: css('--ink-2'),
                 'font-size': 12.5 }, s).textContent = r.label;
    let acc = 0;
    keys.forEach(k => {
      const v = r.values[k.key] || 0;
      if (v <= 0) return;
      const x0 = padL + span * acc, w = span * v;
      el('rect', { x: x0, y: y + (rowH - bh) / 2, width: Math.max(0, w - 2), height: bh, rx: 3,
                   fill: k.color }, s);
      if (w > 44) {
        el('text', { x: x0 + w / 2 - 1, y: y + rowH / 2 + 4, 'text-anchor': 'middle',
                     fill: k.ink || '#fff', 'font-size': 11, 'font-family': css('--mono') }, s)
          .textContent = pct(v, 0);
      }
      const hit = el('rect', { x: x0, y: y + (rowH - bh) / 2, width: Math.max(0, w - 2), height: bh,
                               fill: 'transparent' }, s);
      hoverable(hit, `<b>${k.label}</b><br>${r.label}: ${pct(v)}${r.sub ? '<br>' + r.sub : ''}`);
      acc += v;
    });
  });
}

/* Diverging bars around a zero baseline. One series; polarity carried by position, so no
   second hue is introduced -- the sign is unambiguous and a legend would add nothing. */
function barsDiverging(host, rows, o = {}) {
  const W = 700, rowH = o.rowH || 36, padL = o.padL || 132, padR = 74, padT = 8;
  const H = padT + rows.length * rowH + 22;
  const s = svgRoot(host, W, H);
  const mx = Math.max(...rows.map(r => Math.abs(r.value))) * 1.25 || 1;
  const mid = padL + (W - padL - padR) / 2;
  const x = v => mid + ((W - padL - padR) / 2) * (v / mx);
  el('line', { x1: mid, y1: padT, x2: mid, y2: H - 22, stroke: css('--line'), 'stroke-width': 1.5 }, s);
  el('text', { x: mid, y: H - 6, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 11,
               'font-family': css('--mono') }, s).textContent = o.zeroLabel || 'same as the card';
  rows.forEach((r, i) => {
    const y = padT + i * rowH, bh = 16;
    el('text', { x: padL - 10, y: y + rowH / 2 + 4, 'text-anchor': 'end', fill: css('--ink-2'),
                 'font-size': 12.5 }, s).textContent = r.label;
    const x0 = Math.min(mid, x(r.value)), w = Math.abs(x(r.value) - mid);
    // A row can opt out of the ink: a correlation that does not survive correction is drawn in the
    // soft tone so the eye is not pulled to it. Magnitude still reads; emphasis does not.
    el('rect', { x: x0, y: y + (rowH - bh) / 2, width: w, height: bh, rx: 4,
                 fill: css(r.faint ? '--mark-soft' : '--mark') }, s);
    const right = r.value >= 0;
    const lab = o.fmt ? o.fmt(r.value) : sgn(r.value);
    el('text', { x: right ? x(r.value) + 8 : x(r.value) - 8, y: y + rowH / 2 + 4,
                 'text-anchor': right ? 'start' : 'end', fill: css('--ink-2'), 'font-size': 12,
                 'font-family': css('--mono') }, s).textContent = lab;
    const hit = el('rect', { x: padL, y, width: W - padL - padR, height: rowH, fill: 'transparent' }, s);
    hoverable(hit, `<b>${r.label}</b><br>${lab}${o.unit != null ? o.unit : ' drones'}`
      + `${r.sub ? '<br>' + r.sub : ''}`);
  });
}

/* Coefficient plot with confidence intervals -- for the three nested models. */
function forest(host, rows, o = {}) {
  const W = 700, rowH = 34, padL = o.padL || 210, padR = 90, padT = 12;
  const H = padT + rows.length * rowH + 48;
  const s = svgRoot(host, W, H);
  const lim = o.lim || Math.max(...rows.flatMap(r => [Math.abs(r.lo), Math.abs(r.hi)])) * 1.15 || 1;
  const mid = padL + (W - padL - padR) / 2;
  const half = (W - padL - padR) / 2;
  const x = v => mid + half * (v / lim);
  const base = padT + rows.length * rowH + 2;
  // A real axis: ticks in log-odds with the odds-ratio equivalent underneath, because "b = +0.30"
  // means nothing on its own. OR = e^b, so 0 -> 1.0 (no change in the odds).
  [-lim * 0.75, -lim * 0.375, 0, lim * 0.375, lim * 0.75].forEach(v => {
    el('line', { x1: x(v), x2: x(v), y1: padT - 4, y2: base, stroke: css('--grid'), 'stroke-width': 1 }, s);
    el('text', { x: x(v), y: base + 14, 'text-anchor': 'middle', fill: css('--ink-3'),
                 'font-size': 10.5, 'font-family': css('--mono') }, s).textContent = v.toFixed(1);
    el('text', { x: x(v), y: base + 27, 'text-anchor': 'middle', fill: css('--ink-3'),
                 'font-size': 10, 'font-family': css('--mono') }, s)
      .textContent = '×' + Math.exp(v).toFixed(2);
  });
  el('line', { x1: padL, x2: W - padR, y1: base, y2: base, stroke: css('--line') }, s);
  el('line', { x1: mid, y1: padT - 4, x2: mid, y2: base, stroke: css('--ink-3'), 'stroke-width': 1.5 }, s);
  el('text', { x: mid, y: padT - 8, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5,
               'font-family': css('--mono') }, s).textContent = 'no effect';
  el('text', { x: padL, y: base + 27, 'text-anchor': 'start', fill: css('--ink-3'), 'font-size': 10,
               'font-family': css('--mono') }, s).textContent = '← less likely';
  el('text', { x: W - padR, y: base + 27, 'text-anchor': 'end', fill: css('--ink-3'), 'font-size': 10,
               'font-family': css('--mono') }, s).textContent = 'more likely →';
  rows.forEach((r, i) => {
    const y = padT + i * rowH + rowH / 2;
    const lt = el('text', { x: padL - 12, y: y + 4, 'text-anchor': 'end', fill: css('--ink-2'),
                            'font-size': 12.5 }, s);
    lt.textContent = r.label;
    if (r.g) lt.setAttribute('data-g', r.g);
    const sig = r.p < 0.05;
    const col = sig ? css('--mark') : css('--mark-soft');
    el('line', { x1: x(r.lo), x2: x(r.hi), y1: y, y2: y, stroke: col, 'stroke-width': 2,
                 'stroke-linecap': 'round' }, s);
    el('circle', { cx: x(r.b), cy: y, r: 5, fill: col, stroke: css('--surface'), 'stroke-width': 2 }, s);
    el('text', { x: W - padR + 10, y: y + 4, fill: pColour(r.p), 'font-weight': r.p < 0.10 ? 600 : 400,
                 'font-size': 11.5, 'font-family': css('--mono') }, s).textContent = pval(r.p);
    const hit = el('rect', { x: padL, y: y - rowH / 2, width: W - padL - padR, height: rowH,
                             fill: 'transparent' }, s);
    hoverable(hit, `<b>${r.label}</b><br>odds ×${Math.exp(r.b).toFixed(2)} `
      + `[${Math.exp(r.lo).toFixed(2)}, ${Math.exp(r.hi).toFixed(2)}]<br>b = ${sgn(r.b, 3)} · ${pval(r.p)}`);
  });
}


/* Lines over an ordered x, with a marked event at x = 0. Crosshair + tooltip on hover. */
function linesAt(host, series, o = {}) {
  const W = 700, H = o.height || 270, padL = 48, padR = o.padR || 156, padT = 16, padB = 42;
  const s = svgRoot(host, W, H);
  const xs = [...new Set(series.flatMap(se => se.points.map(pt => pt.x)))].sort((a, b) => a - b);
  const x = v => padL + (W - padL - padR) * ((v - xs[0]) / Math.max(1, xs[xs.length - 1] - xs[0]));
  const y = v => H - padB - (H - padB - padT) * v;
  [0, .25, .5, .75, 1].forEach(v => {
    el('line', { x1: padL, x2: W - padR, y1: y(v), y2: y(v), stroke: css('--grid') }, s);
    el('text', { x: padL - 8, y: y(v) + 4, 'text-anchor': 'end', fill: css('--ink-3'),
                 'font-size': 11, 'font-family': css('--mono') }, s).textContent = pct(v, 0);
  });
  if (o.markZero !== false && xs[0] <= 0 && xs[xs.length - 1] >= 0) {
    el('line', { x1: x(0), x2: x(0), y1: padT - 6, y2: H - padB, stroke: css('--bad'),
                 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, s);
    el('text', { x: x(0), y: padT - 10, 'text-anchor': 'middle', fill: css('--bad'),
                 'font-size': 10.5, 'font-family': css('--mono') }, s)
      .textContent = o.zeroLabel || 'first illogical card';
  }
  xs.forEach(v => el('text', { x: x(v), y: H - padB + 17, 'text-anchor': 'middle',
                               fill: css('--ink-3'), 'font-size': 10.5,
                               'font-family': css('--mono') }, s)
    .textContent = (v > 0 ? '+' : '') + v);
  el('text', { x: (padL + W - padR) / 2, y: H - 6, 'text-anchor': 'middle', fill: css('--ink-3'),
               'font-size': 11 }, s).textContent = o.xLabel || 'decisions relative to that card';
  series.forEach(se => {
    const pts = se.points.slice().sort((a, b) => a.x - b.x);
    const d = pts.map((pt, i) => (i ? 'L' : 'M') + x(pt.x) + ' ' + y(pt.y)).join(' ');
    const pa = { d, fill: 'none', stroke: se.color, 'stroke-width': 2, 'stroke-linejoin': 'round',
                 'stroke-linecap': 'round', opacity: se.faint ? .5 : 1 };
    if (se.dash) pa['stroke-dasharray'] = '5 4';
    el('path', pa, s);
    pts.forEach(pt => {
      // a dashed (reference) series gets hollow markers so it never reads as data of the same kind
      el('circle', { cx: x(pt.x), cy: y(pt.y), r: se.dash ? 3 : 4, fill: se.dash ? css('--surface') : se.color,
                     stroke: se.dash ? se.color : css('--surface'), 'stroke-width': 1.5 }, s);
      const hit = el('circle', { cx: x(pt.x), cy: y(pt.y), r: 12, fill: 'transparent' }, s);
      hoverable(hit, '<b>' + se.label + '</b><br>' + (pt.x > 0 ? '+' : '') + pt.x + ': '
        + pct(pt.y) + (pt.n ? '<br>n = ' + pt.n : '') + (pt.tip ? '<br>' + pt.tip : ''));
    });
    const last = pts[pts.length - 1];
    el('text', { x: x(last.x) + 10, y: y(last.y) + 4, fill: se.color, 'font-size': 11.5,
                 'font-weight': 600 }, s).textContent = se.label;
  });
}

/* Paired slope chart: one line per participant between two conditions.
   Defaults to a 0-1 proportion axis labelled as percentages; `o.lo`/`o.hi`/`o.fmt`/`o.ticks` carry
   a scale that is not a proportion (the 1-7 trust scales) without touching the proportion callers. */
function slopes(host, pairs, o = {}) {
  const W = 700, H = o.height || 260, padT = 18, padB = 34, padL = 150, padR = 150;
  const s = svgRoot(host, W, H);
  const lo = o.lo != null ? o.lo : 0, hi = o.hi != null ? o.hi : 1;
  const fmt = o.fmt || (v => pct(v, 0));
  const y = v => H - padB - (H - padB - padT) * ((v - lo) / (hi - lo));
  const xa = padL, xb = W - padR;
  (o.ticks || [lo, (lo + hi) / 2, hi]).forEach(v => {
    el('line', { x1: xa - 30, x2: xb + 30, y1: y(v), y2: y(v), stroke: css('--grid') }, s);
    el('text', { x: xa - 40, y: y(v) + 4, 'text-anchor': 'end', fill: css('--ink-3'),
                 'font-size': 11, 'font-family': css('--mono') }, s).textContent = fmt(v);
  });
  pairs.forEach(pr => {
    const up = pr.b >= pr.a;
    el('line', { x1: xa, y1: y(pr.a), x2: xb, y2: y(pr.b), stroke: css('--mark-soft'),
                 'stroke-width': 1.5, opacity: .75 }, s);
    [[xa, pr.a], [xb, pr.b]].forEach(([cx, v]) =>
      el('circle', { cx, cy: y(v), r: 3.5, fill: css('--mark-soft') }, s));
    const hit = el('line', { x1: xa, y1: y(pr.a), x2: xb, y2: y(pr.b), stroke: 'transparent',
                             'stroke-width': 12 }, s);
    hoverable(hit, '<b>' + pr.label + '</b><br>' + o.aLabel + ': ' + fmt(pr.a) + '<br>'
      + o.bLabel + ': ' + fmt(pr.b));
  });
  const ma = pairs.reduce((s2, p) => s2 + p.a, 0) / pairs.length;
  const mb = pairs.reduce((s2, p) => s2 + p.b, 0) / pairs.length;
  el('line', { x1: xa, y1: y(ma), x2: xb, y2: y(mb), stroke: css('--s-strat'), 'stroke-width': 3,
               'stroke-linecap': 'round' }, s);
  [[xa, ma], [xb, mb]].forEach(([cx, v]) =>
    el('circle', { cx, cy: y(v), r: 6, fill: css('--s-strat'), stroke: css('--surface'),
                   'stroke-width': 2 }, s));
  el('text', { x: xa - 40, y: y(ma) - 12, 'text-anchor': 'end', fill: css('--s-strat'),
               'font-size': 11.5, 'font-weight': 600 }, s).textContent = 'mean ' + fmt(ma);
  el('text', { x: xb + 40, y: y(mb) - 12, 'text-anchor': 'start', fill: css('--s-strat'),
               'font-size': 11.5, 'font-weight': 600 }, s).textContent = 'mean ' + fmt(mb);
  [[xa, o.aLabel], [xb, o.bLabel]].forEach(([cx, lab]) =>
    el('text', { x: cx, y: H - 10, 'text-anchor': 'middle', fill: css('--ink-2'),
                 'font-size': 12 }, s).textContent = lab);
}

const Q = {};
DATA.narration.quotes.forEach(q => { Q[q.id] = q; });

/* What the participant was being asked when they said it. The theme is the CODER's label for the
   topic, not a record of what the operator was doing at that moment -- every quote on this page
   comes from the post-session debrief, after the task was over. See the standing note in the
   Reading section. */
const THEME_CONTEXT = {
  overall_experience: 'asked how they found the task',
  agent_comparison: 'asked to compare the two assistants',
  scenario_comparison: 'asked to compare the two scenarios',
  trust_trajectory: 'asked whether their reliance changed over time',
  verification: 'asked whether and how they checked the advice',
  manual_override: 'asked why they built allocations by hand',
  interface_legibility: 'on what they could not read or find',
  general_ai_disposition: 'asked about AI tools in general',
  real_world_transfer: 'asked whether this would work in practice',
  design_suggestions: 'asked what they would change',
};
const mmss = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;

function quote(host, id, opts = {}) {
  const q = Q[id];
  if (!q) { h('p', { class: 'note', text: 'missing quote: ' + id }, host); return; }
  const b = h('blockquote', q.expert ? { class: 'expert' } : {}, host);
  h('p', { text: '“' + (opts.trim || q.text) + '”' }, b);
  const a = h('span', { class: 'attr' }, b);
  a.innerHTML = `<span class="pid">${q.pid}</span> · post-session debrief, ${mmss(q.at)} into the `
    + `recording · ${THEME_CONTEXT[q.theme] || q.theme.replace(/_/g, ' ')}`;
  if (q.expert) h('span', { class: 'badge', text: 'CONSULTED EXPERT' }, a);
  return b;
}
function para(host, html) { h('p', { html }, host); }
function note(host, html) { h('div', { class: 'note', html }, host); }
let FINDING_N = 0;
function section(id, kicker, title) {
  const s = h('section', { id }, $('main'));
  const hd = h('div', { class: 'sec-head' }, s);
  // 'Finding' auto-numbers in document order; anything else is used verbatim. Hand-numbering
  // these desynced the moment a section moved, so the number is derived, never written down.
  h('div', { class: 'kicker', text: kicker === 'Finding' ? 'Finding ' + (++FINDING_N) : kicker }, hd);
  h('h2', { text: title }, hd);
  return s;
}
function card(host, title) {
  const c = h('div', { class: 'card' }, host);
  if (title) h('h4', { text: title }, c);
  return c;
}
function tiles(host, items) {
  const t = h('div', { class: 'tiles' }, host);
  items.forEach(i => {
    const d = h('div', { class: 'tile' }, t);
    h('span', { class: 'v', text: i.v }, d);

/* ───────── event-study lines, null strips, point-difference forests (combined + review pages) ───────── */
/* A row of toggle buttons; onPick(key) on click. opts: [[key, label], ...] */
function btnBar(host, label, opts, initial, onPick) {
  const bar = h('div', { class: 'btnrow' }, host);
  if (label) h('span', { class: 'btnlab', text: label }, bar);
  const bs = opts.map(([k, lab]) => {
    const b = h('button', { text: lab, class: k === initial ? 'on' : '' }, bar);
    b.onclick = () => { bs.forEach(x => x.classList.toggle('on', x === b)); onPick(k); };
    return b;
  });
  return bar;
}
/* What is behind one event-study dot, for its tooltip. */
const dotTip = pt => `${pt.people} people · missions averaging ${num(pt.ndrones, 1)} drones, ${num(pt.ntasks, 1)} tasks · `
  + `${pct(pt.three, 0)} three-type<br>${num(pt.queue, 1)} other missions waiting · minute ${num(pt.minute, 1)} · `
  + `${pct(pt.session2, 0)} from session 2<br>expected from mission, time, game and person: <b>${pct(pt.expected, 0)}</b>`;
const evX = rel => rel <= 0 ? rel - 1 : rel;   // the anchor sits at 0, between the last decision before and the first after
/* Event-study lines. groups: [{label, color, E}] (E = an extras2 event study). mode: 'obs' observed;
   'exp' observed + expected (dashed, hollow); 'adj' observed minus expected, put back on the overall level. */
function eventLines(host, groups, mode, o = {}) {
  const series = [];
  groups.forEach(g => {
    if (!g.E || !g.E.series.length) return;
    const pts = key => g.E.series.map(pt => ({ x: evX(pt.rel), y: pt[key], n: pt.n, tip: dotTip(pt) }));
    if (mode === 'adj') series.push({ label: g.label + ' (adj.)', color: g.color, points: pts('adjusted') });
    else series.push({ label: g.label, color: g.color, points: pts('rate') });
    if (mode === 'exp') series.push({ label: (g.short || g.label) + ' expected', color: g.color, dash: true, points: pts('expected') });
  });
  if (series.length) linesAt(host, series, Object.assign({ height: 290, padR: 130 }, o));
}
const EV_MODES = [['obs', 'Observed'], ['exp', 'Observed + expected'], ['adj', 'Adjusted']];
const EV_MODE_CAP = '<b>Observed</b>: the raw rate at each position. <b>Observed + expected</b>: the dashed hollow line is '
  + 'the rate a model predicts for exactly those decisions from what they were (drones, tasks and drone types the mission '
  + 'needed), when (minute of session, game) and who made them (each person’s rate on their other decisions) — a dot that '
  + 'jumps with its dashed partner was made of easy or hard missions, or of different people, not of a change in trust. '
  + '<b>Adjusted</b>: observed minus expected, put back on the overall level — what is left once mission, time and person '
  + 'are accounted for. Hover any dot for what it is made of.';

/* Differences in percentage points with 95% CIs, one row each; rows with {head} are group headings. */
function diffForest(host, rows, o = {}) {
  const W = 700, rowH = 28, padL = o.padL || 300, padR = 74, padT = 14;
  const H = padT + rows.length * rowH + 36;
  const s = svgRoot(host, W, H);
  const lim = o.lim || Math.max(0.1, ...rows.filter(r => !r.head).flatMap(r => [Math.abs(r.lo), Math.abs(r.hi)])) * 1.1;
  const x = v => padL + (W - padL - padR) * (v + lim) / (2 * lim);
  const base = padT + rows.length * rowH;
  [-lim, -lim / 2, 0, lim / 2, lim].forEach(v => {
    el('line', { x1: x(v), x2: x(v), y1: padT - 4, y2: base, stroke: v === 0 ? css('--ink-3') : css('--grid'),
                 'stroke-width': v === 0 ? 1.5 : 1 }, s);
    el('text', { x: x(v), y: base + 15, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5,
                 'font-family': css('--mono') }, s).textContent = (v > 0 ? '+' : '') + (100 * v).toFixed(0);
  });
  el('text', { x: x(0), y: base + 30, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5 }, s)
    .textContent = o.xLabel || 'change after, percentage points';
  rows.forEach((r, i) => {
    const y = padT + i * rowH + rowH / 2;
    if (r.head) {
      el('text', { x: 8, y: y + 4, fill: css('--ink'), 'font-size': 12, 'font-weight': 600 }, s).textContent = r.head;
      return;
    }
    el('text', { x: padL - 10, y: y + 4, 'text-anchor': 'end', fill: css('--ink-2'), 'font-size': 12 }, s).textContent = r.label;
    const col = r.p < 0.05 ? (r.color || css('--mark')) : css('--mark-soft');
    el('line', { x1: x(Math.max(-lim, r.lo)), x2: x(Math.min(lim, r.hi)), y1: y, y2: y, stroke: col, 'stroke-width': 2,
                 'stroke-linecap': 'round' }, s);
    el('circle', { cx: x(r.est), cy: y, r: 4.5, fill: col, stroke: css('--surface'), 'stroke-width': 2 }, s);
    el('text', { x: W - padR + 8, y: y + 4, fill: pColour(r.p), 'font-weight': r.p < 0.10 ? 600 : 400, 'font-size': 11,
                 'font-family': css('--mono') }, s).textContent = pval(r.p);
    const hit = el('rect', { x: padL, y: y - rowH / 2, width: W - padL - padR, height: rowH, fill: 'transparent' }, s);
    hoverable(hit, `<b>${r.label}</b><br>${sgn(100 * r.est, 1)} points [${sgn(100 * r.lo, 1)}, ${sgn(100 * r.hi, 1)}] · ${pval(r.p)}`
      + (r.sub ? '<br>' + r.sub : ''));
  });
}

/* Observed value against a null distribution, one row per measure, each row on its own scale.
   rows: {label, obs, a: {mean, lo, hi, pAbove}, b: {...} (optional second null), fmt} */
function nullStrip(host, rows, o = {}) {
  const W = 700, rowH = 40, padL = o.padL || 260, padR = 86, padT = 8;
  const H = padT + rows.length * rowH + 8;
  const s = svgRoot(host, W, H);
  rows.forEach((r, i) => {
    const y = padT + i * rowH + rowH / 2;
    const vals = [r.obs, r.a.lo, r.a.hi, ...(r.b ? [r.b.lo, r.b.hi] : [])];
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo) * 0.08 || 0.05; lo -= pad; hi += pad;
    const x = v => padL + (W - padL - padR) * (v - lo) / (hi - lo);
    el('text', { x: padL - 10, y: y + 4, 'text-anchor': 'end', fill: css('--ink-2'), 'font-size': 12 }, s).textContent = r.label;
    el('rect', { x: x(r.a.lo), y: y - 7, width: Math.max(2, x(r.a.hi) - x(r.a.lo)), height: 9, rx: 3, fill: css('--mark-soft') }, s);
    el('line', { x1: x(r.a.mean), x2: x(r.a.mean), y1: y - 9, y2: y + 4, stroke: css('--ink-3'), 'stroke-width': 1.5 }, s);
    if (r.b) el('rect', { x: x(r.b.lo), y: y + 6, width: Math.max(2, x(r.b.hi) - x(r.b.lo)), height: 4, rx: 2,
                          fill: css('--s-tac'), opacity: .55 }, s);
    el('circle', { cx: x(r.obs), cy: y - 2.5, r: 5.5, fill: css('--s-strat'), stroke: css('--surface'), 'stroke-width': 2 }, s);
    el('text', { x: W - padR + 8, y: y + 4, fill: pColour(r.a.pAbove), 'font-size': 11, 'font-family': css('--mono'),
                 'font-weight': r.a.pAbove < 0.10 ? 600 : 400 }, s).textContent = pval(r.a.pAbove);
    const hit = el('rect', { x: padL, y: y - rowH / 2, width: W - padL - padR, height: rowH, fill: 'transparent' }, s);
    hoverable(hit, `<b>${r.label}</b><br>observed <b>${r.fmt(r.obs)}</b><br>no types, same habits and stability: `
      + `${r.fmt(r.a.mean)} on average, 95% of simulations ${r.fmt(r.a.lo)}–${r.fmt(r.a.hi)}; observed this high or higher `
      + `${pval(r.a.pAbove)}` + (r.b ? `<br>habits shuffled between people: ${r.fmt(r.b.mean)} (${r.fmt(r.b.lo)}–${r.fmt(r.b.hi)}), ${pval(r.b.pAbove)}` : ''));
  });
}

const gv = x => typeof x === 'function' ? x() : (x || '');
function glossHtml(key) {
  const g = GLOSS[key];
  if (!g) return '';
  const read = gv(g.read), here = gv(g.here);
  return `<span class="g-term">${g.term}</span>${gv(g.what)}`
    + (read ? `<span class="g-read">${read}</span>` : '')
    + (here ? `<span class="g-here">${here}</span>` : '');
}
// `gl` is for HTML strings, `glNode` for an element already built.
const gl = (key, text) => `<span class="gl" data-g="${key}">${text || GLOSS[key].term}</span>`;
function glNode(n, key) {
  if (!GLOSS[key]) return n;
  n.setAttribute('data-g', key);
  if (n.classList) n.classList.add('gl');
  return n;
}
// One listener for every glossary hover, including ones re-rendered later. It runs in the
// capture phase so that leaving a glossary term hides its box BEFORE a chart's own hover handler
// shows the next one.
let glossOn = false;
document.addEventListener('mousemove', e => {
  const n = e.target.closest ? e.target.closest('[data-g]') : null;
  if (n && GLOSS[n.getAttribute('data-g')]) {
    showTip(e, glossHtml(n.getAttribute('data-g')), true);
    glossOn = true;
  } else if (glossOn) { hideTip(); glossOn = false; }
}, true);

/* One row per finding on a log scale: filled dot = p, ring = q (corrected across all 716 pooled tests). */
function qStrip(host, rows) {
  const W = 700, rowH = 28, padL = 270, padR = 24, padT = 26, H0 = padT + rows.length * rowH + 34;
  const s = svgRoot(host, W, H0);
  const lo = Math.log10(0.0001), hi = 0;
  const x = p => padL + (W - padL - padR) * ((Math.log10(Math.max(p, 0.0001)) - lo) / (hi - lo));
  [0.0001, 0.001, 0.01, 0.1, 1].forEach(v => {
    el('line', { x1: x(v), x2: x(v), y1: padT - 6, y2: H0 - 30, stroke: v === 0.1 ? css('--ink-3') : css('--grid'),
                 'stroke-width': v === 0.1 ? 1.5 : 1, 'stroke-dasharray': v === 0.1 ? '4 3' : '' }, s);
    el('text', { x: x(v), y: H0 - 14, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5,
                 'font-family': css('--mono') }, s).textContent = v === 1 ? '1' : String(v).replace(/^0/, '');
  });
  el('text', { x: x(0.1), y: padT - 12, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10.5,
               'font-family': css('--mono') }, s).textContent = 'q = .10';
  el('text', { x: padL, y: H0 - 1, fill: css('--ink-3'), 'font-size': 10, 'font-family': css('--mono') }, s)
    .textContent = '← stronger evidence (values below .0001 drawn at the edge)';
  const col = lvl => lvl === 'strong' ? css('--good') : lvl === 'moderate' ? css('--s-strat')
    : lvl === 'suggestive' ? css('--warn') : css('--mark');
  rows.forEach((r, i) => {
    const y = padT + i * rowH + rowH / 2, c = col(r.level);
    el('text', { x: padL - 12, y: y + 4, 'text-anchor': 'end', fill: css('--ink-2'), 'font-size': 12.5 }, s)
      .textContent = r.id + ' · ' + r.short;
    el('line', { x1: x(r.p), x2: x(r.q), y1: y, y2: y, stroke: c, 'stroke-width': 1.5, opacity: .6 }, s);
    el('circle', { cx: x(r.q), cy: y, r: 5, fill: css('--surface'), stroke: c, 'stroke-width': 2 }, s);
    el('circle', { cx: x(r.p), cy: y, r: 5, fill: c }, s);
    const hit = el('rect', { x: padL, y: y - rowH / 2, width: W - padL - padR, height: rowH, fill: 'transparent' }, s);
    hit.style.cursor = 'pointer';
    hit.addEventListener('click', () => { location.hash = '#ws-' + r.ws.toLowerCase(); });
    hoverable(hit, `<b>${r.id} · ${r.short}</b><br>p = ${pfmt(r.p)} · q = ${pfmt(r.q)}<br>workstream ${r.ws} — click to jump`);
  });
}

    + 'pass the ' + gl('gates', 'robustness gates') + ' and a review by the supervisor, which grouped duplicates '
    + 'into findings and set aside results about the game design or with a known artefact.');
  const K = R.counts;
  const c = card(s, 'How many tests survived each step');
  barsH(h('div', { class: 'chart' }, c), [
    { label: 'Tests run', value: K.tests, sub: 'all seven workstreams, nulls included' },
    { label: 'Pooled', value: K.pooled, sub: 'descriptive-only and unfittable rows set aside, by a rule written first' },
    { label: 'q < .10', value: K.q10, sub: 'after one correction across the round' },
    { label: 'Gates pass', value: K.gates, sub: 'session 1 alone, both orders, no one person flips it' },
    { label: 'Not an artefact', value: K.afterArtefacts, sub: 'pre-declared artefacts removed' },
    { label: 'Findings', value: K.findings + K.replications, sub: `${K.findings} new + ${K.replications} replication, after grouping duplicates and setting aside design facts` },
  ], { padL: 120, rowH: 30, fmt: v => String(v) });
  para(s, 'Each finding below: the <b>filled dot</b> is its p-value, the <b>ring</b> its q-value. Left of the '
    + 'dashed line passes the agreed bar. Click a row to jump to its workstream.');
  qStrip(h('div', { class: 'chart' }, card(s)), R.findings);
}

/* ───────────────────────── one section per workstream ───────────────────────── */
R.workstreams.forEach(w => {
  const s = section('ws-' + w.id.toLowerCase(), 'Workstream ' + w.id + (w.from === 'new' ? ' · new' : ' · from ' + w.from), '');
  const n = w.found.length;
  s.querySelector('h2').innerHTML = w.title + ' ' + (n ? chip(F[w.found[0]].level, n + ' finding' + (n > 1 ? 's' : ''))
    : chip('none', 'no finding'));
  const c = card(s);
  const d = h('dl', { class: 'defs' }, c);
  [['Tried', w.tried], ['Tests', `${w.tests}, every one reported in <code>docs/analysis/round2/w${w.id}_specs.csv</code>`]]
    .forEach(([k, v]) => { h('dt', { text: k }, d); h('dd', { html: v }, d); });
  if (n) { h('h3', { text: 'What passed' }, s); w.found.forEach(id => findingCard(s, F[id])); }
  else para(s, '<b>Nothing passed the bar.</b>');
  if (w.nulls.length) {
    h('h3', { text: 'Nulls worth keeping' }, s);
    const ul = h('ul', { class: 'tight' }, s);
    w.nulls.forEach(t => h('li', { text: t }, ul));
  }
  if (w.notes.length) {
    h('h3', { text: 'Also worth knowing' }, s);
    const ul = h('ul', { class: 'tight' }, s);
    w.notes.forEach(t => h('li', { text: t }, ul));
  }
});

/* ───────────────────────── consequences ───────────────────────── */
{
  const s = section('next', 'Next', 'What this adds up to');
  const ul = h('ul', { class: 'tight' }, s);
  [
    '<b>The study’s reliance story is about people and job size, not pressure.</b> Who the operator is and how big the '
      + 'job is decide reliance (round 1 H1 + R2-1, R2-2); momentary load does not (round 1 H9 + workstream B).',
    '<b>The assistant’s value is speed and throughput, not better missions.</b> Cards save time where jobs are big '
      + '(R2-3), and a more reliant session gets more missions allocated (R2-5), but no measure shows a given person '
      + 'scoring higher or completing more missions by relying more.',
    '<b>Operators speed up with practice but do not get better at targeting their reliance</b> (R2-4 vs the '
      + 'workstream G null).',
    '<b>Brief Finding 5 stays as written</b> (“strategic trust fell between sessions”), with Strategic Heavy adding '
      + 'a smaller penalty on top — this reverses round 1’s proposed reframing.',
    '<b>To confirm on new data:</b> R2-1 to R2-6, ideally in the online arm with the order and game swap fully '
      + 'balanced from the start. A human second coder is still needed for what people said (workstream E).',
  ].forEach(t => h('li', { html: t }, ul));
  caveat(s, 'Exploratory round: with 716 tests in the pool, the q < .10 bar expects up to about one in ten of the '
    + 'passing rows to be a fluke, before the gates and review. The gates, the review and the agreement across '
    + 'workstreams are what make the six worth following up — not their p-values alone.');
}

/* — theme toggle — */
$('t-light').onclick = () => document.documentElement.setAttribute('data-theme', 'light');
$('t-dark').onclick = () => document.documentElement.setAttribute('data-theme', 'dark');
</script>
