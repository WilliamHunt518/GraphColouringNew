e":"real_world_transfer","at":1593,"text":"If you've got loads of spare humans, I'd want to see if the AI was actually better. But assuming that you've got fewer humans than you ideally would have, it feels like a good accelerator. [...] In this case, where I think the strategic one was less good than the tactical, if I were being really strategic I'd be saying: okay, people are going to do the strategic stuff, and we're just going to trust it for the tactical. So very much doing that optimisation around -- is it the agents or the humans who are adding the most value, and where.","note":"KEY. Reframes the whole two-tier question as an organisational allocation problem rather than a personal trust one: assign each tier to whichever of human or machine adds more value, under a staffing constraint. Reaches the same tier split as most of the cohort but derives it from resource economics rather than from how the assistants feel to use.","stance":"conditional"},{"id":"P32/design_suggestions/1609","pid":"P32","expert":false,"theme":"design_suggestions","at":1609,"text":"I'd want more analytics on, I guess, drone utilisation and mission success. I feel like that would be a good place to be making these decisions. [...] I'd want to understand empirically actually how it was performing, who should be doing what.","note":"Fourth request for performance data over explanation, after P36, P10 and P13 -- and the only one that asks for it about the HUMAN as well as the agent, to decide the division of labour.","stance":""},{"id":"P33/agent_comparison/1608","pid":"P33","expert":false,"theme":"agent_comparison","at":1608,"text":"In the second one, I found a lot of drones wasted here. [...] They assigned more drones than needed. [...] Some of the drones are wasted. They're not necessary to be there. They were assigned.","note":"Unprompted over-allocation complaint at the strategic tier. When the researcher then names the stray-colour form specifically, P33 agrees ('yeah, it's not necessary') -- so treat this as corroboration of the over-allocation finding and a LED confirmation of the stray-colour one, not a sixth independent sighting. See NARRATION.md for the sighting accounting.","stance":"conditional"},{"id":"P33/agent_comparison/1704","pid":"P33","expert":false,"theme":"agent_comparison","at":1704,"text":"If I have enough time, or I get more familiar with this system, I will have a check. [...] But in the tactical level, it works very well.","note":"The same tier split as most of the cohort, with verification of the strategic tier conditional on time and familiarity he did not have.","stance":"prefers_tactical"},{"id":"P33/verification/1653","pid":"P33","expert":false,"theme":"verification","at":1653,"text":"The first one, I feel the pace is very, very fast, so I can't do it very well in a very short time, so I used a lot of AI suggestions.","note":"Pace-driven reliance, stated plainly and without any claim about quality.","stance":"conditional"},{"id":"P33/trust_trajectory/1785","pid":"P33","expert":false,"theme":"trust_trajectory","at":1785,"text":"In the first test, I don't have enough time to [notice] it.","note":"KEY, and the third statement of this after P15 and P17: he only detected the strategic tier's over-allocation in the session where he had spare capacity. Error DETECTION is gated on workload, so measured trust can fall between sessions purely because the operator had slack to look -- with no change in the agent, which in fact made no errors at all. Any trust-over-time result has to contend with this.","stance":"conditional"},{"id":"P35/agent_comparison/1793","pid":"P35","expert":false,"theme":"agent_comparison","at":1793,"text":"Sometimes it will suggest me to allocate more, and sometimes the mission don't need the blue one and it suggests me to allocate two or three blue ones to that task -- and it's easier to find it out. But sometimes, when there are too many tasks in a mission [...] I don't have time to check it.","note":"FIFTH INDEPENDENT, UNPROMPTED SIGHTING of the stray-colour defect, after P13, P17, P20 and P21 -- a colour the mission does not need being committed to it. The researcher confirms on the record ('you're right, it does make that mistake sometimes'). He also states the detection condition: it is easy to spot on a small mission and impossible on a busy one, matching P15, P17 and P33.","stance":"conditional"},{"id":"P35/verification/1729","pid":"P35","expert":false,"theme":"verification","at":1729,"text":"If the task is too complicated, I will rely more on AI -- whether it gave me the right answer or not. I will choose to just trust it. But if I have enough time, I think I will maybe check twice, or think more on myself.","note":"KEY. 'Whether it gave me the right answer or not' is the most explicit statement in the corpus that reliance under load is decoupled from any belief about correctness. Complexity raises reliance and simultaneously removes the ability to justify it -- the same structure as P24's 'I don't have time to hesitate, I just trusted it'.","stance":"conditional"},{"id":"P35/agent_comparison/1699","pid":"P35","expert":false,"theme":"agent_comparison","at":1699,"text":"If I have enough strong swarm, and I have enough time, I can do better than the AI assistant. But in an urgent situation, and the number of the swarm is not enough, I need to consider about the strategies, and I think I need the help of AI assistant.","note":"Believes he outperforms the assistant given time and resources, and delegates precisely when both are scarce. Reliance highest exactly where he rates the agent lowest relative to himself -- the opposite of what a trust-driven account predicts, and the same shape as P28.","stance":"conditional"},{"id":"P35/general_ai_disposition/1872","pid":"P35","expert":false,"theme":"general_ai_disposition","at":1872,"text":"I think the operators need to be trained. Such as me -- I'm not trained, so I will trust on the AI. [...] I just need to tell them: although the AI gives you the suggestion, don't rely on it, even if in an urgent situation. They need to train, and they need to just don't rely too much on the AI system.","note":"KEY. Self-diagnosis of untrained over-reliance, and a training prescription aimed at his own behaviour. Note how this completes the arc with P36, the one trained participant, whose speed came from expertise rather than deference -- P35 identifies the absence of that expertise as the reason he defers, without prompting.","stance":"conditional"},{"id":"P36/real_world_transfer/1514","pid":"P36","expert":true,"theme":"real_world_transfer","at":1514,"text":"Be very keen to get this in front of the staff officers who are basically writing papers to say we need drones, for them to just be a little bit of hands-on experience of: okay, you want drones, this is a type of task that your commander is now doing instead of being in a trench. They're 200 metres back looking at a screen going 'the enemy's there', to a robot, going around this way, get from here to there and do this thing. Show me a route that you're going to take and I'll give you a thumbs up or down. That's what we're asking now, which is fundamentally different from what we've had up to this point.","note":"Unprompted first response to 'how did you find that'. Frames the whole paradigm -- supervisory approval of a machine-generated plan -- as the actual change, not the drones.","stance":"conditional"},{"id":"P36/real_world_transfer/1591","pid":"P36","expert":true,"theme":"real_world_transfer","at":1591,"text":"In terms of delivery, absolutely. In terms of the pace, probably not so much -- too fast. But I mean, you couldn't do it any way differently for a research study.","note":"Direct answer to how relevant the setup is. Validates the task structure while rejecting the tempo; he volunteers the constraint that forced it.","stance":"conditional"},{"id":"P36/real_world_transfer/1606","pid":"P36","expert":true,"theme":"real_world_transfer","at":1606,"text":"The biggest thing for us that is always hard to convey to decision makers is physics remains the bounding factor. I've got to get from this point here to that point there, and if the adversary can see me from 20k away then I'm doing that activity from 20k, and if you're going at 3k an hour then that's going to take you a long time. Your mental load is still loaded, it's just loaded in a slightly different way -- you're always trying to balance cognitive capacity against the time pressure.","note":"Independent arrival at the study's own design logic: travel time as the binding constraint, and workload as a capacity-versus-tempo trade.","stance":""},{"id":"P36/general_ai_disposition/1882","pid":"P36","expert":true,"theme":"general_ai_disposition","at":1882,"text":"This I would say is human in the loop, because you have to okay everything. Whereas what you would want to do for human on the loop would be, it just churns through -- conservative each time -- and you would set it up so that anything that's critical you go for the aggressive, anything that's not you go for the conservative. Making that intervention at a timely point is challenging for on-the-loop; there's got to be way more trust that it gets the answer right every time.","note":"Distinguishes the study's supervisory design from full delegation, and names the condition under which the second becomes acceptable. He also describes, unprompted, a policy-based automation of the strategic tier keyed to mission criticality.","stance":"conditional"},{"id":"P36/agent_comparison/1892","pid":"P36","expert":true,"theme":"agent_comparison","at":1892,"text":"For the strategic, a lot of it's a lot of over-allocation of resource. But then I'd probably just tweak the AI -- stop over-allocating resource, just give me this: if it's a critical task give me two reserve, if it's a moderate task give me one, if it's less than that give me no reserve, and then see how that plays out over time.","note":"His specific criticism of the strategic tier is wastefulness, and his remedy is to retune the policy rather than to take the decision back. Contrast P21, who reached a similar judgement about waste and responded by going manual.","stance":"prefers_tactical"},{"id":"P36/design_suggestions/1917","pid":"P36","expert":true,"theme":"design_suggestions","at":1917,"text":"The big thing that's missing in those sorts of things is data -- being able to go through and look at, when I did allocate resources in that way and I ran that stochastically like a thousand times, this is how many times my task failed.","note":"Asks for the empirical base rate behind the recommendation, not an explanation of it. A calibration request rather than an explainability request.","stance":""},{"id":"P36/general_ai_disposition/1945","pid":"P36","expert":true,"theme":"general_ai_disposition","at":1945,"text":"That always messes with people's heads, doesn't it, because we look at the failure -- 40% failure chance, no chance. But if you put a person into that scenario and it was all people doing it, your failure chance would be this as well. Everyone will try to push it up and up and up. No one likes gambling, particularly gambling in people's lives -- but the failure rate of doing nothing is 100%, so you've got to do something. You're just trying to chip away at it and prioritise accordingly.","note":"Names a reference-class problem in how risk is displayed: an absolute failure rate is read as unacceptable without the human baseline or the cost of inaction beside it.","stance":""},{"id":"P36/verification/2023","pid":"P36","expert":true,"theme":"verification","at":2023,"text":"That's kind of a challenge within this, because I know it's a simulation -- there isn't someone's life on the line at the end of it. And I've done enough planning activities to know, and I'm very visual, so looking at a glance: yes, it's allocated what I needed to allocate, cool, let's start running with it. Whereas if you've not had that experience... a young platoon commander who's literally just come out of Sandhurst, all of a sudden the bullets are flying -- either they're going to be foolhardy and just go for it and people are going to die, or they'll be almost paralysed.","note":"Explains his own speed as expertise-driven pattern recognition plus absent stakes. Directly relevant to reading low deliberation time as low engagement in the logs: here it is the opposite.","stance":"conditional"},{"id":"P36/verification/2097","pid":"P36","expert":true,"theme":"verification","at":2097,"text":"I imagine you're going to see me less decisive if someone's going to die at the end.","note":"His own statement of the study's ecological-validity limit for verification behaviour.","stance":""},{"id":"P36/agent_comparison/2203","pid":"P36","expert":true,"theme":"agent_comparison","at":2203,"text":"At that level you're already in a position where somebody's just coming back to you with the answers. As long as you have trust in how they've come up with those answers, then you're going to -- and if it looks right, because you've gone through the process yourself. By the time you become a battery commander you'd have been a commander, you'd have been a staff officer, you'd have worked up in those levels, so you kind of understand how those answers are generated. So there's a level of trust in that process.","note":"Answering how the two assistants compare to two human subordinates. Locates trust in having personally done the subordinate role -- a route to calibration that a machine assistant cannot offer.","stance":"conditional"},{"id":"P36/verification/2228","pid":"P36","expert":true,"theme":"verification","at":2228,"text":"One of the risks with AI: it presents an ill-considered or the wrong answer with a level of confidence, and you look at it and you go 'yeah, that looks right' -- but there's a massive hole in that plan that you're not seeing, because you've not gone through and worked those numbers and you've not seen someone else go through and work those numbers. Then you get a really good plan quickly, or a really bad plan quickly, and that will scale at pace. You've got one flawed input in your data set somewhere, which means that everybody's getting a really bad plan really quickly.","note":"The strongest statement in the corpus of why the two-tier design is a risk rather than a convenience: the same structure that makes good plans fast makes bad ones fast and correlated across every operator. Follows directly from the previous quote -- the verification he relies on is unavailable here.","stance":"conditional"},{"id":"P36/design_suggestions/2395","pid":"P36","expert":true,"theme":"design_suggestions","at":2395,"text":"One of the good things about AI is that you can have an agent whose only job is to go and red-team all of your outputs, very quickly. All your job is to do is check the data that they've based their answers on, and then you can go 'well, this data is wrong, so all these answers are now redundant'.","note":"His proposed mitigation for the quote above: a third, adversarial tier rather than more explanation from the existing two.","stance":""},{"id":"P36/agent_comparison/2634","pid":"P36","expert":true,"theme":"agent_comparison","at":2634,"text":"For your agents, yes it might be useful, but no it might not be useful -- it depends. And particularly it's not useful if they're giving bad answers. It's like, cool, that's not your job; your job is to do this thing over here, and there's other agents to do this thing over here. Stick to your lane and do that output, because someone else will do that for you.","note":"Answering whether each tier should see one level up. Endorses the deliberately myopic scope of both assistants, on the military staff principle that context beyond your remit is someone else's job.","stance":"conditional"}],"participants":["P01","P03","P04","P10","P11","P13","P14","P15","P17","P18","P19","P20","P21","P22","P24","P25","P26","P27","P28","P29","P30","P31","P32","P33","P35","P36"]},"round1":{"_note":"Round-1 results as verified by the supervisor (every number re-run; see SUPERVISOR_LOG.md). Read by scripts/build_findings_synthesis.py to render Results/analysis_round1.html. correctedP = small-sample (bias-reduced) GEE p where applicable; adjustedP = Holm across all ten primaries.","date":"2026-10-07","hypotheses":[{"id":"H1","short":"Distinct operator types?","question":"Do operators fall into distinct types of assistant use?","result":"One group fits about as well as two (\u0394BIC 1.9; needed > 10). The two groups were unstable under resampling (Jaccard .76 and .47) and different in session 1 vs 2 (ARI .04).","correctedP":0.42,"pNote":"session-agreement permutation p","adjustedP":1.0,"verdict":"not","verdictText":"Not supported: a continuum, not types","test":"Group operators on ten behaviours (card uptake, pre-emption, tactical consulting and keeping, recovery Suggest, decision time, drones committed, card previews) using a mixture model with 1\u20134 groups.","bar":"Two or more groups must beat one clearly (\u0394BIC > 10), stay stable under resampling (Jaccard \u2265 .75 for every group), and come out the same when sessions 1 and 2 are grouped separately."},{"id":"H2","short":"Checking cost explains the tier gap?","question":"Does the cost of checking a plan explain why the tactical assistant is trusted more?","result":"All three required parts pointed the predicted way: bigger plans kept unmodified more often (OR 1.76), checked less per drone, with the interaction (OR 0.70). The result depends on how 'kept unmodified' is defined.","correctedP":0.0654,"pNote":"largest of three parts","adjustedP":0.523,"verdict":"not","verdictText":"Not supported after the small-sample correction (was p = .019)","test":"Within the tactical tier: do bigger plans get kept unmodified more often (A), get checked less per drone (B), and do the two interact (C)? Decision-level models, each operator compared with themselves.","bar":"All three parts in the predicted direction, each with p < .05; the test\u2019s p is the largest of the three."},{"id":"H3","short":"Suggest reduces abandonment in recovery?","question":"On fixable failures, does pressing Suggest go with fewer abandoned missions, within the same person?","result":"OR 0.40 [0.21, 0.79]: the odds of abandoning were cut by 60% when Suggest was pressed. But every no-attempt failure was abandoned; among attempted fixes, Suggest and hand-fixing do equally well.","correctedP":0.008,"adjustedP":0.08,"verdict":"partial","verdictText":"Supported on its own; just misses the family-wide bar","test":"Recovery episodes the logs show were fixable: does pressing Suggest go with fewer abandonments, comparing each operator with themselves?","bar":"Odds ratio below 1 with its 95% interval excluding 1."},{"id":"H4","short":"Manual work explains the benchmark shortfall?","question":"Is the bigger shortfall against the near-perfect operator in Strategic Heavy explained by manual work?","result":"Adding manual rate shrinks the gap by only 13% (needed 50%). The gap itself is mostly one game whose benchmark run was unusually unlucky.","correctedP":0.334,"adjustedP":1.0,"verdict":"not","verdictText":"Not supported","test":"Per session, the share of the near-perfect operator\u2019s score reached, against that session\u2019s manual rate, with the game and the person accounted for.","bar":"Manual rate lowers the share, and adding it shrinks the Strategic-vs-Tactical gap by at least half."},{"id":"H5","short":"Bad session-1 experience explains the trust drop?","question":"Does a bad session-1 experience with the cards explain the drop in strategic trust?","result":"\u03c1 = \u22120.05: unrelated. Card missions do not even fail more often than manual ones. The drop follows scenario order instead.","correctedP":0.778,"adjustedP":1.0,"verdict":"not","verdictText":"Not supported","test":"Correlation between each person\u2019s change in strategic trust (session 1 \u2192 2) and how many of their session-1 card missions failed or were abandoned.","bar":"A negative correlation with its 95% interval excluding 0."},{"id":"H6","short":"People say they prefer tactical?","question":"In the debriefs and interviews, do people say they prefer the tactical assistant?","result":"17 prefer tactical against 6 strategic, but agreement with the original coding was \u03ba = .27 (needed \u2265 .6), mainly over what counts as a 'conditional' preference.","correctedP":0.0347,"pNote":"sign test; also needed \u03ba \u2265 .6","adjustedP":0.312,"verdict":"not","verdictText":"Not supported: right direction, coding not reliable enough","test":"A second, independent coding of every debrief and interview for which assistant each person prefers; a sign test on tactical vs strategic, plus agreement with the original coding.","bar":"Significantly more people prefer tactical (p < .05) AND the two codings agree at \u03ba \u2265 .6."},{"id":"H7","short":"Attitude to AI predicts card-taking?","question":"Does general attitude to AI (AIAS-4) predict taking the strategic card?","result":"OR 0.80 per standard deviation: no effect, and no difference between the two assistants. Only an effect of about OR 2 would have been detectable.","correctedP":0.4006,"adjustedP":1.0,"verdict":"not","verdictText":"Not supported","test":"General attitude to AI (AIAS-4, the only reliable attitude scale) as a predictor of taking the strategic card, allowing for the mission\u2019s make-up, scenario, session and timing.","bar":"Odds ratio per standard deviation with its 95% interval excluding 1."},{"id":"H8","short":"Noticing the illogical card lowers card use?","question":"Does card use fall once an operator has noticed that the illogical card can happen?","result":"The apparent drop (OR 0.12) is produced by how 'noticed' was defined. Against a simulation with no real change, it disappears.","correctedP":0.297,"pNote":"null-calibrated","adjustedP":1.0,"verdict":"invalid","verdictText":"Not supported: the planned test was flawed","test":"Single-type missions only: card use before vs after the first time each person rejected an illogical card (taken as the moment they noticed it).","bar":"Card use lower after, with the odds ratio\u2019s 95% interval excluding 1."},{"id":"H9","short":"A fuller queue pushes people onto the cards?","question":"Does a fuller queue of waiting missions push operators onto the strategic cards?","result":"OR 1.04 per extra queued mission. The test could have caught an effect as small as OR 1.14, and ~20 variants agree.","correctedP":0.4352,"adjustedP":1.0,"verdict":"not","verdictText":"Not supported: an informative null","test":"At each strategic decision, the number of missions waiting in the queue (relative to that person\u2019s own average) as a predictor of taking a card, allowing for the mission\u2019s make-up, scenario and session.","bar":"Odds ratio above 1 per extra queued mission, interval excluding 1."},{"id":"H10","short":"Taking a card makes a mission more likely to complete?","question":"For the same person, are card missions more likely to complete than manual ones?","result":"OR 0.81 [0.54, 1.20]. The test could have caught OR \u2264 0.58 or \u2265 1.73.","correctedP":0.2912,"adjustedP":1.0,"verdict":"not","verdictText":"Not supported","test":"Does each mission complete in full, card vs manual, comparing each operator with themselves and allowing for the mission\u2019s make-up and the game?","bar":"Odds ratio with its 95% interval excluding 1, in either direction."}],"recovery":{"noAttempt":{"abandoned":27,"n":27},"suggest":{"abandoned":14,"n":70},"handOnly":{"abandoned":7,"n":67},"presses":{"solved":50,"failed":36,"partial":3,"noop":8},"blindSpot":23,"blindSpotPeople":14,"blindSpotRecovered":8,"blindSpotEpisodes":17,"abandonAfterWorkingPlan":3,"suggestThenAbandon":11,"correctedNote":"2026-10-07: press rebuild fixed (tasks cut short by abandonment now count as executing). Was: solved 58 / failed 24 / noop 12; blind spot 11 presses, 8 people, 9 episodes (8 recovered); 9 of 11 suggest-then-abandon had a working plan."},"load":{"or":1.039,"lo":0.944,"hi":1.144,"detectable":1.14,"variants":20,"cardSavesNetS":7.2,"suggestFasterPct":16,"parallelX":4.8,"handBuiltLaterS":5},"trait":{"variance":0.307,"sessionRho":0.65,"trustRho":0.54,"loadings":[["Took a strategy card",0.92],["Previewed the cards",0.88],["Consulted the tactical plan",0.62],["Committed more drones on small missions",0.5],["Used Suggest in recovery",0.46],["Kept the tactical plan unmodified",0.42],["Went manual before the cards loaded",-0.34],["Decision time (net of the forced wait)",-0.48]]},"payoff":{"betweenOR":3.06,"betweenP":0.004,"withinOR":0.81,"withinP":0.29},"trustOrder":[{"label":"Strategic Heavy first","mean":-0.29,"fell":7,"n":17},{"label":"Strategic Heavy second","mean":-1.26,"fell":13,"n":16}],"preference":{"tactical":17,"strategic":6,"tacticalNoBorderline":17,"strategicNoBorderline":3,"originalTactical":12,"originalStrategic":1,"kappa":0.27,"kappaBinary":0.47},"benchmark":[{"label":"Strategic game 1 + Tactical game 2","strategic":0.58,"tactical":0.836,"n":17},{"label":"Strategic game 2 + Tactical game 1","strategic":0.636,"tactical":0.664,"n":16}],"unallocated":{"strategic":2.4,"strategicPts":424,"tactical":0.5,"tacticalPts":140},"h1":{"dbic":1.9,"jaccard":[0.76,0.47],"ari":0.04,"nullDbicShare":0.42},"h2":{"A":{"or":1.76,"lo":1.27,"hi":2.44},"B":{"b":-0.26,"lo":-0.41,"hi":-0.11},"C":{"or":0.7,"lo":0.52,"hi":0.94},"pUncorrected":0.019,"consultedOnlyA":0.67,"checkSecs":3,"personRho":-0.51,"personP":0.002},"h7":{"or":0.8,"lo":0.5,"hi":1.27,"detectable":2.0,"steigerPRange":[0.16,0.49],"detectableRhoDiff":0.6},"h8":{"or":0.12,"lo":0.02,"hi":0.65,"nullOr":0.37,"placeboOr":0.22,"calibratedP":0.3,"biasCorrectedPP":-10,"beforeCardTakes":13,"beforeN":18,"n":69,"people":17},"h5":{"rho":-0.05,"lo":-0.39,"hi":0.3,"cardVsManualFailOr":1.22},"h10":{"lo":0.54,"hi":1.2,"detectableLo":0.58,"detectableHi":1.73,"tacticalKeepBetween":0.51}},"round2":{"_note":"Round-2 results as verified by the supervisor (every spec table reproduced byte-identical; pooled BH in round2_pooled.csv). Rendered into Results/analysis_round2.html by scripts/build_findings_synthesis.py.","date":"2026-10-07","counts":{"tests":817,"pooled":716,"q10":34,"gates":33,"afterArtefacts":32,"findings":6,"replications":1},"findings":[{"id":"R2-1","ws":"F","short":"Pre-empting the cards is a personal trait","level":"strong","text":"Whether someone decides before the cards load is mostly about who they are: their session-1 rate predicts their session-2 rate (\u03c1 = .56), and about a quarter of the variation belongs to the person against about 5% to the mission. 15 of 33 never pre-empted at all.","p":0.00065,"q":0.0352885714285714,"row":"F:F4.3"},{"id":"R2-2","ws":"B","short":"Bigger jobs go to the assistant, on both tiers","level":"strong","text":"Within the same person, Suggest is consulted far more on bigger tactical plans (odds \u00d72.57 each time plan size \u2014 drones \u00d7 tasks \u2014 grows about 2.7-fold), and cards are taken more on three-type missions (OR 1.84). The tactical half is new; the strategic half repeats the brief's Finding 2, now holding the game fixed.","p":3.68649e-08,"q":4.3992114e-06,"row":"B:B5a"},{"id":"R2-3","ws":"C","short":"Cards save decision time on three-type missions","level":"strong","text":"On three-type missions, taking a card is much faster than building by hand, net of the forced reveal; the saving is concentrated there (card \u00d7 three-type interaction). Confirms round 1's exploratory speed result.","p":0.0,"q":1.4320000000000002e-298,"row":"C:C3","pNote":"below the 5-decimal precision the spec table records"},{"id":"R2-4","ws":"G","short":"Decisions speed up with practice","level":"strong","text":"Strategic decisions get about 31% faster over an 8-minute session, net of the forced waits \u2014 within a session the scenario and game are fixed, so they cannot cause it. Session 2 is also faster than session 1 on both tiers, though for strategic decisions the game is not ruled out (p = .16 with game fixed).","p":0.00013,"q":0.009308,"row":"G:G4.5"},{"id":"R2-5","ws":"C","short":"Reliance pays through throughput","level":"moderate","text":"When the same person relies more in one session than the other, fewer missions are left never allocated (\u22120.78 missions per SD of reliance). But taking the card alone does not do it, and the score does not rise.","p":0.00086,"q":0.0383270588235294,"row":"C:C2"},{"id":"R2-6","ws":"A","short":"Low-reliance operators attempt recovery less","level":"suggestive","text":"People lower on the reliance trait try to fix fewer of their fixable failures (\u03c1 = .54). Between people only, and carried by four people who never attempted a fix.","p":0.0012,"q":0.0407241272727272,"row":"A:A4c"},{"id":"R2-7","ws":"D","short":"Strategic trust falls between sessions","level":"replication","text":"Strategic trust falls from session 1 to 2 (\u22120.78 on the 1\u20137 scale; \u22121.23 with the game fixed). It is not a game S2 effect: a second-session drop and a smaller Strategic Heavy penalty stack.","p":0.00091,"q":0.0383270588235294,"row":"D:D2a.run2"}],"workstreams":[{"id":"A","title":"Recovery \u2014 what makes operators attempt a fix?","from":"H3","tests":197,"tried":"Time left in the session; mission size and reward at stake; drones left on the mission; recent failures; the person's reliance trait; abandoning a working Suggest plan; the effect of a failed Suggest press; three-type missions only.","found":["R2-6"],"nulls":["Reward at stake, drones left on the mission and recent failures: all null.","After a failed Suggest press, later attempts rise rather than fall; the design itself leans towards finding a drop (null simulation mean OR .73)."],"notes":["\u201cTime left in the session\u201d looked like an effect (OR 1.26 per minute) but is an artefact: 8 of the 9 failures left open began with 12 s or less on the clock, and operators take a median 14 s to make a first move. Removing failures with under 31 s left drops it to OR 1.12, p = .20.","Under the scoring rules, abandoning late is never better than leaving the mission open."]},{"id":"B","title":"Load and pace \u2014 does pressure show up somewhere else?","from":"H9","tests":90,"tried":"Five new load measures (waiting time, missions in flight, recent failures, reserve depletion, scheduled arrivals); the final 90 s; the opposite hypothesis (pre-empting under load); the tactical tier and three-type missions only; speed as the reason; spoken overload in the narration.","found":["R2-2"],"nulls":["Pressure does not raise reliance most where the assistant saves time (queue \u00d7 plan size OR 0.99).","Pre-empting the cards does not rise under any of the new load measures (ORs 0.93\u20131.10).","Spoken overload: 10 strict moments from 4 people; the queue then is no higher than at random speech (p = .87). Suggestive only."],"notes":["Tactical Suggest use rises when a strategic backlog is waiting (OR 1.20, q = .04), but not once time-in-session is controlled (q = .33): practice, not pressure.","Data issue: the narration alignment for P01_s1, P06_s1 and PIL03_s1 stores the session-2 timer offset."]},{"id":"C","title":"The reliance trait and its payoff, and how hard each game was","from":"H1, H10, H4","tests":178,"tried":"What predicts the reliance trait; throughput (missions allocated, time to allocate) rather than per-mission success; card vs manual by mission type; penalty per mission; game difficulty and order in one model with four performance measures.","found":["R2-3","R2-5"],"nulls":["Within person, reliance does not improve score on any of the four performance measures (all p \u2265 .6).","Penalty per mission and completion on three-type missions: null."],"notes":["Difficulty: S1 has the lowest score efficiency (.43) and T1 the highest (.61), but on share of the best human score the four games are the same (.65\u2013.70). The scenario difference in efficiency reflects how many points each game offers, not how hard people found it. No order effect on score.","Strategic Heavy leaves far more missions never allocated \u2014 a property of the scenario design, reported as context."]},{"id":"D","title":"Trust \u2014 separating order from game","from":"H5","tests":125,"tried":"Session-1-only comparison; the six swapped participants; game as a fixed effect; what in a session predicts its trust rating; the tactical tier; whether trust leads behaviour.","found":["R2-7"],"nulls":["Trust does not lead behaviour: session-1 trust does not predict how card use changes in session 2.","With the game fixed, nothing measured in a session predicts its trust rating (small-mission share, bad cards seen, card failures, score).","Tactical trust tracks tactical behaviour between people but not within a person."],"notes":["The six swapped people rate Strategic Heavy lower when played second for both games, and rate game S2 higher than S1 in both positions: not a game S2 effect. Cells of three \u2014 direction only."]},{"id":"E","title":"What people say, done reliably","from":"H6","tests":101,"tried":"A third coding with the agreed codebook; stated reasons (speed, visible errors, can't check) against behaviour; stated scale-dependence against each person's own composition effect.","found":[],"nulls":["Stated scale-dependence does not match card behaviour (OR 1.27, p = .61).","Speed and \u201ccan't check\u201d reasons point the predicted way but are all non-significant."],"notes":["Agreement with the round-1 second coding is \u03ba = .96 \u2014 but both were the same AI model with near-identical codebooks, so this is closer to a re-test than to two independent coders. A human second coder is still needed.","Closest result: people who mention a specific card error go manual more on single-type missions (OR 2.72, p = .046), not significant after correction."]},{"id":"F","title":"How operators handle the strategic cards","from":"new","tests":72,"tried":"Anchoring on the card numbers; whether edits remove unneeded drone types; avoiding a bad card in the moment, and whether previewing both cards helps; pre-emption as trait vs situation.","found":["R2-1"],"nulls":["On three-type missions, operators do not avoid a dominated Conservative card (OR 1.10).","Operators almost never preview both cards (19 of 606 decisions), so previewing cannot be how they avoid a bad card."],"notes":["Anchoring: manual allocations track the card numbers (+0.76 drones per card drone, p = .022) but only in session 2 and one order \u2014 learning, game and order cannot be told apart.","Edits trim drone types the card over-provides (OR 3.4, p = .015) but rest on 10 people."]},{"id":"G","title":"Learning and calibration across the sessions","from":"new","tests":54,"tried":"Whether reliance becomes better targeted with experience; within-session learning curves with composition held fixed; learning to avoid dominated cards; decision speed over time net of the forced waits.","found":["R2-4"],"nulls":["Reliance does not become better targeted with experience: every composition \u00d7 session estimate is below 1 (OR 0.55\u20130.86, all p > .12).","Operators do not learn to avoid dominated cards."],"notes":["The synthesis page's caption \u201cThis is where the learning effect shows up\u201d is not supported once the game is fixed \u2014 it is driven by the unreliable Tactical game 2 benchmark. To correct."]}]},"qual":{"n":33,"counts":{"C01":15,"C02":1,"C03":10,"C04":15,"C05":8,"C06":6,"C07":6,"C08":6,"C09":4,"C10":5,"C11":9,"C12":12,"C13":3,"C14":3,"C15":4,"C16":4,"C17":9,"C18":5,"C19":4,"C20":3,"C21":4,"C22":6,"C23":3,"C24":0,"C25":9,"C26":5,"C27":6,"C28":4},"who":{"C01":["P03","P05","P10","P11","P15","P18","P21","P22","P24","P26","P28","P29","P30","P32","P36"],"C02":["P11"],"C03":["P02","P11","P12","P15","P18","P22","P26","P29","P34","P35"],"C04":["P04","P06","P07","P11","P17","P20","P24","P26","P28","P30","P31","P32","P33","P34","P35"],"C05":["P10","P11","P15","P18","P21","P24","P30","P34"],"C06":["P06","P15","P16","P26","P27","P29"],"C07":["P10","P21","P22","P24","P28","P30"],"C08":["P07","P16","P17","P22","P28","P36"],"C09":["P02","P19","P24","P31"],"C10":["P03","P10","P29","P30","P32"],"C11":["P05","P06","P11","P18","P20","P25","P32","P33","P35"],"C12":["P02","P13","P16","P17","P19","P20","P21","P28","P29","P33","P35","P36"],"C13":["P02","P21","P31"],"C14":["P22","P24","P27"],"C15":["P15","P17","P19","P33"],"C16":["P06","P10","P26","P32"],"C17":["P05","P22","P25","P26","P29","P31","P32","P33","P35"],"C18":["P03","P04","P14","P17","P28"],"C19":["P10","P19","P28","P29"],"C20":["P03","P06","P18"],"C21":["P01","P18","P28","P29"],"C22":["P10","P11","P15","P21","P30","P32"],"C23":["P11","P29","P31"],"C24":[],"C25":["P03","P05","P22","P24","P25","P26","P28","P30","P35"],"C26":["P02","P12","P16","P25","P36"],"C27":["P10","P12","P13","P31","P32","P36"],"C28":["P13","P27","P30","P31"]},"evidence":[{"pid":"P01","code":"C21","source":"debrief","at":"0:28:06","led":0,"text":"I was just getting crazy drone failure. Yeah. It felt like I sent the same mission out like three times and had the exact same failure"},{"pid":"P02","code":"C03","source":"interview","at":"para4","led":0,"text":"If simple, easier to do manually, also reserve size."},{"pid":"P02","code":"C03","source":"interview","at":"para7","led":0,"text":"Lots of drones means more likely to use agent"},{"pid":"P02","code":"C09","source":"interview","at":"para3","led":0,"text":"Often took it as a suggestion but edited"},{"pid":"P02","code":"C12","source":"interview","at":"para2","led":0,"text":"Confidence diminished when spares weren\u2019t always correct."},{"pid":"P02","code":"C13","source":"interview","at":"para6","led":0,"text":"Again, fragile confidence \u2013 didn\u2019t saturate tasks and not great performance or overloading"},{"pid":"P02","code":"C26","source":"interview","at":"para11","led":0,"text":"AI tools are fine if they\u2019re understandable (deterministic not stochastic)"},{"pid":"P03","code":"C01","source":"interview","at":"para9","led":0,"text":"Checked always. Worked it out first and saw if It agreed."},{"pid":"P03","code":"C10","source":"debrief","at":"0:24:11","led":0,"text":"So I say, okay, I need four. I need five. And it does."},{"pid":"P03","code":"C10","source":"interview","at":"para9","led":0,"text":"Checked always. Worked it out first and saw if It agreed."},{"pid":"P03","code":"C18","source":"debrief","at":"0:23:59","led":0,"text":"I think I have to look at it very well every time. I have to check what it's suggesting."},{"pid":"P03","code":"C18","source":"interview","at":"para9","led":0,"text":"Checked always. Worked it out first and saw if It agreed."},{"pid":"P03","code":"C20","source":"interview","at":"para5","led":0,"text":"\u201cYou can\u2019t blame the tactical for drone failures but you can blame the strategic for not having redundancy\u201d"},{"pid":"P03","code":"C25","source":"interview","at":"para10","led":0,"text":"Strategic human should be fully in the loop."},{"pid":"P04","code":"C04","source":"debrief","at":"0:24:49","led":1,"text":"So first thing is, you mentioned that you're mostly using the agents for time-saving, right? Yeah."},{"pid":"P04","code":"C04","source":"interview","at":"para3","led":0,"text":"Used more, as bigger time save and more trust"},{"pid":"P04","code":"C04","source":"interview","at":"para6","led":0,"text":"Mostly using agents for time saving"},{"pid":"P04","code":"C18","source":"debrief","at":"0:25:40","led":0,"text":"Yeah, I was using it for easy first numbers, if I don't want to assign. But I was checking whether it had a really large number."},{"pid":"P04","code":"C18","source":"interview","at":"para1","led":0,"text":"For easy stuff, always checking"},{"pid":"P05","code":"C01","source":"interview","at":"para10","led":0,"text":"\u201cPut me in a position of overall reviewer of the entire system so I could outsource my brainpower to the agents. It was very easy for me then to check it.\u201d"},{"pid":"P05","code":"C11","source":"interview","at":"para9","led":0,"text":"When workload gets higher you rely on AI much more"},{"pid":"P05","code":"C17","source":"interview","at":"para12","led":0,"text":"Time to take and criticality was what dictated the time to review."},{"pid":"P05","code":"C25","source":"interview","at":"para13","led":0,"text":"AI should be doing menial tasks, with humans at the higher level."},{"pid":"P06","code":"C04","source":"interview","at":"para10","led":0,"text":"Main reason to use AI was to save time under high workload"},{"pid":"P06","code":"C04","source":"interview","at":"para3","led":0,"text":"Used AI more (and earlier) because it\u2019s more time consuming"},{"pid":"P06","code":"C06","source":"interview","at":"para4","led":0,"text":"Over time lost a little faith as it was slow"},{"pid":"P06","code":"C11","source":"interview","at":"para10","led":0,"text":"Main reason to use AI was to save time under high workload"},{"pid":"P06","code":"C16","source":"interview","at":"para11","led":0,"text":"\u201cOver time my trust in the strategic AI went up\u201d"},{"pid":"P06","code":"C20","source":"interview","at":"para12","led":0,"text":"Blamed failures on the tactical"},{"pid":"P07","code":"C04","source":"interview","at":"para6","led":0,"text":"Mainly speed as was faster than doing it manually"},{"pid":"P07","code":"C08","source":"interview","at":"para3","led":0,"text":"\u201cMaybe if there was a third button for manual allocation I would use it more\u201d"},{"pid":"P10","code":"C01","source":"debrief","at":"0:26:20","led":0,"text":"my strategy was okay make sure that you as long as i am able always send drones at a number that minimizes or possibly completely removes the need for chaining"},{"pid":"P10","code":"C05","source":"debrief","at":"0:26:44","led":0,"text":"if i just hit the suggest button then i can focus on something else"},{"pid":"P10","code":"C05","source":"debrief","at":"0:27:28","led":0,"text":"at which point it's like okay hit the suggest button while that loads look at the next mission the second the suggest button it's done"},{"pid":"P10","code":"C07","source":"debrief","at":"0:25:46","led":0,"text":"a little bit extra time on mission six. Six might enable you to, at the same time start mission seven, because you're a bit more conservative with your redundancy, basically, with the amount of drones you sent off."},{"pid":"P10","code":"C10","source":"debrief","at":"0:24:49","led":0,"text":"I mean, I think part of it was a little bit of experimenting"},{"pid":"P10","code":"C10","source":"interview","at":"para9","led":0,"text":"Experimenting the two agents"},{"pid":"P10","code":"C16","source":"debrief","at":"0:26:12","led":0,"text":"And once that clicked to me, and I properly started not just understanding, I think I trusted the strategic"},{"pid":"P10","code":"C16","source":"interview","at":"para6","led":0,"text":"Trusted strategic agent more."},{"pid":"P10","code":"C19","source":"debrief","at":"0:28:53","led":0,"text":"i sent only one drone out green or whatever it was one green out um that then happened to be the drone that failed and because i didn't have any redundancy that mission was done for"},{"pid":"P10","code":"C22","source":"debrief","at":"0:22:39","led":0,"text":"And I could definitely feel that there is absolutely a learning effect."},{"pid":"P10","code":"C22","source":"debrief","at":"0:22:57","led":0,"text":"there was definitely an improvement further throughout session one, and in session two, you really find your stride"},{"pid":"P10","code":"C22","source":"interview","at":"para8","led":0,"text":"Big learning effect"},{"pid":"P10","code":"C27","source":"debrief","at":"0:29:22","led":0,"text":"you will have some numbers presumably about so what's the likelihood for drone failure right yes and that will based on historic data and that will presumably bias um or inform not bias but inform your selection"},{"pid":"P10","code":"C27","source":"interview","at":"para10","led":0,"text":"In reality a prior on failure chance would be known to the operator"},{"pid":"P11","code":"C01","source":"debrief","at":"0:29:11","led":0,"text":"I think that's the trade-off that I make. Like, I suppose it's going to do a small mission just as well, but I feel like I can do a small mission faster."},{"pid":"P11","code":"C02","source":"debrief","at":"0:27:26","led":0,"text":"And I guess I do feel I want to use my solution, and I don't want to like, oh, you know, of course the computer thinks it's better."},{"pid":"P11","code":"C02","source":"debrief","at":"0:30:55","led":0,"text":"I don't want to be reduced to pressing allocate, suggest, deploy, because otherwise I might as well be in the next room. You want to be actually connected to it."},{"pid":"P11","code":"C02","source":"debrief","at":"0:31:15","led":0,"text":"And I'm like, oh, I can just do that. Don't worry. I'll do that. Done. And I feel satisfaction."},{"pid":"P11","code":"C02","source":"interview","at":"para9","led":0,"text":"\u201cA sense of ownership over my own solution\u2026 injured pride if it does it better than me\u201d"},{"pid":"P11","code":"C03","source":"debrief","at":"0:28:41","led":0,"text":"either it's a really big mission, and it's like, oh, I can trust it with a large mission. [\u2026] Or it's a simple mission, and I'll be like, oh, I can just bang it up myself."},{"pid":"P11","code":"C03","source":"interview","at":"para4","led":0,"text":"Especially trusted with a large mission \u2013 \u201cI feel I can do a small mission faster, and this gives a sense of control over it compared to using the agent\u201d"},{"pid":"P11","code":"C04","source":"debrief","at":"0:30:11","led":0,"text":"I think even if the tactical agent gave me a dodgy suggestion and the mission failed and I lost points, I probably would have gained more points from the time saved..."},{"pid":"P11","code":"C04","source":"interview","at":"para5","led":0,"text":"\u201cFor big missions. I would have gained more points from the time saved using the tactical agent even if there is a small error\u201d"},{"pid":"P11","code":"C05","source":"debrief","at":"0:31:33","led":0,"text":"Because I can then go and start worrying about another mission."},{"pid":"P11","code":"C05","source":"debrief","at":"0:31:51","led":0,"text":"But I've probably sent off another mission in that time that I saved by using the agent."},{"pid":"P11","code":"C11","source":"debrief","at":"0:32:55","led":0,"text":"And each task had, there was a lot more decisions to be made. And so I'm more likely to get overwhelmed and think, oh, the agent could probably just do that for me."},{"pid":"P11","code":"C11","source":"interview","at":"para6","led":0,"text":"as opposed to the first where it was more beyond [my] abilities so relied on agent more"},{"pid":"P11","code":"C22","source":"debrief","at":"0:32:16","led":0,"text":"partly this is due to the experience, I suppose. And I was better at it the second time."},{"pid":"P11","code":"C23","source":"interview","at":"para5","led":0,"text":"\u201cFor big missions. I would have gained more points from the time saved using the tactical agent even if there is a small error\u201d"},{"pid":"P12","code":"C03","source":"interview","at":"para5","led":0,"text":"More inclined to do quick tasks myself"},{"pid":"P12","code":"C26","source":"interview","at":"para6","led":0,"text":"\u201cI would want an understanding of how it goes about developing its optimum paths\u201d"},{"pid":"P12","code":"C27","source":"interview","at":"para6","led":0,"text":"\u201cIn a real-world scenario I\u2019d want to get a better sense of what the system\u2019s strengths and weaknesses are\u2026 and whether [I] could do more effective tactical deployments [myself compared to the agent]\u201d"},{"pid":"P13","code":"C12","source":"debrief","at":"0:22:43","led":0,"text":"It has a lot of redundancy. I mean, redundancy is good, but I think it's too many resources at this point."},{"pid":"P13","code":"C12","source":"debrief","at":"0:29:55","led":0,"text":"But in conservator, you don't need camera or lifters, yet it adds it as reserve. Mm-hmm. Even for tasks it doesn't do. That doesn't make sense."},{"pid":"P13","code":"C12","source":"interview","at":"para1","led":0,"text":"Could be better. A lot of redundancy \u2013 too much"},{"pid":"P13","code":"C27","source":"debrief","at":"0:24:29","led":0,"text":"Based on that, I think you can have a pretty good guess of what the probability of failure would be. If you could know that, it would be a lot better while assigning resources."},{"pid":"P13","code":"C27","source":"interview","at":"para6","led":0,"text":"\u201cKnowing the weather conditions and topology of the deployment area would give you a rough idea of what the chance of failure would be for a given drone, factor that into the allocation algorithm"},{"pid":"P13","code":"C28","source":"debrief","at":"0:27:49","led":0,"text":"Honestly, I think I am doing a lot of work right now, and they can be a lot more automated."},{"pid":"P13","code":"C28","source":"debrief","at":"0:28:20","led":0,"text":"You can have a system for most of it. That would work just fine. I feel like the user is handling a lot."},{"pid":"P13","code":"C28","source":"interview","at":"para7","led":0,"text":"These tools could both be a lot more automated"},{"pid":"P14","code":"C18","source":"debrief","at":"0:25:45","led":0,"text":"I was like sort of rechecking the strategic plan and, uh, the technical plan that was used them for almost. Every allocation that was made"},{"pid":"P14","code":"C18","source":"debrief","at":"0:26:30","led":0,"text":"But in the tactical interface, I had to sort of hover over every drone that was there, sort of look at the trajectory [\u2026] and then had to sort of deploy if it was fine."},{"pid":"P14","code":"C18","source":"interview","at":"para2","led":0,"text":"\u201cI did not trust the agents entirely \u2013 I was checking the plans, but I did use them for almost every allocation\u201d"},{"pid":"P15","code":"C01","source":"debrief","at":"0:29:49","led":0,"text":"yeah if the like too many decisions or too many drum i need to arrange i will use use the ai"},{"pid":"P15","code":"C03","source":"debrief","at":"0:30:12","led":0,"text":"yeah if the like too many decisions or too many drum i need to arrange i will use use the ai"},{"pid":"P15","code":"C03","source":"interview","at":"para3","led":0,"text":"Automated larger, more complex tasks more, but smaller tasks could do himself"},{"pid":"P15","code":"C05","source":"debrief","at":"0:30:26","led":0,"text":"it's not fast but also i in the other screen i have something to do so i can leave some time for it to suggest my the arrangement"},{"pid":"P15","code":"C05","source":"interview","at":"para9","led":0,"text":"Multitasking"},{"pid":"P15","code":"C06","source":"debrief","at":"0:29:26","led":0,"text":"many many of the arrangements like how many blue how many green how many red i can see in one second it will take maybe four or five seconds"},{"pid":"P15","code":"C06","source":"debrief","at":"0:32:16","led":0,"text":"i definitely think it's very useful but it should be smart and faster"},{"pid":"P15","code":"C06","source":"interview","at":"para8","led":0,"text":"Both felt too slow"},{"pid":"P15","code":"C15","source":"debrief","at":"0:33:05","led":0,"text":"the second round side because i have more experience after the first round and now i can check the whether the uh in these screens that tour i can find that it makes mistakes"},{"pid":"P15","code":"C15","source":"interview","at":"para4","led":0,"text":"2nd scenario had more missions and participant had learned more and identified the mistakes it was making."},{"pid":"P15","code":"C22","source":"debrief","at":"0:33:05","led":0,"text":"because i have more experience after the first round and now i can check"},{"pid":"P16","code":"C06","source":"interview","at":"para1","led":0,"text":"Slow and options weren\u2019t that good."},{"pid":"P16","code":"C08","source":"interview","at":"para1","led":0,"text":"Sometimes the same, and often too extreme (far too aggressive and far too conservative). Manually overrode most of the time"},{"pid":"P16","code":"C12","source":"interview","at":"para1","led":0,"text":"Sometimes the same, and often too extreme (far too aggressive and far too conservative). Manually overrode most of the time"},{"pid":"P16","code":"C26","source":"interview","at":"para9","led":0,"text":"\u201cI would use them even more if I knew how they worked\u201d"},{"pid":"P17","code":"C04","source":"debrief","at":"0:24:33","led":0,"text":"And that would be then my balance because sometimes it's, even if it's not effective, as long as it's there and something's happening, it's better."},{"pid":"P17","code":"C04","source":"interview","at":"para5","led":0,"text":"Suspect that tactical agent is fast enough that time save from more accurate allocation may not be worth it"},{"pid":"P17","code":"C08","source":"debrief","at":"0:23:38","led":0,"text":"But whenever I clicked manual, it's either been for the cause of setting too much, or I want it to be somewhere between those two levels."},{"pid":"P17","code":"C08","source":"interview","at":"para4","led":0,"text":"When using manual is either to reduce or to gap between he cards"},{"pid":"P17","code":"C12","source":"debrief","at":"0:23:13","led":0,"text":"What I've noticed is that the strategic one, there was quite a lot for wrong ones in there."},{"pid":"P17","code":"C12","source":"debrief","at":"0:23:38","led":0,"text":"But whenever I clicked manual, it's either been for the cause of setting too much, or I want it to be somewhere between those two levels."},{"pid":"P17","code":"C12","source":"interview","at":"para3","led":0,"text":"Always enough, but sometimes too many"},{"pid":"P17","code":"C15","source":"debrief","at":"0:25:21","led":0,"text":"I think in the beginning for the couple of first ones where I didn't, but then I slowly got into a habit."},{"pid":"P17","code":"C15","source":"debrief","at":"0:26:15","led":0,"text":"And then there were also more misallocations of the, mostly the conservative actually."},{"pid":"P17","code":"C18","source":"debrief","at":"0:24:43","led":0,"text":"I didn't. I just checked if everything was done."},{"pid":"P17","code":"C18","source":"debrief","at":"0:25:21","led":0,"text":"I think I always checked if everything was done. Yes."},{"pid":"P17","code":"C18","source":"interview","at":"para6","led":0,"text":"Almost always used tactical. Always checked everything was covered"},{"pid":"P18","code":"C01","source":"debrief","at":"0:26:01","led":1,"text":"settled on a strategy of how you were going to use the agents at all, the assistants? Yeah. I think it sort of changed from the first one, but yeah, I think so."},{"pid":"P18","code":"C01","source":"debrief","at":"0:26:17","led":0,"text":"So I think if, at first glance, I felt really overwhelmed by the amount of drones to be assigned. I would use the assistant to sort of, yeah."},{"pid":"P18","code":"C03","source":"debrief","at":"0:26:17","led":0,"text":"So I think if, at first glance, I felt really overwhelmed by the amount of drones to be assigned. I would use the assistant to sort of, yeah."},{"pid":"P18","code":"C05","source":"debrief","at":"0:26:44","led":0,"text":"To do some of the tasks at the same time."},{"pid":"P18","code":"C05","source":"debrief","at":"0:28:03","led":0,"text":"I guess I'll be able to do some of the tasks and some of the allocation myself. To do some of the tasks. To, I guess, to work in parallel, I guess."},{"pid":"P18","code":"C11","source":"debrief","at":"0:26:17","led":0,"text":"So I think if, at first glance, I felt really overwhelmed by the amount of drones to be assigned. I would use the assistant to sort of, yeah."},{"pid":"P18","code":"C11","source":"debrief","at":"0:27:41","led":0,"text":"If I was overwhelmed, I would use the assistant, or if lots of tasks at the same time, or if there were... Okay."},{"pid":"P18","code":"C20","source":"debrief","at":"0:28:31","led":0,"text":"I think in the first round, there was a few missions that failed after having it set to conservative. So I was a bit, I guess, doubtful after that, too."},{"pid":"P18","code":"C21","source":"debrief","at":"0:28:43","led":0,"text":"Yeah, basically. So then I had to abandon them."},{"pid":"P19","code":"C09","source":"debrief","at":"0:33:57","led":0,"text":"it's like asking ChatGPT to write you a first draft paragraph of something that you need written, versus looking at a blank paper. You can deal with a block of text and adjust it later."},{"pid":"P19","code":"C09","source":"debrief","at":"0:34:10","led":0,"text":"You can fix bad. You can't fix nothing. Yeah. I think it gives you that seed."},{"pid":"P19","code":"C12","source":"debrief","at":"0:31:47","led":0,"text":"I think I was trusting this guy too much this time. And he was over assigning blue drones to blue only missions."},{"pid":"P19","code":"C12","source":"debrief","at":"0:32:07","led":0,"text":"Oh, not even that. I think he was over assigning blue only drones to blue only missions."},{"pid":"P19","code":"C15","source":"debrief","at":"0:33:19","led":0,"text":"I will say, in this case, you were less reliable, Strat. I'm sorry. I come to like you, but this time, you dropped the ball a little. In this case, I was being more careful, for sure."},{"pid":"P19","code":"C15","source":"debrief","at":"0:34:25","led":0,"text":"Tactical assistant. I paid a bit more attention to you this time"},{"pid":"P19","code":"C19","source":"debrief","at":"0:31:10","led":0,"text":"And something that I don't think I engaged with effectively was giving them more drones on the repeat performance."},{"pid":"P19","code":"C19","source":"debrief","at":"0:34:25","led":0,"text":"There were some drone failures. I think those were my failures, though, if I'm being honest with you. Not assigning enough drones the next time around."},{"pid":"P20","code":"C04","source":"debrief","at":"0:27:00","led":0,"text":"The strategic one maybe seemed a bit more useful. Because I think that one actually saved me a little more time."},{"pid":"P20","code":"C11","source":"debrief","at":"0:28:46","led":0,"text":"You can have a lot of tasks to be overloaded and try and offload some of that work to AI and then for the very complex stuff, maybe you don't."},{"pid":"P20","code":"C11","source":"debrief","at":"0:29:16","led":1,"text":"I would say it increases."},{"pid":"P20","code":"C12","source":"debrief","at":"0:25:51","led":0,"text":"there was one example in the first round where it was required all fast drones. And I think the AI assistant recommended I add some red and green drones."},{"pid":"P20","code":"C12","source":"debrief","at":"0:26:11","led":0,"text":"And then when it came to assigning them, I noticed, oh, okay, it's made a mistake."},{"pid":"P21","code":"C01","source":"debrief","at":"0:32:58","led":0,"text":"So technically, with the way I've set up most of them, every drone basically was going through every base in a in a sequential manner. Always cope with at least one failure"},{"pid":"P21","code":"C01","source":"debrief","at":"0:33:25","led":0,"text":"I was adding the contingency plans from the start, which didn't require that intervention."},{"pid":"P21","code":"C05","source":"debrief","at":"0:29:37","led":0,"text":"No, it was a bit more mentally demanding, I think, because I was able to multitask better."},{"pid":"P21","code":"C07","source":"debrief","at":"0:34:27","led":0,"text":"I think I did well to some extent. I always had a spare fleet of drones without being excessive."},{"pid":"P21","code":"C12","source":"debrief","at":"0:35:03","led":0,"text":"I mean, it was giving me the wrong type of drones. It required only blue drones and kept giving me red and green ones."},{"pid":"P21","code":"C12","source":"debrief","at":"0:35:16","led":0,"text":"The aggressive ones seemed to be better, but I felt like it was wasting some of the some additional drones"},{"pid":"P21","code":"C13","source":"debrief","at":"0:30:18","led":0,"text":"So the way that the assistant was allocating them was, OK, go there, do the thing you have to do. But in case of something failed, there wasn't a backup drone coming around"},{"pid":"P21","code":"C13","source":"debrief","at":"0:37:35","led":0,"text":"It does a job. It doesn't have redundancy, but it's reliable. It doesn't account for that, but it is."},{"pid":"P21","code":"C22","source":"debrief","at":"0:29:55","led":0,"text":"Also, I also previously was my first attempt. So I'm not sure if it's completely dependent on the assistance, but I also optimized the way that they worked with the assistance as well"},{"pid":"P22","code":"C01","source":"debrief","at":"0:28:28","led":0,"text":"So the strategic tool, I think I generally approached it as it was a good suggestion, but I felt that I could find maybe some more optimal policies"},{"pid":"P22","code":"C01","source":"debrief","at":"0:29:22","led":0,"text":"So I felt comfortable assessing and then overriding the strategic assistant. With the tactical assistant, especially in the more complex tasks, I felt like I just kind of had to take its word for it"},{"pid":"P22","code":"C03","source":"debrief","at":"0:29:36","led":0,"text":"unless the task is extremely simple, where it's either all one type of drones and it's just assigned the nearest one"},{"pid":"P22","code":"C03","source":"debrief","at":"0:30:06","led":0,"text":"But in those ones, I felt like I can maybe maybe felt that, you know, fractions of a percent that I was slightly faster than the AI algorithm."},{"pid":"P22","code":"C07","source":"debrief","at":"0:28:57","led":0,"text":"But then also then that meant that you'd keep some more in reserve. So it wasn't just fully because it's cautious, it was also because it was actually to keep some in reserve for other tasks"},{"pid":"P22","code":"C08","source":"debrief","at":"0:28:57","led":0,"text":"I felt like sometimes I could find like a middle ground that had like maybe a little bit of gambling in there, essentially, that you wouldn't have the necessary coverage."},{"pid":"P22","code":"C08","source":"debrief","at":"0:29:22","led":0,"text":"So I felt that often I could find, I could strike a middle ground."},{"pid":"P22","code":"C14","source":"debrief","at":"0:29:36","led":0,"text":"I felt like I just kind of had to take its word for it because the task is so complex. And because it's real time and I have to make that instantaneous decision"},{"pid":"P22","code":"C14","source":"debrief","at":"0:30:06","led":0,"text":"as soon as it got to any sort of non-linear, difficult, high dimensional problem, I just took the AI's word for it, essentially, probably because I couldn't assess in the time"},{"pid":"P22","code":"C17","source":"debrief","at":"0:30:34","led":0,"text":"whereas in the strategic view, I felt like I could very quickly assess or do I need more drone coverage [\u2026] I can do that quite quickly because it's a shorter task, a simpler task"},{"pid":"P22","code":"C25","source":"debrief","at":"0:32:19","led":0,"text":"But having a human in the loop, then I guess there's still a person who's acting as an agent. They're making a final decision on the AI's assistance suggestions."},{"pid":"P24","code":"C01","source":"debrief","at":"0:25:48","led":0,"text":"I cannot just use all of the joints for one task. I want to save more. Yes. That's my next strategy."},{"pid":"P24","code":"C04","source":"debrief","at":"0:25:10","led":0,"text":"A little bit complicated, so I will use a lot of time to allocate and if I just use AI suggestions, that would be better and more effective to save the person, save the people."},{"pid":"P24","code":"C04","source":"debrief","at":"0:28:09","led":0,"text":"I think I just want to click that ASAP to save."},{"pid":"P24","code":"C05","source":"debrief","at":"0:28:09","led":1,"text":"because I noticed as well you were pressing it and then going over and dealing with strategic stuff. Was that part of the idea of the plan that you could have? Yes."},{"pid":"P24","code":"C07","source":"debrief","at":"0:25:48","led":0,"text":"Yeah, because I want to save some joints for the other task. I cannot just use all of the joints for one task. I want to save more."},{"pid":"P24","code":"C07","source":"debrief","at":"0:26:15","led":0,"text":"I'm not sure I'm better than the AI suggestion. I just want to use less joints to do more things."},{"pid":"P24","code":"C09","source":"debrief","at":"0:25:48","led":1,"text":"And the strategic agent, I noticed a lot of the time you were waiting for its suggestion and then changing it. Yes."},{"pid":"P24","code":"C14","source":"debrief","at":"0:27:40","led":0,"text":"Did you feel you had time to check the plan? No. I don't have time to hesitate. But did you trust it? Yeah. I just trusted it."},{"pid":"P24","code":"C14","source":"debrief","at":"0:28:09","led":0,"text":"Because even though it may have, may fail, but and actually, I have no doubt that it that moment I don't know the best choice or best suggestion. I think I just want to click that ASAP"},{"pid":"P24","code":"C25","source":"debrief","at":"0:30:12","led":0,"text":"I really trust AI, which is bad actually, but I still think there has to be like a human to make the final decision, to have like a rough check, something like that."},{"pid":"P25","code":"C11","source":"debrief","at":"0:23:39","led":0,"text":"I think it's very helpful in the second session it's more because the task is quite complicated than the previous one. The first one I don't have enough time"},{"pid":"P25","code":"C17","source":"debrief","at":"0:24:50","led":0,"text":"the second is because in the second task all the processes were really quick. I don't have enough time to evaluate each actions."},{"pid":"P25","code":"C25","source":"debrief","at":"0:26:29","led":0,"text":"I think that humans should supervise the AI systems."},{"pid":"P25","code":"C26","source":"debrief","at":"0:25:19","led":0,"text":"Each task I just click the buttons to finish the task but I'm not sure how the process if and of all the tasks I can get a summary of the process would be very good."},{"pid":"P25","code":"C26","source":"debrief","at":"0:26:03","led":0,"text":"Can we just audit them or we can just have more explainable for all AI systems? This is very important for us."},{"pid":"P25","code":"C26","source":"debrief","at":"0:26:29","led":0,"text":"But we should have more explainability of the AI system."},{"pid":"P26","code":"C01","source":"debrief","at":"0:28:37","led":0,"text":"Yeah, when I located, I think sometimes the AI will take a little longer. [\u2026] And in this tactical, sometimes it's very complicated. And I think, so at this time, I prefer to use the suggest, please."},{"pid":"P26","code":"C03","source":"debrief","at":"0:29:05","led":0,"text":"And in this tactical, sometimes it's very complicated. And I think, so at this time, I prefer to use the suggest, please."},{"pid":"P26","code":"C03","source":"debrief","at":"0:29:05","led":1,"text":"Would you say that you were doing some of the simpler tasks manually yourself on the tactical? Yeah, sometimes I will do it."},{"pid":"P26","code":"C04","source":"debrief","at":"0:29:34","led":0,"text":"Yeah, much faster."},{"pid":"P26","code":"C04","source":"debrief","at":"0:30:28","led":0,"text":"if you use human's knowledge to do it, it will take a longer time, much longer time. But in this situation, in some situations, the time is very limited. So the AI will give much quickly."},{"pid":"P26","code":"C06","source":"debrief","at":"0:28:37","led":0,"text":"Yeah, when I located, I think sometimes the AI will take a little longer. And I just mess up my strategy"},{"pid":"P26","code":"C16","source":"debrief","at":"0:29:34","led":0,"text":"I think with more successful when I use it, I will trust it more."},{"pid":"P26","code":"C16","source":"debrief","at":"0:30:01","led":0,"text":"The second one, I'm more confident with this."},{"pid":"P26","code":"C17","source":"debrief","at":"0:31:25","led":1,"text":"Did you ever find yourself just kind of accepting without really checking? Yeah, yeah, yeah. Sometimes it is."},{"pid":"P26","code":"C25","source":"debrief","at":"0:31:01","led":1,"text":"probably a human should still be involved. Is that what you think? That they would still... Yeah. You need to click the button."},{"pid":"P27","code":"C06","source":"debrief","at":"0:29:10","led":0,"text":"So, when we are trying to do with the tactical screen, I find the agent is quite slow."},{"pid":"P27","code":"C14","source":"debrief","at":"0:30:28","led":0,"text":"But for me, maybe I find the tactical agent is much, much useful. [\u2026] Because I think I don't want to just check in the details because it's quite emergent."},{"pid":"P27","code":"C28","source":"debrief","at":"0:26:26","led":0,"text":"So, I'd prefer to put the task which cannot be done for now to the end of the list."},{"pid":"P27","code":"C28","source":"debrief","at":"0:28:39","led":0,"text":"So, maybe there's only some task, some notification on the right top corner that no workable joins. So, maybe it can just highlight the abort button."},{"pid":"P28","code":"C01","source":"debrief","at":"0:28:05","led":0,"text":"So in most time, I'm trying to be more defensive in the strategy, so I'm trying to reserve more and more drones in the base"},{"pid":"P28","code":"C04","source":"debrief","at":"0:29:56","led":0,"text":"I think it's less reliable than before, but I still use its suggestion, and that's the case. Yeah, because at least it saves time."},{"pid":"P28","code":"C04","source":"debrief","at":"0:30:33","led":0,"text":"I know there is a better choice, but I have no time to tune everything."},{"pid":"P28","code":"C04","source":"debrief","at":"0:32:10","led":0,"text":"I think the key strength when I using the agent is it can help me to save the time and energy to those specific deployments"},{"pid":"P28","code":"C07","source":"debrief","at":"0:28:05","led":0,"text":"I'm trying to reserve more and more drones in the base, rather than send them out to finish the task quickly, because I cannot predict when the next task will appear."},{"pid":"P28","code":"C08","source":"debrief","at":"0:32:35","led":0,"text":"maybe we should have a more customized method to adding our own ideas in here"},{"pid":"P28","code":"C08","source":"debrief","at":"0:33:03","led":0,"text":"I think in most case it could only provide some fixed options it is still insufficient for some case"},{"pid":"P28","code":"C12","source":"debrief","at":"0:29:56","led":0,"text":"It's always trying to send out more drones than I expect, actually. So from my view, I actually expect to using fewer numbers of drones"},{"pid":"P28","code":"C18","source":"debrief","at":"0:33:33","led":0,"text":"Yes, I actually check every answer. Yeah, I have a look, a quick browse to have a quick idea about what happens in here"},{"pid":"P28","code":"C19","source":"debrief","at":"0:28:54","led":0,"text":"So if I only send out one drone for one specific color, and it fails, then I have to abort that mission, and I only abort one of them"},{"pid":"P28","code":"C21","source":"debrief","at":"0:28:54","led":0,"text":"So if I only send out one drone for one specific color, and it fails, then I have to abort that mission, and I only abort one of them"},{"pid":"P28","code":"C25","source":"debrief","at":"0:34:08","led":0,"text":"In most times, we cannot guarantee what type of answers it will provide to us, so, yeah, humans should make that decision."},{"pid":"P29","code":"C01","source":"debrief","at":"0:23:59","led":0,"text":"I just thought it was, like, I thought sometimes the AI would take kind of a long time to generate, uh, an answer, which was good on more complicated, uh, like, missions"},{"pid":"P29","code":"C03","source":"debrief","at":"0:24:29","led":0,"text":"But when it was just one color, I could just kind of count how many is necessary and then add, like, one extra more. Mm-hmm. And that was usually enough. So, it was fast for me to just click manual"},{"pid":"P29","code":"C03","source":"debrief","at":"0:24:54","led":0,"text":"I did feel like some of them I should do myself and I trusted it more with the complicated tasks"},{"pid":"P29","code":"C06","source":"debrief","at":"0:23:59","led":0,"text":"I thought sometimes the AI would take kind of a long time to generate, uh, an answer, which was good on more complicated, uh, like, missions"},{"pid":"P29","code":"C10","source":"debrief","at":"0:25:15","led":0,"text":"I'm not really sure why I decided to do the simple ones myself. I guess I just felt like I sh, I should see if it's better."},{"pid":"P29","code":"C10","source":"debrief","at":"0:25:59","led":0,"text":"I did kind of want to test it more at the beginning, like comparing it, like doing a few manual ones myself to see, like, whether, yeah, whether it would be better, faster."},{"pid":"P29","code":"C12","source":"debrief","at":"0:28:40","led":0,"text":"I think sometimes it was, it would send more than I would have"},{"pid":"P29","code":"C17","source":"debrief","at":"0:28:13","led":1,"text":"Yeah, I suppose that's true. Like I can't say I was completely checking everything I did."},{"pid":"P29","code":"C19","source":"debrief","at":"0:26:26","led":0,"text":"but I noticed that the ones that failed were normally cause I'd just done a manual one. So I guess that made me want to use the AI more often."},{"pid":"P29","code":"C19","source":"debrief","at":"0:28:40","led":0,"text":"but then you kind of saw that that was a good thing because when I sent it myself, it would sometimes have to abort."},{"pid":"P29","code":"C21","source":"debrief","at":"0:28:40","led":0,"text":"but then you kind of saw that that was a good thing because when I sent it myself, it would sometimes have to abort."},{"pid":"P29","code":"C23","source":"debrief","at":"0:24:54","led":0,"text":"trying to do it manually was one of, like, most of the things that , like, one of my faults, because I think I was quite slow"},{"pid":"P29","code":"C23","source":"debrief","at":"0:28:13","led":0,"text":"And even if like maybe human would do it better in some occasions, like overall, I think it's, it's better."},{"pid":"P30","code":"C01","source":"debrief","at":"0:23:25","led":0,"text":"yeah exactly roughly you should look how many which ones you need how many you need and then you see how many are being deployed and then you work from that really"},{"pid":"P30","code":"C04","source":"debrief","at":"0:25:40","led":0,"text":"yeah yeah i think so yeah especially with here like it was so quick i just need to click suggest"},{"pid":"P30","code":"C05","source":"debrief","at":"0:22:01","led":1,"text":"this is about freeing up your mind more than anything else i think so yeah"},{"pid":"P30","code":"C05","source":"debrief","at":"0:25:40","led":0,"text":"i just need to click suggest and why i can focus on this and it just suggests and i trust it"},{"pid":"P30","code":"C07","source":"debrief","at":"0:22:55","led":0,"text":"but i just think looking forward i do need to save a bit just in case there's some sort of like um there's some sort of buffer that you need just in case something happens"},{"pid":"P30","code":"C10","source":"debrief","at":"0:23:25","led":0,"text":"yeah exactly roughly you should look how many which ones you need how many you need and then you see how many are being deployed and then you work from that really"},{"pid":"P30","code":"C22","source":"debrief","at":"0:23:52","led":0,"text":"i think it was easier because i had to i sort of got into the rhythm of having to anticipate other problems"},{"pid":"P30","code":"C25","source":"debrief","at":"0:22:29","led":0,"text":"because i think it needs a bit more of a human element [\u2026] so you kind of have to have that human element where you're like i need to anticipate things"},{"pid":"P30","code":"C28","source":"debrief","at":"0:21:34","led":0,"text":"but i think that could be a case of if something fails and there is spares you put the spares towards it it'll take longer but that's what you should do i think that's what should happen"},{"pid":"P30","code":"C28","source":"debrief","at":"0:24:38","led":0,"text":"if something fails then you can sort of like essentially optimize the other ones to sort of take over that sort of work the workload that one of the failed drones has"},{"pid":"P31","code":"C04","source":"debrief","at":"0:29:10","led":0,"text":"The top advantage in this situation was the speed of response."},{"pid":"P31","code":"C09","source":"debrief","at":"0:32:19","led":0,"text":"even if it was, like, recommending something and then I was tweaking it afterwards, I was tweaking it, like, knowing that that recommendation was a pretty decent starting place."},{"pid":"P31","code":"C13","source":"debrief","at":"0:32:47","led":0,"text":"you'd have it on the opposite side of the circle. The ordering of the tasks didn't seem logical."},{"pid":"P31","code":"C13","source":"debrief","at":"0:33:14","led":0,"text":"they were picking tasks, like, left to right [\u2026] whereas they could have been doing, like, a, you know, Dijkstra's or something, get the lowest possible fly time between them."},{"pid":"P31","code":"C17","source":"debrief","at":"0:31:42","led":0,"text":"in the very beginning, doing too much checking and feeling the negative impacts of that, and by the end, possibly doing not enough checking for the point optimization, it was all about, like, finding a balance between them."},{"pid":"P31","code":"C23","source":"debrief","at":"0:29:10","led":0,"text":"if you were to challenge yourself to play through this game and not use any of the automation systems, you'd get massively overwhelmed [\u2026] and you'd just rack up a lot more negative points."},{"pid":"P31","code":"C27","source":"debrief","at":"0:30:07","led":0,"text":"Then again, was the nudging that I was doing improving things or making them worse? I have no feedback on that, so I don't actually know."},{"pid":"P31","code":"C28","source":"debrief","at":"0:26:37","led":0,"text":"that sort of problem of optimizing a path of a given number of drones could be done better with an automated system."},{"pid":"P31","code":"C28","source":"debrief","at":"0:26:53","led":0,"text":"I think that like there's a larger opportunity for automation where the human does not need to be, not necessarily not involved, but not making the decisions"},{"pid":"P32","code":"C01","source":"debrief","at":"0:23:52","led":0,"text":"So I guess it was very much comparing them to what I do. And then letting the tactical one get on with it."},{"pid":"P32","code":"C04","source":"debrief","at":"0:24:41","led":0,"text":"So I think I had some missions that I hadn't done the first time. So I was using it more because it was quicker."},{"pid":"P32","code":"C10","source":"debrief","at":"0:23:52","led":0,"text":"By, I guess, comparing them to what I would have done."},{"pid":"P32","code":"C10","source":"debrief","at":"0:23:52","led":0,"text":"So I guess it was very much comparing them to what I do. And then letting the tactical one get on with it."},{"pid":"P32","code":"C11","source":"debrief","at":"0:24:41","led":0,"text":"So I think I had some missions that I hadn't done the first time. So I was using it more because it was quicker."},{"pid":"P32","code":"C11","source":"debrief","at":"0:25:18","led":0,"text":"Yes. Very much about workload."},{"pid":"P32","code":"C16","source":"debrief","at":"0:23:52","led":0,"text":"So the tactical one seemed to be doing what I was doing. So quite reliably. And obviously the strategic one wasn't."},{"pid":"P32","code":"C17","source":"debrief","at":"0:24:57","led":0,"text":"Whereas I felt, certainly in the second one where I didn't, where I was well on top of it, that I had more time to be checking in more detail."},{"pid":"P32","code"
