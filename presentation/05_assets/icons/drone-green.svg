<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- arms -->
  <line x1="32" y1="28" x2="11" y2="10" stroke="#3ec97c" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="53" y2="10" stroke="#3ec97c" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="11" y2="46" stroke="#3ec97c" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="53" y2="46" stroke="#3ec97c" stroke-width="2" stroke-linecap="round"/>
  <!-- rotors -->
  <ellipse cx="11" cy="9" rx="11" ry="4" fill="none" stroke="#3ec97c" stroke-width="1.5"/>
  <ellipse cx="53" cy="9" rx="11" ry="4" fill="none" stroke="#3ec97c" stroke-width="1.5"/>
  <ellipse cx="11" cy="47" rx="11" ry="4" fill="none" stroke="#3ec97c" stroke-width="1.5"/>
  <ellipse cx="53" cy="47" rx="11" ry="4" fill="none" stroke="#3ec97c" stroke-width="1.5"/>
  <!-- body -->
  <rect x="22" y="20" width="20" height="16" rx="3" fill="#3ec97c" stroke="#1f9954" stroke-width="1"/>
  <!-- gimbal arm -->
  <line x1="32" y1="36" x2="32" y2="44" stroke="#1f9954" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="44" x2="37" y2="44" stroke="#1f9954" stroke-width="1.5" stroke-linecap="round"/>
  <!-- thermal camera dome -->
  <ellipse cx="32" cy="52" rx="8" ry="6" fill="#0e2e1c" stroke="#3ec97c" stroke-width="1.5"/>
  <ellipse cx="32" cy="52" rx="5" ry="3.5" fill="none" stroke="#3ec97c" stroke-width="1" opacity="0.8"/>
  <circle cx="32" cy="52" r="2" fill="#3ec97c" opacity="0.7"/>
</svg>
